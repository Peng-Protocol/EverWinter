<!--
  Breakout Plugin for PseudoChaser and PseudoWinter (unified)
  Volume breakouts, with no scoring, no forecasting and no simulation.

  Each batch picks random tickers (up to Max Cond. Orders; one slot per ticker) and reads the last twenty-four closed 1hr candles of each. For TP / SL the candles are split by colour: the green candles (close above open) give the
  average TOP move, the mean of (high - open) / open, in %; the red candles (close below open) give the average BOTTOM move, the mean of (open - low) / open, in %. Doji candles count
  for neither; a ticker with no green or no red candle among the 24 is skipped.

  Each ticker gets a volume watch on one edge of its own 24h hourly turnover range (USDT), top or bottom, picked by a coin flip (Both off), or on both edges (Both on). Every Volume poll (default 60s) the watch reads the forming 1hr candle's turnover against the last 24 closed candles'. A top break is the forming candle's turnover above the highest of the 24 (can fire mid-candle); a bottom break is a candle closing with turnover below the lowest of the 24 (only after the close).
  Both off: the watch's own edge breaking opens a position at market on the bot's side; the opposite edge breaking first cancels the watch. Every break counts. TP / SL come from the average moves, measured from the entry on the bot's own side (Chaser: TP = top move above, SL = bottom move below; Winter: TP = bottom move below, SL = top move above). Nothing about the ticker is predicted.

  Every position is stamped as a Double or a Revert of the last break, the turnover extreme (24h high or low) that printed most recently. Double = the same edge as the last break (Double Top is bullish, Double Bottom bearish);
  Revert = the other edge (Revert Top: the last break was the bottom, now the top broke). The stamp is a label only; it picks nothing.

  Both (optional): the watch covers BOTH edges, and whichever breaks first is the break. The bot enters on either edge, whatever the last 15min candles did (there is no candle preference any more).
  The partner bot only enters if it is watching that ticker too. Off: one edge per ticker, picked by a coin flip.

  Whipsaw (optional, a button under Both, needs it on): the entry is no longer at market. After the volume break a cond. limit order is created AGAINST the bot, at the 24h peak close or bottom close: the close of every one of the 24 closed 1hr candles
  is read, and the highest and the lowest are the two levels (not the average moves). Chaser (long) a cond. BELOW, at the lowest close; Winter (short) a cond. ABOVE, at the highest close. The premise is that price whipsaws:
  it dips or pumps to the extreme, fills the cond., then reverts. TP / SL still come from the average moves, now measured from the cond.'s fill price. The cond. is cancelled if price runs to the OTHER close extreme first
  (Chaser: up to the highest close; Winter: down to the lowest), because then no whipsaw came, and it is cancelled after Order life. A level whose close extreme is not on its side of price (price already at or beyond it) falls back to the average move for that level.
  Whipsaw orders take the host's Max Cond. Orders slots, and are tagged 'whipsaw'.

  Continuation (optional, a button under Both, needs it on; the mirror of Whipsaw): the same cond. logic, but at the 24h close extreme WITH the bot: Chaser a cond. ABOVE, at the highest close; Winter a cond. BELOW, at the lowest close.
  The premise is that the break keeps running and the cond. buys / sells the continuation. TP / SL are the average moves from the fill. The cond. is cancelled if price runs to the OTHER close extreme first
  (Chaser: the lowest close; Winter: the highest), because the break then failed, and after Order life. Tagged 'continuation', same slots as Whipsaw.
  Selection (Both on): one button selected places that cond. on every break. BOTH selected places both, as one cond. bundle (a single slot, the first to fill cancels the other, tagged 'whipsaw + continuation').
  NEITHER selected picks Whipsaw or Continuation at random on each break. Only turning Both off enters at market.

  Funding filter (High Fund / Low Fund buttons, both on by default; both off = off): a target selection by funding rate. At the break the ticker's current funding rate (%) is read. High Fund lets it through only when funding is at or above
  the high limit (default +0.05), Low Fund only when it is at or below the low limit (default -0.05); with both on, either passes, so only extreme funding gets in. The limits are set in the Funding tooltip. A skipped break places no
  Whipsaw / Continuation cond., or with neither selected no market entry (the break still counts). Each watch card shows a small dot for the funding right now: green = at or above the High Fund limit, red = at or below the Low Fund limit (each only while its button is on), none in between.
  The funding behind the dots and the check is refreshed once per Volume poll (one bulk ticker read for all watched tickers) while the filter is on, instead of waiting for the host's Ticker Cooldown.

  Cull (optional toggle under Funding, off by default, needs the funding filter on): a watch that has stood for more than an hour and whose funding is not at a preferred threshold (at or above the High Fund limit, or at or below the Low Fund limit,
  each only while its button is on) is discarded on the Volume poll, freeing its slot for the next batch. Younger watches, and watches whose funding is unknown, are kept.

  Watched tickers (Max watches): how many tickers are watched at once. Volume poll (s): how often each watch reads its kline.

  Break counter (readout only): every volume break, top or bottom, is kept for the Break window (default 24h) and shown in the LIVE readout. It stops nothing: watches are placed whatever the counts. Expired watches are not breaks.

  Max positions: once open positions reach the host's Max Positions, every watch is cancelled and no new ones are placed. They resume when a slot frees. Each watch shows as a card in the accordion.

  Two fixed filters run before every watch (no toggles):
    Stablecoin   — the 24 candles' full span (lowest low to highest high) must be at least 1%, else the ticker is a stablecoin.
    Illiquidity  — the last 3 trades are fetched; if they average more than 12s apart the ticker is illiquid.
  A ticker failing either is graylisted for a week. A ticker confirmed liquid is whitelisted for a week and skips the trade fetch.

  Watches, and pending Whipsaw conds, expire after Order Life (default 1440 min) and are simply cancelled.
  TP / SL are set at entry only in Binary Mode, so Binary Mode must be on (the plugin places nothing otherwise).
  Needs no other plugin. The side is read from the host at load.

  Load via Plugin Manager in either bot's config panel, AFTER SunChaser / EverWinter if live.
  targetBot: both
-->
<script>
(function () {
  'use strict';

  const VERSION = '1.28.0'; // Change: Cull toggle under Funding (drops watches older than an hour without a preferred funding); every tooltip cut to one sentence | previous: 1.27.0 — Whipsaw / Continuation selection
  let   WINTER  = false;   // set in transform() from the host
  const CANDLES = 24;      // closed 1hr candles the top / bottom moves are read from
  const HOUR_MS = 3600000;
  const VOL_POLL_S  = 60;          // default Volume poll, s: each watch reads its kline this often
  const POLL_MIN_S  = 5;           // least Volume poll, s
  const WATCH_MAX   = 100;         // most tickers watched at once (the host's Max Cond. Orders slider tops out at the same)
  const BO_NAME = e => (e === 'top' ? 'Top' : 'Bottom');
  // Type of an entry on edge e after a last break: Double (same edge) or Revert (the other edge).
  const BO_TYPE = (last, e) => (last === e ? 'Double ' : 'Revert ') + BO_NAME(e);
  const MIN_SPAN_PCT = 1;          // stablecoin filter: least % span the 24 candles must cover
  const MAX_GAP_MS   = 12000;      // illiquidity filter: most average ms between the last 3 trades
  const GRAY_MS      = 7 * 86400000; // graylist time for a ticker that fails either filter

  const BO_DEFAULT_CFG = Object.freeze({
    boEnabled: true,   // Breakout mode
    boBoth: false,     // Both: watch both edges, enter on whichever breaks (off = one edge, a coin flip)
    boCont: false,     // Continuation button (needs Both): cond. limit at the 24h close extreme WITH the bot. Both buttons on = both conds as one bundle; both off = one of the two at random per break
    boWhip: false,     // Whipsaw button (needs Both): cond. limit at the 24h close extreme AGAINST the bot
    boFundHigh: true,  // High Fund: a break only goes ahead when the ticker's funding rate is at or above boFundHi (both off = filter off)
    boFundLow: true,   // Low Fund: a break only goes ahead when the ticker's funding rate is at or below boFundLo (both on = either one passes)
    boFundCull: false, // Cull: discard watches older than an hour whose funding is not at a preferred threshold (needs the funding filter on)
    boFundHi: 0.05,    // High Fund limit, % (funding must be at or above this)
    boFundLo: -0.05,   // Low Fund limit, % (funding must be at or below this)
    boMaxWatch: 30,    // Max watches: how many tickers are watched at once (1-100)
    boPollSec: VOL_POLL_S, // Volume poll, s: how often each watch reads its kline
    boLifeMins: 1440,  // how long a volume watch waits before it is cancelled
    boWinH: 24,        // break window, hours: breaks older than this stop counting
    boBreaks: [],      // [ms, 'T' | 'B'] volume breaks (top / bottom) inside the window
    boWatch: {},       // symbol -> volume watch { t, edge, chk, next, ... }
    boWhite: {},       // symbol -> epoch ms it was confirmed liquid; skips the trade fetch for a week
    boGray: {},        // symbol -> epoch ms it was graylisted (stablecoin / illiquid), kept a week
  });

  window.__BotPlugin = {
    id:        'breakout',
    name:      'Breakout',
    version:   VERSION,
    targetBot: 'both',
    after:     ['sunchaser', 'everwinter'],
    before:    [],
    conflicts: [],
    requires:  [],
    touches:   ['init', 'runScan', 'pseudoWatchCondOrders', '_condTrigger', '_ewCondFilled', '_scCondFilled'],
    css: `
      :root { --bo-rgb:255,200,60; --bo-acc:#ffc83c; }
      .bo-hint { font-size:9px; color:var(--text-lo); margin-top:3px; line-height:1.5; }
      .bo-g { color:#3ddc84; } .bo-r { color:#ff5a5f; }
      .bo-info { display:inline-flex; align-items:center; justify-content:center; width:12px; height:12px; margin-left:6px; padding:0; border-radius:50%; border:1px solid rgba(var(--bo-rgb),.35); background:transparent; color:var(--bo-acc); font:700 8px/1 var(--mono); cursor:pointer; flex:none; vertical-align:middle; }
      .bo-info.on { background:rgba(var(--bo-rgb),.15); }
      .bo-live { position:relative; margin-top:8px; padding:3px 8px; border:1px solid rgba(var(--bo-rgb),.28); border-left:3px solid var(--bo-acc); border-radius:4px; background:rgba(var(--bo-rgb),.05); font-family:var(--mono); font-size:10px; color:var(--text-hi); }
      .bo-lr { position:relative; display:flex; align-items:center; gap:7px; padding:4px 0; cursor:help; }
      .bo-ttl { font-weight:700; letter-spacing:2px; color:var(--bo-acc); }
      .bo-cnt { color:var(--text-lo); } .bo-cnt b { margin-left:2px; color:var(--text-hi); } .bo-cnt.lead b { color:var(--bo-acc); }
      .bo-blink { color:var(--warn); animation:bo-blink 1.6s infinite; }
      @keyframes bo-blink { 50% { opacity:.4; } }
      .bo-pop { position:absolute; left:0; right:0; top:100%; z-index:20; margin-top:2px; padding:5px 7px; font-size:9px; font-weight:400; letter-spacing:0; line-height:1.5; color:var(--text-mid); background:var(--bg-panel,#15110c); border:1px solid rgba(var(--bo-rgb),.35); border-radius:3px; box-shadow:0 4px 12px rgba(0,0,0,.5); }
      .bo-sw { display:flex; align-items:center; gap:4px; margin-top:4px; font-size:9px; color:var(--text-lo); } .bo-sw span { width:80px; }
      .bo-sw button { font:700 9px var(--mono); padding:2px 8px; border-radius:3px; border:1px solid rgba(var(--bo-rgb),.35); background:transparent; color:var(--text-lo); cursor:pointer; } .bo-sw button.on { background:rgba(var(--bo-rgb),.15); color:var(--bo-acc); }
      .bo-in:disabled, .bo-sw button:disabled { opacity:.4; cursor:not-allowed; }
      .bo-fd { display:inline-block; flex:none; width:5px; height:5px; margin-left:5px; border-radius:50%; opacity:.7; } .bo-fd.hi { background:#3ddc84; } .bo-fd.lo { background:#ff5a5f; }
      .bo-in { width:60px; font-family:var(--mono); font-size:10px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.12); border-radius:3px; color:var(--text-hi); padding:2px 5px; }
    `,

    slots: {
      'mode-label-extra': `<span x-show="cfg.boEnabled"> + Breakout</span>`,
      'strategy-accordions': `
        <div x-data="{ open: false }">
          <button class="cfg-acc-hd" @click="open=!open" :class="open?'open':''">
            <div style="display:flex;align-items:center;gap:7px">
              <span><span x-text="_boGlyph()"></span> Breakout</span>
              <span x-show="cfg.boEnabled" style="font-size:8px;padding:1px 5px;background:rgba(var(--bo-rgb),.15);border:1px solid rgba(var(--bo-rgb),.35);border-radius:2px;color:var(--bo-acc);letter-spacing:1px">ON</span>
              <span x-show="!cfg.boEnabled" style="font-size:8px;padding:1px 5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:2px;color:var(--text-lo);letter-spacing:1px">OFF</span>
            </div>
            <span class="cfg-acc-arrow" :class="open?'open':''">▶</span>
          </button>
          <div x-show="open" x-transition.opacity class="cfg-acc-body">
            <label class="tog">
              <div class="tog-t" :class="cfg.boEnabled?'on':''" @click.prevent="if(!cfgLocked){cfg.boEnabled=!cfg.boEnabled;persist()}"><div class="tog-k"></div></div>
              <div x-data="{ tip: false }">
                <div class="tog-l">Breakout Mode<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                <div class="bo-hint" x-show="tip">Watches each ticker's 24h hourly turnover for a top or bottom break and enters on it, with TP / SL from the average green / red candle moves.</div>
              </div>
            </label>
            <div x-show="cfg.boEnabled" style="margin-top:8px">
              <div x-data="{ tip: false }">
                <label class="tog">
                  <div class="tog-t" :class="cfg.boBoth?'on':''" @click.prevent="if(!cfgLocked){cfg.boBoth=!cfg.boBoth;persist()}"><div class="tog-k"></div></div>
                  <div>
                    <div class="tog-l">Both<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                  </div>
                </label>
                <div class="bo-hint" x-show="tip">Off watches one random edge per ticker; on watches both edges and enters on whichever breaks first (Whipsaw and Continuation need it on).</div>
              </div>
              <div x-data="{ tip: false }" style="margin:6px 0 0 18px">
                <div class="bo-sw" style="margin-top:0">
                  <span style="width:auto">On break</span>
                  <button type="button" :class="cfg.boWhip?'on':''" :disabled="cfgLocked||!cfg.boBoth" @click="if(!cfgLocked&&cfg.boBoth){cfg.boWhip=!cfg.boWhip;persist()}">Whipsaw</button>
                  <button type="button" :class="cfg.boCont?'on':''" :disabled="cfgLocked||!cfg.boBoth" @click="if(!cfgLocked&&cfg.boBoth){cfg.boCont=!cfg.boCont;persist()}">Continuation</button>
                  <button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button>
                </div>
                <div class="bo-hint" x-show="tip">Replaces the market entry with a cond. limit at a 24h close extreme: Whipsaw against the bot, Continuation with it, both as one bundle, or neither for a random pick per break (needs Both on).</div>
              </div>
              <div x-data="{ tip: false }" style="margin-top:8px">
                <div class="bo-sw" style="margin-top:0">
                  <span style="width:auto">Funding</span>
                  <button type="button" :class="cfg.boFundHigh?'on':''" :disabled="cfgLocked" @click="if(!cfgLocked){cfg.boFundHigh=!cfg.boFundHigh;persist()}">High Fund</button>
                  <button type="button" :class="cfg.boFundLow?'on':''" :disabled="cfgLocked" @click="if(!cfgLocked){cfg.boFundLow=!cfg.boFundLow;persist()}">Low Fund</button>
                  <button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button>
                </div>
                <div class="bo-hint" x-show="tip">
                  High Fund passes funding at or above the high limit, Low Fund at or below the low limit (both on = either, both off = no filter), and the card dots show which a ticker meets.
                  <div style="display:flex;align-items:center;gap:6px;margin-top:5px">
                    <span>High: at least</span>
                    <input type="number" step="0.01" class="bo-in" x-model.number="cfg.boFundHi" :disabled="cfgLocked" @change="cfg.boFundHi=Math.abs(+cfg.boFundHi||0.05);persist()">
                    <span>% · Low: at most</span>
                    <input type="number" step="0.01" class="bo-in" x-model.number="cfg.boFundLo" :disabled="cfgLocked" @change="cfg.boFundLo=-Math.abs(+cfg.boFundLo||0.05);persist()">
                    <span>%</span>
                  </div>
                </div>
              </div>
              <div x-data="{ tip: false }" style="margin:6px 0 0 18px">
                <label class="tog" :style="!_boFundOn() ? 'opacity:.4' : ''">
                  <div class="tog-t" :class="cfg.boFundCull?'on':''" @click.prevent="if(!cfgLocked&&_boFundOn()){cfg.boFundCull=!cfg.boFundCull;persist()}"><div class="tog-k"></div></div>
                  <div>
                    <div class="tog-l">Cull<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                  </div>
                </label>
                <div class="bo-hint" x-show="tip">Discards watches older than an hour whose funding is not at the High or Low limit (needs a Funding button on).</div>
              </div>
              <div x-data="{ tip: false }" style="margin-top:8px">
                <div style="display:flex;align-items:center;gap:6px">
                  <span class="lbl" style="margin:0">Max watches</span>
                  <input type="number" min="1" :max="100" step="1" class="bo-in" x-model.number="cfg.boMaxWatch" :disabled="cfgLocked" @change="cfg.boMaxWatch=Math.max(1,Math.min(100,Math.round(+cfg.boMaxWatch||30)));persist()">
                  <button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button>
                </div>
                <div class="bo-hint" x-show="tip">How many tickers are watched at once, independent of Max Cond. Orders and Max Positions.</div>
              </div>
              <div x-data="{ tip: false }" style="margin-top:6px">
                <div style="display:flex;align-items:center;gap:6px">
                  <span class="lbl" style="margin:0">Volume poll (s)</span>
                  <input type="number" min="5" step="1" class="bo-in" x-model.number="cfg.boPollSec" :disabled="cfgLocked" @change="cfg.boPollSec=Math.max(5,Math.round(+cfg.boPollSec||60));persist()">
                  <button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button>
                </div>
                <div class="bo-hint" x-show="tip">How often each watch reads its 1hr kline for a volume break, at one request per watch per interval.</div>
              </div>
              <div x-data="{ tip: false }" style="margin-top:8px">
                <div style="display:flex;align-items:center;gap:6px">
                  <span class="lbl" style="margin:0">Order life (min)</span>
                  <input type="number" min="1" step="1" class="bo-in" x-model.number="cfg.boLifeMins" :disabled="cfgLocked" @change="cfg.boLifeMins=Math.max(1,Math.round(+cfg.boLifeMins||1440));persist()">
                  <button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button>
                </div>
                <div class="bo-hint" x-show="tip">Unbroken watches and pending Whipsaw / Continuation conds. are cancelled after this many minutes.</div>
              </div>
              <div x-data="{ tip: false }" style="margin-top:6px">
                <div style="display:flex;align-items:center;gap:6px">
                  <span class="lbl" style="margin:0">Break window (h)</span>
                  <input type="number" min="0.5" step="0.5" class="bo-in" x-model.number="cfg.boWinH" :disabled="cfgLocked" @change="cfg.boWinH=Math.max(0.5,+cfg.boWinH||24);persist()">
                  <button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button>
                </div>
                <div class="bo-hint" x-show="tip">Volume breaks are counted over this window in the LIVE readout, for information only.</div>
              </div>
              <div class="bo-live">
                <div class="bo-lr" x-data="{ tip: false }" @pointerenter="if ($event.pointerType === 'mouse') tip = true" @pointerleave="if ($event.pointerType === 'mouse') tip = false" @click="if (($event.pointerType || 'touch') !== 'mouse') tip = !tip">
                  <span class="bo-ttl"><span x-text="_boGlyph()"></span> LIVE</span>
                  <span class="bo-blink" x-show="!cfg.binaryModeEnabled">&#9888;</span>
                  <span><b x-text="_boPend()"></b><span style="color:var(--text-lo)">/<span x-text="cfg.boMaxWatch ?? 30"></span></span></span>
                  <span class="bo-cnt" x-show="_boMode()" title="Pending Whipsaw / Continuation cond. orders" ><span x-text="{ whip: 'WHIP', cont: 'CONT', both: 'W+C', rand: 'RND' }[_boMode()]"></span><b x-text="_boWhipN()"></b></span>
                  <span class="bo-cnt bo-g">&#9650;<b x-text="_boTally(tick).top"></b></span>
                  <span class="bo-cnt bo-r">&#9660;<b x-text="_boTally(tick).bottom"></b></span>
                  <div class="bo-pop" x-show="tip" x-text="_boTip(tick)"></div>
                </div>
              </div>
              <div x-show="_boWatchRows(tick).length" style="margin-top:6px">
                <template x-for="s in _boWatchRows(tick)" :key="s.sym">
                  <div class="cnd-card" style="border-left-color:var(--bo-acc)">
                    <div class="cnd-head">
                      <span class="pos-sym" x-text="s.sym"></span><span class="bo-fd" x-show="s.fd" :class="s.fd" :title="s.fdt"></span>
                      <span class="side-badge" x-text="_boSide()"></span>
                      <span class="cnd-meta" x-show="s.tags" x-text="s.tags" style="margin-left:0;color:var(--bo-acc)"></span>
                      <span class="cnd-meta" x-text="fmtAge(s.t, tick)"></span>
                    </div>
                    <div class="cnd-row">
                      <span class="cnd-l" x-text="s.label"></span>
                      <span class="cnd-p" x-text="s.p"></span>
                      <span class="cnd-bar"><i class="t" :style="'width:'+s.fill+'%'"></i></span>
                      <span class="cnd-d" x-text="s.dist"></span>
                    </div>
                    <div class="cnd-row">
                      <span class="cnd-l" x-text="s.wl"></span>
                      <span class="cnd-p" x-text="s.wp"></span>
                      <span class="cnd-bar"><i class="w" :style="'width:'+s.wfill+'%'"></i></span>
                      <span class="cnd-d" x-text="s.wdist"></span>
                    </div>
                  </div>
                </template>
              </div>
              <div x-data="{ tip: false }">
                <div class="bo-hint">🪙 Stablecoin filter · always on<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                <div class="bo-hint" x-show="tip">The 24 candles must span at least 1% from lowest low to highest high, else the ticker is skipped and graylisted for a week.</div>
              </div>
              <div x-data="{ tip: false }">
                <div class="bo-hint">💧 Illiquidity filter · always on<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                <div class="bo-hint" x-show="tip">Tickers whose last 3 trades average more than 12s apart are skipped and graylisted for a week, and ones that pass skip the check for a week.</div>
              </div>
            </div>
          </div>
        </div>
      `,
    },

    transform(def) {
      const _hasShort = typeof def.pseudoOpenShort === 'function', _hasLong = typeof def.pseudoOpenLong === 'function';
      WINTER = _hasShort && !_hasLong;
      try {
        const rs = document.documentElement.style;
        rs.setProperty('--bo-rgb', WINTER ? '96,210,255' : '255,200,60');
        rs.setProperty('--bo-acc', WINTER ? 'var(--ice)' : '#ffc83c');
      } catch (_) {}

      const _origInit    = def.init;
      const _origScan    = def.runScan;
      const _origWatch   = def.pseudoWatchCondOrders;

          if (mode === 'rand') mode = Math.random() < 0.5 ? 'whip' : 'cont'; // neither button: Whipsaw or Continuation, picked per break
          if (mode) return this._boWhipPlace(sym, edge, price, mv, cand, mode, this._boCloseRange(rd.closed.slice(0, CANDLES)));
          this.log(`[BO] ${this._boGlyph()} ${sym}: volume ${BO_NAME(edge).toLowerCase()} break — opening, TP ${tpRoi}% / SL ${slRoi}% ROI`, 'info');
          const pos = await (WINTER ? this.pseudoOpenShort : this.pseudoOpenLong).call(this, cand);
          if (!pos) this.log(`[BO] ${sym}: entry did not open after the volume break`, 'warn');
        },

        // Whipsaw: the cond. sits at a 24h close extreme AGAINST the bot. Chaser (long): target at the lowest close of the 24 candles, worst at the highest close (the other extreme).
        // Winter (short): target at the highest close, worst at the lowest close.
        // Continuation (leg 'cont'), the mirror: the extreme WITH the bot. Chaser: target at the highest close, worst at the lowest. Winter: target at the lowest close, worst at the highest.
        // mode 'both' places the two as ONE cond. bundle on the ticker (host bundle 'bo-wc': one slot, the first fill cancels the other); each leg keeps its own target and worst.
        // The levels are the closes of the candles; when price is already at or beyond a close extreme, that level uses the average move instead. The host fills the cond. like any other (pseudoOpenLong / pseudoOpenShort at the target), carrying the candidate's TP / SL ROI,
        // which are still the average moves, measured from the fill. The worst level cancels the order: price ran to the other extreme first (Whipsaw: no dip / pump; Continuation: the break failed).
        async _boWhipPlace(sym, edge, price, mv, cand, mode = 'whip', cr = null) {
          const legs = mode === 'both' ? ['whip', 'cont'] : [mode], bundle = mode === 'both' ? 'bo-wc' : null;
          const brk = `volume ${BO_NAME(edge).toLowerCase()} break`, fp = x => +x.toPrecision(6);
          if (!cr) { this.log(`[BO] ${sym}: ${brk} but the ${bundle ? 'whipsaw + continuation bundle' : (mode === 'cont' ? 'continuation' : 'whipsaw') + ' cond.'} was not placed — closes unreadable`, 'warn'); return; }
          let placed = 0;
          for (const leg of legs) {
            const cont = leg === 'cont', name = cont ? 'continuation' : 'whipsaw';
            const up = cont ? !WINTER : WINTER; // does the target sit above the price? Whipsaw: Winter yes, Chaser no. Continuation: the reverse.
            // Each level is the close extreme when that extreme sits on its side of price; otherwise (price already at or beyond it) the average move from the price stands in for that level.
            const tClose = up ? cr.hi > price : cr.lo < price, wClose = up ? cr.lo < price : cr.hi > price;
            const tAvg = up ? mv.top : mv.bottom, wAvg = up ? mv.bottom : mv.top;
            const target = tClose ? (up ? cr.hi : cr.lo) : (up ? price * (1 + tAvg / 100) : price * (1 - tAvg / 100));
            const worst  = wClose ? (up ? cr.lo : cr.hi) : (up ? price * (1 - wAvg / 100) : price * (1 + wAvg / 100));
            const tPct = Math.abs(target - price) / price * 100, wPct = Math.abs(worst - price) / price * 100;
            const tSrc = tClose ? `24h ${up ? 'peak' : 'bottom'} close` : 'average move, price outside the close range', wSrc = wClose ? `24h ${up ? 'bottom' : 'peak'} close` : 'average move, price outside the close range';
            const o = await this.placeCondEntry({ candidate: { ...cand, [cont ? '_boCont' : '_boWhip']: true }, target, worst, tag: bundle ? 'whipsaw + continuation' : name, bundle, kind: bundle ? name : (cont ? 'run' : (WINTER ? 'pump' : 'dip')) });
            if (!o) { this.log(`[BO] ${sym}: ${brk} but the ${name} cond. was not placed${placed ? ' (the other leg of the bundle is placed)' : ''}`, 'warn'); if (!placed) return; continue; }
            placed++;
            this.log(`[BO] ${this._boGlyph()} ${sym}: ${brk} — ${bundle ? 'bundle: ' : ''}${name} cond. ${up ? 'above' : 'below'} @ ${fp(target)} (${tSrc}, ${tPct.toFixed(2)}% ${up ? 'up' : 'down'} from ${fp(price)}), cancelled at ${fp(worst)} (${wSrc}, ${wPct.toFixed(2)}% ${up ? 'down' : 'up'}), TP ${cand._tpPct}% / SL ${cand._slPct}% ROI from the fill${bundle ? '; the first leg to fill cancels the other' : ''}`, 'info');
          }
        },

        // Pending Whipsaw / Continuation conds expire after Order life, like the watches.
        async _boWhipExpire() {
          const life = Math.max(1, Number(this.cfg.boLifeMins) || 1440) * 60000, now = Date.now();
          for (const o of [...(this.condOrders || [])]) {
            if (this._boIsWC(o) && now - o.createdAt >= life) { try { await this.cancelCondOrder(o.id, o.tag + ' order life reached'); } catch (e) { this.log(`[BO] cancel error (${o.symbol}): ${e.message}`, 'warn'); } }
          }
        },

        // Watches are dropped when Breakout is off. Pending conds tagged 'breakout' (the retired price conds) are cancelled.
        async _boModeSync() {
          const c = this.cfg;
          // Whipsaw / Continuation conds are cancelled when Breakout or Both is switched off, or when only the other button is selected (neither or both selected keeps both kinds).
          const wc = (this.condOrders || []).filter(o => this._boIsWC(o));
          for (const leg of ['whip', 'cont']) {
            if (c.boEnabled && this._boAllows(leg)) continue;
            const ws = wc.filter(o => this._boWCLeg(o) === leg), tag = leg === 'cont' ? 'continuation' : 'whipsaw', nm = leg === 'cont' ? 'Continuation' : 'Whipsaw';
            if (!ws.length) continue;
            for (const o of ws) { try { await this.cancelCondOrder(o.id, c.boEnabled ? tag + ' off' : 'breakout off'); } catch (e) { this.log(`[BO] cancel error (${o.symbol}): ${e.message}`, 'warn'); } }
            this.log(`[BO] ${this._boGlyph()} ${c.boEnabled ? nm + ' off' : 'Breakout off'} — ${ws.length} ${tag} cond. order${ws.length === 1 ? '' : 's'} cancelled`, 'info');
          }
          if (c.boEnabled) {
            if ((this.condOrders || []).some(o => o.tag === 'breakout')) await this._boCancelAll('breakout price conds retired', 'Price breakouts are gone');
          } else if (Object.keys(c.boWatch || {}).length) {
            const n = Object.keys(c.boWatch).length;
            c.boWatch = {};
            this.log(`[BO] ${this._boGlyph()} Breakout off — ${n} watch${n === 1 ? '' : 'es'} cancelled`, 'info');
            this.persist();
          }
        },

        // Fills the free cond. slots with one watch each, from random tickers of the bulk list.
        async _boBatch() {
          if (this._boBusy) return;
          this._boBusy = true;
          try {
            const c = this.cfg;
            if (!c.boEnabled) return;
            if (!c.binaryModeEnabled) {
              if (!this._boBinWarned) { this._boBinWarned = true; this.log('[BO] ⚠️ Binary Mode is off — TP and SL are only set at entry there, so no Breakout watches are placed', 'warn'); }
              return;
            }
            this._boBinWarned = false;
            if (this._isDrawdownHalted?.() || this._isGainsLocked?.()) return;

            await this._boModeSync();
            await this._boGuard();
            if (this._boAtCap()) return; // max positions: no new conds
            const free = this._boMaxWatch() - Object.keys(c.boWatch || {}).length; // free watch slots: Max watches, one per ticker; neither the host's Max Cond. Orders nor Max Positions caps this
            if (free <= 0) return;

            const taken = new Set([...(this.positions || []).map(p => p.symbol), ...(this.condOrders || []).map(o => o.symbol), ...Object.keys(c.boWatch || {})]);
            const now = Date.now();
            for (const m of [c.boGray, c.boWhite]) for (const k of Object.keys(m)) if (now - m[k] >= GRAY_MS) delete m[k];
            const mega = new Set(Array.isArray(c.megacapExclude) ? c.megacapExclude : []);
            const pool = (this._lastAllTickers || []).filter(t => t.symbol && t.symbol.endsWith('USDT') && !taken.has(t.symbol)
              && !mega.has(t.symbol) && !(t.symbol in c.boGray) && parseFloat(t.lastPrice || 0) > 0 && !this._isSymbolBanned?.(t.symbol));
            for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }

            const maxTry = free * 3; // a few spare picks for tickers that fail (new listings, filters, refused orders)
            let placed = 0, tries = 0;
            for (const t of pool) {
              if (placed >= free || tries >= maxTry) break;
              tries++;
              try { if (await this._boVolPlace(t.symbol, t)) placed++; }
              catch (e) { this.log(`[BO] ${t.symbol} error: ${e.message}`, 'warn'); }
            }
            this.log(`[BO] ${this._boGlyph()} Batch — ${placed}/${free} watch${free === 1 ? '' : 'es'} placed`, 'info');
            this.persist();
          } finally { this._boBusy = false; }
        },

        async init() {
          await _origInit.call(this);
          this._boLoaded = true;
          // Position-type badge, stamped on every watch's position and its closed trade: Double Top, Revert Bottom and so on, with -Vol at the end (_boHist = the last break the type is read against).
          if (typeof this.registerRoleBadge === 'function') this.registerRoleBadge(item => {
            const e = item && (item._boEdge || item.candidate?._boEdge);
            if (e !== 'top' && e !== 'bottom') return null;
            const h = item._boHist || item.candidate?._boHist, vol = !!(item._boVol ?? item.candidate?._boVol), sfx = (vol ? '-Vol' : '') + ((item._boWhip ?? item.candidate?._boWhip) ? '-Whip' : '') + ((item._boCont ?? item.candidate?._boCont) ? '-Cont' : '');
            const lbl = h ? BO_TYPE(h, e) + sfx : e.toUpperCase() + sfx.toUpperCase();
            return `<span title="Breakout, entered at the ${vol ? 'volume ' : ''}${e}" style="font-family:var(--mono);font-size:9px;letter-spacing:1px;padding:2px 5px;border-radius:2px;border:1px solid rgba(var(--bo-rgb),.35);background:rgba(var(--bo-rgb),.15);color:var(--bo-acc)">${lbl}</span>`;
          });
          for (const [k, v] of Object.entries(BO_DEFAULT_CFG)) {
            if (this.cfg[k] === undefined) this.cfg[k] = Array.isArray(v) ? [...v] : (v && typeof v === 'object' ? { ...v } : v);
          }
          for (const k of ['boGray', 'boWhite', 'boWatch']) if (!this.cfg[k] || typeof this.cfg[k] !== 'object' || Array.isArray(this.cfg[k])) this.cfg[k] = {};
          this.cfg.boBreaks = (Array.isArray(this.cfg.boBreaks) ? this.cfg.boBreaks : []).filter(x => Array.isArray(x) && x[0] > 0 && (x[1] === 'T' || x[1] === 'B'));
          // Retired settings and stores (scoring, watch lists, hypotheticals, flow, auto-switch, tally, retry queue).
          for (const k of ['boFlowOn', 'boCritOn', 'boCritF', 'boCritS', 'boCritL', 'boCritI', 'boGate', 'boSamples', 'boWatchMax', 'boStepX', 'boCells', 'boCellOf', 'boW1', 'boW2', 'boHypo',
            'boEdges', 'boLog', 'boInval', 'boRetry', 'boAuto', 'boAutoPct', 'boAutoTicker', 'boTickLatch', 'boFlowUp', 'boFlowDown', 'boMult', 'boEntry', 'boFlow', 'boTrack', 'boPushMax', 'boFlowEnabled', 'boFundW', 'boSkewW', 'boTgtMin', 'boTgtMax', 'boPeakCloser', 'boBottomCloser', 'boVol', 'boVolClose', 'boPairs', 'boFar', 'boDR', 'boRevert', 'boDecide', 'boTypes', 'boFlip', 'boNullify', 'boNullHrs', 'boCandlePref']) delete this.cfg[k];
        },

        // The watches are polled on the cond. order watcher so they fire on time rather than at the next scan.
        async pseudoWatchCondOrders() {
          const r = await _origWatch.call(this);
          if (this._boLoaded) { try { await this._boModeSync(); await this._boGuard(); await this._boVolWatch(); await this._boWhipExpire(); } catch (e) { this.log(`[BO] watcher error: ${e.message}`, 'warn'); } }
          return r;
        },

      }, _hostStages
        ? { _scanStageDefs: [...def._scanStageDefs,
            { id: 'bo-batch', group: 'bo', run: function (ctx) { return this._boBatch(ctx); } },
          ] }
        : { async runScan() {
            await _origScan.call(this);
            await this._boBatch();
          } });
    },
  };
})();
</script>
