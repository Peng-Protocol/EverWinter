      // Repair any missing DCA stages before processing fills
      try {
        await this._repairDcaStages(pos);
      } catch(e) {
        this.log(`[PC-DCA-01] ${pos.symbol}: DCA repair failed — ${e.message}`, 'error');
      }

      const pendingAdds = (pos.orders || []).filter(o => o.type === 'cond' && !o.filled);
      if (pendingAdds.length === 0 && (pos.dcaStage || 0) < this._posStageCount(pos)) {
        const _lastDiag = pos._lastDcaDiagAt || 0;
        if (now - _lastDiag > 60000) {
          pos._lastDcaDiagAt = now;
          this.log(`[PC-DCA-02] ${pos.symbol}: no pending DCA orders but stage ${pos.dcaStage || 0}/${this._posStageCount(pos)} (orders ${(pos.orders||[]).length})`, 'warn');
        }
      } else if (pendingAdds.length > 0) {
        const nextAdd = pendingAdds.reduce((best, o) => o.price > best.price ? o : best, pendingAdds[0]);
        if (mark <= nextAdd.price) {
          // trigger detail captured below in the per-add trade log
        }
      }
      for (const add of pendingAdds) {
        try {
        if (mark <= add.price) {  // LONG: fill when price falls to add level
          add.filled  = true;
          add.filledAt = now;
          // A SW stage just filled — reset the pause-log flag so the next pause episode
          // (after a new batch of stages is placed) will log once again.
          if (add._secondWind) pos._swPausedLogged = false;
          const addQty = add.qty || 0;
          if (addQty > 0) {
            const newTotalNotional = (pos.entryPrice * pos.totalSize) + (add.price * addQty);
            pos.totalSize  = parseFloat((pos.totalSize + addQty).toFixed(8));
            pos.entryPrice = newTotalNotional / pos.totalSize;
            const addMarginDelta = (add.price * addQty) / pos.leverage;
            pos.margin = parseFloat((pos.margin + addMarginDelta).toFixed(6));
            pos.dcaStage   = pos.orders.filter(o => o.type === 'cond' && o.filled).length;
          }
          {
            const _sl_roi   = this._tpRoi(pos.dcaStage);
            const _sl_instr = await this.getInstrInfo(pos.symbol);
            // LONG: TP is above avg entry
            const _sl_tp    = _sl_instr
              ? this.snapPrice(pos.entryPrice * (1 + (_sl_roi / 100) / pos.leverage), _sl_instr)
              : parseFloat((pos.entryPrice * (1 + (_sl_roi / 100) / pos.leverage)).toFixed(8));
            pos.currentTpPrice = _sl_tp;
            pos.tpPct          = _sl_roi;
          }
          // SL fires when all first-wind DCA stages have filled — SW stages extending _stageCount must not delay it.
          // Guard !add._secondWind: SW activation clears slPrice; without this guard a SW stage fill would
          // immediately re-arm SL (all first-wind stages are still filled + slPrice is null), causing SL to
          // persist visibly through every SW cycle — especially bad for the laggard under infinite SW.
          const _slFirstWindFilled = pos.orders.filter(o => o.type === 'cond' && o.filled && !o._secondWind).length;
          const _slFirstWindTotal  = pos._firstWindStageCount || this._posStageCount(pos);
          if (!add._secondWind && _slFirstWindFilled >= _slFirstWindTotal && !pos.slPrice && !pos._binary) {
            const instr = await this.getInstrInfo(pos.symbol);
            if (instr) {
              pos.slPrice = this.snapPrice(pos.entryPrice * (1 - 1.05 / pos.leverage), instr);
              pos.slSet   = true;
              this.log(`[WCH] ${this.themeEmoji} ${pos.symbol}: stage ${this._posStageCount(pos)} — SL set @ ${fmtP(pos.slPrice)}`, 'warn');
            }
          }
          const _addedNotional = (add.price || 0) * (add.qty || 0);
          const _addedMargin   = _addedNotional / (pos.leverage || 1);
          const _entryMargin   = (pos._entryMargin || ((pos.orders?.[0]?.price || pos.originalEntryPrice || pos.entryPrice) * (pos.orders?.[0]?.qty || 0) / (pos.leverage || 1)) || (this.cfg.minNotional / (pos.leverage || this.cfg.leverage || 1)));
          const _scale         = _entryMargin > 0 ? (_addedMargin / _entryMargin) : 0;
          this.log(`[WCH] ${this.themeEmoji} ${pos.symbol}: ${add.label} triggered @ ${fmtP(add.price)} (mark ${fmtP(mark)}) | Added ${add.qty || 0} qty ≈ $${_addedNotional.toFixed(2)} notional / $${_addedMargin.toFixed(2)} margin (${_scale.toFixed(2)}× entry) | Margin now $${(pos.margin || 0).toFixed(2)} | New avg: ${fmtP(pos.entryPrice)} | Stage ${pos.dcaStage} | TP → ${fmtP(pos.currentTpPrice)} (${pos.tpPct}% ROI)`, 'trade');
          this.persist();
        }
        } catch(e) {
          this.log(`[PC-DCA-04] ${pos.symbol}: DCA processing failed for ${add.label || 'cond'} @ ${fmtP(add.price)} — ${e.message}`, 'error');
        }
      }

      if (pos.slSet && pos.slPrice > 0) {
        try {
          const _slFwFilled = (pos.orders || []).filter(o => o.type === 'cond' && o.filled && !o._secondWind).length;
          const _slFwTotal  = pos._firstWindStageCount || this._posStageCount(pos);
          const _slGate     = pos._binary || _slFwFilled >= _slFwTotal;
          if (_slGate) {
            const instr = await this.getInstrInfo(pos.symbol);
            if (!instr) {
              this.log(`[PC-SL-01] ${pos.symbol}: SL drift check skipped — instrument unavailable`, 'warn');
            } else {
              let targetSl, slTol;
              if (pos._binary) {
                const bSlPct = pos._slPctOverride ?? this.cfg.binarySlPct ?? 18;
                const base   = pos.originalEntryPrice || pos.entryPrice;
                targetSl = this.snapPrice(base * (1 - bSlPct / 100 / pos.leverage), instr); // LONG
                slTol    = base * bSlPct / 100 / pos.leverage * 0.10;
              } else {
                targetSl = this.snapPrice(pos.entryPrice * (1 - 1.05 / pos.leverage), instr);
                slTol    = (pos.entryPrice * 1.05 / pos.leverage) * 0.10;
              }
              if (Math.abs(pos.slPrice - targetSl) > slTol) {
                pos.slPrice = targetSl;
                this.log(`[WCH] ${this.themeEmoji} ${pos.symbol}: SL drift-corrected → ${fmtP(targetSl)}${pos._binary ? ' [Binary]' : ''}`, 'warn');
                this.persist();
              }
            }
          }
        } catch(e) {
          this.log(`[PC-SL-02] ${pos.symbol}: SL drift check failed — ${e.message}`, 'error');
        }
      }

      const age = now - pos.openedAt;
      const forceMs  = this.cfg.runtimeHours * 3600000;
      if (age >= forceMs && pos.phase !== 'force') {
        pos.phase = 'force';
        this.persist();
      }

      if (pos.phase === 'force' && this.positions.find(x => x.id === pos.id)) {
        const forceLabel = `${this.cfg.runtimeHours}h`;
        this.log(`[WCH] ${this.themeEmoji} ${pos.symbol}: ${forceLabel} — force closing`, 'warn');
        await this.pseudoClosePosition(pos, 'force');
        continue;
      }

      // LONG: SL hit when mark falls to or below SL price
      if (pos.slSet && pos.slPrice > 0 && mark <= pos.slPrice) {
        this.log(`[WCH] ${this.themeEmoji} ${pos.symbol}: SL hit @ ${fmtP(mark)} ≤ ${fmtP(pos.slPrice)} — closing`, 'error');
        await this.pseudoClosePosition(pos, 'sl', pos.slPrice);
        continue;
      }

      // ── Unified TP close ──
      const _effTpClose = pos.currentTpPrice;
      if (_effTpClose > 0 && mark >= _effTpClose) {
        this.log(`[WCH] ${this.themeEmoji} ${pos.symbol}: TP hit @ ${fmtP(mark)} ≥ ${fmtP(_effTpClose)} — closing`, 'success');
        await this.pseudoClosePosition(pos, 'tp', _effTpClose);
        continue;
      }

      const _effTp = pos.currentTpPrice; // single field
      if (_effTp > 0 && !pos._whiplashScheduled) {
        let _wpTpRef = _effTp;
        if (!(pos._edaTpPrice > 0) && (pos.dcaStage || 0) === 0) {
          // Use the position's own ROI target when it carries one — plugin entries
          // (Firestorm etc.) open with their own TP %, not the global slider.
          const _wpRoi = pos.tpPct ?? (this.cfg.binaryModeEnabled ? (this.cfg.binaryTpPct ?? 18) : this.cfg.entryTpRoi);
          _wpTpRef = pos.entryPrice * (1 + (_wpRoi / 100) / pos.leverage); // LONG: TP at slider % above entry
        }
        const tpGap  = _wpTpRef - pos.entryPrice; // LONG: distance from entry up to TP
        const tpProx = mark - pos.entryPrice;      // LONG: price distance already covered upward
        const wpPct  = this.cfg.whiplashProximityPct ?? 20;
        if (tpGap > 0 && tpProx >= tpGap * (1 - wpPct / 100)) {
          pos._whiplashScheduled = true;
          const _snapTp    = _effTp;
          const _snapIsEda = pos._edaTpPrice > 0;
          this.log(`[WCH] ${this.themeEmoji} ${pos.symbol}: price within ${wpPct}% of ${_snapIsEda ? 'EDa ' : ''}TP (${fmtP(mark)} → TP ${fmtP(_wpTpRef)}) — whiplash audit in 5min`, 'info');
          const posId = pos.id;
          setTimeout(async () => {
            const livePos = this.positions.find(p => p.id === posId);
            if (!livePos) return;
            livePos._whiplashScheduled = false;
            if (_chClosingIds.has(posId)) return;
            // Re-read the live TP — currentTpPrice is always the truth
            const _liveEffTp = livePos.currentTpPrice;
            if (_liveEffTp !== _snapTp) return;
            _chClosingIds.add(posId);
            try {
              const auditFrom = Date.now() - 6 * 60 * 1000;
              const auditTo   = Date.now();
              const candles   = await this.pseudoFetchKlines(livePos.symbol, auditFrom, auditTo);
              if (!candles.length) { _chClosingIds.delete(posId); return; }
              let whiplashHit = false;
              for (const c of candles) {
                if (_snapTp > 0 && c.h >= _snapTp) { // LONG: TP hit when candle high reaches TP
                  whiplashHit = true; break;
                }
              }
              if (whiplashHit) {
                this.log(`[WPL] ${this.themeEmoji} ${livePos.symbol}: whiplash audit — ${_snapIsEda ? 'EDa ' : ''}TP confirmed in klines — closing`, 'warn');
                _chClosingIds.delete(posId);
                await this.pseudoClosePosition(livePos, 'tp', _snapTp);
              } else {
                this.log(`[WPL] ${this.themeEmoji} ${livePos.symbol}: whiplash audit — TP not hit in klines — still open`, 'info');
                _chClosingIds.delete(posId);
              }
            } catch(e) {
              this.log(`[E05] ${this.themeEmoji} ${livePos.symbol}: whiplash audit error — ${e.message}`, 'warn');
              _chClosingIds.delete(posId);
            }
          }, 5 * 60 * 1000);
        }
      }
    }

    } catch(e) {
      this.log(`[PC-WATCH-01] position watcher failed — ${e.message}${e.stack ? ' @ '+((e.stack||'').split('\n')[1]||'').trim() : ''}`, 'error');
    } finally {
      this._watchRunning = false;
    }
  },

  _autoClearDuplicateSecondWindStages() {
    let changed = false;
    for (const pos of this.positions) {
      if (!pos || !pos._pseudo) continue;
      const orders = Array.isArray(pos.orders) ? pos.orders : [];
      const pendingSw = orders.filter(o => o.type === 'cond' && o._secondWind && !o.filled);
      if (pendingSw.length <= 1) continue;

      const seen = new Set();
      const toDrop = new Set();
      for (const o of pendingSw) {
        const key = Number(o.price || 0).toFixed(8);
        if (seen.has(key)) toDrop.add(o);
        else seen.add(key);
      }
      if (toDrop.size === 0) continue;

      pos.orders = orders.filter(o => !toDrop.has(o));
      const swAll = pos.orders.filter(o => o.type === 'cond' && o._secondWind);
      swAll.sort((a, b) => (a.price || 0) - (b.price || 0));
      swAll.forEach((o, i) => { o.label = `SW${i + 1}`; });
      pos._stageCount = this._posStageCount(pos);
      this.log(`[WCH] 🧹 ${pos.symbol.replace('USDT','')}: auto-cleared ${toDrop.size} duplicate SW stage${toDrop.size > 1 ? 's' : ''} at matching trigger`, 'warn');
      changed = true;
    }
    if (changed) this.persist();
  },

  // Plugins call this (typically in their init) to supply a renderer for their own
  // position role badge. Each renderer takes a position/closed-trade record and
  // returns badge HTML, or a falsy value to defer to the next renderer / the host
  // default. Lets new strategy plugins badge their positions without host edits.
  registerRoleBadge(fn) {
    if (typeof fn === 'function' && !this._roleBadgeProviders.includes(fn)) this._roleBadgeProviders.push(fn);
  },

  // Plugins call this (typically in their init) to register the badge label for a
  // pseudoClosePosition() reason string they introduce, e.g. registerCloseReason('substitution',
  // 'Sub'). Label should be a short truncated form, not the raw reason string. Reasons with no
  // registered label fall back to showing the raw reason string as-is (see reasonLabel below).
  registerCloseReason(reason, label) {
    if (!this._closeReasonLabels) this._closeReasonLabels = {};
    if (reason && label) this._closeReasonLabels[reason] = label;
  },

  _escapeAttr(v) {
    return String(v ?? '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  },

  _badgeTextFromHtml(html) {
    const raw = String(html || '');
    const title = raw.match(/title=["']([^"']+)["']/i)?.[1];
    return (title || raw.replace(/<[^>]*>/g, '').replace(/\s+/g, ' ').trim() || 'Order type')
      .replace(/&quot;/g, '"').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
  },

  _orderTypeBadgeHtml(html) {
    if (!html) return '';
    const full = this._badgeTextFromHtml(html);
    const safe = this._escapeAttr(full);
    return `<span class="order-type-badge" role="button" tabindex="0" aria-expanded="false" title="${safe}" data-full="${safe}" onclick="this.classList.toggle('expanded');this.setAttribute('aria-expanded',this.classList.contains('expanded'))" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.classList.toggle('expanded');this.setAttribute('aria-expanded',this.classList.contains('expanded'))}">${html}</span>`;
  },

  // The single role badge for a position/closed-trade: a plugin renderer if one
  // claims it, else no badge (strategies are now entirely plugin-provided).
  _roleBadge(item) {
    for (const fn of (this._roleBadgeProviders || [])) {
      try { const h = fn(item); if (h) return this._orderTypeBadgeHtml(h); } catch(e) {}
    }
    return '';
  },

  _pnlChartSvg() {
    const WINDOW = 50;
    const ru = this.closedTrades.find(t => t.reason === 'period-rollup');
    const allIndiv = this.closedTrades
      .filter(t => t.reason !== 'period-rollup')
      .sort((a, b) => (a.closedAt || 0) - (b.closedAt || 0));
    if (allIndiv.length < 2) return '';
    const base = ru?.rollup?.netPnl ?? 0;
    let cum = base;
    const allCums = allIndiv.map(t => { cum += (t.totalPnl ?? t.pnl ?? 0); return cum; });
    const clipped = allIndiv.length > WINDOW;
    const individuals = clipped ? allIndiv.slice(-WINDOW) : allIndiv;
    const cums = clipped ? allCums.slice(-WINDOW) : allCums;
    const VW = 400, VH = 88, padT = 8, padB = 16, padL = 36, padR = 8;
    const plotW = VW - padL - padR, plotH = VH - padT - padB;
    const n = cums.length;
    const minV = Math.min(...cums), maxV = Math.max(...cums);
    const range = maxV - minV || 1;
    const xOf = i => padL + (i / (n - 1)) * plotW;
    const yOf = v => padT + plotH * (1 - (v - minV) / range);
    const yZ = yOf(Math.min(maxV, Math.max(minV, 0)));
    const final = cums[n - 1];
    const pos = final >= 0;
    const lClr = pos ? 'rgba(100,220,150,.9)' : 'rgba(255,80,80,.9)';
    const fClr = pos ? 'rgba(100,220,150,.12)' : 'rgba(255,80,80,.12)';
    const gClr = 'rgba(255,255,255,.06)';
    const tClr = 'rgba(255,255,255,.28)';
    const ptStr = cums.map((v, i) => `${xOf(i).toFixed(1)},${yOf(v).toFixed(1)}`).join(' ');
    const fillPts = `${xOf(0).toFixed(1)},${yZ.toFixed(1)} ${ptStr} ${xOf(n-1).toFixed(1)},${yZ.toFixed(1)}`;
    let grids = '';
    const gridVals = [...new Set([minV, maxV, ...(minV <= 0 && maxV >= 0 ? [0] : [])])];
    for (const v of gridVals) {
      const y = yOf(v).toFixed(1);
      const lbl = v === 0 ? '0' : (v > 0 ? '+' : '') + v.toFixed(2);
      grids += `<line x1="${padL}" y1="${y}" x2="${VW - padR}" y2="${y}" stroke="${v === 0 ? 'rgba(255,255,255,.12)' : gClr}" stroke-width="${v === 0 ? 0.75 : 0.5}"/>`;
      grids += `<text x="${padL - 3}" y="${(parseFloat(y) + 2.5).toFixed(1)}" fill="${tClr}" font-size="6.5" font-family="monospace" text-anchor="end">${lbl}</text>`;
    }
    const fmtTs = ts => { const d = new Date(ts); return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
    const xLabels = `<text x="${padL}" y="${VH - 2}" fill="${tClr}" font-size="6.5" font-family="monospace" text-anchor="start">${fmtTs(individuals[0].closedAt)}</text><text x="${VW - padR}" y="${VH - 2}" fill="${tClr}" font-size="6.5" font-family="monospace" text-anchor="end">${fmtTs(individuals[n-1].closedAt)}</text>`;
    const windowLabel = clipped ? `<text x="${VW / 2}" y="${VH - 2}" fill="${tClr}" font-size="6.5" font-family="monospace" text-anchor="middle">last ${WINDOW}</text>` : '';
    return `<svg viewBox="0 0 ${VW} ${VH}" width="100%" height="${VH}" style="display:block">${grids}<polygon points="${fillPts}" fill="${fClr}"/><polyline points="${ptStr}" fill="none" stroke="${lClr}" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/>${xLabels}${windowLabel}</svg>`;
  },

  renderTradeFeed() {
    const el = document.getElementById('ch-trade-feed');
    if (!el) return;
    const hdrCount = document.getElementById('ch-trade-count');
    const hdrMeta  = document.getElementById('ch-trade-meta');
    const _ru       = this.closedTrades.find(t => t.reason === 'period-rollup');
    const _individ  = this.closedTrades.filter(t => t.reason !== 'period-rollup');
    const _allShown = _individ;
    const _totalCt  = _individ.length + (_ru?.rollup?.count || 0);
    if (hdrCount) hdrCount.textContent = _totalCt + ' closed' + (_ru ? ' (' + _individ.length + ' shown)' : '');
    if (hdrMeta) {
      if (_totalCt > 0) {
        const wins   = _individ.filter(t => t.isWin).length + (_ru?.rollup?.wins || 0);
        const losses = _totalCt - wins;
        const net    = [..._allShown, ...((_ru?.rollup?.netPnl != null) ? [{ totalPnl: _ru.rollup.netPnl }] : [])].reduce((s,t) => s + (t.totalPnl ?? t.pnl ?? 0), 0);
        const netStr = (net >= 0 ? '+' : '') + net.toFixed(2) + ' USDT';
        const netCol = net >= 0 ? 'var(--profit)' : 'var(--short)';
        hdrMeta.innerHTML = `<span style="color:var(--profit)">${wins} W</span>&nbsp;/&nbsp;<span style="color:var(--short)">${losses} L</span>&nbsp;·&nbsp;<span style="color:${netCol}">${netStr}</span>`;
        hdrMeta.style.display = '';
      } else {
        hdrMeta.style.display = 'none';
      }
    }
    // Sync stats panel summary (col-stats)
    const statsCount = document.getElementById('ch-stats-count');
    const statsWl    = document.getElementById('ch-stats-wl');
    const statsNet   = document.getElementById('ch-stats-net');
    const statsLast  = document.getElementById('ch-stats-last');
    const statsBest  = document.getElementById('ch-stats-best');
    const statsWorst = document.getElementById('ch-stats-worst');
    if (statsCount) statsCount.textContent = _totalCt > 0 ? _totalCt : '—';
    if (_totalCt > 0) {
      const _sw = _individ.filter(t => t.isWin).length + (_ru?.rollup?.wins || 0);
      const _sl = _totalCt - _sw; // absorption cards count as losses
      const _sn = [..._allShown, ...((_ru?.rollup?.netPnl != null) ? [{ totalPnl: _ru.rollup.netPnl }] : [])].reduce((s,t) => s + (t.totalPnl ?? t.pnl ?? 0), 0);
      if (statsWl) statsWl.innerHTML = `<span style="color:var(--profit)">${_sw}W</span> / <span style="color:var(--short)">${_sl}L</span>`;
      if (statsNet) { statsNet.textContent = (_sn >= 0 ? '+' : '') + _sn.toFixed(2) + ' USDT'; statsNet.style.color = _sn >= 0 ? 'var(--profit)' : 'var(--short)'; }
      // Last close
      const _last = _individ[0];
      if (statsLast && _last) {
        const _lSym = (_last.symbol || '').replace('USDT','');
        const _lPct = ((_last.pnlPct ?? 0) >= 0 ? '+' : '') + (_last.pnlPct ?? 0).toFixed(1) + '%';
        statsLast.textContent = _lSym + ' ' + _lPct;
        statsLast.style.color = _last.isWin ? 'var(--profit)' : 'var(--short)';
      } else if (statsLast) { statsLast.textContent = '—'; statsLast.style.color = ''; }
      // Best win %
      const _wins = _individ.filter(t => t.isWin);
      if (statsBest && _wins.length > 0) {
        const _best = _wins.reduce((a,b) => (b.pnlPct ?? 0) > (a.pnlPct ?? 0) ? b : a, _wins[0]);
        const _bSym = (_best.symbol || '').replace('USDT','');
        statsBest.textContent = _bSym + ' +' + (_best.pnlPct ?? 0).toFixed(1) + '%';
      } else if (statsBest) { statsBest.textContent = '—'; }
      // Worst loss %
      const _losses = _individ.filter(t => !t.isWin);
      if (statsWorst && _losses.length > 0) {
        const _worst = _losses.reduce((a,b) => (b.pnlPct ?? 0) < (a.pnlPct ?? 0) ? b : a, _losses[0]);
        const _wSym = (_worst.symbol || '').replace('USDT','');
        statsWorst.textContent = _wSym + ' ' + (_worst.pnlPct ?? 0).toFixed(1) + '%';
      } else if (statsWorst) { statsWorst.textContent = '—'; }
    } else {
      if (statsWl)    { statsWl.textContent  = '—'; }
      if (statsNet)   { statsNet.textContent  = '—'; statsNet.style.color = ''; }
      if (statsLast)  { statsLast.textContent = '—'; statsLast.style.color = ''; }
      if (statsBest)  { statsBest.textContent = '—'; }
      if (statsWorst) { statsWorst.textContent = '—'; }
    }
    const hdrClear = document.getElementById('ch-trade-clear');
    if (hdrClear) hdrClear.style.display = (_totalCt > 0) ? '' : 'none';
    const emptyEl = document.getElementById('ch-trade-empty');
    if (emptyEl) emptyEl.style.display = (_totalCt === 0) ? 'flex' : 'none';

    if (_totalCt === 0) { el.innerHTML = ''; return; }
    const _fmtDurMs = ms => { const s=Math.floor((ms||0)/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60; return s<60?sc+'s':s<3600?m+'m '+String(sc).padStart(2,'0')+'s':h+'h '+String(m).padStart(2,'0')+'m'; };
    const _fmtDate  = ts => ts ? new Date(ts).toLocaleString(undefined,{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '—';

    // Sort all visible cards newest-first by timestamp before rendering
    const _sortedFeed = [..._allShown, ...(_ru ? [_ru] : [])].sort((a, b) => {
      const ta = a.closedAt ?? a.time ?? 0;
      const tb = b.closedAt ?? b.time ?? 0;
      return tb - ta;
    });
    el.innerHTML = _sortedFeed.map(t => {
      if (t.reason === 'period-rollup') {

  _sessionPnlStats() {
    const ru = this.closedTrades.find(t => t.reason === 'period-rollup');
    const cards = this.closedTrades.filter(t => t.reason !== 'period-rollup');
    let winPnl = 0, lossPnl = 0, net = 0;
    if (ru?.rollup) {
      const r = ru.rollup;
      net += r.netPnl || 0;
      if (r.winPnlSum != null || r.lossPnlSum != null) {
        winPnl += r.winPnlSum || 0;
        lossPnl += r.lossPnlSum || 0;
      } else if ((r.netPnl || 0) >= 0) winPnl += r.netPnl || 0;
      else lossPnl += Math.abs(r.netPnl || 0);
    }
    for (const t of cards) {
      const v = t.totalPnl ?? t.pnl ?? 0;
      net += v;
      if (v >= 0) winPnl += v; else lossPnl += Math.abs(v);
    }
    const denom = winPnl + lossPnl;
    return { winPnl, lossPnl, net, denom, skew: denom > 0 ? (winPnl / denom) * 100 : 0 };
  },

      data = {

        version:      '1.6.1',
        session:      this.sess,
        closedTrades: this.closedTrades,
        positions:    this.positions.map(p => ({ ...p })),

        exportedAt:  new Date().toISOString(),

      suffix = 'log';

      a.href     = url;
      a.download = `pseudochaser_${suffix}_${ts}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

  _dcaStageCount() { return this.cfg.dcaStages; },
  // Returns true when Binary Mode is active — used by all entry paths to override DCA structure.
  _binaryMode() { return this.cfg.binaryModeEnabled === true; },
  // Returns computed add-price trigger percentages array.
  // N=3: hardcoded [3,9,15]; N>=6: [1.5, 3, 6, ..., 3*(N-1)]
  _addPcts() {
    const n = this.cfg.dcaStages;
    if (n === 3) return [3, 9, 15];
    return [1.5, ...Array.from({length: n - 1}, (_, k) => 3 * (k + 1))];
  },
  // Alias for backward compat with call sites using _activeAddPcts()
  _activeAddPcts() { return this._addPcts(); },

  // Simulates the full DCA fill cascade and computes exact total loss at SL.
  // SL = finalAvgEntry × (1 - 1.05/lev). Loss per tranche = (SL - trancheEntry)/trancheEntry × lev × trancheMargin.
  _slEstimate() {
    const lev   = this.cfg.leverage || 1;
    const addN  = this.cfg.addNotional || this.cfg.minNotional;
    const addPcts = this._addPcts();
    const stages  = Math.min(this.cfg.dcaStages || 1, addPcts.length);
    // Build tranches: each has { entryPrice (relative, entry=1.0), margin }
    const entryP = 1.0;
    const tranches = [{ price: entryP, margin: this.cfg.minNotional / lev }];
    let totalQty      = this.cfg.minNotional / entryP;   // qty is proportional
    let totalNotional = this.cfg.minNotional;
    for (let i = 0; i < stages; i++) {
      const addPrice = entryP * (1 - addPcts[i] / 100);
      const stageNotional = addN;
      const addQty   = stageNotional / addPrice;
      totalQty      += addQty;
      totalNotional += stageNotional;
      tranches.push({ price: addPrice, margin: stageNotional / lev });
    }
    const avgEntry = totalNotional / totalQty;
    const slPrice  = avgEntry * (1 - 1.05 / lev);
    // Loss per tranche = (slPrice - trancheEntry) / trancheEntry * lev * trancheMargin
    const totalLoss = tranches.reduce((sum, t) => {
      return sum + (slPrice - t.price) / t.price * lev * t.margin;
    }, 0);
    const slDrawdownPct = (slPrice - entryP) / entryP * 100; // always negative
    const totalMargin = tranches.reduce((s, t) => s + t.margin, 0);
    return { slPrice, slDrawdownPct, totalLoss, totalMargin, avgEntry, tranches };
  },
  // Returns computed TP ROI % for stage s (stage 0=entry uses entryTpRoi).
  // max(entryTpRoi / (s+1), 3)
  _tpRoi(s) {
    return Math.max(this.cfg.entryTpRoi / (s + 1), 3);
  },

  _dcaFinalPct() {
    const n = this.cfg.dcaStages;
    return n === 3 ? 15 : 3 * (n - 1);

  // Returns the DCA stage count for a specific position, regardless of current global config.
  // Prefers the stamped _stageCount field; falls back to counting cond orders in the position.
  _posStageCount(pos) {
    if (pos._binary) return 0;
    if (pos._stageCount != null) return pos._stageCount;
    const condCount = (pos.orders || []).filter(o => o.type === 'cond').length;
    return condCount > 0 ? condCount : this._dcaStageCount();

  // Detects and silently repairs a position whose first-wind cond orders are fewer than
  // _stageCount. Rebuilds only the missing unfilled stages, anchored to the original entry
  // price so trigger percentages stay consistent with what was intended at open.
  async _repairDcaStages(pos) {
    if (pos._binary || this.cfg.binaryModeEnabled) return;
    const expected  = pos._stageCount || this._dcaStageCount();
    const firstWind = (pos.orders || []).filter(o => o.type === 'cond' && !o._secondWind);
    if (firstWind.length >= expected) return; // nothing to repair

    const sym  = pos.symbol;
    const instr = await this.getInstrInfo(sym);
    if (!instr) return;

    const addPcts      = this._activeAddPcts();
    const entryMult    = 1;
    const baseAdd      = this.cfg.addNotional * entryMult;
    const effectiveLev = pos.leverage;
    const anchor       = pos.originalEntryPrice || pos.entryPrice;

    // Reconstruct running notional/size from everything already in the position
    let runNotional = anchor * pos.totalSize;
    let runSize     = pos.totalSize;
    // Add back filled cond notional deltas so avg-price TP math stays correct
    for (const o of firstWind.filter(o => o.filled)) {
      runNotional += (o.price || 0) * (o.qty || 0);
      runSize     += (o.qty || 0);
    }

    const existingCount = firstWind.length;
    const filledCount   = firstWind.filter(o => o.filled).length;
    let prevPrice = firstWind.length > 0
      ? Math.min(...firstWind.map(o => o.price || Infinity))
      : anchor;
    let rebuilt = 0;

    for (let i = existingCount; i < expected; i++) {
      const addPrice = this.snapPrice(anchor * (1 - addPcts[i] / 100), instr); // LONG: add below anchor
      if (!addPrice || addPrice >= prevPrice) { prevPrice = addPrice || prevPrice; continue; } // LONG: must step down

      const stageNotional = baseAdd;
      const addQty = this.snapQty(stageNotional / addPrice, instr);
      if (addQty <= 0) { prevPrice = addPrice; continue; }

      runNotional += addPrice * addQty;
      runSize     += addQty;
      const expectedAvg = runNotional / runSize;
      const tpRoi   = this._tpRoi(filledCount + i + 1);
      const tpPrice = this.snapPrice(expectedAvg * (1 + tpRoi / 100 / effectiveLev), instr); // LONG: TP above avg
      if (!tpPrice || tpPrice <= 0) { prevPrice = addPrice; continue; }

      pos.orders.push({
        label:   `Add${i + 1} -${addPcts[i]}%`, // LONG: minus sign
        price:   addPrice,
        qty:     addQty,
        tpPrice,
        type:    'cond',
        filled:  false,
        orderId: `repair-${Date.now()}-${i}`,
      });
      prevPrice = addPrice;
      rebuilt++;
    }

    if (rebuilt > 0) {
      pos._stageCount = expected;
      this.log(`[WCH] 🔧 ${sym}: repaired ${rebuilt} missing DCA stage${rebuilt > 1 ? 's' : ''} (had ${existingCount}/${expected})`, 'warn');
      this.persist();
    }
  },


  async pseudoClosePosition(pos, reason='manual', fillPrice=null) {
    if (_chClosingIds.has(pos.id)) return; // module-level guard — survives object reference replacement
    _chClosingIds.add(pos.id);

      this.log(`[PC-FT-02] ${pos.symbol}: FT close requested but ftClosePosition is unavailable`, 'error');
      return;
    } // delegate FT to correct closer
    if (!this.positions.find(x => x.id === pos.id)) { _chClosingIds.delete(pos.id); return; } // already removed
    const exitPrice  = fillPrice || pos.markPrice || pos.entryPrice;
    const pnl        = (exitPrice - pos.entryPrice) / pos.entryPrice * pos.leverage * pos.margin;
    const pnlPct     = (exitPrice - pos.entryPrice) / pos.entryPrice * pos.leverage * 100;
    const duration   = Date.now() - pos.openedAt;

    let fundingRate = null;
    let fundingIntervals = 0;
    try {

      fundingFee       = ff.fundingFee;
      fundingRate      = ff.fundingRate;
      fundingIntervals = ff.fundingIntervals;

    this.recordGainsPnl(totalPnl);
    if (isWin) { this.sess.wins++; this.sess.winPnlSum += totalPnl; } else { this.sess.losses++; this.sess.lossPnlSum += Math.abs(totalPnl); }

    let closedAt = Date.now();
    while (this.closedTrades.length && this.closedTrades[0].closedAt === closedAt) closedAt++;

      this.positions = this.positions.filter(x => x.id !== pos.id);

      this.persist();

    this.closedTrades.unshift({
      id:               pos.id,
      symbol:           pos.symbol,
      entryPrice:       pos.entryPrice,
      originalEntryPrice: pos.originalEntryPrice ?? pos.entryPrice,
      exitPrice,
      pnl,
      pnlPct,
      fundingFee,
      fundingRate,
      fundingIntervals,
      totalPnl,
      isWin,
      reason,
      margin:           pos.margin,
      leverage:         pos.leverage,
      dcaStage:         pos.dcaStage || 0,
      _stageCount:      pos._binary ? 1 : this._posStageCount(pos),
      _swStageCount:    ((pos.orders || []).filter(o => o.type === 'cond' && o._secondWind).length || 0),
      duration,

          </div>
        </div>
      `,

      'alt-tab-positions': `
        <template x-if="activeTab==='chaser'">
        <div style="padding:11px 13px;border-bottom:1px solid var(--border)" x-show="$store.chaser.positions.length>0">
          <div class="sec-ttl" style="margin-bottom:9px">Chaser Positions <em x-text="$store.chaser.positions.length+' active'"></em></div>
          <template x-for="p in $store.chaser.positions" :key="p.id">
          <div class="pos-card">
            <div class="pos-head">
              <div style="display:flex;align-items:center;gap:7px;min-width:0">
                <span class="pos-sym" x-text="fmtSym(p.symbol)"></span>
                <span class="side-badge" style="color:var(--profit);border-color:rgba(0,229,160,.4)">▲ LONG</span>
                <span class="phase-b"
                  :class="p.pendingClose?'force':p.phase"
                  x-text="p.pendingClose?'RETRY CLOSE':(p.phase==='normal'?'Active':'CLOSING')"></span>

              </div>
              <div class="pos-pnl" :class="p.upnl>=0?'p':'l'"
                   x-text="(p.upnl>=0?'+':'')+p.upnl.toFixed(2)+' USDT'"></div>
            </div>
            <div class="pos-grid">
              <div class="ps"><div class="psl">Entry</div> <div class="psv ice"  x-text="fmtP(p.originalEntryPrice ?? p.entryPrice)"></div></div>
              <div class="ps"><div class="psl">Mark</div>  <div class="psv"      x-text="fmtP(p.markPrice)"></div></div>
              <div class="ps" style="display:none"><div class="psl">Size</div>  <div class="psv" x-text="p.totalSize"></div></div>
              <div class="ps"><div class="psl">Lev</div>   <div class="psv"      x-text="p.leverage+'×'"></div></div>
              <div class="ps"><div class="psl">Margin</div><div class="psv"      x-text="'$'+p.margin.toFixed(2)"></div></div>
              <div class="ps"><div class="psl">24h Chg</div><div class="psv" :class="'short'" x-text="(()=>{const v=parseFloat(p.change24h);if(!Number.isFinite(v))return'—';const r=+v.toFixed(4);return (r>=0?'+':'')+r+'%';})()"></div></div>
              <!-- SalF: LSA ratio at entry (static, captured on open) -->
              <div class="ps" x-show="false">
                <div class="psl">LSA at Entry</div>
                <div class="psv" style="color:#2dd4bf;font-family:var(--mono)" x-text="p._salfLsaRatio!=null?p._salfLsaRatio.toFixed(2)+'×':'—'"></div>
              </div>
              <div class="ps" style="min-width:0;overflow:hidden">
                <div class="psl">Current TP</div>
                <div class="psv" style="color:var(--profit);white-space:nowrap;overflow:hidden;text-overflow:ellipsis" x-text="p.tpPct+'%  '+fmtP(p.currentTpPrice)"></div>
              </div>
              <!-- Funding Rate + Round countdown -->
              <div class="ps" x-show="p.fundingRate!=null">
                <div class="psl">Funding Rate</div>
                <div class="psv" :class="p.fundingRate>0?'profit':(p.fundingRate<0?'short':'')" x-text="p.fundingRate!=null?(p.fundingRate>=0?'+':'')+p.fundingRate.toFixed(4)+'%':'—'"></div>
              </div>
              <div class="ps" x-show="p.fundingRate!=null">
                <div class="psl" x-text="'Round ('+(Math.round((p._fundingIntervalMs||p._funIntervalMs||8*3600000)/3600000))+'h)'"></div>
                <div class="psv" style="color:var(--text-lo);font-family:var(--mono);font-size:10px" x-text="(()=>{
                  void $store.chaser.tick;
                  const now=Date.now();
                  let ms;
                  if (false) {
                    const iv = p._fundingIntervalMs || p._funIntervalMs || 8*3600000;
                    let next = p._funNextFundingTime;
                    while (next <= now) next += iv;
                    ms = next - now;
                  } else {
                    const iv = p._fundingIntervalMs || p._funIntervalMs || 8*3600000;
                    const next=Math.ceil((now+1)/iv)*iv;
                    ms=next-now;
                  }
                  const h=Math.floor(ms/3600000);
                  const m=Math.floor((ms%3600000)/60000);
                  const s=Math.floor((ms%60000)/1000);
                  return (h>0?h+'h ':'')+String(m).padStart(2,'0')+'m '+String(s).padStart(2,'0')+'s';
                })()"></div>
              </div>
              <!-- Accrued Funding -->
              <div class="ps" x-show="p.fundingRate!=null && $store.chaser.tick>=0 && (()=>{const iv=p._fundingIntervalMs||p._funIntervalMs||8*3600000;return Math.max(0,Math.floor(Date.now()/iv)-Math.ceil(p.openedAt/iv)+1)})()>0">
                <div class="psl" x-text="'Accrued Funding ('+(Math.round((p._fundingIntervalMs||p._funIntervalMs||8*3600000)/3600000))+'h)'"></div>
                <div class="psv" :class="(()=>{const iv=p._fundingIntervalMs||p._funIntervalMs||8*3600000;const n=Math.max(0,Math.floor(Date.now()/iv)-Math.ceil(p.openedAt/iv)+1);const f=p._fundingAccrued!=null?p._fundingAccrued:(p.fundingRate/100)*((p.markPrice||p.entryPrice)*p.totalSize)*n;return f>=0?'profit':'short'})()">
                  <span x-text="(()=>{
                    const iv=p._fundingIntervalMs||p._funIntervalMs||8*3600000;
                    const n=Math.max(0,Math.floor(Date.now()/iv)-Math.ceil(p.openedAt/iv)+1);
                    const f=p._fundingAccrued!=null?p._fundingAccrued:(p.fundingRate/100)*((p.markPrice||p.entryPrice)*p.totalSize)*n;
                    const tag=p._fundingAccrued!=null?'':'~';
                    return (f>=0?'+':'')+f.toFixed(3)+' USDT ('+n+'×'+tag+')';
                  })()"></span>
                </div>
              </div>
              <div class="ps" x-show="p.slSet"><div class="psl">Stop Loss</div><div class="psv" style="color:var(--short)" x-text="(()=>{ const slRoi = p._slPctOverride ?? ($store.chaser.cfg.binaryModeEnabled ? ($store.chaser.cfg.binarySlPct??18) : 105); return '~−'+slRoi.toFixed(1)+'%  '+fmtP(p.slPrice); })()"></div></div>
            </div>
            <!-- ── PRICE LADDER BAR ── -->
            <div x-data="{
              get orders()    { return p.orders || []; },
              get allConds()  { return this.orders.filter(o => o.type === 'cond'); },
              get condOrders() {
                const ep = p.entryPrice;
                return this.allConds.filter(o => !(o.filled && o.price <= ep));
              },
              get totalSegs() { return this.condOrders.length + 2; },
              get sw()        { return 100 / this.totalSegs; },
              get cursorPct() {
                const mk = p.markPrice, ep = p.entryPrice, tp = p.currentTpPrice;
                const cos  = this.condOrders;
                const adds = cos.map(o => o.price);
                const allFired = this.allConds.length > 0 && this.allConds.every(o => o.filled);
                const farRight = ((allFired || this.allConds.length === 0) && p.slSet && p.slPrice) ? p.slPrice : null;
                const prices = [tp, ep, ...adds, ...(farRight ? [farRight] : [])];
                const n = this.totalSegs;
                const sw = this.sw;
                if (!mk || !ep) return sw;
                for (let i = 0; i < n; i++) {
                  const lo = prices[i], hi = prices[i+1];
                  if (!lo || !hi) continue;
                  const segStart = i * sw;
                  if (i === 0) {
                    if (mk < lo)  return 0;
                    if (mk <= hi) return segStart + (mk - lo) / (hi - lo) * sw;
                  } else {
                    if (mk >= lo && mk <= hi) return segStart + (mk - lo) / (hi - lo) * sw;
                    if (mk > hi && i === n-1) return 100;
                  }
                }
                return mk < (prices[0]||0) ? 0 : 100;
              },
              fillPct(si) {
                const sw = this.sw;
                const segStart = si * sw, segEnd = (si + 1) * sw;
                const c = this.cursorPct;
                if (c <= segStart) return 0;
                if (c >= segEnd)   return 1;
                return (c - segStart) / sw;
              },
              segTriggered(si) {
                if (si < 2) return false;
                const co = this.condOrders[si - 2];
                return co ? !!co.filled : false;
              },
              segLabel(si) {
                if (si === 0) return 'TP';
                if (si === 1) return 'ENTRY';
                const co = this.condOrders[si - 2];
                return co ? co.label.replace('Add','A') : '';
              },
              segPrice(si) {
                if (si === 0) return p.currentTpPrice;
                if (si === 1) return p.entryPrice;
                const co = this.condOrders[si - 2];
                return co ? co.price : null;
              }
            }" style="padding:6px 10px 8px;isolation:isolate">

              <!-- Bar — taller to fit inline labels -->
              <div style="position:relative;height:34px;border-radius:3px;overflow:visible;display:flex">
                <template x-for="si in Array.from({length:totalSegs},(_,i)=>i)" :key="si">
                  <div :style="
                    'position:relative;flex:1;height:100%;overflow:hidden;' +
                    'background:' + (si===0 ? 'rgba(0,229,160,0.05)' : si===1 ? 'rgba(126,232,250,0.05)' : segTriggered(si) ? 'rgba(240,192,96,0.10)' : 'rgba(240,192,96,0.04)') + ';' +
                    'border-top:'    + (si===1 ? '1px' : segTriggered(si) ? '2px' : '1px') + ' solid ' + (si===0 ? 'rgba(0,229,160,0.35)' : si===1 ? 'rgba(126,232,250,0.45)' : segTriggered(si) ? 'rgba(240,192,96,0.85)' : 'rgba(240,192,96,0.22)') + ';' +
                    'border-bottom:' + (si===1 ? '1px' : segTriggered(si) ? '2px' : '1px') + ' solid ' + (si===0 ? 'rgba(0,229,160,0.35)' : si===1 ? 'rgba(126,232,250,0.45)' : segTriggered(si) ? 'rgba(240,192,96,0.85)' : 'rgba(240,192,96,0.22)') + ';' +
                    (si===0 ? 'border-left:1px solid rgba(0,229,160,0.35);border-radius:3px 0 0 3px;' : '') +
                    (si===totalSegs-1 ? 'border-right:' + (segTriggered(si)&&si!==1?'2px':'1px') + ' solid ' + (si===1?'rgba(126,232,250,0.45)':segTriggered(si)?'rgba(240,192,96,0.85)':'rgba(240,192,96,0.22)') + ';border-radius:0 3px 3px 0;' : '') +
                    (segTriggered(si) && si!==1 ? 'box-shadow:0 0 6px rgba(240,192,96,0.35),inset 0 0 8px rgba(240,192,96,0.08);' : '')
                  ">
                    <!-- Fill -->
                    <div :style="
                      'position:absolute;top:0;left:0;bottom:0;' +
                      'width:' + (fillPct(si)*100) + '%;' +
                      'transition:width 0.45s ease;' +
                      'background:' + (
                        si === 0 ? 'rgba(0,229,160,0.45)' :
                        si === 1 ? 'rgba(126,232,250,0.28)' :
                        segTriggered(si) ? 'rgba(240,192,96,0.50)' : 'rgba(240,192,96,0.28)'
                      )
                    "></div>
                    <!-- Inline label — bright white text for contrast against all fill colors -->
                    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;pointer-events:none;z-index:4">
                      <span style="font-family:var(--mono);font-size:7.5px;letter-spacing:0.5px;line-height:1;color:#ddeef8;text-shadow:0 1px 3px rgba(0,0,0,0.8)"
                            x-text="segLabel(si)+(si>1&&segTriggered(si)?' ⚡':'')"></span>
                      <span style="font-family:var(--mono);font-size:7px;line-height:1;color:rgba(221,238,248,0.70);text-shadow:0 1px 3px rgba(0,0,0,0.8)"
                            x-text="fmtP(segPrice(si))"></span>
                    </div>
                    <!-- Divider $store.chaser.tick -->
                    <div x-show="si > 0" style="position:absolute;left:0;top:-3px;bottom:-3px;width:1px;z-index:5"
                      :style="'background:' + (si===1 ? 'rgba(126,232,250,0.60)' : 'rgba(126,232,250,0.18)')"></div>
                    <!-- Entry divider — taller & brighter -->
                    <div x-show="si === 1" style="position:absolute;left:-1px;top:-5px;bottom:-5px;width:2px;background:rgba(126,232,250,0.70);box-shadow:0 0 4px rgba(126,232,250,0.4);z-index:6"></div>
                  </div>
                </template>
              </div>

            </div>
            <div class="pos-timer">
              <span>Open: <span x-text="fmtAge(p.openedAt, $store.chaser.tick)"></span></span>
              <span x-show="p.phase==='normal'">Force close in: <span class="hi" x-text="cdTo(p.openedAt+($store.chaser.cfg.runtimeHours*3600000), $store.chaser.tick)"></span></span>
              <span x-show="p.openedAt" style="color:var(--text-lo)" x-text="p.openedAt?(()=>{const d=new Date(p.openedAt);return d.toLocaleDateString([],{month:'short',day:'numeric'})+' '+d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});})():''"></span>
            </div>
          </div>

          </template>
        </div>
        </template>
      `,

              <div class="sv sm" :class="(()=>{ const ct=$store.chaser.closedTrades; const ru=ct.find(t=>t.reason==='period-rollup'); const cards=ct.filter(t=>t.reason!=='period-rollup'); const v=(cards.length||ru?.rollup?.netPnl!=null)?cards.reduce((s,t)=>s+(t.totalPnl??t.pnl??0),0)+(ru?.rollup?.netPnl??0):0; return v>=0?'profit':'short'; })()"
                   x-text="(()=>{ const ct=$store.chaser.closedTrades; const ru=ct.find(t=>t.reason==='period-rollup'); const cards=ct.filter(t=>t.reason!=='period-rollup'); const v=(cards.length||ru?.rollup?.netPnl!=null)?cards.reduce((s,t)=>s+(t.totalPnl??t.pnl??0),0)+(ru?.rollup?.netPnl??0):0; return (v>=0?'+':'')+v.toFixed(2)+' USDT'; })()"></div>

            @click="$store.chaser.showDangerZone=!$store.chaser.showDangerZone"
            :style="$store.chaser.showDangerZone?'color:var(--warn);border-color:rgba(240,192,96,.4)':''">

              @click="$refs.chAshfallImportInput.click()">

                const reader = new FileReader();
                reader.onload = e => {
                  try {
                    const parsed = JSON.parse(e.target.result);

                    $store.chaser._pendingImport = parsed;
                    $store.chaser.showImportConfirm = true;
                  } catch(err) {

            <div x-show="$store.chaser.logs.length===0" style="color:var(--text-lo);padding:4px 0;font-size:10px">No activity yet.</div>
          </div>
        </div>
        </div>
        </template>
      `,

      // Same layout contract as PseudoWinter's own col-pnl (sticky header, empty state, vanilla

      'alt-tab-trades-column': `
        <div style="position:sticky;top:0;z-index:3;background:var(--bg-panel);border-bottom:1px solid var(--border);padding:10px 13px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
          <div>
            <div class="sec-ttl" style="margin-bottom:2px">Chaser Trades <em id="ch-trade-count">0 closed</em></div>
            <div id="ch-trade-meta" style="font-family:var(--mono);font-size:9px;color:var(--text-lo);display:none"></div>
          </div>
          <button id="ch-trade-clear" class="btn btn-ghost" style="width:auto;font-size:9px;padding:3px 10px;letter-spacing:1px;display:none"
                  @click="if(confirm('Clear chaser trade history and session stats? This cannot be undone.'))$store.chaser.clearStats()">CLEAR</button>
        </div>
        <div x-data="{open:false}" x-show="$store.chaser.closedTrades.filter(t=>t.reason!=='period-rollup').length>=2" style="border-bottom:1px solid var(--border);flex-shrink:0">
          <div @click="open=!open" style="cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:4px 13px;user-select:none">
            <span style="font-family:var(--mono);font-size:8px;letter-spacing:1px;color:var(--text-lo)">PNL CHART</span>
            <span style="font-size:8px;color:var(--text-lo)" x-text="open?'▲':'▼'"></span>
          </div>
          <div x-show="open" style="padding:0 11px 8px"><div x-html="$store.chaser._pnlChartSvg()"></div></div>
        </div>
        <div id="ch-trade-empty" class="empty-state" style="flex:1">
          <div class="snowflake">🔆</div>
          <span>No closed chaser trades yet</span>
        </div>
        <div id="ch-trade-feed" style="padding:10px 11px;display:flex;flex-direction:column;gap:7px;"></div>
      `,
    },

    transform(def) {
      // No merge into PseudoWinter's own def — this plugin registers an independent Alpine
      // store instead (see the header comment). Nothing here needs to change on the host's
      // own component.
      return def;
    },
  };
})();
</script>
