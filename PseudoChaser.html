<!--
  PseudoChaser — as of v2.0.0, this is no longer a standalone page. It's a plugin (target
  bot: pseudowinter) that registers itself as an independent Alpine store ('chaser'), rather
  than merging into PseudoWinter's own component state the way Permafrost/Ashfall do. That's
  a deliberate architecture difference: Permafrost/Ashfall's footprint (a scorecard, a liq
  surveillance panel) is small enough to safely flat-merge via Object.assign. This store's
  footprint is nearly all of what used to be a full standalone app — position lifecycle,
  DCA, monitoring, closing, its own persistence — and PseudoChaser was itself a structural
  clone of PseudoWinter (same function names throughout), so flat-merging it would mean
  hundreds of colliding names, many with long-vs-short direction logic buried inside
  identically-named functions. A separate store sidesteps that entirely: this file's ~2700
  lines of ported business logic are UNCHANGED from the old standalone PseudoChaser.html
  internally (this.positions, this.cfg.X, this.pseudoOpenLong(), etc. all still just work,
  since `this` now refers to this store instead of a component). The only things genuinely
  reworked for this port:
    1. A short list of top-level globals that collided by name with PseudoWinter's own
       declarations — renamed with a ch prefix (see the block below).
    2. A longer list of globals that ALSO collided but were deliberately NOT renamed —
       instead simply not redeclared here, so they resolve to PseudoWinter's own already-
       loaded copies. This is what makes market data (ticker/kline fetches), the WS
       connection, and the shared-registry cache genuinely shared instead of duplicated,
       with zero new code: this store's existing _sharedRead('bulkTickers') check (ported
       unchanged) now resolves against PseudoWinter's own SHARED_KEY automatically.
    3. Its own sub-plugin loader (for Ashfall/MIC, both still declare targetBot: 'pseudochaser')
       is real as of v2.3.0 — it reuses PseudoWinter's own window.__pluginSystem.load/sort and
       the same re-execute-src-then-transform loop from PseudoWinter's tail IIFE, just applied
       to this store's object before Alpine.store() registration instead of to a window.pw
       function. See the alpine:init listener below. What's NOT built yet is a Plugin Manager
       UI panel inside the Chaser accordion for browsing/adding/removing them (this._pluginList,
       _pluginInit() — see the comment at that call site) — loading and UI are separate here,
       and only loading exists so far.
    4. Its own scan-scheduling loop (scheduleScan/_chCdTimer) is UNCHANGED and still runs on
       its own cfg.scanMins cadence — it doesn't need to be driven by PseudoWinter's scan
       cycle, because the shared-cache check above already prevents duplicate fetches
       regardless of which instance's timer fires first each cycle.
  Config (this.cfg) needed NO rename at all, unlike the globals above — it's a property on
  this store's own object, completely isolated from PseudoWinter's own this.cfg by virtue of
  being a different `this`. That's what was decided: chaser keeps its own full config
  namespace (position sizing, DCA, runtime, leverage, etc.), separate from Winter's.
-->
<script>
(function () {

  // ── Globals genuinely missing from the host page — kept as-is, no rename needed since
  //    PseudoWinter doesn't declare these under any name. ──
  function fmtAge(ts, _tick) {
    if (!ts) return '';
    const s = Math.floor((Date.now() - ts) / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sec = s % 60;
    return (h > 0 ? h + 'h ' : '') + m + 'm ' + String(sec).padStart(2,'0') + 's';
  }
  // Countdown-to helper: returns 'Xh Ym Zs' until targetMs, or '—' if past/invalid.
  function cdTo(targetMs, _tick) {
    if (!targetMs || !Number.isFinite(targetMs)) return '—';
    const rem = targetMs - Date.now();
    if (rem <= 0) return 'now';
    const h = Math.floor(rem / 3600000);
    const m = Math.floor((rem % 3600000) / 60000);
    const s = Math.floor((rem % 60000) / 1000);
    return (h > 0 ? h + 'h ' : '') + String(m).padStart(2,'0') + 'm ' + String(s).padStart(2,'0') + 's';
  }

  // ── Globals that WOULD collide with PseudoWinter's own identically-named declarations —
  //    renamed with a ch prefix. This is the complete list; everything else this store needs
  //    (SHARED_KEY, BOT_ID, _sharedChannel, BANLIST_TTL_MS, SHARED_REGISTRY_BYTE_CAP,
  //    _trimSharedRegistry, WS_URL, WS_FRESH_MS, _wsConn and friends, _wsSend, _wsResync,
  //    _wsEnsureOpen, wsWatchSymbols, wsTicker, fmtP, showApp, showError) is deliberately NOT
  //    redeclared here — those bare identifiers fall through to PseudoWinter's own already-
  //    loaded globals of the same name. That's not a workaround, it's the actual mechanism
  //    that makes market data, the WS connection, and the shared-registry cache genuinely
  //    shared rather than duplicated: this store's _sharedRead('bulkTickers') call (below,
  //    ported unchanged from PseudoChaser) resolves against PseudoWinter's own SHARED_KEY,
  //    so whichever instance's scan cycle fires first each cycle does the real fetch and the
  //    other reads the cache — the exact mechanism the decoupling pass (v1.61→1.62) built for
  //    the old cross-page Permafrost/Ashfall pairing, now doing the same job intra-page. ──
  const CH_LS_KEY = 'pc_v1';
  const _chClosingIds = new Set();
  let _chAuditRunning = false;
  let _chCdTimer          = null;
  let _chWatchTimer       = null;
  let _chRefreshTimer     = null;
  let _chAudioTimer       = null;

function chFactory() { return {
  showSetup: false,
  creds: { key:'', secret:'' },
  cfg: {
    leverage:6, minNotional:6, addNotional:6,
    maxPos:5, scanMins:10, topN:25,
    bulkTickerCooldownEnabled: true, bulkTickerCooldownHours: 3,
    restPollEnabled: true, restPollBaseSec: 5,
    entryTpRoi: 18,    // TP ROI % — the single TP target (bufferedEV basis), parallel with the SL %
    runtimeHours: 1,

    // ── FUN (Fund Chasing) Strategy — LONG: negative funding ──
          // enable fund-chasing strategy
       // high-fund threshold % magnitude (HFG 2× / HFL 1×) — entry requires FR ≤ -this value
      // low-fund threshold % magnitude (LFS 2× / LFP 1×) — entry requires FR ≤ -this value
   // FR sign for surge entries: 'pos' = positive FR, 'neg' = negative FR
   // FR sign for plunge entries: 'pos' = positive FR, 'neg' = negative FR
       // notional multiplier (slot cost) for surge FUN entries
       // notional multiplier (slot cost) for plunge FUN entries
    // ── Sale Fishing Strategy ──
           // enable sale fishing — surge (1×) or plunge (2×) depending on RSI classification
            // 1h LBA spike cap % — block if last candle > avg by more than this
           // % of sfLbaLimit to step per close (creep rate)
            // minimum LBA % required for gainer-band entries
                // SalF surge (all RSIs ≥ 50) margin multiplier — default 1×
               // SalF plunge (all RSIs < 50) margin multiplier — default 2×
           // min candles (of last 4) for SalF ClC gate — green for LBA, red for LSA
            // surges: LSA (token vol vs 24h token avg) + red ClC; OFF = LBA + green ClC
             // plunges: LSA (token vol vs 24h token avg) + red ClC; OFF = LBA + green ClC
            // floor % for TP ingress reduction
 // each DCA add escalates by configured multiplier from Add1 (e.g. 2 = ×2, ×4, ×8; 3 = ×3, ×9, ×27)
          // per-stage notional multiplier (Add1 = ×m, Add2 = ×m², …AddN = ×mᴺ)
 // each later add grows by one entry unit (Add1 ×1, Add2 ×2 … AddN ×N)
    dcaStages: 3,             // integer stage count; slider allows [3,6,7,...,18]; 4/5 not valid
    drawdownThrottleEnabled: true,  // halt new position entry if 6h rolling PnL drops below drawdownFactor × entry margin
    drawdownFactor: 0.5,            // loss threshold as a multiple of entry margin (e.g. 0.5 = −$0.50 per $1 margin)
    drawdownHaltHours: 6,           // how long the drawdown halt lasts (hours)
    drawdownBailEnabled: true,      // bail all open positions immediately when the drawdown throttle triggers
    gainsLockEnabled: false,         // halt new entries when 6hr rolling PnL ≥ +(factor × entry margin)
    gainsLockFactor: 1.0,            // profit factor as multiple of entry margin (default 1.0×)
    gainsLockHours: 6,               // how long the gains lock lasts (hours)
    binaryModeEnabled: true,         // binary risk: TP + SL set at entry, no DCA orders
    binaryTpPct: 50,                 // binary mode take-profit % (leverage-adjusted ROI)
    binarySlPct: 50,                 // binary mode stop-loss % (leverage-adjusted ROI)
  },
  connected: { api:true },
  ui: { scanning:false, refreshing:false },
  acct: { balance:null, available:null, upnl:null },
  positions: [],
  savedPositions: [],
  _persistGen: 0,      // monotonic save counter — detects a stale/concurrent tab writing over us
  _persistFailed: false, // true when the last persist() didn't verifiably land on disk
  logs: [],
  closedTrades: [],  // history of simulated closed positions
  _tickerGraylist: {},  // symbol → { ts, isWin }; blocks re-entry for one bulk-ticker cooldown window
  sess: { trades:0, wins:0, losses:0, forceClose:0, winPnlSum:0, lossPnlSum:0 },

  mobTab: 'config',
  // ── PC overlay-menu system (config/stats/trades float over the market view; market is always base @ 100%) ──
  overlayLeft:  'config', // which menu ('config'|'stats'|'trades'|null) occupies the left overlay slot — config open by default on launch
  overlayRight: null,     // which menu occupies the right overlay slot
  overlayTurn:  'right',  // which slot gets replaced next time BOTH slots are already occupied and a new (closed) overlay is opened
  tick: 0,           // increments every second — forces Alpine to re-evaluate timer expressions
  _instrCache: {},   // symbol → { minQty, qtyStep, tickSize, ... } — null = unsupported (cleared on reconnect)
  _klineCache: {},   // symbol_interval → { closes[], timestamps[], lastCompletedTs, ts } — cached per completed 15m bar; shared across RSI6/12/24 calls for same symbol
  _lastTickerFetch: 0, // timestamp of last last per-symbol REST ticker fallback round in pseudoWatchPositions
  _lastAllTickers:   [], // last full bulk ticker response — shared with runScheduledCycle and strategy plugin scan passes
  _lastAllTickersAt: 0,  // epoch ms when _lastAllTickers was fetched
  _mktWatch:         [], // top-N tickers from last bulk scan, live-refreshed each cycle
  _symbolBanlist: {}, // symbol → { reason, setAt } — temporary one-week scan exclusion
  _cycleRunning: false, // re-entry guard for runScheduledCycle
  _haltLoggedKind: null, // last halt kind logged — suppresses repeat log lines until kind changes
  _roleBadgeProviders: [], // plugins push (item)=>htmlString|null here to render their own position role badge (FIRE, etc.)
  // Close-reason → badge label shown on closed-trade cards. Built-ins seeded below; plugins
  // add their own via registerCloseReason() instead of the host hardcoding every reason.
  // Convention: labels should be a short truncated form (e.g. 'substitution' → 'Sub'), not the
  // raw reason string — that's what makes the badge scan-able at a glance in the trades list.
  _closeReasonLabels: { tp: 'TP', sl: 'SL', force: 'FORCE', laggard: 'EDa' },
  _drawdownWindow: [],  // { pnl, ts }[] — rolling 6h closed-trade PnL log for drawdown throttle
  _drawdownHaltUntil: 0, // epoch ms — new position entry blocked until this timestamp
  _manualHalt: false,    // user-initiated halt — blocks scans identically to a drawdown halt
  _gainsWindow: [],      // { pnl, ts }[] — rolling 6h closed-trade PnL log for gains lock
  _gainsLockHaltUntil: 0, // epoch ms — new entries locked until this timestamp
  _symData:       {}, // symbol → { fundingRate, lastPrice, ts } — per-symbol live data; written by any fetch path, read by all watchlists/display
  cfgOpen: { general: false, laggard: false }, // accordion open state
  tSc: false, tH: false, tSz: false,
  _pluginMgrOpen: false,
  _pluginList: [],
  _pluginConflicts: [],
  _pluginNotices: [],
  _pluginFileErr: '',
  showDangerZone: false,    // toggle for destructive action buttons in Persistence section
  showStorageBreakdown: false, // toggle for the localStorage usage-by-plugin readout
  showPowerUsage: false,    // toggle for the main-thread tick-cost readout
  _tickCostSamples: [],     // rolling window of ms spent per 1s tick (incl. reactive re-render), for Power usage
  showImportConfirm: false, // toggle for import data confirmation modal
  showExportMenu: false,    // toggle for export type selection popup
  _pendingImport: null,    // parsed JSON payload awaiting user confirmation
  _lastImportAt: null,      // timestamp of last successful import — used to suppress phantom abort log within 5s
  cfgLocked: true,         // config column inputs locked by default
  bot: { running:false, startTime:null, lastScan:'', lastScanAt:0, scanCd:0, scanPct:100 },
  _tradingSuspended: false, // set by _chSetOperationalMode — see pseudoOpenLong's comment
  audioState: 'off', // 'off' | 'running' | 'suspended'
  themeEmoji: '🔆',
  appName: 'PSEUDOCHASER',
  botLabel: 'Sim',

  get base() { return 'https://api.bybit.com'; },

  setThemeEmoji(emoji) {
    this.themeEmoji = emoji;
    document.title = document.title.replace(/^\S+/, emoji);
  },

  // ── Stubs for PseudoWinter-only systems not present in PseudoChaser ─────────
  pruneTpIngress()         { /* no TP ingress queue in PC */ },
  _stopAllIftPollers()     { /* IFT pollers not used in PC */ },
  setTP(pos, price)        { /* live TP placement not used in PC — sim only */ return Promise.resolve(); },

  // ── Format helpers ──────────────────────────────────────────────────────────
  fmtDur(ms) {
    if (!ms || !Number.isFinite(ms)) return '—';
    const s = Math.floor(ms / 1000);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    const sc = s % 60;
    return s < 60  ? sc + 's'
         : s < 3600 ? m + 'm ' + String(sc).padStart(2,'0') + 's'
         : h + 'h ' + String(m).padStart(2,'0') + 'm';
  },

  fmtTs(ms) {
    if (!ms || !Number.isFinite(ms)) return '—';
    const d = new Date(ms);
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' + d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  },

    _sharedRead(type) {
      try { return (JSON.parse(localStorage.getItem(SHARED_KEY) || '{}'))[type] ?? null; } catch(_) { return null; }
    },
    _sharedWrite(type, data) {
      try {
        let reg = JSON.parse(localStorage.getItem(SHARED_KEY) || '{}');
        reg[type] = { data, ts: Date.now(), by: BOT_ID };
        reg = _trimSharedRegistry(reg);
        localStorage.setItem(SHARED_KEY, JSON.stringify(reg));
        _sharedChannel?.postMessage({ type, ts: Date.now(), by: BOT_ID });
      } catch(_) {}
    },
    _sharedMerge(type, patch, extra) {
      try {
        let reg = JSON.parse(localStorage.getItem(SHARED_KEY) || '{}');
        reg[type] = { ...(reg[type] || {}), ...extra, data: { ...(reg[type]?.data || {}), ...patch }, ts: Date.now(), by: BOT_ID };
        reg = _trimSharedRegistry(reg);
        localStorage.setItem(SHARED_KEY, JSON.stringify(reg));
        _sharedChannel?.postMessage({ type, ts: Date.now(), by: BOT_ID });
      } catch(_) {}
    },
    _seedFromTickers(allTickers) {
      const now_fr = Date.now();
      for (const t of allTickers) {
        if (!t.symbol || t.fundingRate == null) continue;
        this._klineCache[`fr_${t.symbol}`] = {
          rate:       parseFloat(t.fundingRate) * 100,
          intervalMs: t.fundingIntervalHour ? parseInt(t.fundingIntervalHour, 10) * 3600000 : 8 * 3600000,
          ts:         now_fr,
        };
        if (t.lastPrice != null) {
          const _lp = parseFloat(t.lastPrice || 0);
          if (_lp > 0) this.symDataWrite(t.symbol, { lastPrice: _lp });
        }
      }
      if (this.cfg.mktWatchEnabled !== false) {
        const _mwFiltered = allTickers
          .filter(t => t.symbol.endsWith('USDT') && t.symbol !== 'BTCUSDT' && parseFloat(t.lastPrice || 0) > 0 && !this._isSymbolBanned?.(t.symbol));
        for (let i = _mwFiltered.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [_mwFiltered[i], _mwFiltered[j]] = [_mwFiltered[j], _mwFiltered[i]];
        }
        this._mktWatch = _mwFiltered.slice(0, this.cfg.mktWatchSize ?? 5).map(t => ({
          symbol:       t.symbol,
          lastPrice:    parseFloat(t.lastPrice    || 0),
          fundingRate:  parseFloat(t.fundingRate  || 0),
          price24hPcnt: parseFloat(t.price24hPcnt || 0),
          turnover24h:  parseFloat(t.turnover24h  || 0),
          updatedAt:    Date.now(),
        }));
      }
    },
    symDataWrite(symbol, patch) {
    const prev = this._symData[symbol] || {};
    this._symData[symbol] = { ...prev, ...patch, ts: Date.now() };
  },
  symDataRead(symbol, field) {
    return this._symData[symbol]?.[field] ?? null;
  },

  // Fetch instrument info (lot size, tick size, min notional) for a symbol.
  // Cached indefinitely per session (instrument specs don't change mid-session).
  // Returns null if the symbol is unsupported or the fetch fails.
  async getInstrInfo(symbol) {
    if (symbol in this._instrCache) return this._instrCache[symbol]; // null = known unsupported
    try {
      const url = `${this.base}/v5/market/instruments-info?category=linear&symbol=${symbol}`;
      const res = await fetch(url);
      const js  = await res.json();
      if (js.retCode !== 0) throw new Error(js.retMsg);
      const item = js.result?.list?.[0];
      if (!item) { this._instrCache[symbol] = null; return null; }
      const lf = item.lotSizeFilter  || {};
      const pf = item.priceFilter    || {};
      const instr = {
        minQty:      parseFloat(lf.minOrderQty     || 0),
        qtyStep:     parseFloat(lf.qtyStep         || lf.minOrderQty || 0.001),
        minOrderAmt: parseFloat(lf.minNotionalValue|| 0),
        tickSize:    parseFloat(pf.tickSize        || 0),
        minPrice:    parseFloat(pf.minPrice        || 0),
      };
      this._instrCache[symbol] = instr;
      return instr;
    } catch(e) {
      this.log(`[INSTR-01] ${symbol}: instrument info fetch failed — ${e.message}`, 'warn');
      return null;
    }
  },

  // Round qty down to the nearest qtyStep.
  snapQty(qty, instr) {
    if (!instr?.qtyStep || instr.qtyStep <= 0) return parseFloat(qty.toFixed(8));
    const step = instr.qtyStep;
    const snapped = Math.floor(qty / step) * step;
    // Determine decimal places from step to avoid floating-point drift
    const dp = (step.toString().split('.')[1] || '').length;
    return parseFloat(snapped.toFixed(dp));
  },

  // Round price to the nearest tickSize (rounds to nearest, not floor, for TP/SL accuracy).
  snapPrice(price, instr) {
    if (!instr?.tickSize || instr.tickSize <= 0) return parseFloat(price.toFixed(8));
    const tick = instr.tickSize;
    const snapped = Math.round(price / tick) * tick;
    const dp = (tick.toString().split('.')[1] || '').length;
    return parseFloat(snapped.toFixed(dp));
  },

  // Return the current funding rate (%) for a symbol.
  // Prefers the fr_ cache seeded by bulk tickers in runScan, then the live WS
  // ticker feed; falls back to a single-symbol ticker fetch if both are cold.
  async fetchFundingRate(symbol) {
    const CACHE_TTL = 5 * 60 * 1000;
    const cacheKey  = `fr_${symbol}`;
    const cached    = this._klineCache[cacheKey];
    if (cached?.rate != null && (Date.now() - cached.ts) < CACHE_TTL) {
      return cached.rate; // already multiplied ×100 when seeded
    }
    // WS tickers don't carry fundingIntervalHour — use them only when intervalMs is
    // already cached, so the fr_ entry always stays complete for calcFundingFee.
    const wt = wsTicker(symbol);
    if (wt && wt.fundingRate != null && cached?.intervalMs) {
      const rate = parseFloat(wt.fundingRate) * 100;
      this._klineCache[cacheKey] = { rate, intervalMs: cached.intervalMs, ts: Date.now() };
      return rate;
    }
    const url = `${this.base}/v5/market/tickers?category=linear&symbol=${symbol}`;
    const res = await fetch(url);
    const js  = await res.json();
    if (js.retCode !== 0) throw new Error(js.retMsg);
    const t   = js.result?.list?.[0];
    if (!t)    throw new Error('no ticker data');
    const rate       = parseFloat(t.fundingRate) * 100;
    const intervalMs = t.fundingIntervalHour
      ? parseInt(t.fundingIntervalHour, 10) * 3600000
      : 8 * 3600000;
    this._klineCache[cacheKey] = { rate, intervalMs, ts: Date.now(), change24h: parseFloat(t.price24hPcnt || 0) * 100, lastPrice: parseFloat(t.lastPrice || 0) };
    return rate;
  },

  // Compute the total funding fee owed for a position at closeMs.
  // Returns { fundingFee, fundingRate, fundingIntervals }.
  async calcFundingFee(pos, closeMs) {
    // Always fetch to guarantee we have the real intervalMs — fetchFundingRate
    // reads from the fr_ cache (seeded for free by runScan bulk tickers) so this
    // is effectively free when the cache is warm, and falls back to a live ticker
    // fetch when cold. No hardcoded interval default.
    let fundingRate, intervalMs;
    try {
      fundingRate = await this.fetchFundingRate(pos.symbol);
      const cached = this._klineCache[`fr_${pos.symbol}`];
      intervalMs   = cached?.intervalMs;
      if (!intervalMs) throw new Error('intervalMs missing from cache after fetch');
    } catch(e) {
      this.log(`[PC-FUNDING-01] ${pos.symbol}: funding interval unavailable — ${e.message}`, 'warn');
      return { fundingFee: 0, fundingRate: pos.fundingRate ?? null, fundingIntervals: 0 };
    }
    if (fundingRate == null) return { fundingFee: 0, fundingRate: null, fundingIntervals: 0 };
    const openedAt         = pos.openedAt ?? closeMs;
    const firstInterval    = Math.ceil(openedAt / intervalMs);
    const lastInterval     = Math.floor(closeMs  / intervalMs);
    const fundingIntervals = Math.max(0, lastInterval - firstInterval + 1);
    const notional         = (pos.markPrice || pos.entryPrice) * (pos.totalSize || 0);
    // LONG: positive funding rate = longs pay shorts (negative fee for us)
    const fundingFee       = -(fundingRate / 100) * notional * fundingIntervals;
    return { fundingFee, fundingRate, fundingIntervals };
  },

  // Fetch 1-minute klines between fromMs and toMs (used by whiplash audit).
  async pseudoFetchKlines(symbol, fromMs, toMs) {
    try {
      const limit = Math.ceil((toMs - fromMs) / 60000) + 2;
      const url   = `${this.base}/v5/market/kline?category=linear&symbol=${symbol}&interval=1&limit=${Math.min(limit, 200)}&start=${fromMs}&end=${toMs}`;
      const res   = await fetch(url);
      const js    = await res.json();
      if (js.retCode !== 0) throw new Error(js.retMsg);
      return (js.result?.list || []).map(r => ({
        t: parseInt(r[0]),
        o: parseFloat(r[1]),
        h: parseFloat(r[2]),
        l: parseFloat(r[3]),
        c: parseFloat(r[4]),
      }));
    } catch (e) {
      this.log(`[KLINE-01] ${symbol}: kline fetch failed — ${e.message}`, 'warn');
      return [];
    }
  },

  init() {
    if (this._initDone) return;
    this._initDone = true;
    // Populates this store's OWN Plugin Manager list (filtered to pseudochaser-targeted
    // entries — see _pluginInit above). Separate from actually loading sub-plugins: that
    // already happens in this file's alpine:init listener, before this init() runs, via the
    // sub-plugin loader that applies Ashfall/MIC's transform() to this object. This call is
    // just for the management UI (browse/add/remove) inside the Chaser accordion.
    this._pluginInit();
    try {
      document.getElementById('pw-load-status').textContent = 'LOADING SAVED STATE...';
      this.loadSaved();
      this._pruneRetiredCfg();
      if (this.cfg.mktWatchEnabled === undefined) this.cfg.mktWatchEnabled = true;
      if (this.cfg.mktWatchSize    === undefined) this.cfg.mktWatchSize    = 5;
      if (this.cfg.mktWatchSort    === undefined) this.cfg.mktWatchSort    = 'highest';
      // Default 'winter' matches pre-merger behavior for anyone upgrading — Winter ran, Chaser
      // didn't exist. Applied below via _chApplyOperationalMode, not just left as a display
      // default — without this, _tradingSuspended would silently reset to false on both sides
      // every reload regardless of what was last selected, until the user re-clicked the
      // control.
      if (this.cfg.chOperationalMode === undefined) this.cfg.chOperationalMode = 'winter';
      this._tradingSuspended = !(this.cfg.chOperationalMode === 'chaser' || this.cfg.chOperationalMode === 'both');
      // Winter's half of the apply is deferred: this init() runs synchronously inside the
      // alpine:init listener, before Alpine has mounted PW's own #pw-app component — calling
      // Alpine.$data() on it here would hit an unmounted element. setTimeout(...,0) runs after
      // Alpine's own synchronous initial-mount pass completes.
      setTimeout(() => {
        const pw = window.Alpine?.$data?.(document.getElementById('pw-app'));
        if (pw) pw._tradingSuspended = !(this.cfg.chOperationalMode === 'winter' || this.cfg.chOperationalMode === 'both');
      }, 0);
      document.getElementById('pw-load-status').textContent = 'READY';
      setTimeout(() => showApp(), 400);
      this.log(`[INI] ${this.themeEmoji} PseudoChaser initialised.` + (this.savedPositions.length
        ? ' ' + this.savedPositions.length + ' saved position(s) restored.'
        : ' Ready — uses public Bybit market data, no API key required.'), 'info');
      setInterval(()=>{
        const _tickT0 = performance.now();
        this.tick++;
        this.pruneTpIngress();
        // Self-heal: if the in-memory position count has drifted from what was last
        // confirmed saved (a failed/clobbered write), retry every 5s until it recovers.
        if (this.tick % 5 === 0 && this.positions.length !== this.savedPositions.length) {
          this.persist();
        }
        // Measured after $nextTick, not right after tick++, since Alpine flushes the
        // reactive re-render (every x-html/x-text bound to `tick`, across the bot and any
        // loaded plugins) asynchronously — that flush is the actual cost the Power usage
        // panel is meant to surface, not the increment itself.
        // Falls back to calling immediately if $nextTick isn't bound — this store's init()
        // runs from a plain alpine:init listener, not from directive evaluation, so whether
        // Alpine's magics attach to store methods invoked that way is unverified; this way
        // a missing $nextTick loses only the timing precision, not the whole tick loop.
        const _chTickDone = () => {
          this._tickCostSamples.push(performance.now() - _tickT0);
          if (this._tickCostSamples.length > 20) this._tickCostSamples.shift();
        };
        if (this.$nextTick) this.$nextTick(_chTickDone); else _chTickDone();
      }, 1000);

      // Start position watcher immediately — no API key needed
      if (!_chWatchTimer) {
        _chWatchTimer = setInterval(() => this.pseudoWatchPositions(), 5000);
      }
      document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState !== 'visible') return;

        if (this.bot.running) {
          const elapsed = Date.now() - this.bot.lastScanAt;
          if (elapsed >= this.cfg.scanMins * 60 * 1000) {
            this.log('[INI] Scan overdue (app was backgrounded) — scanning now.', 'info');
            await this.runScheduledCycle();
          }
        }

        if (this.positions.length) {
          await this.pseudoWatchPositions();
        }

        if (this.bot.running) await this.resumeKeepalive();
      });
    } catch(e) {
      showError('Init error: ' + (e.message || String(e)));
    }
  },

  // ── PERIOD ROLLUP — compacts oldest individual trades when cap is hit ──
  _compactClosedTrades() {
    const KEEP = 50;
    const realCloses  = this.closedTrades.filter(t => t.reason !== 'period-rollup');
    const allCards = [...realCloses].sort((a, b) =>
      (b.closedAt ?? b.time ?? 0) - (a.closedAt ?? a.time ?? 0)
    );
    if (allCards.length <= KEEP) return;

    const toKeep    = allCards.slice(0, KEEP);
    const toCompact = allCards.slice(KEEP);
    const existing  = this.closedTrades.find(t => t.reason === 'period-rollup');

    let count = 0, netPnl = 0, totalMargin = 0, wins = 0, winPnlSum = 0, lossPnlSum = 0, dcaSum = 0, durSum = 0;
    let bestRoi = null, worstRoi = null, bestPnl = null, worstPnl = null;
    let openedAt = null, closedAt = null;
    const symCounts = {};

    const updateExtremes = (sym, pnlPct, totalPnl) => {
      if (!bestRoi  || pnlPct  > bestRoi.pnlPct)    bestRoi  = { sym, pnlPct };
      if (!worstRoi || pnlPct  < worstRoi.pnlPct)   worstRoi = { sym, pnlPct };
      if (!bestPnl  || totalPnl > bestPnl.totalPnl)  bestPnl  = { sym, totalPnl };
      if (!worstPnl || totalPnl < worstPnl.totalPnl) worstPnl = { sym, totalPnl };
    };
    const mergeTs = (oa, ca) => {
      if (oa != null && (!openedAt || oa < openedAt)) openedAt = oa;
      if (ca != null && (!closedAt || ca > closedAt)) closedAt = ca;
    };

    if (existing?.rollup) {
      const r = existing.rollup, rc = r.count || 0;
      count += rc; netPnl += r.netPnl || 0; totalMargin += r.totalMargin || 0;
      wins += r.wins || 0;
      if (r.winPnlSum != null || r.lossPnlSum != null) { winPnlSum += r.winPnlSum || 0; lossPnlSum += r.lossPnlSum || 0; }
      else if ((r.netPnl || 0) >= 0) winPnlSum += r.netPnl || 0;
      else lossPnlSum += Math.abs(r.netPnl || 0);
      dcaSum += (r.avgDcaStage || 0) * rc; durSum += (r.avgDuration || 0) * rc;
      (r.tickers || []).forEach(raw => {
        const m = raw.match(/^(.+?)×(\d+)$/);
        const sym = m ? m[1] : raw, n = m ? parseInt(m[2]) : 1;
        symCounts[sym] = (symCounts[sym] || 0) + n;
      });
      if (r.bestByRoi)  updateExtremes(r.bestByRoi.sym,  r.bestByRoi.pnlPct,  r.bestByRoi.totalPnl  ?? 0);
      if (r.worstByRoi) updateExtremes(r.worstByRoi.sym, r.worstByRoi.pnlPct, r.worstByRoi.totalPnl ?? 0);
      if (r.bestByPnl  && (!bestPnl  || r.bestByPnl.totalPnl  > (bestPnl?.totalPnl  ?? -Infinity))) bestPnl  = r.bestByPnl;
      if (r.worstByPnl && (!worstPnl || r.worstByPnl.totalPnl < (worstPnl?.totalPnl ??  Infinity))) worstPnl = r.worstByPnl;
      mergeTs(r.openedAt, r.closedAt);
    }

    toCompact.forEach(t => {
      const sym = t.symbol.replace('USDT', '');
      symCounts[sym] = (symCounts[sym] || 0) + 1;
      const tp = t.totalPnl ?? t.pnl ?? 0, pp = t.pnlPct ?? 0;
      netPnl += tp;
      count++; totalMargin += t.margin ?? 0;
      if (tp >= 0) winPnlSum += tp; else lossPnlSum += Math.abs(tp);
      wins += tp > 0 ? 1 : 0; dcaSum += t.dcaStage ?? 0; durSum += t.duration ?? 0;
      updateExtremes(sym, pp, tp);
      mergeTs(t.closedAt && t.duration ? t.closedAt - t.duration : t.closedAt, t.closedAt);
    });

    const rollup = {
      count, netPnl, totalMargin, wins, winPnlSum, lossPnlSum,
      netRoi: totalMargin > 0 ? (netPnl / totalMargin) * 100 : 0,
      avgDcaStage: count > 0 ? dcaSum / count : 0,
      avgDuration: count > 0 ? durSum / count : 0,
      tickers: Object.entries(symCounts).map(([s, n]) => n > 1 ? `${s}×${n}` : s),
      bestByRoi: bestRoi, worstByRoi: worstRoi,
      bestByPnl: bestPnl, worstByPnl: worstPnl,
      openedAt, closedAt,
    };

    this.closedTrades = [
      ...toKeep,
      { id: 'period_rollup_' + Date.now(), reason: 'period-rollup', closedAt, totalPnl: netPnl, rollup },
    ];
  },

  // ── TEMPORARY SYMBOL BANLIST ──
  // New entries expire after one week by default. Entries may carry an optional
  // `ttl` field (ms) to override the default.
  // Legacy string-only entries are intentionally not migrated on load so previously
  // permanent bans are re-evaluated next launch.
  _normalizeBanEntry(entry) {
    if (!entry || typeof entry !== 'object') return null;
    const setAt = Number(entry.setAt);
    if (!Number.isFinite(setAt)) return null;
    const ttl = Number.isFinite(entry.ttl) ? entry.ttl : BANLIST_TTL_MS;
    if ((Date.now() - setAt) >= ttl) return null;
    return { reason: String(entry.reason || 'banned'), setAt, ...(Number.isFinite(entry.ttl) ? { ttl: entry.ttl } : {}) };
  },

  _loadSymbolBanlist(saved) {
    this._symbolBanlist = {};
    if (!saved || typeof saved !== 'object') return;
    for (const [symbol, entry] of Object.entries(saved)) {
      const normalized = this._normalizeBanEntry(entry);
      if (normalized) this._symbolBanlist[symbol] = normalized;
    }
  },

  _banSymbol(symbol, reason, ttlMs = null) {
    if (!symbol) return;
    this._symbolBanlist[symbol] = { reason: String(reason || 'banned'), setAt: Date.now(), ...(ttlMs != null ? { ttl: ttlMs } : {}) };
  },

  _banReason(symbol) {
    const entry = this._symbolBanlist?.[symbol];
    const normalized = this._normalizeBanEntry(entry);
    if (!normalized) {
      if (entry) delete this._symbolBanlist[symbol];
      return null;
    }
    if (entry !== normalized) this._symbolBanlist[symbol] = normalized;
    return normalized.reason;
  },

  _isSymbolBanned(symbol) {
    return !!this._banReason(symbol);
  },

  // Reads every localStorage key under this origin and buckets it by which part of the
  // app owns it, so storage bloat (e.g. an unbounded plugin cache) can be spotted at a
  // glance instead of guessing from the total quota alone. Shared by the on-screen
  // breakdown and the export-to-file button so both report the same numbers.
  _storageRows() {
    const byteSize = v => { try { return new Blob([v]).size; } catch(e) { return (v||'').length; } };
    // Every localStorage key maps to exactly one atomized data-type row — deliberately
    // granular (liq samples separate from structure wave, separate from OC samples, etc.)
    // so a single bloated data type is visible on its own instead of hiding inside a
    // whole-plugin lump sum, matching the per-type 200KB cap plugins enforce on write.
    const singleKeyMap = {
      [CH_LS_KEY]:                    'This Bot (PseudoChaser): core state',
      'pc_v1_log':                 'This Bot (PseudoChaser): activity log',
      '__pc_plugins_v1':           'This Bot (PseudoChaser): plugin config',
      'pw_v1':                     'PseudoWinter (partner): core state',
      'pw_v1_log':                 'PseudoWinter (partner): activity log',
      '__pw_plugins_v1':           'PseudoWinter (partner): plugin config',
      '__pf_liq_batches':          'Permafrost: liq batches (in-progress)',
      '__pf_liq_history':          'Permafrost: liquidation samples',
      '__pf_oc_history':           'Permafrost: OC samples',
      '__pfr_scorecard_v1':        'Permafrost: scorecard',
      '__pfr_kline_log_v1':        'Permafrost: kline log',
      '__ash_liq_batches':         'Ashfall: liq batches (in-progress)',
      '__ash_liq_history':         'Ashfall: liquidation samples',
      '__ash_oc_history':          'Ashfall: OC samples',
      '__ash_scorecard_v1':        'Ashfall: scorecard',
      '__ash_kline_log_v1':        'Ashfall: kline log',
      '__ew_shared_v1_chaser':     'This Bot (PseudoChaser): shared registry',
      '__ew_shared_v1_winter':     'PseudoWinter (partner): shared registry',
      '__cgCoinList':              'Market Cap Cache: CoinGecko',
      '__cpCoinList':              'Market Cap Cache: CoinPaprika',
      '__miw_hist_batches':        'MultiIndicator (Winter): hist batches',
      '__mic_hist_batches':        'MultiIndicator (Chaser): hist batches',
    };
    // These two keys bundle several distinct data types into one JSON blob — break each
    // field out into its own row rather than reporting one combined "Permafrost"/"Ashfall" figure.
    const blobFieldMap = {
      '__permafrost_winter_v1': { prefix: 'Permafrost', fields: { wave: 'structure wave', closes: 'closed-trade samples', events: 'events (legacy)', volHistory: 'volume history', oiHistory: 'OI/MC history', pfKlineBar: 'kline bar snapshot' } },
      '__ashfall_chaser_v1':    { prefix: 'Ashfall',    fields: { wave: 'structure wave', closes: 'closed-trade samples', events: 'events (legacy)', volHistory: 'volume history', oiHistory: 'OI/MC history', afKlineBar: 'kline bar snapshot' } },
    };
    const rows = {};
    let grand = 0;
    const addRow = (label, bytes) => { rows[label] = (rows[label] || 0) + bytes; };
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      const v = localStorage.getItem(k) || '';
      const bytes = byteSize(v);
      grand += bytes;
      const blob = blobFieldMap[k];
      if (blob) {
        let accounted = 0;
        try {
          const parsed = JSON.parse(v);
          for (const [field, label] of Object.entries(blob.fields)) {
            if (parsed[field] === undefined) continue;
            const fbytes = byteSize(JSON.stringify(parsed[field]));
            addRow(`${blob.prefix}: ${label}`, fbytes);
            accounted += fbytes;
          }
        } catch(e) {}
        const overhead = Math.max(0, bytes - accounted);
        if (overhead > 0) addRow(`${blob.prefix}: structure overhead`, overhead);
        continue;
      }
      addRow(singleKeyMap[k] || 'Other', bytes);
    }
    return { rows, grand };
  },
  // `shown` mirrors the pattern used for the analytics plugins' chart builders: without it,
  // Alpine still evaluates this on every tick even while the dropdown is collapsed, and this
  // one is expensive — it Blob-sizes every localStorage value (megabytes' worth, once storage
  // grows) plus a JSON.parse/re-stringify of the two Permafrost/Ashfall blobs, every second,
  // regardless of visibility. Alpine's own dependency tracking (which reactive property was
  // read) doesn't help here since the cost comes from localStorage, not a tracked property —
  // so unlike the chart fixes, this still needs the tick read, just gated on visibility.
  _storageBreakdown(shown) {
    if (!shown) return '';
    void this.tick;
    const fmt = b => b >= 1048576 ? (b/1048576).toFixed(2)+' MB' : b >= 1024 ? (b/1024).toFixed(1)+' KB' : b+' B';
    const { rows, grand } = this._storageRows();
    const TYPE_WARN_BYTES = 200 * 1024;
    const rowsHtml = Object.entries(rows).sort((a,b) => b[1]-a[1]).map(([name,bytes]) => {
      const over = bytes > TYPE_WARN_BYTES;
      const clr = over ? 'var(--short)' : 'var(--ice)';
      return `<div style="display:flex;justify-content:space-between;gap:8px"><span style="color:${over?'var(--short)':'var(--text-lo)'}">${name}</span><span style="color:${clr}">${fmt(bytes)}</span></div>`;
    }).join('');
    return rowsHtml + `<div style="display:flex;justify-content:space-between;gap:8px;margin-top:3px;padding-top:3px;border-top:1px solid rgba(255,255,255,.08)"><span>Total</span><span style="color:var(--ice)">${fmt(grand)}</span></div>`;
  },
  // Dumps the same numbers as _storageBreakdown() to a downloadable .txt file — the
  // on-screen rows live inside an x-html block that's unreliable to click-drag select,
  // so this is the actual "get this data out to paste elsewhere" path.
  _exportStorageBreakdown() {
    const fmt = b => b >= 1048576 ? (b/1048576).toFixed(2)+' MB' : b >= 1024 ? (b/1024).toFixed(1)+' KB' : b+' B';
    const { rows, grand } = this._storageRows();
    const sorted = Object.entries(rows).sort((a,b) => b[1]-a[1]);
    const lines = [
      `EverWinter storage usage — PseudoChaser — ${new Date().toISOString()}`,
      '',
      ...sorted.map(([name,bytes]) => `${fmt(bytes).padStart(10)}  (${bytes} B)  ${name}`),
      '',
      `${fmt(grand).padStart(10)}  (${grand} B)  Total`,
    ];
    const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `pseudochaser-storage-${new Date().toISOString().replace(/[:.]/g,'-')}.txt`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  },

  // Main-thread cost of each 1s tick — the increment itself is free, what actually costs time
  // is every x-html/x-text bound to `tick` (or a plugin's own slower tick) re-rendering, which
  // for a chart-heavy analytics plugin can mean rebuilding SVG strings over hundreds of history
  // points. Browsers don't expose real CPU%, so this self-timed wall-clock figure is the
  // closest practical proxy — high or rising values mean something reactive is doing more work
  // than it needs to, which is exactly the class of bug this panel exists to catch.
  _powerUsageHtml(shown) {
    if (!shown) return '';
    void this.tick;
    const samples = this._tickCostSamples;
    if (!samples.length) return `<div style="color:var(--text-lo)">gathering samples…</div>`;
    const avg = samples.reduce((a,b)=>a+b,0) / samples.length;
    const max = Math.max(...samples);
    const warn = avg > 50;
    const clr = warn ? 'var(--short)' : 'var(--ice)';
    return `<div style="display:flex;justify-content:space-between;gap:8px"><span style="color:var(--text-lo)">Avg main-thread work / tick</span><span style="color:${clr}">${avg.toFixed(1)} ms</span></div>`
      + `<div style="display:flex;justify-content:space-between;gap:8px"><span style="color:var(--text-lo)">Peak (last ${samples.length} ticks)</span><span style="color:${max>50?'var(--short)':'var(--ice)'}">${max.toFixed(1)} ms</span></div>`
      + `<div style="color:var(--text-lo);font-size:8.5px;margin-top:3px;line-height:1.5">Wall-clock time from each 1s tick to every reactive update it triggers finishing — mostly plugin chart/panel rebuilds. Rising values usually mean a plugin panel left open is redrawing more than it needs to.</div>`;
  },

  // PERSISTENCE
  // A stale tab (another window/tab of this same bot still open in the background) or a
  // localStorage write failure (quota, non-serializable field a plugin attached to a
  // position) can silently desync `positions` (live, in-memory) from what's actually on
  // disk — the write throws, or a slower writer overwrites a newer save. This now logs
  // the failure cause, retries with a stripped-down payload so position data survives
  // even if some other field is the problem, and verifies the write actually landed.
  _fullPersistPayload() {
    return {
      gen: (this._persistGen || 0) + 1,
      cfg: this.cfg,
      positions: this.positions,
      sess: this.sess,
      closedTrades: this.closedTrades,
      bot: { startTime: this.bot.startTime, lastScan: this.bot.lastScan, lastScanAt: this.bot.lastScanAt },
      symbolBanlist: this._symbolBanlist,
      drawdownWindow:     this._drawdownWindow,
      drawdownHaltUntil:  this._drawdownHaltUntil,
      gainsWindow:        this._gainsWindow,
      gainsLockHaltUntil: this._gainsLockHaltUntil,
      manualHalt:         this._manualHalt,
    };
  },
  // Deletes any cfg key not referenced anywhere in the currently-loaded codebase (core bot
  // or any stored plugin — see _knownCfgKeys, built in the plugin-system IIFE below). Keeps
  // cfg from accumulating dead keys from retired features forever, without hand-maintaining
  // a delete list. No-ops if _knownCfgKeys hasn't been attached yet (e.g. before pw() has
  // ever built a live instance).
  _pruneRetiredCfg() {
    if (!this._knownCfgKeys) return;
    for (const k of Object.keys(this.cfg)) {
      if (!this._knownCfgKeys.has(k)) delete this.cfg[k];
    }
  },
  persist() {
    this._pruneRetiredCfg();
    this.pruneTpIngress();
    this._compactClosedTrades();
    // Detect a stale/concurrent tab: if the generation counter already on disk is ahead
    // of the last one we saw, some other writer has touched this key since we last read
    // or wrote it — likely a duplicate tab of this bot. Merge in any positions it holds
    // that we don't have rather than blindly overwriting them into oblivion.
    try {
      const onDisk = JSON.parse(localStorage.getItem(CH_LS_KEY) || 'null');
      if (onDisk && typeof onDisk.gen === 'number' && this._persistGen != null && onDisk.gen > this._persistGen) {
        const knownIds = new Set(this.positions.map(p => p.id));
        const missing  = (onDisk.positions || []).filter(p => p && !knownIds.has(p.id));
        if (missing.length) {
          this.positions.push(...missing);
          this.log(`[PERSIST] ⚠ Recovered ${missing.length} position(s) from a concurrent tab's save that weren't in this tab's memory — check Persistence panel and close duplicate tabs of this bot.`, 'warn');
        }
        this._persistGen = onDisk.gen;
      }
    } catch(e) {}
    const payload = this._fullPersistPayload();
    try {
      localStorage.setItem(CH_LS_KEY, JSON.stringify(payload));
    } catch(e) {
      this.log(`[PERSIST] ⚠ localStorage write failed: ${e.message}. Retrying with trade history/watchlists dropped so open positions aren't lost.`, 'warn');
      try {
        const fallback = { ...payload, closedTrades: [], symbolBanlist: {}, drawdownWindow: [], gainsWindow: [] };
        localStorage.setItem(CH_LS_KEY, JSON.stringify(fallback));
      } catch(e2) {
        this.log(`[PERSIST] ✗ Fallback save also failed (${e2.message}) — ${this.positions.length} open position(s) are NOT saved and may be lost on reload.`, 'error');
        this._persistFailed = true;
        return;
      }
    }
    // Verify the write actually landed with the position count we intended.
    try {
      const check = JSON.parse(localStorage.getItem(CH_LS_KEY) || 'null');
      if (!check || (check.positions || []).length !== this.positions.length) {
        this.log(`[PERSIST] ⚠ Save verification mismatch — ${this.positions.length} position(s) in memory but ${(check?.positions || []).length} confirmed on disk.`, 'error');
        this._persistFailed = true;
      } else {
        this._persistFailed = false;
      }
    } catch(e) { this._persistFailed = true; }
    this._persistGen = payload.gen;
    this.savedPositions = [...this.positions];
  },

  // ── Drawdown Throttle ─────────────────────────────────────────────────────
  // Records a closed-trade PnL entry into the 6h rolling window and checks
  // whether the cumulative loss breaches the configured drawdown limit.
  // If breached: sets _drawdownHaltUntil to now+12h and logs a warning.
  _isDrawdownHalted() {
    if (this._manualHalt) return true;
    return this.cfg.drawdownThrottleEnabled !== false
      && typeof this._drawdownHaltUntil === 'number'
      && this._drawdownHaltUntil > Date.now();
  },

  activateManualHalt() {
    this._manualHalt = true;
    this.persist();
    this.log('[MHL] 🛑 Manual halt activated — all new position entry blocked until lifted.', 'warn');
  },

  liftManualHalt() {
    this._manualHalt = false;
    this.persist();
    this.log('[MHL] ✅ Manual halt lifted — new entries re-enabled.', 'success');
  },

  recordDrawdownPnl(pnl) {
    if (!this.cfg.drawdownThrottleEnabled) return;
    const now = Date.now();
    const DD_TTL = 6 * 3600 * 1000;
    // Append entry
    this._drawdownWindow.push({ pnl, ts: now });
    // Prune entries older than 6h
    this._drawdownWindow = this._drawdownWindow.filter(e => (now - e.ts) < DD_TTL);
    // Don't fire drawdown halt while manual halt is active, and skip if already halted
    if (this._manualHalt || this._drawdownHaltUntil > now) return;
    const windowPnl = this._drawdownWindow.reduce((s, e) => s + e.pnl, 0);
    const entryMargin = (this.cfg.minNotional || 6) / (this.cfg.leverage || 6);
    const limit = -(entryMargin * (this.cfg.drawdownFactor ?? 0.5));
    if (windowPnl <= limit) {
      const haltHours = this.cfg.drawdownHaltHours ?? 6;
      this._drawdownHaltUntil = now + haltHours * 3600 * 1000;
      this.persist();
      this.log(
        `[DWN] ⛔ Drawdown throttle triggered — 6h PnL $${windowPnl.toFixed(3)} ≤ limit $${limit.toFixed(3)} (${(this.cfg.drawdownFactor??0.5)}× $${entryMargin.toFixed(2)} margin). All new position entry halted for ${haltHours}h.`,
        'error'
      );
      // Drawdown bail — positions open during a drawdown tend to underperform; close
      // the book. Deferred: this runs from inside the close path, and the halt above
      // guards against re-triggering as bail closes record their PnL.
      if (this.cfg.drawdownBailEnabled !== false && this.positions.length > 0) {
        this.log(`[DWN] ⚡ Drawdown bail — closing ${this.positions.length} open position(s)`, 'warn');
        setTimeout(() => { this.bailAll().catch(() => {}); }, 0);
      }
    }
  },

  // ── GAINS LOCK ──
  // Mirror of Drawdown Throttle: monitors 6h rolling PnL and halts new entries
  // for 12h when cumulative profit reaches the configured threshold. Default: +2× entry margin.
  _isGainsLocked() {
    return this.cfg.gainsLockEnabled === true
      && typeof this._gainsLockHaltUntil === 'number'
      && this._gainsLockHaltUntil > Date.now();
  },

  recordGainsPnl(pnl) {
    if (!this.cfg.gainsLockEnabled) return;
    const now = Date.now();
    const GL_TTL = 6 * 3600 * 1000;
    this._gainsWindow.push({ pnl, ts: now });
    this._gainsWindow = this._gainsWindow.filter(e => (now - e.ts) < GL_TTL);
    if (this._gainsLockHaltUntil > now) return;
    const windowPnl   = this._gainsWindow.reduce((s, e) => s + e.pnl, 0);
    const entryMargin = (this.cfg.minNotional || 6) / (this.cfg.leverage || 6);
    const limit       = entryMargin * (this.cfg.gainsLockFactor ?? 1.0);
    if (windowPnl >= limit) {
      const lockHours = this.cfg.gainsLockHours ?? 6;
      this._gainsLockHaltUntil = now + lockHours * 3600 * 1000;
      this.persist();
      this.log(
        `[GLK] 🔒 Gains lock triggered — 6h PnL $${windowPnl.toFixed(3)} ≥ limit $${limit.toFixed(3)} (${(this.cfg.gainsLockFactor??1.0)}× $${entryMargin.toFixed(2)} margin). All new position entry locked for ${lockHours}h.`,
        'success'
      );
    }
  },

  loadSaved() {
    try {
      // Load activity log first
      try {
        const rawLog = localStorage.getItem('pc_v1_log');
        if (rawLog) {

      const raw = localStorage.getItem(CH_LS_KEY);
      if (!raw) return;
      const s = JSON.parse(raw);
      this._persistGen = typeof s.gen === 'number' ? s.gen : 0;
      if (s.cfg) {
        // Migrate legacy dcaSixStageEnabled to dcaStages
        if (s.cfg.dcaSixStageEnabled !== undefined && s.cfg.dcaStages === undefined) {
          s.cfg.dcaStages = s.cfg.dcaSixStageEnabled ? 6 : 3;
        }
        // Migrate legacy SalF candle/volume keys to LONG LBA + green ClC defaults.
        if (s.cfg.sfGreenCandleMin === undefined) s.cfg.sfGreenCandleMin = 3;
        if (s.cfg.sfLbaLimit === undefined && s.cfg.sfLsaLimit !== undefined) s.cfg.sfLbaLimit = s.cfg.sfLsaLimit;
        if (s.cfg.sfGainerLbaMin === undefined && s.cfg.sfGainerLsaMin !== undefined) s.cfg.sfGainerLbaMin = s.cfg.sfGainerLsaMin;
        delete s.cfg.sfRedCandleMax;
        delete s.cfg.sfRedCandleMin;
        delete s.cfg.sfLsaLimit;
        delete s.cfg.sfLoserLsaMin;
        delete s.cfg.sfGainerLsaMin;
        // Remove legacy keys
        delete s.cfg.dcaSixStageEnabled;
        delete s.cfg.addPcts;
        delete s.cfg.addPcts6;
        delete s.cfg.tp;
        delete s.cfg.tpRoi;
        delete s.cfg.volDivFilter;
        delete s.cfg.volDivPct;
        delete s.cfg.volLowDivFilter;
        delete s.cfg.volLowDivPct;
        // Remove removed regular FT keys

        delete s.cfg.ftVolMomEnabled;

        delete s.cfg.ftVolMomCreepPct;

        delete s.cfg.rodeoCreepPct;

        delete s.cfg.gainerOeCheckEnabled;
        // Remove funding filter keys (filter removed)
        delete s.cfg.fundingFilter; delete s.cfg.fundingRateMin; delete s.cfg.fundingRateMax;
        // Remove SalF / median creep keys (strategy removed)
        delete s.cfg.sfMedianCreepEnabled;
        // Remove auto-reduce on congestion keys (reduce phase dropped)

        // Remove laggardDebtCapPct (unused legacy)

        Object.assign(this.cfg, s.cfg);
      }
      if (s.sess) Object.assign(this.sess, s.sess);
      if (s.bot?.startTime)  this.bot.startTime  = s.bot.startTime;
      if (s.bot?.lastScan)   this.bot.lastScan   = s.bot.lastScan;
      if (s.bot?.lastScanAt) this.bot.lastScanAt = s.bot.lastScanAt;
      if (Array.isArray(s.closedTrades)) this.closedTrades = s.closedTrades;
      if (s.symbolBanlist && typeof s.symbolBanlist === 'object') this._loadSymbolBanlist(s.symbolBanlist);
      const nowGl = Date.now();
      // Restore drawdown throttle state — prune entries older than 6h on load
      if (Array.isArray(s.drawdownWindow)) {
        const DD_TTL = 6 * 3600 * 1000;
        this._drawdownWindow = s.drawdownWindow.filter(e => e?.ts && (nowGl - e.ts) < DD_TTL);
      }
      if (s.drawdownHaltUntil && s.drawdownHaltUntil > nowGl) {
        this._drawdownHaltUntil = s.drawdownHaltUntil;
      }
      if (s.manualHalt) this._manualHalt = true;
      if (Array.isArray(s.gainsWindow)) {
        const GL_TTL = 6 * 3600 * 1000;
        this._gainsWindow = s.gainsWindow.filter(e => e?.ts && (nowGl - e.ts) < GL_TTL);
      }
      if (s.gainsLockHaltUntil && s.gainsLockHaltUntil > nowGl) {
        this._gainsLockHaltUntil = s.gainsLockHaltUntil;
      }
      if (s.positions?.length) {
        this.savedPositions = s.positions;
        this.positions = s.positions.map(p => {
          const phase = this.calcPhase(p, p.phase, s.positions || []);
          return {
            ...p,
            markPrice: p.markPrice || p.entryPrice,
            upnl: p.upnl || 0,
            phase,
            dcaStage: p.dcaStage ?? this.inferStage(p, null),
          };
        });
      }
    } catch(e) {}
    if (this.$nextTick) this.$nextTick(() => { this.renderTradeFeed(); });
    else this.renderTradeFeed();
  },

  calcPhase(posOrOpenedAt, saved, allPositions = []) {
    if (saved === 'force') return 'force';
    const pos = (posOrOpenedAt && typeof posOrOpenedAt === 'object') ? posOrOpenedAt : null;
    const openedAt = pos ? pos.openedAt : posOrOpenedAt;
    const age = Date.now() - openedAt;
    if (age >= this.cfg.runtimeHours * 3600000) return 'force';
    return saved || 'normal';
  },

  async bailAll() {

    this.log(`[BSC] 🚨 Bail All triggered — closing ${toClose.length} position(s) at market.`, 'warn');

        } catch(e) {

  },

  log(m, type='info') {
    // Batched bulk operation in progress — buffer everything but errors for one rolled-up entry
    if ((this._logBatchDepth || 0) > 0 && type !== 'error') { this._logBatchBuf.push({ m, type }); return; }
    // `ts` (epoch ms) is the unambiguous absolute time for correlating a log entry against
    // exported positions/configs (which timestamp in UTC epoch). `t` stays as the local
    // HH:MM:SS display string the activity-log UI already renders — unchanged so the UI
    // doesn't need touching, but on its own it can't be tied to a specific date or timezone.
    const ts = Date.now();
    const t = new Date(ts).toTimeString().slice(0,8);
    m = m.replace(/([A-Z0-9]{2,})USDT/g, '$1');
    this.logs.unshift({t, ts, m, type});
    const LOG_MAX = 300;
    if (this.logs.length > LOG_MAX) this.logs.length = LOG_MAX;
    // Persist log asynchronously to avoid blocking hot paths
    try {
      localStorage.setItem('pc_v1_log', JSON.stringify(this.logs));
    } catch(e) {}
  },

  // ── Log roll-up — wraps bulk operations (cascade, bail, scan entry bursts) so
  // per-event chatter lands as one activity-log entry. Errors always log
  // individually and immediately. Nestable; only the outermost end flushes.
  // A batch that collected a single message passes it through unchanged.
  _logBatchBegin() {
    this._logBatchDepth = (this._logBatchDepth || 0) + 1;
    if (this._logBatchDepth === 1) this._logBatchBuf = [];
  },
  _logBatchEnd(label) {
    if (!(this._logBatchDepth > 0) || --this._logBatchDepth > 0) return;
    const buf = this._logBatchBuf; this._logBatchBuf = [];
    if (!buf || !buf.length) return;
    if (buf.length === 1) { this.log(buf[0].m, buf[0].type); return; }
    const sev = buf.some(e => e.type === 'warn') ? 'warn'
              : buf.some(e => e.type === 'success' || e.type === 'trade') ? 'success' : 'info';
    this.log(`${label} — ${buf.length} events\n` + buf.map(e => '· ' + e.m).join('\n'), sev);
  },

  // ── PC overlay-menu system ──
  // Toggle a menu ('config'|'stats'|'trades') open/closed as a floating overlay on top of the market view.
  // Rules: clicking an already-open menu closes it. Clicking a closed menu fills whichever slot is empty
  // (left preferred), or — if both slots are full — replaces whichever slot is "due" per overlayTurn,
  // alternating left/right on every subsequent replacement.
  toggleOverlay(name) {

    if (this.overlayRight === name) { this.overlayRight = null; return; }
    if (this.overlayLeft === null)  { this.overlayLeft  = name; this.overlayTurn = 'right'; return; }
    if (this.overlayRight === null) { this.overlayRight = name; this.overlayTurn = 'left';  return; }
    if (this.overlayTurn === 'left') { this.overlayLeft  = name; this.overlayTurn = 'right'; }
    else                             { this.overlayRight = name; this.overlayTurn = 'left';  }
  },
  overlaySlotClass(name) {
    if (this.overlayLeft  === name) return 'ov-open ov-left';
    if (this.overlayRight === name) return 'ov-open ov-right';
    return '';
  },

  statusPill() {
    const problems = [];

    if (this.bot.running && this.audioState !== 'running' && this.audioState !== 'off') {
      problems.push({
        pip:        'warn',
        pipStyle:   '',
        label:      'SYNC !',
        labelStyle: 'color:var(--warn)',
        border:     'border-color:rgba(240,192,96,.4);background:rgba(240,192,96,.06)',
        title:      'Audio keepalive suspended — tap to resume background sync',
        action:     () => this.resumeKeepalive(),
      });
    }

    if (this._manualHalt) {
      problems.push({
        pip:        'warn',
        pipStyle:   'background:rgba(255,160,0,.9)',
        label:      'MHL',
        labelStyle: 'color:rgba(255,160,0,.9)',
        border:     'border-color:rgba(255,160,0,.45);background:rgba(255,160,0,.06)',
        title:      'Manual halt active — all new position entry blocked',
        action:     null,
      });
    }

    if (!this._manualHalt && this.cfg.drawdownThrottleEnabled && this._drawdownHaltUntil > Date.now()) {
      const _ddRem = this._drawdownHaltUntil - Date.now();
      const _ddH   = Math.floor(_ddRem / 3600000);
      const _ddM   = Math.floor((_ddRem % 3600000) / 60000);
      const _ddS   = Math.floor((_ddRem % 60000) / 1000);
      const _ddStr = `${_ddH}h ${String(_ddM).padStart(2,'0')}m ${String(_ddS).padStart(2,'0')}s`;
      problems.push({
        pip:        'warn',
        pipStyle:   'background:var(--loss)',
        label:      `DDH ${_ddStr}`,
        labelStyle: 'color:var(--loss)',
        border:     'border-color:rgba(255,100,100,.4);background:rgba(255,100,100,.06)',
        title:      `Drawdown throttle active — entries halted for ${_ddStr}. Click to clear.`,
        action:     () => { this._drawdownHaltUntil = 0; this._drawdownWindow = []; this.persist(); this.log('[DWN] Drawdown throttle cleared manually.','warn'); },
      });
    }

    if (this._isGainsLocked()) {
      const _glRem = this._gainsLockHaltUntil - Date.now();
      const _glH   = Math.floor(_glRem / 3600000);
      const _glM   = Math.floor((_glRem % 3600000) / 60000);
      const _glS   = Math.floor((_glRem % 60000) / 1000);
      const _glStr = `${_glH}h ${String(_glM).padStart(2,'0')}m ${String(_glS).padStart(2,'0')}s`;
      problems.push({
        pip:        'on',
        pipStyle:   'background:var(--profit)',
        label:      `🔒 GLK ${_glStr}`,
        labelStyle: 'color:var(--profit)',
        border:     'border-color:rgba(0,229,160,.4);background:rgba(0,229,160,.06)',
        title:      `Gains lock active — new entries locked for ${_glStr}. Click to clear.`,
        action:     () => { this._gainsLockHaltUntil = 0; this._gainsWindow = []; this.persist(); this.log('[GLK] Gains lock cleared manually.','success'); },
      });
    }

    // Plugins (e.g. Ashfall preemptive lock) may contribute extra status pills
    if (typeof this._extraStatusPills === 'function') {
      try { const _ex = this._extraStatusPills(); if (Array.isArray(_ex)) problems.push(..._ex); } catch(e) {}
    }

    if (problems.length === 0) {
      return {
        pip:        'on',
        pipStyle:   '',
        label:      'ALL OK',
        labelStyle: 'color:var(--profit)',
        border:     'border-color:rgba(0,229,160,.25);background:rgba(0,229,160,.04)',
        title:      'All systems nominal',
        action:     null,
      };
    }

    const idx = Math.floor(this.tick / 3) % problems.length;
    return problems[idx];
  },

  async startBot() {
    this.bot.running = true;
    this.bot.startTime = Date.now();
    this.log(`[SES] ${this.themeEmoji} Sim started — ${this.cfg.leverage}× lev | $${this.cfg.minNotional} entry`, 'success');
    try { await this.pseudoAuditGap(); } catch(e) { this.log('[SES] Gap audit error on start: ' + e.message, 'warn'); }
    this.startKeepalive();

    try { await this.runScheduledCycle(); } catch(e) { this.log('[SES] Initial cycle error: ' + e.message, 'warn'); }
    this.scheduleScan();

  async stopBot() {
    this.bot.running = false;
    clearInterval(_chCdTimer);
    clearInterval(_chWatchTimer); _chWatchTimer = null;
    clearInterval(_chRefreshTimer);
    this.stopKeepalive();
    this.bot.scanCd = 0; this.bot.scanPct = 100;
    this.bot.startTime = null;
    this._symData      = {}; // clear live symbol data — will be repopulated on next scan
    this._stopAllIftPollers();
    this.log(`[SES] ${this.themeEmoji} Sim stopped.`, 'warn');
    this.persist();
  },

  // Applies a mode's _tradingSuspended flags on both sides without bailing anything — used at
  // init() to restore the persisted mode after a reload. Bailing on every page load would
  // force-close positions that were sitting there peacefully before the reload; that's only
  // correct at the moment of an actual user-initiated transition (see _chSetOperationalMode).
  _chApplyOperationalMode(mode) {
    const pw = window.Alpine?.$data?.(document.getElementById('pw-app'));
    if (pw) pw._tradingSuspended = !(mode === 'winter' || mode === 'both');
    this._tradingSuspended = !(mode === 'chaser' || mode === 'both');
  },

  // Tri-state control from the Chaser accordion — 'winter' | 'chaser' | 'both' — persisted so
  // it survives reload. Does NOT call startBot()/stopBot() — those also gate scanning,
  // keepalive, and the watch loop, and market-data fetching must keep running on both sides
  // regardless of this setting (still useful for shared data, scorecard, monitoring even for
  // the side that's not opening new positions). This only sets _tradingSuspended, checked at
  // the top of each side's own pseudoOpenShort()/pseudoOpenLong() — narrower than the earlier
  // startBot/stopBot version, which was the wrong tool even before it had the "stuck" bug
  // (mutating bot.running with no side effects at all): it would have stopped scanning too,
  // which was never the intent.
  // When a side transitions from active to suspended, its current open positions are bailed
  // immediately (force-closed at mark price) rather than left open and monitored — the user's
  // explicit call: switching a side off should clear its book, not let it ride unsupervised.
  _chSetOperationalMode(mode) {
    const pw = window.Alpine?.$data?.(document.getElementById('pw-app'));
    const wantWinter = mode === 'winter' || mode === 'both';
    const wantChaser = mode === 'chaser' || mode === 'both';
    const prevMode = this.cfg.chOperationalMode;
    const prevWantWinter = prevMode === 'winter' || prevMode === 'both';
    const prevWantChaser = prevMode === 'chaser' || prevMode === 'both';
    this._chApplyOperationalMode(mode);
    if (pw && prevWantWinter && !wantWinter && pw.positions.length) pw.bailAll();
    if (prevWantChaser && !wantChaser && this.positions.length) this.bailAll();
    this.cfg.chOperationalMode = mode;
    this.persist();
  },

  startKeepalive() {
    try {
      if (this._audioCtx) return; // already running
      this._audioCtx   = new (window.AudioContext || window.webkitAudioContext)();
      this._oscillator = this._audioCtx.createOscillator();
      const gain       = this._audioCtx.createGain();
      gain.gain.value  = 0.001;
      this._oscillator.type            = 'sine';
      this._oscillator.frequency.value = 440;
      this._oscillator.connect(gain);
      gain.connect(this._audioCtx.destination);
      this._oscillator.start();
      this.audioState = this._audioCtx.state; // 'running' immediately after user gesture
      _chAudioTimer = setInterval(() => {
        if (!this._audioCtx) return;
        this.audioState = this._audioCtx.state;
      }, 3000);
      this.log('[AUD] Audio keepalive active — background processes protected.', 'info');
    } catch(e) {
      this.audioState = 'off';
      this.log('[AUD] Audio keepalive unavailable: ' + e.message, 'warn');
    }
  },

  stopKeepalive() {
    try {
      clearInterval(_chAudioTimer);
      _chAudioTimer = null;
      if (this._oscillator) { this._oscillator.stop(); this._oscillator = null; }
      if (this._audioCtx)   { this._audioCtx.close();  this._audioCtx   = null; }
      this.audioState = 'off';
    } catch(e) {}
  },

  async resumeKeepalive() {
    try {
      if (!this._audioCtx) { this.startKeepalive(); return; }
      if (this._audioCtx.state === 'suspended') {
        await this._audioCtx.resume();
        this.audioState = this._audioCtx.state;
        this.log('[AUD] Audio keepalive resumed.', 'info');
      }
    } catch(e) {
      this.log('[AUD] Audio resume failed: ' + e.message, 'warn');
    }
  },

  scheduleScan() {
    clearInterval(_chCdTimer);
    _chCdTimer = setInterval(async () => {
      if (!this.bot.running) return;
      const total   = this.cfg.scanMins * 60 * 1000;
      const elapsed = Date.now() - this.bot.lastScanAt;
      if (elapsed >= total) {
        this.bot.lastScanAt = Date.now();
        // Lift expired halt before checking
        if (this.cfg.drawdownThrottleEnabled && this._drawdownHaltUntil && Date.now() >= this._drawdownHaltUntil) {
          this._drawdownHaltUntil = null;
          this.persist();
          this.log('[DWN] ✅ Drawdown throttle lifted — new entries re-enabled', 'success');
        }
        if (this.cfg.gainsLockEnabled && this._gainsLockHaltUntil && Date.now() >= this._gainsLockHaltUntil) {
          this._gainsLockHaltUntil = 0;
          this.persist();
          this.log('[GLK] ✅ Gains lock lifted — new entries re-enabled', 'success');
        }
        this._sweepExpiredData(); // sweep expired banlist entries regardless of halt state
        await this.runScheduledCycle(); // halt (if any) only blocks entry, not the scan itself — see runScheduledCycle
      }
    }, 1000);
  },

  async runScheduledCycle() {
    if (this._cycleRunning) return;
    // Halts block position entry only, not the scan itself — strategy plugins each check
    // halt state right before opening (not before their own data collection), so the scan
    // always runs in full here regardless of halt, keeping Ashfall's OC/liq/structure
    // surveillance fed. _haltLoggedKind is only reset when not halted, so the per-cycle
    // "halted — data-only" log inside runScan() still fires once per halt, not every cycle.
    if (!(this._isDrawdownHalted() || this._isGainsLocked())) this._haltLoggedKind = null;
    this.bot.lastScanAt = Date.now();
    this._sweepExpiredData();
    this._cycleRunning = true;
    this.log('[CYC] ⚙ Cycle starting...', 'info');
    try {
      // 1. Losers scan
      await this.runScan();
      // Live-refresh market watch entries
      if (this.cfg.mktWatchEnabled !== false && this._mktWatch?.length) {
        await this._refreshMktWatch();
      }
      const allTickers = this._lastAllTickers || [];


    } catch(e) { this.log('[CYC] [E02] Cycle error: ' + e.message, 'error'); }
    finally { this._cycleRunning = false; }
  },

  async _refreshMktWatch() {
    // Reshuffle a fresh random selection from the stale ticker cache each cycle
    const stale = this._lastAllTickers || [];
    if (stale.length) {
      const pool = stale.filter(t =>
        t.symbol.endsWith('USDT') && t.symbol !== 'BTCUSDT'
        && parseFloat(t.lastPrice || 0) >= 0.001
        && !this._isSymbolBanned?.(t.symbol));
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      this._mktWatch = pool.slice(0, this.cfg.mktWatchSize ?? 5).map(t => ({
        symbol:       t.symbol,
        lastPrice:    parseFloat(t.lastPrice    || 0),
        fundingRate:  parseFloat(t.fundingRate  || 0),
        price24hPcnt: parseFloat(t.price24hPcnt || 0),
        turnover24h:  parseFloat(t.turnover24h  || 0),
        updatedAt:    Date.now(),
      }));
    }
    for (const entry of (this._mktWatch || [])) {
      try {
        const r = await fetch(`${this.base}/v5/market/tickers?category=linear&symbol=${entry.symbol}`);
        const d = await r.json();
        const t = d?.retCode === 0 ? d.result?.list?.[0] : null;
        if (!t) continue;
        const lp = parseFloat(t.lastPrice    || 0);
        const fr = parseFloat(t.fundingRate  || 0);
        const ch = parseFloat(t.price24hPcnt || 0);
        const tv = parseFloat(t.turnover24h  || 0);
        if (lp > 0) entry.lastPrice    = lp;
        entry.fundingRate  = fr;
        entry.price24hPcnt = ch;
        if (tv > 0) entry.turnover24h  = tv;
        entry.updatedAt = Date.now();
      } catch(e) {}
    }
  },


  async runScan() {
