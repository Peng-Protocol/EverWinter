<!--
  EverWinter Plugin for PseudoWinter
  Transforms PseudoWinter into a live Bybit short-trading bot.
  Load via Plugin Manager in PseudoWinter's config panel.
-->
<script>
(function () {
  'use strict';

  async function _ewSign(key, secret, payload, tsOffset) {
    const ts   = String(Date.now() + (tsOffset | 0));
    const recv = '5000';
    const str  = ts + key + recv + payload;
    const enc  = new TextEncoder();
    const k    = await crypto.subtle.importKey('raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
    const sig  = await crypto.subtle.sign('HMAC', k, enc.encode(str));
    const hex  = Array.from(new Uint8Array(sig)).map(b => b.toString(16).padStart(2, '0')).join('');
    return { 'X-BAPI-API-KEY': key, 'X-BAPI-TIMESTAMP': ts, 'X-BAPI-RECV-WINDOW': recv, 'X-BAPI-SIGN': hex, 'Content-Type': 'application/json' };
  }

  // Manual-estimate average entry: reconstructs the average we'd expect using the
  // trigger prices we actually placed each DCA stage's conditional order at, rather
  // than the exchange's reported avgPrice. Used as a fallback + sanity check for the
  // exchange value, which has historically lagged briefly right after a fill.
  function _dcaLocalAvg(pos, uptoStage) {
    const stageQtys = pos._stageQtys || [];
    let size     = stageQtys[0] || 0;
    let notional = (pos.originalEntryPrice || pos.entryPrice) * size;
    const conds  = (pos.orders || []).filter(o => o.type === 'cond');
    for (let i = 0; i < uptoStage && i < conds.length; i++) {
      notional += conds[i].price * conds[i].qty;
      size     += conds[i].qty;
    }
    return size > 0 ? notional / size : (pos.originalEntryPrice || pos.entryPrice);
  }

  window.__BotPlugin = {
    id:        'everwinter',
    name:      'EverWinter',
    version:   '1.5.1',
    targetBot: 'pseudowinter',
    after:     [],
    before:    [],
    conflicts: [],
    requires:  [],
    touches:   ['init', 'pseudoOpenShort', 'pseudoClosePosition', 'pseudoWatchPositions', 'refreshBalance', 'bailAll'],
    suppresses: ['pseudoOpenShort', 'refreshBalance'],

    css: `
      .ew-inp { width: 100%; background: var(--bg-void); border: 1px solid var(--border-hi); color: var(--text-hi); padding: 5px 8px; border-radius: 4px; font-family: var(--mono); font-size: 10px; margin-bottom: 6px; }
      .ew-inp:focus { outline: none; border-color: var(--ice); }
      .ew-save { width: 100%; background: var(--bg-raised); border: 1px solid var(--ice); color: var(--ice); font-size: 10px; padding: 5px 0; border-radius: 4px; cursor: pointer; font-family: var(--mono); letter-spacing: 1px; transition: background 0.15s; }
      .ew-save:hover { background: var(--ice-glow); }
      .ew-tab, .ew-seg { flex: 1; background: var(--bg-void); border: 1px solid var(--border-hi); color: var(--text-lo); font-size: 9px; padding: 5px 0; border-radius: 4px; cursor: pointer; font-family: var(--mono); letter-spacing: 1px; transition: all 0.15s; }
      .ew-seg:disabled, .ew-inp:disabled { opacity: .35; cursor: not-allowed; }
      .ew-tab.on, .ew-seg.on { border-color: var(--ice); color: var(--ice); background: var(--bg-raised); }
      .ew-note { font-size: 9px; color: var(--text-lo); text-align: center; margin-top: 6px; font-family: var(--mono); }
    `,

    slots: {
      'strategy-accordions': `
        <div x-data="{ open: false, tab: 'api' }">
          <button class="cfg-acc-hd" @click="open=!open" :class="open?'open':''">
            <div style="display:flex;align-items:center;gap:7px">
              <!-- ❄ matches other Winter-family plugin accordions (❄ Permafrost, ❄ Blizzard, etc.) — emoji variant ❄️ is too dissimilar -->
              <span>❄ EverWinter</span>
              <span x-show="creds.key && creds.secret" style="font-size:8px;padding:1px 5px;background:rgba(96,210,255,.15);border:1px solid rgba(96,210,255,.3);border-radius:2px;color:var(--ice);letter-spacing:1px">LIVE</span>
              <span x-show="!(creds.key && creds.secret)" style="font-size:8px;padding:1px 5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:2px;color:var(--text-lo);letter-spacing:1px">SETUP</span>
            </div>
            <span class="cfg-acc-arrow" :class="open?'open':''">▶</span>
          </button>
          <div x-show="open" x-transition.opacity class="cfg-acc-body">
            <div style="display:flex;gap:4px;margin-bottom:10px">
              <template x-for="t in [['api','API'],['open','Open'],['close','Close']]" :key="t[0]">
                <button class="ew-tab" :class="tab===t[0]?'on':''" @click="tab=t[0]" x-text="t[1]"></button>
              </template>
            </div>
            <div x-show="tab==='api'">
            <div style="font-size:10px;color:var(--text-lo);margin-bottom:3px">API Key</div>
            <input type="text" class="ew-inp" x-model="creds.key" placeholder="Bybit API Key" autocomplete="off" spellcheck="false">
            <div style="font-size:10px;color:var(--text-lo);margin-bottom:3px">API Secret</div>
            <input type="password" class="ew-inp" x-model="creds.secret" placeholder="Bybit API Secret" autocomplete="off">
            <button class="ew-save" @click="_ewSaveCreds()">SAVE CREDENTIALS</button>
            <div class="ew-note">Stored in localStorage — sent only to api.bybit.com</div>
            <div x-show="creds.key && creds.secret" style="margin-top:6px;font-size:9px;font-family:var(--mono);color:var(--profit);text-align:center">⚡ Live mode active</div>
            </div>
            <div x-show="tab==='open'">
              <div class="lbl">Order type</div>
              <div style="display:flex;gap:4px;margin-bottom:8px">
                <button class="ew-seg" :disabled="cfgLocked" :class="cfg.ewOpenType!=='market'?'on':''" @click="cfg.ewOpenType='limit';persist()">LIMIT</button>
                <button class="ew-seg" :disabled="cfgLocked" :class="cfg.ewOpenType==='market'?'on':''" @click="cfg.ewOpenType='market';persist()">MARKET</button>
              </div>
              <div x-show="cfg.ewOpenType!=='market'">
                <div class="lbl">Limit offset <b x-text="(cfg.ewOpenOffsetPct??0.1)+'%'"></b></div>
                <input type="number" class="ew-inp" :disabled="cfgLocked" step="0.05" min="-2" max="5" x-model.number="cfg.ewOpenOffsetPct" @change="persist()">
                <div class="ew-note" style="text-align:left;margin:-2px 0 8px">Distance through last price (positive = marketable, negative = passive).</div>
                <div class="lbl">Limit tries <b x-text="cfg.ewOpenTries??1"></b></div>
                <input type="number" class="ew-inp" :disabled="cfgLocked" step="1" min="1" max="20" x-model.number="cfg.ewOpenTries" @change="persist()">
                <label class="tog" style="margin:2px 0 4px" :style="cfgLocked?'opacity:.4;cursor:not-allowed;pointer-events:none':''">
                  <div class="tog-t" :class="cfg.ewOpenFallback!==false?'on':''" @click="if(!cfgLocked){cfg.ewOpenFallback=(cfg.ewOpenFallback===false);persist()}"><div class="tog-k"></div></div>
                  <div class="tog-l">Fall back to market</div>
                </label>
                <div class="ew-note" style="text-align:left;margin:0 0 8px" x-text="cfg.ewOpenFallback!==false ? 'After the limit tries go unfilled, send a market order.' : 'After the limit tries go unfilled, give up and cool the symbol down.'"></div>
                <div class="lbl">Fill timeout per try (s)</div>
                <input type="number" class="ew-inp" :disabled="cfgLocked" min="2" max="120" step="1" :value="(cfg.ewFillTimeoutMs??10000)/1000" @change="cfg.ewFillTimeoutMs=Math.min(120000,Math.max(2000,Math.round((parseFloat($event.target.value)||10)*1000)));persist()">
              </div>
              <div class="lbl">Cooldown after failed open (min)</div>
              <input type="number" class="ew-inp" :disabled="cfgLocked" min="0" max="240" step="1" :value="(cfg.ewFillCooldownMs??900000)/60000" @change="cfg.ewFillCooldownMs=(v=>Math.min(240,Math.max(0,isNaN(v)?15:v))*60000)(parseFloat($event.target.value));persist()">
            </div>
            <div x-show="tab==='close'">
              <div class="lbl">Order type</div>
              <div style="display:flex;gap:4px;margin-bottom:8px">
                <button class="ew-seg" :disabled="cfgLocked" :class="cfg.ewCloseType!=='market'?'on':''" @click="cfg.ewCloseType='limit';persist()">LIMIT</button>
                <button class="ew-seg" :disabled="cfgLocked" :class="cfg.ewCloseType==='market'?'on':''" @click="cfg.ewCloseType='market';persist()">MARKET</button>
              </div>
              <div x-show="cfg.ewCloseType!=='market'">
                <div class="lbl">Limit offset <b x-text="(cfg.ewCloseOffsetPct??0.1)+'%'"></b></div>
                <input type="number" class="ew-inp" :disabled="cfgLocked" step="0.05" min="-2" max="5" x-model.number="cfg.ewCloseOffsetPct" @change="persist()">
                <div class="ew-note" style="text-align:left;margin:-2px 0 8px">Distance through last price (positive = marketable, negative = passive). Reduce-only.</div>
                <div class="lbl">Limit tries <b x-text="cfg.ewCloseTries??10"></b></div>
                <input type="number" class="ew-inp" :disabled="cfgLocked" step="1" min="1" max="100" x-model.number="cfg.ewCloseTries" @change="persist()">
                <label class="tog" style="margin:2px 0 4px" :style="cfgLocked?'opacity:.4;cursor:not-allowed;pointer-events:none':''">
                  <div class="tog-t" :class="cfg.ewCloseFallback!==false?'on':''" @click="if(!cfgLocked){cfg.ewCloseFallback=(cfg.ewCloseFallback===false);persist()}"><div class="tog-k"></div></div>
                  <div class="tog-l">Fall back to market</div>
                </label>
                <div class="ew-note" style="text-align:left;margin:0 0 8px" x-text="cfg.ewCloseFallback!==false ? 'After the limit tries go unfilled, close with a reduce-only market order.' : 'No fallback: keeps repricing the limit until the position is flat.'"></div>
                <div class="lbl">Reprice interval (s)</div>
                <input type="number" class="ew-inp" :disabled="cfgLocked" min="2" max="120" step="1" :value="(cfg.ewCloseRetryMs??10000)/1000" @change="cfg.ewCloseRetryMs=Math.min(120000,Math.max(2000,Math.round((parseFloat($event.target.value)||10)*1000)));persist()">
              </div>
            </div>
          </div>
        </div>
      `,
    },

    transform(def) {
      const _sign    = _ewSign;
      const _origInit  = def.init;
      const _origOpen  = def.pseudoOpenShort;
      const _origClose = def.pseudoClosePosition;
      const _origWatch = def.pseudoWatchPositions;
      const _origCycle = def.runScheduledCycle;
      const _origBailAll = def.bailAll;

      return Object.assign({}, def, {

        _tsOffset:      0,
        _lastSignedAt:  0,
        _ewLive:        true,
        _ewLastSync:    0,
        _ewFillCooldown: {},
        _ewClosing:     {},
        _ewOpposite:    {},  // opposite-direction (Buy) exchange positions, noted but not managed

        async init() {
          // Update loading screen immediately — it persists until showApp() fires after init completes
          const _loadLogo = document.querySelector('.pw-logo');
          if (_loadLogo) _loadLogo.textContent = '❄️ EVERWINTER';
          const _logoSub = document.querySelector('.logo-sub');
          if (_logoSub) _logoSub.textContent = _logoSub.textContent.replace('No Real Orders', 'Very Real Orders');
          await _origInit.call(this);
          { const c = this.cfg; c.ewOpenType ??= 'limit'; c.ewOpenOffsetPct ??= 0.1; c.ewOpenFallback ??= true; c.ewOpenTries ??= 1;
            c.ewCloseType ??= 'limit'; c.ewCloseOffsetPct ??= 0.1; c.ewCloseFallback ??= true; c.ewCloseTries ??= 10; }
          if (typeof this.setThemeEmoji === 'function') this.setThemeEmoji('❄️');
          this.appName  = 'EVERWINTER';
          this.botLabel = 'Bot';
          document.title = document.title.replace(/PSEUDOWINTER/i, 'EVERWINTER');
          try {
            const s = JSON.parse(localStorage.getItem('__ew_creds') || '{}');
            if (s.key)    this.creds.key    = s.key;
            if (s.secret) this.creds.secret = s.secret;
          } catch(e) {}
          if (this.creds.key && this.creds.secret) {
            await this._ewSyncTs();
            await this.refreshBalance();
          }
          this.log('⚡ EverWinter live plugin active.', 'info');
        },

        _ewSaveCreds() {
          localStorage.setItem('__ew_creds', JSON.stringify({ key: this.creds.key, secret: this.creds.secret }));
          if (this.creds.key && this.creds.secret) {
            this._ewSyncTs().then(() => this.refreshBalance());
          } else {
            this._ewSyncTs();
          }
          this.log('[EW] Credentials saved.', 'info');
        },

        async _ewSyncTs() {
          try {
            const r = await fetch('https://api.bybit.com/v5/market/time');
            const d = await r.json();
            const ms = parseInt(d.result?.timeNano ? d.result.timeNano / 1000000 : (d.result?.timeSecond || 0) * 1000);
            if (ms > 0) this._tsOffset = ms - Date.now();
          } catch(e) { this._tsOffset = 0; }
        },

        async refreshBalance() {
          if (!this.creds.key || !this.creds.secret) return;
          try {
            await this._ewDelay();
            const p = 'accountType=UNIFIED';
            const h = await _sign(this.creds.key, this.creds.secret, p, this._tsOffset);
            const r = await fetch(`${this.base}/v5/account/wallet-balance?${p}`, { headers: h });
            const d = await this._ewSafeJson(r);
            const coin = d?.result?.list?.[0]?.coin?.find(c => c.coin === 'USDT');
            if (coin) {
              this.acct.balance   = parseFloat(coin.walletBalance   || 0);
              this.acct.available = parseFloat(coin.availableToWithdraw || coin.availableToBorrow || 0);
            }
          } catch(e) {}
        },

        async _ewDelay() {
          const GAP = 250;
          const now = Date.now();
          const t   = Math.max(now, (this._lastSignedAt || 0) + GAP);
          this._lastSignedAt = t;
          if (t > now) await new Promise(r => setTimeout(r, t - now));
        },

        _ewPriceDp(symbol) {
          const ts = this._instrCache?.[symbol]?.tickSize;
          if (!ts) return 4;
          const s  = String(ts);
          const d  = s.indexOf('.');
          return d < 0 ? 0 : s.length - d - 1;
        },

        async _ewSafeJson(res) {
          try { const t = await res.text(); return t && !t.trimStart().startsWith('<') ? JSON.parse(t) : null; }
          catch(e) { return null; }
        },

        _ewOpenCfg() {
          const c = this.cfg, num = (v, d, lo, hi) => { v = parseFloat(v); return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d; };
          return { type: c.ewOpenType === 'market' ? 'market' : 'limit', offsetPct: num(c.ewOpenOffsetPct, 0.1, -2, 5), fallback: c.ewOpenFallback !== false, tries: Math.round(num(c.ewOpenTries, 1, 1, 20)) };
        },

        _ewCloseCfg() {
          const c = this.cfg, num = (v, d, lo, hi) => { v = parseFloat(v); return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : d; };
          return { type: c.ewCloseType === 'market' ? 'market' : 'limit', offsetPct: num(c.ewCloseOffsetPct, 0.1, -2, 5), fallback: c.ewCloseFallback !== false, tries: Math.round(num(c.ewCloseTries, 10, 1, 100)) };
        },

        // Entry order driver. Limit mode: up to `tries` limit attempts (each repriced off a fresh last
        // price, each waiting the fill timeout and cancelling if unfilled), then — if fallback is on —
        // one market order; if off, gives up. Market mode: one market order.
        // Returns { fill, placed, banned }: placed = at least one order reached the exchange (drives cooldown).
        async _ewEnter(sym, qty, price) {
          const C = this._ewOpenCfg(), out = { fill: null, placed: false, banned: false };
          const total = C.type === 'market' ? 1 : (C.fallback ? C.tries + 1 : C.tries);
          for (let n = 1; n <= total; n++) {
            const asMkt = C.type === 'market' || n > C.tries;
            let ref = price;
            if (!asMkt && n > 1) {
              try {
                const tr = await fetch(`${this.base}/v5/market/tickers?category=linear&symbol=${sym}`);
                const td = await tr.json();
                const lp = parseFloat(td?.result?.list?.[0]?.lastPrice);
                if (lp > 0) ref = lp;
              } catch(e) {}
            }
            if (asMkt && C.type !== 'market') this.log(`[EW] ${sym}: ${C.tries} limit ${C.tries === 1 ? 'try' : 'tries'} unfilled — falling back to market`, 'warn');
            else if (n > 1) this.log(`[EW] ${sym}: repricing limit (try ${n}/${C.tries})`, 'info');
            const oid = await this.placeOrder(sym, 'Sell', asMkt ? 'Market' : 'Limit', qty, asMkt ? 0 : ref, C.offsetPct);
            if (oid === 'NOT_LIVE') { out.banned = true; return out; }
            if (!oid) continue; // rejected by exchange — no order resting, move to next try
            out.placed = true;
            const fp = await this.waitForPosition(sym, oid);
            if (fp) { out.fill = fp; return out; }
          }
          return out;
        },

        async placeOrder(symbol, side, orderType, qty, refPrice = 0, offsetPct = 0.1) {
          await this._ewDelay();
          let body;
          if (refPrice > 0) {
            const dp  = this._ewPriceDp(symbol);
            const lim = parseFloat((refPrice * (side === 'Sell' ? 1 - offsetPct / 100 : 1 + offsetPct / 100)).toFixed(dp));
            body = { category: 'linear', symbol, side, orderType: 'Limit', qty: String(qty), price: String(lim), timeInForce: 'GTC', reduceOnly: false };
          } else {
            body = { category: 'linear', symbol, side, orderType, qty: String(qty), timeInForce: 'IOC', reduceOnly: false };
          }
          const b = JSON.stringify(body);
          const h = await _sign(this.creds.key, this.creds.secret, b, this._tsOffset);
          try {
            const r = await fetch(`${this.base}/v5/order/create`, { method: 'POST', headers: h, body: b });
            const d = await this._ewSafeJson(r);
            if (!d)              { this.log(`[EW] placeOrder ${symbol}: empty response`, 'error'); return null; }
            if (d.retCode !== 0) { this.log(`[EW] placeOrder ${symbol}: ${d.retMsg}`, 'error'); const m = (d.retMsg || '').toLowerCase(); return (m.includes('not supported') || m.includes('sign the required agreement')) ? 'NOT_LIVE' : null; }
            return d.result?.orderId || null;
          } catch(e) { this.log(`[EW] placeOrder: ${e.message}`, 'error'); return null; }
        },

        async waitForPosition(symbol, orderId = null) {
          const POLL = 1500, TIMEOUT = this.cfg.ewFillTimeoutMs ?? 10000; // was 2.5s/30s: a thin book that doesn't fill in 10s won't in 30s, and every timeout stalls the whole scan
          const end  = Date.now() + TIMEOUT;
          const check = async () => {
            await this._ewDelay();
            const p = `category=linear&symbol=${symbol}`;
            const h = await _sign(this.creds.key, this.creds.secret, p, this._tsOffset);
            const r = await fetch(`${this.base}/v5/position/list?${p}`, { headers: h });
            const d = await this._ewSafeJson(r);
            const e = d ? (d.result?.list || []).find(x => x.symbol === symbol && x.side === 'Sell' && parseFloat(x.size) > 0) : null;
            if (!e) return null;
            const fp = parseFloat(e.avgPrice || e.entryPrice || 0);
            return fp > 0 ? fp : null;
          };
          while (Date.now() < end) {
            await new Promise(r => setTimeout(r, POLL));
            try { const fp = await check(); if (fp) return fp; } catch(e) {}
          }
          if (orderId) {
            try {
              await this._ewDelay();
              const b = JSON.stringify({ category: 'linear', symbol, orderId });
              const h = await _sign(this.creds.key, this.creds.secret, b, this._tsOffset);
              await fetch(`${this.base}/v5/order/cancel`, { method: 'POST', headers: h, body: b });
            } catch(e) {}
            try { const fp = await check(); if (fp) return fp; } catch(e) {}
          }
          this.log(`[EW] ${symbol}: fill timeout — aborted.`, 'warn');
          return null;
        },

        async _ewSetLeverage(symbol, lev) {
          await this._ewDelay();
          const b = JSON.stringify({ category: 'linear', symbol, buyLeverage: String(lev), sellLeverage: String(lev) });
          const h = await _sign(this.creds.key, this.creds.secret, b, this._tsOffset);
          try {
            const r = await fetch(`${this.base}/v5/position/set-leverage`, { method: 'POST', headers: h, body: b });
            const d = await this._ewSafeJson(r);
            if (d?.retCode === 0 || d?.retCode === 110043) return true;
            const msg = d?.retMsg || '';
            if (msg.includes('maxLeverage') || msg.includes('gt maxLev')) {
              this.log(`[EW] setLeverage ${symbol}: ${msg} — banning symbol`, 'warn');
              this._banSymbol?.(symbol, `leverage ${lev}× exceeds exchange max`);
              return false;
            }
            if (!msg.toLowerCase().includes('api key has expired')) this.log(`[EW] setLeverage ${symbol}: ${msg}`, 'warn');
          } catch(e) { this.log(`[EW] setLeverage error: ${e.message}`, 'warn'); }
          return true;
        },

        async setTP(pos, tpPrice) {
          await this._ewDelay();
          const dp  = this._ewPriceDp(pos.symbol);
          const trig = parseFloat(tpPrice.toFixed(dp));
          const b   = JSON.stringify({ category: 'linear', symbol: pos.symbol, takeProfit: String(trig), tpTriggerBy: 'LastPrice', positionIdx: 0 });
          const h   = await _sign(this.creds.key, this.creds.secret, b, this._tsOffset);
          try {
            const r = await fetch(`${this.base}/v5/position/trading-stop`, { method: 'POST', headers: h, body: b });
            const d = await this._ewSafeJson(r);
            if (d?.retCode === 0) { pos.currentTpPrice = tpPrice; return 'ok'; }
            this.log(`[EW] setTP ${pos.symbol}: ${d?.retMsg || 'no response'}`, 'warn');
            return 'error';
          } catch(e) { this.log(`[EW] setTP: ${e.message}`, 'error'); return 'error'; }
        },

        async _ewSetSL(symbol, slPrice) {
          await this._ewDelay();
          const dp  = this._ewPriceDp(symbol);
          const str = slPrice > 0 ? slPrice.toFixed(dp) : '0';
          const b   = JSON.stringify({ category: 'linear', symbol, stopLoss: str, slTriggerBy: 'LastPrice', positionIdx: 0 });
          const h   = await _sign(this.creds.key, this.creds.secret, b, this._tsOffset);
          try {
            const r = await fetch(`${this.base}/v5/position/trading-stop`, { method: 'POST', headers: h, body: b });
            const d = await this._ewSafeJson(r);
            if (d?.retCode !== 0) this.log(`[EW] setSL ${symbol}: ${d?.retMsg}`, 'warn');
          } catch(e) {}
        },

        async _ewCheckTp(pos, exTp, exAvg) {
          const dp    = this._ewPriceDp(pos.symbol);
          const lev   = pos.leverage || this.cfg.leverage;
          const tpPct = pos.tpPct > 0 ? pos.tpPct : this.cfg.entryTpRoi;
          const base  = exAvg > 0 ? exAvg : pos.entryPrice;
          const targetTp = parseFloat((base * (1 - tpPct / 100 / lev)).toFixed(dp));

          if (exTp > 0) {
            // Sync display from exchange
            pos.currentTpPrice = exTp;
            pos.tpPct          = parseFloat(((base - exTp) / base * lev * 100).toFixed(1));

            // Deviation check — 10% of expected TP distance from avgPrice
            const tolerance = base * tpPct / 100 / lev * 0.10;
            const deviation = Math.abs(exTp - targetTp);
            const lockKey   = exTp.toFixed(dp);
            const targetKey = targetTp.toFixed(dp);
            const lockAge   = pos._ewTpLockedAt ? Date.now() - pos._ewTpLockedAt : Infinity;
            // Bail if the exchange TP is accepted-authoritative OR if we already sent this target (in-flight / recently confirmed)
            if (lockAge < 60000 && (pos._ewTpLockKey === lockKey || pos._ewTpLockKey === targetKey)) return;

            if (deviation > tolerance) {
              this.log(`[EW] ${pos.symbol}: TP drift — exchange ${exTp.toFixed(dp)} vs target ${targetTp.toFixed(dp)} (Δ${deviation.toFixed(dp)}) — correcting`, 'warn');
              pos._ewTpLockKey = targetKey; pos._ewTpLockedAt = Date.now(); // pre-flight: block concurrent ticks
              const res = await this.setTP(pos, targetTp);
              if (res !== 'ok') {
                pos._ewTpLockKey = lockKey; pos._ewTpLockedAt = Date.now(); // refused — accept exchange TP as authoritative
                this.log(`[EW] ${pos.symbol}: TP correction refused — accepting exchange TP ${exTp.toFixed(dp)}`, 'debug');
              }
              // on 'ok': keep targetKey locked so the exchange echo doesn't re-trigger for 60 s
            }
          } else {
            // Exchange TP is null — reissue stored or recomputed target
            const reissue = pos.currentTpPrice > 0 ? pos.currentTpPrice : targetTp;
            if (reissue > 0) {
              const nullKey = `null:${reissue.toFixed(dp)}`;
              const lockAge = pos._ewTpLockedAt ? Date.now() - pos._ewTpLockedAt : Infinity;
              if (pos._ewTpLockKey === nullKey && lockAge < 60000) return;
              this.log(`[EW] ${pos.symbol}: TP null on exchange — reissuing @ ${reissue.toFixed(dp)}`, 'warn');
              pos._ewTpLockKey = nullKey; pos._ewTpLockedAt = Date.now(); // pre-flight lock
              const res = await this.setTP(pos, reissue);
              if (res !== 'ok') { pos._ewTpLockKey = nullKey; pos._ewTpLockedAt = Date.now(); }
              // on 'ok': keep nullKey locked until exchange echoes back a real TP value
            }
          }
        },

        async placeConditional(symbol, side, qty, tpPrice, triggerPrice) {
          await this._ewDelay();
          const dp = this._ewPriceDp(symbol);
          const priceStr = triggerPrice.toFixed(dp);
          const order = {
            category: 'linear',
            symbol,
            side,
            orderType: 'Limit',
            qty: String(qty),
            price: priceStr,
            triggerPrice: priceStr,
            triggerBy: 'LastPrice',
            triggerDirection: side === 'Sell' ? 1 : 2, // Sell add: triggers on price rising to triggerPrice
            timeInForce: 'GTC',
            reduceOnly: false,
          };
          if (tpPrice) {
            order.takeProfit  = tpPrice.toFixed(dp);
            order.tpTriggerBy = 'LastPrice';
          }
          const b = JSON.stringify(order);
          const h = await _sign(this.creds.key, this.creds.secret, b, this._tsOffset);
          try {
            const r = await fetch(`${this.base}/v5/order/create`, { method: 'POST', headers: h, body: b });
            const d = await this._ewSafeJson(r);
            if (!d || d.retCode !== 0) { this.log(`[EW] placeConditional ${symbol}: ${d?.retMsg || 'no response'}`, 'warn'); return null; }
            return d.result?.orderId || null;
          } catch(e) { this.log(`[EW] placeConditional: ${e.message}`, 'error'); return null; }
        },

        async _ewOrderStatus(symbol, orderId) {
          await this._ewDelay();
          const qs = `category=linear&symbol=${symbol}&orderId=${orderId}`;
          const h  = await _sign(this.creds.key, this.creds.secret, qs, this._tsOffset);
          try {
            const r = await fetch(`${this.base}/v5/order/realtime?${qs}`, { headers: h });
            const d = await this._ewSafeJson(r);
            const rec = d?.result?.list?.[0];
            return rec ? rec.orderStatus : null; // null: not in the open/realtime list (filled long ago, or truly gone)
          } catch(e) { return null; }
        },

        // Detects and repairs a live position whose first-wind DCA orders are missing —
        // either cancelled/expired/rejected on the exchange (bot restart, manual
        // intervention, connectivity gap) or never successfully placed at open. Mirrors
        // PseudoWinter's simulated _repairDcaStages, but re-places real conditional
        // orders instead of local records. Anchored to originalEntryPrice so trigger
        // percentages stay consistent with what was intended at open.
        async _ewRepairDcaStages(pos) {
          if (pos._binary) return;
          const expected = pos._stageCount || pos._firstWindStageCount || 0;
          if (!expected) return;

          const conds = (pos.orders || []).filter(o => o.type === 'cond' && !o._secondWind);
          let repaired = 0;

          // Re-verify any first-wind order we don't yet believe filled — it may have
          // been cancelled or expired on the exchange without us hearing about it.
          for (const o of conds) {
            if (o.filled) continue;
            const status = await this._ewOrderStatus(pos.symbol, o.orderId);
            if (status === 'Filled' || status === 'PartiallyFilled' || status === 'New' || status === 'Untriggered') continue; // still live, or stage-inference already caught the fill
            const newId = await this.placeConditional(pos.symbol, 'Sell', o.qty, o.tpPrice, o.price);
            if (newId) {
              o.orderId = newId;
              repaired++;
              this.log(`[EW] ${pos.symbol}: re-placed missing ${o.label} (was ${status || 'not found'})`, 'warn');
            } else {
              this.log(`[EW] ${pos.symbol}: failed to re-place ${o.label} — will retry next cycle`, 'error');
            }
          }

          // Fewer stages were ever placed than intended (e.g. a placement failed at
          // open) — fill in the missing ones anchored to the original entry price.
          if (conds.length < expected) {
            const instr = await this.getInstrInfo(pos.symbol);
            if (!instr) return;
            const addPcts     = this._activeAddPcts();
            const addNotional = this.cfg.addNotional || this.cfg.minNotional;
            const anchor      = pos.originalEntryPrice || pos.entryPrice;
            pos._stageQtys    = pos._stageQtys && pos._stageQtys.length ? pos._stageQtys : [pos.totalSize];
            let runNotional = anchor * pos._stageQtys[0];
            let runSize     = pos._stageQtys[0];
            for (const o of conds) { runNotional += o.price * o.qty; runSize += o.qty; }

            for (let i = conds.length; i < expected; i++) {
              const addPrice = this.snapPrice(anchor * (1 + addPcts[i] / 100), instr);
              if (!addPrice || addPrice <= 0) break;
              const addQty = this.snapQty(addNotional / addPrice, instr);
              if (addQty <= 0) continue;
              const projNotional = runNotional + addPrice * addQty;
              const projSize     = runSize + addQty;
              const addTp = this.snapPrice((projNotional / projSize) * (1 - this._tpRoi(i + 1) / 100 / pos.leverage), instr);
              const orderId = await this.placeConditional(pos.symbol, 'Sell', addQty, addTp, addPrice);
              if (!orderId) break;
              pos.orders.push({ label: `Add${i+1} +${addPcts[i]}%`, price: addPrice, qty: addQty, tpPrice: addTp, type: 'cond', filled: false, orderId });
              pos._stageQtys.push(projSize);
              runNotional = projNotional; runSize = projSize;
              repaired++;
            }
          }

          if (repaired > 0 && typeof this.persist === 'function') this.persist();
        },

        async _ewSyncPositions(opts = {}) {
          if (!this.creds.key || !this.creds.secret) return;
          try {
            await this._ewDelay();
            const p = 'category=linear&settleCoin=USDT';
            const h = await _sign(this.creds.key, this.creds.secret, p, this._tsOffset);
            const r = await fetch(`${this.base}/v5/position/list?${p}`, { headers: h });
            const d = await this._ewSafeJson(r);
            if (!d || d.retCode !== 0) return;
            const exMap = new Map((d.result?.list || [])
              .filter(e => e.side === 'Sell' && parseFloat(e.size) > 0)
              .map(e => [e.symbol, e]));
            // Import opposite-direction (Buy) positions as lesser, note-only records —
            // not managed, no TP/SL, no PnL tracking — so entries on those tickers
            // can be blocked instead of shorting against an existing long.
            const opp = {};
            for (const e of (d.result?.list || [])) {
              if (e.side !== 'Buy' || !(parseFloat(e.size) > 0)) continue;
              const prev = this._ewOpposite?.[e.symbol];
              opp[e.symbol] = {
                side:       'Buy',
                size:       parseFloat(e.size),
                entryPrice: parseFloat(e.avgPrice || e.entryPrice || 0),
                markPrice:  parseFloat(e.markPrice || 0),
                noticedAt:  prev?.noticedAt || Date.now(),
              };
              if (!prev) this.log(`[EW] ${e.symbol}: opposite (long) position on exchange — noted, not managed; new shorts on this ticker blocked`, 'warn');
            }
            for (const sym of Object.keys(this._ewOpposite || {})) {
              if (!opp[sym]) this.log(`[EW] ${sym}: opposite (long) position gone from exchange — ticker unblocked`, 'info');
            }
            this._ewOpposite = opp;
            for (const pos of [...this.positions]) {
              if (this._ewClosing?.[pos.id]) continue; // retry-limit close in flight — it finalises the position itself
              const ep = exMap.get(pos.symbol);
              if (!ep) {
                // Gone on exchange — fetch closed PnL for exit price
                let exitPrice = pos.markPrice || pos.entryPrice, reason = 'tp';
                try {
                  await this._ewDelay();
                  const pp = `category=linear&symbol=${pos.symbol}&limit=1`;
                  const ph = await _sign(this.creds.key, this.creds.secret, pp, this._tsOffset);
                  const pr = await fetch(`${this.base}/v5/position/closed-pnl?${pp}`, { headers: ph });
                  const pd = await this._ewSafeJson(pr);
                  const rec = pd?.result?.list?.[0];
                  if (rec) {
                    exitPrice = parseFloat(rec.avgExitPrice || rec.exitPrice || exitPrice);
                    reason    = parseFloat(rec.closedPnl || 0) >= 0 ? 'tp' : 'sl';
                  }
                } catch(e) {}
                this.log(`[EW] ${pos.symbol}: exchange closed [${reason}] @ ${exitPrice}`, 'info');
                await _origClose.call(this, pos, reason, exitPrice);
              } else {
                const exAvg    = parseFloat(ep.avgPrice || ep.entryPrice || pos.entryPrice);
                const prevEntry = pos.entryPrice;
                pos.markPrice  = parseFloat(ep.markPrice || exAvg || pos.markPrice);
                pos.totalSize  = parseFloat(ep.size || pos.totalSize);

                // DCA repair: only on the post-scan sync, only for non-binary positions that actually have DCA orders,
                // and not for positions opened in the last 2 min (order/realtime can lag a fresh placement — would re-place it)
                if (opts.repair && !pos._binary && (Date.now() - (pos.openedAt || 0)) > 120000 && (pos.orders || []).some(o => o.type === 'cond')) {
                  try {
                    await this._ewRepairDcaStages(pos);
                  } catch(e) {
                    this.log(`[EW] ${pos.symbol}: DCA repair failed — ${e.message}`, 'error');
                  }
                }

                // Infer DCA stage from realized position size vs. the cumulative qty
                // thresholds recorded at open — Bybit fills the conditional add orders
                // server-side, so size growth is the only signal needed (no per-order
                // polling). Once every first-wind stage has filled, arm the native SL.
                let stage = pos.dcaStage || 0;
                if (!pos._binary && Array.isArray(pos._stageQtys) && pos._stageQtys.length > 1) {
                  stage = 0;
                  for (let i = 1; i < pos._stageQtys.length; i++) {
                    if (pos.totalSize >= pos._stageQtys[i] * 0.999) stage = i;
                  }
                  if (stage > (pos.dcaStage || 0)) {
                    pos.dcaStage = stage;
                    pos.tpPct    = this._tpRoi(stage);
                    const conds  = (pos.orders || []).filter(o => o.type === 'cond');
                    for (let i = 0; i < stage && i < conds.length; i++) conds[i].filled = true;
                    this.log(`[EW] ${pos.symbol}: DCA stage ${stage}/${pos._stageCount || conds.length} filled`, 'trade');
                    if (typeof this.persist === 'function') this.persist();
                  }
                }

                // Prefer the exchange avgPrice — it's what Bybit will actually use to
                // compute realized P&L — but guard against a stale read right after a
                // fill (a historical Bybit quirk): if it's barely moved from where it
                // was despite a stage having just filled, fall back to our own
                // manually-estimated average for this cycle and let the next sync
                // retry. _ewCheckTp's drift correction converges the native TP once
                // the trusted average is in place.
                if (stage > 0 && Array.isArray(pos._stageQtys)) {
                  const localAvg     = _dcaLocalAvg(pos, stage);
                  const expectedMove = Math.abs(localAvg - prevEntry);
                  const actualMove   = Math.abs(exAvg - prevEntry);
                  const staleLikely  = exAvg <= 0 || (expectedMove > 0 && actualMove < expectedMove * 0.25);
                  if (staleLikely) {
                    pos.entryPrice = localAvg;
                    this.log(`[EW] ${pos.symbol}: exchange avgPrice hasn't caught up yet (${exAvg}) — using estimate ${localAvg.toFixed(6)} this cycle`, 'debug');
                  } else {
                    pos.entryPrice = exAvg;
                  }
                } else if (exAvg > 0) {
                  pos.entryPrice = exAvg;
                }

                if (!pos._binary && Array.isArray(pos._stageQtys) && pos._stageQtys.length > 1) {
                  const totalStages = pos._firstWindStageCount || pos._stageCount || 0;
                  if (!pos.slSet && stage >= totalStages && totalStages > 0) {
                    const slInstr = await this.getInstrInfo(pos.symbol);
                    if (slInstr) {
                      const slPrice = this._dcaSLPrice(pos, slInstr);
                      await this._ewSetSL(pos.symbol, slPrice);
                      pos.slPrice = slPrice;
                      pos.slSet   = true;
                      this.log(`[EW] ${pos.symbol}: all ${totalStages} DCA stage(s) filled — SL armed @ ${slPrice}`, 'warn');
                      if (typeof this.persist === 'function') this.persist();
                    }
                  }
                }

                const exTp = parseFloat(ep.takeProfit || 0);
                await this._ewCheckTp(pos, exTp, pos.entryPrice);
              }
            }
            this._ewLastSync = Date.now();
          } catch(e) { this.log(`[EW] sync error: ${e.message}`, 'warn'); }
        },

        async pseudoOpenShort(candidate) {
          if (!this.creds.key || !this.creds.secret) {
            this.log('[EW] No credentials set — set API key/secret in config panel.', 'warn');
            return;
          }
          const sym = candidate.symbol;
          if (typeof this._isSymbolBanned === 'function' ? this._isSymbolBanned(sym) : this._symbolBanlist?.[sym]) return;
          { const cd = this._ewFillCooldown?.[sym]; if (cd && Date.now() < cd) return; } // recent fill timeout -- don't retry every cycle
          // Before the entry: symbol-scoped exchange check — never stack a new order on an untracked position
          try {
            await this._ewDelay();
            const _q = `category=linear&symbol=${sym}`;
            const _h = await _sign(this.creds.key, this.creds.secret, _q, this._tsOffset);
            const _d = await this._ewSafeJson(await fetch(`${this.base}/v5/position/list?${_q}`, { headers: _h }));
            if (_d?.retCode === 0 && (_d.result?.list || []).some(e => parseFloat(e.size) > 0)) {
              this.log(`[EW] ${sym}: position already open on exchange — skipping entry`, 'warn'); return;
            }
          } catch(e) {}
          if (this._ewOpposite?.[sym]) {
            this.log(`[EW] ${sym}: skipped — opposite (long) position open on exchange`, 'warn');
            return;
          }
          if (this.positions.find(p => p.symbol === sym)) return;
          if (this.positions.length >= this.cfg.maxPos) return;
          if (typeof this._lfPartnerHasSymbol === 'function' && this._lfPartnerHasSymbol(sym)) {
            this.log(`[EW] ${sym}: entry blocked -- leader already holds a position on this ticker`, 'warn');
            return;
          }

          const instr = await this.getInstrInfo(sym);
          if (!instr) { this.log(`[EW] ${sym}: instrument info unavailable`, 'warn'); return; }

          const price = candidate.price;
          if (instr.minPrice > 0 && price < instr.minPrice) {
            this.log(`[EW] ${sym}: price ${price} below exchange minPrice ${instr.minPrice} — BLACKLISTED`, 'warn');
            this._banSymbol?.(sym, `Price below exchange minPrice (${price} < ${instr.minPrice})`);
            return;
          }

          const levRes = this.resolveEffectiveLeverage(sym, instr);
          if (!levRes) return;
          const lev = (typeof levRes === 'object' ? levRes.lev : levRes) || this.cfg.leverage;

          const rawQty = this.cfg.minNotional / price;
          const qty    = this.snapQty(rawQty, instr);
          if (!qty || qty < (instr.minQty || 0)) {
            this.log(`[EW] ${sym}: qty below min — BLACKLISTED`, 'warn');
            this._banSymbol?.(sym, `Qty rounds to 0 at configured notional (price ${price})`);
            return;
          }
          const notional = qty * price;
          if (instr.minOrderAmt > 0 && notional < instr.minOrderAmt) {
            this.log(`[EW] ${sym}: notional below min — BLACKLISTED`, 'warn');
            this._banSymbol?.(sym, `Notional ${notional.toFixed(2)} below exchange minOrderAmt ${instr.minOrderAmt}`);
            return;
          }

          const binary = this.cfg.binaryModeEnabled;
          // candidate._tpPct / _slPct: per-position targets from MIW/MIC Target Halving (host honours them the same way)
          const tpPct  = (candidate._tpPct > 0) ? candidate._tpPct : (binary ? (this.cfg.binaryTpPct ?? 18) : this.cfg.entryTpRoi);

          if (!await this._ewSetLeverage(sym, lev)) return;
          if ((typeof this._isDrawdownHalted === 'function' && this._isDrawdownHalted()) || (typeof this._isGainsLocked === 'function' && this._isGainsLocked())) {
            this.log(`[EW] ${sym}: entry halted mid-flight -- aborting`, 'warn');
            return;
          }
          this.log(`[EW] Placing SELL ${sym} qty=${qty} @ ~${price}…`, 'info');
          const ent = await this._ewEnter(sym, qty, price);
          if (ent.banned) { this.log(`[EW] ${sym}: blocked by exchange — banned for 1 week`, 'warn'); this._banSymbol?.(sym, 'blocked by exchange (unsupported or agreement required)'); return; }
          const fillPrice = ent.fill;
          if (!fillPrice) { if (ent.placed) (this._ewFillCooldown ||= {})[sym] = Date.now() + (this.cfg.ewFillCooldownMs ?? 15 * 60000); return; }

          const tpPrice = this.snapPrice(fillPrice * (1 - tpPct / 100 / lev), instr);
          const bSlPct  = (candidate._slPct > 0) ? candidate._slPct : (this.cfg.binarySlPct ?? 18);
          const slPrice = binary ? this.snapPrice(fillPrice * (1 + bSlPct / 100 / lev), instr) : 0;

          // Non-binary: place real conditional DCA add orders above entry, each carrying
          // its own take-profit so the exchange applies it the moment that stage fills.
          // SL stays unset here — it's armed in _ewSyncPositions once every stage placed
          // below has actually filled on the exchange.
          const dcaOrders = [];
          const stageQtys = [qty];
          if (!binary) {
            const addPcts      = this._activeAddPcts();
            const stages       = Math.min(this._dcaStageCount() || 1, addPcts.length);
            const addNotional  = this.cfg.addNotional || this.cfg.minNotional;
            let runNotional    = fillPrice * qty;
            let runSize        = qty;
            for (let i = 0; i < stages; i++) {
              const addPrice = this.snapPrice(fillPrice * (1 + addPcts[i] / 100), instr);
              if (!addPrice || addPrice <= 0) { this.log(`[EW] ${sym}: DCA Add${i+1} price invalid — stopping ladder at ${dcaOrders.length} stage(s)`, 'warn'); break; }
              const addQty = this.snapQty(addNotional / addPrice, instr);
              if (addQty <= 0) continue;
              const projNotional = runNotional + addPrice * addQty;
              const projSize     = runSize + addQty;
              const expectedAvg  = projNotional / projSize;
              const addTp = this.snapPrice(expectedAvg * (1 - this._tpRoi(i + 1) / 100 / lev), instr);
              const orderId = await this.placeConditional(sym, 'Sell', addQty, addTp, addPrice);
              if (!orderId) { this.log(`[EW] ${sym}: DCA Add${i+1} order rejected — stopping ladder at ${dcaOrders.length} stage(s)`, 'warn'); break; }
              runNotional = projNotional;
              runSize     = projSize;
              dcaOrders.push({ label: `Add${i+1} +${addPcts[i]}%`, price: addPrice, qty: addQty, tpPrice: addTp, type: 'cond', filled: false, orderId });
              stageQtys.push(runSize);
            }
          }

          const pos = {
            id:                 `${sym}_${Date.now()}`,
            symbol:             sym,
            entryPrice:         fillPrice,
            originalEntryPrice: fillPrice,
            markPrice:          fillPrice,
            totalSize:          qty,
            leverage:           lev,
            margin:             notional / lev,
            change24h:          (candidate.change ?? 0).toFixed(2),
            rsi6:               candidate.rsi6,
            rsi12:              candidate.rsi12,
            rsi24:              candidate.rsi24,
            fundingRate:        candidate.fundingRate ?? null,
            _fundingIntervalMs: 8 * 3600000,
            upnl:               0,
            openedAt:           Date.now(),
            phase:              'normal',
            isPending:          false,
            currentTpPrice:     tpPrice,
            tpPct,
            slPrice,
            slSet:              binary,
            dcaStage:           0,
            orders:             dcaOrders,
            _stageCount:        binary ? 0 : dcaOrders.length,
            _firstWindStageCount: binary ? 0 : dcaOrders.length,
            _stageQtys:         stageQtys,
            _pseudo:            false,
            _lastSeenAt:        Date.now(),
            _binary:            binary,
            _slPctOverride:     (candidate._slPct > 0) ? candidate._slPct : undefined, // honoured by _dcaSLPrice/_binarySLPrice
          };

          this.positions.push(pos);
          this._lfPublishPositions?.();
          // Pass through any caller-supplied tagging fields (e.g. MIW's _miw/_miwCriteria)
          // so a registered _roleBadgeProviders entry can claim this position's badge
          // instead of falling back to the plain GAINER/LOSER default.
          { const _openSkip = new Set(['_tpPct','_slPct','_pseudo','_lastSeenAt','_stageCount','_swStageCount','_binary','_slPctOverride','_fundingIntervalMs','_funIntervalMs','_fundingAccrued']); for (const [k,v] of Object.entries(candidate)) { if (k.startsWith('_') && !_openSkip.has(k)) pos[k] = v; } }
          if (typeof this.persist === 'function') this.persist();

          if (tpPrice > 0) await this.setTP(pos, tpPrice);
          if (slPrice > 0) await this._ewSetSL(sym, slPrice);

          const g = (this.gainers || []).find(x => x.symbol === sym);
          if (g) g.status = 'active';

          this.log(`⚡ [EW] SHORT ${sym} @ ${fillPrice} | TP:${tpPrice}${slPrice ? ' SL:'+slPrice : ''}${dcaOrders.length ? ' | '+dcaOrders.length+' DCA stage(s) armed' : ''}`, 'info');

          // Callers (e.g. MIW's own tagging step) need a direct reference to the position
          // they just opened rather than assuming it's the last array element — a
          // concurrent open for a different symbol can land in between while this one
          // was still waiting on the real exchange fill.
          return pos;
        },

        async pseudoClosePosition(pos, reason = 'manual', fillPrice = null) {
          if (this._ewClosing?.[pos.id]) return; // a retry-limit close is already running for this position
          if (this.creds.key && this.creds.secret && !this._ewClosing?.[pos.id]) {
            if (!this._ewClosing) this._ewClosing = {};
            this._ewClosing[pos.id] = true;
            try {
              const ref = fillPrice || pos.markPrice || pos.entryPrice;
              if (reason === 'tp' || reason === 'sl') {
                // Exchange-native TP/SL already filled — fetch real exit price, no redundant order
                await this._ewDelay();
                try {
                  const pp = `category=linear&symbol=${pos.symbol}&limit=1`;
                  const ph = await _sign(this.creds.key, this.creds.secret, pp, this._tsOffset);
                  const pr = await fetch(`${this.base}/v5/position/closed-pnl?${pp}`, { headers: ph });
                  const pd = await this._ewSafeJson(pr);
                  const rec = pd?.result?.list?.[0];
                  if (rec) fillPrice = parseFloat(rec.avgExitPrice || rec.exitPrice || ref);
                } catch(e) {}
              } else {
                // Manual/force close — limit at last ±0.1%, repriced every 10s until flat, then fetch real fill
                await this._ewLimitClose(pos.symbol, ref);
                try {
                  await this._ewDelay();
                  const pp = `category=linear&symbol=${pos.symbol}&limit=1`;
                  const ph = await _sign(this.creds.key, this.creds.secret, pp, this._tsOffset);
                  const pr = await fetch(`${this.base}/v5/position/closed-pnl?${pp}`, { headers: ph });
                  const pd = await this._ewSafeJson(pr);
                  const rec = pd?.result?.list?.[0];
                  if (rec) fillPrice = parseFloat(rec.avgExitPrice || rec.exitPrice || ref);
                } catch(e) {}
              }
            } catch(e) {
              this.log(`[EW] close error ${pos.symbol}: ${e.message}`, 'warn');
            } finally {
              delete this._ewClosing[pos.id];
            }
          }
          return _origClose.call(this, pos, reason, fillPrice || pos.markPrice || pos.entryPrice);
        },

        async runScheduledCycle() {
          const _live = this.creds.key && this.creds.secret;
          if (_live) await this._ewSyncPositions();                  // before the scan loop
          const _r = await _origCycle.call(this);
          if (_live) await this._ewSyncPositions({ repair: true });  // after it — the only place DCA repair runs
          return _r;
        },

        // Sized from the exchange (not pos.totalSize) so partial fills carry into the next attempt.
        // Returns null when the lookup fails, so a failed lookup never reads as "flat".
        async _ewPosSize(symbol) {
          try {
            await this._ewDelay();
            const q = `category=linear&symbol=${symbol}`;
            const h = await _sign(this.creds.key, this.creds.secret, q, this._tsOffset);
            const r = await fetch(`${this.base}/v5/position/list?${q}`, { headers: h });
            const d = await this._ewSafeJson(r);
            if (!d || d.retCode !== 0) return null;
            const e = (d.result?.list || []).find(x => x.side === 'Sell' && parseFloat(x.size) > 0);
            return e ? parseFloat(e.size) : 0;
          } catch(e) { return null; }
        },

        // Closes the whole exchange position with a reduce-only limit at last price +0.1%,
        // cancelling and repricing every ewCloseRetryMs (default 10s) until the position is flat.
        // Used by every close except exchange-native TP/SL. Retries until filled.
        async _ewLimitClose(symbol, ref) {
          const EVERY = this.cfg.ewCloseRetryMs ?? 10000, POLL = 2000, C = this._ewCloseCfg();
          let oid = null, n = 0;
          for (;;) {
            if (oid) {
              try {
                await this._ewDelay();
                const cb = JSON.stringify({ category: 'linear', symbol, orderId: oid });
                const ch = await _sign(this.creds.key, this.creds.secret, cb, this._tsOffset);
                await fetch(`${this.base}/v5/order/cancel`, { method: 'POST', headers: ch, body: cb });
              } catch(e) {}
              oid = null;
            }
            const size = await this._ewPosSize(symbol);
            if (size === 0) return;
            if (size != null) {
              let last = ref;
              try {
                const tr = await fetch(`${this.base}/v5/market/tickers?category=linear&symbol=${symbol}`);
                const td = await tr.json();
                const lp = parseFloat(td?.result?.list?.[0]?.lastPrice);
                if (lp > 0) last = lp;
              } catch(e) {}
              if (last > 0) {
                n++;
                const asMkt = C.type === 'market' || (C.fallback && n > C.tries);
                if (asMkt && C.type !== 'market' && n === C.tries + 1) this.log(`[EW] close ${symbol}: ${C.tries} limit ${C.tries === 1 ? 'try' : 'tries'} unfilled — falling back to market`, 'warn');
                const lim = parseFloat((last * (1 + C.offsetPct / 100)).toFixed(this._ewPriceDp(symbol)));
                try {
                  await this._ewDelay();
                  const b = JSON.stringify(asMkt ? { category: 'linear', symbol, side: 'Buy', orderType: 'Market', qty: String(size), timeInForce: 'IOC', reduceOnly: true } : { category: 'linear', symbol, side: 'Buy', orderType: 'Limit', qty: String(size), price: String(lim), timeInForce: 'GTC', reduceOnly: true });
                  const h = await _sign(this.creds.key, this.creds.secret, b, this._tsOffset);
                  const r = await fetch(`${this.base}/v5/order/create`, { method: 'POST', headers: h, body: b });
                  const d = await this._ewSafeJson(r);
                  if (d?.retCode === 0) { oid = d.result?.orderId || null; if (n > 1) this.log(`[EW] close ${symbol}: ${asMkt ? 'market order' : 'repriced limit @ ' + lim} (try ${n})`, 'info'); }
                  else this.log(`[EW] close ${symbol}: ${d?.retMsg || 'no response'} (try ${n})`, 'warn');
                } catch(e) { this.log(`[EW] close ${symbol}: ${e.message} (try ${n})`, 'warn'); }
              }
            }
            const end = Date.now() + ((C.type === 'market' || (C.fallback && n > C.tries)) ? Math.min(EVERY, 4000) : EVERY);
            while (Date.now() < end) {
              await new Promise(res => setTimeout(res, POLL));
              if (await this._ewPosSize(symbol) === 0) return;
            }
          }
        },

        async _ewForceFlatten(symbol, mark = 0) {
          try { await this._ewLimitClose(symbol, mark); }
          catch(e) { this.log(`[BAIL-ERR] ${symbol} — ${e.message}`, 'warn'); }
        },

        async bailAll() {
          await _origBailAll.call(this);
          if (!(this.creds.key && this.creds.secret)) return;
          // The close attempt above removes positions locally regardless of whether the
          // real reduceOnly order actually filled, so re-check the exchange directly
          // (not this.positions) for any short still open and flatten it here.
          try {
            await this._ewDelay();
            const p = 'category=linear&settleCoin=USDT';
            const h = await _sign(this.creds.key, this.creds.secret, p, this._tsOffset);
            const r = await fetch(`${this.base}/v5/position/list?${p}`, { headers: h });
            const d = await this._ewSafeJson(r);
            const lingering = (d?.retCode === 0 ? (d.result?.list || []) : []).filter(e => e.side === 'Sell' && parseFloat(e.size) > 0);
            if (lingering.length) {
              this.log(`[BSC] ⚡ Bail re-check: ${lingering.length} short(s) still open — flattening directly…`, 'warn');
              await Promise.all(lingering.map(e => this._ewForceFlatten(e.symbol, parseFloat(e.markPrice || 0))));
              this.log(`[BSC] ⚡ Bail re-check complete.`, 'warn');
            }
          } catch(e) { this.log(`[BAIL-ERR] re-check failed — ${e.message}`, 'warn'); }
        },

        async pseudoWatchPositions() {
          // Update markPrice for live positions (base watch skips _pseudo=false). Prefers the host's WS ticker
          // feed when it has a read; otherwise one throttled REST fetch per symbol with adaptive backoff
          // (base interval, doubling while price is flat, 60s cap) — was an unconditional REST fetch per
          // position on every 5s tick.
          const live = this.positions.filter(p => !p._pseudo);
          const _now = Date.now(), _baseMs = (this.cfg.restPollBaseSec ?? 5) * 1000;
          const _st = (this._ewPxState = this._ewPxState || {});
          for (const pos of live) {
            let mp = 0;
            if (typeof wsTicker === 'function') { try { const wt = wsTicker(pos.symbol); if (wt) mp = parseFloat(wt.lastPrice) || 0; } catch {} }
            if (!(mp > 0)) {
              const st = (_st[pos.symbol] = _st[pos.symbol] || { last: 0, next: 0, every: _baseMs });
              if (_now >= st.next) {
                try {
                  const tr = await fetch(`${this.base}/v5/market/tickers?category=linear&symbol=${pos.symbol}`);
                  const td = await tr.json();
                  const t  = td?.retCode === 0 ? td.result?.list?.[0] : null;
                  const lp = t ? parseFloat(t.lastPrice || t.markPrice || 0) : 0;
                  if (lp > 0) {
                    const moved = st.last > 0 && Math.abs(lp - st.last) / st.last >= 0.001;
                    st.every = (st.last > 0 && !moved) ? Math.min(st.every * 2, 60000) : _baseMs;
                    st.last = lp;
                  }
                } catch {}
                st.next = _now + st.every;
              }
              mp = st.last;
            }
            if (mp > 0) {
              pos.markPrice = mp;
                  pos.upnl = (pos.entryPrice - mp) / pos.entryPrice * pos.leverage * pos.margin;
            }
          }
          if (live.length) this.acct.upnl = this.positions.reduce((s, p) => s + (Number.isFinite(p.upnl) ? p.upnl : 0), 0);
          // TP drift correction runs every watch tick; 60s lock prevents excess setTP calls
          for (const pos of live) {
            if (pos.currentTpPrice > 0 || pos.tpPct > 0)
              await this._ewCheckTp(pos, pos.currentTpPrice, pos.entryPrice);
          }
          return _origWatch.call(this);
        },
      });
    },
  };
})();
</script>
