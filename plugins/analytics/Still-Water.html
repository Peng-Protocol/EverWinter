<!--
  Ashfall Strategy Plugin for PseudoChaser
  Scoring and cross-bot coordination layer for MultiIndicator-Chaser.

  Sample Scorer: every criterion reading the sample batch carries is sorted, per pole, into
  extreme vs lukewarm against that pole's own observed spread and scored against how the
  sampled tickers moved. The chart and headline show the side that is earning more. The
  Indicator forecast (always on) ranks each batch's tickers for entry: er when Regime caution
  is active, else e (see _swFcRankMap).

  Cross bus: cascade/sacrifice triggers are broadcast to the partner bot and
  listed in the Cross tab.

  Order Count Surveillance supplies the OC/volume/OI population samples that
  MIC's ocs, ocx, va, iol, ios, lta and lpa criteria are all measured against (lta/lpa read the
  1hr candle fetched per sampled ticker, see _swHourCandle).

  The scorer is direction-agnostic: it only learns what the sampled tickers did
  — the same logic powers Permafrost on PseudoWinter.

  Load via Plugin Manager in PseudoChaser's config panel.
  Load AFTER SunChaser if using live trading — see README Plugin Stack Order.
  targetBot: both
-->

  // base-criterion combination, not per exact tier value (which is combinatorially large
  // and would barely ever repeat, defeating the quota). Bare '+fund'/'-fund' (Blind-Entry/
  // Liquid-Diver's own tag, never produced by MIC which is always tiered) stay bare so
  // swCritEmoji reads them through its bare-tag branch, not the tiered-fund regex.
  const collapseCrit = c => c.replace(/\d+$/, '');
  const collapseKey = criteria => [...criteria].map(collapseCrit).sort().join(',');

  // ── Extremity Scorer dial families ──
  // Every continuous/tiered criterion already carries its computed depth as a numeric
  // suffix on the annotated tag (e.g. "fund+3" — see MultiIndicator-Chaser's
  // _micOpen/_micAnnotateLiveCrit, which floor that same depth into a tier). The dial
  // reuses that existing magnitude directly rather than needing a separate raw-value log.
  // Two-pole families pit their '+'/'-' side against each other — "which extreme end was
  // more profitable". Criteria universe: fund, V/A, IO/L, IO/S, LTA, LPA.
  const DIAL_POLES = {
    'fund+': { family: 'fund', pole: 'pos' },       'fund-': { family: 'fund', pole: 'neg' },
    'va+':   { family: 'va',   pole: 'pos' },       'va-':   { family: 'va',   pole: 'neg' },
    // IO/L and IO/S: the long / short share of open interest (oi x Bybit's long/short ratio) against its window average.
    'iol+':  { family: 'iol',  pole: 'pos' },       'iol-':  { family: 'iol',  pole: 'neg' },
    'ios+':  { family: 'ios',  pole: 'pos' },       'ios-':  { family: 'ios',  pole: 'neg' },
    // LTA/LPA — 1hr turnover vs own 24h/24, and 1hr price change vs the population's.
    'lta+':  { family: 'lta',  pole: 'pos' },       'lta-':  { family: 'lta',  pole: 'neg' },
    'lpa+':  { family: 'lpa',  pole: 'pos' },       'lpa-':  { family: 'lpa',  pole: 'neg' },
  };
  const BARE_DIAL_TAGS = {
    '+fund': { family: 'fund', pole: 'pos' }, '-fund': { family: 'fund', pole: 'neg' },
    '+ocs':  { family: 'ocs',  pole: 'pos' }, '-ocs':  { family: 'ocs',  pole: 'neg' },
  };
  const dialInfo = key => DIAL_POLES[key] || BARE_DIAL_TAGS[key] || null;
  // Every remaining family's display key already matches its own tag string.
  const dialDisplayKey = (family, pole) => family + (pole === 'pos' ? '+' : '-');
  const SAMPLE_STATE_KEY = '__ew_sample_state_v1'; // cross-bot sample sharing
  const _SW_SHARE_MEMO = { at: 0, html: '' }; // CROSS tab 'Last share' readout cache (re-read every 4 s while open)

  // ── Per-data-type storage cap ──
  // Each distinct data type (liq history, OC history, scorecard, ...) is capped
  // independently at TYPE_BYTE_CAP bytes, trimming its own oldest entries when it alone
  // exceeds budget. Deliberately atomized rather than one blanket cap on the whole plugin
  // blob, so an oversized data type can't force pruning of unrelated data that's still
  // well within budget.
  const TYPE_BYTE_CAP = 200 * 1024;
  function trimToByteCap(arr, maxBytes = TYPE_BYTE_CAP) {
    // Assumes arr is ordered oldest-first (push-appended). Converges in a handful of
    // iterations by estimating how many records to drop from the size overshoot, rather
    // than shifting one at a time and re-stringifying the whole array each try.
    if (!Array.isArray(arr) || arr.length < 2) return arr;
    let out = arr;
    let size = new Blob([JSON.stringify(out)]).size;
    let guard = 0;
    while (size > maxBytes && out.length > 1 && guard < 25) {
      const avg = size / out.length;
      const excess = size - maxBytes;
      const drop = Math.min(out.length - 1, Math.max(1, Math.ceil(excess / avg)));
      out = out.slice(drop);
      size = new Blob([JSON.stringify(out)]).size;
      guard++;
    }
    return out;
  }

        },
        // The window's typical move in pp: median |hc - average| over each ticker's latest reading. A liquidation event of the median size

        // Event-size history: one entry per liquidation event, [time, net liquidated $ (|shorts - longs|)], kept for swLiqHistHrs (never shorter than the

        _swLiqHistMs() { const v = Number(this.cfg.swLiqHistHrs); return Math.max(isFinite(v) && v > 0 ? Math.min(168, v) : 24, Math.max(0.5, Number(this.cfg.swObsHorizonHrs) || 3)) * 3600000; },

        // Median / peak / bottom / count of the event sizes kept; a follower shows the leader's published summary.
        _swLiqHistStats() {

        // End of watch (the batch it re-fetched has just landed): one 'l' observation per liquidated ticker, plus the chart annotation.
        // Each event's pp = its side x the window's typical move x (its net liquidated $ against the median event, capped at the history's peak).
        // The yardstick is the history plus this batch's own events, so it works from the first event (a lone event reads as one typical move).
        _swLiqIngest(entry) {
          const cl = LIQ.closing;
          if (!cl) return 0;

          const st = (this._swSampleStore ||= { obs: [] });
          const S = this._swLiqScale();
          if (S == null) return 0;
          const recs = {};

          for (const [sym, t] of Object.entries(cl.snap)) {

              // is the ts a follower files that cycle's history entry under.

        },
        // Following: file the leader's published lean (symbol -> pp, 0 = watched but quiet) on the matching cycle of our own history.
        _swLiqAdopt() {

        // 'n' and 'l' observations are trimmed to the byte cap separately, so the busier kind can't push the other out.

        // -- Stablecoin Filter ----------------------------------------------------------------------------------------

        _swStbMaxAgeMs() { return Math.max(1, Number(this.cfg.swStbHours) || 12) * 3600000; },

        _swStbSave() {

        // ── Instability ────────────────────────────────────────────────────────────────────────────────────────────────────────

        },
        // Liq-view pill presentation, from one watch's split. 'fav' = pure and in the bot's favor, 'mixfav' = mixed, favorable side

          const fav = dir * lean > 0;
          const mixed = minor * 100 > (Number(this.cfg.swMixedPct) || 30);
          return { cls: fav ? (mixed ? 'mixfav' : 'fav') : (mixed ? 'mixunf' : 'unf'), u: u / tot, d: d / tot };
        },
        // Following: adopt the leader's published store instead of building our own (the regular scorer's closed-trade
        // records are per-bot, but sample scores are market data — a follower can't fetch/resolve them itself, so it
        // must share the leader's). Deduped on the shared snapshot's ts.
        _swSampleAdopt() {
          if (!this._swFollowing()) return false;
          const sh = this._sharedRead?.('sampleScore');
          if (!sh?.data || !Array.isArray(sh.data.obs)) return false;
          if (sh.ts && sh.ts === this._swSampleLastSharedTs) return false;
          this._swSampleLastSharedTs = sh.ts;
          this._swSampleStore = { obs: sh.data.obs, ...(sh.data.wx ? { wx: sh.data.wx } : {}), ...(sh.data.lqs ? { lqs: sh.data.lqs } : {}) };
          try { DS.setItem(SAMPLE_OBS_KEY, JSON.stringify(this._swSampleStore)); } catch (_) {}
          return true;
        },
        // Criterion tags for one sampled ticker, in exactly the annotated-tag format MIC/MIW produce
        // (family + signed tier), so the existing dialInfo/collapseCrit/magnitude logic applies as-is.
        // Mirrors _micAnnotateCritRaw but reads the sample record instead of a live ticker; a family
        // with no data for this record is simply omitted.
        _swSampleTags(r, sym, includeLpa) {
          const tags = [];
          const sgn = n => (n >= 0 ? '+' : '') + n;
          const vol = Number(r.vol), oi = Number(r.oi);
          if (typeof r.fr === 'number' && !isNaN(r.fr)) {
            const tier = Math.trunc(r.fr / this._swSampleStep('fund'));
            tags.push('fund' + (r.fr < 0 ? '-' : '+') + Math.abs(tier));
          }
          const wv = this._swVolIoWindowAvg?.('vol');
          if (vol > 0 && wv > 0) tags.push('va' + sgn(Math.floor((Math.log(vol / wv) * 100) / this._swSampleStep('va'))));
          // IO/L, IO/S: the long / short share of open interest (oi x long share, oi x short share) against that share's window average, same log-tier as V/A. Needs the batch's long/short ratio (bl) and 10+ readings in the window.
          if (oi > 0 && Number(r.bl) > 0 && Number(r.bl) < 1) {
            for (const [fam, long] of [['iol', 1], ['ios', 0]]) {
              const st = this._swWindowStats(long ? 'oil' : 'ois'), v = this._swLsOi(r, long);
              if (st.n >= 10 && v > 0) tags.push(fam + sgn(Math.floor((Math.log(v / (st.sum / st.n)) * 100) / this._swSampleStep(fam))));
            }
          }
          if (typeof r.ht === 'number') {
            const dev = this._swLtaDev(r.ht, r.vol);
            if (dev != null) tags.push('lta' + sgn(Math.floor(dev / this._swSampleStep('lta'))));
          }
          if (includeLpa && typeof r.hc === 'number' && !isNaN(r.hc)) {
            const avg = this._swLpaWindowAvg(sym);
            if (avg != null) tags.push('lpa' + sgn(Math.floor((r.hc - avg) / this._swSampleStep('lpa'))));
          }
          return tags;
        },
        // Called with each new sample-cycle entry: criteria tiers at sample time against the last completed hour's price change (demeaned
        // against the rolling LPA average).
        _swSampleIngest(entry) {
          if (!entry || !Array.isArray(entry.results)) return;
          if (this._swFollowing()) return; // following — adopt the leader's scored store (_swSampleAdopt) instead of double-counting its batch
          const st = (this._swSampleStore ||= { obs: [] });
          let added = 0;
          for (const r of entry.results) {
            if (!r || typeof r.sym !== 'string' || typeof r.hc !== 'number' || isNaN(r.hc)) continue;
            const avg = this._swLpaWindowAvg(r.sym);
            if (avg == null) continue;
            const tags = this._swSampleTags(r, r.sym, false);
            if (!tags.length) continue;
            st.obs.push({ t: entry.ts, s: r.sym, k: 'n', y: +(r.hc - avg).toFixed(4), r: +Number(r.hc).toFixed(4), c: tags });
            added++;
          }
          if (this._swLiqOn()) added += this._swLiqIngest(entry);
          if (added || this.cfg.swLiqEnabled) this._swSampleSaveSoon();
        },
        // The Sample Scoring build — replaces _swExtremityBuild's closed-trade walk when enabled. Publishes the
        // same outputs: swDialCutoffs/swDialSampleCounts (own cutoffs, from the sample magnitudes), the
        // flat rank map MIC/MIW read, the two-bucket scoreboard, and the per-bucket overall means that
        // decide the favored side.
        _swSampleBuild() {
          const st = this._swSampleStore || { obs: [] };
          const kind = this._swSampleKind();
          const dir = this._swSampleDir();
          const minSamples = Math.max(3, this.cfg.swExtremityMinSamples || 3);
          const splitPct = Math.min(0.49, Math.max(0.01, (this.cfg.swExtremitySplitPct ?? 30) / 100));
          let obs = this._swObsLive().filter(o => o && o.k === kind && Array.isArray(o.c) && typeof o.y === 'number');
          if (kind === 'n') {
            // The hour candle is shared by every cycle inside a clock hour — keep only each ticker's latest
            // observation per hour so one move isn't counted once per scan.
            const latest = new Map();
            for (const o of obs) { const k = o.s + '|' + Math.floor(o.t / 3600000); const p = latest.get(k); if (!p || o.t > p.t) latest.set(k, o); }
            obs = [...latest.values()];
          }
          const parsed = [];
          const pool = {};
          for (const o of obs) {
            const items = [];
            for (const tag of o.c) {
              const info = dialInfo(collapseCrit(tag));
              if (!info || (kind === 'n' && info.family === 'lpa')) continue;
              const m = tag.match(/(-?\d+)$/);
              const mag = m ? Math.abs(parseInt(m[1], 10)) : 0;
              const dk = info.family + '|' + info.pole;
              (pool[dk] ||= []).push(mag);
              items.push({ dk, mag });
            }
            if (items.length) { parsed.push({ edge: dir * o.y, raw: (typeof o.r === 'number' && !isNaN(o.r)) ? dir * o.r : null, items }); }
          }
          // Liquidation Surveillance (toggle): each 'l' observation is scored on its liquidated turnover's lean, in pp (r = lean x the
          // window's typical move x its size against the event-size history, fixed when written), so it counts 1:1 with a price observation.
          const lparsed = [];
          if (this.cfg.swLiqEnabled) {
            const lobs = this._swObsLive().filter(o => o && o.k === 'l' && Array.isArray(o.c) && typeof o.r === 'number' && !isNaN(o.r));
            for (const o of lobs) {
              const wt = 1; // size now lives in the pp itself (against the event-size history), so no separate turnover weight
              const items = [];
              for (const tag of o.c) {
                const info = dialInfo(collapseCrit(tag));
                if (!info) continue;
                const m = tag.match(/(-?\d+)$/);
                const mag = m ? Math.abs(parseInt(m[1], 10)) : 0;
                const dk = info.family + '|' + info.pole;
                (pool[dk] ||= []).push(mag);
                items.push({ dk, mag });
              }
              if (items.length) lparsed.push({ edge: dir * o.r, wt, items });
            }
          }
          const cutoffs = {};
          for (const [dk, mags] of Object.entries(pool)) {
            if (mags.length < minSamples) { cutoffs[dk] = null; continue; }
            const sorted = [...mags].sort((a, b) => a - b);
            cutoffs[dk] = sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * (1 - splitPct)))];
          }
          const bucket = { extreme: {}, lukewarm: {} };
          const tot = { extreme: { sum: 0, n: 0 }, lukewarm: { sum: 0, n: 0 } };
          const totA = { extreme: { sum: 0, n: 0, p: 0, q: 0 }, lukewarm: { sum: 0, n: 0, p: 0, q: 0 } }; // absolute (raw move in the bot's favor) — only obs that carry a raw move
          for (const p of parsed) for (const { dk, mag } of p.items) {
            const b = (cutoffs[dk] != null && mag >= cutoffs[dk]) ? 'extreme' : 'lukewarm';
            const s = (bucket[b][dk] ||= { sum: 0, n: 0, wins: 0, losses: 0 });
            s.sum += p.edge; s.n++; if (p.edge > 0) s.wins++; else s.losses++;
            tot[b].sum += p.edge; tot[b].n++;
            if (p.raw != null) { totA[b].sum += p.raw; totA[b].n++; if (p.raw > 0) totA[b].p += p.raw; else totA[b].q -= p.raw; }
          }
          // Liquidation observations, bucketed by the same cutoffs. sum/w are turnover-weighted; p/q split the favorable and unfavorable pp.
          const bucketL = { extreme: {}, lukewarm: {} };
          const totL = { extreme: { sum: 0, w: 0, n: 0, p: 0, q: 0 }, lukewarm: { sum: 0, w: 0, n: 0, p: 0, q: 0 } };
          for (const p of lparsed) for (const { dk, mag } of p.items) {
            const b = (cutoffs[dk] != null && mag >= cutoffs[dk]) ? 'extreme' : 'lukewarm';
            const s = (bucketL[b][dk] ||= { sum: 0, w: 0, n: 0, wins: 0, losses: 0 });
            s.sum += p.wt * p.edge; s.w += p.wt; s.n++; if (p.edge > 0) s.wins++; else s.losses++;
            totL[b].sum += p.wt * p.edge; totL[b].w += p.wt; totL[b].n++;
            if (p.edge > 0) totL[b].p += p.wt * p.edge; else totL[b].q -= p.wt * p.edge;
          }
          // A pole is the 50/50 mean of its price edge and its liquidation edge when both have enough samples; whichever has
          // enough stands alone; with neither on its own, the pooled mean once the two together reach the minimum.
          const entryOf = b => dk => {
            const [family, pole] = dk.split('|');
            const ps = bucket[b][dk], ls = bucketL[b][dk];
            const pm = (ps && ps.n >= minSamples) ? ps.sum / ps.n : null;
            const lm = (ls && ls.n >= minSamples && ls.w > 0) ? ls.sum / ls.w : null;
            const n = (ps ? ps.n : 0) + (ls ? ls.n : 0);
            let pnl = 0;
            if (pm != null && lm != null) pnl = (pm + lm) / 2;
            else if (pm != null) pnl = pm;
            else if (lm != null) pnl = lm;
            else if (n >= minSamples) pnl = ((ps ? ps.sum : 0) + (ls && ls.w > 0 ? ls.sum / ls.w * ls.n : 0)) / n;
            return { family, pole, key: dialDisplayKey(family, pole), pnl, wins: (ps ? ps.wins : 0) + (ls ? ls.wins : 0), losses: (ps ? ps.losses : 0) + (ls ? ls.losses : 0), n, hasHist: true, hasTrade: false };
          };
          const keysOf = b => [...new Set([...Object.keys(bucket[b]), ...Object.keys(bucketL[b])])];
          let extreme = keysOf('extreme').map(entryOf('extreme')).sort((a, b) => b.pnl - a.pnl);
          let lukewarm = keysOf('lukewarm').map(entryOf('lukewarm')).sort((a, b) => b.pnl - a.pnl);
          
          const ranks = {}, dispStats = {};
          for (const e of extreme) {
            ranks[e.key] = e.pnl;
            dispStats[e.key] = { pnl: e.pnl, wins: e.wins, losses: e.losses, hasHist: true, hasTrade: false, cutoff: cutoffs[e.family + '|' + e.pole] ?? null, sampleCount: (pool[e.family + '|' + e.pole] || []).length };
          }
          this.swDialCutoffs = cutoffs;
          this.swDialSampleCounts = Object.fromEntries(Object.entries(pool).map(([k, v]) => [k, v.length]));
          this.micCollapsedSlotRanks = ranks;
          this.micCollapsedCritStats = dispStats;
          this.swScoreboard = Object.entries(dispStats).sort(([, a], [, b]) => b.pnl - a.pnl).map(([key, s]) => ({ key, ...s }));
          this.swLukewarmScoreboard = { extreme, lukewarm };
          const mean = t => (t.n ? t.sum / t.n : null);
          // Liquidation joins the price figures 50/50 (once it has the minimum samples in that bucket): the favored-side means, and the
          // headline's raw move (-> the one dollar value) and favorable share (-> the gauge, Target Halving, Negative Headline).
          const mixP = (a, b) => (a != null && b != null) ? (a + b) / 2 : (a ?? b);
          const lMean = t => (t.n >= minSamples && t.w > 0 ? t.sum / t.w : null);
          const mm = b => mixP(mean(tot[b]), lMean(totL[b]));
          // The weather headline (mean raw move AND favorable share) is blended in ONE space: per-observation pp mass, P = mean favorable pp,
          // Q = mean unfavorable pp, per source (price, liquidation). Sources are mixed on P and Q with the same weights as the
          // means, so mean = P - Q and share = (P - Q) / (P + Q) always come out of the same blend and can never differ in sign.
          const pqBase = t => (t.n > 0 ? { P: t.p / t.n, Q: t.q / t.n } : null);
          const pqLiq = t => (t.n >= minSamples && t.w > 0 ? { P: t.p / t.w, Q: t.q / t.w } : null);
          const pqMix = (a, b) => (a && b) ? { P: (a.P + b.P) / 2, Q: (a.Q + b.Q) / 2 } : (a || b);
          const pqOf = b => pqMix(pqBase(totA[b]), pqLiq(totL[b]));
          const aa = b => { const x = pqOf(b); return x ? x.P - x.Q : null; };
          const ss = b => { const x = pqOf(b); return (x && x.P + x.Q > 0) ? (x.P - x.Q) / (x.P + x.Q) : null; };
          this.swSampleBucketMeans = { extreme: mm('extreme'), lukewarm: mm('lukewarm'), nE: tot.extreme.n + totL.extreme.n, nL: tot.lukewarm.n + totL.lukewarm.n, aE: aa('extreme'), aL: aa('lukewarm'), aE0: aa('extreme'), aL0: aa('lukewarm'), nAE: totA.extreme.n + totL.extreme.n, nAL: totA.lukewarm.n + totL.lukewarm.n, sE: ss('extreme'), sL: ss('lukewarm'), sE0: ss('extreme'), sL0: ss('lukewarm'), nlE: totL.extreme.n, nlL: totL.lukewarm.n };
          this._swSampleTrackWx();
        },
        // Peak / bottom of the weather value (favored bucket's mean raw move in the bot's favor, stored in pp of price
        // move so it survives notional/leverage changes; shown in $ via _swSampleWeather's conversion). Recorded only
        // once the side has enough raw-carrying samples (max(min samples, 10)) so a 3-sample fluke can't pin an
        // extreme forever. Lives in the sample store: cleared with the samples, shared leader -> follower.
        _swSampleTrackWx() {
          const m = this.swSampleBucketMeans, st = this._swSampleStore;
          if (!m || !st) return;
          const lw = this._swLukewarmFavoredSide() === 'lukewarm';
          const a = lw ? (m.aL0 ?? m.aL) : (m.aE0 ?? m.aE), n = lw ? m.nAL : m.nAE;
          if (a == null || n < Math.max(10, this.cfg.swExtremityMinSamples || 3)) return;
          const w = st.wx || (st.wx = { hi: null, lo: null, hiT: 0, loT: 0, sHi: null, sLo: null });
          const now = Date.now();
          if (w.hi == null || a > w.hi) { w.hi = a; w.hiT = now; }
          if (w.lo == null || a < w.lo) { w.lo = a; w.loT = now; }
          const sv = lw ? (m.sL0 ?? m.sL) : (m.sE0 ?? m.sE);
          if (sv != null) { if (w.sHi == null || sv > w.sHi) w.sHi = sv; if (w.sLo == null || sv < w.sLo) w.sLo = sv; }
        },
        // Market weather (Sample Scorer headline): the favored bucket's mean ABSOLUTE edge — the raw 1hr move in this
        // bot's favor, not demeaned against the population — converted to dollars on one base position
        // (notional x move%), so it reads as "what an entry here would have made". Scale: +/- the entry TP target in
        // dollars (base margin x TP ROI%), i.e. a mean move large enough to hit TP is full scale. Observations stored
        // before raw moves were recorded carry no raw value and are left out until fresh ones accumulate.
        // `rel` is the old relative (demeaned) edge in pp, kept for the tooltip. `s` / `share` are the relative headline: the
        // favorable share of this side's raw move, P/(P+Q) (share, 0..1, 0.5 = even) and its signed form (P-Q)/(P+Q) (s, -1..+1, same
        // sign as `value`); sHi / sLo are the best / worst s recorded. Target Halving scales off s / sHi.
        _swSampleWeather(side) {
          const m = this.swSampleBucketMeans;
          if (!m) return null;
          const lw = side === 'lukewarm';
          const a = lw ? m.aL : m.aE, n = lw ? m.nAL : m.nAE;
          const tpRoi = Number(this.cfg.binaryModeEnabled ? (this.cfg.binaryTpPct ?? 18) : this.cfg.entryTpRoi) || 18;
          const notional = this.cfg.minNotional || 6;
          const cap = (notional / (this.cfg.leverage || 6)) * tpRoi / 100;
          const min = Math.max(3, this.cfg.swExtremityMinSamples || 3);
          const w = this._swSampleStore?.wx;
          const ok = a != null && n >= min, sv = lw ? m.sL : m.sE;
          return { s: (ok && sv != null) ? sv : null, share: (ok && sv != null) ? (1 + sv) / 2 : null, sHi: w?.sHi ?? null, sLo: w?.sLo ?? null, value: ok ? notional * a / 100 : null, nl: side === 'lukewarm' ? (m.nlL || 0) : (m.nlE || 0), cap, tpRoi, n, rel: m[side], hi: w?.hi != null ? notional * w.hi / 100 : null, lo: w?.lo != null ? notional * w.lo / 100 : null, hiT: w?.hiT || 0, loT: w?.loT || 0 };
        },

        // Which side Lukewarm Scoring currently favors — whichever bucket's total $ (summed
        // across every family in it) is ahead. This is the side the chart and headline show:
        // no more manual Lukewarm Targeting toggle, the system re-decides for itself every time
        // _swExtremityBuild runs, off the same scoreboard the panel shows. Ties (including
        // 0 vs 0, before either bucket has real data) default to 'extreme' — the original,
        // always-avoid-lukewarm behavior, until the data actually says otherwise.
        _swLukewarmFavoredSide() {
          // Compare the buckets' overall MEAN edge (per-observation), not their totals —
          // the extreme bucket is ~25% of readings by construction, so totals would always favor lukewarm.
          const m = this.swSampleBucketMeans, min = Math.max(3, this.cfg.swExtremityMinSamples || 3);
          if (m && m.extreme != null && m.lukewarm != null && m.nE >= min && m.nL >= min) return m.lukewarm > m.extreme ? 'lukewarm' : 'extreme';
          return 'extreme';
        },
        // cfg.micEnabled is a persisted toggle value — it survives MIC being removed via the
        // Plugin Manager, so it alone can't tell us whether MIC is actually loaded right now.
        // Cross-check against the live plugin list so the MIC scorecard section disappears the
        // moment MIC is unloaded, not just when its own toggle happens to be off.
        _micPluginLoaded() {
          return (this._pluginList || []).some(p => p.id === 'multiindicator');
        },
        _becPluginLoaded() {
          return (this._pluginList || []).some(p => p.id === 'blindentry-chaser');
        },
        _ldcPluginLoaded() {
          return (this._pluginList || []).some(p => p.id === 'liquiddiver-chaser');
        },
        // Liquid-Diver's OC fetch is single-symbol, triggered per reactive entry — its samples are
        // almost always one bar of 0.0s and drown out a real batch-fetched sample. Only show the
        // chart when a plugin doing proper batch OC sampling (MIC or Blind-Entry) is loaded; if
        // Liquid-Diver is the only OC consumer, hide it rather than let its noise dominate.
        _ocChartViable() {
          return this._micPluginLoaded() || this._becPluginLoaded();
        },
        // Lukewarm Scoring pill UI — two big buckets, Extreme and Lukewarm, each
        // headlined by its aggregate $ record (which side has actually been more
        // profitable overall), with smaller per-criterion pills nested inside showing which
        // of fund/V-A/IO-A/OCS/OCX drove that bucket's result.
        _swExtremityHtml(shown) {
          if (!shown) return '';
          const board = this.swLukewarmScoreboard || { extreme: [], lukewarm: [] };
          if (!board.extreme.length && !board.lukewarm.length) return `<span style="font-size:9px;color:var(--text-lo)">No scored samples yet.</span>`;
          // one chart at a time: only the side the bot currently favors is drawn.
          // One row of criterion duos (left bar = '+' end, right bar = '-' end); profit rises
          // above the zero line, loss hangs below it. Sized off the container, never wraps.
          const side = this._swLukewarmFavoredSide();
          const entries = board[side] || [];
          const accent = side === 'lukewarm' ? 'rgba(150,150,160,.45)' : 'rgba(var(--sw-rgb),.45)';
          const FAMS = ['fund', 'va', 'iol', 'ios', 'lta', 'lpa'].filter(f => !(!this.cfg.swLiqEnabled && f === 'lpa')); // Sample Scoring never scores LPA (it is the outcome), so its dial stays hidden
          const byKey = {};
          for (const s of entries) byKey[s.key] = s;
          const sm = true;
          const fmt = sm ? (v => (v >= 0 ? '+' : '-') + Math.abs(v).toFixed(2) + 'pp') : (v => (v >= 0 ? '+$' : '-$') + Math.abs(v).toFixed(2));
          const GREEN = 'rgba(100,220,150,.9)';
          const total = (sm && this.swSampleBucketMeans && this.swSampleBucketMeans[side] != null) ? this.swSampleBucketMeans[side] : entries.reduce((a, s) => a + s.pnl, 0);
          const totalColor = total > 0 ? GREEN : total < 0 ? 'var(--short)' : 'var(--text-lo)';
          const wx = sm ? this._swSampleWeather(side) : null;
          const fmtUsd = v => (v >= 0 ? '+$' : '-$') + Math.abs(v).toFixed(3);
          const headVal = wx ? wx.value : (entries.length ? total : null);
          const headColor = headVal == null ? 'var(--text-lo)' : headVal > 0 ? GREEN : headVal < 0 ? 'var(--short)' : 'var(--text-lo)';
          const headTxt = headVal == null ? '—' : (wx ? (wx.share != null ? (wx.share * 100).toFixed(1) + '%' : '—') : fmt(headVal));
          const headTip = wx ? `Share of this side's raw 1hr move (and, with Liquidation Surveillance, its liquidation lean in pp, mixed 50/50) that went in the bot's favor (50% = even; gauge scaled to the best share recorded)${wx.value != null ? ' · mean ' + fmtUsd(wx.value) + ' on one base position' : ''}. n=${wx.n}${wx.rel != null ? ' · relative edge ' + fmt(wx.rel) : ''}${wx.value == null ? ' · waiting for samples with a raw move' : ''}` : '';
          let gauge = '';
          if (wx) {
            const sc = Math.max(wx.sHi || 0, -(wx.sLo || 0)) || 1, P = v => (((1 + v) / 2) * 100).toFixed(0) + '%';
            const pc = wx.s == null ? 0 : Math.max(-1, Math.min(1, wx.s / sc));
            const gl = pc >= 0 ? 50 : 50 + pc * 50, gw = Math.abs(pc) * 50;
            gauge = `<div title="${headTip}" style="margin-bottom:5px"><div style="position:relative;height:5px;background:rgba(255,255,255,.07);border-radius:3px"><div style="position:absolute;top:0;bottom:0;left:${gl}%;width:${gw}%;background:${headColor};border-radius:3px"></div><div style="position:absolute;top:-1px;bottom:-1px;left:50%;width:1px;background:rgba(255,255,255,.3)"></div></div><div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;color:var(--text-lo);margin-top:2px"><span>${P(-sc)}</span><span>50%</span><span>${P(sc)}</span></div><div title="Highest / lowest favorable share recorded (needs 10+ raw samples on the side). Cleared with the samples." style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;margin-top:3px"><span style="color:var(--short)">bottom ${wx.sLo != null ? P(wx.sLo) : '—'}</span><span style="color:${GREEN}">peak ${wx.sHi != null ? P(wx.sHi) : '—'}</span></div></div>`;
          }
          let maxAbs = 0.01;
          for (const f of FAMS) for (const p of ['+', '-']) maxAbs = Math.max(maxAbs, Math.abs((byKey[f + p] || { pnl: 0 }).pnl));
          const bar = key => {
            const s = byKey[key];
            const v = s ? s.pnl : 0;

        async _ocFetchBatch(symbols, volIoMap, wantOc, wantHr) {

            const res = await this._qFetch(`${this.base}/v5/market/account-ratio?category=linear&symbol=${sym}&period=5min&limit=1`);
            const row = (await res.json())?.result?.list?.[0];
            const b = parseFloat(row?.buyRatio), s = parseFloat(row?.sellRatio);
            return (b > 0 && s > 0 && isFinite(b + s)) ? b / (b + s) : null;
          } catch (_) { return null; }
        },
        // Net long minus short share of accounts, -100..+100 (positive = long-heavy); null without the batch's long share (bl).
        _swLsSkew(r) { const b = Number(r && r.bl); return (b > 0 && b < 1) ? +((2 * b - 1) * 100).toFixed(2) : null; },
        // The long (or short) share of a record's open interest: oi x long share (x short share), null without both.
        _swLsOi(r, long) { const oi = Number(r.oi), b = Number(r.bl); return (oi > 0 && b > 0 && b < 1) ? oi * (long ? b : 1 - b) : null; },
        // One forecast's wide snapshot for the export (rounded, short keys). Logging only -- nothing here is scored. r = the sample record,
        // t = Bybit's own ticker payload for the batch, cd = its 5-minute candles ({ c: [...] }), now = the batch time.
        _swFcSnap(r, t, cd, now) {
          const q = (v, d = 4) => (typeof v === 'number' && isFinite(v)) ? +v.toFixed(d) : undefined, o = {};
          const N = k => { const v = parseFloat(t?.[k]); return isFinite(v) && v !== 0 ? v : null; };
          o.vol = q(r.vol, 0); o.oi = q(r.oi, 0); o.fr = q(r.fr, 5); o.bl = q(r.bl, 4); o.ch = q(r.ch != null ? r.ch * 100 : null, 3);
          o.hc = q(r.hc, 3); o.ht = q(r.ht, 0); o.lta = q(this._swLtaDev(r.ht, r.vol), 1);
          const mk = N('markPrice'), ix = N('indexPrice'), bid = N('bid1Price'), ask = N('ask1Price'), hi24 = N('highPrice24h'), lo24 = N('lowPrice24h'), p1h = N('prevPrice1h'), px = Number(r.px);
          if (mk && ix) o.prem = q((mk - ix) / ix * 100, 4);
          if (bid && ask && ask >= bid) o.spr = q((ask - bid) / ((ask + bid) / 2) * 100, 4);
          if (hi24 && lo24 && hi24 > lo24 && px > 0) o.pos24 = q((px - lo24) / (hi24 - lo24), 3);
          if (p1h && px > 0) o.p1h = q((px / p1h - 1) * 100, 3);
          const nf = parseInt(t?.nextFundingTime, 10); if (nf > 0) o.nf = q((nf - now) / 60000, 0);
          const cs = cd && cd.c;
          if (cs && cs.length) {
            const nowS = Math.floor(now / 300000) * 300000, cur = cs[cs.length - 1];
            for (const m of [10, 30, 60, 120]) o['r' + m] = q(this._swC5Ret(cs, now, m), 3);
            const h12 = cs.filter(x => x.s >= nowS - 3600000);
            o.c60 = h12.length;
            if (h12.length) o.rng60 = q((Math.max(...h12.map(x => x.h)) - Math.min(...h12.map(x => x.l))) / cur.c * 100, 3);
            if (h12.length > 2) {
              const rs = []; for (let i = 1; i < h12.length; i++) rs.push(Math.log(h12[i].c / h12[i - 1].c));
              const mu = rs.reduce((a, b) => a + b, 0) / rs.length;
              o.rv = q(Math.sqrt(rs.reduce((a, b) => a + (b - mu) * (b - mu), 0) / rs.length) * 100, 4);
            }
            const v10 = cs.filter(x => x.s >= nowS - 300000).reduce((a, x) => a + x.v, 0), vp = cs.filter(x => x.s < nowS - 300000 && x.s >= nowS - 3900000).reduce((a, x) => a + x.v, 0) / 6;
            if (vp > 0) o.vr = q(v10 / vp, 2);
          }
          for (const k of Object.keys(o)) if (o[k] === undefined) delete o[k];
          return o;
        },
        // The market around one batch, logged once per batch: breadth of the 1hr change, funding, long share, and the 10/60-minute moves (BTC apart).
        _swFcCtx(entry) {
          const q = (v, d = 3) => (typeof v === 'number' && isFinite(v)) ? +v.toFixed(d) : undefined;
          const mean = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : null;
          const hc = [], fr = [], bl = [], r10 = [], r60 = [];
          for (const r of entry.results) {
            if (typeof r.hc === 'number') hc.push(r.hc);
            if (typeof r.fr === 'number') fr.push(r.fr);
            if (r.bl > 0) bl.push(r.bl);
            const cs = CAND5[r.sym]?.c, a = this._swC5Ret(cs, entry.ts, 10), b = this._swC5Ret(cs, entry.ts, 60);
            if (a != null) r10.push(a); if (b != null) r60.push(b);
          }
          const bc = CAND5['BTCUSDT']?.c, o = { n: entry.results.length, hc: q(mean(hc)), fr: q(mean(fr), 5), bl: q(mean(bl), 4), r10: q(mean(r10)), r60: q(mean(r60)) };
          if (hc.length >= 10) { const s = hc.slice().sort((x, y) => x - y), at = pr => { const x = pr * (s.length - 1), i = Math.floor(x); return s[i] + (s[Math.min(s.length - 1, i + 1)] - s[i]) * (x - i); }, p10 = at(0.1), p50 = at(0.5), p90 = at(0.9); o.hsp = q(p90 - p10); o.hsk = q((p90 + p10) / 2 - p50); o.hmx = q(s[s.length - 1]); o.hmn = q(s[0]); } // the market's own range this hour: spread, skew, extremes
          if (bc) { o.btc10 = q(this._swC5Ret(bc, entry.ts, 10)); o.btc60 = q(this._swC5Ret(bc, entry.ts, 60)); }
          for (const k of Object.keys(o)) if (o[k] === undefined) delete o[k];
          return o;
        },

        // Best available 1hr reading for a ticker: this hour's cached candle, else whatever the
        // latest sample batch carried (what a follower gets from the leader's shared snapshot).
        _swHourReading(sym) {
          const hit = HOUR_CACHE[sym];
          if (hit && hit.start === this._swHourStart()) return { ht: hit.ht, hc: hit.hc };
          const r = this.swOcResults?.[sym];
          if (r && typeof r.ht === 'number' && typeof r.hc === 'number') return { ht: r.ht, hc: r.hc };
          return null;
        },
        // Widened counterpart to _swHourReading, for scan-time LTA/LPA matching only — never
        // for the top-up fetch gate (_micTopUpGeneralCriteria), which must stay strict-fresh
        // so the pre-entry refetch still fires. Falls back to this symbol's latest reading
        // anywhere in the retained _swOcCycleHistory window when nothing fresh (this hour's
        // cache or the latest batch) exists yet, so a not-yet-resampled-this-hour ticker can
        // still be scored on stale-but-real data instead of being treated as having none.
        _swHourReadingWide(sym) {
          const fresh = this._swHourReading(sym);
          if (fresh) return fresh;
          let latest = null, latestTs = -Infinity;
          for (const cycle of (this._swOcCycleHistory || [])) {
            if (!cycle || !Array.isArray(cycle.results)) continue;
            const r = cycle.results.find(x => x && x.sym === sym && typeof x.ht === 'number' && typeof x.hc === 'number');
            if (r && cycle.ts > latestTs) { latest = { ht: r.ht, hc: r.hc }; latestTs = cycle.ts; }
          }
          return latest;
        },





        _swOcAvgValueText(shown) {
          if (!shown) return null;
          const mode = this._swOcViewMode || 'vol';
          if (mode === 'fc') return this._swFcBatchText();
          const mc = this._swOcModeCfg();
          const last = this._swOcDisplayedCycle();
          const withField = (last?.results || []).filter(r => r && mc.getVal(r) != null && (mode !== 'liq' || this._swLiqHas(r)));
          if (!withField.length) return null;
          const avg = withField.reduce((s,r) => s + mc.getVal(r), 0) / withField.length;
          return `Batch ${mc.avgLabel.toLowerCase()}: ${mc.fmt(avg)}`;
        },



        _swOcTotalAvgText(shown) {
          if (!shown) return null;
          const mode = this._swOcViewMode || 'vol';
          if (mode === 'fc') return this._swFcWindowText();
          const mc = this._swOcModeCfg();
          const st = this._swWindowStats(mode === 'io' ? 'oi' : mode === 'fund' ? 'fr' : mode);
          if (mode === 'liq') return st.n ? `Window avg liquidation lean: ${mc.fmt(st.sum / st.n)} · ${st.n} ticker${st.n === 1 ? '' : 's'} with liquidations (window)` : 'Window avg liquidation lean: no liquidation events in the window';
          if (!st.n) return null;
          return `Total ${mc.avgLabel.toLowerCase()}: ${mc.fmt(st.sum / st.n)} · ${st.n} ticker${st.n === 1 ? '' : 's'} (window)`;
        },
        _swOcInfoHtml(shown) {
          if (!shown) return '';
          const mode = this._swOcViewMode || 'vol';
          if (mode === 'fc') return '';
          const last = this._swOcDisplayedCycle();
          const results = (last?.results || []).filter(r => r && typeof r.sym === 'string');
          if (!results.length) return '';
          {
            const mc = this._swOcModeCfg();
            const withField = results.filter(r => mc.getVal(r) != null);
            if (!withField.length) return '';
            const mean = withField.reduce((s,r)=>s+mc.getVal(r),0)/withField.length;
            if (mode === 'liq') {
              const liqd = withField.filter(r => this._swLiqHas(r));
              if (!liqd.length) return '<span style="font-family:var(--mono);font-size:8px;color:var(--text-lo)">no liquidation events in this batch</span>';
              const unstable = this._swInstabOn() ? this._swInstabStats() : null;
              const LBL = { fav: 'favorable', mixfav: 'mixed fav', mixunf: 'mixed unfav', unf: 'unfavorable', quiet: 'quiet' };
              return liqd.map(r => {
                const v = mc.getVal(r), k = this._swLiqPillClass(r), c = mc.color;
                // favorable: fill + outline · mixed favorable: fill only · mixed unfavorable: outline only · unfavorable: neither
                const fill = (k.cls === 'fav' || k.cls === 'mixfav') ? `rgba(${c},.22)` : 'transparent';
                const bdr = (k.cls === 'fav' || k.cls === 'mixunf') ? `1px solid rgba(${c},.7)` : '1px solid transparent';
                const clr = k.cls === 'quiet' ? 'rgba(255,255,255,.28)' : (k.cls === 'unf' ? 'var(--text-lo)' : `rgba(${c},.95)`);
                const iv = unstable && unstable.inst[r.sym], bad = unstable && unstable.gray.has(r.sym);
                const mix = k.u == null || k.cls === 'quiet' ? '' : ` · S${Math.round(k.u * 100)}/L${Math.round(k.d * 100)}`;
                const ins = iv != null ? ` · inst ${Math.round(iv * 100)}%${bad ? ' · skipped' : ''}` : '';
                return `<span title="${r.sym}: ${mc.fmt(v)} · ${LBL[k.cls]}${mix}${ins}" style="font-family:var(--mono);font-size:8px;padding:1px 5px;border-radius:2px;border:${bdr};background:${fill};color:${clr};white-space:nowrap">${r.sym.replace('USDT','')} <span style="opacity:.65">${mc.fmt(v)}</span>${bad ? '<sup style="opacity:.8">!</sup>' : ''}</span>`;
              }).join('');
            }
            // LPA / LTA: coloured = favorable, gray = unfavorable, judged by the ticker's own 1hr move against this bot's side (the same
            // outcome the scorecard grades it on; exactly flat counts as unfavorable). Other views: coloured = at or above the batch average.
            const favView = mode === 'lpa' || mode === 'lta', dir = this._swSampleDir();
            return withField.map(r=>{
              const v = mc.getVal(r);
              const hc = (typeof r.hc === 'number' && !isNaN(r.hc)) ? r.hc : null;
              const aboveAvg = favView ? (hc != null && dir * hc > 0) : v >= mean;
              const tip = favView ? `${r.sym}: ${mc.fmt(v)}${mode === 'lta' && hc != null ? ' · 1h move ' + (hc >= 0 ? '+' : '') + hc.toFixed(2) + '%' : ''} · ${aboveAvg ? 'favorable' : 'unfavorable'}` : `${r.sym}: ${mc.fmt(v)}`;
              const lsC = mode === 'ls' ? (v >= 0 ? '110,210,150' : '235,105,105') : null; // L/S: green = long-heavy, red = short-heavy
              const clr=lsC?`rgba(${lsC},.9)`:aboveAvg?`rgba(${mc.color},.9)`:'var(--text-lo)';
              const bdr=lsC?`rgba(${lsC},.4)`:aboveAvg?`rgba(${mc.color},.4)`:'rgba(255,255,255,.1)';
              const bg=lsC?`rgba(${lsC},.06)`:aboveAvg?`rgba(${mc.color},.06)`:'transparent';
              return `<span title="${tip}" style="font-family:var(--mono);font-size:8px;padding:1px 5px;border-radius:2px;border:1px solid ${bdr};background:${bg};color:${clr};white-space:nowrap">${r.sym.replace('USDT','')} <span style="opacity:.65">${mc.fmt(v)}</span></span>`;
            }).join('');
          }
        },

      }, _hostStages
        ? { _scanStageDefs: [...def._scanStageDefs, { id: 'sw-post', run: function () { return this._swScanPost(); } }] }
        : { async runScan() { await _origScan.call(this); await this._swScanPost(); } });
    },
