    const s = _DU.summary();
    const p = view === 'week' ? s.week : view === 'month' ? s.month : s.today;
    const f = b => this._storageFmtBytes(Math.round(b));
    const total = (p.r + p.w + p.u) || 1;
    const sect = (title, arr) => {
      let o = `<div style="margin-top:4px;padding-top:3px;border-top:1px solid rgba(255,255,255,.08);color:var(--text-lo)">${title}</div>`;
      if (!arr.length) return o + `<div style="color:var(--text-lo);font-size:8.5px">no data yet for this period</div>`;
      for (const e of arr.slice(0, 10)) {
        o += `<div style="display:flex;justify-content:space-between;gap:8px"><span style="color:var(--text-lo);word-break:break-all">${e.label}</span><span style="color:var(--ice);white-space:nowrap">${f(e.b)} <span style="color:var(--text-lo)">${Math.round(e.b / total * 100)}%</span></span></div>`;
      }
      return o;
    };
    return sect('Top sources — calling function', p.srcList) + sect('Top endpoints', p.epList)
      + `<div style="color:var(--text-lo);font-size:8.5px;margin-top:3px;line-height:1.5">Payload bytes only (response bodies, request URLs/bodies, WS frames) across the bot and its plugins — no headers/TLS/CDN script loads, so treat as approximate. Source/endpoint breakdown is tracked from when it was added. Days roll over at local midnight${s.since ? '; tracking since ' + s.since : ''}.</div>`;
  },
  // Clears all Data usage counts (stored + pending) after a confirmation — for restarting the tally on equal footing.
  _resetDataUsage() {
    if (!confirm('Reset all Data usage counts (daily/weekly/monthly totals, sources and endpoints)? This can\'t be undone.')) return;
    _DU.reset();
  },
  // Dumps the full Data usage picture to a text file — totals, per-period source/endpoint
  // rankings, daily history, this session's source→endpoint pairs, plus the config values that drive polling.
  _exportDataUsage() {
    const s = _DU.summary(), c = this.cfg || {};
    const f = b => this._storageFmtBytes(Math.round(b)).padStart(10);
    const tot = b => `↓ ${f(b.r + b.w)}  ↑ ${f(b.u)}  (REST ${f(b.r).trim()} · WS ${f(b.w).trim()} · ${b.n} req)`;
    const lst = (arr, p) => arr.length ? arr.map(e => `${f(e.b)}  ${String(Math.round(e.b / ((p.r + p.w + p.u) || 1) * 100)).padStart(3)}%  ${e.label}`) : ['(none)'];
    const per = (name, p) => ['-- ' + name + ' --', tot(p), 'Sources:', ...lst(p.srcList, p), 'Endpoints:', ...lst(p.epList, p), ''];
    const ses = s.pairs.length ? s.pairs.map(e => `${f(e.r + e.u)}  ${String(e.n).padStart(6)} req  ${((e.r + e.u) / s.upMin / 1024).toFixed(1).padStart(8)} KB/min  ${(e.n / s.upMin).toFixed(1).padStart(6)} req/min  ${e.label}`) : ['(none)'];
    const keys = ['restPollEnabled', 'restPollBaseSec', 'mktWatchEnabled', 'mktWatchSize', 'scanMins', 'bulkTickerCooldownHours', 'schedIntervalMs', 'schedMaxConcurrent', 'lfFollowPartner', 'pfOcBatchSize', 'pfSampleScoringEnabled', 'pfLiqEnabled', 'afOcBatchSize', 'afSampleScoringEnabled', 'afLiqEnabled'];
    const lines = [
      `EverWinter data usage — ${B.name} — ${new Date().toISOString()}`,
      `Open positions: ${(this.positions || []).length}`,
      `Config: ` + keys.map(k => `${k}=${c[k]}`).join(', '),
      '',
      '== BY PERIOD (persisted) ==',
      ...per('Today', s.today), ...per('Last 7 days', s.week), ...per('This month', s.month), ...per('Last month', s.lastMonth),
      `== THIS SESSION: SOURCE → ENDPOINT (${s.upMin.toFixed(1)} min, not persisted) ==`, ...ses,
      '',
      '== DAILY HISTORY ==', ...(s.days.length ? s.days.map(d => `${d.day}  ${tot(d)}`) : ['(none)']),
      ...(s.months.length ? ['', '== MONTHLY (rolled up) ==', ...s.months.map(d => `${d.month}  ${tot(d)}`)] : []),
    ];
    const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${B.file}-datausage-${new Date().toISOString().replace(/[:.]/g, '-')}.txt`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  },
};

window.__BotPlugin = {
  id: 'meters',
  name: 'Meters',
  version: '1.0.0',
  targetBot: 'both',
  touches: ['_qFetch', '_qDrain'],
  css: '',
  slots: {
    'stats-meters': `
<div style="margin-top:6px">
          <span @click="showStorageBreakdown=!showStorageBreakdown" style="font-family:var(--mono);font-size:9px;color:var(--text-lo);cursor:pointer;user-select:none">
            <span x-text="showStorageBreakdown?'▾':'▸'"></span> Storage usage
          </span>
          <span x-show="showStorageBreakdown" @click="_exportStorageBreakdown()" title="Download this breakdown as a text file" style="margin-left:8px;font-family:var(--mono);font-size:9px;color:var(--text-lo);cursor:pointer;text-decoration:underline;user-select:none">⤓ Export</span>
          <div x-show="showStorageBreakdown" style="margin-top:4px;padding:4px 7px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.08);border-radius:3px;font-family:var(--mono);font-size:9px;line-height:1.6">
            <template x-for="row in _storageRowsList(showStorageBreakdown)" :key="row.label">
              <div :style="row.isTotal ? 'display:flex;justify-content:space-between;gap:8px;margin-top:3px;padding-top:3px;border-top:1px solid rgba(255,255,255,.08)' : 'display:flex;justify-content:space-between;gap:8px'">
                <span :style="row.isTotal ? '' : ('color:' + (row.over ? 'var(--short)' : 'var(--text-lo)'))" x-text="row.label"></span>
                <span style="display:flex;align-items:center;gap:6px">
                  <span :style="'color:' + (row.isTotal ? 'var(--ice)' : (row.over ? 'var(--short)' : 'var(--ice)'))" x-text="row.fmt"></span>
                  <span x-show="row.clearable" @click="_storageClearRow(row.label)" title="Clear this bucket" style="cursor:pointer;color:var(--text-lo);user-select:none">✕</span>
                </span>
              </div>
            </template>
          </div>
        </div>
        <div style="margin-top:6px">
          <span @click="showPowerUsage=!showPowerUsage" style="font-family:var(--mono);font-size:9px;color:var(--text-lo);cursor:pointer;user-select:none">
            <span x-text="showPowerUsage?'▾':'▸'"></span> Power usage
          </span>
          <div x-show="showPowerUsage" x-html="_powerUsageHtml(showPowerUsage)" style="margin-top:4px;padding:4px 7px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.08);border-radius:3px;font-family:var(--mono);font-size:9px;line-height:1.6"></div>
        </div>
        <div style="margin-top:6px">
          <span @click="showDataUsage=!showDataUsage" style="font-family:var(--mono);font-size:9px;color:var(--text-lo);cursor:pointer;user-select:none">
            <span x-text="showDataUsage?'▾':'▸'"></span> Data usage
          </span>
          <span x-show="showDataUsage" @click="_exportDataUsage()" title="Download the full breakdown as a text file" style="margin-left:8px;font-family:var(--mono);font-size:9px;color:var(--text-lo);cursor:pointer;text-decoration:underline;user-select:none">⤓ Export</span>
          <span x-show="showDataUsage" @click="_resetDataUsage()" title="Clear all Data usage counts and start over" style="margin-left:8px;font-family:var(--mono);font-size:9px;color:var(--text-lo);cursor:pointer;text-decoration:underline;user-select:none">✕ Reset</span>
          <div x-show="showDataUsage" style="margin-top:4px;padding:4px 7px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.08);border-radius:3px;font-family:var(--mono);font-size:9px;line-height:1.6">
            <div x-html="_dataUsageHtml(showDataUsage)"></div>
            <div style="display:flex;gap:10px;margin:4px 0 2px;padding-top:3px;border-top:1px solid rgba(255,255,255,.08)">
              <template x-for="v in [['today','Today'],['week','7 days'],['month','Month']]" :key="v[0]">
                <span @click="duView=v[0]" x-text="v[1]" :style="duView===v[0]?'cursor:pointer;color:var(--ice);border-bottom:1px solid var(--ice);user-select:none':'cursor:pointer;color:var(--text-lo);user-select:none'"></span>
              </template>
            </div>
            <div x-html="_dataUsageBreakdownHtml(showDataUsage, duView)"></div>
          </div>
        </div>
`,
  },
  transform(def) {
    Object.assign(def, { showStorageBreakdown: false, showPowerUsage: false, showDataUsage: false, duView: 'today' }, methods);
    // Queued scan fetches run from a timer, which hides the real caller from the Data usage source breakdown —
    // capture the caller at enqueue time and hand it back to the meter when the queue dispatches the request.
    const q0 = def._qFetch, d0 = def._qDrain;
    if (typeof q0 === 'function') def._qFetch = function _qFetch(url, options) {
      const who = _DU.caller();
      const p = q0.call(this, url, options);
      const job = this._fetchQueue[this._fetchQueue.length - 1];
      if (job) job.caller = who;
      return p;
    };
    if (typeof d0 === 'function') def._qDrain = function _qDrain() {
      const job = this._fetchQueue[0];
      _DU.ctx = job ? job.caller : null;
      try { return d0.apply(this, arguments); } finally { _DU.ctx = null; }
    };
    return def;
  },
};
</script>
</body>
