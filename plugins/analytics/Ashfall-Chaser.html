<!--
  Ashfall Strategy Plugin for PseudoChaser
  Scoring and cross-bot coordination layer for MultiIndicator-Chaser.

  Extremity Scorer / Lukewarm Scoring: every criterion reading MIC annotates is
  sampled into a rolling pool and sorted, per pole, into extreme vs lukewarm
  against that pole's own observed spread. Closed trades score both a per-pole
  dial (what MIC's blocking and co-qual ranking read) and a two-bucket Extreme vs
  Lukewarm tally; whichever bucket is in higher net profit becomes the side the
  entry veto targets, re-decided on every rebuild rather than toggled by hand.

  Cross bus: cascade/sacrifice triggers, drawdown-halt and gains-lock transitions
  and Gains Continuation steps are broadcast to Permafrost and read back, so the
  two sides can lift each other's halts (Mutual DDH Lift) or halt pre-emptively
  on the partner's winning streak (GC).

  Order Count Surveillance supplies the OC/volume/OI population samples that
  MIC's ocs, ocx, va, iol, ios, lta and lpa criteria are all measured against (lta/lpa read the
  1hr candle fetched per sampled ticker, see _afHourCandle).

  The scorer is direction-agnostic: it only learns what realized PnL says
  about this installation — the same logic powers Permafrost on PseudoWinter.

  Load via Plugin Manager in PseudoChaser's config panel.
  Load AFTER SunChaser if using live trading — see README Plugin Stack Order.
  targetBot: pseudochaser
-->

  const ASH_KEY        = '__ashfall_chaser_v1';

  const CROSS_TTL      = 30 * 24 * 3600 * 1000; // Sized generously (30d) since halt hours are user-set and can run well past 24h — a bot's own
    // ddh-start/glk-start marker aging off the shared bus mid-halt would silently kill Mutual DDH/Gains Lock lift.
    // Own-side DDH lift math doesn't depend on this (see _afDdhStartedAt), but partner-side reads
    // (Gains Lock lift) do, so it must outlast whatever halt length is configured.
  // CROSS_TTL alone doesn't bound this bucket's size — it's a 30d floor sized for the rare
  // long-halt marker, but most event kinds (gc) only need minutes to hours and end
  // up carrying that same 30d tail for no reason. Byte-cap as the actual backstop, same
  // pattern and cap as _trimSharedRegistry in PseudoChaser/PseudoWinter — oldest event first,
  // regardless of kind, so a halt marker can still get evicted early under sustained pressure
  // (TTL is not a floor against eviction, only against premature natural expiry).
  const CROSS_BYTE_CAP = 200 * 1024;
  function _trimCrossEvents(events, maxBytes = CROSS_BYTE_CAP) {
    let json = JSON.stringify({ events });
    let size = new Blob([json]).size;
    if (size <= maxBytes) return events;
    const sorted = events.slice().sort((a, b) => (a.ts || 0) - (b.ts || 0));
    let idx = 0, guard = 0;
    while (size > maxBytes && idx < sorted.length && guard < 25) {
      const avg = size / Math.max(1, sorted.length - idx);
      const excess = size - maxBytes;
      const drop = Math.min(sorted.length - idx, Math.max(1, Math.ceil(excess / avg)));
      idx += drop;
      json = JSON.stringify({ events: sorted.slice(idx) });
      size = new Blob([json]).size;
      guard++;
    }
    return sorted.slice(idx);
  }

  const afCritEmoji = c => {

    if (c === '+fund') return '💸'; if (c === '-fund') return '🤑';
    if (c === '+ocs') return '🔭+'; if (c === '-ocs') return '🔭-';
    if (c === '0liq') return '⚫';
    if (c === 'liveliq+') return '💥';
    if (c === 'past1') return '⏳';

  // Collapses a single recorded (tiered) criterion down to its base+sign bucket, e.g.
  // "fund+3" -> "fund+", "ocx+18" -> "ocx+". Used both for scorecard display aggregation

  // base-criterion combination, not per exact tier value (which is combinatorially large
  // and would barely ever repeat, defeating the quota). Bare '+fund'/'-fund' (Blind-Entry/
  // Liquid-Diver's own tag, never produced by MIC which is always tiered) stay bare so
  // afCritEmoji reads them through its bare-tag branch, not the tiered-fund regex.
  const collapseCrit = c => c.replace(/\d+$/, '');
  const collapseKey = criteria => [...criteria].map(collapseCrit).sort().join(',');

  // exceeds budget. Deliberately atomized rather than one blanket cap on the whole plugin
  // blob, so an oversized data type can't force pruning of unrelated data that's still
  // well within budget.
  const TYPE_BYTE_CAP = 200 * 1024;
  function trimToByteCap(arr, maxBytes = TYPE_BYTE_CAP) {
    // Assumes arr is ordered oldest-first (push-appended). Converges in a handful of
    // iterations by estimating how many records to drop from the size overshoot, rather
    // than shifting one at a time and re-stringifying the whole array each try.
    if (!Array.isArray(arr) || arr.length < 2) return arr;
    let out = arr;
    let size = new Blob([JSON.stringify(out)]).size;
    let guard = 0;
    while (size > maxBytes && out.length > 1 && guard < 25) {
      const avg = size / out.length;
      const excess = size - maxBytes;
      const drop = Math.min(out.length - 1, Math.max(1, Math.ceil(excess / avg)));
      out = out.slice(drop);
      size = new Blob([JSON.stringify(out)]).size;
      guard++;
    }
    return out;
  }

                  <div x-show="afFcOpen && _afOcViewMode==='fc'" x-html="_afFcBreakdownHtml(open && afFcOpen)"></div>
                  <button type="button" x-show="_afOcViewMode!=='fc'" @click.prevent="afOcPillsOpen=!afOcPillsOpen" style="font-family:var(--mono);font-size:7.5px;padding:1px 5px;border-radius:2px;border:1px solid rgba(255,255,255,.12);background:none;color:var(--text-lo);cursor:pointer;letter-spacing:.5px;margin-top:3px"><span x-text="afOcPillsOpen?'▾':'▸'"></span> Tickers <span x-text="'('+(((_afOcDisplayedCycle()?.results)||[]).filter(r=>_afOcViewMode!=='liq'||_afLiqHas(r))).length+')'"></span></button>

    transform(def) {
      const _origInit  = def.init;
      const _origPers  = def.persist;
      const _origScan  = def.runScan;
      const _origClose = def.pseudoClosePosition;

      let _afWasHalted               = false;
      let _afWasGainsLocked          = false;

      const _hostStages = Array.isArray(def._scanStageDefs); // host has the cooperative scan scheduler
      return Object.assign({}, def, {

        _afDdhStartedAt: null, // Date.now() of this bot's own current DDH halt, set once at the
                               // moment it starts and cleared on lift. Local + persisted, so Mutual
                               // DDH Lift's age comparison never depends on reading our own ddh-start
                               // note back off the shared cross bus, which can age out of CROSS_TTL
                               // mid-halt on any halt longer than the TTL window.
        afScoreboard: [],   // sorted Extremity Scorer entries built from EXTREMITY_KEY records
        afLukewarmScoreboard: { extreme: [], lukewarm: [] }, // Lukewarm Scoring two-bucket display — see _afExtremityBuild
        afScorecardExpanded: null,     // key of currently expanded dial, or null
        afDialCutoffs: {},             // {[family|pole]: magnitude} — the live "extreme begins here" line per dial
        // Rolling pool of raw criterion readings — every annotation call (scan-time pool
        // building, live liq messages, Extremity Re-Evaluation) feeds it via _afDialSample,
        // regardless of whether that reading ever becomes a candidate or a trade. This — NOT
        // closed-trade records — is what afDialCutoffs is computed from. Persists across
        // restarts via DIAL_POOL_KEY (init() loads it explicitly — see there for why the
        // lazy `||=` pattern used elsewhere can't do this on its own, since this declared
        // default is already truthy).
        afDialSamplePool: {},          // {[family|pole]: number[]}
        afDialSampleCounts: {},        // {[family|pole]: n} — for the "unproven, still lukewarm by default" badge
        afSampleBucketMeans: null, // Sample Scoring: overall mean edge per bucket, decides the favored side
        _afSampleStore: { obs: [] },
        _afFc: { seq: 0, ts: 0, pend: [], done: [], voids: { gone: 0, late: 0, thin: 0 }, nof: 0 }, // Forecast Grader store (see _afFcLoad)
        _afFcSel: null, // Forecast chart: the clicked start batch ('d<seq>') the ticker table shows
        afCrossEvents: [],
        // Gains Continuation (GC) — own rolling 6h closed-trade PnL log, independent of the
        // host's Gains Lock window (that one only populates when cfg.gainsLockEnabled is on;
        // GC needs to work regardless). _afGcLastStep is the highest step index already
        // broadcast (high-water-mark — never re-fires a step already crossed); resets to 0 once
        // rolling PnL drops back to ≤0 so a fresh climb re-arms from the first step. _afGcLastSeenTs
        // is the ts of the latest partner 'gc' event already reacted to (fresh or stale), so the
        // 15s loop doesn't re-evaluate the same event every tick.
        afGcWindow:      [],
        _afGcLastStep:   0,
        _afGcLastSeenTs: 0,
        _afOcCycleHistory: [], // rolling per-cycle snapshots: {id, ts, results:[{sym,bc,sc,avgMs,n}]}
        _afOcCycleCounter: 0,
        afOcResults: {},       // {[sym]:{bc,sc,avgMs,n}} from the most recent OC fetch batch
        _ocFetchRunning: false, // guards against overlapping _ocFetchBatch calls
        // Fixed Y-axis overlay HTML/positions for the OC chart, set as a side effect of
        // _afOcChartSvg(). Must be pre-declared (not just assigned later inside that method) —
        // an x-html/x-text binding that reads a property before Alpine has ever seen it
        // declared throws a ReferenceError during the initial bind.
        _afOcYAxisHtml: '',
        _afOcAvgYPx: null,
        _afOcHighlightedCycleTs: null, // ts of a clicked cycle in the ORDER INTERVAL SAMPLE chart; null = follow latest
        _afOcViewMode: 'vol', // 'vol' | 'io' | 'ls' | 'fund' | 'lta' | 'lpa' — which sample the tethered chart/summary/chips display

        _afScoreRead() {

              try {
                const legacyRaw = localStorage.getItem(LEGACY_SHARED_EXTREMITY_KEY);
                const legacy = legacyRaw ? JSON.parse(legacyRaw) : [];
                const mine = Array.isArray(legacy) ? legacy.filter(r => r.source === 'chaser') : [];
                localStorage.setItem(EXTREMITY_KEY, JSON.stringify(mine));

            const isLegacy  = r => r.criteria.some(c => LEGACY.has(c));
            const bySlot = {};
            for (const r of records) {
              if (isLegacy(r)) continue;

              if (!bySlot[k]) bySlot[k] = [];
              bySlot[k].push(r);

        // Feeds the Extremity Scorer's cutoff computation. Called from every criterion

        // cutoff needs to be provable from the wide stream of what the market is actually
        // showing right now, not from the narrow trickle of closed trades. Sampling only from

        async _afPositionCriteriaSample(pos) {

        // ── Drift Credit ────────────────────────────────────────────────

            if (!Array.isArray(drift) || drift.length !== scoreCrits.length) drift = null;

        // Re-reads every entry criterion for this position's symbol and returns, per criterion

        // where it can't be measured (bare Blind-Entry/Liquid-Diver tags, missing data, fetch
        // failure). Compares against the frozen ENTRY snapshot, not the rolling average.
        async _afCloseDrift(pos) {
          const entry = pos._micCriteria || pos._becCriteria || pos._ldcCriteria;
          if (!entry?.length || !pos.symbol) return null;

          try {
            const r = await this._qFetch(`${this.base}/v5/market/tickers?category=linear&symbol=${pos.symbol}`);
            const d = await r.json();
            t = d?.retCode === 0 ? d.result?.list?.[0] : null;

          if (!t) return null;
          const fams = entry.map(tag => tag.replace(/[+-]?\d+$/, ''));
          if (fams.some(f => /^(lta|lpa)/.test(f))) { try { await this._afHourCandle(pos.symbol); } catch(_) {} }

            const m0 = tag.match(/(-?\d+)$/);

        _afDriftScale(family, entryTier) {
