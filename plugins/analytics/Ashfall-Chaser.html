          return Math.max(1, Math.abs(entryTier));
        },
        // Drift array -> shares summing to 1. Unmeasurable entries (null) get the mean weight of
        // the measured ones; nothing measurable / mode 'off' / legacy record -> even split.
        //   'least': w = 1/(1+d)        — steadiest criterion is most culpable (current default)
        //   'most':  w = d/(1+d) + .05  — the flipped reading; .05 keeps zero-drift from zeroing out
        _afCreditShares(dArr) {
          const n = dArr.length;
          const even = () => dArr.map(() => 1 / n);
          const mode = this.cfg.afDriftCreditMode;
          if (mode !== 'least' && mode !== 'most') return even();
          const ok = x => typeof x === 'number' && isFinite(x) && x >= 0;
          const known = dArr.filter(ok);
          if (!known.length) return even();
          const f = mode === 'most' ? (d => d / (1 + d) + 0.05) : (d => 1 / (1 + d));
          const raw = dArr.map(x => ok(x) ? f(x) : null);
          const fill = raw.filter(x => x != null).reduce((a, b) => a + b, 0) / known.length;
          const vals = raw.map(x => x ?? fill);
          const sum = vals.reduce((a, b) => a + b, 0);
          return vals.map(v => v / sum);
        },
        // ── Extremity Scorer / Lukewarm Scoring core build.
        //
        // Cutoffs are computed FIRST, from afDialSamplePool (the observation stream — see
        // _afDialSample above), independent of closed-trade records entirely: for each dial
        // pole with >= afExtremityMinSamples readings, the cutoff is the magnitude at the
        // configured split percentile of that pole's OWN observed spread — "organically
        // arrange them into highs and lows" per the user's own framing. A pole below the
        // sample floor has no proven cutoff and stays lukewarm by default (never credited,
        // never blocking) until it clears the floor — which, sampling from live readings
        // rather than closes, usually happens within the first scan or two, not never.
        //
        // Records are then walked ONCE. Extreme occurrences score into that pole's
        // win/loss/pnl exactly as before — this is what MIC's blocking/co-qual reads via
        // micCollapsedSlotRanks, unchanged in shape. Lukewarm Scoring adds a second,
        // parallel tally alongside it: EVERY occurrence (extreme or lukewarm) also lands in
        // afLukewarmScoreboard under its classification bucket and family — "which side
        // (Extreme vs Lukewarm) has been more profitable overall, and which criteria within
        // that side actually drove it" — purely a display/advisory layer, never read by
        // blocking or the veto.
        //
        // Bare Blind-Entry/Liquid-Diver tags always classify extreme — there's nothing to
        // be lukewarm about.
        _afExtremityBuild(records) {
          if (this.cfg.afSampleScoringEnabled) { try { return this._afSampleBuild(); } catch (e) { console.warn('[ASH] Sample Scoring build failed', e); } }
          records = records || this._afScoreRead();
          const exclude = new Set(this.cfg.micAutoSlotExclude || []);
          const quota = this.cfg.afSpongeQuota;
          const minSamples = Math.max(3, this.cfg.afExtremityMinSamples || 3);
          const splitPct = Math.min(0.49, Math.max(0.01, (this.cfg.afExtremitySplitPct ?? 30) / 100));
          const sortedRecords = [...records].sort((a, b) => b.ts - a.ts).filter(r => r.source === 'chaser');
          // Scorecards fully separated per side — Ashfall's Extremity
          // Scorer only ever aggregates its own closed trades. No cross-bot reading, no
          // sign flipping, no shared bias/pool needed: partner-sourced records in
          // EXTREMITY_KEY (if any linger from before this change) are filtered out above
          // and never reach dialStats/bucketStats/ranks below.

          const samplePool = (this.afDialSamplePool ||= this._afLoadDialPool());
          const cutoffs = {};
          for (const [dk, mags] of Object.entries(samplePool)) {
            if (mags.length < minSamples) { cutoffs[dk] = null; continue; }
            const sorted = [...mags].sort((a, b) => a - b);
            const idx = Math.min(sorted.length - 1, Math.floor(sorted.length * (1 - splitPct)));
            cutoffs[dk] = sorted[idx];
          }

          const dialStats = {};
          const dialCount = {};
          const subtagStats = {};
          const bucketStats = { extreme: {}, lukewarm: {} };
          const bucketCount = { extreme: {}, lukewarm: {} };
          for (const r of sortedRecords) {
            const keptIdx = [];
            for (let i = 0; i < r.criteria.length; i++) if (!exclude.size || !exclude.has(r.criteria[i])) keptIdx.push(i);
            if (!keptIdx.length) continue;
            const pnl = typeof r.pnl === 'number' ? r.pnl : (r.win ? 1 : -1);
            // Drift Credit (TENTATIVE — see _afCreditShares): each criterion gets a SHARE of the
            // position's PnL, shares summing to 1 across the criteria that survive the exclude
            // filter, instead of the whole PnL apiece. Own-only records (see sortedRecords filter above).
            const shares = this._afCreditShares(keptIdx.map(i => Array.isArray(r.d) ? r.d[i] : null));
            for (let ki = 0; ki < keptIdx.length; ki++) {
              const c = r.criteria[keptIdx[ki]];
              const effectivePnl = pnl * shares[ki];
              const key = collapseCrit(c);
              const info = dialInfo(key);
              if (!info) continue; // unrecognized/retired tag — no dial, not scored
              const noGradation = !!BARE_DIAL_TAGS[key];
              let mag = Infinity;
              if (!noGradation) {
                const m2 = c.match(/(-?\d+)$/);
                mag = m2 ? Math.abs(parseInt(m2[1], 10)) : 0;
              }
              const pole = info.pole;
              const dk = info.family + '|' + pole;
              const cutoff = cutoffs[dk];
              const isExtreme = !Number.isFinite(mag) || (cutoff != null && mag >= cutoff);

              // Lukewarm Scoring: every occurrence lands here, extreme or not. Keyed by dk
              // (family+pole), not family alone — a two-pole family's '+' and '-' sides are
              // opposite signals and must not be netted into one pill.
              const bucket = isExtreme ? 'extreme' : 'lukewarm';
              const bCount = bucketCount[bucket];
              if ((bCount[dk] = (bCount[dk] ?? 0) + 1) <= quota) {
                const bStats = bucketStats[bucket];
                if (!bStats[dk]) bStats[dk] = { pnl: 0, wins: 0, losses: 0 };
                const bs = bStats[dk];
                bs.pnl += effectivePnl; if (effectivePnl > 0) bs.wins++; else bs.losses++;
              }

              if (!isExtreme) continue; // lukewarm — not scored into the blocking-facing dial below

              if ((dialCount[dk] = (dialCount[dk] ?? 0) + 1) > quota) continue;
              if (!dialStats[dk]) dialStats[dk] = { pnl: 0, wins: 0, losses: 0, hasHist: false, hasTrade: false };
              const stats = dialStats[dk];
              stats.pnl += effectivePnl; if (effectivePnl > 0) stats.wins++; else stats.losses++;
              if (r.hist) stats.hasHist = true; else stats.hasTrade = true;
              const subtagKey = key;
              if (!subtagStats[subtagKey]) subtagStats[subtagKey] = { pnl: 0, wins: 0, losses: 0 };
              const ts = subtagStats[subtagKey];
              ts.pnl += effectivePnl; if (effectivePnl > 0) ts.wins++; else ts.losses++;
            }
          }
          // A dial can have a proven cutoff (samples exist) but zero closes yet — still needs
          // to show up (0 pnl, real sample count) rather than vanish from the panel/ranks.
          for (const dk of Object.keys(cutoffs)) {
            if (!dialStats[dk]) dialStats[dk] = { pnl: 0, wins: 0, losses: 0, hasHist: false, hasTrade: false };
          }
          for (const dk of Object.keys(dialStats)) {
            dialStats[dk].cutoff = cutoffs[dk] ?? null;
            dialStats[dk].sampleCount = (samplePool[dk] || []).length;
          }

          this.afDialCutoffs = cutoffs;
          this.afDialSampleCounts = Object.fromEntries(Object.entries(samplePool).map(([k, v]) => [k, v.length]));
          // Flat display-key -> stats map, same shape the old micCollapsedSlotRanks/
          // micCollapsedCritStats used — _micScaledRank/_micCritScore/_micIsCritBlocked keep
          // reading this one flat lookup unchanged, with no idea dials or poles exist beneath it.
          const ranks = {}, dispStats = {};
          for (const [dk, stats] of Object.entries(dialStats)) {
            const [family, pole] = dk.split('|');
            const key = dialDisplayKey(family, pole);
            ranks[key] = stats.pnl;
            dispStats[key] = stats;
          }
          // Per-tag scores layer on top for blocking's benefit — never overwrites a dk-based
          // key above (every family's raw tag already equals its own dk key, so this is a
          // no-op re-write for them, not a collision).
          for (const [tag, ts] of Object.entries(subtagStats)) {
            ranks[tag] = ts.pnl;
          }
          this.micCollapsedSlotRanks = ranks;
          this.micCollapsedCritStats = dispStats;
          this.afScoreboard = Object.entries(dispStats).sort(([,a],[,b]) => b.pnl - a.pnl).map(([key, s]) => ({ key, ...s }));
          // Lukewarm Scoring display layer — two buckets (Extreme / Lukewarm), each with a
          // per-pole breakdown (dk = family+pole — see above). See _afExtremityHtml for the render.
          const _dkToLukewarmEntry = ([dk, s]) => {
            const [family, pole] = dk.split('|');
            return { family, pole, key: dialDisplayKey(family, pole), ...s };
          };
          this.afLukewarmScoreboard = {
            extreme: Object.entries(bucketStats.extreme).sort(([,a],[,b]) => b.pnl - a.pnl).map(_dkToLukewarmEntry),
            lukewarm: Object.entries(bucketStats.lukewarm).sort(([,a],[,b]) => b.pnl - a.pnl).map(_dkToLukewarmEntry),
          };
        },
        // ── Sample Scoring ─────────────────────────────────────────────────
        // A PROACTIVE alternative to the reactive (closed-trade) Extremity Scorer. Instead of crediting
        // criteria with the PnL of trades we already made, it scores every criterion against how the
        // SAMPLED tickers actually moved (LPA = 1hr price change vs the population), so the scorecard
        // can learn before any entry happens. Everything downstream (Extreme vs Lukewarm buckets, the
        // favored-side veto, blocking, co-qual ranking) still reads the same afLukewarmScoreboard /
        // micCollapsedSlotRanks / afDialCutoffs — only the numbers feeding them change.
        //
        // Units: a score is the MEAN EDGE in percentage points of LPA in this bot's favor (Chaser:
        // 1=+1 wants price up, -1 wants it down), NOT dollars. Blocking therefore compares it against
        // (micSlotBlockPct/100) pp — see _afBlockThreshold.
        //
        // Pairing: criteria tiers and the outcome come from the same sample moment; the outcome is the LAST COMPLETED hour's
        // price change, so it is a same-moment correlation. LPA is excluded as a criterion (it would be scoring itself); LTA stays in
        // (concurrent with the outcome).
        // Charts (OC/Vol/IO/Fund/LTA/LPA) are untouched — they keep showing each batch's own tickers.
        // Following (host's lfFollowPartner + live partner heartbeat): the follower runs no sample batch of its own. It seeds the leader's batch (_ocSeedFromShared)
        // and adopts the leader's scored store (_afSampleAdopt); the leader publishes both ('ocResults', 'sampleScore'), so the second bot's copy costs no requests.
        _afFollowing() { return !!this._lfIsFollowing?.(); },
        _afSampleDir() { return 1; },
        _afSampleStep(fam) {
          const D = { fund: 0.0025, va: 1, iol: 1, ios: 1, lta: 10, lpa: 0.25 };
          const k = 'mic' + fam.charAt(0).toUpperCase() + fam.slice(1) + 'Step';
          const v = Number(this.cfg[k]);
          return v > 0 ? v : D[fam];
        },
        _afSampleLoad() {
          try {
            const raw = localStorage.getItem(SAMPLE_OBS_KEY);
            const d = raw ? JSON.parse(raw) : null;
            // Forward samples (k:'f') and their pending snapshots belonged to the removed Delayed Pairing; the scorecard no longer reads
            // them, so they are dropped, together with the weather peak/bottom built on them.
            const fwd = !!d && ((Array.isArray(d.pending) && d.pending.length > 0) || (Array.isArray(d.obs) && d.obs.some(o => o && o.k === 'f')));
            this._afSampleStore = { obs: Array.isArray(d?.obs) ? d.obs.filter(o => o && o.k !== 'f') : [], ...(d?.wx && !fwd ? { wx: d.wx } : {}), ...(d?.gray && typeof d.gray === 'object' ? { gray: d.gray } : {}), ...(d?.lquiet && typeof d.lquiet === 'object' ? { lquiet: d.lquiet } : {}), ...(d?.lgray && typeof d.lgray === 'object' ? { lgray: d.lgray } : {}) };
          } catch (_) { this._afSampleStore = { obs: [] }; }
        },
        _afSampleSave() {
          try {
            const st = this._afSampleStore;
            st.obs = this._afObsTrim(st.obs, this._afObsCap());
            localStorage.setItem(SAMPLE_OBS_KEY, JSON.stringify(st));
            // Leader publishes its scored store for a following partner (newest observations, capped well under the shared registry's byte cap).
            if (!this._afFollowing()) this._sharedWrite?.('sampleScore', { obs: this._afObsTrim(st.obs, 60 * 1024), ...(st.wx ? { wx: st.wx } : {}) });
          } catch (_) {}
        },
        // Scan-path saves (ingest) go through the idle lane so one scan does one save, after the CPU stages; the
        // store is only trimmed to its byte cap when that save runs. Other callers keep the immediate _afSampleSave.
        _afSampleSaveSoon() {
          if (this._schIdle) this._schIdle('af-samplesave', () => this._afSampleSave());
          else this._afSampleSave();
        },
        // ---- Liquidation Surveillance --------------------------------------------------------------------------------------------
        // Liquidation as a second outcome in Sample Scoring, at zero extra fetches: the watched set IS the sample batch (already fetched
        // every scan), so the only new traffic is the public liquidation WS for those symbols. Each scan:
        //   1. _afLiqPick closes the watch that just ran. Tickers with liquidations stay in the next batch (continued sampling, most
        //      liquidated turnover first); quiet ones are graylisted (st.lgray) and replaced by fresh random tickers; the batch is
        //      always filled to its size, drawing the oldest-graylisted back only when there aren't enough other tickers.
        //   2. The batch is fetched as usual; _afLiqIngest then writes one 'l' observation per liquidated ticker: criteria from that
        //      fresh end-of-watch reading, outcome = the watch's liquidated turnover. The lean (liquidated shorts minus liquidated
        //      longs, as a share of the turnover, -1..+1) is converted to pp by the window's typical move so it counts 1:1 with a price
        //      observation; the bot's favor is dir x pp (Chaser likes liquidated shorts, Winter liquidated longs), exactly like price.
        // Only the leader watches; a follower adopts the 'l' observations through the shared sampleScore store.
        _afLiqOn() { return !!(this.cfg.afLiqEnabled && this.cfg.afSampleScoringEnabled && !this._afFollowing()); },
        _afLiqToggle() {
          if (!this.cfg.afLiqEnabled) this._afLiqWsStop();
          this._afExtremityBuild();
          this.persist?.();
        },
        // The watch survives a reload: its tally, watched set and any closed-but-unscored watch are kept in localStorage (throttled while
        // events arrive, and on pagehide). After a reload the first pick restores them, reconnects the feed, and the next scan closes and
        // scores that watch like any other. Events missed while the page was closed are simply absent; a watch older than 12 h is dropped
        // (its criteria would no longer match its liquidations).
        _afLiqPersist() {
          try {
            if (!LIQ.watch && !LIQ.closing) { localStorage.removeItem(LIQ_KEY); return; }
            localStorage.setItem(LIQ_KEY, JSON.stringify({
              t: Date.now(),
              watch: LIQ.watch ? { syms: [...LIQ.watch.syms], t0: LIQ.watch.t0, gap: (LIQ.gap || 0) + (LIQ.downAt ? Date.now() - LIQ.downAt : 0) } : null,
              tally: LIQ.tally,
              closing: LIQ.closing ? { snap: LIQ.closing.snap, syms: [...LIQ.closing.watch.syms], t0: LIQ.closing.watch.t0, at: LIQ.closing.at, gap: LIQ.closing.gap, skip: !!LIQ.closing.skip } : null
            }));
          } catch (_) {}
        },
        _afLiqRestore() {
          if (LIQ.restored) return;
          LIQ.restored = true;
          try { window.addEventListener('pagehide', () => this._afLiqPersist()); } catch (_) {}
          try {
            const d = JSON.parse(localStorage.getItem(LIQ_KEY) || 'null');
            if (d && Date.now() - d.t <= 12 * 3600000) {
              if (d.watch && !LIQ.watch) { LIQ.watch = { syms: new Set(d.watch.syms), t0: d.watch.t0 }; LIQ.gap = (d.watch.gap || 0) + Math.max(0, Date.now() - d.t); LIQ.downAt = Date.now(); } // the page was closed from the last save until now
              if (d.tally && !Object.keys(LIQ.tally).length) LIQ.tally = d.tally;
              if (d.closing && !LIQ.closing) LIQ.closing = { snap: d.closing.snap, watch: { syms: new Set(d.closing.syms), t0: d.closing.t0 }, at: d.closing.at, gap: d.closing.gap, skip: !!d.closing.skip };
            }
          } catch (_) {}
          if (LIQ.watch && this._afLiqOn()) this._afLiqWsSync([...LIQ.watch.syms]); // keep tallying until the next scan
        },
        _afLiqWsOpen() {
          clearTimeout(LIQ.retry);
          let ws;
          try { ws = new WebSocket('wss://stream.bybit.com/v5/public/linear'); }
          catch (_) { LIQ.retry = setTimeout(() => { if (this._afLiqOn()) this._afLiqWsOpen(); }, 5000); return; }
          LIQ.ws = ws; LIQ.subs = new Set();
          ws.onopen = () => {
            if (LIQ.downAt) { LIQ.gap = (LIQ.gap || 0) + (Date.now() - LIQ.downAt); LIQ.downAt = 0; } // feed back: the blind stretch ends
            this._afLiqWsApply();
            clearInterval(LIQ.ping);
            LIQ.ping = setInterval(() => { try { if (ws.readyState === 1) ws.send('{"op":"ping"}'); } catch (_) {} }, 20000);
          };
          ws.onmessage = ev => {
            try {
              const m = JSON.parse(ev.data);
              if (!m || typeof m.topic !== 'string' || m.topic.indexOf('allLiquidation.') !== 0 || !Array.isArray(m.data)) return;
              for (const d of m.data) {
                const sym = d.s || m.topic.slice(15), v = parseFloat(d.v) * parseFloat(d.p);
                if (!(v > 0)) continue;
                const t = (LIQ.tally[sym] ||= { up: 0, dn: 0, n: 0 });
                if (d.S === 'Buy') t.dn += v; else t.up += v; // 'Buy' = a long was liquidated (price-down pressure)
                t.n++;
              }
              if (!LIQ.pt) LIQ.pt = setTimeout(() => { LIQ.pt = null; this._afLiqPersist(); }, 4000);
            } catch (_) {}
          };
          ws.onclose = () => {
            if (LIQ.ws !== ws) return;
            if (!LIQ.downAt) LIQ.downAt = Date.now(); // feed down: a blind stretch starts
            LIQ.ws = null; LIQ.subs = new Set(); clearInterval(LIQ.ping);
            if (this._afLiqOn()) LIQ.retry = setTimeout(() => { if (this._afLiqOn()) this._afLiqWsOpen(); }, 5000);
          };
          ws.onerror = () => { try { ws.close(); } catch (_) {} };
        },
        // Diff the wanted symbols against what the socket is subscribed to; 10 topics per request.
        _afLiqWsApply() {
          const ws = LIQ.ws;
          if (!ws || ws.readyState !== 1) return;
          const add = [...LIQ.want].filter(s => !LIQ.subs.has(s)), del = [...LIQ.subs].filter(s => !LIQ.want.has(s));
          const send = (op, arr) => { for (let i = 0; i < arr.length; i += 10) { try { ws.send(JSON.stringify({ op, args: arr.slice(i, i + 10).map(s => 'allLiquidation.' + s) })); } catch (_) {} } };
          send('unsubscribe', del); send('subscribe', add);
          del.forEach(s => LIQ.subs.delete(s)); add.forEach(s => LIQ.subs.add(s));
        },
        _afLiqWsSync(syms) {
          LIQ.want = new Set(syms);
          if (!LIQ.ws || LIQ.ws.readyState > 1) this._afLiqWsOpen();
          else this._afLiqWsApply();
        },
        _afLiqWsStop() {
          clearTimeout(LIQ.retry); clearInterval(LIQ.ping);
          const ws = LIQ.ws; LIQ.ws = null; LIQ.subs = new Set(); LIQ.want = new Set();
          if (ws) { ws.onclose = null; try { ws.close(); } catch (_) {} }
          LIQ.tally = {}; LIQ.watch = null; LIQ.closing = null; LIQ.gap = 0; LIQ.downAt = 0;
          try { localStorage.removeItem(LIQ_KEY); } catch (_) {}
        },
        // Called by MIC/MIW once per scan with the shuffled pool: returns the batch (length <= cap) or null (off / following → the
        // random batch stands). Closes the watch that just ran and opens the next.
        _afLiqPick(pool, cap) {
          if (!this._afLiqOn()) { if (LIQ.ws || LIQ.watch || LIQ.closing) this._afLiqWsStop(); return null; }
          this._afLiqRestore();
          const st = (this._afSampleStore ||= { obs: [] });
          const gray = (st.lgray ||= {});
          const inPool = new Set(pool);
          const snap = LIQ.tally; LIQ.tally = {};
          const prev = LIQ.watch;
          let kept = [];
          if (prev) {
            const live = s => snap[s] && snap[s].n > 0;
            kept = [...prev.syms].filter(s => live(s) && inPool.has(s)).sort((a, b) => (snap[b].up + snap[b].dn) - (snap[a].up + snap[a].dn));
            const now = Date.now();
            for (const s of prev.syms) if (!live(s)) gray[s] = now; // quiet → graylisted, always
            if (LIQ.closing) { // an earlier close never reached ingest (fetch skipped): fold the tallies together
              for (const [s, t] of Object.entries(snap)) { const c = (LIQ.closing.snap[s] ||= { up: 0, dn: 0, n: 0 }); c.up += t.up; c.dn += t.dn; c.n += t.n; }
              for (const s of prev.syms) LIQ.closing.watch.syms.add(s);
              LIQ.closing.skip = true; // two watches folded together: no clean window to report
            } else LIQ.closing = { snap, watch: prev, at: Date.now(), gap: (LIQ.gap || 0) + (LIQ.downAt ? Date.now() - LIQ.downAt : 0) };
          }
          kept = kept.slice(0, cap);
          const keptSet = new Set(kept);
          const fresh = [], grayed = [];
          for (const s of pool) {
            if (keptSet.has(s)) continue;
            if (gray[s]) grayed.push(s); else fresh.push(s);
          }
          grayed.sort((a, b) => gray[a] - gray[b]); // oldest-graylisted first
          const out = [...kept, ...fresh].slice(0, cap);
          if (out.length < cap) {
            const need = grayed.slice(0, cap - out.length);
            for (const s of need) { delete gray[s]; out.push(s); } // back in: a fresh chance, and out of the graylist
          }
          LIQ.watch = { syms: new Set(out), t0: Date.now() };
          LIQ.gap = 0; LIQ.downAt = (LIQ.ws && LIQ.ws.readyState === 1) ? 0 : Date.now(); // blind-time accounting for this watch
          this._afLiqWsSync(out);
          this._afLiqPersist();
          return out;
        },
        // The window's typical move in pp: median |hc - average| over each ticker's latest reading. A fully one-sided liquidation
        // lean counts as one typical price move.
        _afLiqScale() {
          const w = this._afWindowStats('lpa');
          if (!w || !w.n) return null;
          const avg = w.sum / w.n, d = Object.values(w.vals).map(v => Math.abs(v - avg)).sort((a, b) => a - b);
          return Math.max(0.05, d[Math.floor(d.length / 2)]);
        },
        // End of watch (the batch it re-fetched has just landed): one 'l' observation per liquidated ticker, plus the chart annotation.
        _afLiqIngest(entry) {
          const cl = LIQ.closing;
          if (!cl) return 0;
          LIQ.closing = null;
          this._afLiqPersist();
          const st = (this._afSampleStore ||= { obs: [] });
          const S = this._afLiqScale();
          if (S == null) return 0;
          const recs = {};
          for (const r of entry.results) if (r && typeof r.sym === 'string') recs[r.sym] = r;
          let added = 0;
          const lean = {}, split = {};
          for (const [sym, t] of Object.entries(cl.snap)) {
            const tot = t.up + t.dn;
            if (!(t.n > 0) || !(tot > 0) || !cl.watch.syms.has(sym)) continue;
            const y = (t.up - t.dn) / tot; // up = liquidated shorts
            lean[sym] = y * S;
            split[sym] = { u: Math.round(t.up), d: Math.round(t.dn) }; // liquidated short / long turnover of this watch (instability + pill mix)
            const rec = recs[sym];
            if (!rec) continue; // not re-fetched (more liquidated tickers than the batch holds): nothing to tag it with
            const tags = this._afSampleTags(rec, sym, true);
            if (!tags.length) continue;
            st.obs.push({ t: entry.ts, s: sym, k: 'l', y: +y.toFixed(4), r: +(y * S).toFixed(4), w: Math.round(tot), c: tags });
            added++;
          }
          // Chart: the cycle the watch started on shows each watched ticker's lean in pp (0 = watched, quiet).
          const hist = this._afOcCycleHistory || [];
          const startCycle = hist.length > 1 ? hist[hist.length - 2] : null;
          if (startCycle && Array.isArray(startCycle.results)) {
            let any = false;
            const lq = {}, ls = {};
            for (const r of startCycle.results) if (r && cl.watch.syms.has(r.sym)) {
              r.lq = lean[r.sym] != null ? +lean[r.sym].toFixed(3) : 0; lq[r.sym] = r.lq; any = true;
              if (split[r.sym]) { r.lu = split[r.sym].u; r.ld = split[r.sym].d; ls[r.sym] = split[r.sym]; } else { delete r.lu; delete r.ld; }
            }
            this._afBgLiq(startCycle, cl.watch.syms, lean, split, cl);
            if (any) {
              this._ocPersistHistory?.();
              // Share it so a follower's Liq view fills in too: keyed by the shared ts the cycle was published under (entry.pub), which
              // is the ts a follower files that cycle's history entry under.
              this._afLiqVer = (this._afLiqVer || 0) + 1;
              if (startCycle.pub) this._sharedWrite?.('liqLean', { cts: startCycle.pub, lq, ls });
            }
          }
          return added;
        },
        // Following: file the leader's published lean (symbol -> pp, 0 = watched but quiet) on the matching cycle of our own history.
        _afLiqAdopt() {
          if (!this._afFollowing()) return;
          const sh = this._sharedRead?.('liqLean');
          if (!sh?.data || !sh.data.lq || sh.ts === this._afLiqLeanTs) return;
          const h = (this._afOcCycleHistory || []).find(c => c && c.ts === sh.data.cts);
          if (!h || !Array.isArray(h.results)) return; // that cycle isn't in our history (yet): try again next scan
          this._afLiqLeanTs = sh.ts;
          let any = false;
          for (const r of h.results) if (r && typeof sh.data.lq[r.sym] === 'number') {
            r.lq = sh.data.lq[r.sym]; any = true;
            const sp = sh.data.ls && sh.data.ls[r.sym];
            if (sp) { r.lu = sp.u; r.ld = sp.d; } else { delete r.lu; delete r.ld; }
          }
          if (any) { this._afLiqVer = (this._afLiqVer || 0) + 1; this._ocPersistHistory?.(); }
        },
        // 'n' and 'l' observations are trimmed to the byte cap separately, so the busier kind can't push the other out.
        // Sample observations share ONE time horizon (cfg.afObsHorizonHrs, default 3h) - price and liquidation alike - so every score adapts at the same
        // pace. Age trims; the byte cap is only a safety net sized to the horizon (it used to be the real limit, which left price at ~3h and liquidation at ~63h).
        _afObsHorizonMs() { return Math.max(0.5, Number(this.cfg.afObsHorizonHrs) || 3) * 3600000; },
        _afObsCap() { return Math.min(3 * 1024 * 1024, Math.max(TYPE_BYTE_CAP, Math.round(this._afObsHorizonMs() / 3600000 * 100 * 1024))); },
        _afObsLive() { const cut = Date.now() - this._afObsHorizonMs(); return ((this._afSampleStore && this._afSampleStore.obs) || []).filter(o => o && (o.t || 0) >= cut); },
        _afObsTrim(obs, cap) {
          const cut = Date.now() - this._afObsHorizonMs(), live = obs.filter(o => o && (o.t || 0) >= cut);
          const l = live.filter(o => o.k === 'l'), n = live.filter(o => o.k !== 'l');
          const half = Math.floor(cap / 2);
          return [...trimToByteCap(n, l.length ? half : cap), ...trimToByteCap(l, half)].sort((a, b) => (a.t || 0) - (b.t || 0));
        },
        _afSampleClear() {
          this._afSampleStore = { obs: [] };
          this._afFcClear();
          LIQ.closing = null; LIQ.tally = {}; this._afLiqPersist();
          try { localStorage.removeItem(SAMPLE_OBS_KEY); } catch (_) {}
        },
        // The scorecard reads one outcome kind: 'n' (criteria at sample time against the last completed hour's move).
        _afSampleKind() { return 'n'; },
        // ── Illiquidity Filter ────────────────────────────────────────────────────────────────────────────────────────────────
        // A ticker whose trades come slowly is illiquid: its hour candles flatten the samples and its fills slip. Each sample batch measures
        // the tickers it carries whose last reading is older than afIlqRefreshDays (default 7): ONE recent-trade fetch of 3 trades, the
        // average gap between their times. Slower than afIlqSlowSecs (default 12s) = illiquid, and the ticker is left out of the batch (and
        // out of MIC/MIW's pool via afGrayHas) until its reading expires, when its next batch appearance measures it again. The leader
        // measures and publishes; a follower adopts the leader's readings.
        _afIlqLoad() {
          try {
            const d = JSON.parse(localStorage.getItem(ILQ_KEY) || 'null');
            ILQ.rec = (d && typeof d === 'object' && !Array.isArray(d)) ? d : {};
          } catch (_) { ILQ.rec = {}; }
          ILQ.loaded = true;
        },
        _afIlqMaxAgeMs() { return Math.max(1, Number(this.cfg.afIlqRefreshDays) || 7) * 86400000; },
        _afIlqFresh(sym) { if (!ILQ.loaded) this._afIlqLoad(); const r = ILQ.rec[sym]; return !!r && typeof r.t === 'number' && Date.now() - r.t < this._afIlqMaxAgeMs(); },
        // True when the filter is on and the ticker has a live reading slower than the threshold.
        _afIlqIs(sym) {
          if (!this.cfg.afIlqEnabled || !this._afIlqFresh(sym)) return false;
          return ILQ.rec[sym].g > (Number(this.cfg.afIlqSlowSecs) || 12) * 1000;
        },
        _afIlqSave() {
          const cut = Date.now() - 3 * this._afIlqMaxAgeMs();
          for (const k of Object.keys(ILQ.rec)) if (!(ILQ.rec[k] && ILQ.rec[k].t >= cut)) delete ILQ.rec[k]; // delisted / long-unseen tickers drop out
          try { localStorage.setItem(ILQ_KEY, JSON.stringify(ILQ.rec)); } catch (_) {}
          if (!this._afFollowing()) {
            const pub = {}; for (const [k, v] of Object.entries(ILQ.rec)) pub[k] = [v.t, v.g];
            this._sharedWrite?.('ilq', pub);
          }
        },
        // Following: take the leader's readings (the newer one per ticker wins); never published back.
        _afIlqAdopt() {
          if (!this.cfg.afIlqEnabled || !this._afFollowing()) return;
          const sh = this._sharedRead?.('ilq');
          if (!sh?.data || sh.ts === this._afIlqLastTs) return;
          this._afIlqLastTs = sh.ts;
          if (!ILQ.loaded) this._afIlqLoad();
          let any = false;
          for (const [k, v] of Object.entries(sh.data)) {
            if (!Array.isArray(v) || !(v[0] > 0) || !(v[1] >= 0)) continue;
            if (!ILQ.rec[k] || ILQ.rec[k].t < v[0]) { ILQ.rec[k] = { t: v[0], g: v[1] }; any = true; }
          }
          if (any) try { localStorage.setItem(ILQ_KEY, JSON.stringify(ILQ.rec)); } catch (_) {}
        },
        // One recent-trade fetch (3 trades): the average gap between their times in ms; null when the fetch fails or fewer than 3 trades come back.
        async _afIlqMeasure(sym) {
          try {
            const res = await this._qFetch(`${this.base}/v5/market/recent-trade?category=linear&symbol=${sym}&limit=3`);
            const list = (await res.json())?.result?.list;
            if (!Array.isArray(list)) return null;
            const ts = list.map(x => Number(x && x.time)).filter(v => isFinite(v) && v > 0).sort((a, b) => b - a);
            if (ts.length < 3) return null;
            return Math.round((ts[0] - ts[ts.length - 1]) / (ts.length - 1));
          } catch (_) { return null; }
        },
        // Readout numbers: live readings, how many are illiquid, and the slowest.
        _afIlqStats() {
          if (!ILQ.loaded) this._afIlqLoad();
          const lim = (Number(this.cfg.afIlqSlowSecs) || 12) * 1000;
          let n = 0, slow = 0, worst = 0;
          for (const k of Object.keys(ILQ.rec)) if (this._afIlqFresh(k)) { n++; const g = ILQ.rec[k].g; if (g > lim) slow++; if (g > worst) worst = g; }
          return { n, slow, worst };
        },

        // -- Stablecoin Filter ----------------------------------------------------------------------------------------
        // Passive: rides on the hour-candle fetch the sample batch already makes (limit=3 also returns the forming candle, whose close is
        // the current price). A ticker's range = (highest - lowest of the completed candle's open/high/low/close and the current price) / open.
        // Under afStbMinPct % (default 0.01) = stablecoin: graylisted for afStbHours (default 12) hours, out of samples and entries
        // (MIC/MIW's pool via afGrayHas), then measured again the next batch it appears in. The leader judges and publishes; a follower adopts.
        _afStbLoad() {
          try {
            const d = JSON.parse(localStorage.getItem(STB_KEY) || 'null');
            STB.rec = (d && typeof d === 'object' && !Array.isArray(d)) ? d : {};
          } catch (_) { STB.rec = {}; }
          STB.loaded = true;
        },
        _afStbMaxAgeMs() { return Math.max(1, Number(this.cfg.afStbHours) || 12) * 3600000; },
        _afStbIs(sym) {
          if (!this.cfg.afStbEnabled) return false;
          if (!STB.loaded) this._afStbLoad();
          const t = STB.rec[sym];
          return typeof t === 'number' && Date.now() - t < this._afStbMaxAgeMs();
        },
        _afStbSave() {
          const cut = Date.now() - this._afStbMaxAgeMs();
          for (const k of Object.keys(STB.rec)) if (!(STB.rec[k] >= cut)) delete STB.rec[k];
          try { localStorage.setItem(STB_KEY, JSON.stringify(STB.rec)); } catch (_) {}
          if (!this._afFollowing()) this._sharedWrite?.('stb', { ...STB.rec });
        },
        _afStbAdopt() {
          if (!this.cfg.afStbEnabled || !this._afFollowing()) return;
          const sh = this._sharedRead?.('stb');
          if (!sh?.data || sh.ts === this._afStbLastTs) return;
          this._afStbLastTs = sh.ts;
          if (!STB.loaded) this._afStbLoad();
          let any = false;
          for (const [k, v] of Object.entries(sh.data)) {
            if (!(v > 0)) continue;
            if (!(STB.rec[k] >= v)) { STB.rec[k] = v; any = true; }
          }
          if (any) try { localStorage.setItem(STB_KEY, JSON.stringify(STB.rec)); } catch (_) {}
        },
        // Called with every freshly fetched hour candle (list = the kline rows, newest first).
        _afStbJudge(sym, start, o, hi, lo, c, list) {
          if (!this.cfg.afStbEnabled || this._afFollowing()) return;
          const vals = [o, hi, lo, c];
          const fr = (list || []).find(r => parseInt(r[0], 10) > start);
          const cur = fr ? parseFloat(fr[4]) : NaN;
          if (cur > 0) vals.push(cur);
          if (vals.some(v => !(v > 0))) return;
          const r = (Math.max(...vals) - Math.min(...vals)) / o * 100;
          if (r < (Number(this.cfg.afStbMinPct) || 0.01) && !this._afStbIs(sym)) {
            if (!STB.loaded) this._afStbLoad();
            STB.rec[sym] = Date.now();
            this._afStbSave();
          }
        },
        // Readout number: tickers graylisted now.
        _afStbStats() {
          if (!STB.loaded) this._afStbLoad();
          const maxAge = this._afStbMaxAgeMs(); let n = 0;
          for (const k of Object.keys(STB.rec)) if (Date.now() - STB.rec[k] < maxAge) n++;
          return { n };
        },

        // Scorecard readout: scored-sample count, graylisted tickers and the liquidation watch.
        _afSampleStatusHtml() {
          const st = this._afSampleStore || { obs: [] };
          const kind = this._afSampleKind();
          const n = this._afObsLive().filter(o => o.k === kind).length;
          let h = `<div>${n} scored sample${n === 1 ? '' : 's'}${this._afFollowing() ? ' · from leader' : ''}</div>`;
          if (this.cfg.afStbEnabled) { const q = this._afStbStats(); h += `<div>${q.n} stablecoin${q.n === 1 ? '' : 's'} graylisted</div>`; }
          if (this.cfg.afIlqEnabled) { const q = this._afIlqStats(); h += `<div>${q.slow} illiquid (&gt;${Number(this.cfg.afIlqSlowSecs) || 12}s) · ${q.n} measured${q.worst ? ' · slowest ' + (q.worst / 1000).toFixed(1) + 's' : ''}</div>`; }
          if (this.cfg.afLiqEnabled) {
            const nl = this._afObsLive().filter(o => o.k === 'l').length, q = Object.keys(st.lgray || {}).length;
            h += `<div>${nl} liquidation sample${nl === 1 ? '' : 's'} · ${LIQ.watch ? LIQ.watch.syms.size + ' watched · ' : ''}${q} quiet ticker${q === 1 ? '' : 's'} graylisted${this._afFollowing() ? ' · from leader' : ''}</div>`;
          }
          return h;
        },
        // ── Instability ────────────────────────────────────────────────────────────────────────────────────────────────────────
        // How MIXED a ticker's liquidations are, compounded across the retained window: its liquidated-short and liquidated-long turnover
        // (every watch's split, kept on the cycle results as lu/ld) are summed over the window, and instability = 1 - |U-D|/(U+D)
        // (0 = one-sided, 1 = evenly mixed). Summing means a ticker that flips between pure-short and pure-long watches compounds
        // into instability too. A ticker needs afInstabMinWatches watches with liquidations before it counts. It is graylisted for ENTRY
        // (not sampling — it stays in the watch, so its record keeps updating) once its instability is afInstabPct % or more above the
        // average of the counted tickers; relative on purpose, so a market where everything is mixed doesn't graylist everything.
        _afInstabStats() {
          const ver = this._afLiqVer || 0;
          const hist = this._afOcCycleHistory || [];
          let maxTs = 0;
          for (const c of hist) if (c && typeof c.ts === 'number' && c.ts > maxTs) maxTs = c.ts;
          const key = hist.length + '|' + maxTs + '|' + (this.cfg.afInstabPct || 0) + '|' + (this.cfg.afInstabMinWatches || 0) + '|' + ver;
          if (this._afInstabMemo && this._afInstabMemo.key === key) return this._afInstabMemo.val;
          const acc = {};
          for (const c of hist) {
            if (!c || !Array.isArray(c.results)) continue;
            for (const r of c.results) {
              if (!r || typeof r.sym !== 'string' || !(r.lu > 0 || r.ld > 0)) continue;
              const a = (acc[r.sym] ||= { u: 0, d: 0, n: 0 });
              a.u += r.lu || 0; a.d += r.ld || 0; a.n++;
            }
          }
          const minW = Math.max(1, Number(this.cfg.afInstabMinWatches) || 2), inst = {};
          let sum = 0, n = 0;
          for (const [sym, a] of Object.entries(acc)) {
            const tot = a.u + a.d;
            if (a.n < minW || !(tot > 0)) continue;
            inst[sym] = 1 - Math.abs(a.u - a.d) / tot;
            sum += inst[sym]; n++;
          }
          const avg = n ? sum / n : null;
          const limit = avg == null ? null : avg * (1 + Math.max(0, Number(this.cfg.afInstabPct) || 0) / 100);
          const gray = new Set();
          if (limit != null) for (const [sym, v] of Object.entries(inst)) if (v >= limit && v > 0) gray.add(sym);
          const val = { inst, avg, limit, gray };
          this._afInstabMemo = { key, val };
          return val;
        },
        _afInstabOn() { return !!(this.cfg.afLiqEnabled && this.cfg.afInstabEnabled && this.cfg.afSampleScoringEnabled); },
        // The check the MIC/MIW pool build uses: the unstable set (works for a follower too — the split rides on the adopted history),
        // plus the legacy time-based graylist (st.gray) for the leader.
        _afGrayHas(sym) {
          if (this._afStbIs(sym)) return true; // Stablecoin Filter
          if (this._afIlqIs(sym)) return true; // Illiquidity Filter: measured slow, reading still live
          if (this._afInstabOn() && this._afInstabStats().gray.has(sym)) return true;
          const c = this.cfg, t = this._afSampleStore?.gray?.[sym];
          return !!t && !!c.afSampleScoringEnabled && !this._afFollowing()
            && Date.now() - t <= (Math.max(1, Number(c.afDistMins) || 240)) * 60000;
        },
        // Liq-view pill presentation, from one watch's split. 'fav' = pure and in the bot's favor, 'mixfav' = mixed, favorable side
        // dominant, 'mixunf' = mixed, unfavorable side dominant (a dead-even split counts here), 'unf' = pure, against the bot,
        // 'quiet' = watched, nothing liquidated. Mixed = the minority side holds more than afMixedPct % of the turnover.
        _afLiqHas(r) { return !!r && (r.lu > 0 || r.ld > 0 || (typeof r.lq === 'number' && r.lq !== 0)); },
        _afLiqPillClass(r) {
          const u = Number(r.lu) || 0, d = Number(r.ld) || 0, tot = u + d;
          const dir = this._afSampleDir();
          if (!(tot > 0)) { // no split recorded: an older watch (lean only) can only say which side led, so it shows as pure
            if (typeof r.lq === 'number' && r.lq !== 0) return { cls: dir * r.lq > 0 ? 'fav' : 'unf', u: null, d: null };
            return { cls: 'quiet', u: 0, d: 0 };
          }
          const lean = (u - d) / tot, minor = Math.min(u, d) / tot;
          const fav = dir * lean > 0;
          const mixed = minor * 100 > (Number(this.cfg.afMixedPct) || 30);
          return { cls: fav ? (mixed ? 'mixfav' : 'fav') : (mixed ? 'mixunf' : 'unf'), u: u / tot, d: d / tot };
        },
        // Following: adopt the leader's published store instead of building our own (the regular scorer's closed-trade
        // records are per-bot, but sample scores are market data — a follower can't fetch/resolve them itself, so it
        // must share the leader's). Deduped on the shared snapshot's ts.
        _afSampleAdopt() {
          if (!this.cfg.afSampleScoringEnabled || !this._afFollowing()) return false;
          const sh = this._sharedRead?.('sampleScore');
          if (!sh?.data || !Array.isArray(sh.data.obs)) return false;
          if (sh.ts && sh.ts === this._afSampleLastSharedTs) return false;
          this._afSampleLastSharedTs = sh.ts;
          this._afSampleStore = { obs: sh.data.obs, ...(sh.data.wx ? { wx: sh.data.wx } : {}) };
          try { localStorage.setItem(SAMPLE_OBS_KEY, JSON.stringify(this._afSampleStore)); } catch (_) {}
          return true;
        },
        // Criterion tags for one sampled ticker, in exactly the annotated-tag format MIC/MIW produce
        // (family + signed tier), so the existing dialInfo/collapseCrit/magnitude logic applies as-is.
        // Mirrors _micAnnotateCritRaw but reads the sample record instead of a live ticker; a family
        // with no data for this record is simply omitted.
        _afSampleTags(r, sym, includeLpa) {
          const tags = [];
          const sgn = n => (n >= 0 ? '+' : '') + n;
          const vol = Number(r.vol), oi = Number(r.oi);
          if (typeof r.fr === 'number' && !isNaN(r.fr)) {
            const tier = Math.trunc(r.fr / this._afSampleStep('fund'));
            tags.push('fund' + (r.fr < 0 ? '-' : '+') + Math.abs(tier));
          }
          const wv = this._afVolIoWindowAvg?.('vol');
          if (vol > 0 && wv > 0) tags.push('va' + sgn(Math.floor((Math.log(vol / wv) * 100) / this._afSampleStep('va'))));
          // IO/L, IO/S: the long / short share of open interest (oi x long share, oi x short share) against that share's window average, same log-tier as V/A. Needs the batch's long/short ratio (bl) and 10+ readings in the window.
          if (oi > 0 && Number(r.bl) > 0 && Number(r.bl) < 1) {
            for (const [fam, long] of [['iol', 1], ['ios', 0]]) {
              const st = this._afWindowStats(long ? 'oil' : 'ois'), v = this._afLsOi(r, long);
              if (st.n >= 10 && v > 0) tags.push(fam + sgn(Math.floor((Math.log(v / (st.sum / st.n)) * 100) / this._afSampleStep(fam))));
            }
          }
          if (typeof r.ht === 'number') {
            const dev = this._afLtaDev(r.ht, r.vol);
            if (dev != null) tags.push('lta' + sgn(Math.floor(dev / this._afSampleStep('lta'))));
          }
          if (includeLpa && typeof r.hc === 'number' && !isNaN(r.hc)) {
            const avg = this._afLpaWindowAvg(sym);
            if (avg != null) tags.push('lpa' + sgn(Math.floor((r.hc - avg) / this._afSampleStep('lpa'))));
          }
          return tags;
        },
        // Called with each new sample-cycle entry: criteria tiers at sample time against the last completed hour's price change (demeaned
        // against the rolling LPA average).
        _afSampleIngest(entry) {
          if (!this.cfg.afSampleScoringEnabled || !entry || !Array.isArray(entry.results)) return;
          if (this._afFollowing()) return; // following — adopt the leader's scored store (_afSampleAdopt) instead of double-counting its batch
          const st = (this._afSampleStore ||= { obs: [] });
          let added = 0;
          for (const r of entry.results) {
            if (!r || typeof r.sym !== 'string' || typeof r.hc !== 'number' || isNaN(r.hc)) continue;
            const avg = this._afLpaWindowAvg(r.sym);
            if (avg == null) continue;
            const tags = this._afSampleTags(r, r.sym, false);
            if (!tags.length) continue;
            st.obs.push({ t: entry.ts, s: r.sym, k: 'n', y: +(r.hc - avg).toFixed(4), r: +Number(r.hc).toFixed(4), c: tags });
            added++;
          }
          if (this._afLiqOn()) added += this._afLiqIngest(entry);
          if (added || this.cfg.afLiqEnabled) this._afSampleSaveSoon();
        },
        // The Sample Scoring build — replaces _afExtremityBuild's closed-trade walk when enabled. Publishes the
        // same outputs: afDialCutoffs/afDialSampleCounts (own cutoffs, from the sample magnitudes), the
        // flat rank map MIC/MIW read, the two-bucket scoreboard, and the per-bucket overall means that
        // decide the favored side.
        _afSampleBuild() {
          const st = this._afSampleStore || { obs: [] };
          const kind = this._afSampleKind();
          const dir = this._afSampleDir();
          const minSamples = Math.max(3, this.cfg.afExtremityMinSamples || 3);
          const splitPct = Math.min(0.49, Math.max(0.01, (this.cfg.afExtremitySplitPct ?? 30) / 100));
          let obs = this._afObsLive().filter(o => o && o.k === kind && Array.isArray(o.c) && typeof o.y === 'number');
          if (kind === 'n') {
            // The hour candle is shared by every cycle inside a clock hour — keep only each ticker's latest
            // observation per hour so one move isn't counted once per scan.
            const latest = new Map();
            for (const o of obs) { const k = o.s + '|' + Math.floor(o.t / 3600000); const p = latest.get(k); if (!p || o.t > p.t) latest.set(k, o); }
            obs = [...latest.values()];
          }
          const parsed = [];
          const pool = {};
          for (const o of obs) {
            const items = [];
            for (const tag of o.c) {
              const info = dialInfo(collapseCrit(tag));
              if (!info || (kind === 'n' && info.family === 'lpa')) continue;
              const m = tag.match(/(-?\d+)$/);
              const mag = m ? Math.abs(parseInt(m[1], 10)) : 0;
              const dk = info.family + '|' + info.pole;
              (pool[dk] ||= []).push(mag);
              items.push({ dk, mag });
            }
            if (items.length) { parsed.push({ edge: dir * o.y, raw: (typeof o.r === 'number' && !isNaN(o.r)) ? dir * o.r : null, items }); }
          }
          // Liquidation Surveillance (toggle): each 'l' observation is scored on its liquidated turnover's lean, in pp (r = lean x the
          // window's typical move, fixed when written), so it counts 1:1 with a price observation. Weighted by liquidated turnover
          // against the median, capped at 3x so one huge ticker can't carry a pole.
          const lparsed = [];
          if (this.cfg.afLiqEnabled) {
            const lobs = this._afObsLive().filter(o => o && o.k === 'l' && Array.isArray(o.c) && typeof o.r === 'number' && !isNaN(o.r));
            const lws = lobs.map(o => o.w).filter(w => w > 0).sort((a, b) => a - b);
            const lmw = lws.length ? lws[Math.floor(lws.length / 2)] : 0;
            for (const o of lobs) {
              const wt = lmw > 0 ? Math.min(3, (o.w > 0 ? o.w : lmw) / lmw) : 1;
              const items = [];
              for (const tag of o.c) {
                const info = dialInfo(collapseCrit(tag));
                if (!info) continue;
                const m = tag.match(/(-?\d+)$/);
                const mag = m ? Math.abs(parseInt(m[1], 10)) : 0;
                const dk = info.family + '|' + info.pole;
                (pool[dk] ||= []).push(mag);
                items.push({ dk, mag });
              }
              if (items.length) lparsed.push({ edge: dir * o.r, wt, items });
            }
          }
          const cutoffs = {};
          for (const [dk, mags] of Object.entries(pool)) {
            if (mags.length < minSamples) { cutoffs[dk] = null; continue; }
            const sorted = [...mags].sort((a, b) => a - b);
            cutoffs[dk] = sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * (1 - splitPct)))];
          }
          const bucket = { extreme: {}, lukewarm: {} };
          const tot = { extreme: { sum: 0, n: 0 }, lukewarm: { sum: 0, n: 0 } };
          const totA = { extreme: { sum: 0, n: 0, p: 0, q: 0 }, lukewarm: { sum: 0, n: 0, p: 0, q: 0 } }; // absolute (raw move in the bot's favor) — only obs that carry a raw move
          for (const p of parsed) for (const { dk, mag } of p.items) {
            const b = (cutoffs[dk] != null && mag >= cutoffs[dk]) ? 'extreme' : 'lukewarm';
            const s = (bucket[b][dk] ||= { sum: 0, n: 0, wins: 0, losses: 0 });
            s.sum += p.edge; s.n++; if (p.edge > 0) s.wins++; else s.losses++;
            tot[b].sum += p.edge; tot[b].n++;
            if (p.raw != null) { totA[b].sum += p.raw; totA[b].n++; if (p.raw > 0) totA[b].p += p.raw; else totA[b].q -= p.raw; }
          }
          // Liquidation observations, bucketed by the same cutoffs. sum/w are turnover-weighted; p/q split the favorable and unfavorable pp.
          const bucketL = { extreme: {}, lukewarm: {} };
          const totL = { extreme: { sum: 0, w: 0, n: 0, p: 0, q: 0 }, lukewarm: { sum: 0, w: 0, n: 0, p: 0, q: 0 } };
          for (const p of lparsed) for (const { dk, mag } of p.items) {
            const b = (cutoffs[dk] != null && mag >= cutoffs[dk]) ? 'extreme' : 'lukewarm';
            const s = (bucketL[b][dk] ||= { sum: 0, w: 0, n: 0, wins: 0, losses: 0 });
            s.sum += p.wt * p.edge; s.w += p.wt; s.n++; if (p.edge > 0) s.wins++; else s.losses++;
            totL[b].sum += p.wt * p.edge; totL[b].w += p.wt; totL[b].n++;
            if (p.edge > 0) totL[b].p += p.wt * p.edge; else totL[b].q -= p.wt * p.edge;
          }
          // A pole is the 50/50 mean of its price edge and its liquidation edge when both have enough samples; whichever has
          // enough stands alone; with neither on its own, the pooled mean once the two together reach the minimum.
          const entryOf = b => dk => {
            const [family, pole] = dk.split('|');
            const ps = bucket[b][dk], ls = bucketL[b][dk];
            const pm = (ps && ps.n >= minSamples) ? ps.sum / ps.n : null;
            const lm = (ls && ls.n >= minSamples && ls.w > 0) ? ls.sum / ls.w : null;
            const n = (ps ? ps.n : 0) + (ls ? ls.n : 0);
            let pnl = 0;
            if (pm != null && lm != null) pnl = (pm + lm) / 2;
            else if (pm != null) pnl = pm;
            else if (lm != null) pnl = lm;
            else if (n >= minSamples) pnl = ((ps ? ps.sum : 0) + (ls && ls.w > 0 ? ls.sum / ls.w * ls.n : 0)) / n;
            return { family, pole, key: dialDisplayKey(family, pole), pnl, wins: (ps ? ps.wins : 0) + (ls ? ls.wins : 0), losses: (ps ? ps.losses : 0) + (ls ? ls.losses : 0), n, hasHist: true, hasTrade: false };
          };
          const keysOf = b => [...new Set([...Object.keys(bucket[b]), ...Object.keys(bucketL[b])])];
          let extreme = keysOf('extreme').map(entryOf('extreme')).sort((a, b) => b.pnl - a.pnl);
          let lukewarm = keysOf('lukewarm').map(entryOf('lukewarm')).sort((a, b) => b.pnl - a.pnl);
          
          const ranks = {}, dispStats = {};
          for (const e of extreme) {
            ranks[e.key] = e.pnl;
            dispStats[e.key] = { pnl: e.pnl, wins: e.wins, losses: e.losses, hasHist: true, hasTrade: false, cutoff: cutoffs[e.family + '|' + e.pole] ?? null, sampleCount: (pool[e.family + '|' + e.pole] || []).length };
          }
          this.afDialCutoffs = cutoffs;
          this.afDialSampleCounts = Object.fromEntries(Object.entries(pool).map(([k, v]) => [k, v.length]));
          this.micCollapsedSlotRanks = ranks;
          this.micCollapsedCritStats = dispStats;
          this.afScoreboard = Object.entries(dispStats).sort(([, a], [, b]) => b.pnl - a.pnl).map(([key, s]) => ({ key, ...s }));
          this.afLukewarmScoreboard = { extreme, lukewarm };
          const mean = t => (t.n ? t.sum / t.n : null);
          // Liquidation joins the price figures 50/50 (once it has the minimum samples in that bucket): the favored-side means, and the
          // headline's raw move (-> the one dollar value) and favorable share (-> the gauge, Target Halving, Negative Headline).
          const mixP = (a, b) => (a != null && b != null) ? (a + b) / 2 : (a ?? b);
          const lMean = t => (t.n >= minSamples && t.w > 0 ? t.sum / t.w : null);
          const mm = b => mixP(mean(tot[b]), lMean(totL[b]));
          // The weather headline (mean raw move AND favorable share) is blended in ONE space: per-observation pp mass, P = mean favorable pp,
          // Q = mean unfavorable pp, per source (price, liquidation). Sources are mixed on P and Q with the same weights as the
          // means, so mean = P - Q and share = (P - Q) / (P + Q) always come out of the same blend and can never differ in sign.
          const pqBase = t => (t.n > 0 ? { P: t.p / t.n, Q: t.q / t.n } : null);
          const pqLiq = t => (t.n >= minSamples && t.w > 0 ? { P: t.p / t.w, Q: t.q / t.w } : null);
          const pqMix = (a, b) => (a && b) ? { P: (a.P + b.P) / 2, Q: (a.Q + b.Q) / 2 } : (a || b);
          const pqOf = b => pqMix(pqBase(totA[b]), pqLiq(totL[b]));
          const aa = b => { const x = pqOf(b); return x ? x.P - x.Q : null; };
          const ss = b => { const x = pqOf(b); return (x && x.P + x.Q > 0) ? (x.P - x.Q) / (x.P + x.Q) : null; };
          this.afSampleBucketMeans = { extreme: mm('extreme'), lukewarm: mm('lukewarm'), nE: tot.extreme.n + totL.extreme.n, nL: tot.lukewarm.n + totL.lukewarm.n, aE: aa('extreme'), aL: aa('lukewarm'), aE0: aa('extreme'), aL0: aa('lukewarm'), nAE: totA.extreme.n + totL.extreme.n, nAL: totA.lukewarm.n + totL.lukewarm.n, sE: ss('extreme'), sL: ss('lukewarm'), sE0: ss('extreme'), sL0: ss('lukewarm'), nlE: totL.extreme.n, nlL: totL.lukewarm.n };
          this._afSampleTrackWx();
        },
        // Peak / bottom of the weather value (favored bucket's mean raw move in the bot's favor, stored in pp of price
        // move so it survives notional/leverage changes; shown in $ via _afSampleWeather's conversion). Recorded only
        // once the side has enough raw-carrying samples (max(min samples, 10)) so a 3-sample fluke can't pin an
        // extreme forever. Lives in the sample store: cleared with the samples, shared leader -> follower.
        _afSampleTrackWx() {
          const m = this.afSampleBucketMeans, st = this._afSampleStore;
          if (!m || !st) return;
          const lw = this._afLukewarmFavoredSide() === 'lukewarm';
          const a = lw ? (m.aL0 ?? m.aL) : (m.aE0 ?? m.aE), n = lw ? m.nAL : m.nAE;
          if (a == null || n < Math.max(10, this.cfg.afExtremityMinSamples || 3)) return;
          const w = st.wx || (st.wx = { hi: null, lo: null, hiT: 0, loT: 0, sHi: null, sLo: null });
          const now = Date.now();
          if (w.hi == null || a > w.hi) { w.hi = a; w.hiT = now; }
          if (w.lo == null || a < w.lo) { w.lo = a; w.loT = now; }
          const sv = lw ? (m.sL0 ?? m.sL) : (m.sE0 ?? m.sE);
          if (sv != null) { if (w.sHi == null || sv > w.sHi) w.sHi = sv; if (w.sLo == null || sv < w.sLo) w.sLo = sv; }
        },
        // Market weather (Sample Scorer headline): the favored bucket's mean ABSOLUTE edge — the raw 1hr move in this
        // bot's favor, not demeaned against the population — converted to dollars on one base position
        // (notional x move%), so it reads as "what an entry here would have made". Scale: +/- the entry TP target in
        // dollars (base margin x TP ROI%), i.e. a mean move large enough to hit TP is full scale. Observations stored
        // before raw moves were recorded carry no raw value and are left out until fresh ones accumulate.
        // `rel` is the old relative (demeaned) edge in pp, kept for the tooltip. `s` / `share` are the relative headline: the
        // favorable share of this side's raw move, P/(P+Q) (share, 0..1, 0.5 = even) and its signed form (P-Q)/(P+Q) (s, -1..+1, same
        // sign as `value`); sHi / sLo are the best / worst s recorded. Target Halving scales off s / sHi.
        _afSampleWeather(side) {
          const m = this.afSampleBucketMeans;
          if (!m) return null;
          const lw = side === 'lukewarm';
          const a = lw ? m.aL : m.aE, n = lw ? m.nAL : m.nAE;
          const tpRoi = Number(this.cfg.binaryModeEnabled ? (this.cfg.binaryTpPct ?? 18) : this.cfg.entryTpRoi) || 18;
          const notional = this.cfg.minNotional || 6;
          const cap = (notional / (this.cfg.leverage || 6)) * tpRoi / 100;
          const min = Math.max(3, this.cfg.afExtremityMinSamples || 3);
          const w = this._afSampleStore?.wx;
          const ok = a != null && n >= min, sv = lw ? m.sL : m.sE;
          return { s: (ok && sv != null) ? sv : null, share: (ok && sv != null) ? (1 + sv) / 2 : null, sHi: w?.sHi ?? null, sLo: w?.sLo ?? null, value: ok ? notional * a / 100 : null, nl: side === 'lukewarm' ? (m.nlL || 0) : (m.nlE || 0), cap, tpRoi, n, rel: m[side], hi: w?.hi != null ? notional * w.hi / 100 : null, lo: w?.lo != null ? notional * w.lo / 100 : null, hiT: w?.hiT || 0, loT: w?.loT || 0 };
        },
        // Threshold a criterion's rank must fall to for Slot Blocking: dollars of base margin for the
        // reactive scorer, percentage points of edge for Sample Scoring. MIC/MIW read this too.
        _afBlockThreshold() {
          const pct = (this.cfg.micSlotBlockPct ?? 25) / 100;
          if (this.cfg.afSampleScoringEnabled) return pct;
          return ((this.cfg.minNotional || 6) / (this.cfg.leverage || 6)) * pct;
        },

        // Which side Lukewarm Scoring currently favors — whichever bucket's total $ (summed
        // across every family in it) is ahead. This is what _afExtremityVeto actually targets:
        // no more manual Lukewarm Targeting toggle, the system re-decides for itself every time
        // _afExtremityBuild runs, off the same scoreboard the panel shows. Ties (including
        // 0 vs 0, before either bucket has real data) default to 'extreme' — the original,
        // always-avoid-lukewarm behavior, until the data actually says otherwise.
        _afLukewarmFavoredSide() {
          const board = this.afLukewarmScoreboard || { extreme: [], lukewarm: [] };
          const sum = arr => arr.reduce((a, s) => a + s.pnl, 0);
          if (this.cfg.afSampleScoringEnabled) {
            // Sample Scoring: compare the buckets' overall MEAN edge (per-observation), not their totals —
            // the extreme bucket is ~25% of readings by construction, so totals would always favor lukewarm.
            const m = this.afSampleBucketMeans, min = Math.max(3, this.cfg.afExtremityMinSamples || 3);
            if (m && m.extreme != null && m.lukewarm != null && m.nE >= min && m.nL >= min) return m.lukewarm > m.extreme ? 'lukewarm' : 'extreme';
            return 'extreme';
          }
          return sum(board.lukewarm) > sum(board.extreme) ? 'lukewarm' : 'extreme';
        },
        // Overall veto — "explicitly avoid any ticker exhibiting values from the LOSING side of
        // Lukewarm Scoring". Counts, across every dial-eligible criterion the ticker actually
        // exhibits, what share classifies as the non-favored side against the current cutoffs;
        // an unproven dial (below afExtremityMinSamples) always counts against the ticker here,
        // same as a genuinely non-favored reading. Vetoes once that share reaches
        // afLukewarmRatioPct (default 70%). Favored side comes from _afLukewarmFavoredSide —
        // see there for how it's decided and how the default (favor extreme) applies before
        // there's enough data either way.
        _afExtremityVeto(annotCrits) {
          const cutoffs = this.afDialCutoffs || {};
          const favorLukewarm = this._afLukewarmFavoredSide() === 'lukewarm';
          let total = 0, against = 0;
          for (const c of (annotCrits || [])) {
            const key = collapseCrit(c);
            const info = dialInfo(key);
            if (!info) continue;
            total++;
            if (!!BARE_DIAL_TAGS[key]) { if (favorLukewarm) against++; continue; } // no gradation — always extreme, so counts against a lukewarm-favoring veto
            const m2 = c.match(/(-?\d+)$/);
            const mag = m2 ? Math.abs(parseInt(m2[1], 10)) : 0;
            const cutoff = cutoffs[info.family + '|' + info.pole];
            const isExtreme = cutoff != null && mag >= cutoff;
            if (favorLukewarm ? isExtreme : !isExtreme) against++;
          }
          if (!total) return false;
          const againstPct = against / total * 100;
          return againstPct >= (this.cfg.afLukewarmRatioPct ?? 70);
        },
        // Extremity Re-Evaluation (secondary toggle, off by default). At the end of every
        // scan, re-derives each open position's own qualifying criteria against the CURRENT
        // dial cutoffs and closes it once it crosses the same lukewarm-ratio bar it had to
        // clear to open in the first place — held to the same standard throughout its life,
        // not just at entry. Deliberately reads only data this cycle already cached (bulk
        // ticker snapshot + MIC's live OC cache) rather than firing fresh fetches of its
        // own, so it rides the existing scan cadence instead of adding load on top of the
        // scan scheduler. A symbol with no fresh-enough cached tick this cycle is skipped
        // rather than forcing a fetch.
        async _afExtremityReEval() {
          if (!this.cfg.afExtremityReEvalEnabled) return;
          const snapshot = [...(this.positions || [])];
          const _closes = []; // closed concurrently below — live closes wait on exchange fills
          for (const pos of snapshot) {
            if (!pos || !pos.symbol) continue;
            const crits = pos._micCriteria || pos._becCriteria || pos._ldcCriteria;
            if (!crits || !crits.length) continue;
            // Reads the rolling average built each scan by _afPositionCriteriaSample.
            const liveCrits = this._afPositionAvgCriteria(pos);
            if (this._afExtremityVeto(liveCrits)) {
              _closes.push((async () => {
                try {
                  await this.pseudoClosePosition(pos, 'Ext-Rvl');
                  this.log(`[ASH] ${pos.symbol} closed — Extremity Re-Evaluation: crossed onto the non-favored side.`, 'info');
                } catch (e) { this.log(`[ASH] Ext-Rvl close error (${pos.symbol}): ${e.message}`, 'warn'); }
              })());
            }
          }
          if (_closes.length) await Promise.all(_closes);
        },
        // cfg.micEnabled is a persisted toggle value — it survives MIC being removed via the
        // Plugin Manager, so it alone can't tell us whether MIC is actually loaded right now.
        // Cross-check against the live plugin list so the MIC scorecard section disappears the
        // moment MIC is unloaded, not just when its own toggle happens to be off.
        _micPluginLoaded() {
          return (this._pluginList || []).some(p => p.id === 'multiindicator-chaser');
        },
        _becPluginLoaded() {
          return (this._pluginList || []).some(p => p.id === 'blindentry-chaser');
        },
        _ldcPluginLoaded() {
          return (this._pluginList || []).some(p => p.id === 'liquiddiver-chaser');
        },
        // Liquid-Diver's OC fetch is single-symbol, triggered per reactive entry — its samples are
        // almost always one bar of 0.0s and drown out a real batch-fetched sample. Only show the
        // chart when a plugin doing proper batch OC sampling (MIC or Blind-Entry) is loaded; if
        // Liquid-Diver is the only OC consumer, hide it rather than let its noise dominate.
        _ocChartViable() {
          return this._micPluginLoaded() || this._becPluginLoaded();
        },
        // Slot Blocking: true once a criterion's collapsed score is a loss beyond the
        // configured % of base margin. Auto-clears the moment the score recovers — no manual
        // reset needed. A lukewarm-classified occurrence never reaches this score at all (see
        // _afExtremityBuild) — blocking only ever reacts to a losing EXTREME, same standard
        // the dial applies everywhere else.
        _afIsCritBlocked(key) {
          if (!this.cfg.micSlotBlockEnabled) return false;
          const ranks = this.micCollapsedSlotRanks || {};
          const threshold  = this._afBlockThreshold();
          if (!this.cfg.micSlotBlockTags) return false;
          const blockable = (this.cfg.micSlotBlockCriteria || []).filter(Boolean);
          if (!blockable.length) return false;
          const esc = v => String(v).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const rx = new RegExp('^(' + blockable.map(esc).join('|') + ')[+-]?$');
          return rx.test(key) && (ranks[key] ?? 0) <= -threshold;
        },
        // Lukewarm Scoring pill UI — two big buckets, Extreme and Lukewarm, each
        // headlined by its aggregate $ record (which side has actually been more
        // profitable overall), with smaller per-criterion pills nested inside showing which
        // of fund/V-A/IO-A/OCS/OCX drove that bucket's result.
        _afExtremityHtml(shown) {
          if (!shown) return '';
          const board = this.afLukewarmScoreboard || { extreme: [], lukewarm: [] };
          if (!board.extreme.length && !board.lukewarm.length) return `<span style="font-size:9px;color:var(--text-lo)">${this.cfg.afSampleScoringEnabled ? 'No scored samples yet.' : 'No Extremity closes recorded yet.'}</span>`;
          // one chart at a time: only the side the bot currently favors is drawn.
          // One row of criterion duos (left bar = '+' end, right bar = '-' end); profit rises
          // above the zero line, loss hangs below it. Sized off the container, never wraps.
          const side = this._afLukewarmFavoredSide();
          const entries = board[side] || [];
          const accent = side === 'lukewarm' ? 'rgba(150,150,160,.45)' : 'rgba(255,150,80,.45)';
          const FAMS = ['fund', 'va', 'iol', 'ios', 'lta', 'lpa'].filter(f => !(this.cfg.afSampleScoringEnabled && !this.cfg.afLiqEnabled && f === 'lpa')); // Sample Scoring never scores LPA (it is the outcome), so its dial stays hidden
          const byKey = {};
          for (const s of entries) byKey[s.key] = s;
          const sm = !!this.cfg.afSampleScoringEnabled;
          const fmt = sm ? (v => (v >= 0 ? '+' : '-') + Math.abs(v).toFixed(2) + 'pp') : (v => (v >= 0 ? '+$' : '-$') + Math.abs(v).toFixed(2));
          const GREEN = 'rgba(100,220,150,.9)', PURPLE = 'rgba(190,130,255,.95)';
          const total = (sm && this.afSampleBucketMeans && this.afSampleBucketMeans[side] != null) ? this.afSampleBucketMeans[side] : entries.reduce((a, s) => a + s.pnl, 0);
          const totalColor = total > 0 ? GREEN : total < 0 ? 'var(--short)' : 'var(--text-lo)';
          const wx = sm ? this._afSampleWeather(side) : null;
          const fmtUsd = v => (v >= 0 ? '+$' : '-$') + Math.abs(v).toFixed(3);
          const headVal = wx ? wx.value : (entries.length ? total : null);
          const headColor = headVal == null ? 'var(--text-lo)' : headVal > 0 ? GREEN : headVal < 0 ? 'var(--short)' : 'var(--text-lo)';
          const headTxt = headVal == null ? '—' : (wx ? (wx.share != null ? (wx.share * 100).toFixed(1) + '%' : '—') : fmt(headVal));
          const headTip = wx ? `Share of this side's raw 1hr move (and, with Liquidation Surveillance, its liquidation lean in pp, mixed 50/50) that went in the bot's favor (50% = even; gauge scaled to the best share recorded)${wx.value != null ? ' · mean ' + fmtUsd(wx.value) + ' on one base position' : ''}. n=${wx.n}${wx.rel != null ? ' · relative edge ' + fmt(wx.rel) : ''}${wx.value == null ? ' · waiting for samples with a raw move' : ''}` : '';
          let gauge = '';
          if (wx) {
            const sc = Math.max(wx.sHi || 0, -(wx.sLo || 0)) || 1, P = v => (((1 + v) / 2) * 100).toFixed(0) + '%';
            const pc = wx.s == null ? 0 : Math.max(-1, Math.min(1, wx.s / sc));
            const gl = pc >= 0 ? 50 : 50 + pc * 50, gw = Math.abs(pc) * 50;
            gauge = `<div title="${headTip}" style="margin-bottom:5px"><div style="position:relative;height:5px;background:rgba(255,255,255,.07);border-radius:3px"><div style="position:absolute;top:0;bottom:0;left:${gl}%;width:${gw}%;background:${headColor};border-radius:3px"></div><div style="position:absolute;top:-1px;bottom:-1px;left:50%;width:1px;background:rgba(255,255,255,.3)"></div></div><div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;color:var(--text-lo);margin-top:2px"><span>${P(-sc)}</span><span>50%</span><span>${P(sc)}</span></div><div title="Highest / lowest favorable share recorded (needs 10+ raw samples on the side). Cleared with the samples." style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;margin-top:3px"><span style="color:var(--short)">bottom ${wx.sLo != null ? P(wx.sLo) : '—'}</span><span style="color:${GREEN}">peak ${wx.sHi != null ? P(wx.sHi) : '—'}</span></div></div>`;
          }
          let maxAbs = 0.01;
          for (const f of FAMS) for (const p of ['+', '-']) maxAbs = Math.max(maxAbs, Math.abs((byKey[f + p] || { pnl: 0 }).pnl));
          const bar = key => {
            const s = byKey[key];
            const v = s ? s.pnl : 0;
            const blocked = this._afIsCritBlocked(key);
            const color = blocked ? PURPLE : v > 0 ? GREEN : v < 0 ? 'var(--short)' : 'var(--text-lo)';
            const h = v === 0 ? 0 : Math.max(3, Math.min(100, Math.abs(v) / maxAbs * 100));
            const tip = s ? (sm ? `${key}  ${fmt(v)} avg edge  ${s.wins}↑ ${s.losses}↓  n=${s.n}` : `${key}  ${fmt(v)}  ${s.wins}W ${s.losses}L`) : `${key}  ${sm ? 'no samples yet' : 'no closes yet'}`;
            const half = (up) => `<div style="flex:1 1 0;min-height:0;display:flex;align-items:${up ? 'flex-end' : 'flex-start'}">`
              + ((up ? v > 0 : v < 0) ? `<div style="width:100%;height:${h}%;background:${color};border-radius:${up ? '2px 2px 0 0' : '0 0 2px 2px'}"></div>` : '')
              + `</div>`;
            return `<div title="${tip}" style="flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column">${half(true)}${half(false)}</div>`;
          };
          const duo = f => `<div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px">`
            + `<div style="display:flex;gap:6%;width:72%;height:clamp(56px,20cqw,120px)">${bar(f + '+')}${bar(f + '-')}</div>`
            + `<div style="font-size:clamp(10px,4cqw,20px);line-height:1">${afCritEmoji(f + '+').replace(/[+\-<>]+$/, '')}</div>`
            + `</div>`;
          return `<div style="width:100%;container-type:inline-size;border:1px solid ${accent};border-radius:8px;padding:6px 8px;background:rgba(255,255,255,.02);box-sizing:border-box">`
            + `<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;font-family:var(--mono)">`
            + `<div style="font-size:8px;letter-spacing:1.5px;color:var(--text-lo)">${side === 'lukewarm' ? 'LUKEWARM' : 'EXTREME'}${sm ? ' · SAMPLES' : ''}</div>`
            + `<div title="${headTip}" style="font-size:11px;color:${headColor}"><b>${headTxt}</b></div>`
            + `</div>`

        // One fresh ticker for one symbol. Stashes the raw payload for this scan (_afFreshTicker) and returns

        async _afFetchFreshTicker(sym) {

        // Only per-ticker fetched records count (vol/oi present), never the bulk list. MIC/MIW rank entry candidates on this.
        _afLatestReadings() {

        // recent-trade OC and the hour candle when wanted. Touches neither afOcResults nor the cycle history — the caller
        // merges the returned oc. A follower reuses the leader's OC when it has it (see _ocFetchSingle).
        async _afFetchCandidate(sym, wantOc, wantHr) {

        // True for a ticker that came from the current batch (own raw payload, or a follower's rebuild stamped with the leader's batch time).

        _afSynthTicker(sym, r) {

            .map(c => ({ ...c, results: c.results.filter(r => r && typeof r.sym === 'string' && (
