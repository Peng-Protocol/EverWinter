<!--
  Ashfall Strategy Plugin for PseudoChaser
  Scoring and cross-bot coordination layer for MultiIndicator-Chaser.

  Extremity Scorer / Lukewarm Scoring: every criterion reading MIC annotates is
  sampled into a rolling pool and sorted, per pole, into extreme vs lukewarm
  against that pole's own observed spread. Closed trades score both a per-pole
  dial (what MIC's blocking and co-qual ranking read) and a two-bucket Extreme vs
  Lukewarm tally; whichever bucket is in higher net profit becomes the side the
  entry veto targets, re-decided on every rebuild rather than toggled by hand.

  Cross bus: cascade/sacrifice triggers, drawdown-halt and gains-lock transitions
  and Gains Continuation steps are broadcast to Permafrost and read back, so the
  two sides can lift each other's halts (Mutual DDH Lift) or halt pre-emptively
  on the partner's winning streak (GC).

  Order Count Surveillance supplies the OC/volume/OI population samples that
  MIC's ocs, ocx, va, ioa, lta and lpa criteria are all measured against (lta/lpa read the
  1hr candle fetched per sampled ticker, see _afHourCandle).

  The scorer is direction-agnostic: it only learns what realized PnL says
  about this installation — the same logic powers Permafrost on PseudoWinter.

  Load via Plugin Manager in PseudoChaser's config panel.
  Load AFTER SunChaser if using live trading — see README Plugin Stack Order.
  targetBot: pseudochaser
-->

ple batch's averages (fund, volume, OI, LTA, LPA) are kept in a longer store (default 300 batches); each slice (default 6 batches) projects the next one, the projection is scored forward like price (1/3 weight, separate setting) and graded as its batches close, and it stands down below the accuracy floor (default 70%); new Period chart view with estimate-vs-actual bars and window/batch accuracy readouts. Change: the Silence bar is replaced by a text readout in the LPA view (batch and window silence; the Silence Amplifier is unchanged) | previous: UI: Score tab decluttered — only the Sample Scoring and Liquidation Surveillance toggles show on open; Silence Amplifier, Instability and all other settings sit behind dropdowns (open state remembered); the Extremity Scorer toggle is gone (always on with Ashfall); defaults now match the active config (Liquidation Surveillance and Silence Amplifier on) | previous: Feature: Silence Amplifier (optional toggle, sub of Sample Scoring) — a noisy ticker's (LPA distance 70% above the window average) price/liquidation outcome is boosted by 25% (headline included); non-liquidation sample batches reserve up to a % (default 100) for re-sampling tickers whose LPA noise is 70% above average (noisiest first, new completed candle only, max 4 re-fetches, then left out until fully out of the window) | previous: Feature: Instability returns — a ticker's liquidated-short and liquidated-long turnover is kept per watch and summed over the window; tickers whose instability (how mixed, 0-100%) sits 30%+ above the window average are skipped for entry (sub-toggle of Liquidation Surveillance, % editable). Liq view: pills only for tickers with liquidation events, drawn favorable = fill+outline, mixed favorable = fill, mixed unfavorable = outline, unfavorable = neither; new 'Window avg liquidation lean' readout above the batch average | previous: Feature: Liquidation Surveillance is back (toggle, off by default): the sample batch's own liquidation feed     afExtremitySampleCap: 300,

    afSampleScoringEnabled: true,  // Sample Scoring — score criteria against sampled tickers' LPA instead of closed-trade PnL
    afDistMins: 240,               // legacy time-based graylist (st.gray) — how long a graylisted ticker stays out of entries

    afMixedPct: 30,                // pill presentation: a watch is 'mixed' when the minority side holds more than this % of its liquidated turnover
    afSilAmpEnabled: true,         // Silence Amplifier (optional, needs Sample Scoring): a noisy ticker's scored outcome (price or liquidation) is boosted by afSilAmpPct %, and noisy tickers are re-sampled first
    afSilAmpPct: 25,              // Silence Amplifier: boost (%) applied to a noisy ticker's outcome (noisy = afResNoisePct % above the window's average distance)
    afPeriodEnabled: false,       // Period Scorer (optional, sub-toggle of Sample Scoring): a forward-looking third dimension — batch averages projected one slice ahead and scored like price
    afPeriodRecords: 300,         // Period Scorer: batch averages kept (the sample window itself only keeps 25 batches)
    afPeriodSlice: 6,             // Period Scorer: batches per slice, and how many batches ahead each forecast looks
    afPeriodWeight: 33,           // Period Scorer: share (%) of a score/headline it carries when live (1/3 paradigm); 0 = no effect
    afPeriodOwnWeight: 50,        // Period Scorer: share (%) of a projection that comes from a criterion's own history; the rest is a blend of the other criteria
    afPeriodMinAcc: 51,           // Period Scorer: accuracy (%) under which it stops contributing (the window as a whole, and each criterion on its own)
    afPeriodTimeEnabled: false,   // Period Scorer, Time Impressions (optional): per-slot memory of how the hour of day / day of week / week of month usually deviates, pulling forecasts toward it
    afPeriodTimeWeight: 50,        // Time Impressions: highest share (%) of a forecast an impression can carry (same for every data type)
    afPeriodTimeDecay: 15,         // Time Impressions: lowest EMA step (%) per observation, so old impressions fade (the week-of-month tier moves 2.5x faster)
    afResPct: 100,                // Re-sampling: up to this % of each (non-liquidation) sample batch is reserved for noisy tickers; 0 = no re-sampling
    afResNoisePct: 70,            // Re-sampling: a ticker is noisy when its LPA distance from the window average is this % above the window's average distance
    afResMax: 4,                  // Re-sampling: max re-fetches per ticker; at the max it is not fetched again until it has fully left the sample window
                 // a liquidation sample counts this much relative to a price sample in a pole's score (no UI)
    afSparsePct: 25,              // sparsity floor: no entry when a candidate's thinnest pole holds under this % of its bucket type's median sample count (no UI)
    afSpongeQuota: 30,

    afOcBatchSize: 50, 
    // Gains Continuation (GC): own rolling 6h PnL, stepped in increments of afGcThresholdPct

    // cross event; if Permafrost also has GC on and reads it within afGcFreshnessMult scan
    // intervals, it triggers a full drawdown halt on Permafrost (and vice versa). On by

    afGcEnabled: true,

    afGcFreshnessMult: 2,
  });
  const ASH_KEY        = '__ashfall_chaser_v1';
  const ASH_OC_HIST_KEY     = '__ash_oc_history';
  const CROSS_KEY      = '__everwinter_cross_v1';
  const CROSS_TTL      = 30 * 24 * 3600 * 1000; // Sized generously (30d) since halt hours are user-set and can run well past 24h — a bot's own
    // ddh-start/glk-start marker aging off the shared bus mid-halt would silently kill Mutual DDH/Gains Lock lift.
    // Own-side DDH lift math doesn't depend on this (see _afDdhStartedAt), but partner-side reads
    // (Gains Lock lift) do, so it must outlast whatever halt length is configured.
  // CROSS_TTL alone doesn't bound this bucket's size — it's a 30d floor sized for the rare
  // long-halt marker, but most event kinds (gc) only need minutes to hours and end
  // up carrying that same 30d tail for no reason. Byte-cap as the actual backstop, same
  // pattern and cap as _trimSharedRegistry in PseudoChaser/PseudoWinter — oldest event first,
  // regardless of kind, so a halt marker can still get evicted early under sustained pressure
  // (TTL is not a floor against eviction, only against premature natural expiry).
  const CROSS_BYTE_CAP = 200 * 1024;
  function _trimCrossEvents(events, maxBytes = CROSS_BYTE_CAP) {
    let json = JSON.stringify({ events });
    let size = new Blob([json]).size;
    if (size <= maxBytes) return events;
    const sorted = events.slice().sort((a, b) => (a.ts || 0) - (b.ts || 0));
    let idx = 0, guard = 0;
    while (size > maxBytes && idx < sorted.length && guard < 25) {
      const avg = size / Math.max(1, sorted.length - idx);
      const excess = size - maxBytes;
      const drop = Math.min(sorted.length - idx, Math.max(1, Math.ceil(excess / avg)));
      idx += drop;
      json = JSON.stringify({ events: sorted.slice(idx) });
      size = new Blob([json]).size;
      guard++;
    }
    return sorted.slice(idx);
  }

  const afCritEmoji = c => {
    if (/^fund/.test(c)) { const s = c.slice(4); const isNeg = s[0] === '-' || s === '<'; return (isNeg ? '🤑' : '💸') + s; }
    if (/^vm/.test(c))   return '🔊' + c.slice(2);
    if (/^va/.test(c))   return '🔊' + c.slice(2);
    if (/^ioa/.test(c))  return '🎲' + c.slice(3);
    // Retired (see VSG.md) — kept resolvable so old scorecard entries still render.
    if (/^lsa/.test(c))  return '🟥' + c.slice(3);
    if (/^lba/.test(c))  return '🟩' + c.slice(3);
    if (/^rasl/.test(c)) return '🔴' + c.slice(4);
    if (/^rabl/.test(c)) return '🟢' + c.slice(4);

    if (/^iot/.test(c))  return '🎲' + c.slice(3);

    if (/^ocs/.test(c))  return '🔭' + c.slice(3);
    if (/^ocx/.test(c))  return '📡' + c.slice(3);
    if (/^lta/.test(c))  return '🕐' + c.slice(3);
    if (/^lpa/.test(c))  return '💹' + c.slice(3);
    // pec+/pec-/vsg+/vsg- and other retired dial tags may still appear in old exports/history
    // — kept resolvable here purely for cosmetic backward-compat display, even though PEC/VSG
    // (and regime, live-liq/0-liq/Past-1, liqturnover/liqquiet) are no longer live criteria.
    if (c === 'pec+') return '⬆️'; if (c === 'pec-') return '⬇️';
    if (c === 'vsg+') return '⏫'; if (c === 'vsg-') return '⏬';
    if (/^pec([a-z]+)/.test(c)) {

    if (c === 'regimeb+') return '🐂';

      return emoji + c.slice(base.length);

    if (c === '+fund') return '💸'; if (c === '-fund') return '🤑';
    if (c === '+ocs') return '🔭+'; if (c === '-ocs') return '🔭-';
    if (c === '0liq') return '⚫';
    if (c === 'liveliq+') return '💥';
    if (c === 'past1') return '⏳';
    if (c === 'liqturnover+') return '🌊';
    if (c === 'liqturnover-') return '🏜️';
    if (c === 'liqquiet+') return '🤫';

  // Collapses a single recorded (tiered) criterion down to its base+sign bucket, e.g.
  // "fund+3" -> "fund+", "ocx+18" -> "ocx+". Used both for scorecard display aggregation
  // and for scorecard storage retention — the sponge quota is meant to cap records per
  // base-criterion combination, not per exact tier value (which is combinatorially large
  // and would barely ever repeat, defeating the quota). Bare '+fund'/'-fund' (Blind-Entry/
  // Liquid-Diver's own tag, never produced by MIC which is always tiered) stay bare so
  // afCritEmoji reads them through its bare-tag branch, not the tiered-fund regex.
  const collapseCrit = c => c.replace(/\d+$/, '');
  const collapseKey = criteria => [...criteria].map(collapseCrit).sort().join(',');

  // ── Extremity Scorer dial families ──
  // Every continuous/tiered criterion already carries its computed depth as a numeric
  // suffix on the annotated tag (e.g. "fund+3" — see MultiIndicator-Chaser's
  // _micOpen/_micAnnotateLiveCrit, which floor that same depth into a tier). The dial
  // reuses that existing magnitude directly rather than needing a separate raw-value log.
  // Two-pole families pit their '+'/'-' side against each other — "which extreme end was
  // more profitable". Criteria universe: fund, V/A, IO/A, LTA, LPA.
  const DIAL_POLES = {
    'fund+': { family: 'fund', pole: 'pos' },       'fund-': { family: 'fund', pole: 'neg' },
    'va+':   { family: 'va',   pole: 'pos' },       'va-':   { family: 'va',   pole: 'neg' },
    'ioa+':  { family: 'ioa',  pole: 'pos' },       'ioa-':  { family: 'ioa',  pole: 'neg' },
    // LTA/LPA — 1hr turnover vs own 24h/24, and 1hr price change vs the population's.
    'lta+':  { family: 'lta',  pole: 'pos' },       'lta-':  { family: 'lta',  pole: 'neg' },
    'lpa+':  { family: 'lpa',  pole: 'pos' },       'lpa-':  { family: 'lpa',  pole: 'neg' },
  };
  const BARE_DIAL_TAGS = {
    '+fund': { family: 'fund', pole: 'pos' }, '-fund': { family: 'fund', pole: 'neg' },
    '+ocs':  { family: 'ocs',  pole: 'pos' }, '-ocs':  { family: 'ocs',  pole: 'neg' },
  };
  const dialInfo = key => DIAL_POLES[key] || BARE_DIAL_TAGS[key] || null;
  // Every remaining family's display key already matches its own tag string.
  const dialDisplayKey = (family, pole) => family + (pole === 'pos' ? '+' : '-');
  const SAMPLE_STATE_KEY = '__ew_sample_state_v1'; // cross-bot sample sharing

  // ── Per-data-type storage cap ──
  // Each distinct data type (liq history, OC history, scorecard, ...) is capped
  // independently at TYPE_BYTE_CAP bytes, trimming its own oldest entries when it alone
  // exceeds budget. Deliberately atomized rather than one blanket cap on the whole plugin
  // blob, so an oversized data type can't force pruning of unrelated data that's still
  // well within budget.
  const TYPE_BYTE_CAP = 200 * 1024;
  function trimToByteCap(arr, maxBytes = TYPE_BYTE_CAP) {
    // Assumes arr is ordered oldest-first (push-appended). Converges in a handful of
    // iterations by estimating how many records to drop from the size overshoot, rather
    // than shifting one at a time and re-stringifying the whole array each try.
    if (!Array.isArray(arr) || arr.length < 2) return arr;
    let out = arr;
    let size = new Blob([JSON.stringify(out)]).size;
    let guard = 0;
    while (size > maxBytes && out.length > 1 && guard < 25) {
      const avg = size / out.length;
      const excess = size - maxBytes;
      const drop = Math.min(out.length - 1, Math.max(1, Math.ceil(excess / avg)));
      out = out.slice(drop);
      size = new Blob([JSON.stringify(out)]).size;
      guard++;
    }
    return out;
  }

                </label>
                <div x-show="cfg.afGcEnabled" style="margin-top:8px">
                  <div class="g">
                    <div class="lbl">Step Size <b x-text="cfg.afGcThresholdPct+'%'"></b> of base margin</div>
                    <input type="range" min="10" max="200" step="5" x-model.number="cfg.afGcThresholdPct" @change="persist()">
                    <span style="font-size:9px;color:var(--text-lo);margin-left:6px" x-text="'($'+(cfg.minNotional/cfg.leverage*(cfg.afGcThresholdPct/100)).toFixed(2)+' per step)'"></span>
                  </div>
                  <div class="g" style="margin-top:6px">
                    <div class="lbl">Freshness Window <b x-text="(Math.max(1,cfg.scanMins??10)*cfg.afGcFreshnessMult)+'min'"></b> <span style="color:var(--text-lo);font-weight:400" x-text="'('+cfg.afGcFreshnessMult+'× Scan Every)'"></span></div>
                    <input type="range" min="1" max="6" step="1" x-model.number="cfg.afGcFreshnessMult" @change="persist()">
                  </div>
                </div>
              </div>
              <div x-show="cfg.ashfallCrossEnabled && afCrossEvents.length" style="margin-top:6px;border:1px solid rgba(255,255,255,.08);border-radius:3px;background:rgba(255,255,255,.02);overflow:hidden">
                <div style="font-family:var(--mono);font-size:8px;letter-spacing:1.5px;color:var(--text-lo);padding:4px 8px;border-bottom:1px solid rgba(255,255,255,.06)">PARTNER FEED</div>
                <div x-html="_afCrossFeedHtml()" style="padding:2px 8px 4px;max-height:114px;overflow-y:auto"></div>
              </div>
            </div>
<div class="ash-zone" x-show="tS" x-data="{ sc:(()=>{ let s={}; try{ s=JSON.parse(localStorage.getItem('__ash_score_ui')||'{}')||{}; }catch(_){} return Object.assign({sample:false,liq:false,set:false}, s); })(), flip(k){ this.sc[k]=!this.sc[k]; try{ localStorage.setItem('__ash_score_ui', JSON.stringify(this.sc)); }catch(_){} } }">
              <div style="display:flex;align-items:flex-start;gap:6px">
                <label class="tog" style="flex:1">
                  <div class="tog-t" :class="cfg.afSampleScoringEnabled?'on':''" @click.prevent="if(!cfgLocked){cfg.afSampleScoringEnabled=!cfg.afSampleScoringEnabled;_afExtremityBuild();persist()}"><div class="tog-k"></div></div>
                  <div>
                    <div class="tog-l">Sample Scoring</div>
                    <div class="ash-hint">Scores criteria by how the sampled tickers actually moved (LPA) instead of closed-trade PnL. Same Extreme/Lukewarm buckets and veto.</div>
                    <div class="ash-hint" x-show="cfg.afSampleScoringEnabled && !sc.sample" x-text="'Silence Amplifier '+(cfg.afSilAmpEnabled?cfg.afSilAmpPct+'%':'off')+(cfg.afPeriodEnabled?' · Period '+_afPeriodShort():'')"></div>

                </label>
                <button x-show="cfg.afSampleScoringEnabled" @click="flip('sample')" style="font-family:var(--mono);font-size:9px;padding:2px 7px;border:1px solid rgba(255,255,255,.15);border-radius:2px;background:none;color:var(--text-lo);cursor:pointer" x-text="sc.sample?'▾':'▸'"></button>
              </div>
              <div x-show="cfg.afSampleScoringEnabled && sc.sample" x-transition.opacity style="margin:6px 0 0 6px;padding-left:8px;border-left:1px solid rgba(255,255,255,.08)">
                <label class="tog" x-data="{h:false}">
                  <div class="tog-t" :class="cfg.afSilAmpEnabled?'on':''" @click.prevent="if(!cfgLocked){cfg.afSilAmpEnabled=!cfg.afSilAmpEnabled;_afExtremityBuild();persist()}"><div class="tog-k"></div></div>
                  <div>
                    <div class="tog-l">Silence Amplifier <span class="ash-i" @click.prevent.stop="h=!h">ⓘ</span></div>
                    <div class="ash-hint" x-show="h">Noisier tickers' scores count for more, and noisy tickers are re-sampled first.</div>

                </label>
                <div style="margin-top:6px" x-show="cfg.afSilAmpEnabled">
                  <div class="lbl">Boost for noisy tickers (%)</div>
                  <input type="number" min="0" max="500" step="5" x-model.number="cfg.afSilAmpPct" :disabled="cfgLocked" @change="_afExtremityBuild();persist()" style="width:70px;font-family:var(--mono);font-size:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:3px;color:var(--text-hi);padding:2px 6px">
                  <div class="lbl" style="margin-top:6px">Batch reserved for re-sampling (%)</div>
                  <input type="number" min="0" max="100" step="5" x-model.number="cfg.afResPct" :disabled="cfgLocked" @change="persist()" style="width:70px;font-family:var(--mono);font-size:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:3px;color:var(--text-hi);padding:2px 6px">
                  <div class="lbl" style="margin-top:6px">Noisy when above average by (%)</div>
                  <input type="number" min="0" max="500" step="5" x-model.number="cfg.afResNoisePct" :disabled="cfgLocked" @change="persist()" style="width:70px;font-family:var(--mono);font-size:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:3px;color:var(--text-hi);padding:2px 6px">
                  <div class="lbl" style="margin-top:6px">Max re-fetches per ticker</div>
                  <input type="number" min="0" max="50" step="1" x-model.number="cfg.afResMax" :disabled="cfgLocked" @change="persist()" style="width:70px;font-family:var(--mono);font-size:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:3px;color:var(--text-hi);padding:2px 6px">
                </div>
                <label class="tog" style="margin-top:8px" x-data="{h:false}">
                  <div class="tog-t" :class="cfg.afPeriodEnabled?'on':''" @click.prevent="if(!cfgLocked){cfg.afPeriodEnabled=!cfg.afPeriodEnabled;if(!cfg.afPeriodEnabled&&_afOcViewMode==='per')_afOcViewMode='vol';_afPeriodToggle()}"><div class="tog-k"></div></div>
                  <div>
                    <div class="tog-l">Period Scorer <span class="ash-i" @click.prevent.stop="h=!h">ⓘ</span></div>
                    <div class="ash-hint" x-show="h">Projects the next slice from stored batch averages and scores it forward as a third dimension. Stands down under the accuracy floor, as a whole and per criterion.</div>
                    <div class="ash-hint" x-show="cfg.afPeriodEnabled" x-text="_afPeriodHint()"></div>
                  </div>
                </label>
                <div style="margin-top:6px" x-show="cfg.afPeriodEnabled">
                  <div class="lbl">Records kept (batches)</div>
                  <input type="number" min="30" max="1000" step="10" x-model.number="cfg.afPeriodRecords" :disabled="cfgLocked" @change="_afPeriodCfgChanged()" style="width:70px;font-family:var(--mono);font-size:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:3px;color:var(--text-hi);padding:2px 6px">
                  <div class="lbl" style="margin-top:6px">Slice (batches)</div>
                  <input type="number" min="2" max="24" step="1" x-model.number="cfg.afPeriodSlice" :disabled="cfgLocked" @change="_afPeriodCfgChanged()" style="width:70px;font-family:var(--mono);font-size:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:3px;color:var(--text-hi);padding:2px 6px">
                  <div class="lbl" style="margin-top:6px">Weight (%)</div>
                  <input type="number" min="0" max="90" step="1" x-model.number="cfg.afPeriodWeight" :disabled="cfgLocked" @change="_afExtremityBuild();persist()" style="width:70px;font-family:var(--mono);font-size:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:3px;color:var(--text-hi);padding:2px 6px">
                  <div class="lbl" style="margin-top:6px">Min accuracy (%, window and per criterion)</div>
                  <input type="number" min="0" max="100" step="5" x-model.number="cfg.afPeriodMinAcc" :disabled="cfgLocked" @change="_afExtremityBuild();persist()" style="width:70px;font-family:var(--mono);font-size:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:3px;color:var(--text-hi);padding:2px 6px">
                  <div class="lbl" style="margin-top:6px">Own-history share (%)</div>
                  <input type="number" min="0" max="100" step="5" x-model.number="cfg.afPeriodOwnWeight" :disabled="cfgLocked" @change="persist()" style="width:70px;font-family:var(--mono);font-size:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:3px;color:var(--text-hi);padding:2px 6px">
                  <label class="tog" style="margin-top:8px" x-data="{h:false}">
                    <div class="tog-t" :class="cfg.afPeriodTimeEnabled?'on':''" @click.prevent="if(!cfgLocked){cfg.afPeriodTimeEnabled=!cfg.afPeriodTimeEnabled;_afPeriodTimeToggle()}"><div class="tog-k"></div></div>
                    <div>
                      <div class="tog-l">Time Impressions <span class="ash-i" @click.prevent.stop="h=!h">ⓘ</span></div>
                      <div class="ash-hint" x-show="h">Nudges forecasts by how each hour, weekday and week of the month (UTC) usually deviates.</div>
                      <div class="ash-hint" x-show="cfg.afPeriodTimeEnabled" x-text="_afPeriodTimeHint()"></div>

                    <div class="lbl">Impression weight cap (%)</div>
                    <input type="number" min="0" max="90" step="5" x-model.number="cfg.afPeriodTimeWeight" :disabled="cfgLocked" @change="persist()" style="width:70px;font-family:var(--mono);font-size:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:3px;color:var(--text-hi);padding:2px 6px">
                    <div class="lbl" style="margin-top:6px">Impression decay (% per observation)</div>
                    <input type="number" min="2" max="90" step="1" x-model.number="cfg.afPeriodTimeDecay" :disabled="cfgLocked" @change="persist()" style="width:70px;font-family:var(--mono);font-size:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:3px;color:var(--text-hi);padding:2px 6px">
                  </div>
                </div>
              </div>

              <div style="display:flex;align-items:flex-start;gap:6px;margin-top:8px" x-show="cfg.afSampleScoringEnabled">

                  <div class="tog-t" :class="cfg.afLiqEnabled?'on':''" @click.prevent="if(!cfgLocked){cfg.afLiqEnabled=!cfg.afLiqEnabled;_afLiqToggle()}"><div class="tog-k"></div></div>
                  <div>
                    <div class="tog-l">Liquidation Surveillance</div>
                    <div class="ash-hint">Watches the batch's liquidation feed (WS only) and scores it 50/50 with price. Liquidated tickers stay in; quiet ones are graylisted.</div>
                    <div class="ash-hint" x-show="cfg.afLiqEnabled && !sc.liq" x-text="'Instability Graylist '+(cfg.afInstabEnabled?cfg.afInstabPct+'%':'off')"></div>
                  </div>
                </label>
                <button x-show="cfg.afLiqEnabled" @click="flip('liq')" style="font-family:var(--mono);font-size:9px;padding:2px 7px;border:1px solid rgba(255,255,255,.15);border-radius:2px;background:none;color:var(--text-lo);cursor:pointer" x-text="sc.liq?'▾':'▸'"></button>
              </div>
              <div x-show="cfg.afSampleScoringEnabled && cfg.afLiqEnabled && sc.liq" x-transition.opacity style="margin:6px 0 0 6px;padding-left:8px;border-left:1px solid rgba(255,255,255,.08)">
                <label class="tog" x-data="{h:false}">
                  <div class="tog-t" :class="cfg.afInstabEnabled?'on':''" @click.prevent="if(!cfgLocked){cfg.afInstabEnabled=!cfg.afInstabEnabled;persist()}"><div class="tog-k"></div></div>
                  <div>
                    <div class="tog-l">Instability Graylist <span class="ash-i" @click.prevent.stop="h=!h">ⓘ</span></div>
                    <div class="ash-hint" x-show="h">Skips tickers for entry whose liquidations are too mixed (long and short) across the window.</div>
                  </div>
                </label>
                <div style="margin-top:6px" x-show="cfg.afInstabEnabled">
                  <div class="lbl">Skip above average by (%)</div>
                  <input type="number" min="0" max="500" step="5" x-model.number="cfg.afInstabPct" :disabled="cfgLocked" @change="persist()" style="width:70px;font-family:var(--mono);font-size:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:3px;color:var(--text-hi);padding:2px 6px">
                  <div class="lbl" style="margin-top:6px">Mixed when minority side exceeds (%)</div>
                  <input type="number" min="1" max="49" step="1" x-model.number="cfg.afMixedPct" :disabled="cfgLocked" @change="persist()" style="width:70px;font-family:var(--mono);font-size:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:3px;color:var(--text-hi);padding:2px 6px">
                </div>
              </div>

              <div style="margin-top:10px;border-top:1px solid rgba(255,255,255,.06);padding-top:8px">
                <button @click="flip('set')" style="font-family:var(--mono);font-size:9px;padding:2px 8px;border:1px solid rgba(255,255,255,.15);border-radius:2px;background:none;color:var(--text-lo);cursor:pointer;letter-spacing:.5px;display:flex;align-items:center;gap:4px"><span x-text="sc.set?'▾':'▸'"></span>&nbsp;Scorer Settings</button>
                <div class="ash-hint" x-show="!sc.set" x-text="'Split '+cfg.afExtremitySplitPct+'% · Veto '+cfg.afLukewarmRatioPct+'% · Batch '+cfg.afOcBatchSize"></div>
                <div x-show="sc.set" x-transition.opacity style="margin-top:8px">
                  <div class="g" x-data="{h:false}">
                    <div class="lbl">Extreme Split <b x-text="cfg.afExtremitySplitPct"></b>% <span class="ash-i" @click="h=!h">ⓘ</span></div>

                  <div class="g" style="margin-top:8px" x-data="{h:false}">

                    <input type="range" min="30" max="100" step="5" x-model.number="cfg.afLukewarmRatioPct" @change="persist()">
                    <div class="ash-hint" x-show="h">Vetoes a ticker once this share of its criteria land on whichever side (Extreme/Lukewarm) is earning less.</div>
                  </div>
                  <label class="tog" style="margin-top:8px" x-data="{h:false}">

                    <div>
                      <div class="tog-l">Extremity Re-Evaluation <span class="ash-i" @click.prevent.stop="h=!h">ⓘ</span></div>

                        <option value="off">Off — split evenly</option>

    transform(def) {
      const _origInit  = def.init;
      const _origPers  = def.persist;
      const _origScan  = def.runScan;
      const _origClose = def.pseudoClosePosition;

      let _afWasHalted               = false;
      let _afWasGainsLocked          = false;

      const _hostStages = Array.isArray(def._scanStageDefs); // host has the cooperative scan scheduler
      return Object.assign({}, def, {

        _afDdhStartedAt: null, // Date.now() of this bot's own current DDH halt, set once at the
                               // moment it starts and cleared on lift. Local + persisted, so Mutual
                               // DDH Lift's age comparison never depends on reading our own ddh-start
                               // note back off the shared cross bus, which can age out of CROSS_TTL
                               // mid-halt on any halt longer than the TTL window.
        afScoreboard: [],   // sorted Extremity Scorer entries built from EXTREMITY_KEY records
        afLukewarmScoreboard: { extreme: [], lukewarm: [] }, // Lukewarm Scoring two-bucket display — see _afExtremityBuild
        afScorecardExpanded: null,     // key of currently expanded dial, or null
        afDialCutoffs: {},             // {[family|pole]: magnitude} — the live "extreme begins here" line per dial
        // Rolling pool of raw criterion readings — every annotation call (scan-time pool
        // building, live liq messages, Extremity Re-Evaluation) feeds it via _afDialSample,
        // regardless of whether that reading ever becomes a candidate or a trade. This — NOT
        // closed-trade records — is what afDialCutoffs is computed from. Persists across
        // restarts via DIAL_POOL_KEY (init() loads it explicitly — see there for why the
        // lazy `||=` pattern used elsewhere can't do this on its own, since this declared
        // default is already truthy).
        afDialSamplePool: {},          // {[family|pole]: number[]}
        afDialSampleCounts: {},        // {[family|pole]: n} — for the "unproven, still lukewarm by default" badge
        afSampleBucketMeans: null, // Sample Scoring: overall mean edge per bucket, decides the favored side
        _afSampleStore: { obs: [] },
        _afPeriod: { recs: [], fc: null, grades: [] }, // Period Scorer store (see _afPeriodLoad)
        _afPeriodSel: null, // Period chart: the clicked batch ('forecastTs|k') the summary breaks down
        afCrossEvents: [],
        // Gains Continuation (GC) — own rolling 6h closed-trade PnL log, independent of the
        // host's Gains Lock window (that one only populates when cfg.gainsLockEnabled is on;
        // GC needs to work regardless). _afGcLastStep is the highest step index already
        // broadcast (high-water-mark — never re-fires a step already crossed); resets to 0 once
        // rolling PnL drops back to ≤0 so a fresh climb re-arms from the first step. _afGcLastSeenTs
        // is the ts of the latest partner 'gc' event already reacted to (fresh or stale), so the
        // 15s loop doesn't re-evaluate the same event every tick.
        afGcWindow:      [],
        _afGcLastStep:   0,
        _afGcLastSeenTs: 0,
        _afOcCycleHistory: [], // rolling per-cycle snapshots: {id, ts, results:[{sym,bc,sc,avgMs,n}]}
        _afOcCycleCounter: 0,
        afOcResults: {},       // {[sym]:{bc,sc,avgMs,n}} from the most recent OC fetch batch
        _ocFetchRunning: false, // guards against overlapping _ocFetchBatch calls
        // Fixed Y-axis overlay HTML/positions for the OC chart, set as a side effect of
        // _afOcChartSvg(). Must be pre-declared (not just assigned later inside that method) —
        // an x-html/x-text binding that reads a property before Alpine has ever seen it
        // declared throws a ReferenceError during the initial bind.
        _afOcYAxisHtml: '',
        _afOcAvgYPx: null,
        _afOcHighlightedCycleTs: null, // ts of a clicked cycle in the ORDER INTERVAL SAMPLE chart; null = follow latest
        _afOcViewMode: 'vol', // 'vol' | 'io' | 'fund' | 'lta' | 'lpa' — which sample the tethered chart/summary/chips display
        afOcPillsOpen: false,    // sample results chart: per-batch ticker pills shown?
        afPerOpen: false,        // period chart: criteria table shown?
        _afOcExpandedSym: null, // OC chip tapped open to its full values (hover title covers desktop; touch has no hover)

        async init() {
          await _origInit.call(this);
          this.cfg.afExtremityEnabled = true; // Extremity Scorer is always on with Ashfall (toggle removed)
          // Sync to the actual restored halt/gains-lock state instead of leaving these at their
          // false initial value. Without this, reloading the tab mid-halt made the very next
          // tick see a false→true "transition" that never really happened, rewriting the
          // cross-event start timestamp to "now" — which silently made an already-old halt look
          // freshly started, breaking the Mutual DDH Lift age comparison below (it picks the
          // *older* halt to lift, so an inflated timestamp can flip which side loses the halt).
          _afWasHalted      = this._isDrawdownHalted?.() ?? false;
          _afWasGainsLocked = this._isGainsLocked?.()    ?? false;
          // Restored early (ahead of the main ASH_KEY blob load further down) because the
          // mid-halt backfill immediately below needs it to decide whether a value already
          // exists before falling back to a back-calculated guess.
          try {
            const _afEarly = JSON.parse(localStorage.getItem(ASH_KEY) || 'null');
            if (_afEarly && typeof _afEarly.ddhStartedAt === 'number') this._afDdhStartedAt = _afEarly.ddhStartedAt;
          } catch(_) {}
          // The sync above deliberately skips writing a ddh-start/glk-start cross event on a
          // mid-halt reload (see comment above) to avoid an inflated "now" timestamp — but that
          // means a bot whose tab restarts mid-halt (backgrounded/killed on mobile, manual
          // refresh, etc.) never broadcasts *any* ddh-start for that halt, so Mutual DDH Lift can
          // never react to it no matter how long the halt runs or what the partner does — this
          // is the actual cause of a same-halt lift silently never firing, not CROSS_TTL. Backfill
          // one here if the bus doesn't already show us as actively halted, using the halt's real
          // start time (back-calculated from the restored _drawdownHaltUntil) rather than "now" —
          // that preserves the age comparison Mutual DDH Lift depends on instead of trading a
          // missing marker for a too-recent one.
          if ((this.cfg.ashfallCrossEnabled ?? true)) {
            if (_afWasHalted && !this._manualHalt && typeof this._drawdownHaltUntil === 'number') {
              const _ownDdh = this._afCrossRead().filter(e => e.source === 'chaser' && (e.kind === 'ddh-start' || e.kind === 'ddh-end')).at(-1);
              if (!_ownDdh || _ownDdh.kind === 'ddh-end') {
                const _haltMs = (this.cfg.drawdownHaltHours ?? 6) * 3600 * 1000;
                this._afCrossWrite('ddh-start', null, { ts: this._drawdownHaltUntil - _haltMs });
              }
              // _afDdhStartedAt is normally restored from the persisted blob above (set the moment
              // the halt began, on whichever earlier session actually triggered it). This only
              // fires as a one-time migration fallback — upgrading mid-halt, or a persisted value
              // that somehow never got written — using the same back-calculation as the cross-bus
              // backfill above. Imperfect if the halt wasn't started via drawdownHaltHours (e.g. the
              // host's own native throttle running a different duration), but only ever needed once;
              // every halt-start going forward stamps this directly at the moment it happens.
              if (this._afDdhStartedAt == null) {
                const _haltMs = (this.cfg.drawdownHaltHours ?? 6) * 3600 * 1000;
                this._afDdhStartedAt = this._drawdownHaltUntil - _haltMs;
              }
            }
            if (_afWasGainsLocked && typeof this._gainsLockHaltUntil === 'number') {
              const _ownGlk = this._afCrossRead().filter(e => e.source === 'chaser' && (e.kind === 'glk-start' || e.kind === 'glk-end')).at(-1);
              if (!_ownGlk || _ownGlk.kind === 'glk-end') {
                const _lockMs = (this.cfg.gainsLockHours ?? 6) * 3600 * 1000;
                this._afCrossWrite('glk-start', null, { ts: this._gainsLockHaltUntil - _lockMs });
              }
            }
          }
          if (!Array.isArray(this.cfg.megacapExclude)) this.cfg.megacapExclude = [...DEFAULT_MEGACAP_EXCLUDE];
          // Single source of truth for all other Ashfall scalar defaults — see
          // ASHFALL_DEFAULT_CFG above. Call sites read this.cfg.<key> directly with no inline
          // fallback, since this guarantees every key below is present after init runs once.
          for (const [k, v] of Object.entries(ASHFALL_DEFAULT_CFG)) {
            if (this.cfg[k] === undefined) this.cfg[k] = v;
          }
          try {
            const _ocHist = JSON.parse(localStorage.getItem(ASH_OC_HIST_KEY) || 'null');
            if (Array.isArray(_ocHist) && _ocHist.length) {
              const { cleaned: _cleaned, purged: _purged } = this._ocSanitizeHistory(_ocHist);
              this._afOcCycleHistory = _cleaned;
              if (_purged > 0) {
                this.log(`[ASH] 🧹 Purged ${_purged} legacy OC record(s) from stored history (pre-redesign raw-count schema).`, 'info');
                this._ocPersistHistory();
              }
              // Latest cycle by timestamp, not array position — a slower concurrent fetch
              // finishing after a newer one has already pushed would otherwise leave a stale
              // batch sitting last in the array.
              const _last = this._afOcCycleHistory.reduce((a,c) => (!a || c.ts > a.ts) ? c : a, null);
              if (_last?.results) for (const r of _last.results) { if (r && typeof r.sym === 'string') this.afOcResults[r.sym] = { bc: r.bc, sc: r.sc, avgMs: r.avgMs, n: r.n }; }
              this._afOcCycleCounter = Math.max(this._afOcCycleCounter, _last?.id || 0);
            }
          } catch(_) {}
          // Explicit load, not the lazy `||=` _afDialSample/_afExtremityBuild otherwise use —
          // afDialSamplePool's own reactive declaration above starts it at `{}`, which is
          // already truthy, so `this.afDialSamplePool ||= this._afLoadDialPool()` never actually
          // ran the load; every restart silently kept the freshly-declared empty pool instead of
          // the persisted one, forcing every dial's cutoff to reprove itself from scratch. Load
          // for real here, before the first _afExtremityBuild() call below.
          this.afDialSamplePool = this._afLoadDialPool();
          this._afSampleLoad();
          this._afPeriodLoad();
          this._afScoreTrim();
          this._afExtremityBuild();
          try {
            const raw = localStorage.getItem(ASH_KEY);
            if (raw) {
              const s = JSON.parse(raw);
              // GC window is re-filtered to the live 6h cutoff on load, same as the host's own
              // gainsWindow restore — a stale entry surviving a long-offline reload shouldn't
              // count toward a step it wouldn't have reached had the tab stayed open.
              if (Array.isArray(s.gcWindow)) this.afGcWindow = s.gcWindow.filter(e => e?.ts && (Date.now() - e.ts) < 6 * 3600 * 1000);
              if (typeof s.gcLastStep === 'number') this._afGcLastStep = s.gcLastStep;
            }
          } catch(e) {}
          this.log(`[ASH] Ashfall (Chaser) v${VERSION} loaded — ${this.cfg.ashfallEnabled ? 'enabled' : 'disabled'}`, 'info');
          setInterval(() => {
            if (this.cfg.ashfallCrossEnabled) this._afCheckCross().catch(() => {});
            // _afExtremityBuild() is NOT called on THIS setInterval timer (it runs every few
            // seconds, purely for cross-plugin housekeeping) — it's called once per runScan
            // cycle instead (see runScan), which is frequent enough to track the sample pool
            // filling in without redoing the full sort/rebuild on every single interval tick.
            if (this.cfg.ashfallCrossEnabled) {
              const _halted  = this._isDrawdownHalted?.() ?? false;
              const _glocked = this._isGainsLocked?.()    ?? false;
              if (_halted !== _afWasHalted) {
                _afWasHalted = _halted;
                this._afDdhStartedAt = _halted ? Date.now() : null;
                this.persist();
                this._afCrossWrite(_halted ? 'ddh-start' : 'ddh-end');
              }
              if (_glocked !== _afWasGainsLocked) {
                _afWasGainsLocked = _glocked;
                this._afCrossWrite(_glocked ? 'glk-start' : 'glk-end');
              }
              if (this.cfg.ashfallMutualDdLiftEnabled && _halted) {
                // Self side reads _afDdhStartedAt (local, persisted, never expires) instead of
                // reading our own ddh-start note back off the shared cross bus — that note is
                // still written below for the partner's benefit, but it ages out of CROSS_TTL on
                // any halt longer than the TTL, which used to silently strand this comparison
                // with nothing to compare against for the rest of a long halt. Partner side still
                // reads the bus, since that's the only visibility we have into their state.
                const _partnerDdh = this._afCrossRead().filter(e => e.source === 'winter' && (e.kind === 'ddh-start' || e.kind === 'ddh-end')).at(-1);
                if (_partnerDdh?.kind === 'ddh-start' && this._afDdhStartedAt != null) {
                  if (this._afDdhStartedAt < _partnerDdh.ts) {
                    this._drawdownHaltUntil = null;
                    this._haltLoggedKind = null;
                    this._afDdhStartedAt = null;
                    this.persist();
                    this.log('[ASH] ♨ Mutual DDH lift — own halt is older; cleared.', 'info');
                  }
                }
              }
              // Gains Continuation (GC) receive side — requires this bot to also have GC on
              // (own toggle doubles as the opt-in to react to the partner's broadcast, same
              // convention as Mutual DDH Lift). Freshness window mirrors the codebase's
              // established partner-staleness pattern (2× scan cadence = 1 missed-cycle grace),
              // just user-configurable here via afGcFreshnessMult instead of hardcoded 2×.
              // Dedupes on event ts via _afGcLastSeenTs so a still-fresh event isn't re-actioned
              // every 15s tick, and a since-gone-stale one isn't re-checked forever either.
              if (this.cfg.afGcEnabled) {
                const _gcEvt = this._afCrossRead().filter(e => e.source === 'winter' && e.kind === 'gc').at(-1);
                if (_gcEvt && _gcEvt.ts !== this._afGcLastSeenTs) {
                  this._afGcLastSeenTs = _gcEvt.ts;
                  const _gcFreshMs = Math.max(1, this.cfg.scanMins ?? 10) * (this.cfg.afGcFreshnessMult ?? 2) * 60 * 1000;
                  if ((Date.now() - _gcEvt.ts) < _gcFreshMs) {
                    this._drawdownHaltUntil = Date.now() + (this.cfg.drawdownHaltHours ?? 6) * 3600 * 1000;
                    this._haltLoggedKind = null;
                    this.persist();
                    this.log(`[ASH] 🚨 Gains Continuation — fresh broadcast from Permafrost (step ${_gcEvt.step ?? '?'}, +${(_gcEvt.pnl ?? 0).toFixed(2)} USDT 6hr) — full drawdown halt triggered.`, 'warn');
                  }
                }
              }
            }
          }, 15000);
        },

        persist() {
          _origPers.call(this);
          try {
            this.afGcWindow   = trimToByteCap(this.afGcWindow);
            localStorage.setItem(ASH_KEY, JSON.stringify({
              gcWindow: this.afGcWindow, gcLastStep: this._afGcLastStep,
              ddhStartedAt: this._afDdhStartedAt,
            }));
          } catch(e) {}
        },

        _afScoreRead() {
          try {
            if (localStorage.getItem(EXTREMITY_KEY) === null) {
              // One-time migration off the old shared key — see the comment on
              // LEGACY_SHARED_EXTREMITY_KEY above. Runs once: after this, EXTREMITY_KEY
              // exists (even as '[]') so this branch never fires again.
              try {
                const legacyRaw = localStorage.getItem(LEGACY_SHARED_EXTREMITY_KEY);
                const legacy = legacyRaw ? JSON.parse(legacyRaw) : [];
                const mine = Array.isArray(legacy) ? legacy.filter(r => r.source === 'chaser') : [];
                localStorage.setItem(EXTREMITY_KEY, JSON.stringify(mine));
              } catch(_) { localStorage.setItem(EXTREMITY_KEY, '[]'); }
            }
            const raw = localStorage.getItem(EXTREMITY_KEY);
            if (!raw) return [];
            const cut = Date.now() - SCORE_SAFETY_TTL;
            return (JSON.parse(raw) || []).filter(r => r.ts >= cut && Array.isArray(r.criteria) && r.criteria.length);
          } catch(e) { return []; }
        },
        _afScoreTrim() {
          try {
            const records   = this._afScoreRead();
            const quota     = this.cfg.afSpongeQuota;
            const staleDays = this.cfg.afStaleSlotDays;
            const staleMs   = staleDays * 24 * 3600 * 1000;
            const now       = Date.now();
            // +fund/-fund are NOT legacy — Blind-Entry and Liquid-Diver actively write them as
            // their primary criteria tags. Only the genuinely dead pre-tiered criteria purge here.
            const LEGACY    = new Set(['>10pct','<10pct','lsa','lba','rasl','rabl']);
            const isLegacy  = r => r.criteria.some(c => LEGACY.has(c));
            const bySlot = {};
            for (const r of records) {
              if (isLegacy(r)) continue;
              const k = collapseKey(r.criteria);
              if (!bySlot[k]) bySlot[k] = [];
              bySlot[k].push(r);
            }
            const trimmed = [];
            for (const recs of Object.values(bySlot)) {
              recs.sort((a, b) => b.ts - a.ts);
              const kept = recs.slice(0, quota);
              if (!kept.length) continue;
              if (now - kept[0].ts < staleMs) trimmed.push(...kept);
            }
            const GLOBAL_CAP = 5000;
            const capped = trimmed.sort((a, b) => b.ts - a.ts).slice(0, GLOBAL_CAP);
            // Per-slot quota + GLOBAL_CAP bound the record *count*, but with enough
            // distinct auto-generated slot buckets the total byte size can still run
            // large — apply the same atomized byte cap as a final safety net, oldest first.
            const byteCapped = trimToByteCap([...capped].reverse()).reverse();
            localStorage.setItem(EXTREMITY_KEY, JSON.stringify(byteCapped));
          } catch(e) {}
        },
        _afScoreWrite(criteria, pnl, hist = false, drift = null) {
          try {
            const records = this._afScoreRead();
            const rec = { ts: Date.now(), criteria, pnl, source: 'chaser' };
            if (hist) rec.hist = true;
            // Per-criterion drift measured at close (see _afCloseDrift) — raw, not shares, so the
            // credit mode can be flipped later and re-score history. null = unmeasurable.
            if (Array.isArray(drift) && drift.length === criteria.length) rec.d = drift.map(x => (typeof x === 'number' && isFinite(x)) ? Math.round(x * 1000) / 1000 : null);
            records.push(rec);
            const quota = this.cfg.afSpongeQuota;
            const bySlot = {};
            for (const r of records) {
              const k = collapseKey(r.criteria);
              if (!bySlot[k]) bySlot[k] = [];
              bySlot[k].push(r);
            }
            const trimmed = [];
            for (const recs of Object.values(bySlot)) {
              recs.sort((a, b) => b.ts - a.ts);
              trimmed.push(...recs.slice(0, quota));
            }
            const byteCapped = trimToByteCap([...trimmed].reverse()).reverse();
            localStorage.setItem(EXTREMITY_KEY, JSON.stringify(byteCapped));
            return byteCapped;
          } catch(e) { return null; }
        },
        // Feeds the Extremity Scorer's cutoff computation. Called from every criterion
        // annotation — scan-time pool building, live liq messages, Extremity Re-Evaluation —
        // NOT gated behind a close or even an actual entry. This is deliberate: a dial's
        // cutoff needs to be provable from the wide stream of what the market is actually
        // showing right now, not from the narrow trickle of closed trades. Sampling only from
        // closes would deadlock at cold start — nothing opens until a dial is proven, and a
        // dial can only prove itself from closes that require something to have opened first.
        _afDialSample(tag) {
          if (!tag) return;
          const info = dialInfo(collapseCrit(tag));
          if (!info) return;
          const m = tag.match(/(-?\d+)$/);
          if (!m) return; // bare Blind-Entry/Liquid-Diver tags (+fund/-fund/+ocs/-ocs) carry no
                           // magnitude — they always classify extreme regardless (see
                           // _afExtremityBuild/_afExtremityVeto), nothing to prove here.
          const dk = info.family + '|' + info.pole;
          const pool = (this.afDialSamplePool ||= this._afLoadDialPool());
          const arr = (pool[dk] ||= []);
          arr.push(Math.abs(parseInt(m[1], 10)));
          const cap = this.cfg.afExtremitySampleCap || 300;
          if (arr.length > cap) arr.splice(0, arr.length - cap);
          this._afSaveDialPool();
        },
        // afDialSamplePool persists (DIAL_POOL_KEY) so a restart doesn't reset every dial to
        // "unproven". Loaded lazily (first _afDialSample/_afExtremityBuild call each
        // session) rather than at some fixed init point, and saved with a light throttle since
        // _afDialSample fires on every live annotation, not just closes.
        _afLoadDialPool() {
          try {
            const raw = localStorage.getItem(DIAL_POOL_KEY);
            return raw ? JSON.parse(raw) : {};
          } catch (e) { return {}; }
        },
        _afSaveDialPool() {
          const now = Date.now();
          if (now - (this._afDialPoolLastWrite || 0) < 3000) return;
          this._afDialPoolLastWrite = now;
          try { localStorage.setItem(DIAL_POOL_KEY, JSON.stringify(this.afDialSamplePool || {})); } catch (e) {}
        },
        // ── Open-Position Rolling-Average Criteria ─────────────────
        //
        // Replaces the single entry-time snapshot (_micCriteria/_becCriteria/_ldcCriteria,
        // frozen once in *Open) as the source feeding close-time scoring, Extremity
        // Re-Evaluation, and substitution's live score. No separate sample list and no new
        // poller/timer — this rides the existing scan cycle: called once per open position
        // per scan from MIC/MIW's runScan (_afPositionCriteriaSample), exempt from the
        // follower no-own-fetch rule since it only ever touches the handful of symbols
        // currently open, not the full ticker universe (same loophole _micTopUpGeneralCriteria
        // already uses for ocs/ocx via _ocFetchSingle's allowOwnFetch flag).
        //
        // A position's locked criteria FAMILIES never change after entry — that's what
        // defines its slot. Only the observed magnitude/tier of each is re-sampled, into a
        // calendar-time window (default 24h) kept on the position itself.
        POS_CRIT_WINDOW_MS: 24 * 3600 * 1000,
        async _afPositionCriteriaSample(pos) {
          if (!this.cfg.afPosRollingAvgEnabled) return; // toggle off: no per-scan fetch, frozen snapshot only
          const crits = pos._micCriteria || pos._becCriteria || pos._ldcCriteria;
          if (!crits?.length) return;
          // Own fresh single-ticker fetch, not this._lastAllTickers — that bulk snapshot is
          // cached for cfg.bulkTickerCooldownHours (default 1h, user-configurable up to 12h)
          // and reused across many scans in between, so fund/va/ioa read off it would mostly
          // resample the exact same stale number instead of tracking real drift. Still routed
          // through _qFetch (rate/concurrency limited) — just not gated behind the follower
          // no-own-fetch rule, same exemption as the ocs/ocx fetch below.
          let t = null;
          try {
            const r = await this._qFetch(`${this.base}/v5/market/tickers?category=linear&symbol=${pos.symbol}`);
            const d = await r.json();
            t = d?.retCode === 0 ? d.result?.list?.[0] : null;
          } catch(e) {}
          if (!t) return;
          const now = Date.now();
          const buf = (pos._afCritSamples ||= {});
          for (const tag of crits) {
            const family = tag.replace(/[+-]?\d+$/, ''); // bare family, e.g. "fund", "va", "ocs"
            if (/^(lta|lpa)/.test(family)) { try { await this._afHourCandle(pos.symbol); } catch(e) {} }
            const fresh = this._micAnnotateCritRaw?.(family, t);
            if (!fresh) continue;
            const m = fresh.match(/(-?\d+)$/);
            if (!m) continue;
            const arr = (buf[family] ||= []);
            arr.push({ tier: parseInt(m[1], 10), ts: now });
            const cut = now - (this.POS_CRIT_WINDOW_MS || 24 * 3600 * 1000);
            while (arr.length && arr[0].ts < cut) arr.shift();
          }
        },
        // Reconstructs a position's criteria as averaged tags, in the same family+tier
        // string format every other tag already uses (e.g. "fund+3"). Falls back to the
        // frozen entry-time snapshot for any family with fewer than afExtremityMinSamples
        // readings — a position that closes fast simply hasn't had enough scans to average.
        _afPositionAvgCriteria(pos) {
          const crits = pos._micCriteria || pos._becCriteria || pos._ldcCriteria;
          if (!crits?.length) return crits;
          if (!this.cfg.afPosRollingAvgEnabled) return crits; // toggle off: entry-time snapshot
          const minSamples = Math.max(3, this.cfg.afExtremityMinSamples || 3);
          const buf = pos._afCritSamples || {};
          return crits.map(tag => {
            const family = tag.replace(/[+-]?\d+$/, '');
            const arr = buf[family];
            if (!arr || arr.length < minSamples) return tag; // fallback: frozen snapshot
            const avgTier = Math.round(arr.reduce((s, r) => s + r.tier, 0) / arr.length);
            return `${family}${avgTier >= 0 ? '+' : ''}${avgTier}`;
          });
        },
        // ── Drift Credit ────────────────────────────────────────────────
        // TENTATIVE — this whole mechanism is a first attempt and may well be wrong or need
        // redoing. THE PROBLEM: a closed position's PnL used to be credited IN FULL to every
        // criterion it carried, so a +$0.02 close with 4 criteria put +$0.08 on the scorecard
        // (and the Extreme-vs-Lukewarm totals the veto compares were inflated by criteria
        // count, not by anything real). THE ATTEMPT: split the one PnL across the criteria so
        // the shares sum to exactly the PnL. Shares come from DRIFT — at close we re-read
        // each criterion's live value and measure how far it moved from its entry-time tier,
        // normalised by that family's typical magnitude in the dial sample pool (raw tier
        // units aren't comparable between fund/va/ocs/lta...). Current rule (mode 'least'):
        // the criterion that drifted LEAST gets the MOST credit — its condition still held
        // over the trade's life, so it's treated as most culpable for the outcome — and the
        // one that drifted most gets the least. Mode 'most' flips that (untested hunch that it
        // may be the reverse). Nothing here is settled: the drift measure, the 1/(1+d) curve,
        // and the assumption that "held steady" == "responsible" are all open questions.
        // Each closed record stores its raw drift array (`d`), NOT final shares, so flipping
        // the mode re-scores all history instantly with no re-fetch. Records with no `d`
        // (pre-1.87.0, or drift fetch failed/timed out) fall back to an even split.
        async _afSettleCloseScore(pos, scoreCrits, pnl) {
          let drift = null;
          const mode = this.cfg.afDriftCreditMode;
          if ((mode === 'least' || mode === 'most') && scoreCrits.length > 1) {
            // Hard timeout so a stuck fetch can't leave the close unscored — falls back to an even split.
            try { drift = await Promise.race([this._afCloseDrift(pos), new Promise(res => setTimeout(() => res(null), 15000))]); } catch(_) {}
            if (!Array.isArray(drift) || drift.length !== scoreCrits.length) drift = null;
          }
          this._afExtremityBuild(this._afScoreWrite(scoreCrits, pnl, false, drift));
        },
        // Re-reads every entry criterion for this position's symbol and returns, per criterion
        // (same order as the entry snapshot), |closeTier - entryTier| / familyScale — or null
        // where it can't be measured (bare Blind-Entry/Liquid-Diver tags, missing data, fetch
        // failure). Compares against the frozen ENTRY snapshot, not the rolling average.
        async _afCloseDrift(pos) {
          const entry = pos._micCriteria || pos._becCriteria || pos._ldcCriteria;
          if (!entry?.length || !pos.symbol) return null;
          let t = null;
          try {
            const r = await this._qFetch(`${this.base}/v5/market/tickers?category=linear&symbol=${pos.symbol}`);
            const d = await r.json();
            t = d?.retCode === 0 ? d.result?.list?.[0] : null;
          } catch(_) {}
          if (!t) return null;
          const fams = entry.map(tag => tag.replace(/[+-]?\d+$/, ''));
          if (fams.some(f => /^(lta|lpa)/.test(f))) { try { await this._afHourCandle(pos.symbol); } catch(_) {} }
          return entry.map((tag, i) => {
            const m0 = tag.match(/(-?\d+)$/);
            const fresh = this._micAnnotateCritRaw?.(fams[i], t);
            const m1 = typeof fresh === 'string' ? fresh.match(/(-?\d+)$/) : null;
            if (!m0 || !m1) return null;
            const a = parseInt(m0[1], 10), b = parseInt(m1[1], 10);
            return Math.abs(b - a) / this._afDriftScale(fams[i], a);
          });
        },
        // Typical tier magnitude for a family (mean over both poles of the dial sample pool),
        // so a 3-tier move on a family that normally spans ~30 tiers reads as small drift and
        // on one that spans ~4 as large. Falls back to the entry tier itself while the pool is thin.
        _afDriftScale(family, entryTier) {
          const pool = this.afDialSamplePool || {};
          const mags = [...(pool[family + '|pos'] || []), ...(pool[family + '|neg'] || [])];
          const floor = Math.max(3, this.cfg.afExtremityMinSamples || 3);
          if (mags.length >= floor) {
            const mean = mags.reduce((a, b) => a + b, 0) / mags.length;
            if (mean >= 1) return mean;
          }
          return Math.max(1, Math.abs(entryTier));
        },
        // Drift array -> shares summing to 1. Unmeasurable entries (null) get the mean weight of
        // the measured ones; nothing measurable / mode 'off' / legacy record -> even split.
        //   'least': w = 1/(1+d)        — steadiest criterion is most culpable (current default)
        //   'most':  w = d/(1+d) + .05  — the flipped reading; .05 keeps zero-drift from zeroing out
        _afCreditShares(dArr) {
          const n = dArr.length;
          const even = () => dArr.map(() => 1 / n);
          const mode = this.cfg.afDriftCreditMode;
          if (mode !== 'least' && mode !== 'most') return even();
          const ok = x => typeof x === 'number' && isFinite(x) && x >= 0;
          const known = dArr.filter(ok);
          if (!known.length) return even();
          const f = mode === 'most' ? (d => d / (1 + d) + 0.05) : (d => 1 / (1 + d));
          const raw = dArr.map(x => ok(x) ? f(x) : null);
          const fill = raw.filter(x => x != null).reduce((a, b) => a + b, 0) / known.length;
          const vals = raw.map(x => x ?? fill);
          const sum = vals.reduce((a, b) => a + b, 0);
          return vals.map(v => v / sum);
        },
        // ── Extremity Scorer / Lukewarm Scoring core build.
        //
        // Cutoffs are computed FIRST, from afDialSamplePool (the observation stream — see
        // _afDialSample above), independent of closed-trade records entirely: for each dial
        // pole with >= afExtremityMinSamples readings, the cutoff is the magnitude at the
        // configured split percentile of that pole's OWN observed spread — "organically
        // arrange them into highs and lows" per the user's own framing. A pole below the
        // sample floor has no proven cutoff and stays lukewarm by default (never credited,
        // never blocking) until it clears the floor — which, sampling from live readings
        // rather than closes, usually happens within the first scan or two, not never.
        //
        // Records are then walked ONCE. Extreme occurrences score into that pole's
        // win/loss/pnl exactly as before — this is what MIC's blocking/co-qual reads via
        // micCollapsedSlotRanks, unchanged in shape. Lukewarm Scoring adds a second,
        // parallel tally alongside it: EVERY occurrence (extreme or lukewarm) also lands in
        // afLukewarmScoreboard under its classification bucket and family — "which side
        // (Extreme vs Lukewarm) has been more profitable overall, and which criteria within
        // that side actually drove it" — purely a display/advisory layer, never read by
        // blocking or the veto.
        //
        // Bare Blind-Entry/Liquid-Diver tags always classify extreme — there's nothing to
        // be lukewarm about.
        _afExtremityBuild(records) {
          if (this.cfg.afSampleScoringEnabled) { try { return this._afSampleBuild(); } catch (e) { console.warn('[ASH] Sample Scoring build failed', e); } }
          records = records || this._afScoreRead();
          const exclude = new Set(this.cfg.micAutoSlotExclude || []);
          const quota = this.cfg.afSpongeQuota;
          const minSamples = Math.max(3, this.cfg.afExtremityMinSamples || 3);
          const splitPct = Math.min(0.49, Math.max(0.01, (this.cfg.afExtremitySplitPct ?? 30) / 100));
          const sortedRecords = [...records].sort((a, b) => b.ts - a.ts).filter(r => r.source === 'chaser');
          // Scorecards fully separated per side — Ashfall's Extremity
          // Scorer only ever aggregates its own closed trades. No cross-bot reading, no
          // sign flipping, no shared bias/pool needed: partner-sourced records in
          // EXTREMITY_KEY (if any linger from before this change) are filtered out above
          // and never reach dialStats/bucketStats/ranks below.

          const samplePool = (this.afDialSamplePool ||= this._afLoadDialPool());
          const cutoffs = {};
          for (const [dk, mags] of Object.entries(samplePool)) {
            if (mags.length < minSamples) { cutoffs[dk] = null; continue; }
            const sorted = [...mags].sort((a, b) => a - b);
            const idx = Math.min(sorted.length - 1, Math.floor(sorted.length * (1 - splitPct)));
            cutoffs[dk] = sorted[idx];
          }

          const dialStats = {};
          const dialCount = {};
          const subtagStats = {};
          const bucketStats = { extreme: {}, lukewarm: {} };
          const bucketCount = { extreme: {}, lukewarm: {} };
          for (const r of sortedRecords) {
            const keptIdx = [];
            for (let i = 0; i < r.criteria.length; i++) if (!exclude.size || !exclude.has(r.criteria[i])) keptIdx.push(i);
            if (!keptIdx.length) continue;
            const pnl = typeof r.pnl === 'number' ? r.pnl : (r.win ? 1 : -1);
            // Drift Credit (TENTATIVE — see _afCreditShares): each criterion gets a SHARE of the
            // position's PnL, shares summing to 1 across the criteria that survive the exclude
            // filter, instead of the whole PnL apiece. Own-only records (see sortedRecords filter above).
            const shares = this._afCreditShares(keptIdx.map(i => Array.isArray(r.d) ? r.d[i] : null));
            for (let ki = 0; ki < keptIdx.length; ki++) {
              const c = r.criteria[keptIdx[ki]];
              const effectivePnl = pnl * shares[ki];
              const key = collapseCrit(c);
              const info = dialInfo(key);
              if (!info) continue; // unrecognized/retired tag — no dial, not scored
              const noGradation = !!BARE_DIAL_TAGS[key];
              let mag = Infinity;
              if (!noGradation) {
                const m2 = c.match(/(-?\d+)$/);
                mag = m2 ? Math.abs(parseInt(m2[1], 10)) : 0;
              }
              const pole = info.pole;
              const dk = info.family + '|' + pole;
              const cutoff = cutoffs[dk];
              const isExtreme = !Number.isFinite(mag) || (cutoff != null && mag >= cutoff);

              // Lukewarm Scoring: every occurrence lands here, extreme or not. Keyed by dk
              // (family+pole), not family alone — a two-pole family's '+' and '-' sides are
              // opposite signals and must not be netted into one pill.
              const bucket = isExtreme ? 'extreme' : 'lukewarm';
              const bCount = bucketCount[bucket];
              if ((bCount[dk] = (bCount[dk] ?? 0) + 1) <= quota) {
                const bStats = bucketStats[bucket];
                if (!bStats[dk]) bStats[dk] = { pnl: 0, wins: 0, losses: 0 };
                const bs = bStats[dk];
                bs.pnl += effectivePnl; if (effectivePnl > 0) bs.wins++; else bs.losses++;
              }

              if (!isExtreme) continue; // lukewarm — not scored into the blocking-facing dial below

              if ((dialCount[dk] = (dialCount[dk] ?? 0) + 1) > quota) continue;
              if (!dialStats[dk]) dialStats[dk] = { pnl: 0, wins: 0, losses: 0, hasHist: false, hasTrade: false };
              const stats = dialStats[dk];
              stats.pnl += effectivePnl; if (effectivePnl > 0) stats.wins++; else stats.losses++;
              if (r.hist) stats.hasHist = true; else stats.hasTrade = true;
              const subtagKey = key;
              if (!subtagStats[subtagKey]) subtagStats[subtagKey] = { pnl: 0, wins: 0, losses: 0 };
              const ts = subtagStats[subtagKey];
              ts.pnl += effectivePnl; if (effectivePnl > 0) ts.wins++; else ts.losses++;
            }
          }
