          if (mode === 'liq' && this._afInstabOn()) {
            const ib = this._afInstabStats(), g = withField.filter(r => ib.gray.has(r.sym)).length;
            extra = ` · ${ib.gray.size} unstable${g ? ' (' + g + ' here)' : ''}${ib.avg != null ? ' · avg inst ' + Math.round(ib.avg * 100) + '%' : ''}`;
          }
          return `${withField.length} ticker${withField.length===1?'':'s'} sampled${this._afOcDisplayedCycleLabel()}${extra}`;
        },
        // Full-window population average for MIC's va/ioa criteria — same dedup-to-latest-per-
        // symbol pattern as _afOcWindowAvgMs, over the same tethered _afOcCycleHistory, just
        // averaging 'vol' or 'oi' instead of 'avgMs'.
        _afVolIoWindowAvg(field) {
          const st = this._afWindowStats(field);
          return st.n ? st.sum / st.n : null;
        },
        // One deduped read of the retained sample window: each ticker's LATEST reading only,
        // summed and counted. field: 'vol' | 'oi' | 'lta' | 'lpa'. V/A, IO/A, LPA and the
        // chart's "Total avg" readout all come from this, so the number on screen is exactly
        // the one the criteria measure against. Memoized per history state (scoring calls this
        // once per candidate per criterion).
        _afWindowStats(field) {
          const hist = this._afOcCycleHistory || [];
          let maxTs = 0;
          for (const c of hist) if (c && typeof c.ts === 'number' && c.ts > maxTs) maxTs = c.ts;
          const key = hist.length + '|' + maxTs;
          const memo = WIN_MEMO[field];
          if (field !== 'liq' && memo && memo.key === key) return memo.val;
          const val = field === 'liq' ? (r => (this._afLiqHas(r) && typeof r.lq === 'number' && !isNaN(r.lq)) ? r.lq : null) // events only: a watched-but-quiet ticker (lq 0, no turnover) is not a reading
                    : field === 'lta' ? (r => this._afLtaDev(r.ht, r.vol))
                    : field === 'lpa' ? (r => (typeof r.hc === 'number' && !isNaN(r.hc)) ? r.hc : null)
                    : (r => r[field]);
          const bySym = {};
          for (const cycle of hist) {
            if (!cycle || !Array.isArray(cycle.results)) continue;
            for (const r of cycle.results) {
              if (!r || typeof r.sym !== 'string') continue;
              const v = val(r);
              if (v == null) continue;
              if (!bySym[r.sym] || cycle.ts > bySym[r.sym].ts) bySym[r.sym] = { v, ts: cycle.ts };
            }
          }
          const vals = {}; let sum = 0, n = 0;
          for (const [sym, o] of Object.entries(bySym)) { vals[sym] = o.v; sum += o.v; n++; }
          const out = { sum, n, vals };
          WIN_MEMO[field] = { key, val: out };
          return out;
        },
        // LTA: 1hr turnover against the ticker's own hourly average (24h turnover / 24), as a
        // % deviation — above its own average is positive, below is negative.
        _afLtaDev(ht, vol24) {
          if (typeof ht !== 'number' || isNaN(ht)) return null;
          const v = parseFloat(vol24);
          if (!(v > 0)) return null;
          const hourly = v / 24;
          return (ht - hourly) / hourly * 100;
        },
        // LPA baseline: mean 1hr price change % of every OTHER ticker in the window (latest
        // reading each), so a ticker is never measured against itself.
        _afLpaWindowAvg(excludeSym) {
          const st = this._afWindowStats('lpa');
          const own = excludeSym != null ? st.vals[excludeSym] : undefined;
          const n = st.n - (own != null ? 1 : 0);
          if (n <= 0) return null;
          return (st.sum - (own ?? 0)) / n;
        },
        // Start (ms) of the last COMPLETED hourly candle. The forming candle is never used —
        // its turnover is a partial hour and would skew LTA negative early in each hour.
        _afHourStart() { return Math.floor(Date.now() / 3600000) * 3600000 - 3600000; },
        // One kline request per ticker per hour: the completed candle can't change, so a hit
        // for the current hour is reused for every later scan (and by the open-position sampler).
        async _afHourCandle(sym) {
          const start = this._afHourStart();
          const hit = HOUR_CACHE[sym];
          if (hit && hit.start === start) return hit;
          try {
            const res = await this._qFetch(`${this.base}/v5/market/kline?category=linear&symbol=${sym}&interval=60&limit=3`);
            const js  = await res.json();
            // Bybit list rows: [start, open, high, low, close, volume, turnover], newest first.
            const row = (js?.result?.list || []).find(r => parseInt(r[0], 10) === start);
            if (!row) return null;
            const o = parseFloat(row[1]), c = parseFloat(row[4]), ht = parseFloat(row[6]);
            if (!(o > 0) || isNaN(c) || isNaN(ht)) return null;
            const rec = { start, ht, hc: (c - o) / o * 100 };
            if (Object.keys(HOUR_CACHE).length > 500) for (const k of Object.keys(HOUR_CACHE)) if (HOUR_CACHE[k].start !== start) delete HOUR_CACHE[k];
            HOUR_CACHE[sym] = rec;
            return rec;
          } catch (_) { return null; }
        },
        // Best available 1hr reading for a ticker: this hour's cached candle, else whatever the
        // latest sample batch carried (what a follower gets from the leader's shared snapshot).
        _afHourReading(sym) {
          const hit = HOUR_CACHE[sym];
          if (hit && hit.start === this._afHourStart()) return { ht: hit.ht, hc: hit.hc };
          const r = this.afOcResults?.[sym];
          if (r && typeof r.ht === 'number' && typeof r.hc === 'number') return { ht: r.ht, hc: r.hc };
          return null;
        },
        // Widened counterpart to _afHourReading, for scan-time LTA/LPA matching only — never
        // for the top-up fetch gate (_micTopUpGeneralCriteria), which must stay strict-fresh
        // so the pre-entry refetch still fires. Falls back to this symbol's latest reading
        // anywhere in the retained _afOcCycleHistory window when nothing fresh (this hour's
        // cache or the latest batch) exists yet, so a not-yet-resampled-this-hour ticker can
        // still be scored on stale-but-real data instead of being treated as having none.
        _afHourReadingWide(sym) {
          const fresh = this._afHourReading(sym);
          if (fresh) return fresh;
          let latest = null, latestTs = -Infinity;
          for (const cycle of (this._afOcCycleHistory || [])) {
            if (!cycle || !Array.isArray(cycle.results)) continue;
            const r = cycle.results.find(x => x && x.sym === sym && typeof x.ht === 'number' && typeof x.hc === 'number');
            if (r && cycle.ts > latestTs) { latest = { ht: r.ht, hc: r.hc }; latestTs = cycle.ts; }
          }
          return latest;
        },





        _afOcAvgValueText(shown) {
          if (!shown) return null;
          const mode = this._afOcViewMode || 'vol';
          if (mode === 'per') return this._afPeriodBatchText();
          const mc = this._afOcModeCfg();
          const last = this._afOcDisplayedCycle();
          const withField = (last?.results || []).filter(r => r && mc.getVal(r) != null && (mode !== 'liq' || this._afLiqHas(r)));
          if (!withField.length) return null;
          const avg = withField.reduce((s,r) => s + mc.getVal(r), 0) / withField.length;
          return `Batch ${mc.avgLabel.toLowerCase()}: ${mc.fmt(avg)}`;
        },



        _afOcTotalAvgText(shown) {
          if (!shown) return null;
          const mode = this._afOcViewMode || 'vol';
          if (mode === 'per') return this._afPeriodWindowText();
          const mc = this._afOcModeCfg();
          const st = this._afWindowStats(mode === 'io' ? 'oi' : mode === 'fund' ? 'fr' : mode);
          if (mode === 'liq') return st.n ? `Window avg liquidation lean: ${mc.fmt(st.sum / st.n)} · ${st.n} ticker${st.n === 1 ? '' : 's'} with liquidations (window)` : 'Window avg liquidation lean: no liquidation events in the window';
          if (!st.n) return null;
          return `Total ${mc.avgLabel.toLowerCase()}: ${mc.fmt(st.sum / st.n)} · ${st.n} ticker${st.n === 1 ? '' : 's'} (window)`;
        },
        _afOcInfoHtml(shown) {
          if (!shown) return '';
          const mode = this._afOcViewMode || 'vol';
          if (mode === 'per') return '';
          const last = this._afOcDisplayedCycle();
          const results = (last?.results || []).filter(r => r && typeof r.sym === 'string');
          if (!results.length) return '';
          {
            const mc = this._afOcModeCfg();
            const withField = results.filter(r => mc.getVal(r) != null);
            if (!withField.length) return '';
            const mean = withField.reduce((s,r)=>s+mc.getVal(r),0)/withField.length;
            if (mode === 'liq') {
              const liqd = withField.filter(r => this._afLiqHas(r));
              if (!liqd.length) return '<span style="font-family:var(--mono);font-size:8px;color:var(--text-lo)">no liquidation events in this batch</span>';
              const unstable = this._afInstabOn() ? this._afInstabStats() : null;
              const LBL = { fav: 'favorable', mixfav: 'mixed fav', mixunf: 'mixed unfav', unf: 'unfavorable', quiet: 'quiet' };
              return liqd.map(r => {
                const v = mc.getVal(r), k = this._afLiqPillClass(r), c = mc.color;
                // favorable: fill + outline · mixed favorable: fill only · mixed unfavorable: outline only · unfavorable: neither
                const fill = (k.cls === 'fav' || k.cls === 'mixfav') ? `rgba(${c},.22)` : 'transparent';
                const bdr = (k.cls === 'fav' || k.cls === 'mixunf') ? `1px solid rgba(${c},.7)` : '1px solid transparent';
                const clr = k.cls === 'quiet' ? 'rgba(255,255,255,.28)' : (k.cls === 'unf' ? 'var(--text-lo)' : `rgba(${c},.95)`);
                const iv = unstable && unstable.inst[r.sym], bad = unstable && unstable.gray.has(r.sym);
                const mix = k.u == null || k.cls === 'quiet' ? '' : ` · S${Math.round(k.u * 100)}/L${Math.round(k.d * 100)}`;
                const ins = iv != null ? ` · inst ${Math.round(iv * 100)}%${bad ? ' · skipped' : ''}` : '';
                return `<span title="${r.sym}: ${mc.fmt(v)} · ${LBL[k.cls]}${mix}${ins}" style="font-family:var(--mono);font-size:8px;padding:1px 5px;border-radius:2px;border:${bdr};background:${fill};color:${clr};white-space:nowrap">${r.sym.replace('USDT','')} <span style="opacity:.65">${mc.fmt(v)}</span>${bad ? '<sup style="opacity:.8">!</sup>' : ''}</span>`;
              }).join('');
            }
            // LPA / LTA: coloured = favorable, gray = unfavorable, judged by the ticker's own 1hr move against this bot's side (the same
            // outcome the scorecard grades it on; exactly flat counts as unfavorable). Other views: coloured = at or above the batch average.
            const favView = mode === 'lpa' || mode === 'lta', dir = this._afSampleDir();
            return withField.map(r=>{
              const v = mc.getVal(r);
              const hc = (typeof r.hc === 'number' && !isNaN(r.hc)) ? r.hc : null;
              const aboveAvg = favView ? (hc != null && dir * hc > 0) : v >= mean;
              const tip = favView ? `${r.sym}: ${mc.fmt(v)}${mode === 'lta' && hc != null ? ' · 1h move ' + (hc >= 0 ? '+' : '') + hc.toFixed(2) + '%' : ''} · ${aboveAvg ? 'favorable' : 'unfavorable'}` : `${r.sym}: ${mc.fmt(v)}`;
              const clr=aboveAvg?`rgba(${mc.color},.9)`:'var(--text-lo)';
              const bdr=aboveAvg?`rgba(${mc.color},.4)`:'rgba(255,255,255,.1)';
              const bg=aboveAvg?`rgba(${mc.color},.06)`:'transparent';
              return `<span title="${tip}" style="font-family:var(--mono);font-size:8px;padding:1px 5px;border-radius:2px;border:1px solid ${bdr};background:${bg};color:${clr};white-space:nowrap">${r.sym.replace('USDT','')} <span style="opacity:.65">${mc.fmt(v)}</span></span>`;
            }).join('');
          }
        },

      }, _hostStages
        ? { _scanStageDefs: [...def._scanStageDefs, { id: 'af-post', run: function () { return this._afScanPost(); } }] }
        : { async runScan() { await _origScan.call(this); await this._afScanPost(); } });
    },
  };
})();
</script>
