        },

        persist() {
          _origPers.call(this);
          try {
            this.afGcWindow   = trimToByteCap(this.afGcWindow);
            localStorage.setItem(ASH_KEY, JSON.stringify({
              gcWindow: this.afGcWindow, gcLastStep: this._afGcLastStep,
              ddhStartedAt: this._afDdhStartedAt,
            }));
          } catch(e) {}
        },

        _afScoreRead() {
          try {
            if (localStorage.getItem(EXTREMITY_KEY) === null) {
              // One-time migration off the old shared key — see the comment on
              // LEGACY_SHARED_EXTREMITY_KEY above. Runs once: after this, EXTREMITY_KEY
              // exists (even as '[]') so this branch never fires again.
              try {
                const legacyRaw = localStorage.getItem(LEGACY_SHARED_EXTREMITY_KEY);
                const legacy = legacyRaw ? JSON.parse(legacyRaw) : [];
                const mine = Array.isArray(legacy) ? legacy.filter(r => r.source === 'chaser') : [];
                localStorage.setItem(EXTREMITY_KEY, JSON.stringify(mine));
              } catch(_) { localStorage.setItem(EXTREMITY_KEY, '[]'); }
            }
            const raw = localStorage.getItem(EXTREMITY_KEY);
            if (!raw) return [];
            const cut = Date.now() - SCORE_SAFETY_TTL;
            return (JSON.parse(raw) || []).filter(r => r.ts >= cut && Array.isArray(r.criteria) && r.criteria.length);
          } catch(e) { return []; }
        },
        _afScoreTrim() {
          try {
            const records   = this._afScoreRead();
            const quota     = this.cfg.afSpongeQuota;
            const staleDays = this.cfg.afStaleSlotDays;
            const staleMs   = staleDays * 24 * 3600 * 1000;
            const now       = Date.now();
            // +fund/-fund are NOT legacy — Blind-Entry and Liquid-Diver actively write them as
            // their primary criteria tags. Only the genuinely dead pre-tiered criteria purge here.
            const LEGACY    = new Set(['>10pct','<10pct','lsa','lba','rasl','rabl']);
            const isLegacy  = r => r.criteria.some(c => LEGACY.has(c));
            const bySlot = {};
            for (const r of records) {
              if (isLegacy(r)) continue;
              const k = collapseKey(r.criteria);
              if (!bySlot[k]) bySlot[k] = [];
              bySlot[k].push(r);
            }
            const trimmed = [];
            for (const recs of Object.values(bySlot)) {
              recs.sort((a, b) => b.ts - a.ts);
              const kept = recs.slice(0, quota);
              if (!kept.length) continue;
              if (now - kept[0].ts < staleMs) trimmed.push(...kept);
            }
            const GLOBAL_CAP = 5000;
            const capped = trimmed.sort((a, b) => b.ts - a.ts).slice(0, GLOBAL_CAP);
            // Per-slot quota + GLOBAL_CAP bound the record *count*, but with enough
            // distinct auto-generated slot buckets the total byte size can still run
            // large — apply the same atomized byte cap as a final safety net, oldest first.
            const byteCapped = trimToByteCap([...capped].reverse()).reverse();
            localStorage.setItem(EXTREMITY_KEY, JSON.stringify(byteCapped));
          } catch(e) {}
        },
        _afScoreWrite(criteria, pnl, hist = false) {
          try {
            const records = this._afScoreRead();
            const rec = { ts: Date.now(), criteria, pnl, source: 'chaser' };
            if (hist) rec.hist = true;
            records.push(rec);
            const quota = this.cfg.afSpongeQuota;
            const bySlot = {};
            for (const r of records) {
              const k = collapseKey(r.criteria);
              if (!bySlot[k]) bySlot[k] = [];
              bySlot[k].push(r);
            }
            const trimmed = [];
            for (const recs of Object.values(bySlot)) {
              recs.sort((a, b) => b.ts - a.ts);
              trimmed.push(...recs.slice(0, quota));
            }
            const byteCapped = trimToByteCap([...trimmed].reverse()).reverse();
            localStorage.setItem(EXTREMITY_KEY, JSON.stringify(byteCapped));
            return byteCapped;
          } catch(e) { return null; }
        },
        // Feeds the Extremity Scorer's cutoff computation. Called from every criterion
        // annotation — scan-time pool building, live liq messages, Extremity Re-Evaluation —
        // NOT gated behind a close or even an actual entry. This is deliberate: a dial's
        // cutoff needs to be provable from the wide stream of what the market is actually
        // showing right now, not from the narrow trickle of closed trades. Sampling only from
        // closes would deadlock at cold start — nothing opens until a dial is proven, and a
        // dial can only prove itself from closes that require something to have opened first.
        _afDialSample(tag) {
          if (!tag) return;
          const info = dialInfo(collapseCrit(tag));
          if (!info) return;
          const m = tag.match(/(-?\d+)$/);
          if (!m) return; // bare Blind-Entry/Liquid-Diver tags (+fund/-fund/+ocs/-ocs) carry no
                           // magnitude — they always classify extreme regardless (see
                           // _afExtremityBuild/_afExtremityVeto), nothing to prove here.
          const dk = info.family + '|' + info.pole;
          const pool = (this.afDialSamplePool ||= this._afLoadDialPool());
          const arr = (pool[dk] ||= []);
          arr.push(Math.abs(parseInt(m[1], 10)));
          const cap = this.cfg.afExtremitySampleCap || 300;
          if (arr.length > cap) arr.splice(0, arr.length - cap);
          this._afSaveDialPool();
        },
        // afDialSamplePool now persists (DIAL_POOL_KEY) instead of being memory-only, so a
        // restart doesn't reset every dial to "unproven" and blank out every extreme
        // classification until live samples happen to rebuild it — which is what was
        // happening before. Loaded lazily (first _afDialSample/_afExtremityBuild call each
        // session) rather than at some fixed init point, and saved with a light throttle since
        // _afDialSample fires on every live annotation, not just closes.
        _afLoadDialPool() {
          try {
            const raw = localStorage.getItem(DIAL_POOL_KEY);
            return raw ? JSON.parse(raw) : {};
          } catch (e) { return {}; }
        },
        _afSaveDialPool() {
          const now = Date.now();
          if (now - (this._afDialPoolLastWrite || 0) < 3000) return;
          this._afDialPoolLastWrite = now;
          try { localStorage.setItem(DIAL_POOL_KEY, JSON.stringify(this.afDialSamplePool || {})); } catch (e) {}
        },
        // ── Open-Position Rolling-Average Criteria (see /versioning) ─────────────────
        //
        // Replaces the single entry-time snapshot (_micCriteria/_becCriteria/_ldcCriteria,
        // frozen once in *Open) as the source feeding close-time scoring, Extremity
        // Re-Evaluation, and substitution's live score. No separate sample list and no new
        // poller/timer — this rides the existing scan cycle: called once per open position
        // per scan from MIC/MIW's runScan (_afPositionCriteriaSample), exempt from the
        // follower no-own-fetch rule since it only ever touches the handful of symbols
        // currently open, not the full ticker universe (same loophole _micTopUpGeneralCriteria
        // already uses for ocs/ocx via _ocFetchSingle's allowOwnFetch flag).
        //
        // A position's locked criteria FAMILIES never change after entry — that's what
        // defines its slot. Only the observed magnitude/tier of each is re-sampled, into a
        // calendar-time window (default 24h) kept on the position itself.
        POS_CRIT_WINDOW_MS: 24 * 3600 * 1000,
        async _afPositionCriteriaSample(pos) {
          const crits = pos._micCriteria || pos._becCriteria || pos._ldcCriteria;
          if (!crits?.length) return;
          // Own fresh single-ticker fetch, not this._lastAllTickers — that bulk snapshot is
          // cached for cfg.bulkTickerCooldownHours (default 1h, user-configurable up to 12h)
          // and reused across many scans in between, so fund/va/ioa read off it would mostly
          // resample the exact same stale number instead of tracking real drift. Still routed
          // through _qFetch (rate/concurrency limited) — just not gated behind the follower
          // no-own-fetch rule, same exemption as the ocs/ocx fetch below.
          let t = null;
          try {
            const r = await this._qFetch(`${this.base}/v5/market/tickers?category=linear&symbol=${pos.symbol}`);
            const d = await r.json();
            t = d?.retCode === 0 ? d.result?.list?.[0] : null;
          } catch(e) {}
          if (!t) return;
          const now = Date.now();
          const buf = (pos._afCritSamples ||= {});
          for (const tag of crits) {
            const family = tag.replace(/[+-]?\d+$/, ''); // bare family, e.g. "fund", "va", "ocs"
            if (/^(ocs|ocx)/.test(family) && this.cfg.afOcEnabled && !this.afOcResults?.[pos.symbol]) {
              try { const r = await this._ocFetchSingle?.(pos.symbol, true); if (r) { (this.afOcResults ||= {})[pos.symbol] = r; } } catch(e) {}
            }
            const fresh = this._micAnnotateCritRaw?.(family, t);
            if (!fresh) continue;
            const m = fresh.match(/(-?\d+)$/);
            if (!m) continue;
            const arr = (buf[family] ||= []);
            arr.push({ tier: parseInt(m[1], 10), ts: now });
            const cut = now - (this.POS_CRIT_WINDOW_MS || 24 * 3600 * 1000);
            while (arr.length && arr[0].ts < cut) arr.shift();
          }
        },
        // Reconstructs a position's criteria as averaged tags, in the same family+tier
        // string format every other tag already uses (e.g. "fund+3"). Falls back to the
        // frozen entry-time snapshot for any family with fewer than afExtremityMinSamples
        // readings — a position that closes fast simply hasn't had enough scans to average.
        _afPositionAvgCriteria(pos) {
          const crits = pos._micCriteria || pos._becCriteria || pos._ldcCriteria;
          if (!crits?.length) return crits;
          const minSamples = Math.max(3, this.cfg.afExtremityMinSamples || 3);
          const buf = pos._afCritSamples || {};
          return crits.map(tag => {
            const family = tag.replace(/[+-]?\d+$/, '');
            const arr = buf[family];
            if (!arr || arr.length < minSamples) return tag; // fallback: frozen snapshot
            const avgTier = Math.round(arr.reduce((s, r) => s + r.tier, 0) / arr.length);
            return `${family}${avgTier >= 0 ? '+' : ''}${avgTier}`;
          });
        },
        // ── Extremity Scorer / Lukewarm Scoring core build (v1.80.0 — see /versioning).
        //
        // Cutoffs are computed FIRST, from afDialSamplePool (the observation stream — see
        // _afDialSample above), independent of closed-trade records entirely: for each dial
        // pole with >= afExtremityMinSamples readings, the cutoff is the magnitude at the
        // configured split percentile of that pole's OWN observed spread — "organically
        // arrange them into highs and lows" per the user's own framing. A pole below the
        // sample floor has no proven cutoff and stays lukewarm by default (never credited,
        // never blocking) until it clears the floor — which, sampling from live readings
        // rather than closes, usually happens within the first scan or two, not never.
        //
        // Records are then walked ONCE. Extreme occurrences score into that pole's
        // win/loss/pnl exactly as before — this is what MIC's blocking/co-qual reads via
        // micCollapsedSlotRanks, unchanged in shape. Lukewarm Scoring adds a second,
        // parallel tally alongside it: EVERY occurrence (extreme or lukewarm) also lands in
        // afLukewarmScoreboard under its classification bucket and family — "which side
        // (Extreme vs Lukewarm) has been more profitable overall, and which criteria within
        // that side actually drove it" — purely a display/advisory layer, never read by
        // blocking or the veto.
        //
        // Bare Blind-Entry/Liquid-Diver tags always classify extreme — there's nothing to
        // be lukewarm about.
        _afExtremityBuild(records) {
          records = records || this._afScoreRead();
          const exclude = new Set(this.cfg.micAutoSlotExclude || []);
          const quota = this.cfg.afSpongeQuota;
          const minSamples = Math.max(3, this.cfg.afExtremityMinSamples || 3);
          const splitPct = Math.min(0.49, Math.max(0.01, (this.cfg.afExtremitySplitPct ?? 25) / 100));
          const sortedRecords = [...records].sort((a, b) => b.ts - a.ts).filter(r => r.source === 'chaser');
          // Scorecards fully separated per side (see /versioning) — Ashfall's Extremity
          // Scorer only ever aggregates its own closed trades. No cross-bot reading, no
          // sign flipping, no shared bias/pool needed: partner-sourced records in
          // EXTREMITY_KEY (if any linger from before this change) are filtered out above
          // and never reach dialStats/bucketStats/ranks below.

          const samplePool = (this.afDialSamplePool ||= this._afLoadDialPool());
          const cutoffs = {};
          for (const [dk, mags] of Object.entries(samplePool)) {
            if (mags.length < minSamples) { cutoffs[dk] = null; continue; }
            const sorted = [...mags].sort((a, b) => a - b);
            const idx = Math.min(sorted.length - 1, Math.floor(sorted.length * (1 - splitPct)));
            cutoffs[dk] = sorted[idx];
          }

          const dialStats = {};
          const dialCount = {};
          const subtagStats = {};
          const bucketStats = { extreme: {}, lukewarm: {} };
          const bucketCount = { extreme: {}, lukewarm: {} };
          for (const r of sortedRecords) {
            const keptCrits = exclude.size ? r.criteria.filter(c => !exclude.has(c)) : r.criteria;
            if (!keptCrits.length) continue;
            const pnl = typeof r.pnl === 'number' ? r.pnl : (r.win ? 1 : -1);
            const effectivePnl = pnl; // own-only now (see sortedRecords filter above)
            for (const c of keptCrits) {
              const key = collapseCrit(c);
              const info = dialInfo(key);
              if (!info) continue; // unrecognized/retired tag — no dial, not scored
              const noGradation = !!BARE_DIAL_TAGS[key];
              let mag = Infinity;
              if (!noGradation) {
                const m2 = c.match(/(-?\d+)$/);
                mag = m2 ? Math.abs(parseInt(m2[1], 10)) : 0;
              }
              const pole = info.pole;
              const dk = info.family + '|' + pole;
              const cutoff = cutoffs[dk];
              const isExtreme = !Number.isFinite(mag) || (cutoff != null && mag >= cutoff);

              // Lukewarm Scoring: every occurrence lands here, extreme or not. Keyed by dk
              // (family+pole), not family alone — a two-pole family's '+' and '-' sides are
              // opposite signals and must not be netted into one pill (see /versioning).
              const bucket = isExtreme ? 'extreme' : 'lukewarm';
              const bCount = bucketCount[bucket];
              if ((bCount[dk] = (bCount[dk] ?? 0) + 1) <= quota) {
                const bStats = bucketStats[bucket];
                if (!bStats[dk]) bStats[dk] = { pnl: 0, wins: 0, losses: 0 };
                const bs = bStats[dk];
                bs.pnl += effectivePnl; if (effectivePnl > 0) bs.wins++; else bs.losses++;
              }

              if (!isExtreme) continue; // lukewarm — not scored into the blocking-facing dial below

              if ((dialCount[dk] = (dialCount[dk] ?? 0) + 1) > quota) continue;
              if (!dialStats[dk]) dialStats[dk] = { pnl: 0, wins: 0, losses: 0, hasHist: false, hasTrade: false };
              const stats = dialStats[dk];
              stats.pnl += effectivePnl; if (effectivePnl > 0) stats.wins++; else stats.losses++;
              if (r.hist) stats.hasHist = true; else stats.hasTrade = true;
              const subtagKey = key;
              if (!subtagStats[subtagKey]) subtagStats[subtagKey] = { pnl: 0, wins: 0, losses: 0 };
              const ts = subtagStats[subtagKey];
              ts.pnl += effectivePnl; if (effectivePnl > 0) ts.wins++; else ts.losses++;
            }
          }
          // A dial can have a proven cutoff (samples exist) but zero closes yet — still needs
          // to show up (0 pnl, real sample count) rather than vanish from the panel/ranks.
          for (const dk of Object.keys(cutoffs)) {
            if (!dialStats[dk]) dialStats[dk] = { pnl: 0, wins: 0, losses: 0, hasHist: false, hasTrade: false };
          }
          for (const dk of Object.keys(dialStats)) {
            dialStats[dk].cutoff = cutoffs[dk] ?? null;
            dialStats[dk].sampleCount = (samplePool[dk] || []).length;
          }

          this.afDialCutoffs = cutoffs;
          this.afDialSampleCounts = Object.fromEntries(Object.entries(samplePool).map(([k, v]) => [k, v.length]));
          // Flat display-key -> stats map, same shape the old micCollapsedSlotRanks/
          // micCollapsedCritStats used — _micScaledRank/_micCritScore/_micIsCritBlocked keep
          // reading this one flat lookup unchanged, with no idea dials or poles exist beneath it.
          const ranks = {}, dispStats = {};
          for (const [dk, stats] of Object.entries(dialStats)) {
            const [family, pole] = dk.split('|');
            const key = dialDisplayKey(family, pole);
            ranks[key] = stats.pnl;
            dispStats[key] = stats;
          }
          // Per-tag scores layer on top for blocking's benefit — never overwrites a dk-based
          // key above (every family's raw tag already equals its own dk key, so this is a
          // no-op re-write for them, not a collision).
          for (const [tag, ts] of Object.entries(subtagStats)) {
            ranks[tag] = ts.pnl;
          }
          this.micCollapsedSlotRanks = ranks;
          this.micCollapsedCritStats = dispStats;
          this.afScoreboard = Object.entries(dispStats).sort(([,a],[,b]) => b.pnl - a.pnl).map(([key, s]) => ({ key, ...s }));
          // Lukewarm Scoring display layer — two buckets (Extreme / Lukewarm), each with a
          // per-pole breakdown (dk = family+pole — see above). See _afExtremityHtml for the render.
          const _dkToLukewarmEntry = ([dk, s]) => {
            const [family, pole] = dk.split('|');
            return { family, pole, key: dialDisplayKey(family, pole), ...s };
          };
          this.afLukewarmScoreboard = {
            extreme: Object.entries(bucketStats.extreme).sort(([,a],[,b]) => b.pnl - a.pnl).map(_dkToLukewarmEntry),
            lukewarm: Object.entries(bucketStats.lukewarm).sort(([,a],[,b]) => b.pnl - a.pnl).map(_dkToLukewarmEntry),
          };
        },
        // Which side Lukewarm Scoring currently favors — whichever bucket's total $ (summed
        // across every family in it) is ahead. This is what _afExtremityVeto actually targets:
        // no more manual Lukewarm Targeting toggle, the system re-decides for itself every time
        // _afExtremityBuild runs, off the same scoreboard the panel shows. Ties (including
        // 0 vs 0, before either bucket has real data) default to 'extreme' — the original,
        // always-avoid-lukewarm behavior, until the data actually says otherwise.
        _afLukewarmFavoredSide() {
          const board = this.afLukewarmScoreboard || { extreme: [], lukewarm: [] };
          const sum = arr => arr.reduce((a, s) => a + s.pnl, 0);
          return sum(board.lukewarm) > sum(board.extreme) ? 'lukewarm' : 'extreme';
        },
        // Overall veto — "explicitly avoid any ticker exhibiting values from the LOSING side of
        // Lukewarm Scoring". Counts, across every dial-eligible criterion the ticker actually
        // exhibits, what share classifies as the non-favored side against the current cutoffs;
        // an unproven dial (below afExtremityMinSamples) always counts against the ticker here,
        // same as a genuinely non-favored reading. Vetoes once that share reaches
        // afLukewarmRatioPct (default 70%). Favored side comes from _afLukewarmFavoredSide —
        // see there for how it's decided and how the default (favor extreme) applies before
        // there's enough data either way.
        _afExtremityVeto(annotCrits) {
          if (!this.cfg.afExtremityEnabled) return false;
          const cutoffs = this.afDialCutoffs || {};
          const favorLukewarm = this._afLukewarmFavoredSide() === 'lukewarm';
          let total = 0, against = 0;
          for (const c of (annotCrits || [])) {
            const key = collapseCrit(c);
            const info = dialInfo(key);
            if (!info) continue;
            total++;
            if (!!BARE_DIAL_TAGS[key]) { if (favorLukewarm) against++; continue; } // no gradation — always extreme, so counts against a lukewarm-favoring veto
            const m2 = c.match(/(-?\d+)$/);
            const mag = m2 ? Math.abs(parseInt(m2[1], 10)) : 0;
            const cutoff = cutoffs[info.family + '|' + info.pole];
            const isExtreme = cutoff != null && mag >= cutoff;
            if (favorLukewarm ? isExtreme : !isExtreme) against++;
          }
          if (!total) return false;
          const againstPct = against / total * 100;
          return againstPct >= (this.cfg.afLukewarmRatioPct ?? 70);
        },
        // Extremity Re-Evaluation (secondary toggle, off by default). At the end of every
        // scan, re-derives each open position's own qualifying criteria against the CURRENT
        // dial cutoffs and closes it once it crosses the same lukewarm-ratio bar it had to
        // clear to open in the first place — held to the same standard throughout its life,
        // not just at entry. Deliberately reads only data this cycle already cached (bulk
        // ticker snapshot + MIC's live OC cache) rather than firing fresh fetches of its
        // own, so it rides the existing scan cadence instead of adding load on top of the
        // scan scheduler. A symbol with no fresh-enough cached tick this cycle is skipped
        // rather than forcing a fetch.
        async _afExtremityReEval() {
          if (!this.cfg.afExtremityEnabled || !this.cfg.afExtremityReEvalEnabled) return;
          const snapshot = [...(this.positions || [])];
          for (const pos of snapshot) {
            if (!pos || !pos.symbol) continue;
            const crits = pos._micCriteria || pos._becCriteria || pos._ldcCriteria;
            if (!crits || !crits.length) continue;
            // Was calling the never-defined _micAnnotateLiveCrit — always fell through to
            // `?? c`, so Re-Eval was silently comparing each position's frozen entry snapshot
            // against itself and could never actually detect drift. Now reads the rolling
            // average built each scan by _afPositionCriteriaSample.
            const liveCrits = this._afPositionAvgCriteria(pos);
            if (this._afExtremityVeto(liveCrits)) {
              await this.pseudoClosePosition(pos, 'Ext-Rvl');
              this.log(`[ASH] ${pos.symbol} closed — Extremity Re-Evaluation: crossed onto the non-favored side.`, 'info');
            }
          }
        },
        // cfg.micEnabled is a persisted toggle value — it survives MIC being removed via the
        // Plugin Manager, so it alone can't tell us whether MIC is actually loaded right now.
        // Cross-check against the live plugin list so the MIC scorecard section disappears the
        // moment MIC is unloaded, not just when its own toggle happens to be off.
        _micPluginLoaded() {
          return (this._pluginList || []).some(p => p.id === 'multiindicator-chaser');
        },
        _becPluginLoaded() {
          return (this._pluginList || []).some(p => p.id === 'blindentry-chaser');
        },
        _ldcPluginLoaded() {
          return (this._pluginList || []).some(p => p.id === 'liquiddiver-chaser');
        },
        // Liquid-Diver's OC fetch is single-symbol, triggered per reactive entry — its samples are
        // almost always one bar of 0.0s and drown out a real batch-fetched sample. Only show the
        // chart when a plugin doing proper batch OC sampling (MIC or Blind-Entry) is loaded; if
        // Liquid-Diver is the only OC consumer, hide it rather than let its noise dominate.
        _ocChartViable() {
          return this._micPluginLoaded() || this._becPluginLoaded();
        },
        // Slot Blocking: true once a criterion's collapsed score is a loss beyond the
        // configured % of base margin. Auto-clears the moment the score recovers — no manual
        // reset needed. A lukewarm-classified occurrence never reaches this score at all (see
        // _afExtremityBuild) — blocking only ever reacts to a losing EXTREME, same standard
        // the dial applies everywhere else.
        _afIsCritBlocked(key) {
          if (!this.cfg.micSlotBlockEnabled) return false;
          const ranks = this.micCollapsedSlotRanks || {};
          const baseMargin = (this.cfg.minNotional || 6) / (this.cfg.leverage || 6);
          const threshold  = baseMargin * ((this.cfg.micSlotBlockPct ?? 25) / 100);
          if (!this.cfg.micSlotBlockTags) return false;
          const blockable = (this.cfg.micSlotBlockCriteria || []).filter(Boolean);
          if (!blockable.length) return false;
          const esc = v => String(v).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const rx = new RegExp('^(' + blockable.map(esc).join('|') + ')[+-]?$');
          return rx.test(key) && (ranks[key] ?? 0) <= -threshold;
        },
        // Lukewarm Scoring pill UI (v1.80.0) — two big buckets, Extreme and Lukewarm, each
        // headlined by its aggregate $ record (which side has actually been more
        // profitable overall), with smaller per-criterion pills nested inside showing which
        // of fund/V-A/IO-A/OCS/OCX drove that bucket's result.
        _afExtremityHtml(shown) {
          if (!shown) return '';
          const board = this.afLukewarmScoreboard || { extreme: [], lukewarm: [] };
          if (!board.extreme.length && !board.lukewarm.length) return `<span style="font-size:9px;color:var(--text-lo)">No Extremity closes recorded yet.</span>`;
          const val = s => s.pnl;
          const wl  = s => [s.wins, s.losses];
          const fmt = v => (v >= 0 ? '+$' : '-$') + Math.abs(v).toFixed(2);
          const smallPill = (s) => {
            const v = val(s);
            const blocked = this._afIsCritBlocked(s.key);
            const color = blocked ? 'rgba(190,130,255,.95)' : v > 0 ? 'rgba(100,220,150,.9)' : v < 0 ? 'var(--short)' : 'var(--text-lo)';
            const [w, l] = wl(s);
            return `<div title="${s.key}" style="display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0;border:1px solid var(--border);border-radius:10px;background:var(--bg-raised);padding:3px 6px;font-family:var(--mono)">`
              + `<div style="font-size:9px">${afCritEmoji(s.key)}</div>`
              + `<div style="font-size:7px;color:${color}"><b>${fmt(v)}</b></div>`
              + `<div style="font-size:5.5px;opacity:.5">${w}W ${l}L</div>`
              + `</div>`;
          };
          const bucket = (label, entries, color) => {
            const total = entries.reduce((a, s) => a + val(s), 0);
            const totalColor = total > 0 ? 'rgba(100,220,150,.9)' : total < 0 ? 'var(--short)' : 'var(--text-lo)';
            const sorted = [...entries].sort((a, b) => val(b) - val(a));
            return `<div style="flex:1;min-width:140px;border:1px solid ${color};border-radius:8px;padding:6px 8px;background:rgba(255,255,255,.02)">`
              + `<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px">`
              + `<div style="font-family:var(--mono);font-size:8px;letter-spacing:1.5px;color:var(--text-lo)">${label}</div>`
              + `<div style="font-family:var(--mono);font-size:11px;color:${totalColor}"><b>${entries.length ? fmt(total) : '—'}</b></div>`
              + `</div>`
              + `<div style="display:flex;flex-wrap:wrap;gap:4px">${sorted.map(smallPill).join('') || '<span style="font-size:8px;color:var(--text-lo)">no closes yet</span>'}</div>`
              + `</div>`;
          };
          return `<div style="display:flex;gap:8px;flex-wrap:wrap;width:100%">`
            + bucket('EXTREME', board.extreme, 'rgba(255,150,80,.25)')
            + bucket('LUKEWARM', board.lukewarm, 'rgba(150,150,160,.25)')
            + `</div>`;
        },
        _afCrossRead() {
          try {
            const raw = localStorage.getItem(CROSS_KEY);
            if (!raw) return [];
            const cut = Date.now() - CROSS_TTL;
            return (JSON.parse(raw).events || []).filter(e => e.ts >= cut);
          } catch(e) { return []; }
        },

        _afCrossWrite(kind, symbol, extra) {
          try {
            const events = this._afCrossRead();
            const rec = { ts: Date.now(), kind, source: 'chaser' };
            if (symbol) rec.symbol = symbol;
            if (extra) Object.assign(rec, extra);
            events.push(rec);
            localStorage.setItem(CROSS_KEY, JSON.stringify({ events: _trimCrossEvents(events) }));
          } catch(e) {}
        },

        async _afCheckCross() {
          if (!this.cfg.ashfallCrossEnabled) return;
          const fromWinter = this._afCrossRead().filter(e => e.source === 'winter');
          this.afCrossEvents = fromWinter.slice(-20);
        },

        // Renders the Cross tab's Partner Feed — every broadcast kind Winter can write to the
        // shared bus (cascade/sacrifice closes, DDH/glk start+end transitions, GC steps), not
        // just close reasons. Built for debugging Mutual DDH Lift and GC lift: the start/end
        // pairing and step numbers here are what actually decide whether a lift condition fires.
        _afCrossFeedHtml() {
          const meta = {
            'cascade':   { icon: '⚡', label: 'Cascade',          color: 'rgba(100,220,150,.9)' },
            'sacrifice': { icon: '🩸', label: 'Sacrifice',        color: 'rgba(255,80,80,.9)' },
            'ddh-start': { icon: '🧊', label: 'DDH Start',        color: 'rgba(120,180,255,.9)' },
            'ddh-end':   { icon: '🧊', label: 'DDH Lift',         color: 'rgba(120,180,255,.55)' },
            'glk-start': { icon: '🔒', label: 'Gains-Lock Start', color: 'rgba(220,180,100,.9)' },
            'glk-end':   { icon: '🔓', label: 'Gains-Lock Lift',  color: 'rgba(220,180,100,.55)' },
            'gc':        { icon: '📡', label: 'GC Step',          color: 'rgba(180,140,255,.9)' },
          };
          const events = (this.afCrossEvents || []).filter(e => meta[e.kind]).slice().reverse();
          if (!events.length) return '';
          const todayUTC = new Date().toISOString().slice(0, 10);
          return events.map(e => {
            const m = meta[e.kind];
            const d = new Date(e.ts);
            const dateUTC = d.toISOString().slice(0, 10);
            const t = (dateUTC !== todayUTC ? dateUTC.slice(5) + ' ' : '') + d.toISOString().slice(11, 19) + ' UTC';
            let detail = '';
            if (e.kind === 'gc') detail = (e.pnl != null ? '+' + e.pnl.toFixed(2) : '') + (e.step != null ? ' · step ' + e.step : '');
            else if (e.kind === 'cascade' || e.kind === 'sacrifice') detail = (e.count != null ? '×' + e.count + ' ' : '') + (e.pnl != null ? (e.pnl >= 0 ? '+' : '') + e.pnl.toFixed(2) : '') + (e.symbol ? ' ' + e.symbol : '');
            else if (e.symbol) detail = e.symbol;
            return `<div style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:8px;line-height:12px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04)">` +
              `<span>${m.icon}</span>` +
              `<span style="color:${m.color};font-weight:bold;white-space:nowrap">${m.label}</span>` +
              `<span style="color:var(--text-lo)">${detail}</span>` +
              `<span style="margin-left:auto;color:var(--text-lo);white-space:nowrap">${t}</span>` +
              `</div>`;
          }).join('');
        },


        _afDownload(filename, data) {
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = filename;
          a.click();
          URL.revokeObjectURL(a.href);
        },
        afExportAll() {
          try {
            const extremityRaw = localStorage.getItem(EXTREMITY_KEY);
            const ocRaw        = localStorage.getItem(ASH_OC_HIST_KEY);
            this._afDownload(`ashfall-profile-${new Date().toISOString().slice(0, 10)}.json`, {
              exportedAt: Date.now(),
              extremity: extremityRaw ? JSON.parse(extremityRaw) : [],
              ocHistory: ocRaw ? JSON.parse(ocRaw) : [],
            });
          } catch(e) { this.log('[ASH] Export failed', 'warn'); }
        },

        afImport(e) {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              const d = JSON.parse(ev.target.result);
              // Accepts either the new 'extremity' field or a legacy 'scorecard' field from a
              // pre-Extremity export — the record shape (tag string + pnl) never changed, only
              // how it's interpreted, so an old export still populates the new store correctly.
              const importedScore = d.extremity || d.scorecard;
              if (Array.isArray(importedScore)) {
                try { localStorage.setItem(EXTREMITY_KEY, JSON.stringify(importedScore)); } catch(_) {}
              }
              if (Array.isArray(d.ocHistory)) {
                this._afOcCycleHistory = this._ocSanitizeHistory(d.ocHistory).cleaned;
                try { localStorage.setItem(ASH_OC_HIST_KEY, JSON.stringify(this._afOcCycleHistory)); } catch(_) {}
              }
              this.persist();
              this._afScoreTrim();
              this._afExtremityBuild();
              this.log(`[ASH] Profile imported — ${(importedScore||[]).length} Extremity records, ${(d.ocHistory||[]).length} OC cycles`, 'info');
            } catch(err) {
              this.log('[ASH] Import failed — file could not be parsed as a valid Ashfall profile', 'warn');
            }
            e.target.value = '';
          };
          reader.readAsText(file);
        },

        async runScan() {
          await _origScan.call(this);
          if (!this.cfg.ashfallEnabled) return;
          this._afCheckCross().catch(() => {});
          // Deferred so MIC's own scan (which fetches klines/OC) finishes first — MIC wraps
          // after AF, so _origScan returns before MIC's own fetches land.
          setTimeout(() => this._afExtremityReEval().catch(() => {}), 0);
          // afDialSamplePool now persists across restarts (loaded explicitly in init(), see
          // its declaration) — this call just keeps the panel in sync as new live samples land.
          // _afExtremityBuild() is otherwise only called on a close/config-change/import (see
          // runScan's own long-standing comment on why it's not on a timer), which used to leave
          // a freshly-loaded page showing every dial-based score as zero — anchors (sliq/bliq/etc,
          // no cutoff needed) unaffected — until the next real close happened to trigger a
          // rebuild, sometimes hours later. Once per scan is cheap enough (same call the toggles
          // above already make on every slider drag) and keeps the panel in sync with the pool
          // as it fills in, rather than requiring a load-bearing trade close just to redraw
          // existing history.
          this._afExtremityBuild();
        },

        async pseudoClosePosition(pos, reason, fillPrice) {
          const prevLen = this.closedTrades?.length ?? 0;
          await _origClose.call(this, pos, reason, fillPrice);
          if ((this.closedTrades?.length ?? 0) > prevLen) {
            // totalPnl (incl. funding) is what the base feeds its halt windows
            const t   = this.closedTrades[0];
            const pnl = t?.totalPnl ?? t?.pnl;
            // Gains Continuation (GC) — own rolling 6h PnL, independent of the host's Gains
            // Lock window. Stepped in afGcThresholdPct-of-base-margin increments (default 50% —
            // e.g. $0.50, $1.00, $1.50 at $1 base margin): every NEW step crossed upward fires a
            // one-shot 'gc' broadcast (high-water-mark — a step already fired never re-fires on
            // its own, only on a fresh climb after the window resets to ≤0). Read side is in the
            // 15s loop below.
            if (this.cfg.afGcEnabled && typeof pnl === 'number') {
              const _gcNow = Date.now();
              const _gcCut = _gcNow - 6 * 3600 * 1000;
              this.afGcWindow.push({ pnl, ts: _gcNow });
              this.afGcWindow = this.afGcWindow.filter(e => (e.ts || 0) >= _gcCut);
              const _gcRolling = this.afGcWindow.reduce((s, e) => s + (e.pnl || 0), 0);
              const _gcBaseMargin = (this.cfg.minNotional || 6) / (this.cfg.leverage || 6);
              const _gcStep = _gcBaseMargin * Math.max(0.01, (this.cfg.afGcThresholdPct ?? 50) / 100);
              const _gcStepIdx = Math.floor(_gcRolling / _gcStep);
              if (_gcStepIdx > this._afGcLastStep) {
                this._afGcLastStep = _gcStepIdx;
                if (this.cfg.ashfallCrossEnabled) this._afCrossWrite('gc', null, { pnl: _gcRolling, step: _gcStepIdx });
                this.log(`[ASH] 📡 Gains Continuation — 6hr rolling PnL +${_gcRolling.toFixed(2)} crossed step ${_gcStepIdx} (+${_gcStep.toFixed(2)} USDT increments) — broadcast to Permafrost.`, 'success');
              } else if (_gcRolling <= 0 && this._afGcLastStep !== 0) {
                this._afGcLastStep = 0; // back to flat/negative — re-arm from the first step
              }
            }
          }
          // Cascade/Sacrifice broadcasts fire once per trigger from MIC itself (at the collective-
          // exit decision point), not here per closed position — see _micCheckCascade/_micCheckSacrifice.
          // Blind-Entry has no real filtering criteria (see docs/blind-entry-plan.md) — its
          // _becCriteria are sign-only recording tags (+24h/-24h, +fund/-fund, +ocs/-ocs), never
          // used to gate entry, that exist purely so the scorecard has something to bucket.
          const _hasScoreCriteria = (pos._mic && pos._micCriteria?.length)
            || (pos._bec && pos._becCriteria?.length)
            || (pos._ldc && pos._ldcCriteria?.length);
          // Rolling average (see _afPositionAvgCriteria) instead of the frozen entry-time
          // snapshot — falls back to that same snapshot per-family if too few samples
          // accumulated before this close (fast-close case).
          const _scoreCriteria = _hasScoreCriteria ? this._afPositionAvgCriteria(pos) : null;
          if (this.cfg.afExtremityEnabled && _scoreCriteria) {
            const _t = this.closedTrades?.[0];
            const _pnl = _t?.totalPnl ?? _t?.pnl;
            if (typeof _pnl === 'number') {
              this._afExtremityBuild(this._afScoreWrite(_scoreCriteria, _pnl));
            }
          }
          // MIC-only feedback: direction-awareness lock, independent of the scorecard toggle.
          if (pos._mic && pos._micCriteria?.length) {
            const _t2  = this.closedTrades?.[0];
            const _pnl2 = _t2?.totalPnl ?? _t2?.pnl;
            if (typeof _pnl2 === 'number') {
              this._micOnPositionScored?.(pos.symbol, pos._micCriteria, _pnl2);
            }
          }
        },

        // ── Order Count Surveillance ─────────────────────────────────────────

        // volIoMap: optional {sym: {vol, oi}} pulled straight from this cycle's ticker payload
        // by the caller — no fetch required, it's already on the ticker. wantOc: whether any
        // slot actually needs ocs/ocx this cycle; when false, the recent-trade network fetch is
        // skipped entirely and only vol/oi (free data) gets sampled into the same cycle entry —
        // tethered to the same history/chart/persistence as OC (see MIC's va/ioa criteria and
        // _afVolIoWindowAvg), just without paying for a fetch neither criterion needs.
        async _ocFetchBatch(symbols, volIoMap, wantOc) {
          if (!this.cfg.afOcEnabled || !symbols?.length) return;
          if (this._lfIsFollowing?.()) { this._ocSeedFromShared(); return; } // following — seed from partner's shared OC data instead of fetching our own
          // Guard against overlapping calls: if a slower fetch (e.g. from a re-triggered
          // scan) finishes after a newer one already pushed, its stale ticker set would
          // otherwise land in history too, mixing symbols that were never part of the
          // latest scan's sample into the display.
          if (this._ocFetchRunning) return;
          this._ocFetchRunning = true;
          try {
          const results = {};
          const seedVolIo = sym => {
            const vio = volIoMap?.[sym];
            if (vio && (vio.vol != null || vio.oi != null)) return { vol: vio.vol ?? null, oi: vio.oi ?? null };
            return null;
          };
          if (wantOc) {
            const limit = this.cfg.afOcOrderLimit;
            const CONC = 10;
            for (let i = 0; i < symbols.length; i += CONC) {
              await Promise.all(symbols.slice(i, i + CONC).map(async sym => {
                let rec = seedVolIo(sym);
                try {
                  const res = await this._qFetch(`${this.base}/v5/market/recent-trade?category=linear&symbol=${sym}&limit=${limit}`);
                  const js  = await res.json();
                  const trades = js?.result?.list || [];
                  if (trades.length >= 2) {
                    let bc = 0, sc = 0;
                    for (const t of trades) { if (t.side === 'Buy') bc++; else sc++; }
                    const times = trades.map(t => parseInt(t.time, 10)).filter(n => !isNaN(n)).sort((a,b)=>a-b);
                    const span = times[times.length - 1] - times[0];
                    const avgMs = times.length > 1 && span > 0 ? span / (times.length - 1) : null;
                    rec = { ...(rec || {}), bc, sc, avgMs, n: trades.length };
                  }
                } catch(_) {}
                if (rec) results[sym] = rec;
              }));
            }
          } else {
            // Vol/IO-only cycle — no network round trip, just snapshot what's already on the ticker.
            for (const sym of symbols) { const rec = seedVolIo(sym); if (rec) results[sym] = rec; }
          }
          if (!Object.keys(results).length) return;
          this.afOcResults = results;
          this._afOcCycleCounter = (this._afOcCycleCounter % 99) + 1;
          const entry = { id: this._afOcCycleCounter, ts: Date.now(), results: Object.entries(results).map(([sym, r]) => ({ sym, ...r })) };
          this._afOcCycleHistory.push(entry);
          if (this._afOcCycleHistory.length > 25) this._afOcCycleHistory = this._afOcCycleHistory.slice(-25);
          this._ocPersistHistory();
          // Publish this cycle's OC sample so a partner bot that's following can seed its own
          // afOcResults/_afOcCycleHistory instead of going without OC data entirely while
          // following (see _ocSeedFromShared) — unlike liqResults/PEC, OC previously had no
          // cross-bot channel at all, so a follower's ocs/ocx checks silently starved for as
          // long as it kept following.
          this._sharedWrite?.('ocResults', results);
          const withInterval = Object.values(results).filter(r => r.avgMs != null);
          const withVolIo = Object.values(results).filter(r => r.vol != null || r.oi != null);
          const parts = [`${Object.keys(results).length}t`];
          if (withInterval.length) parts.push(`avg ${(withInterval.reduce((s,r)=>s+r.avgMs,0)/withInterval.length/1000).toFixed(1)}s/order`);
          if (withVolIo.length) parts.push(`${withVolIo.length}t vol/oi`);
          this.log(`[ASH] 📊 Sample cycle — ${parts.join(' · ')}`, 'info');
          } finally { this._ocFetchRunning = false; }
        },

        // Isolated single-symbol OC lookup for the live liquidation path (MIC's _micOnLiqMessage).
        // Deliberately does NOT touch afOcResults or _afOcCycleHistory: afOcResults is a full
        // replace on every _ocFetchBatch call, so a live single-symbol result written there would
        // wipe out the current scan's multi-ticker snapshot other tickers' ocs/ocx checks still
        // need; and pushing a 1-ticker entry into _afOcCycleHistory floods the Order Interval
        // Sample chart / Volume History overlay's hourly buckets with noisy samples — the same
        // problem Liquid-Diver's live OC fetch used to cause (see _ocChartViable()), just
        // reintroduced from inside MIC instead of a separate plugin. Callers merge the return
        // value into their own local map instead.
        async _ocFetchSingle(sym, allowOwnFetch = false) {
          if (!this.cfg.afOcEnabled || !sym) return null;
          if (this._lfIsFollowing?.()) {
            // following — seed afOcResults from the partner's shared snapshot and answer from
            // that instead of fetching our own (see _ocSeedFromShared). Not tagged `live` —
            // it's the leader's real historied batch entry, not a fresh unhistoried sample.
            this._ocSeedFromShared();
            const rec = this.afOcResults?.[sym];
            if (rec) return { ...rec };
            // allowOwnFetch is the pre-entry top-up's one loophole (see
            // _micTopUpGeneralCriteria): the leader has nothing for this symbol at all, so fall
            // through to a real fetch rather than opening with OCS/OCX unscored. Every other
            // caller leaves this off and stays seed-only, as before.
            if (!allowOwnFetch) return null;
          }
          try {
            const limit = this.cfg.afOcOrderLimit;
            const res = await this._qFetch(`${this.base}/v5/market/recent-trade?category=linear&symbol=${sym}&limit=${limit}`);
            const js  = await res.json();
            const trades = js?.result?.list || [];
            if (trades.length < 2) return null;
            let bc = 0, sc = 0;
            for (const t of trades) { if (t.side === 'Buy') bc++; else sc++; }
            const times = trades.map(t => parseInt(t.time, 10)).filter(n => !isNaN(n)).sort((a,b)=>a-b);
            const span = times[times.length - 1] - times[0];
            const avgMs = times.length > 1 && span > 0 ? span / (times.length - 1) : null;
            // live: true marks this sample as not yet folded into _afOcCycleHistory (see the
            // comment above) — _afOcAccumSkew's OCS callers use this flag to fold a fresh
            // single-symbol sample into the accumulated total exactly once, without double-
            // counting once a later batch fetch pushes the same ticker into history for real.
            return { bc, sc, avgMs, n: trades.length, live: true };
          } catch(_) { return null; }
        },

        // Following: no own OC fetch runs (see the guards in _ocFetchBatch/_ocFetchSingle), so
        // pull whatever the leader most recently published instead of leaving afOcResults/
        // _afOcCycleHistory to go stale forever.
        // Dedupes on the shared snapshot's own ts so a cycle already folded in doesn't get
        // pushed into history twice across repeated calls within the same scan.
        _ocSeedFromShared() {
          const shared = this._sharedRead?.('ocResults');
          if (!shared?.data) return;
          this.afOcResults = shared.data;
          if (shared.ts && shared.ts !== this._afOcLastSharedTs) {
            this._afOcLastSharedTs = shared.ts;
            const histEntry = { id: (this._afOcCycleCounter = (this._afOcCycleCounter % 99) + 1), ts: shared.ts, results: Object.entries(shared.data).map(([sym, r]) => ({ sym, ...r })) };
            this._afOcCycleHistory.push(histEntry);
            if (this._afOcCycleHistory.length > 25) this._afOcCycleHistory = this._afOcCycleHistory.slice(-25);
            this._ocPersistHistory();
          }
        },

        // Shared by init() (loading from localStorage) and afImport() (loading from a file)
        // so a corrupt/legacy history can't slip in through one path just because the other
        // path was hardened first. Drops records from the pre-redesign OC system (which
        // counted a single raw order number per ticker, before the current buy/sell split —
        // those entries lack bc/sc and only ever rendered as meaningless zero-fill bars/chips),
        // rejects malformed or NaN timestamps, and caps to the same 25-cycle window as the
        // liquidation history.
        _ocSanitizeHistory(raw) {
          const rawCount = (raw || []).reduce((n,c) => n + (Array.isArray(c?.results) ? c.results.length : 0), 0);
          const cleaned = (raw || [])
            .filter(c => c && Array.isArray(c.results) && typeof c.ts === 'number' && !isNaN(c.ts))
            .map(c => ({ ...c, results: c.results.filter(r => r && typeof r.sym === 'string' && (
              (typeof r.bc === 'number' && !isNaN(r.bc) && typeof r.sc === 'number' && !isNaN(r.sc)) ||
              (typeof r.vol === 'number' && !isNaN(r.vol)) ||
              (typeof r.oi === 'number' && !isNaN(r.oi))
            )) }))
            .filter(c => c.results.length > 0)
            .slice(-25);
          const cleanCount = cleaned.reduce((n,c) => n + c.results.length, 0);
          return { cleaned, purged: rawCount - cleanCount };
        },

        _ocPersistHistory() {
          try {
            this._afOcCycleHistory = trimToByteCap(this._afOcCycleHistory);
            localStorage.setItem(ASH_OC_HIST_KEY, JSON.stringify(this._afOcCycleHistory));
          } catch(_) {}
        },

        // Per-mode chart settings — 'oc' (order interval, seconds, lower=busier, capped so a
        // handful of illiquid tickers don't stretch the axis) vs 'vol'/'io' (raw USDT value,
        // higher=busier, uncapped — there's no equivalent outlier problem since these are
        // already the population-relative criteria, not a per-ticker ratio).
        _afOcModeCfg() {
          const mode = this._afOcViewMode || 'oc';
          const fmtCompact = v => { if (v==null) return 'n/a'; const a=Math.abs(v); if (a>=1e9) return '$'+(v/1e9).toFixed(2)+'B'; if (a>=1e6) return '$'+(v/1e6).toFixed(2)+'M'; if (a>=1e3) return '$'+(v/1e3).toFixed(1)+'K'; return '$'+v.toFixed(0); };
          if (mode === 'vol') return { label: 'VOLUME SAMPLE', color: '96,210,255', cap: null, getVal: r => r.vol, fmt: fmtCompact, higherIsBusier: true, avgLabel: 'Avg volume' };
          if (mode === 'io')  return { label: 'OPEN INTEREST SAMPLE', color: '190,130,230', cap: null, getVal: r => r.oi, fmt: fmtCompact, higherIsBusier: true, avgLabel: 'Avg open interest' };
          return { label: 'ORDER INTERVAL SAMPLE', color: '200,160,80', cap: 12, getVal: r => r.avgMs != null ? r.avgMs / 1000 : null, fmt: v => v >= 100 ? v.toFixed(0) + 's' : v.toFixed(1) + 's', higherIsBusier: false, avgLabel: 'Avg order interval' };
        },
        _afOcChartSvg(shown) {
          if (!shown) return '';
          const mc = this._afOcModeCfg();
          // Defensive: a stale/partial write (e.g. a crash mid-save) or leftover pre-redesign
          // entries in localStorage can leave a history array with malformed shapes. Filter to
          // well-formed entries only so one bad record can't corrupt the whole render.
          const history = (this._afOcCycleHistory || []).filter(c => c && Array.isArray(c.results) && typeof c.ts === 'number' && !isNaN(c.ts)).sort((a,b)=>a.ts-b.ts);
          if (!history.length) return '';
          const cycleW=28, dayGapW=38, H=80, padL=28, padB=16, padT=6, padR=4;
          const plotH = H - padT - padB;
          const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          const dLabel = _d => isNaN(_d.getTime()) ? '?' : MONTHS[_d.getMonth()]+' '+_d.getDate();
          const localDay = ts => { const d=new Date(ts); return isNaN(d.getTime()) ? 0 : d.getFullYear()*1000+d.getMonth()*32+d.getDate(); };
          const xPos=[]; let xCur=padL;
          for (let ci=0;ci<history.length;ci++) { if (ci>0&&localDay(history[ci].ts)!==localDay(history[ci-1].ts)) xCur+=dayGapW; xPos.push(xCur); xCur+=cycleW; }
          const W = xCur + padR;
          const passesCap = v => v != null && (mc.cap == null || v <= mc.cap);
          let maxVal=0;
          for (const c of history) for (const r of c.results) { const v = mc.getVal(r); if (!passesCap(v)) continue; maxVal=Math.max(maxVal,v); }
          if (maxVal<=0) maxVal=1;
          maxVal *= 1.3;
          const allVals=history.flatMap(c=>c.results.filter(r=>r&&passesCap(mc.getVal(r))).map(r=>mc.getVal(r)));
          const avgRef=allVals.length?allVals.reduce((a,b)=>a+b,0)/allVals.length:0;
          // Plain value scale: 0 at the bottom, maxVal at the top — a higher value plots
          // taller, same convention as every other bar chart in this panel.
          const yVal=v=>padT+plotH-(v/maxVal)*plotH;
          const fmt = mc.fmt;
          const _ow=padL+6,_oh=H+8,_ax=padL+6;
          let _yAxis=`<svg width="${_ow}" height="${_oh}" style="display:block"><line x1="${_ax}" y1="${4+padT}" x2="${_ax}" y2="${4+padT+plotH}" stroke="rgba(255,255,255,.12)" stroke-width="0.5"/>`;
          for (const f of [0,0.25,0.5,0.75,1]) { const v=maxVal*f; const y=(4+yVal(v)).toFixed(1); _yAxis+=`<text x="${_ax-3}" y="${(parseFloat(y)+3).toFixed(1)}" fill="rgba(255,255,255,.3)" font-size="7" font-family="monospace" text-anchor="end">${fmt(v)}</text>`; }
          this._afOcYAxisHtml = _yAxis+'</svg>';
          if (avgRef>maxVal*0.05&&avgRef<maxVal*0.95) this._afOcAvgYPx=4+yVal(avgRef); else this._afOcAvgYPx=null;
          const grids=[0,0.25,0.5,0.75,1].map(f=>{const v=maxVal*f;const y=yVal(v).toFixed(1);return `<line x1="${padL}" y1="${y}" x2="${(W-padR).toFixed(1)}" y2="${y}" stroke="rgba(255,255,255,.05)" stroke-width="0.5"/>`;}).join('');
          const CLR=`rgba(${mc.color},`;
          // Highlighted cycle falls back to the actual latest cycle when nothing is pinned —
          // see the matching HIGHLIGHTED CYCLE section below, fed by _afOcDisplayedResults().
          const displayedTs = this._afOcHighlightedCycleTs ?? history[history.length - 1].ts;
          let bars='';
          history.forEach((cycle,ci)=>{
            const cx=xPos[ci]; const results=cycle.results.filter(r=>r&&passesCap(mc.getVal(r))); const n=results.length;
            const cycleMean=n?results.reduce((s,r)=>s+mc.getVal(r),0)/n:0;
            const bw=Math.max(1,Math.min(4,cycleW*0.9/Math.max(1,n)));
            // Hitbox — sits under the bars and spans the full cycle column (not just the bars
            // themselves, since a cycle with no qualifying tickers has no bars to click),
            // doubling as the highlight backdrop for whichever cycle is currently displayed.
            const isDisplayed = cycle.ts === displayedTs;
            bars += `<rect class="afoc-cycle-hit" data-oc-cycle-ts="${cycle.ts}" x="${cx.toFixed(1)}" y="${padT}" width="${cycleW.toFixed(1)}" height="${plotH.toFixed(1)}" fill="${isDisplayed ? CLR+'.10)' : 'transparent'}" pointer-events="all" style="cursor:pointer"/>`;
            results.forEach((r,ri)=>{
              const x=cx+(ri/n)*cycleW*0.9;
              const v=mc.getVal(r);
              // Direction of "busier"/more-notable flips per mode — lower interval = faster
              // order flow (oc), higher volume/OI = more notable (vol/io) — matching the same
              // above/below-average direction the va/ioa criteria themselves use.
              const busier=cycleMean>0&&(mc.higherIsBusier?v>=cycleMean:v<=cycleMean);
              const alpha=busier?.85:.35;
              const h=Math.max(1,(padT+plotH)-yVal(v));
              const y=(padT+plotH)-h;
              bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${CLR}${alpha})"/>`;
            });
            if (ci>0 && localDay(history[ci].ts)!==localDay(history[ci-1].ts)) {
              const gx=cx-dayGapW/2;
              const d=new Date(history[ci].ts);
              bars+=`<line x1="${gx.toFixed(1)}" y1="${padT}" x2="${gx.toFixed(1)}" y2="${(padT+plotH).toFixed(1)}" stroke="${CLR}.4)" stroke-dasharray="2 2"/>`;
              bars+=`<text x="${gx.toFixed(1)}" y="${H-2}" fill="${CLR}.65)" font-size="7" font-family="monospace" text-anchor="middle">${dLabel(d)}</text>`;
            } else if (ci>0) {
              bars+=`<line x1="${cx.toFixed(1)}" y1="${padT}" x2="${cx.toFixed(1)}" y2="${(padT+plotH).toFixed(1)}" stroke="rgba(255,255,255,.08)" stroke-width="0.5"/>`;
            }
            const d=new Date(cycle.ts);
            const label=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            bars+=`<text x="${(cx+cycleW/2).toFixed(1)}" y="${H-2}" fill="rgba(255,255,255,.3)" font-size="7" font-family="monospace" text-anchor="middle">${label}</text>`;
          });
          return `<svg width="${W}" height="${H}" style="display:block">`
            + `<line x1="${padL}" y1="${(padT+plotH).toFixed(1)}" x2="${W-padR}" y2="${(padT+plotH).toFixed(1)}" stroke="rgba(255,255,255,.12)" stroke-width="0.5"/>`
            + grids + bars
            + `</svg>`;
        },

        // Picks the newest cycle by timestamp rather than array position — see the matching
        // comment in init() on why array-position ("last pushed") can go stale if two OC
        // fetches ever overlap.
        _afOcLatestCycle() {
          const hist = this._afOcCycleHistory || [];
          return hist.reduce((a,c) => (!a || c.ts > a.ts) ? c : a, null);
        },
        // Resolves which cycle's results the chart's summary/chip list show — the pinned cycle
        // if one was clicked and is still in history, else the actual latest (default). Mirrors
        // _liqDisplayedResults(); a pinned cycle can age out of _afOcCycleHistory (capped at 25)
        // without an explicit reset, so this falls back rather than showing a stale/empty list.
        _afOcDisplayedCycle() {
          const hist = this._afOcCycleHistory || [];
          const hi = this._afOcHighlightedCycleTs;
          if (hi != null) {
            const hit = hist.find(c => c.ts === hi);
            if (hit) return hit;
          }
          return this._afOcLatestCycle();
        },
        _afOcDisplayedCycleLabel() {
          const last = this._afOcLatestCycle();
          const hi = this._afOcHighlightedCycleTs;
          if (hi == null || !last) return '';
          if (hi === last.ts) return '';
          const hist = this._afOcCycleHistory || [];
          const hit = hist.find(c => c.ts === hi);
          if (!hit) return '';
          const d = new Date(hit.ts);
          return ' · ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        },
        _afOcSummaryText(shown) {
          if (!shown) return '';
          const mode = this._afOcViewMode || 'oc';
          const last = this._afOcDisplayedCycle();
          const results = (last?.results || []).filter(r => r && typeof r.sym === 'string');
          if (!results.length) return '';
          if (mode !== 'oc') {
            const field = mode === 'vol' ? 'vol' : 'oi';
            const withField = results.filter(r => r[field] != null);
            if (!withField.length) return '';
            return `${withField.length} ticker${withField.length===1?'':'s'} sampled${this._afOcDisplayedCycleLabel()}`;
          }
          const bc = results.reduce((s,r)=>s+(r.bc||0),0);
          const sc = results.reduce((s,r)=>s+(r.sc||0),0);
          const total = bc + sc;
          if (!total) return '';
          const buyPct = (bc/total*100).toFixed(0), sellPct = (sc/total*100).toFixed(0);
          return `${total} order${total===1?'':'s'} sampled · ${buyPct}% buy / ${sellPct}% sell · ${results.length} ticker${results.length===1?'':'s'}${this._afOcDisplayedCycleLabel()}`;
        },
        // Full-window population average for MIC's va/ioa criteria — same dedup-to-latest-per-
        // symbol pattern as _afOcWindowAvgMs, over the same tethered _afOcCycleHistory, just
        // averaging 'vol' or 'oi' instead of 'avgMs'.
        _afVolIoWindowAvg(field) {
          const bySym = {};
          for (const cycle of (this._afOcCycleHistory || [])) {
            if (!cycle || !Array.isArray(cycle.results)) continue;
            for (const r of cycle.results) {
              if (!r || typeof r.sym !== 'string' || r[field] == null) continue;
              if (!bySym[r.sym] || cycle.ts > bySym[r.sym].ts) bySym[r.sym] = { val: r[field], ts: cycle.ts };
            }
          }
          const vals = Object.values(bySym).map(v => v.val);
          if (!vals.length) return null;
          return vals.reduce((s, v) => s + v, 0) / vals.length;
        },
        // Accumulated buy/sell order-count skew for a single ticker across the ENTIRE retained
        // _afOcCycleHistory window (same 25-cycle cap as _afOcWindowAvgMs) — sums bc/sc from
        // every cycle that sampled this ticker instead of reading only the most recent batch's
        // counts, so OCS reflects the ticker's own accumulated order flow over the sample
        // window rather than one 100-trade snapshot. A ticker sampled across more cycles builds
        // a deeper, steadier read; a ticker that just entered the pool starts thin, same
        // cold-start behavior as OCX's window average. Returns null if the ticker has no
        // sampled cycles at all yet.
        _afOcAccumSkew(sym) {
          let bc = 0, sc = 0, n = 0;
          for (const cycle of (this._afOcCycleHistory || [])) {
            if (!cycle || !Array.isArray(cycle.results)) continue;
            const r = cycle.results.find(x => x && x.sym === sym && (typeof x.bc === 'number' || typeof x.sc === 'number'));
            if (!r) continue;
            bc += r.bc || 0; sc += r.sc || 0; n++;
          }
          return n ? { bc, sc } : null;
        },
        // Full-window population average for MIC's OCX criterion: every ticker's most recent
        // avgMs across the ENTIRE retained _afOcCycleHistory (not just the current cycle's
        // batch), deduped to one entry per symbol — the latest one seen. Shared by both the
        // scan-time pool and the live liq-trigger path (which reads this same history but never
        // writes to it — see _ocFetchSingle) so a ticker's fast/slow classification means the
        // same thing regardless of which path resolved it. No minimum-ticker floor — a thin or
        // cold-start window is intentionally left unstable rather than gated off.
        _afOcWindowAvgMs() {
          const bySym = {};
          for (const cycle of (this._afOcCycleHistory || [])) {
            if (!cycle || !Array.isArray(cycle.results)) continue;
            for (const r of cycle.results) {
              if (!r || typeof r.sym !== 'string' || r.avgMs == null) continue;
              if (!bySym[r.sym] || cycle.ts > bySym[r.sym].ts) bySym[r.sym] = { avgMs: r.avgMs, ts: cycle.ts };
            }
          }
          const vals = Object.values(bySym).map(v => v.avgMs);
          if (!vals.length) return null;
          return vals.reduce((s, v) => s + v, 0) / vals.length;
        },
        // Mean seconds/order across every ticker in the displayed cycle — moved here from the
        // old Volume History chart's OC overlay line, which got scrapped along with the rest
        // of that chart. Simple average across the cycle's tickers, not an hourly bucket mean.
        _afOcAvgIntervalSec(shown) {
          if (!shown || (this._afOcViewMode || 'oc') !== 'oc') return null;
          const last = this._afOcDisplayedCycle();
          const withInterval = (last?.results || []).filter(r => r && r.avgMs != null);
          if (!withInterval.length) return null;
          return withInterval.reduce((s,r) => s + r.avgMs, 0) / withInterval.length / 1000;
        },
        // Mode-aware counterpart for vol/io — mirrors _afOcAvgIntervalSec's role but formats
        // via _afOcModeCfg() instead of assuming seconds.
        _afOcAvgValueText(shown) {
          if (!shown) return null;
          const mode = this._afOcViewMode || 'oc';
          if (mode === 'oc') return null;
          const mc = this._afOcModeCfg();
          const last = this._afOcDisplayedCycle();
          const withField = (last?.results || []).filter(r => r && mc.getVal(r) != null);
          if (!withField.length) return null;
          const avg = withField.reduce((s,r) => s + mc.getVal(r), 0) / withField.length;
          return `${mc.avgLabel}: ${mc.fmt(avg)}`;
        },
        _afOcInfoHtml(shown) {
          if (!shown) return '';
          const mode = this._afOcViewMode || 'oc';
          const last = this._afOcDisplayedCycle();
          const results = (last?.results || []).filter(r => r && typeof r.sym === 'string');
          if (!results.length) return '';
          if (mode !== 'oc') {
            const mc = this._afOcModeCfg();
            const withField = results.filter(r => mc.getVal(r) != null);
            if (!withField.length) return '';
            const mean = withField.reduce((s,r)=>s+mc.getVal(r),0)/withField.length;
            return withField.map(r=>{
              const v = mc.getVal(r);
              const aboveAvg = v >= mean;
              const clr=aboveAvg?`rgba(${mc.color},.9)`:'var(--text-lo)';
              const bdr=aboveAvg?`rgba(${mc.color},.4)`:'rgba(255,255,255,.1)';
              const bg=aboveAvg?`rgba(${mc.color},.06)`:'transparent';
              return `<span title="${r.sym}: ${mc.fmt(v)}" style="font-family:var(--mono);font-size:8px;padding:1px 5px;border-radius:2px;border:1px solid ${bdr};background:${bg};color:${clr};white-space:nowrap">${r.sym.replace('USDT','')} <span style="opacity:.65">${mc.fmt(v)}</span></span>`;
            }).join('');
          }
          const mean=results.reduce((s,r)=>s+(r.bc||0)+(r.sc||0),0)/results.length;
          return results.map(r=>{
            const total=(r.bc||0)+(r.sc||0); if(!total) return '';
            const aboveAvg=total>=mean;
            const clr=aboveAvg?'rgba(255,150,80,.9)':'var(--text-lo)';
            const bdr=aboveAvg?'rgba(255,150,80,.4)':'rgba(255,255,255,.1)';
            const bg=aboveAvg?'rgba(255,150,80,.06)':'transparent';
            const avgSec = r.avgMs!=null ? (r.avgMs/1000).toFixed(1)+'s/order' : 'n/a';
            return `<span title="${r.sym}: ${r.bc||0} B-fills / ${r.sc||0} S-fills · ${avgSec}" style="font-family:var(--mono);font-size:8px;padding:1px 5px;border-radius:2px;border:1px solid ${bdr};background:${bg};color:${clr};white-space:nowrap">${r.sym.replace('USDT','')} <span style="opacity:.65">B${r.bc||0} S${r.sc||0}</span><span style="opacity:.4;font-size:7px"> ${avgSec}</span></span>`;
          }).join('');
        },

      });
    },
  };
})();
</script>
