          this._afSampleResolving = true;
          try {
            const now = Date.now(), H = 3600000, grace = this._afSampleDeadlineMs();
            const keep = [];
            let changed = false;
            for (const p of st.pending) {
              if (now < p.ts + H) { keep.push(p); continue; }
              const expired = now > p.ts + H + grace;
              const start = Math.floor(p.ts / 60000) * 60000, end = start + H - 1;
              const todo = p.recs.filter(r => typeof r.fh !== 'number');
              for (let i = 0; i < todo.length && !expired; i += 10) {
                await Promise.all(todo.slice(i, i + 10).map(async r => {
                  try {
                    const res = await this._qFetch(`${this.base}/v5/market/kline?category=linear&symbol=${r.s}&interval=1&start=${start}&end=${end}&limit=60`);
                    const list = (await res.json())?.result?.list || [];
                    if (list.length < 50) return;
                    // rows: [start, open, high, low, close, ...], newest first
                    const o = parseFloat(list[list.length - 1][1]), c = parseFloat(list[0][4]);
                    let hi = -Infinity, lo = Infinity;
                    for (const k of list) { const h = parseFloat(k[2]), l = parseFloat(k[3]); if (h > hi) hi = h; if (l < lo) lo = l; }
                    if (o > 0 && !isNaN(c) && isFinite(hi) && isFinite(lo)) { r.f = (c - o) / o * 100; r.fh = (hi - o) / o * 100; r.fl = (lo - o) / o * 100; }
                  } catch (_) {}
                }));
              }
              const done = p.recs.filter(r => typeof r.f === 'number');
              const complete = p.recs.every(r => typeof r.fh === 'number');
              if (complete || expired) {
                if (done.length >= 5) {
                  // Three outcomes per sample — close, high and low of the same [ts, ts+1h) window — each demeaned against its own population mean.
                  for (const key of ['f', 'fh', 'fl']) {
                    const set = done.filter(r => typeof r[key] === 'number');
                    if (!set.length) continue;
                    const mean = set.reduce((a, r) => a + r[key], 0) / set.length;
                    for (const r of set) st.obs.push({ t: p.ts, s: r.s, k: 'f', y: +(r[key] - mean).toFixed(4), r: +r[key].toFixed(4), c: r.c });
                  }
                  if (this.cfg.afConcEnabled) this._afConcQueue(done, now);
                } else if (expired) {
                  this.log(`[ASH] Sample Scoring: snapshot from ${new Date(p.ts).toLocaleTimeString()} missed its ${Math.round(grace / 60000)}min resolve window and was dropped.`, 'warn');
                }
                changed = true;
              } else { keep.push(p); changed = true; }
            }
            st.pending = keep;
            if (changed) { this._afSampleSaveSoon(); this._afExtremityBuild(); }
          } finally { this._afSampleResolving = false; }
        },
        // The Sample Scoring build — replaces _afExtremityBuild's closed-trade walk when enabled. Publishes the
        // same outputs: afDialCutoffs/afDialSampleCounts (own cutoffs, from the sample magnitudes), the
        // flat rank map MIC/MIW read, the two-bucket scoreboard, and the per-bucket overall means that
        // decide the favored side.
        _afSampleBuild() {
          const st = this._afSampleStore || { obs: [], pending: [] };
          const kind = this._afSampleKind();
          const dir = this._afSampleDir();
          const minSamples = Math.max(3, this.cfg.afExtremityMinSamples || 3);
          const splitPct = Math.min(0.49, Math.max(0.01, (this.cfg.afExtremitySplitPct ?? 30) / 100));
          let obs = st.obs.filter(o => o && o.k === kind && Array.isArray(o.c) && typeof o.y === 'number');
          if (kind === 'n') {
            // The hour candle is shared by every cycle inside a clock hour — keep only each ticker's latest
            // observation per hour so one move isn't counted once per scan.
            const latest = new Map();
            for (const o of obs) { const k = o.s + '|' + Math.floor(o.t / 3600000); const p = latest.get(k); if (!p || o.t > p.t) latest.set(k, o); }
            obs = [...latest.values()];
          }
          const parsed = [];
          const pool = {};
          for (const o of obs) {
            const items = [];
            for (const tag of o.c) {
              const info = dialInfo(collapseCrit(tag));
              if (!info || (kind === 'n' && info.family === 'lpa')) continue;
              const m = tag.match(/(-?\d+)$/);
              const mag = m ? Math.abs(parseInt(m[1], 10)) : 0;
              const dk = info.family + '|' + info.pole;
              (pool[dk] ||= []).push(mag);
              items.push({ dk, mag });
            }
            if (items.length) parsed.push({ edge: dir * o.y, raw: (typeof o.r === 'number' && !isNaN(o.r)) ? dir * o.r : null, items });
          }
          const cutoffs = {};
          for (const [dk, mags] of Object.entries(pool)) {
            if (mags.length < minSamples) { cutoffs[dk] = null; continue; }
            const sorted = [...mags].sort((a, b) => a - b);
            cutoffs[dk] = sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * (1 - splitPct)))];
          }
          const bucket = { extreme: {}, lukewarm: {} };
          const tot = { extreme: { sum: 0, n: 0 }, lukewarm: { sum: 0, n: 0 } };
          const totA = { extreme: { sum: 0, n: 0, p: 0, q: 0 }, lukewarm: { sum: 0, n: 0, p: 0, q: 0 } }; // absolute (raw move in the bot's favor) — only obs that carry a raw move
          for (const p of parsed) for (const { dk, mag } of p.items) {
            const b = (cutoffs[dk] != null && mag >= cutoffs[dk]) ? 'extreme' : 'lukewarm';
            const s = (bucket[b][dk] ||= { sum: 0, n: 0, wins: 0, losses: 0 });
            s.sum += p.edge; s.n++; if (p.edge > 0) s.wins++; else s.losses++;
            tot[b].sum += p.edge; tot[b].n++;
            if (p.raw != null) { totA[b].sum += p.raw; totA[b].n++; if (p.raw > 0) totA[b].p += p.raw; else totA[b].q -= p.raw; }
          }
          const entryOf = b => ([dk, s]) => {
            const [family, pole] = dk.split('|');
            const proven = s.n >= minSamples;
            return { family, pole, key: dialDisplayKey(family, pole), pnl: proven ? s.sum / s.n : 0, wins: s.wins, losses: s.losses, n: s.n, hasHist: true, hasTrade: false };
          };
          const extreme = Object.entries(bucket.extreme).map(entryOf('extreme')).sort((a, b) => b.pnl - a.pnl);
          const lukewarm = Object.entries(bucket.lukewarm).map(entryOf('lukewarm')).sort((a, b) => b.pnl - a.pnl);
          const ranks = {}, dispStats = {};
          for (const e of extreme) {
            ranks[e.key] = e.pnl;
            dispStats[e.key] = { pnl: e.pnl, wins: e.wins, losses: e.losses, hasHist: true, hasTrade: false, cutoff: cutoffs[e.family + '|' + e.pole] ?? null, sampleCount: (pool[e.family + '|' + e.pole] || []).length };
          }
          this.afDialCutoffs = cutoffs;
          this.afDialSampleCounts = Object.fromEntries(Object.entries(pool).map(([k, v]) => [k, v.length]));
          this.micCollapsedSlotRanks = ranks;
          this.micCollapsedCritStats = dispStats;
          this.afScoreboard = Object.entries(dispStats).sort(([, a], [, b]) => b.pnl - a.pnl).map(([key, s]) => ({ key, ...s }));
          this.afLukewarmScoreboard = { extreme, lukewarm };
          const mean = t => (t.n ? t.sum / t.n : null);
          const share = t => (t.p + t.q > 0 ? (t.p - t.q) / (t.p + t.q) : null); // signed favorable share of raw move, -1..+1
          this.afSampleBucketMeans = { extreme: mean(tot.extreme), lukewarm: mean(tot.lukewarm), nE: tot.extreme.n, nL: tot.lukewarm.n, aE: mean(totA.extreme), aL: mean(totA.lukewarm), nAE: totA.extreme.n, nAL: totA.lukewarm.n, sE: share(totA.extreme), sL: share(totA.lukewarm) };
          this._afSampleTrackWx();
        },
        // Peak / bottom of the weather value (favored bucket's mean raw move in the bot's favor, stored in pp of price
        // move so it survives notional/leverage changes; shown in $ via _afSampleWeather's conversion). Recorded only
        // once the side has enough raw-carrying samples (max(min samples, 10)) so a 3-sample fluke can't pin an
        // extreme forever. Lives in the sample store: cleared with the samples, shared leader -> follower.
        _afSampleTrackWx() {
          const m = this.afSampleBucketMeans, st = this._afSampleStore;
          if (!m || !st) return;
          const lw = this._afLukewarmFavoredSide() === 'lukewarm';
          const a = lw ? m.aL : m.aE, n = lw ? m.nAL : m.nAE;
          if (a == null || n < Math.max(10, this.cfg.afExtremityMinSamples || 3)) return;
          const w = st.wx || (st.wx = { hi: null, lo: null, hiT: 0, loT: 0, sHi: null, sLo: null });
          const now = Date.now();
          if (w.hi == null || a > w.hi) { w.hi = a; w.hiT = now; }
          if (w.lo == null || a < w.lo) { w.lo = a; w.loT = now; }
          const sv = lw ? m.sL : m.sE;
          if (sv != null) { if (w.sHi == null || sv > w.sHi) w.sHi = sv; if (w.sLo == null || sv < w.sLo) w.sLo = sv; }
        },
        // Market weather (Sample Scorer headline): the favored bucket's mean ABSOLUTE edge — the raw 1hr move in this
        // bot's favor, not demeaned against the population — converted to dollars on one base position
        // (notional x move%), so it reads as "what an entry here would have made". Scale: +/- the entry TP target in
        // dollars (base margin x TP ROI%), i.e. a mean move large enough to hit TP is full scale. Observations stored
        // before raw moves were recorded carry no raw value and are left out until fresh ones accumulate.
        // `rel` is the old relative (demeaned) edge in pp, kept for the tooltip. `s` / `share` are the relative headline: the
        // favorable share of this side's raw move, P/(P+Q) (share, 0..1, 0.5 = even) and its signed form (P-Q)/(P+Q) (s, -1..+1, same
        // sign as `value`); sHi / sLo are the best / worst s recorded. Target Halving scales off s / sHi.
        _afSampleWeather(side) {
          const m = this.afSampleBucketMeans;
          if (!m) return null;
          const lw = side === 'lukewarm';
          const a = lw ? m.aL : m.aE, n = lw ? m.nAL : m.nAE;
          const tpRoi = Number(this.cfg.binaryModeEnabled ? (this.cfg.binaryTpPct ?? 18) : this.cfg.entryTpRoi) || 18;
          const notional = this.cfg.minNotional || 6;
          const cap = (notional / (this.cfg.leverage || 6)) * tpRoi / 100;
          const min = Math.max(3, this.cfg.afExtremityMinSamples || 3);
          const w = this._afSampleStore?.wx;
          const ok = a != null && n >= min, sv = lw ? m.sL : m.sE;
          return { s: (ok && sv != null) ? sv : null, share: (ok && sv != null) ? (1 + sv) / 2 : null, sHi: w?.sHi ?? null, sLo: w?.sLo ?? null, value: ok ? notional * a / 100 : null, cap, tpRoi, n, rel: m[side], hi: w?.hi != null ? notional * w.hi / 100 : null, lo: w?.lo != null ? notional * w.lo / 100 : null, hiT: w?.hiT || 0, loT: w?.loT || 0 };
        },
        // Threshold a criterion's rank must fall to for Slot Blocking: dollars of base margin for the
        // reactive scorer, percentage points of edge for Sample Scoring. MIC/MIW read this too.
        _afBlockThreshold() {
          const pct = (this.cfg.micSlotBlockPct ?? 25) / 100;
          if (this.cfg.afSampleScoringEnabled) return pct;
          return ((this.cfg.minNotional || 6) / (this.cfg.leverage || 6)) * pct;
        },

        // Which side Lukewarm Scoring currently favors — whichever bucket's total $ (summed
        // across every family in it) is ahead. This is what _afExtremityVeto actually targets:
        // no more manual Lukewarm Targeting toggle, the system re-decides for itself every time
        // _afExtremityBuild runs, off the same scoreboard the panel shows. Ties (including
        // 0 vs 0, before either bucket has real data) default to 'extreme' — the original,
        // always-avoid-lukewarm behavior, until the data actually says otherwise.
        _afLukewarmFavoredSide() {
          const board = this.afLukewarmScoreboard || { extreme: [], lukewarm: [] };
          const sum = arr => arr.reduce((a, s) => a + s.pnl, 0);
          if (this.cfg.afSampleScoringEnabled) {
            // Sample Scoring: compare the buckets' overall MEAN edge (per-observation), not their totals —
            // the extreme bucket is ~25% of readings by construction, so totals would always favor lukewarm.
            const m = this.afSampleBucketMeans, min = Math.max(3, this.cfg.afExtremityMinSamples || 3);
            if (m && m.extreme != null && m.lukewarm != null && m.nE >= min && m.nL >= min) return m.lukewarm > m.extreme ? 'lukewarm' : 'extreme';
            return 'extreme';
          }
          return sum(board.lukewarm) > sum(board.extreme) ? 'lukewarm' : 'extreme';
        },
        // Overall veto — "explicitly avoid any ticker exhibiting values from the LOSING side of
        // Lukewarm Scoring". Counts, across every dial-eligible criterion the ticker actually
        // exhibits, what share classifies as the non-favored side against the current cutoffs;
        // an unproven dial (below afExtremityMinSamples) always counts against the ticker here,
        // same as a genuinely non-favored reading. Vetoes once that share reaches
        // afLukewarmRatioPct (default 70%). Favored side comes from _afLukewarmFavoredSide —
        // see there for how it's decided and how the default (favor extreme) applies before
        // there's enough data either way.
        _afExtremityVeto(annotCrits) {
          if (!this.cfg.afExtremityEnabled) return false;
          const cutoffs = this.afDialCutoffs || {};
          const favorLukewarm = this._afLukewarmFavoredSide() === 'lukewarm';
          let total = 0, against = 0;
          for (const c of (annotCrits || [])) {
            const key = collapseCrit(c);
            const info = dialInfo(key);
            if (!info) continue;
            total++;
            if (!!BARE_DIAL_TAGS[key]) { if (favorLukewarm) against++; continue; } // no gradation — always extreme, so counts against a lukewarm-favoring veto
            const m2 = c.match(/(-?\d+)$/);
            const mag = m2 ? Math.abs(parseInt(m2[1], 10)) : 0;
            const cutoff = cutoffs[info.family + '|' + info.pole];
            const isExtreme = cutoff != null && mag >= cutoff;
            if (favorLukewarm ? isExtreme : !isExtreme) against++;
          }
          if (!total) return false;
          const againstPct = against / total * 100;
          return againstPct >= (this.cfg.afLukewarmRatioPct ?? 70);
        },
        // Extremity Re-Evaluation (secondary toggle, off by default). At the end of every
        // scan, re-derives each open position's own qualifying criteria against the CURRENT
        // dial cutoffs and closes it once it crosses the same lukewarm-ratio bar it had to
        // clear to open in the first place — held to the same standard throughout its life,
        // not just at entry. Deliberately reads only data this cycle already cached (bulk
        // ticker snapshot + MIC's live OC cache) rather than firing fresh fetches of its
        // own, so it rides the existing scan cadence instead of adding load on top of the
        // scan scheduler. A symbol with no fresh-enough cached tick this cycle is skipped
        // rather than forcing a fetch.
        async _afExtremityReEval() {
          if (!this.cfg.afExtremityEnabled || !this.cfg.afExtremityReEvalEnabled) return;
          const snapshot = [...(this.positions || [])];
          for (const pos of snapshot) {
            if (!pos || !pos.symbol) continue;
            const crits = pos._micCriteria || pos._becCriteria || pos._ldcCriteria;
            if (!crits || !crits.length) continue;
            // Was calling the never-defined _micAnnotateLiveCrit — always fell through to
            // `?? c`, so Re-Eval was silently comparing each position's frozen entry snapshot
            // against itself and could never actually detect drift. Now reads the rolling
            // average built each scan by _afPositionCriteriaSample.
            const liveCrits = this._afPositionAvgCriteria(pos);
            if (this._afExtremityVeto(liveCrits)) {
              await this.pseudoClosePosition(pos, 'Ext-Rvl');
              this.log(`[ASH] ${pos.symbol} closed — Extremity Re-Evaluation: crossed onto the non-favored side.`, 'info');
            }
          }
        },
        // cfg.micEnabled is a persisted toggle value — it survives MIC being removed via the
        // Plugin Manager, so it alone can't tell us whether MIC is actually loaded right now.
        // Cross-check against the live plugin list so the MIC scorecard section disappears the
        // moment MIC is unloaded, not just when its own toggle happens to be off.
        _micPluginLoaded() {
          return (this._pluginList || []).some(p => p.id === 'multiindicator-chaser');
        },
        _becPluginLoaded() {
          return (this._pluginList || []).some(p => p.id === 'blindentry-chaser');
        },
        _ldcPluginLoaded() {
          return (this._pluginList || []).some(p => p.id === 'liquiddiver-chaser');
        },
        // Liquid-Diver's OC fetch is single-symbol, triggered per reactive entry — its samples are
        // almost always one bar of 0.0s and drown out a real batch-fetched sample. Only show the
        // chart when a plugin doing proper batch OC sampling (MIC or Blind-Entry) is loaded; if
        // Liquid-Diver is the only OC consumer, hide it rather than let its noise dominate.
        _ocChartViable() {
          return this._micPluginLoaded() || this._becPluginLoaded();
        },
        // Slot Blocking: true once a criterion's collapsed score is a loss beyond the
        // configured % of base margin. Auto-clears the moment the score recovers — no manual
        // reset needed. A lukewarm-classified occurrence never reaches this score at all (see
        // _afExtremityBuild) — blocking only ever reacts to a losing EXTREME, same standard
        // the dial applies everywhere else.
        _afIsCritBlocked(key) {
          if (!this.cfg.micSlotBlockEnabled) return false;
          const ranks = this.micCollapsedSlotRanks || {};
          const threshold  = this._afBlockThreshold();
          if (!this.cfg.micSlotBlockTags) return false;
          const blockable = (this.cfg.micSlotBlockCriteria || []).filter(Boolean);
          if (!blockable.length) return false;
          const esc = v => String(v).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const rx = new RegExp('^(' + blockable.map(esc).join('|') + ')[+-]?$');
          return rx.test(key) && (ranks[key] ?? 0) <= -threshold;
        },
        // Lukewarm Scoring pill UI (v1.80.0) — two big buckets, Extreme and Lukewarm, each
        // headlined by its aggregate $ record (which side has actually been more
        // profitable overall), with smaller per-criterion pills nested inside showing which
        // of fund/V-A/IO-A/OCS/OCX drove that bucket's result.
        _afExtremityHtml(shown) {
          if (!shown) return '';
          const board = this.afLukewarmScoreboard || { extreme: [], lukewarm: [] };
          if (!board.extreme.length && !board.lukewarm.length) return `<span style="font-size:9px;color:var(--text-lo)">${this.cfg.afSampleScoringEnabled ? 'No scored samples yet.' : 'No Extremity closes recorded yet.'}</span>`;
          // v1.87.1 — one chart at a time: only the side the bot currently favors is drawn.
          // One row of criterion duos (left bar = '+' end, right bar = '-' end); profit rises
          // above the zero line, loss hangs below it. Sized off the container, never wraps.
          const side = this._afLukewarmFavoredSide();
          const entries = board[side] || [];
          const accent = side === 'lukewarm' ? 'rgba(150,150,160,.45)' : 'rgba(255,150,80,.45)';
          const FAMS = ['fund', 'va', 'ioa', 'ocs', 'ocx', 'lta', 'lpa'];
          const byKey = {};
          for (const s of entries) byKey[s.key] = s;
          const sm = !!this.cfg.afSampleScoringEnabled;
          const fmt = sm ? (v => (v >= 0 ? '+' : '-') + Math.abs(v).toFixed(2) + 'pp') : (v => (v >= 0 ? '+$' : '-$') + Math.abs(v).toFixed(2));
          const GREEN = 'rgba(100,220,150,.9)', PURPLE = 'rgba(190,130,255,.95)';
          const total = (sm && this.afSampleBucketMeans && this.afSampleBucketMeans[side] != null) ? this.afSampleBucketMeans[side] : entries.reduce((a, s) => a + s.pnl, 0);
          const totalColor = total > 0 ? GREEN : total < 0 ? 'var(--short)' : 'var(--text-lo)';
          const wx = sm ? this._afSampleWeather(side) : null;
          const fmtUsd = v => (v >= 0 ? '+$' : '-$') + Math.abs(v).toFixed(3);
          const headVal = wx ? wx.value : (entries.length ? total : null);
          const headColor = headVal == null ? 'var(--text-lo)' : headVal > 0 ? GREEN : headVal < 0 ? 'var(--short)' : 'var(--text-lo)';
          const headTxt = headVal == null ? '—' : (wx ? (wx.share != null ? (wx.share * 100).toFixed(1) + '%' : '—') : fmt(headVal));
          const headTip = wx ? `Share of this side's raw 1hr move that went in the bot's favor (50% = even; gauge scaled to the best share recorded)${wx.value != null ? ' · mean ' + fmtUsd(wx.value) + ' on one base position' : ''}. n=${wx.n}${wx.rel != null ? ' · relative edge ' + fmt(wx.rel) : ''}${wx.value == null ? ' · waiting for samples with a raw move' : ''}` : '';
          let gauge = '';
          if (wx) {
            const sc = Math.max(wx.sHi || 0, -(wx.sLo || 0)) || 1, P = v => (((1 + v) / 2) * 100).toFixed(0) + '%';
            const pc = wx.s == null ? 0 : Math.max(-1, Math.min(1, wx.s / sc));
            const gl = pc >= 0 ? 50 : 50 + pc * 50, gw = Math.abs(pc) * 50;
            gauge = `<div title="${headTip}" style="margin-bottom:5px"><div style="position:relative;height:5px;background:rgba(255,255,255,.07);border-radius:3px"><div style="position:absolute;top:0;bottom:0;left:${gl}%;width:${gw}%;background:${headColor};border-radius:3px"></div><div style="position:absolute;top:-1px;bottom:-1px;left:50%;width:1px;background:rgba(255,255,255,.3)"></div></div><div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;color:var(--text-lo);margin-top:2px"><span>${P(-sc)}</span><span>50%</span><span>${P(sc)}</span></div><div title="Highest / lowest favorable share recorded (needs 10+ raw samples on the side). Cleared with the samples." style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;margin-top:3px"><span style="color:var(--short)">bottom ${wx.sLo != null ? P(wx.sLo) : '—'}</span><span style="color:${GREEN}">peak ${wx.sHi != null ? P(wx.sHi) : '—'}</span></div></div>`;
          }
          let maxAbs = 0.01;
          for (const f of FAMS) for (const p of ['+', '-']) maxAbs = Math.max(maxAbs, Math.abs((byKey[f + p] || { pnl: 0 }).pnl));
          const bar = key => {
            const s = byKey[key];
            const v = s ? s.pnl : 0;
            const blocked = this._afIsCritBlocked(key);
            const color = blocked ? PURPLE : v > 0 ? GREEN : v < 0 ? 'var(--short)' : 'var(--text-lo)';
            const h = v === 0 ? 0 : Math.max(3, Math.min(100, Math.abs(v) / maxAbs * 100));
            const tip = s ? (sm ? `${key}  ${fmt(v)} avg edge  ${s.wins}↑ ${s.losses}↓  n=${s.n}` : `${key}  ${fmt(v)}  ${s.wins}W ${s.losses}L`) : `${key}  ${sm ? 'no samples yet' : 'no closes yet'}`;
            const half = (up) => `<div style="flex:1 1 0;min-height:0;display:flex;align-items:${up ? 'flex-end' : 'flex-start'}">`
              + ((up ? v > 0 : v < 0) ? `<div style="width:100%;height:${h}%;background:${color};border-radius:${up ? '2px 2px 0 0' : '0 0 2px 2px'}"></div>` : '')
              + `</div>`;
            return `<div title="${tip}" style="flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column">${half(true)}${half(false)}</div>`;
          };
          const duo = f => `<div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px">`
            + `<div style="display:flex;gap:6%;width:72%;height:clamp(56px,20cqw,120px)">${bar(f + '+')}${bar(f + '-')}</div>`
            + `<div style="font-size:clamp(10px,4cqw,20px);line-height:1">${afCritEmoji(f + '+').replace(/[+\-<>]+$/, '')}</div>`
            + `</div>`;
          return `<div style="width:100%;container-type:inline-size;border:1px solid ${accent};border-radius:8px;padding:6px 8px;background:rgba(255,255,255,.02);box-sizing:border-box">`
            + `<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;font-family:var(--mono)">`
            + `<div style="font-size:8px;letter-spacing:1.5px;color:var(--text-lo)">${side === 'lukewarm' ? 'LUKEWARM' : 'EXTREME'}${sm ? ' · SAMPLES' : ''}</div>`
            + `<div title="${headTip}" style="font-size:11px;color:${headColor}"><b>${headTxt}</b></div>`
            + `</div>`
            + gauge
            + `<div style="position:relative">`
            + `<div style="position:absolute;left:0;right:0;top:calc(clamp(56px,20cqw,120px) / 2);height:1px;background:rgba(255,255,255,.12)"></div>`
            + `<div style="display:flex;flex-wrap:nowrap;gap:2%;width:100%">${FAMS.map(duo).join('')}</div>`
            + `</div>`
            + `</div>`;
        },
        _afCrossRead() {
          try {
            const raw = localStorage.getItem(CROSS_KEY);
            if (!raw) return [];
            const cut = Date.now() - CROSS_TTL;
            return (JSON.parse(raw).events || []).filter(e => e.ts >= cut);
          } catch(e) { return []; }
        },

        _afCrossWrite(kind, symbol, extra) {
          try {
            const events = this._afCrossRead();
            const rec = { ts: Date.now(), kind, source: 'chaser' };
            if (symbol) rec.symbol = symbol;
            if (extra) Object.assign(rec, extra);
            events.push(rec);
            localStorage.setItem(CROSS_KEY, JSON.stringify({ events: _trimCrossEvents(events) }));
          } catch(e) {}
        },

        async _afCheckCross() {
          if (!this.cfg.ashfallCrossEnabled) return;
          const fromWinter = this._afCrossRead().filter(e => e.source === 'winter');
          this.afCrossEvents = fromWinter.slice(-20);
        },

        // Renders the Cross tab's Partner Feed — every broadcast kind Winter can write to the
        // shared bus (cascade/sacrifice closes, DDH/glk start+end transitions, GC steps), not
        // just close reasons. Built for debugging Mutual DDH Lift and GC lift: the start/end
        // pairing and step numbers here are what actually decide whether a lift condition fires.
        _afCrossFeedHtml() {
          const meta = {
            'cascade':   { icon: '⚡', label: 'Cascade',          color: 'rgba(100,220,150,.9)' },
            'sacrifice': { icon: '🩸', label: 'Sacrifice',        color: 'rgba(255,80,80,.9)' },
            'ddh-start': { icon: '🧊', label: 'DDH Start',        color: 'rgba(120,180,255,.9)' },
            'ddh-end':   { icon: '🧊', label: 'DDH Lift',         color: 'rgba(120,180,255,.55)' },
            'glk-start': { icon: '🔒', label: 'Gains-Lock Start', color: 'rgba(220,180,100,.9)' },
            'glk-end':   { icon: '🔓', label: 'Gains-Lock Lift',  color: 'rgba(220,180,100,.55)' },
            'gc':        { icon: '📡', label: 'GC Step',          color: 'rgba(180,140,255,.9)' },
          };
          const events = (this.afCrossEvents || []).filter(e => meta[e.kind]).slice().reverse();
          if (!events.length) return '';
          const todayUTC = new Date().toISOString().slice(0, 10);
          return events.map(e => {
            const m = meta[e.kind];
            const d = new Date(e.ts);
            const dateUTC = d.toISOString().slice(0, 10);
            const t = (dateUTC !== todayUTC ? dateUTC.slice(5) + ' ' : '') + d.toISOString().slice(11, 19) + ' UTC';
            let detail = '';
            if (e.kind === 'gc') detail = (e.pnl != null ? '+' + e.pnl.toFixed(2) : '') + (e.step != null ? ' · step ' + e.step : '');
            else if (e.kind === 'cascade' || e.kind === 'sacrifice') detail = (e.count != null ? '×' + e.count + ' ' : '') + (e.pnl != null ? (e.pnl >= 0 ? '+' : '') + e.pnl.toFixed(2) : '') + (e.symbol ? ' ' + e.symbol : '');
            else if (e.symbol) detail = e.symbol;
            return `<div style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:8px;line-height:12px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04)">` +
              `<span>${m.icon}</span>` +
              `<span style="color:${m.color};font-weight:bold;white-space:nowrap">${m.label}</span>` +
              `<span style="color:var(--text-lo)">${detail}</span>` +
              `<span style="margin-left:auto;color:var(--text-lo);white-space:nowrap">${t}</span>` +
              `</div>`;
          }).join('');
        },


        _afDownload(filename, data) {
          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = filename;
          a.click();
          URL.revokeObjectURL(a.href);
        },
        afExportAll() {
          try {
            const extremityRaw = localStorage.getItem(EXTREMITY_KEY);
            const ocRaw        = localStorage.getItem(ASH_OC_HIST_KEY);
            this._afDownload(`ashfall-profile-${new Date().toISOString().slice(0, 10)}.json`, {
              exportedAt: Date.now(),
              extremity: extremityRaw ? JSON.parse(extremityRaw) : [],
              ocHistory: ocRaw ? JSON.parse(ocRaw) : [],
            });
          } catch(e) { this.log('[ASH] Export failed', 'warn'); }
        },

        afImport(e) {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              const d = JSON.parse(ev.target.result);
              // Accepts either the new 'extremity' field or a legacy 'scorecard' field from a
              // pre-Extremity export — the record shape (tag string + pnl) never changed, only
              // how it's interpreted, so an old export still populates the new store correctly.
              const importedScore = d.extremity || d.scorecard;
              if (Array.isArray(importedScore)) {
                try { localStorage.setItem(EXTREMITY_KEY, JSON.stringify(importedScore)); } catch(_) {}
              }
              if (Array.isArray(d.ocHistory)) {
                this._afOcCycleHistory = this._ocSanitizeHistory(d.ocHistory).cleaned;
                try { localStorage.setItem(ASH_OC_HIST_KEY, JSON.stringify(this._afOcCycleHistory)); } catch(_) {}
              }
              this.persist();
              this._afScoreTrim();
              this._afExtremityBuild();
              this.log(`[ASH] Profile imported — ${(importedScore||[]).length} Extremity records, ${(d.ocHistory||[]).length} OC cycles`, 'info');
            } catch(err) {
              this.log('[ASH] Import failed — file could not be parsed as a valid Ashfall profile', 'warn');
            }
            e.target.value = '';
          };
          reader.readAsText(file);
        },

        // Post-scan work. Runs as stage 'af-post' of the host's scan pipeline; on a host without
        // the pipeline the runScan wrap at the bottom of this plugin calls it right after the host's scan.
        async _afScanPost() {
          if (!this.cfg.ashfallEnabled) return;
          this._afCheckCross().catch(() => {});
          // Re-eval waits for the end of the scan (idle lane) so MIC's own fetches land first. Not awaited — closes can
          // take a while and the scan shouldn't wait on them.
          if (this._schIdle) this._schIdle('af-reeval', () => { this._afExtremityReEval().catch(() => {}); });
          else setTimeout(() => this._afExtremityReEval().catch(() => {}), 0);
          // afDialSamplePool now persists across restarts (loaded explicitly in init(), see
          // its declaration) — this call just keeps the panel in sync as new live samples land.
          // _afExtremityBuild() is otherwise only called on a close/config-change/import (see
          // runScan's own long-standing comment on why it's not on a timer), which used to leave
          // a freshly-loaded page showing every dial-based score as zero — anchors (sliq/bliq/etc,
          // no cutoff needed) unaffected — until the next real close happened to trigger a
          // rebuild, sometimes hours later. Once per scan is cheap enough (same call the toggles
          // above already make on every slider drag) and keeps the panel in sync with the pool
          // as it fills in, rather than requiring a load-bearing trade close just to redraw
          // existing history.
          this._afSampleAdopt?.();
          this._afSampleResolvePending().catch(() => {});
          // Coalesced: MIC rebuilds right before it decides entries and cancels this one; when MIC doesn't run
          // this fires at the end of the scan instead.
          if (this._schIdle) this._schIdle('af-build', () => this._afExtremityBuild());
          else this._afExtremityBuild();
        },

        async pseudoClosePosition(pos, reason, fillPrice) {
          const prevLen = this.closedTrades?.length ?? 0;
          await _origClose.call(this, pos, reason, fillPrice);
          if ((this.closedTrades?.length ?? 0) > prevLen) {
            // totalPnl (incl. funding) is what the base feeds its halt windows
            const t   = this.closedTrades[0];
            const pnl = t?.totalPnl ?? t?.pnl;
            // Gains Continuation (GC) — own rolling 6h PnL, independent of the host's Gains
            // Lock window. Stepped in afGcThresholdPct-of-base-margin increments (default 50% —
            // e.g. $0.50, $1.00, $1.50 at $1 base margin): every NEW step crossed upward fires a
            // one-shot 'gc' broadcast (high-water-mark — a step already fired never re-fires on
            // its own, only on a fresh climb after the window resets to ≤0). Read side is in the
            // 15s loop below.
            if (this.cfg.afGcEnabled && typeof pnl === 'number') {
              const _gcNow = Date.now();
              const _gcCut = _gcNow - 6 * 3600 * 1000;
              this.afGcWindow.push({ pnl, ts: _gcNow });
              this.afGcWindow = this.afGcWindow.filter(e => (e.ts || 0) >= _gcCut);
              const _gcRolling = this.afGcWindow.reduce((s, e) => s + (e.pnl || 0), 0);
              const _gcBaseMargin = (this.cfg.minNotional || 6) / (this.cfg.leverage || 6);
              const _gcStep = _gcBaseMargin * Math.max(0.01, (this.cfg.afGcThresholdPct ?? 50) / 100);
              const _gcStepIdx = Math.floor(_gcRolling / _gcStep);
              if (_gcStepIdx > this._afGcLastStep) {
                this._afGcLastStep = _gcStepIdx;
                if (this.cfg.ashfallCrossEnabled) this._afCrossWrite('gc', null, { pnl: _gcRolling, step: _gcStepIdx });
                this.log(`[ASH] 📡 Gains Continuation — 6hr rolling PnL +${_gcRolling.toFixed(2)} crossed step ${_gcStepIdx} (+${_gcStep.toFixed(2)} USDT increments) — broadcast to Permafrost.`, 'success');
              } else if (_gcRolling <= 0 && this._afGcLastStep !== 0) {
                this._afGcLastStep = 0; // back to flat/negative — re-arm from the first step
              }
            }
          }
          // Cascade/Sacrifice broadcasts fire once per trigger from MIC itself (at the collective-
          // exit decision point), not here per closed position — see _micCheckCascade/_micCheckSacrifice.
          // Blind-Entry has no real filtering criteria (see docs/blind-entry-plan.md) — its
          // _becCriteria are sign-only recording tags (+24h/-24h, +fund/-fund, +ocs/-ocs), never
          // used to gate entry, that exist purely so the scorecard has something to bucket.
          const _hasScoreCriteria = (pos._mic && pos._micCriteria?.length)
            || (pos._bec && pos._becCriteria?.length)
            || (pos._ldc && pos._ldcCriteria?.length);
          // Rolling average (see _afPositionAvgCriteria) instead of the frozen entry-time
          // snapshot — falls back to that same snapshot per-family if too few samples
          // accumulated before this close (fast-close case).
          const _scoreCriteria = _hasScoreCriteria ? this._afPositionAvgCriteria(pos) : null;
          if (this.cfg.afExtremityEnabled && _scoreCriteria) {
            const _t = this.closedTrades?.[0];
            const _pnl = _t?.totalPnl ?? _t?.pnl;
            if (typeof _pnl === 'number') {
              // Not awaited: the drift refetch below can queue behind scan traffic, and a
              // close (esp. bailAll) shouldn't wait on it. The record lands once drift is in.
              this._afSettleCloseScore(pos, _scoreCriteria, _pnl).catch(() => {});
            }
          }
          // MIC-only feedback: direction-awareness lock, independent of the scorecard toggle.
          if (pos._mic && pos._micCriteria?.length) {
            const _t2  = this.closedTrades?.[0];
            const _pnl2 = _t2?.totalPnl ?? _t2?.pnl;
            if (typeof _pnl2 === 'number') {
              this._micOnPositionScored?.(pos.symbol, pos._micCriteria, _pnl2);
            }
          }
        },

        // ── Order Count Surveillance ─────────────────────────────────────────

        // Every symbol in the batch gets its own fresh ticker fetch (fund, vol, OI, price) each scan; the
        // bulk list only says what exists and is never a criteria source. A symbol whose fetch fails is
        // dropped, not filled from stale data. volIoMap is kept only for call compatibility. wantOc / wantHr:
        // also fetch recent trades (ocs/ocx) and the hour candle (lta/lpa); both are skipped when OC is off.
        // Results are tethered to the same history/chart/persistence as OC (see _afVolIoWindowAvg).
        async _ocFetchBatch(symbols, volIoMap, wantOc, wantHr) {
          if (!symbols?.length) return;
          if (!this.cfg.afOcEnabled) { wantOc = false; wantHr = false; }
          else if (this.cfg.afSampleScoringEnabled) wantHr = true; // Sample Scoring's outcome (LPA) needs every sampled ticker's hour candle
          if (this._afFollowing()) { this._ocSeedFromShared(); return; } // following — seed from partner's shared OC data instead of fetching our own
          // Guard against overlapping calls: if a slower fetch (e.g. from a re-triggered
          // scan) finishes after a newer one already pushed, its stale ticker set would
          // otherwise land in history too, mixing symbols that were never part of the
          // latest scan's sample into the display.
          if (this._ocFetchRunning) return;
          this._ocFetchRunning = true;
          try {
          const results = {};
          for (const k of Object.keys(FRESH_TICKERS)) delete FRESH_TICKERS[k];
          {
            const limit = this.cfg.afOcOrderLimit;
            const CONC = 10;
            for (let i = 0; i < symbols.length; i += CONC) {
              await Promise.all(symbols.slice(i, i + CONC).map(async sym => {
                let rec = await this._afFetchFreshTicker(sym);
                if (!rec) return;
                if (wantOc) try {
                  const res = await this._qFetch(`${this.base}/v5/market/recent-trade?category=linear&symbol=${sym}&limit=${limit}`);
                  const js  = await res.json();
                  const trades = js?.result?.list || [];
                  if (trades.length >= 2) {
                    let bc = 0, sc = 0;
                    for (const t of trades) { if (t.side === 'Buy') bc++; else sc++; }
                    const times = trades.map(t => parseInt(t.time, 10)).filter(n => !isNaN(n)).sort((a,b)=>a-b);
                    const span = times[times.length - 1] - times[0];
                    const avgMs = times.length > 1 && span > 0 ? span / (times.length - 1) : null;
                    rec = { ...(rec || {}), bc, sc, avgMs, n: trades.length };
                  }
                } catch(_) {}
                // LTA/LPA: last-completed-hour candle for every sampled ticker (cached per hour).
                if (wantHr) { const h = await this._afHourCandle(sym); if (h) rec = { ...(rec || {}), ht: h.ht, hc: h.hc }; }
                results[sym] = rec;
              }));
            }
          }
          if (!Object.keys(results).length) return;
          this.afOcResults = results;
          this._afOcCycleCounter = (this._afOcCycleCounter % 99) + 1;
          const entry = { id: this._afOcCycleCounter, ts: Date.now(), results: Object.entries(results).map(([sym, r]) => ({ sym, ...r })) };
          this._afOcCycleHistory.push(entry);
          this._afOcResultsAt = entry.ts; // MIC/MIW's freshness signal: a new batch is new criteria data
          if (this._afOcCycleHistory.length > 25) this._afOcCycleHistory = this._afOcCycleHistory.slice(-25);
          this._ocPersistHistory();
          await this._scanCp?.();
          // Publish this cycle's OC sample so a partner bot that's following can seed its own
          // afOcResults/_afOcCycleHistory instead of going without OC data entirely while
          // following (see _ocSeedFromShared) — unlike liqResults/PEC, OC previously had no
          // cross-bot channel at all, so a follower's ocs/ocx checks silently starved for as
          // long as it kept following.
          this._sharedWrite?.('ocResults', results);
          await this._scanCp?.();
          this._afSampleIngest?.(entry);
          const withInterval = Object.values(results).filter(r => r.avgMs != null);
          const withVolIo = Object.values(results).filter(r => r.vol != null || r.oi != null);
          const parts = [`${Object.keys(results).length}t`];
          if (withInterval.length) parts.push(`avg ${(withInterval.reduce((s,r)=>s+r.avgMs,0)/withInterval.length/1000).toFixed(1)}s/order`);
          if (withVolIo.length) parts.push(`${withVolIo.length}t vol/oi`);
          const withHr = Object.values(results).filter(r => r.ht != null);
          if (withHr.length) parts.push(`${withHr.length}t 1h`);
          this.log(`[ASH] 📊 Sample cycle — ${parts.join(' · ')}`, 'info');
          } finally { this._ocFetchRunning = false; }
        },

        // One fresh ticker for one symbol. Stashes the raw payload for this scan (_afFreshTicker) and returns
        // the compact reading stored in results ({ vol, oi, fr (%), px, ch }); null when the fetch fails or is empty.
        async _afFetchFreshTicker(sym) {
          try {
            const res = await this._qFetch(`${this.base}/v5/market/tickers?category=linear&symbol=${sym}`);
            const t = (await res.json())?.result?.list?.[0];
            if (!t || t.symbol !== sym) return null;
            const vol = parseFloat(t.turnover24h || 0) || null, oi = parseFloat(t.openInterestValue || 0) || null;
            const frN = parseFloat(t.fundingRate), px = parseFloat(t.lastPrice), ch = parseFloat(t.price24hPcnt);
            if (vol == null && oi == null) return null;
            FRESH_TICKERS[sym] = t;
            return { vol, oi, ...(t.fundingRate !== '' && isFinite(frN) ? { fr: frN * 100 } : {}), ...(px > 0 ? { px } : {}), ...(isFinite(ch) ? { ch } : {}) };
          } catch (_) { return null; }
        },
        _afFreshTicker(sym) { return FRESH_TICKERS[sym] || null; },
        // Last stored per-ticker reading of every symbol in the retained sample window, however old: { sym: { rec, ts } }.
        // Only per-ticker fetched records count (vol/oi present), never the bulk list. MIC/MIW rank entry candidates on this.
        _afLatestReadings() {
          const by = {};
          for (const cycle of (this._afOcCycleHistory || [])) {
            if (!cycle || !Array.isArray(cycle.results)) continue;
            for (const r of cycle.results) {
              if (!r || typeof r.sym !== 'string' || (r.vol == null && r.oi == null)) continue;
              if (!by[r.sym] || cycle.ts >= by[r.sym].ts) by[r.sym] = { rec: r, ts: cycle.ts };
            }
          }
          return by;
        },
        // Ticker-shaped object from a stored reading of any age (see _afSynthTicker). _cycle is the reading's own cycle time, so
        // _afTickerIsCurrent holds only for the latest batch.
        _afSynthStored(sym, rec, ts) { const t = this._afSynthTicker(sym, rec); if (t) t._cycle = ts; return t; },
        // Pre-entry fresh read of one ranked candidate: its own ticker payload (kept in FRESH_TICKERS for this scan), plus
        // recent-trade OC and the hour candle when wanted. Touches neither afOcResults nor the cycle history — the caller
        // merges the returned oc. A follower reuses the leader's OC when it has it (see _ocFetchSingle).
        async _afFetchCandidate(sym, wantOc, wantHr) {
          const rec = await this._afFetchFreshTicker(sym);
          const t = rec ? FRESH_TICKERS[sym] : null;
          if (!t) return null;
          if (!this.cfg.afOcEnabled) { wantOc = false; wantHr = false; }
          const [oc] = await Promise.all([wantOc ? this._ocFetchSingle(sym, true) : null, wantHr ? this._afHourCandle(sym) : null]);
          return { t, oc: oc || null };
        },
        // True for a ticker that came from the current batch (own raw payload, or a follower's rebuild stamped with the leader's batch time).
        _afTickerIsCurrent(t) { return !!t && (FRESH_TICKERS[t.symbol] === t || (t._cycle != null && t._cycle === this._afOcResultsAt)); },
        // Ticker-shaped object rebuilt from a stored result — for a follower, which seeds the leader's batch and has
        // no raw payloads of its own.
        _afSynthTicker(sym, r) {
          if (!r || (r.vol == null && r.oi == null)) return null;
          return { symbol: sym, lastPrice: r.px != null ? String(r.px) : '0', price24hPcnt: r.ch != null ? String(r.ch) : '0', fundingRate: typeof r.fr === 'number' ? String(r.fr / 100) : '', turnover24h: String(r.vol ?? 0), openInterestValue: String(r.oi ?? 0), _cycle: this._afOcResultsAt };
        },

        // Isolated single-symbol OC lookup for the live liquidation path (MIC's _micOnLiqMessage).
        // Deliberately does NOT touch afOcResults or _afOcCycleHistory: afOcResults is a full
        // replace on every _ocFetchBatch call, so a live single-symbol result written there would
        // wipe out the current scan's multi-ticker snapshot other tickers' ocs/ocx checks still
        // need; and pushing a 1-ticker entry into _afOcCycleHistory floods the Order Interval
        // Sample chart / Volume History overlay's hourly buckets with noisy samples — the same
        // problem Liquid-Diver's live OC fetch used to cause (see _ocChartViable()), just
        // reintroduced from inside MIC instead of a separate plugin. Callers merge the return
        // value into their own local map instead.
        async _ocFetchSingle(sym, allowOwnFetch = false) {
          if (!this.cfg.afOcEnabled || !sym) return null;
          if (this._afFollowing()) {
            // following — seed afOcResults from the partner's shared snapshot and answer from
            // that instead of fetching our own (see _ocSeedFromShared). Not tagged `live` —
            // it's the leader's real historied batch entry, not a fresh unhistoried sample.
            this._ocSeedFromShared();
            const rec = this.afOcResults?.[sym];
            if (rec) return { ...rec };
            // allowOwnFetch is the pre-entry top-up's one loophole (see
            // _micTopUpGeneralCriteria): the leader has nothing for this symbol at all, so fall
            // through to a real fetch rather than opening with OCS/OCX unscored. Every other
            // caller leaves this off and stays seed-only, as before.
            if (!allowOwnFetch) return null;
          }
          try {
            const limit = this.cfg.afOcOrderLimit;
            const res = await this._qFetch(`${this.base}/v5/market/recent-trade?category=linear&symbol=${sym}&limit=${limit}`);
            const js  = await res.json();
            const trades = js?.result?.list || [];
            if (trades.length < 2) return null;
            let bc = 0, sc = 0;
            for (const t of trades) { if (t.side === 'Buy') bc++; else sc++; }
            const times = trades.map(t => parseInt(t.time, 10)).filter(n => !isNaN(n)).sort((a,b)=>a-b);
            const span = times[times.length - 1] - times[0];
            const avgMs = times.length > 1 && span > 0 ? span / (times.length - 1) : null;
            // live: true marks this sample as not yet folded into _afOcCycleHistory (see the
            // comment above) — _afOcAccumSkew's OCS callers use this flag to fold a fresh
            // single-symbol sample into the accumulated total exactly once, without double-
            // counting once a later batch fetch pushes the same ticker into history for real.
            return { bc, sc, avgMs, n: trades.length, live: true };
          } catch(_) { return null; }
        },

        // Following: no own OC fetch runs (see the guards in _ocFetchBatch/_ocFetchSingle), so
        // pull whatever the leader most recently published instead of leaving afOcResults/
        // _afOcCycleHistory to go stale forever.
        // Dedupes on the shared snapshot's own ts so a cycle already folded in doesn't get
        // pushed into history twice across repeated calls within the same scan.
        _ocSeedFromShared() {
          this._afSampleAdopt?.();
          const shared = this._sharedRead?.('ocResults');
          if (!shared?.data) return;
          this.afOcResults = shared.data;
          if (shared.ts) this._afOcResultsAt = shared.ts;
          if (shared.ts && shared.ts !== this._afOcLastSharedTs) {
            this._afOcLastSharedTs = shared.ts;
            const histEntry = { id: (this._afOcCycleCounter = (this._afOcCycleCounter % 99) + 1), ts: shared.ts, results: Object.entries(shared.data).map(([sym, r]) => ({ sym, ...r })) };
            this._afOcCycleHistory.push(histEntry);
            this._afSampleIngest?.(histEntry);
            if (this._afOcCycleHistory.length > 25) this._afOcCycleHistory = this._afOcCycleHistory.slice(-25);
            this._ocPersistHistory();
          }
        },

        // Shared by init() (loading from localStorage) and afImport() (loading from a file)
        // so a corrupt/legacy history can't slip in through one path just because the other
        // path was hardened first. Drops records from the pre-redesign OC system (which
        // counted a single raw order number per ticker, before the current buy/sell split —
        // those entries lack bc/sc and only ever rendered as meaningless zero-fill bars/chips),
        // rejects malformed or NaN timestamps, and caps to the same 25-cycle window as the
        // liquidation history.
        _ocSanitizeHistory(raw) {
          const rawCount = (raw || []).reduce((n,c) => n + (Array.isArray(c?.results) ? c.results.length : 0), 0);
          const cleaned = (raw || [])
            .filter(c => c && Array.isArray(c.results) && typeof c.ts === 'number' && !isNaN(c.ts))
            .map(c => ({ ...c, results: c.results.filter(r => r && typeof r.sym === 'string' && (
              (typeof r.bc === 'number' && !isNaN(r.bc) && typeof r.sc === 'number' && !isNaN(r.sc)) ||
              (typeof r.vol === 'number' && !isNaN(r.vol)) ||
              (typeof r.oi === 'number' && !isNaN(r.oi)) ||
              (typeof r.ht === 'number' && !isNaN(r.ht))
            )) }))
            .filter(c => c.results.length > 0)
            .slice(-25);
          const cleanCount = cleaned.reduce((n,c) => n + c.results.length, 0);
          return { cleaned, purged: rawCount - cleanCount };
        },

        _ocPersistHistory() {
          try {
            this._afOcCycleHistory = trimToByteCap(this._afOcCycleHistory);
            localStorage.setItem(ASH_OC_HIST_KEY, JSON.stringify(this._afOcCycleHistory));
          } catch(_) {}
        },

        // Per-mode chart settings — 'oc' (order interval, seconds, lower=busier, capped so a
        // handful of illiquid tickers don't stretch the axis) vs 'vol'/'io' (raw USDT value,
        // higher=busier, uncapped — there's no equivalent outlier problem since these are
        // already the population-relative criteria, not a per-ticker ratio).
        // Chart views rotate in this order; the two header buttons are labelled with the
        // previous/next view's name and wrap around at either end.
        _afOcViewModes() { return ['oc', 'vol', 'io', 'fund', 'lta', 'lpa']; },
        _afOcViewName(step) {
          const M = this._afOcViewModes();
          const N = { oc: 'OC', vol: 'Vol', io: 'IO', fund: 'Fund', lta: 'LTA', lpa: 'LPA' };
          const i = Math.max(0, M.indexOf(this._afOcViewMode || 'oc'));
          return N[M[(i + step + M.length) % M.length]];
        },
        _afOcCycleView(step) {
          const M = this._afOcViewModes();
          const i = Math.max(0, M.indexOf(this._afOcViewMode || 'oc'));
          this._afOcViewMode = M[(i + step + M.length) % M.length];
        },
        _afOcModeCfg() {
          const mode = this._afOcViewMode || 'oc';
          const fmtCompact = v => { if (v==null) return 'n/a'; const a=Math.abs(v); if (a>=1e9) return '$'+(v/1e9).toFixed(2)+'B'; if (a>=1e6) return '$'+(v/1e6).toFixed(2)+'M'; if (a>=1e3) return '$'+(v/1e3).toFixed(1)+'K'; return '$'+v.toFixed(0); };
          if (mode === 'vol') return { label: 'VOLUME SAMPLE', color: '96,210,255', cap: null, getVal: r => r.vol, fmt: fmtCompact, higherIsBusier: true, avgLabel: 'Avg volume' };
          if (mode === 'io')  return { label: 'OPEN INTEREST SAMPLE', color: '190,130,230', cap: null, getVal: r => r.oi, fmt: fmtCompact, higherIsBusier: true, avgLabel: 'Avg open interest' };
          // Signed modes: values straddle zero (above/below its own / the population's average), so the
          // chart gets a zero line and a symmetric axis instead of growing up from the floor.
          if (mode === 'fund') return { label: 'FUNDING RATE SAMPLE', color: '255,205,90', cap: null, signed: true, getVal: r => (typeof r.fr === 'number' && !isNaN(r.fr)) ? r.fr : null, fmt: v => (v >= 0 ? '+' : '') + v.toFixed(4) + '%', higherIsBusier: true, avgLabel: 'Avg funding rate' };
          if (mode === 'lta') return { label: 'LOCALIZED TURNOVER SAMPLE', color: '110,220,160', cap: null, signed: true, getVal: r => this._afLtaDev(r.ht, r.vol), fmt: v => (v >= 0 ? '+' : '') + v.toFixed(0) + '%', higherIsBusier: true, avgLabel: 'Avg 1h turnover vs own 24h/24' };
          if (mode === 'lpa') return { label: 'LOCALIZED PRICE SAMPLE', color: '255,130,170', cap: null, signed: true, getVal: r => (typeof r.hc === 'number' && !isNaN(r.hc)) ? r.hc : null, fmt: v => (v >= 0 ? '+' : '') + v.toFixed(2) + '%', higherIsBusier: true, avgLabel: 'Avg 1h price change' };
          return { label: 'ORDER INTERVAL SAMPLE', color: '200,160,80', cap: 12, getVal: r => r.avgMs != null ? r.avgMs / 1000 : null, fmt: v => v >= 100 ? v.toFixed(0) + 's' : v.toFixed(1) + 's', higherIsBusier: false, avgLabel: 'Avg order interval' };
        },
        _afOcChartSvg(shown) {
          if (!shown) return '';
          const mc = this._afOcModeCfg();
          // Defensive: a stale/partial write (e.g. a crash mid-save) or leftover pre-redesign
          // entries in localStorage can leave a history array with malformed shapes. Filter to
          // well-formed entries only so one bad record can't corrupt the whole render.
          const history = (this._afOcCycleHistory || []).filter(c => c && Array.isArray(c.results) && typeof c.ts === 'number' && !isNaN(c.ts)).sort((a,b)=>a.ts-b.ts);
          if (!history.length) return '';
          const cycleW=28, dayGapW=38, H=80, padL=28, padB=16, padT=6, padR=4;
          const plotH = H - padT - padB;
          const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          const dLabel = _d => isNaN(_d.getTime()) ? '?' : MONTHS[_d.getMonth()]+' '+_d.getDate();
          const localDay = ts => { const d=new Date(ts); return isNaN(d.getTime()) ? 0 : d.getFullYear()*1000+d.getMonth()*32+d.getDate(); };
          const xPos=[]; let xCur=padL;
          for (let ci=0;ci<history.length;ci++) { if (ci>0&&localDay(history[ci].ts)!==localDay(history[ci-1].ts)) xCur+=dayGapW; xPos.push(xCur); xCur+=cycleW; }
          const W = xCur + padR;
          const passesCap = v => v != null && (mc.cap == null || v <= mc.cap);
          let maxVal=0;
          for (const c of history) for (const r of c.results) { const v = mc.getVal(r); if (!passesCap(v)) continue; maxVal=Math.max(maxVal,v); }
          if (maxVal<=0) maxVal=1;
          maxVal *= 1.3;
          const allVals=history.flatMap(c=>c.results.filter(r=>r&&passesCap(mc.getVal(r))).map(r=>mc.getVal(r)));
          const avgRef=allVals.length?allVals.reduce((a,b)=>a+b,0)/allVals.length:0;
          // Plain value scale: 0 at the bottom, maxVal at the top — a higher value plots
          // taller, same convention as every other bar chart in this panel. Signed modes
          // (lta/lpa) run -maxVal..+maxVal around a zero line; the axis is sized to the 95th
          // percentile of |value| so one runaway ticker can't flatten everyone else (its bar
          // just pins to the edge).
          let lo=0;
          if (mc.signed) {
            const abs=allVals.map(v=>Math.abs(v)).sort((a,b)=>a-b);
            const p95=abs.length?abs[Math.floor(0.95*(abs.length-1))]:0;
            maxVal=(p95>0?p95:1)*1.3;
            lo=-maxVal;
          }
          const yVal=v=>padT+plotH-((Math.max(lo,Math.min(maxVal,v))-lo)/(maxVal-lo))*plotH;
          const fmt = mc.fmt;
          const _ow=padL+6,_oh=H+8,_ax=padL+6;
          let _yAxis=`<svg width="${_ow}" height="${_oh}" style="display:block"><line x1="${_ax}" y1="${4+padT}" x2="${_ax}" y2="${4+padT+plotH}" stroke="rgba(255,255,255,.12)" stroke-width="0.5"/>`;
          for (const f of [0,0.25,0.5,0.75,1]) { const v=lo+(maxVal-lo)*f; const y=(4+yVal(v)).toFixed(1); _yAxis+=`<text x="${_ax-3}" y="${(parseFloat(y)+3).toFixed(1)}" fill="rgba(255,255,255,.3)" font-size="7" font-family="monospace" text-anchor="end">${fmt(v)}</text>`; }
          this._afOcYAxisHtml = _yAxis+'</svg>';
          if (avgRef>maxVal*0.05&&avgRef<maxVal*0.95) this._afOcAvgYPx=4+yVal(avgRef); else this._afOcAvgYPx=null;
          const grids=[0,0.25,0.5,0.75,1].map(f=>{const v=lo+(maxVal-lo)*f;const y=yVal(v).toFixed(1);return `<line x1="${padL}" y1="${y}" x2="${(W-padR).toFixed(1)}" y2="${y}" stroke="rgba(255,255,255,.05)" stroke-width="0.5"/>`;}).join('');
          const CLR=`rgba(${mc.color},`;
          // Highlighted cycle falls back to the actual latest cycle when nothing is pinned —
          // see the matching HIGHLIGHTED CYCLE section below, fed by _afOcDisplayedResults().
          const displayedTs = this._afOcHighlightedCycleTs ?? history[history.length - 1].ts;
          let bars='';
          history.forEach((cycle,ci)=>{
            const cx=xPos[ci]; const results=cycle.results.filter(r=>r&&passesCap(mc.getVal(r))); const n=results.length;
            const cycleMean=n?results.reduce((s,r)=>s+mc.getVal(r),0)/n:0;
            const bw=Math.max(1,Math.min(4,cycleW*0.9/Math.max(1,n)));
            // Hitbox — sits under the bars and spans the full cycle column (not just the bars
            // themselves, since a cycle with no qualifying tickers has no bars to click),
            // doubling as the highlight backdrop for whichever cycle is currently displayed.
            const isDisplayed = cycle.ts === displayedTs;
            bars += `<rect class="afoc-cycle-hit" data-oc-cycle-ts="${cycle.ts}" x="${cx.toFixed(1)}" y="${padT}" width="${cycleW.toFixed(1)}" height="${plotH.toFixed(1)}" fill="${isDisplayed ? CLR+'.10)' : 'transparent'}" pointer-events="all" style="cursor:pointer"/>`;
            results.forEach((r,ri)=>{
              const x=cx+(ri/n)*cycleW*0.9;
              const v=mc.getVal(r);
              // Direction of "busier"/more-notable flips per mode — lower interval = faster
              // order flow (oc), higher volume/OI = more notable (vol/io) — matching the same
              // above/below-average direction the va/ioa criteria themselves use.
              const busier=(mc.signed||cycleMean>0)&&(mc.higherIsBusier?v>=cycleMean:v<=cycleMean);
              const alpha=busier?.85:.35;
              const y0=yVal(0), yv=yVal(v);
              const h=Math.max(1,Math.abs(y0-yv));
              const y=Math.min(y0,yv);
              bars+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" fill="${CLR}${alpha})"/>`;
            });
            if (ci>0 && localDay(history[ci].ts)!==localDay(history[ci-1].ts)) {
              const gx=cx-dayGapW/2;
              const d=new Date(history[ci].ts);
              bars+=`<line x1="${gx.toFixed(1)}" y1="${padT}" x2="${gx.toFixed(1)}" y2="${(padT+plotH).toFixed(1)}" stroke="${CLR}.4)" stroke-dasharray="2 2"/>`;
              bars+=`<text x="${gx.toFixed(1)}" y="${H-2}" fill="${CLR}.65)" font-size="7" font-family="monospace" text-anchor="middle">${dLabel(d)}</text>`;
            } else if (ci>0) {
              bars+=`<line x1="${cx.toFixed(1)}" y1="${padT}" x2="${cx.toFixed(1)}" y2="${(padT+plotH).toFixed(1)}" stroke="rgba(255,255,255,.08)" stroke-width="0.5"/>`;
            }
            const d=new Date(cycle.ts);
            const label=`${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
            bars+=`<text x="${(cx+cycleW/2).toFixed(1)}" y="${H-2}" fill="rgba(255,255,255,.3)" font-size="7" font-family="monospace" text-anchor="middle">${label}</text>`;
          });
          return `<svg width="${W}" height="${H}" style="display:block">`
            + `<line x1="${padL}" y1="${yVal(0).toFixed(1)}" x2="${W-padR}" y2="${yVal(0).toFixed(1)}" stroke="rgba(255,255,255,.12)" stroke-width="0.5"/>`
            + grids + bars
            + `</svg>`;
        },

        // Picks the newest cycle by timestamp rather than array position — see the matching
        // comment in init() on why array-position ("last pushed") can go stale if two OC
        // fetches ever overlap.
        _afOcLatestCycle() {
          const hist = this._afOcCycleHistory || [];
          return hist.reduce((a,c) => (!a || c.ts > a.ts) ? c : a, null);
        },
        // Resolves which cycle's results the chart's summary/chip list show — the pinned cycle
        // if one was clicked and is still in history, else the actual latest (default). Mirrors
        // _liqDisplayedResults(); a pinned cycle can age out of _afOcCycleHistory (capped at 25)
        // without an explicit reset, so this falls back rather than showing a stale/empty list.
        _afOcDisplayedCycle() {
          const hist = this._afOcCycleHistory || [];
          const hi = this._afOcHighlightedCycleTs;
          if (hi != null) {
            const hit = hist.find(c => c.ts === hi);
            if (hit) return hit;
          }
          return this._afOcLatestCycle();
        },
        _afOcDisplayedCycleLabel() {
          const last = this._afOcLatestCycle();
          const hi = this._afOcHighlightedCycleTs;
          if (hi == null || !last) return '';
          if (hi === last.ts) return '';
          const hist = this._afOcCycleHistory || [];
          const hit = hist.find(c => c.ts === hi);
          if (!hit) return '';
          const d = new Date(hit.ts);
          return ' · ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        },
        _afOcSummaryText(shown) {
          if (!shown) return '';
          const mode = this._afOcViewMode || 'oc';
          const last = this._afOcDisplayedCycle();
          const results = (last?.results || []).filter(r => r && typeof r.sym === 'string');
          if (!results.length) return '';
          if (mode !== 'oc') {
            const mc = this._afOcModeCfg();
            const withField = results.filter(r => mc.getVal(r) != null);
            if (!withField.length) return '';
            return `${withField.length} ticker${withField.length===1?'':'s'} sampled${this._afOcDisplayedCycleLabel()}`;
          }
          // OC mode has no summary line of its own any more — order/ticker counts were redundant
          // (the batch is always the same fixed sample size). Skew + interval now live in the
          // Total and Batch readouts (_afOcTotalAvgText / _afOcBatchLineText).
          return '';
        },
        // Full-window population average for MIC's va/ioa criteria — same dedup-to-latest-per-
        // symbol pattern as _afOcWindowAvgMs, over the same tethered _afOcCycleHistory, just
        // averaging 'vol' or 'oi' instead of 'avgMs'.
        _afVolIoWindowAvg(field) {
          const st = this._afWindowStats(field);
          return st.n ? st.sum / st.n : null;
        },
        // One deduped read of the retained sample window: each ticker's LATEST reading only,
        // summed and counted. field: 'vol' | 'oi' | 'lta' | 'lpa'. V/A, IO/A, LPA and the
        // chart's "Total avg" readout all come from this, so the number on screen is exactly
        // the one the criteria measure against. Memoized per history state (scoring calls this
        // once per candidate per criterion).
        _afWindowStats(field) {
          const hist = this._afOcCycleHistory || [];
          let maxTs = 0;
          for (const c of hist) if (c && typeof c.ts === 'number' && c.ts > maxTs) maxTs = c.ts;
          const key = hist.length + '|' + maxTs;
          const memo = WIN_MEMO[field];
          if (memo && memo.key === key) return memo.val;
          const val = field === 'lta' ? (r => this._afLtaDev(r.ht, r.vol))
                    : field === 'lpa' ? (r => (typeof r.hc === 'number' && !isNaN(r.hc)) ? r.hc : null)
                    : (r => r[field]);
          const bySym = {};
          for (const cycle of hist) {
            if (!cycle || !Array.isArray(cycle.results)) continue;
            for (const r of cycle.results) {
              if (!r || typeof r.sym !== 'string') continue;
              const v = val(r);
              if (v == null) continue;
              if (!bySym[r.sym] || cycle.ts > bySym[r.sym].ts) bySym[r.sym] = { v, ts: cycle.ts };
            }
          }
          const vals = {}; let sum = 0, n = 0;
          for (const [sym, o] of Object.entries(bySym)) { vals[sym] = o.v; sum += o.v; n++; }
          const out = { sum, n, vals };
          WIN_MEMO[field] = { key, val: out };
          return out;
        },
        // LTA: 1hr turnover against the ticker's own hourly average (24h turnover / 24), as a
        // % deviation — above its own average is positive, below is negative.
        _afLtaDev(ht, vol24) {
          if (typeof ht !== 'number' || isNaN(ht)) return null;
          const v = parseFloat(vol24);
          if (!(v > 0)) return null;
          const hourly = v / 24;
          return (ht - hourly) / hourly * 100;
        },
        // LPA baseline: mean 1hr price change % of every OTHER ticker in the window (latest
        // reading each), so a ticker is never measured against itself.
        _afLpaWindowAvg(excludeSym) {
          const st = this._afWindowStats('lpa');
          const own = excludeSym != null ? st.vals[excludeSym] : undefined;
          const n = st.n - (own != null ? 1 : 0);
          if (n <= 0) return null;
          return (st.sum - (own ?? 0)) / n;
        },
        // Start (ms) of the last COMPLETED hourly candle. The forming candle is never used —
        // its turnover is a partial hour and would skew LTA negative early in each hour.
        _afHourStart() { return Math.floor(Date.now() / 3600000) * 3600000 - 3600000; },
        // One kline request per ticker per hour: the completed candle can't change, so a hit
        // for the current hour is reused for every later scan (and by the open-position sampler).
        async _afHourCandle(sym) {
          const start = this._afHourStart();
          const hit = HOUR_CACHE[sym];
          if (hit && hit.start === start) return hit;
          try {
            const res = await this._qFetch(`${this.base}/v5/market/kline?category=linear&symbol=${sym}&interval=60&limit=3`);
            const js  = await res.json();
            // Bybit list rows: [start, open, high, low, close, volume, turnover], newest first.
            const row = (js?.result?.list || []).find(r => parseInt(r[0], 10) === start);
            if (!row) return null;
            const o = parseFloat(row[1]), c = parseFloat(row[4]), ht = parseFloat(row[6]);
            if (!(o > 0) || isNaN(c) || isNaN(ht)) return null;
            const rec = { start, ht, hc: (c - o) / o * 100 };
            if (Object.keys(HOUR_CACHE).length > 500) for (const k of Object.keys(HOUR_CACHE)) if (HOUR_CACHE[k].start !== start) delete HOUR_CACHE[k];
            HOUR_CACHE[sym] = rec;
            return rec;
          } catch (_) { return null; }
        },
        // Best available 1hr reading for a ticker: this hour's cached candle, else whatever the
        // latest sample batch carried (what a follower gets from the leader's shared snapshot).
        _afHourReading(sym) {
          const hit = HOUR_CACHE[sym];
          if (hit && hit.start === this._afHourStart()) return { ht: hit.ht, hc: hit.hc };
          const r = this.afOcResults?.[sym];
          if (r && typeof r.ht === 'number' && typeof r.hc === 'number') return { ht: r.ht, hc: r.hc };
          return null;
        },
        // Widened counterpart to _afHourReading, for scan-time LTA/LPA matching only — never
        // for the top-up fetch gate (_micTopUpGeneralCriteria), which must stay strict-fresh
        // so the pre-entry refetch still fires. Falls back to this symbol's latest reading
        // anywhere in the retained _afOcCycleHistory window when nothing fresh (this hour's
        // cache or the latest batch) exists yet, so a not-yet-resampled-this-hour ticker can
        // still be scored on stale-but-real data instead of being treated as having none.
        _afHourReadingWide(sym) {
          const fresh = this._afHourReading(sym);
          if (fresh) return fresh;
          let latest = null, latestTs = -Infinity;
          for (const cycle of (this._afOcCycleHistory || [])) {
            if (!cycle || !Array.isArray(cycle.results)) continue;
            const r = cycle.results.find(x => x && x.sym === sym && typeof x.ht === 'number' && typeof x.hc === 'number');
            if (r && cycle.ts > latestTs) { latest = { ht: r.ht, hc: r.hc }; latestTs = cycle.ts; }
          }
          return latest;
        },
        // Accumulated buy/sell order-count skew for a single ticker across the ENTIRE retained
        // _afOcCycleHistory window (same 25-cycle cap as _afOcWindowAvgMs) — sums bc/sc from
        // every cycle that sampled this ticker instead of reading only the most recent batch's
        // counts, so OCS reflects the ticker's own accumulated order flow over the sample
        // window rather than one 100-trade snapshot. A ticker sampled across more cycles builds
        // a deeper, steadier read; a ticker that just entered the pool starts thin, same
        // cold-start behavior as OCX's window average. Returns null if the ticker has no
        // sampled cycles at all yet.
        _afOcAccumSkew(sym) {
          let bc = 0, sc = 0, n = 0;
          for (const cycle of (this._afOcCycleHistory || [])) {
            if (!cycle || !Array.isArray(cycle.results)) continue;
            const r = cycle.results.find(x => x && x.sym === sym && (typeof x.bc === 'number' || typeof x.sc === 'number'));
            if (!r) continue;
            bc += r.bc || 0; sc += r.sc || 0; n++;
          }
          return n ? { bc, sc } : null;
        },
        // Full-window population average for MIC's OCX criterion: every ticker's most recent
        // avgMs across the ENTIRE retained _afOcCycleHistory (not just the current cycle's
        // batch), deduped to one entry per symbol — the latest one seen. Shared by both the
        // scan-time pool and the live liq-trigger path (which reads this same history but never
        // writes to it — see _ocFetchSingle) so a ticker's fast/slow classification means the
        // same thing regardless of which path resolved it. No minimum-ticker floor — a thin or
        // cold-start window is intentionally left unstable rather than gated off.
        _afOcWindowAvgMs() {
          const bySym = {};
          for (const cycle of (this._afOcCycleHistory || [])) {
            if (!cycle || !Array.isArray(cycle.results)) continue;
            for (const r of cycle.results) {
              if (!r || typeof r.sym !== 'string' || r.avgMs == null) continue;
              if (!bySym[r.sym] || cycle.ts > bySym[r.sym].ts) bySym[r.sym] = { avgMs: r.avgMs, ts: cycle.ts };
            }
          }
          const vals = Object.values(bySym).map(v => v.avgMs);
          if (!vals.length) return null;
          return vals.reduce((s, v) => s + v, 0) / vals.length;
        },
        // Single-ticker counterpart to _afOcWindowAvgMs: this symbol's own latest avgMs
        // anywhere in the retained _afOcCycleHistory, for when the current cycle's batch
        // didn't happen to sample it. Used only as a scan-time fallback for OCX matching
        // (stale-but-real beats no data at all) — the pre-entry top-up fetch still keys off
        // afOcResults directly and is unaffected by this.
        _afOcLatestAvgMs(sym) {
          let latest = null, latestTs = -Infinity;
          for (const cycle of (this._afOcCycleHistory || [])) {
            if (!cycle || !Array.isArray(cycle.results)) continue;
            const r = cycle.results.find(x => x && x.sym === sym && typeof x.avgMs === 'number');
            if (r && cycle.ts > latestTs) { latest = r.avgMs; latestTs = cycle.ts; }
          }
          return latest;
        },
        // Mean seconds/order across every ticker in the displayed cycle — moved here from the
        // old Volume History chart's OC overlay line, which got scrapped along with the rest
        // of that chart. Simple average across the cycle's tickers, not an hourly bucket mean.
        _afOcAvgIntervalSec(shown) {
          if (!shown || (this._afOcViewMode || 'oc') !== 'oc') return null;
          const last = this._afOcDisplayedCycle();
          const withInterval = (last?.results || []).filter(r => r && r.avgMs != null);
          if (!withInterval.length) return null;
          return withInterval.reduce((s,r) => s + r.avgMs, 0) / withInterval.length / 1000;
        },
        // Mode-aware counterpart for vol/io — mirrors _afOcAvgIntervalSec's role but formats
        // via _afOcModeCfg() instead of assuming seconds.
        _afOcAvgValueText(shown) {
          if (!shown) return null;
          const mode = this._afOcViewMode || 'oc';
          if (mode === 'oc') return null;
          const mc = this._afOcModeCfg();
          const last = this._afOcDisplayedCycle();
          const withField = (last?.results || []).filter(r => r && mc.getVal(r) != null);
          if (!withField.length) return null;
          const avg = withField.reduce((s,r) => s + mc.getVal(r), 0) / withField.length;
          return `Batch ${mc.avgLabel.toLowerCase()}: ${mc.fmt(avg)}`;
        },
        // "Total" counterpart to the per-batch line above: the mean of every ticker's latest
        // reading across the whole retained window — the same population number V/A, IO/A and
        // LPA measure against (see _afWindowStats).
        // Total-window buy/sell counts across every retained cycle — the same accumulation OCS
        // reads per ticker (see _afOcAccumSkew), summed over the whole population.
        _afOcWindowSkew() {
          let bc = 0, sc = 0;
          for (const cycle of (this._afOcCycleHistory || [])) {
            if (!cycle || !Array.isArray(cycle.results)) continue;
            for (const r of cycle.results) { if (!r) continue; bc += r.bc || 0; sc += r.sc || 0; }
          }
          return { bc, sc };
        },
        // "Total: 47% buy / 53% sell · 31.8s avg interval" — either half is dropped when it has
        // no data; null when neither does. Sell % is derived (100 - buy) so the pair always sums.
        _afOcLineText(skew, avgMs, label, suffix) {
          const parts = [];
          const t = skew ? skew.bc + skew.sc : 0;
          if (t > 0) { const b = Math.round(skew.bc / t * 100); parts.push(`${b}% buy / ${100 - b}% sell`); }
          if (avgMs != null) { const v = avgMs / 1000; parts.push(`${v >= 100 ? v.toFixed(0) : v.toFixed(1)}s avg interval`); }
          return parts.length ? `${label}: ${parts.join(' · ')}${suffix || ''}` : null;
        },
        // Per-batch counterpart (the displayed/pinned cycle) — OC mode only.
        _afOcBatchLineText(shown) {
          if (!shown || (this._afOcViewMode || 'oc') !== 'oc') return null;
          const results = (this._afOcDisplayedCycle()?.results || []).filter(r => r && typeof r.sym === 'string');
          if (!results.length) return null;
          const skew = { bc: results.reduce((s,r)=>s+(r.bc||0),0), sc: results.reduce((s,r)=>s+(r.sc||0),0) };
          const sec = this._afOcAvgIntervalSec(shown);
          return this._afOcLineText(skew, sec == null ? null : sec * 1000, 'Batch', this._afOcDisplayedCycleLabel());
        },
        _afOcTotalAvgText(shown) {
          if (!shown) return null;
          const mode = this._afOcViewMode || 'oc';
          if (mode === 'oc') return this._afOcLineText(this._afOcWindowSkew(), this._afOcWindowAvgMs?.(), 'Total', '');
          const mc = this._afOcModeCfg();
          const st = this._afWindowStats(mode === 'io' ? 'oi' : mode === 'fund' ? 'fr' : mode);
          if (!st.n) return null;
          return `Total ${mc.avgLabel.toLowerCase()}: ${mc.fmt(st.sum / st.n)} · ${st.n} ticker${st.n === 1 ? '' : 's'} (window)`;
        },
        _afOcInfoHtml(shown) {
          if (!shown) return '';
          const mode = this._afOcViewMode || 'oc';
          const last = this._afOcDisplayedCycle();
          const results = (last?.results || []).filter(r => r && typeof r.sym === 'string');
          if (!results.length) return '';
          if (mode !== 'oc') {
            const mc = this._afOcModeCfg();
            const withField = results.filter(r => mc.getVal(r) != null);
            if (!withField.length) return '';
            const mean = withField.reduce((s,r)=>s+mc.getVal(r),0)/withField.length;
            return withField.map(r=>{
              const v = mc.getVal(r);
              const aboveAvg = v >= mean;
              const clr=aboveAvg?`rgba(${mc.color},.9)`:'var(--text-lo)';
              const bdr=aboveAvg?`rgba(${mc.color},.4)`:'rgba(255,255,255,.1)';
              const bg=aboveAvg?`rgba(${mc.color},.06)`:'transparent';
              return `<span title="${r.sym}: ${mc.fmt(v)}" style="font-family:var(--mono);font-size:8px;padding:1px 5px;border-radius:2px;border:1px solid ${bdr};background:${bg};color:${clr};white-space:nowrap">${r.sym.replace('USDT','')} <span style="opacity:.65">${mc.fmt(v)}</span></span>`;
            }).join('');
          }
          // This chart measures two things, so each chip shows two independent reads: the OUTLINE
          // lights up when the ticker's order interval is faster than the batch mean (same "busier"
          // test the bars use — intervals past the chart's cap never qualify), and the BODY fills
          // when its skew leans to this bot's favored side (buy on Chaser). Order count is no longer
          // compared — every ticker samples the same number of trades, so it never differentiated.
          const oc = this._afOcModeCfg();
          const ivs = results.map(r => oc.getVal(r)).filter(v => v != null && (oc.cap == null || v <= oc.cap));
          const ivMean = ivs.length ? ivs.reduce((a,b)=>a+b,0)/ivs.length : null;
          return results.map(r=>{
            const total=(r.bc||0)+(r.sc||0); if(!total) return '';
            const iv = oc.getVal(r);
            const busy = ivMean != null && iv != null && (oc.cap == null || iv <= oc.cap) && iv <= ivMean;
            const lean = (r.bc||0) > (r.sc||0);
            const clr=(busy||lean)?'rgba(255,150,80,.9)':'var(--text-lo)';
            const bdr=busy?'rgba(255,150,80,.75)':'rgba(255,255,255,.1)';
            const bg=lean?'rgba(255,150,80,.22)':'transparent';
            const avgSec = r.avgMs!=null ? (r.avgMs/1000).toFixed(1)+'s/order' : 'n/a';
            // Collapsed: only the dominant side (the other is implicit) and a bare interval —
            // "PROVE B77 4.4s". The full counts stay in the hover title, and a tap/click on the
            // pill expands it in place for touch screens.
            const bc=r.bc||0, sc=r.sc||0;
            const sec = r.avgMs!=null ? r.avgMs/1000 : null;
            const shortIv = sec==null ? 'n/a' : (sec>=100 ? sec.toFixed(0) : sec.toFixed(1))+'s';
            const expanded = this._afOcExpandedSym === r.sym;
            const inner = expanded
              ? `<span style="opacity:.65">B${bc} S${sc}</span><span style="opacity:.4;font-size:7px"> ${avgSec}</span>`
              : `<span style="opacity:.65">${bc>=sc ? 'B'+bc : 'S'+sc}</span><span style="opacity:.4;font-size:7px"> ${shortIv}</span>`;
            return `<span data-oc-chip="${r.sym}" title="${r.sym}: ${bc} B-fills / ${sc} S-fills · ${avgSec}" style="cursor:pointer;font-family:var(--mono);font-size:8px;padding:1px 5px;border-radius:2px;border:1px solid ${bdr};background:${bg};color:${clr};white-space:nowrap">${r.sym.replace('USDT','')} ${inner}</span>`;
          }).join('');
        },

      }, _hostStages
        ? { _scanStageDefs: [...def._scanStageDefs, { id: 'af-post', run: function () { return this._afScanPost(); } }] }
        : { async runScan() { await _origScan.call(this); await this._afScanPost(); } });
    },
  };
})();
</script>
