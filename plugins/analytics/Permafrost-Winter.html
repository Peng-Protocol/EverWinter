<!--
  Permafrost Strategy Plugin for PseudoWinter
  Self-calibrating halt governor: replaces the fixed 12h drawdown-throttle /
  gains-lock timers with a learned market-structure profile.

  Every halt event records the market structure (gainer/loser skew + breadth)
  at the moment it fired — drawdown events mark hostile climate, gains-lock
  events mark favorable climate. Scan cycles add weaker PnL-labeled samples
  between those anchors. While halted, structure is re-sampled on a slow
  timer. Halts run the stock 12h horizon by default. Only a *strong* historical
  bias (large |score| backed by enough evidence mass) changes that: it can hold
  the halt past 12h up to a hard cap (24h — the extreme case) while structure
  stays hostile, or "thaw" it early (as soon as 1h) once structure scores
  favorably. Without a strong bias the lock is never lifted early — it just
  serves its 12h. A thin profile falls back to the stock 12h timer too.

  PLK (preemptive lock, on by default): proactive rather than reactive — when
  a routine structure check reads a climate that is historically bad (score at
  or below the PLK trigger, with sufficient evidence), entries lock before any
  PnL damage occurs. A PLK rides the drawdown gate so every entry choke point
  respects it, and surfaces as a "PLK" countdown pill on the topbar (click to
  lift manually). Its duration scales with the strength of the historical bias
  up to the hard cap — an arbitrary span like 3h 20m — and it also lifts early
  once structure clears the thaw score under a strong bias. A real drawdown/
  gains-lock halt supersedes an active PLK. After a PLK ends, a dynamic cooldown
  equal to that lock's own duration must pass before another can engage — no
  back-to-back preemptive locks.

  Structure trajectory ("the wave"): a reading is judged in the context of what
  preceded it, not in isolation. The recent path of the structure lean is tracked
  and plotted in the accordion, and its direction folds into an inherent bull⇄bear
  oscillation prior — so a mildly-bearish tape that is turning up reads negative
  (don't short into the start of a pump). Learned history stays primary; the
  inherent wave only takes the helm when the profile is thin.

  The profile is direction-agnostic: it only learns what realized PnL says
  about this installation, so the same logic powers Ashfall on PseudoChaser.

  Load via Plugin Manager in PseudoWinter's config panel.
  Load AFTER EverWinter if using live trading — see README Plugin Stack Order.
  targetBot: pseudowinter
-->
<script>
(function () {
  'use strict';

    const VERSION        = '1.74.0'; // liqquiet (0-liq%% snapshot dial, high/low/lukewarm like liqturnover) + past1 3rd block on the 0-liq pill; fixed liveliq+/liqturnover-/pecirr-/vsgirr- cutoff sign display
  // How long a liqClaim (see the handleMsg additions in _liqLaunchBatch/_liqResumeBatch) holds a
  // symbol against the following partner's own live-jump path. Just needs to comfortably outlast
  // one _miwOnLiqMessage pass — its slowest branch is at most a couple of awaited single REST
  // calls (PEC/OC prefetch) — not a real lock, just a short head start so the leader always gets
  // first refusal on a symbol before the follower is allowed to evaluate it independently.
  const LIQ_CLAIM_TTL_MS = 10000;
  // Megacaps excluded from the population pool alongside BTC — their size skews OC/IO/Volume/liq
  // averages the same way BTC would. cfg.megacapExclude is seeded from this default below but is
  // a plain array on cfg (no picker UI) — edit it directly in saved config if the list needs to
  // change. Shared key name with MultiIndicator-Winter's own seed so either plugin can init it first.
  const DEFAULT_MEGACAP_EXCLUDE = ['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','TRXUSDT','LINKUSDT'];
  // Single source of truth for Permafrost's own scalar config defaults. Merged into cfg once
  // during init() (see below) — call sites read this.cfg.<key> directly, no inline `?? literal`.
  // Excludes: megacapExclude (array, own migration line), permafrostFioEnabled/permafrostWaveShowFio
  // (renamed from retired permafrostIoEnabled/permafrostWaveShowIo, own migration line — see init()),
  // and any key actually owned by the MultiIndicator-Winter sibling plugin (those keep their
  // defensive `?? literal` at the cross-read call site since MIW owns their default).
  const PERMAFROST_DEFAULT_CFG = Object.freeze({
    permafrostEnabled: true,
    permafrostSlopeWindowHours: 6,
    permafrostWaveShowMain: true,
    pfShowScore: true,
    pfShowStructure: false,
    pfShowLiq: true,
    pfShowFunding: false,
    pfShowVol: true,
    permafrostCrossEnabled: true,
    permafrostMutualDdLiftEnabled: true,
    // Extremity Scorer (replaces the old Slot Scorecard, v1.70.0 — see /versioning).
    // pfExtremitySplitPct/pfExtremityMinSamples govern the same "sort >=3 values into
    // high/lukewarm/low" cutoff for every dial family (fund, V/A, IO/A, OCS, OCX,
    // PEC/VSG shape magnitudes, Irregularity, Regime); pfLukewarmRatioPct is the
    // whole-ticker veto share. Liq anchors (sliq/bliq/msliq/mbliq/0liq) are not dials
    // and are unaffected by any of these — see _pfExtremityBuild.
    pfExtremityEnabled: true,
    pfCoQualPenaltyEnabled: true,
    pfCoQualDepthPct: 10,
    pfExtremityView: 'combined',
    pfExtremitySplitPct: 25,
    pfExtremityMinSamples: 3,
    pfLukewarmRatioPct: 70,
    pfExtremityReEvalEnabled: true,
    // Cap on pfDialSamplePool — the rolling, in-memory-only pool of raw criterion
    // readings (every annotation, not just closes) that the extreme-high/lukewarm/
    // extreme-low cutoff is actually computed from. See _pfDialSample/_pfExtremityBuild.
    pfExtremitySampleCap: 300,
    pfSpongeQuota: 30,
    pfStaleSlotDays: 7,
    pfPartnerScoreMode: 'wins',
    pfLiqEnabled: true,
    pfLiqBatchSize: 25,
    pfLiqSampleWindow: 72, // completed-batch snapshots retained for liquidation skew/regime
    pfLiqThresholdPct: 50,
    pfLiqSequesterEnabled: true,
    pfLiqSequesterCap: 12,
    pfLiqPrescreenEnabled: false,
    pfPecPrescreenEnabled: false,
    pfPecBatchSize: 25,
    pfPecBatchDelayMs: 2000,
    pfOcEnabled: true,
    pfOcOrderLimit: 100,
    // Gains Continuation (GC): own rolling 6h PnL, stepped in increments of pfGcThresholdPct
    // of base margin (minNotional/leverage). Each new step crossed broadcasts a one-shot 'gc'
    // cross event; if Ashfall also has GC on and reads it within pfGcFreshnessMult scan
    // intervals, it triggers a full drawdown halt on Ashfall (and vice versa). On by default —
    // a hot streak on one side is read as headwind risk for the other, same rationale as
    // Mutual DDH Lift; still requires GC on both bots (and Cross Broadcast on both) to do
    // anything, so a lone install with the partner file absent or on an old version is a no-op.
    pfGcEnabled: true,
    pfGcThresholdPct: 50,
    pfGcFreshnessMult: 2,
    pfSwitchoverEnabled: true,
  });
  const PFR_KEY        = '__permafrost_winter_v1';
  const PFR_LIQ_KEY         = '__pf_liq_batches';
  const PFR_LIQ_HISTORY_KEY = '__pf_liq_history';
  const PFR_LIQ_SEQUESTER_KEY = '__pf_liq_sequester';
  const PFR_OC_HIST_KEY     = '__pf_oc_history';
  const CROSS_KEY      = '__everwinter_cross_v1';
  const CROSS_TTL      = 30 * 24 * 3600 * 1000; // was tied to a 24h slider max that no longer holds (drawdown/gains-lock
    // hours are now user-set to arbitrary values, seen well past 24h in practice) — a bot's own ddh-start/glk-start
    // marker aging off the shared bus mid-halt used to silently kill Mutual DDH/Gains Lock lift for the back half of
    // any halt longer than the TTL, with no error and no retry. Sized generously (30d) instead of re-deriving from a
    // config value that can change. Own-side DDH lift math no longer depends on this at all — see _pfDdhStartedAt —
    // but partner-side reads (Switchover's _pfPartnerHalted, Gains Lock lift) still do, so this still needs to
    // outlast whatever halt length is actually configured.
  // Extremity Scorer's own store — deliberately a fresh key, not the old scorecard's
  // SCORE_KEY (dropped). Shared literally between Permafrost and Ashfall (same key
  // string), same as the old SCORE_KEY was — cross-bot sharing depends on that. The old
  // records only ever carried a tag string + pnl; the magnitude-driven split this
  // replaces it with reads that same tag string's existing numeric tier suffix (see
  // dialInfo below), so the record SHAPE is actually unchanged — but starting clean
  // avoids mixing pre-Extremity history (recorded before any dial cutoff existed) into
  // cutoff math it was never sampled for.
  const EXTREMITY_KEY  = '__everwinter_extremity_v1';
  const SCORE_SAFETY_TTL = 365 * 24 * 3600 * 1000;
  // pfDialSamplePool's own persistence key — deliberately per-side (not shared with Ashfall
  // like EXTREMITY_KEY/CROSS_KEY), since the two sides' dial families are computed
  // independently and have no reason to pool. See _pfLoadDialPool/_pfSaveDialPool.
  const DIAL_POOL_KEY = '__ew_pf_dialpool_v1';
  // Full-universe PEC/VSG candle log for Pre-Screening — same same-origin-localStorage
  // sharing convention as EXTREMITY_KEY/CROSS_KEY (Ashfall and Permafrost both read/write this,
  // so whichever fetches first each cycle saves the other one the trip), but deliberately
  // its own key rather than the generic _sharedWrite registry: that registry is capped at
  // SHARED_REGISTRY_BYTE_CAP (200KB, in PseudoChaser.html/PseudoWinter.html) sized for small
  // recent-snapshot caches (bulkTickers, pec_1h_last, liqResults) — a real per-symbol candle
  // history for the whole exchange is an order of magnitude bigger and would evict those on
  // arrival. Keyed by granularity bucket ('15m'/'1h'/'3h') so this stays correct even if
  // micPecGranularity and miwPecGranularity are set differently on the two installs.
  const KLINE_LOG_KEY      = '__everwinter_kline_log_v1';
  const KLINE_LOG_BYTE_CAP = 1.5 * 1024 * 1024;
  const pfCritEmoji = c => {
    if (/^fund/.test(c)) { const s = c.slice(4); const isNeg = s[0] === '-' || s === '<'; return (isNeg ? '💸' : '🤑') + s; }
    if (/^vm/.test(c))   return '🔊' + c.slice(2);
    if (/^va/.test(c))   return '🔊' + c.slice(2);
    if (/^ioa/.test(c))  return '🎲' + c.slice(3);
    // Retired (see VSG.md) — kept resolvable so old scorecard entries still render.
    if (/^lsa/.test(c))  return '🟥' + c.slice(3);
    if (/^lba/.test(c))  return '🟩' + c.slice(3);
    if (/^rasl/.test(c)) return '🔴' + c.slice(4);
    if (/^rabl/.test(c)) return '🟢' + c.slice(4);
    if (/^msliq/.test(c)) return '💦' + c.slice(5);
    if (/^mbliq/.test(c)) return '🧊' + c.slice(5);
    if (/^sliq/.test(c)) return '🥵' + c.slice(4);
    if (/^bliq/.test(c)) return '🥶' + c.slice(4);
    if (/^iot/.test(c))  return '🎲' + c.slice(3);
    if (/^iom/.test(c))  return '🧲' + c.slice(3);
    if (/^ocs/.test(c))  return '🔭' + c.slice(3);
    if (/^ocx/.test(c))  return '📡' + c.slice(3);
    // pec+/pec-/vsg+/vsg- are the new Extremity Scorer aggregate dial keys (one PEC/VSG
    // reading, shape/mid/momentum folded away — see dialDisplayKey/collapseFamilyDupes);
    // the old per-sub-tag names below are kept resolvable so pre-aggregate history/exports
    // still render.
    if (c === 'pec+') return '⬆️'; if (c === 'pec-') return '⬇️';
    if (c === 'vsg+') return '⏫'; if (c === 'vsg-') return '⏬';
    if (/^pec([a-z]+)/.test(c)) {
      const m = c.match(/^(pec[a-z]+)/);
      const base = m[1];
      const emoji = { pecob: '⬆️', pecos: '⬇️', pecalpha: '⤵️', pecdelta: '⤴️', pecmomup: '↗️', pecmomdn: '↘️', pecirr: '🔄' }[base] || '📊';
      return emoji + c.slice(base.length);
    }
    if (/^vsg([a-z]+)/.test(c)) {
      const m = c.match(/^(vsg[a-z]+)/);
      const base = m[1];
      const emoji = { vsgot: '⏫', vsgut: '⏬', vsgalpha: '🔼', vsgdelta: '🔽', vsgmomup: '⏩', vsgmomdn: '⏪', vsgirr: '🔀' }[base] || '📊';
      return emoji + c.slice(base.length);
    }
    // regimeb+/regimes+ are the new Extremity Scorer dial keys (bull/bear dominance,
    // Lo/Mid/Hi folded away — see dialDisplayKey); the old per-band names are kept
    // resolvable below only so pre-Extremity history/exports still render.
    if (c === 'regimeb+') return '🐂';
    if (c === 'regimes+') return '🐻';
    if (/^regime([a-z]+)/.test(c)) {
      const m = c.match(/^(regime[a-z]+)/);
      const base = m[1];
      const emoji = { regimebull: '🐂', regimebear: '🐻' }[base] || '📊';
      return emoji + c.slice(base.length);
    }
    if (c === '+24h') return '⬆️'; if (c === '-24h') return '⬇️';
    if (c === '+fund') return '🤑'; if (c === '-fund') return '💸';
    if (c === '+ocs') return '🔭+'; if (c === '-ocs') return '🔭-';
    if (c === '0liq') return '⚫';
    if (c === 'liveliq+') return '💥';
    if (c === 'past1') return '⏳';
    if (c === 'liqturnover+') return '🌊';
    if (c === 'liqturnover-') return '🏜️';
    if (c === 'liqquiet+') return '🤫';
    if (c === 'liqquiet-') return '🚨';
    if (c === '>10pct') return '🔊'; if (c === '<10pct') return '🔉';
    return c;
  };
  // Collapses a single recorded (tiered) criterion down to its base+sign bucket, e.g.
  // "fund+3" -> "fund+", "ocx+18" -> "ocx+". Used both for Extremity display aggregation
  // and for Extremity storage retention — the sponge quota is meant to cap records per
  // base-criterion combination, not per exact tier value (which is combinatorially large
  // and would barely ever repeat, defeating the quota). Bare '+fund'/'-fund' (Blind-Entry/
  // Liquid-Diver's own tag, never produced by MIW which is always tiered) now folds
  // straight into the same 'fund+'/'fund-' dial pole MIW's own tiered reads use — see
  // DIAL_POLES/BARE_DIAL_TAGS above and _pfExtremityBuild — one unified read per signal.
  const collapseCrit = c => c.replace(/\d+$/, '');
  const collapseKey = criteria => [...criteria].map(collapseCrit).sort().join(',');

  // ── Extremity Scorer dial families ──
  // Every continuous/tiered criterion already carries its computed depth as a numeric
  // suffix on the annotated tag (e.g. "fund+3", "pecob+12" — see MultiIndicator-Winter's
  // _miwOpen/_miwAnnotateLiveCrit, which floor that same depth into a tier). The dial
  // reuses that existing magnitude directly rather than needing a separate raw-value log.
  // Two-pole families pit their '+'/'-' (or named-opposite) side against each other —
  // "which extreme end was more profitable". Single-pole families (Irregularity) have no
  // opposite reading at all (see StrategyBook.md: irregularity is the enemy of extremity,
  // not a side of it) and only ever classify hot-vs-lukewarm within their own spread.
  // 0-liq is a two-pole family like any other: '0liq' (bare, no gradation — zero liquidation
  // across the window) is its positive pole; any live liq reading (sliq/bliq/msliq/mbliq,
  // all four folded into one aggregate reading — sign there is depth direction, not a
  // separate criterion) is its negative pole, tiered on live depth same as fund/pec/etc.
  // See _pfExtremityBuild for the lukewarm (Past-1/liq-) classification used at veto/re-eval time.
  const DIAL_POLES = {
    'fund+': { family: 'fund', pole: 'pos' },       'fund-': { family: 'fund', pole: 'neg' },
    'va+':   { family: 'va',   pole: 'pos' },       'va-':   { family: 'va',   pole: 'neg' },
    'ioa+':  { family: 'ioa',  pole: 'pos' },       'ioa-':  { family: 'ioa',  pole: 'neg' },
    'ocs+':  { family: 'ocs',  pole: 'pos' },       'ocs-':  { family: 'ocs',  pole: 'neg' },
    'ocx+':  { family: 'ocx',  pole: 'pos' },       'ocx-':  { family: 'ocx',  pole: 'neg' },
    // PEC/VSG: one aggregate dial per family, not one per boolean shape tag — a ticker
    // is credited/vetoed on how extreme PEC (or VSG) reads OVERALL, not separately for
    // each of the shape/mid/momentum sub-tests it happens to also satisfy. All three PEC
    // sub-reads share the single 'pec' family+pole below; likewise VSG. When a position
    // matches more than one PEC (or VSG) sub-tag at once, collapseFamilyDupes keeps only
    // the single strongest reading before it ever reaches the veto or the build pass.
    'pecob+':    { family: 'pec', pole: 'pos' }, 'pecos+':    { family: 'pec', pole: 'neg' },
    'pecalpha+': { family: 'pec', pole: 'pos' }, 'pecdelta+': { family: 'pec', pole: 'neg' },
    'pecmomup+': { family: 'pec', pole: 'pos' }, 'pecmomdn+': { family: 'pec', pole: 'neg' },
    'vsgot+':    { family: 'vsg', pole: 'pos' }, 'vsgut+':    { family: 'vsg', pole: 'neg' },
    'vsgalpha+': { family: 'vsg', pole: 'pos' }, 'vsgdelta+': { family: 'vsg', pole: 'neg' },
    'vsgmomup+': { family: 'vsg', pole: 'pos' }, 'vsgmomdn+': { family: 'vsg', pole: 'neg' },
    // Live liq — sliq/bliq/msliq/mbliq are one aggregate negative-pole reading against 0liq's
    // positive pole (see DIAL_POLES comment above), not four separate anchors. Sign here is
    // depth direction, so both '+' and '-' variants of all four types route to the same pole.
    'sliq+':  { family: '0liq', pole: 'neg' }, 'sliq-':  { family: '0liq', pole: 'neg' },
    'bliq+':  { family: '0liq', pole: 'neg' }, 'bliq-':  { family: '0liq', pole: 'neg' },
    'msliq+': { family: '0liq', pole: 'neg' }, 'msliq-': { family: '0liq', pole: 'neg' },
    'mbliq+': { family: '0liq', pole: 'neg' }, 'mbliq-': { family: '0liq', pole: 'neg' },
  };
  // Single-pole families split their OWN sample spread into three (see singlePoleClassify):
  // top splitPct is "high", bottom splitPct is "low", the middle is lukewarm. liqquiet is the
  // market-wide "quiet window" read — % of a closed batch's symbols with zero liquidation
  // (see MIW's _miwOnLiqClose) — same shape as liqturnover: one raw magnitude stream, always
  // tagged '+' at the source, with BOTH extremes (very quiet / very active) emerging
  // naturally from where a given reading falls in that stream's own distribution over time,
  // not asserted up front the way a two-pole family's opposite sign would be.
  const DIAL_SINGLE = new Set(['pecirr+', 'vsgirr+', 'liqturnover+', 'liqquiet+']);
  // Sentinel for 0-liq's lukewarm reading (Past-1/liq- — real liquidation, never crossed the
  // live threshold). Not a magnitude/cutoff reading like every other dial's lukewarm state,
  // so it's asserted directly rather than derived — see _pfExtremityVeto and MIW's
  // _miwLiqCurrentRead (same literal string, independently defined — the two plugins don't
  // share a JS scope).
  const LIQ_LUKEWARM = '0liq~lukewarm';
  // Bare Blind-Entry/Liquid-Diver tags carry no magnitude at all — sign is the entire
  // signal. They fold into the SAME family as MIW's own tiered fund/ocs dial (previously
  // kept in a deliberately separate bucket to avoid key collisions — under Extremity
  // Scorer that collision is the point: one unified read per underlying signal) and always
  // classify extreme, since there's no gradation to be lukewarm about. '0liq' is the same
  // shape: bare, untiered, always the 0-liq family's extreme positive pole. 'past1' is its
  // own independent family (not nested under 0liq's two poles, to avoid touching the
  // cutoff/veto/blocking machinery those two already share) — boolean by nature (a trade
  // either was or wasn't a Past-1 entry, see MIW's Past-1 matching branch), so it's always
  // extreme the same way. Rendered as a visual 3rd block on the 0-liq pill regardless —
  // see _pfExtremityHtml's dial grouping.
  const BARE_DIAL_TAGS = {
    '+fund': { family: 'fund', pole: 'pos' }, '-fund': { family: 'fund', pole: 'neg' },
    '+ocs':  { family: 'ocs',  pole: 'pos' }, '-ocs':  { family: 'ocs',  pole: 'neg' },
    '0liq':  { family: '0liq', pole: 'pos' },
    'past1': { family: 'past1', pole: 'pos' },
  };
  // Regime folds in as one more two-pole family (bull dominance vs bear dominance)
  // instead of its old separate fixed Low/Mid/High x Bull/Bear 6-bucket system — the
  // s/b prefix matches REGIME_SEGMENT_LABEL's existing convention (s=Bull, b=Bear); the
  // lo/mid/hi band is dropped entirely, its old fixed thresholds replaced by the same
  // sample-derived cutoff every other dial uses, driven by the depth already attached.
  const regimeDialInfo = key => {
    const m = key.match(/^regime(bull|bear)\+$/);
    return m ? { family: 'regime', pole: m[1] === 'bull' ? 'pos' : 'neg' } : null;
  };
  const dialInfo = key => DIAL_POLES[key] || BARE_DIAL_TAGS[key] || regimeDialInfo(key)
    || (DIAL_SINGLE.has(key) ? { family: key.slice(0, -1), pole: 'single' } : null);
  // Single-pole families (Irregularity) split their OWN sample spread into three, same
  // "organically arrange into highs and lows" idea as every two-pole dial, just from one
  // shared magnitude stream instead of two separately-tagged ones: top splitPct of
  // pecirr/vsgirr's own readings is "high" (family|pos), bottom splitPct is "low"
  // (family|neg), everything between is lukewarm. Cutoffs for both sides come from
  // _pfExtremityBuild's cutoff pass below; this just applies them to one reading.
  const singlePoleClassify = (family, mag, cutoffs) => {
    const hi = cutoffs[family + '|pos'], lo = cutoffs[family + '|neg'];
    if (hi != null && mag >= hi) return 'pos';
    if (lo != null && mag <= lo) return 'neg';
    return null; // lukewarm — below the high cutoff, above the low cutoff (or neither is proven yet)
  };
  // Maps a family+pole back to a display/emoji-lookup key. Regime is the only family
  // whose display key doesn't already match an existing pre-Extremity tag name (its old
  // per-band names no longer apply once lo/mid/hi collapses into one dial) — everything
  // else keeps its original tag string so pfCritEmoji and the Blockable Criteria picker
  // keep working unchanged.
  const DIAL_DISPLAY = {
    pec: ['pec+', 'pec-'], vsg: ['vsg+', 'vsg-'],
    pecirr: ['pecirr+', 'pecirr-'], vsgirr: ['vsgirr+', 'vsgirr-'],
    // liqturnover isn't a criterion tag by itself — it's the market-wide raw liquidation
    // turnover magnitude MIW samples from every closed batch (see MIW's _miwOnLiqClose),
    // regardless of whether any ticker actually fired live or Past-1 off of it. Its own
    // extreme-high/extreme-low split (via singlePoleClassify) IS what live-liq/Past-1 entry
    // gating now reads — see _miwLiqHighCutoff/_miwLiqLowCutoff in MultiIndicator-Winter.
    liqturnover: ['liqturnover+', 'liqturnover-'],
    liqquiet: ['liqquiet+', 'liqquiet-'],
  };
  const dialDisplayKey = (family, pole) => {
    if (family === 'regime') return pole === 'pos' ? 'regimeb+' : 'regimes+';
    if (family === '0liq') return pole === 'pos' ? '0liq' : 'liveliq+';
    if (['fund', 'va', 'ioa', 'ocs', 'ocx'].includes(family)) return family + (pole === 'pos' ? '+' : '-');
    const pair = DIAL_DISPLAY[family];
    return pair ? (pole === 'neg' ? pair[1] : pair[0]) || family : family;
  };
  // Collapses same-family duplicate readings down to the single strongest one before
  // anything scores or vetoes off them. A position can genuinely satisfy more than one
  // PEC sub-tag at once (e.g. pecob AND pecalpha both true) — under Extremity that's
  // still ONE PEC reading, not two votes, so only the highest-magnitude sub-tag survives
  // per family. Same for VSG. Every other family already has at most one matching tag per
  // position, so this is a no-op for them; anchors and unrecognized tags pass straight
  // through untouched.
  const AGGREGATE_FAMILIES = new Set(['pec', 'vsg']);
  const collapseFamilyDupes = crits => {
    const byFamily = new Map();
    const passthrough = [];
    for (const c of (crits || [])) {
      const key = collapseCrit(c);
      const info = dialInfo(key);
      if (!info || !AGGREGATE_FAMILIES.has(info.family)) { passthrough.push(c); continue; }
      const noGradation = info.pole !== 'single' && !!BARE_DIAL_TAGS[key];
      const m2 = c.match(/(-?\d+)$/);
      const mag = noGradation ? Infinity : (m2 ? Math.abs(parseInt(m2[1], 10)) : 0);
      const cur = byFamily.get(info.family);
      if (!cur || mag > cur.mag) byFamily.set(info.family, { crit: c, mag });
    }
    return [...passthrough, ...[...byFamily.values()].map(v => v.crit)];
  };

  // the S/B naming already used by the regime criteria themselves, see Regime.md).
  const REGIME_SEGMENT_LABEL = { regimebull: 'Bull', regimebear: 'Bear' };

  const HALF_LIFE_MS   = 7 * 24 * 3600 * 1000; // recency decay half-life — old scars fade
  const MIN_MASS       = 6;                    // evidence mass (kernel-weighted closes) required to use history
  const STRONG_MASS    = 12;                   // evidence mass for a *strong* historical bias (2× MIN_MASS)
  const STRONG_SCORE   = 0.30;                 // |score| at/above which the bias counts as strong
  const DEFAULT_HALT_MS = 12 * 3600 * 1000;    // stock 12h horizon — the floor unless strong history says otherwise
  const MIN_HALT_MS    = 1 * 3600 * 1000;      // never thaw before 1h (only reachable under a strong bias)

  // independently at TYPE_BYTE_CAP bytes, trimming its own oldest entries when it alone
  // exceeds budget. Deliberately atomized rather than one blanket cap on the whole plugin
  // blob, so an oversized data type can't force pruning of unrelated data that's still
  // well within budget — e.g. a liq-history spike shouldn't cost wave history records.
  const TYPE_BYTE_CAP = 200 * 1024;
  function trimToByteCap(arr, maxBytes = TYPE_BYTE_CAP) {
    // Assumes arr is ordered oldest-first (push-appended). Converges in a handful of
    // iterations by estimating how many records to drop from the size overshoot, rather
    // than shifting one at a time and re-stringifying the whole array each try.
    if (!Array.isArray(arr) || arr.length < 2) return arr;
    let out = arr;
    let size = new Blob([JSON.stringify(out)]).size;
    let guard = 0;
    while (size > maxBytes && out.length > 1 && guard < 25) {
      const avg = size / out.length;
      const excess = size - maxBytes;
      const drop = Math.min(out.length - 1, Math.max(1, Math.ceil(excess / avg)));
      out = out.slice(drop);
      size = new Blob([JSON.stringify(out)]).size;
      guard++;
    }
    return out;
  }

    transform(def) {

      let _pfWasGainsLocked          = false;

        _pfDdhStartedAt: null, // Date.now() of this bot's own current DDH halt, set once at the

                               // note back off the shared cross bus, which can age out of CROSS_TTL
                               // mid-halt on any halt longer than the TTL window.

        pfCloses:     [],   // { ts, pnl, skew, breadth } — per-close PnL paired with structure at close time
        pfWave:       [],   // { ts, lean } — structure-lean trajectory, retained up to ~a week (the "wave")
        pfScoreboard: [],   // sorted Extremity Scorer entries built from EXTREMITY_KEY records
        pfScorecardExpanded: null,     // key of currently expanded dial, or null
        pfDialCutoffs: {},             // {[family|pole]: magnitude} — the live "extreme begins here" line per dial

        // regardless of whether that reading ever becomes a candidate or a trade. This — NOT
        // closed-trade records — is what pfDialCutoffs is computed from. Persists across
        // restarts via DIAL_POOL_KEY (init() loads it explicitly — see there for why the
        // lazy `||=` pattern used elsewhere can't do this on its own, since this declared
        // default is already truthy).
        pfDialSamplePool: {},          // {[family|pole]: number[]}
        pfDialSampleCounts: {},        // {[family|pole]: n} — for the "unproven, still lukewarm by default" badge
        pfKlineBar:   { bearSum: 0, bullSum: 0, max: 50 }, // merged (own + partner) kline bar for display
        _pfOwnKlineBar: null,                       // own-only kline bar before partner merge
        _pfKlineBarAt: 0,                           // hourly candle timestamp of last own kline sample
        _pfStructureList: null, _pfStructureAt: 0, // own 3h ticker cache independent of host
        pfStatus:  { skew: null, breadth: null, score: null, mass: 0, count: 0, lean: 0, slope: 0, inherent: 0, eff: null, fioScore: null, at: 0 },
        pfCrossEvents: [],

        // host's Gains Lock window (that one only populates when cfg.gainsLockEnabled is on;
        // GC needs to work regardless). _pfGcLastStep is the highest step index already

        _pfGcLastStep:   0,
        _pfGcLastSeenTs: 0,
        _liqBatches: [],
        _liqLastBatchSyms: [], // tickers picked for liq surveillance on the most recent scan only
        _liqMessageHooks: [], // plugins push (batch, sym) => void here to react to live liq turnover, e.g. Liquid-Diver
        _liqCloseHooks: [], // plugins push (results, batch) => void here to react to a closed cycle's final per-symbol snapshot, e.g. Liquid-Diver's 0-liq detection

        _liqResults: {},
        _liqResultsVersion: 0,
        // sym -> ms timestamp the leader's claim on it expires — see LIQ_CLAIM_TTL_MS and the

        _liqClaimUntil: {},
        _liqCycleHistory: [],

        _liqLatestResults: [],
        _liqCycleCounter: 0,
        _liqAvgYPx: null,
        _liqYAxisHtml: '',
        _liqHighlightedCycleTs: null, // ts of a clicked cycle in the LIQUIDATION SAMPLE chart; null = follow latest

        _liqAvgBTurnover: 0, // avg buy-liq $ across all recorded cycles
        _pfOcCycleHistory: [], // rolling per-cycle snapshots: {id, ts, results:[{sym,bc,sc,avgMs,n}]}

        pfOcResults: {},       // {[sym]:{bc,sc,avgMs,n}} from the most recent OC fetch batch

        _pfOcYAxisHtml: '',
        _pfOcAvgYPx: null,
        _pfOcHighlightedCycleTs: null, // ts of a clicked cycle in the ORDER INTERVAL SAMPLE chart; null = follow latest
        _pfOcViewMode: 'oc', // 'oc' | 'vol' | 'io' — which sample the tethered chart/summary/chips display

        async init() {

          // false initial value. Without this, reloading the tab mid-halt made the very next
          // tick see a false→true "transition" that never really happened, rewriting the
          // cross-event start timestamp to "now" — which silently made an already-old halt look
          // freshly started, breaking the Mutual DDH Lift age comparison below (it picks the
          // *older* halt to lift, so an inflated timestamp can flip which side loses the halt).

          _pfWasGainsLocked = this._isGainsLocked?.()    ?? false;

          // mid-halt backfill immediately below needs it to decide whether a value already
          // exists before falling back to a back-calculated guess.
          try {
            const _pfEarly = JSON.parse(localStorage.getItem(PFR_KEY) || 'null');

          } catch(_) {}

          // mid-halt reload (see comment above) to avoid an inflated "now" timestamp — but that
          // means a bot whose tab restarts mid-halt (backgrounded/killed on mobile, manual
          // refresh, etc.) never broadcasts *any* ddh-start for that halt, so Mutual DDH Lift can
          // never react to it no matter how long the halt runs or what the partner does — this
          // is the actual cause of a same-halt lift silently never firing, not CROSS_TTL. Backfill
          // one here if the bus doesn't already show us as actively halted, using the halt's real
          // start time (back-calculated from the restored _drawdownHaltUntil) rather than "now" —
          // that preserves the age comparison Mutual DDH Lift depends on instead of trading a
          // missing marker for a too-recent one.
          if ((this.cfg.permafrostCrossEnabled ?? true)) {
            if (_pfWasHalted && !this._manualHalt && typeof this._drawdownHaltUntil === 'number') {
              const _ownDdh = this._pfCrossRead().filter(e => e.source === 'winter' && (e.kind === 'ddh-start' || e.kind === 'ddh-end')).at(-1);
              if (!_ownDdh || _ownDdh.kind === 'ddh-end') {

                this._pfCrossWrite('ddh-start', null, { ts: this._drawdownHaltUntil - _haltMs });
              }

              // the halt began, on whichever earlier session actually triggered it). This only
              // fires as a one-time migration fallback — upgrading mid-halt, or a persisted value
              // that somehow never got written — using the same back-calculation as the cross-bus
              // backfill above. Imperfect if the halt wasn't started via drawdownHaltHours (e.g. the
              // host's own native throttle running a different duration), but only ever needed once;
              // every halt-start going forward stamps this directly at the moment it happens.
              if (this._pfDdhStartedAt == null) {

              }

            if (_pfWasGainsLocked && typeof this._gainsLockHaltUntil === 'number') {

              if (!_ownGlk || _ownGlk.kind === 'glk-end') {

          // Renamed from permafrostIoEnabled/permafrostWaveShowIo ('IO' read as Open Interest,
          // confusable with the unrelated iot/iom criteria — this line is purely funding-rate-derived).
          // Fall back to the old key so an existing user's toggle choice survives the rename.
          if (this.cfg.permafrostFioEnabled        === undefined) this.cfg.permafrostFioEnabled        = this.cfg.permafrostIoEnabled ?? true;
          if (this.cfg.permafrostWaveShowFio        === undefined) this.cfg.permafrostWaveShowFio        = this.cfg.permafrostWaveShowIo ?? true;

          // PERMAFROST_DEFAULT_CFG above. Call sites read this.cfg.<key> directly with no inline
          // fallback, since this guarantees every key below is present after init runs once.
          for (const [k, v] of Object.entries(PERMAFROST_DEFAULT_CFG)) {
            if (this.cfg[k] === undefined) this.cfg[k] = v;
          }
          this._pfApplySwitchover(_pfWasHalted);
          try {
            const saved = JSON.parse(localStorage.getItem(PFR_LIQ_KEY) || 'null');
            if (Array.isArray(saved) && this.cfg.pfLiqEnabled) {

                for (const s of valid) this._liqResumeBatch(s);

          try {
            const hist = JSON.parse(localStorage.getItem(PFR_LIQ_HISTORY_KEY) || 'null');

              const last = hist[hist.length - 1];
              this._liqLatestResults = last.results || [];
              for (const r of last.results || [])

          try {
            const _sharedLiq = this._sharedRead?.('liqResults');

          } catch(_) {}

          // registered once here rather than gated on _lfIsFollowing at registration time, since
          // that flag can flip mid-session (see _lfIsFollowing()) and this hook should already be
          // wired up the moment it does.
          this.registerSharedMessageHook?.((msg) => {
            if (!msg || !this.cfg.permafrostCrossEnabled) return;
            if (msg.type === 'liqClaim') {
              // Leader signaling "evaluating this symbol live right now" — recorded regardless of
              // our own leader/follower state (cheap either way), but only ever consulted below
              // while we're actually following. See LIQ_CLAIM_TTL_MS for why this is a short,
              // self-expiring head start rather than a real lock.
              const { sym } = msg.payload || {};
              if (sym) this._liqClaimUntil[sym] = Date.now() + LIQ_CLAIM_TTL_MS;
            } else if (msg.type === 'liqLiveRelay') {

              // actually following (if we're leading ourselves, our own handleMsg already covers
              // this symbol directly and reacting to our own echo again would double-fire).
              if (!this._lfIsFollowing?.()) return;

              if (!sym) return;

              // handleMsg comment on why) — if it's still within its TTL, the leader gets first
              // refusal and we skip entirely rather than risk opening the opposite side of the
              // same ticker on the same account. A symbol the leader ultimately passes on is
              // still fair game for us the next time it crosses, once the claim expires.
              if ((this._liqClaimUntil[sym] || 0) > Date.now()) return;
              const relayBatch = { sLiqTurnover: { [sym]: sLiqTurnover || 0 }, bLiqTurnover: { [sym]: bLiqTurnover || 0 } };
              for (const fn of (this._liqMessageHooks || [])) { try { fn(relayBatch, sym); } catch(_) {} }
            } else if (msg.type === 'liqAvgTurnover') {
              if (!this._lfIsFollowing?.()) return;
              const { avgS, avgB } = msg.payload || {};
              if (typeof avgS === 'number') this._liqAvgSTurnover = avgS;
              if (typeof avgB === 'number') this._liqAvgBTurnover = avgB;
            } else if (msg.type === 'liqResults') {
              // The closed-cycle snapshot (see init()'s one-time merge above) — re-pull on every
              // update instead of only once at startup, so it doesn't quietly go stale for the
              // rest of the session.
              const _fresh = this._sharedRead?.('liqResults');
              if (_fresh && Object.keys(_fresh).length) this._liqResults = { ...this._liqResults, ..._fresh };

            const _ocHist = JSON.parse(localStorage.getItem(PFR_OC_HIST_KEY) || 'null');

              const { cleaned: _cleaned, purged: _purged } = this._ocSanitizeHistory(_ocHist);

              if (_purged > 0) {

                this._ocPersistHistory();
              }

              // finishing after a newer one has already pushed would otherwise leave a stale
              // batch sitting last in the array.
              const _last = this._pfOcCycleHistory.reduce((a,c) => (!a || c.ts > a.ts) ? c : a, null);
              if (_last?.results) for (const r of _last.results) { if (r && typeof r.sym === 'string') this.pfOcResults[r.sym] = { bc: r.bc, sc: r.sc, avgMs: r.avgMs, n: r.n }; }

            }
          } catch(_) {}

          // pfDialSamplePool's own reactive declaration above starts it at `{}`, which is
          // already truthy, so `this.pfDialSamplePool ||= this._pfLoadDialPool()` never actually
          // ran the load; every restart silently kept the freshly-declared empty pool instead of
          // the persisted one, forcing every dial's cutoff to reprove itself from scratch. Load
          // for real here, before the first _pfExtremityBuild() call below.
          this.pfDialSamplePool = this._pfLoadDialPool();
          this._pfScoreTrim();
          this._pfExtremityBuild();
          try {
            const raw = localStorage.getItem(PFR_KEY);
            if (raw) {
              const s = JSON.parse(raw);

              if (Array.isArray(s.closes)) this.pfCloses  = s.closes.slice(-CLOSES_CAP);
              if (Array.isArray(s.wave))      this.pfWave      = s.wave.filter(p => Date.now() - p.ts < WAVE_TTL_MS).slice(-WAVE_CAP);

              // gainsWindow restore — a stale entry surviving a long-offline reload shouldn't
              // count toward a step it wouldn't have reached had the tab stayed open.
              if (Array.isArray(s.gcWindow)) this.pfGcWindow = s.gcWindow.filter(e => e?.ts && (Date.now() - e.ts) < 6 * 3600 * 1000);
              if (typeof s.gcLastStep === 'number') this._pfGcLastStep = s.gcLastStep;
            }
          } catch(e) {}
          this.log(`[PFR] Permafrost (Winter) v${VERSION} loaded — ${this.cfg.permafrostEnabled ? 'enabled' : 'disabled'} | ${this.pfCloses.length} closes on record`, 'info');

            if (this.cfg.permafrostCrossEnabled) this._pfCheckCross().catch(() => {});
            // _pfExtremityBuild() is NOT called on THIS setInterval timer (it runs every few
            // seconds, purely for cross-plugin housekeeping) — it's called once per runScan
            // cycle instead (see runScan), which is frequent enough to track the sample pool
            // filling in without redoing the full sort/rebuild on every single interval tick.

                // reading our own ddh-start note back off the shared cross bus — that note is

                // any halt longer than the TTL, which used to silently strand this comparison
                // with nothing to compare against for the rest of a long halt. Partner side still
                // reads the bus, since that's the only visibility we have into their state.
                const _partnerDdh = this._pfCrossRead().filter(e => e.source === 'chaser' && (e.kind === 'ddh-start' || e.kind === 'ddh-end')).at(-1);

                    this._haltLoggedKind = null;
                    this._pfDdhStartedAt = null;

                  }
                }
              }
              // Gains Continuation (GC) receive side — requires this bot to also have GC on
              // (own toggle doubles as the opt-in to react to the partner's broadcast, same
              // convention as Mutual DDH Lift). Freshness window mirrors the codebase's
              // established partner-staleness pattern (2× scan cadence = 1 missed-cycle grace),
              // just user-configurable here via pfGcFreshnessMult instead of hardcoded 2×.
              // Dedupes on event ts via _pfGcLastSeenTs so a still-fresh event isn't re-actioned
              // every 15s tick, and a since-gone-stale one isn't re-checked forever either.
              if (this.cfg.pfGcEnabled) {
                const _gcEvt = this._pfCrossRead().filter(e => e.source === 'chaser' && e.kind === 'gc').at(-1);
                if (_gcEvt && _gcEvt.ts !== this._pfGcLastSeenTs) {
                  this._pfGcLastSeenTs = _gcEvt.ts;
                  const _gcFreshMs = Math.max(1, this.cfg.scanMins ?? 10) * (this.cfg.pfGcFreshnessMult ?? 2) * 60 * 1000;
                  if ((Date.now() - _gcEvt.ts) < _gcFreshMs) {
                    this._drawdownHaltUntil = Date.now() + (this.cfg.drawdownHaltHours ?? 6) * 3600 * 1000;
                    this._haltLoggedKind = null;
                    this.persist();
                    this.log(`[PFR] 🚨 Gains Continuation — fresh broadcast from Ashfall (step ${_gcEvt.step ?? '?'}, +${(_gcEvt.pnl ?? 0).toFixed(2)} USDT 6hr) — full drawdown halt triggered.`, 'warn');
                  }
                }
              }
            }
            if (this.cfg.permafrostEnabled && (this._isDrawdownHalted?.() ?? false)) {
              const _cdMs = this.cfg.bulkTickerCooldownHours * 3600 * 1000;
              if ((Date.now() - (this._pfStructureAt || 0)) >= _cdMs) {
                this._pfFetchStructure().then(r => {
                  if (!r) return;
                  this._pfAddSample(r);
                  if (!r._fresh) return;
                  const { score, mass, count } = this.pfStatus;
                  const _d = this._pfDescribe(r, score, mass, count);
                  this.log(`[PFR] ❄ Structure check (halted) — ${_d.desc} — ${_d.bias}`, 'info');
                }).catch(() => {});
              }
            }
            // Partner sample: keep wave chart and sampling bars alive using Ashfall's latest data
            if (this.cfg.permafrostEnabled) {
              const _ps = this._pfReadPartnerSample();
              this._pfMergeKlineBar();
              if (_ps) {
                // During own halt: adopt partner's sampling metrics so bars stay current
                if (this._isDrawdownHalted?.() || this._isGainsLocked?.()) {
                  if (_ps.fundSkew) this._miwFundSkew = _ps.fundSkew;
                  if (_ps.volSkew)  this._miwVolSkew  = _ps.volSkew;
                }
                // Merge partner liq history — add entries not already in own history (by ts), sort, cap
                if (Array.isArray(_ps.liqHistory) && _ps.liqHistory.length) {
                  const _ownTs = new Set((this._liqCycleHistory || []).map(e => e.ts));
                  const _added = _ps.liqHistory.filter(e => e.ts && !_ownTs.has(e.ts));
                  if (_added.length) {
                    this._liqCycleHistory = [...(this._liqCycleHistory || []), ..._added]
                      .sort((a, b) => a.ts - b.ts).slice(-Math.max(3, this.cfg.pfLiqSampleWindow || 72));
                    this._liqPersistHistory();
                  }
                }
                const _lwTs = this.pfWave.length ? this.pfWave[this.pfWave.length - 1].ts : 0;
                if (_ps.ts > _lwTs + 60_000) {
                  this.pfWave.push({ ts: _ps.ts, lean: +(_ps.lean ?? 0).toFixed(4), vol: +(_ps.vol ?? 0).toFixed(4), volAbs: _ps.volAbs ?? 0, fio: _ps.fioScore != null ? +_ps.fioScore.toFixed(4) : null, score: null });
                  const _cut = Date.now() - WAVE_TTL_MS;
                  if (this.pfWave.length && this.pfWave[0].ts < _cut) this.pfWave = this.pfWave.filter(p => p.ts >= _cut);
                  if (this.pfWave.length > WAVE_CAP) this.pfWave = this.pfWave.slice(-WAVE_CAP);
                }
              }
            }
          }, 15000);
        },

        persist() {
          _origPers.call(this);
          try {
            // Each array is its own atomized data type — capped independently so an
            // oversized one (e.g. volume history) can't crowd out another (e.g. wave).
            this.pfEvents     = trimToByteCap(this.pfEvents);
            this.pfCloses     = trimToByteCap(this.pfCloses);
            this.pfWave       = trimToByteCap(this.pfWave);
            this.pfGcWindow   = trimToByteCap(this.pfGcWindow);
            localStorage.setItem(PFR_KEY, JSON.stringify({
              events: this.pfEvents, closes: this.pfCloses, wave: this.pfWave,
              pfKlineBar: this.pfKlineBar, gcWindow: this.pfGcWindow, gcLastStep: this._pfGcLastStep,
              ddhStartedAt: this._pfDdhStartedAt,
            }));
          } catch(e) {}
        },

        // ── Market structure reading — full ticker universe, not the curated pools ──
        async _pfFetchStructure() {
          try {
            // Reuse the host scan's bulk ticker response when fresh (slow-tick
            // sampling during halts falls back to fetching — scans don't run then)
            const cooldownMs = this.cfg.bulkTickerCooldownHours * 3600 * 1000;
            let list, _freshData = false;
            if (this._pfStructureList?.length && (Date.now() - (this._pfStructureAt || 0)) < cooldownMs) {
              list = this._pfStructureList; // own cache within cooldown
            } else if (this._lastAllTickers?.length && (Date.now() - (this._lastAllTickersAt || 0)) < 60000) {
              list = this._lastAllTickers;  // host just fetched this tick — piggyback
              this._pfStructureList = list;
              this._pfStructureAt   = this._lastAllTickersAt;
              _freshData = true;
            } else {
              const _shared = this._sharedRead?.('bulkTickers');
              if (_shared?.data?.tickers?.length && (Date.now() - (_shared.ts || 0)) < cooldownMs) {
                list = _shared.data.tickers; // partner fetched recently — adopt
                this._pfStructureList = list;
                this._pfStructureAt   = _shared.ts;
                _freshData = true;
              } else if (this._lfIsFollowing?.()) {
                return null; // following a live partner — no shared structure data yet, skip this cycle
              } else {
                const r = await this._qFetch(`${this.base}/v5/market/tickers?category=linear`);
                const d = await r.json();
                if (d.retCode !== 0) return null;
                list = d.result?.list || [];
                this._pfStructureList = list;
                this._pfStructureAt   = Date.now();
                _freshData = true;
              }
            }
            let gSum = 0, lSum = 0, gCount = 0, lCount = 0;
            let gTurnover = 0, lTurnover = 0;
            let frSum = 0, frCount = 0;
            for (const t of list) {
              if (!t.symbol.endsWith('USDT') || (this.cfg.megacapExclude || DEFAULT_MEGACAP_EXCLUDE).includes(t.symbol)) continue;
              if (parseFloat(t.lastPrice || 0) < 0.001) continue;
              const ch  = parseFloat(t.price24hPcnt || 0) * 100;
              const tvr = parseFloat(t.turnover24h  || 0);
              if (ch > 0)      { gSum += ch; gCount++; gTurnover += tvr; }
              else if (ch < 0) { lSum += Math.abs(ch); lCount++; lTurnover += tvr; }
              const fr = parseFloat(t.fundingRate || 0);
              if (!isNaN(fr)) { frSum += fr * 100; frCount++; } // accumulate as %
            }
            const sumT   = gSum + lSum, cntT = gCount + lCount;
            const totalTvr = gTurnover + lTurnover;
            const vol    = totalTvr > 0 ? +((gTurnover - lTurnover) / totalTvr).toFixed(4) : 0;
            const volAbs = +(totalTvr / 1e9).toFixed(2); // USD billions

            // Collective FIO from aggregate funding rate: positive funding = longs paying = crowd net long.
            // Normalised against 0.05% reference (≈5× the typical 0.01%/8h baseline) → [-1, 1].
            const fioScore = frCount > 0
              ? +Math.max(-1, Math.min(1, (frSum / frCount) / 0.05)).toFixed(4)
              : null;

            return {
              ts: Date.now(),
              skew:    sumT > 0 ? (gSum - lSum) / sumT : 0,
              breadth: cntT > 0 ? (gCount - lCount) / cntT : 0,
              gCount, lCount,
              gSum: +gSum.toFixed(1), lSum: +lSum.toFixed(1),
              vol, volAbs, fioScore, _fresh: _freshData,
            };
          } catch(e) { return null; }
        },

        // ── Human-readable structure + historical-bias phrasing for the activity log ──
        // Intensity ranges over mildly / moderately / strongly bullish (or bearish). The
        // tiers are entirely relative to this installation's own history: thresholds are
        _pfDescribe(reading, score, mass, count) {
          const lean = (reading.skew + reading.breadth) / 2;
          const hist = this.pfCloses.map(x => Math.abs((x.skew + x.breadth) / 2)).sort((a, b) => a - b);
          const q = p => hist[Math.min(hist.length - 1, Math.floor(p * hist.length))];
          const [tFlat, tModerate, tStrong] = hist.length >= 30 ? [q(0.25), q(0.5), q(0.8)] : [0.08, 0.20, 0.40];
          const mag    = Math.abs(lean);
          const adverb = mag >= tStrong ? 'strongly ' : mag >= tModerate ? 'moderately ' : 'mildly ';
          const struct = mag <= tFlat ? 'flat/mixed' : `${adverb}${lean > 0 ? 'bullish' : 'bearish'}`;
          const slope  = this._pfTrajectory().slope;
          const trend  = slope > 0.05 ? ', rising' : slope < -0.05 ? ', falling' : '';
          const desc   = `${struct}${trend}`;
          const inherent = this._pfInherent(lean, slope, reading.fioScore ?? null);
          const eff    = this._pfEffectiveScore(score, mass, inherent);
          let bias;
          if (score === null || mass < MIN_MASS) {
            bias = 'thin history';
          } else {
            const entryMargin = (this.cfg.minNotional || 6) / (this.cfg.leverage || 6);
            const avgPnl = score * entryMargin;
            const sign = avgPnl >= 0 ? '+' : '-';
            bias = `avg ${sign}${Math.abs(avgPnl).toFixed(2)}/position (${count} similar close${count === 1 ? '' : 's'})`;
          }
          return { desc, bias, eff };
        },

        // ── Hostility score: kernel-weighted, recency-decayed, normalized by entry margin.
        // score ∈ [−1,1]; mass = evidence weight; count = closes within kernel radius.
        _pfScore(reading) {
          const entryMargin = (this.cfg.minNotional || 6) / (this.cfg.leverage || 6);
          const now = Date.now();
          let num = 0, mass = 0, count = 0;
          for (const c of this.pfCloses) {
            const ds = reading.skew - c.skew, db = reading.breadth - c.breadth;
            const k  = Math.exp(-(ds * ds + db * db) / (2 * KERNEL_H * KERNEL_H));
            const dec = Math.pow(0.5, (now - c.ts) / HALF_LIFE_MS);
            const norm = Math.max(-1, Math.min(1, c.pnl / entryMargin));
            num  += norm * k * dec;
            mass += k * dec;
            if (k > 0.1) count++;
          }
          return { score: mass > 0 ? num / mass : null, mass, count };
        },

        // ── The wave: recent path of the structure lean (oldest → newest) ──
        // lean = (skew + breadth) / 2 ∈ [−1,1]: +1 strongly bullish, −1 strongly bearish.
        _pfWaveSeries() {
          const cut = Date.now() - WAVE_TTL_MS;
          return this.pfWave.filter(p => p.ts >= cut);
        },

        _pfScoreNet() {
          const cs = this.miwCollapsedCritStats || {};
          const vals = Object.values(cs);
          const net = vals.reduce((a,c)=>a+c.pnl,0);
          const abs = vals.reduce((a,c)=>a+Math.abs(c.pnl),0);
          return { net: -net, abs };
        },

        // Append a structure-lean point to the wave and prune by age / cap. Kept
        // separate from pfCloses (which track realized PnL) so the wave
        // retains the full trajectory for as long as we have data, up to ~a week.
        _pfPushWave(reading) {
          const { net: _scNet, abs: _scAbs } = this._pfScoreNet();
          const _score  = _scAbs > 0 ? +((_scNet / _scAbs).toFixed(4)) : null;
          this.pfWave.push({ ts: reading.ts, lean: +(((reading.skew + reading.breadth) / 2)).toFixed(4), vol: reading.vol ?? 0, volAbs: reading.volAbs ?? 0, fio: reading.fioScore ?? null, score: _score });
          const cut = Date.now() - WAVE_TTL_MS;
          if (this.pfWave.length && this.pfWave[0].ts < cut) this.pfWave = this.pfWave.filter(p => p.ts >= cut);
          if (this.pfWave.length > WAVE_CAP) this.pfWave = this.pfWave.slice(-WAVE_CAP);
        },

        // Current lean plus its trajectory (slope = avg lean over last N hours − avg lean N–2N hours ago).
        // Using a fixed time window (cfg.permafrostSlopeWindowHours, default 6h) so "turning bullish/bearish"
        // always reflects the same timeframe regardless of how much wave history has accumulated.
        // slope > 0 → drifting bullish; slope < 0 → drifting bearish.
        _pfTrajectory() {
          const wave = this._pfWaveSeries();
          const n    = wave.length;
          const lean = n ? wave[n - 1].lean : (((this.pfStatus.skew ?? 0) + (this.pfStatus.breadth ?? 0)) / 2);
          if (n < WAVE_MIN_PTS) return { lean, slope: 0, n };
          const winMs     = (this.cfg.permafrostSlopeWindowHours) * 3600 * 1000;
          const now       = Date.now();
          const recentPts = wave.filter(p => p.ts >= now - winMs);
          const olderPts  = wave.filter(p => p.ts >= now - 2 * winMs && p.ts < now - winMs);
          if (!recentPts.length || !olderPts.length) return { lean, slope: 0, n };
          const recent = recentPts.reduce((a, p) => a + p.lean, 0) / recentPts.length;
          const older  = olderPts.reduce((a, p) => a + p.lean, 0) / olderPts.length;
          return { lean, slope: recent - older, n };
        },

        // Inherent favourability for this bot's direction (DIR), from the wave alone:
        // a short bot likes bearish *and* falling structure; longing likes bullish/rising.
        // The slope term is what stops us shorting into the start of a pump (mildly
        // bearish but turning up) or longing into the start of a dump.
        _pfInherent(lean, slope, fioScore) {
          const slopeN = Math.max(-1, Math.min(1, (slope || 0) / SLOPE_REF));
          // FIO is direct: crowd-long pressure is bullish, crowd-short pressure is bearish.
          // W_FIO is additive alongside lean/slope — the outer clamp keeps the result in [-1, 1].
          const fioN = fioScore != null ? Math.max(-1, Math.min(1, fioScore)) : 0;
          return Math.max(-1, Math.min(1, DIR * (W_LEAN * (lean || 0) + W_SLOPE * slopeN + W_FIO * fioN)));
        },

        // Effective score: learned history is primary, the inherent wave is the
        // fallback — blended by how much evidence the profile actually has.
        _pfEffectiveScore(score, mass, inherent) {
          const massFrac = Math.max(0, Math.min(1, (mass || 0) / STRONG_MASS));
          return score === null ? inherent : massFrac * score + (1 - massFrac) * inherent;
        },

        async _pfUpdateKlineBar() {
          const lastHourStart = Math.floor(Date.now() / 3_600_000) * 3_600_000 - 3_600_000;
          // Piggyback on MIW's cache when it's populated for the right hour
          const cache = this._miwKlineCache;
          if (cache && Object.keys(cache).length > 0) {
            let bearSum = 0, bullSum = 0;
            for (const e of Object.values(cache)) {
              if (e.candleStart !== lastHourStart || !e.open) continue;
              const pct = (e.close - e.open) / e.open * 100;
              if (pct < 0) bearSum += -pct;
              else if (pct > 0) bullSum += pct;
            }
            if (bearSum > 0 || bullSum > 0) {
              this.pfKlineBar = { bearSum, bullSum, max: this.cfg.miwKlineScanCap ?? 20 };
              this._pfOwnKlineBar = { ...this.pfKlineBar };
              this._pfMergeKlineBar();
              return;
            }
          }
          // MIW didn't fetch klines this cycle — own sample, cached per completed hourly candle
          if (this._pfKlineBarAt === lastHourStart && (this.pfKlineBar.bearSum > 0 || this.pfKlineBar.bullSum > 0)) {
            this._pfMergeKlineBar(); return;
          }
          if (this._lfIsFollowing?.()) { this._pfMergeKlineBar(); return; } // following — no own kline sample
          try {
            const allTickers = this._lastAllTickers || [];
            const cap = this.cfg.miwKlineScanCap ?? 20;
            let syms = allTickers
              .filter(t => t.symbol.endsWith('USDT') && !(this.cfg.megacapExclude || DEFAULT_MEGACAP_EXCLUDE).includes(t.symbol) && parseFloat(t.lastPrice || 0) >= 0.001)
              .map(t => t.symbol);
            if (!syms.length) return;
            for (let i = syms.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [syms[i], syms[j]] = [syms[j], syms[i]];
            }
            syms = syms.slice(0, cap);
            let bearSum = 0, bullSum = 0;
            await Promise.all(syms.map(async sym => {
              try {
                const r = await this._qFetch(`${this.base}/v5/market/kline?category=linear&symbol=${sym}&interval=60&limit=2`);
                const d = await r.json();
                if (d.retCode !== 0) return;
                const list = d?.result?.list;
                if (!list || list.length < 2) return;
                const candle = list[1];
                if (parseInt(candle[0]) !== lastHourStart) return;
                const open = parseFloat(candle[1]), close = parseFloat(candle[4]);
                if (!open) return;
                const pct = (close - open) / open * 100;
                if (pct < 0) bearSum += -pct;
                else if (pct > 0) bullSum += pct;
              } catch(e) {}
            }));
            this._pfKlineBarAt = lastHourStart;
            this.pfKlineBar = { bearSum, bullSum, max: cap };
            this._pfOwnKlineBar = { ...this.pfKlineBar };
            this._pfMergeKlineBar();
          } catch(e) {}
        },

        _pfWriteSample(reading) {
          try {
            const raw = localStorage.getItem(SAMPLE_STATE_KEY);
            const state = raw ? JSON.parse(raw) : {};
            // liqHistory duplicates data already fully persisted under its own key
            // (PFR_LIQ_HISTORY_KEY) — it's shared here only so a halted partner can
            // backfill cycles it missed. Cap it as its own atomized type rather than
            // embedding the full (already independently-capped) history verbatim.
            state.winter = {
              ts: reading.ts,
              klineBar: this._pfOwnKlineBar ?? this.pfKlineBar,
              fundSkew: this._miwFundSkew ?? null,
              volSkew: this._miwVolSkew ?? null,
              vol: reading.vol ?? 0,
              volAbs: reading.volAbs ?? 0,
              fioScore: reading.fioScore ?? null,
              lean: +((reading.skew + reading.breadth) / 2).toFixed(4),
              liqHistory: trimToByteCap(this._liqCycleHistory ?? []),
            };
            localStorage.setItem(SAMPLE_STATE_KEY, JSON.stringify(state));
          } catch(e) {}
        },

        _pfReadPartnerSample() {
          try {
            const raw = localStorage.getItem(SAMPLE_STATE_KEY);
            if (!raw) return null;
            const s = JSON.parse(raw)?.chaser ?? null;
            return (s && s.ts >= Date.now() - 7_200_000) ? s : null;
          } catch(e) { return null; }
        },

        _pfMergeKlineBar() {
          const own = this._pfOwnKlineBar ?? this.pfKlineBar;
          const partner = this._pfReadPartnerSample();
          const pb = partner?.klineBar;
          if (!pb || (!pb.bearSum && !pb.bullSum)) return;
          this.pfKlineBar = {
            bearSum: own.bearSum + pb.bearSum,
            bullSum: own.bullSum + pb.bullSum,
            max: (own.max || 50) + (pb.max || 50),
          };
        },

        _pfScoreRead() {
          try {
            const raw = localStorage.getItem(EXTREMITY_KEY);
            if (!raw) return [];
            const cut = Date.now() - SCORE_SAFETY_TTL;
            return (JSON.parse(raw) || []).filter(r => r.ts >= cut && Array.isArray(r.criteria) && r.criteria.length);
          } catch(e) { return []; }
        },
        _pfScoreTrim() {
          try {
            const records   = this._pfScoreRead();
            const quota     = this.cfg.pfSpongeQuota;
            const staleDays = this.cfg.pfStaleSlotDays;
            const staleMs   = staleDays * 24 * 3600 * 1000;
            const now       = Date.now();
            // +fund/-fund are NOT legacy — Blind-Entry and Liquid-Diver actively write them as
            // their primary criteria tags. Only the genuinely dead pre-tiered criteria purge here.
            const LEGACY    = new Set(['>10pct','<10pct','lsa','lba','rasl','rabl']);
            const isLegacy  = r => r.criteria.some(c => LEGACY.has(c));
            const bySlot = {};
            for (const r of records) {
              if (isLegacy(r)) continue;
              const k = collapseKey(r.criteria);
              if (!bySlot[k]) bySlot[k] = [];
              bySlot[k].push(r);
            }
            const trimmed = [];
            for (const recs of Object.values(bySlot)) {
              recs.sort((a, b) => b.ts - a.ts);
              const kept = recs.slice(0, quota);
              if (!kept.length) continue;
              if (now - kept[0].ts < staleMs) trimmed.push(...kept);
            }
            const GLOBAL_CAP = 5000;
            const capped = trimmed.sort((a, b) => b.ts - a.ts).slice(0, GLOBAL_CAP);
            // Per-slot quota + GLOBAL_CAP bound the record *count*, but with enough
            // distinct auto-generated slot buckets the total byte size can still run
            // large — apply the same atomized byte cap as a final safety net, oldest first.
            const byteCapped = trimToByteCap([...capped].reverse()).reverse();
            localStorage.setItem(EXTREMITY_KEY, JSON.stringify(byteCapped));
          } catch(e) {}
        },
        _pfScoreWrite(criteria, pnl, hist = false) {
          try {
            const records = this._pfScoreRead();
            const rec = { ts: Date.now(), criteria, pnl, source: 'winter' };
            if (hist) rec.hist = true;
            records.push(rec);
            const quota = this.cfg.pfSpongeQuota;
            const bySlot = {};
            for (const r of records) {
              const k = collapseKey(r.criteria);
              if (!bySlot[k]) bySlot[k] = [];
              bySlot[k].push(r);
            }
            const trimmed = [];
            for (const recs of Object.values(bySlot)) {
              recs.sort((a, b) => b.ts - a.ts);
              trimmed.push(...recs.slice(0, quota));
            }
            const byteCapped = trimToByteCap([...trimmed].reverse()).reverse();
            localStorage.setItem(EXTREMITY_KEY, JSON.stringify(byteCapped));
            return byteCapped;
          } catch(e) { return null; }
        },
        // Gates whether a partner-sourced record's PnL is allowed to move a criterion's score,
        // per cfg.pfPartnerScoreMode. pnl here is the partner's own realized pnl (positive =
        // partner won that trade) — not the inverted effectivePnl used downstream. Own-sourced
        // records are never gated; this only concerns the seesaw between own and partner.
        _pfPartnerCounts(pnl) {
          const mode = this.cfg.pfPartnerScoreMode || 'wins';
          if (mode === 'both') return true;
          if (mode === 'losses') return pnl < 0;
          return pnl > 0; // 'wins' (default)
        },
        // Feeds the Extremity Scorer's cutoff computation. Called from every criterion
        // annotation — scan-time pool building, live liq messages, Extremity Re-Evaluation —
        // NOT gated behind a close or even an actual entry. This is deliberate: a dial's
        // cutoff needs to be provable from the wide stream of what the market is actually
        // showing right now, not from the narrow trickle of closed trades. Sampling only from
        // closes would deadlock at cold start — nothing opens until a dial is proven, and a
        // dial can only prove itself from closes that require something to have opened first.
        _pfDialSample(tag) {
          if (!tag) return;
          const info = dialInfo(collapseCrit(tag));
          if (!info) return;
          const m = tag.match(/(-?\d+)$/);
          if (!m) return; // bare Blind-Entry/Liquid-Diver tags (+fund/-fund/+ocs/-ocs) carry no
                           // magnitude — they always classify extreme regardless (see
                           // _pfExtremityBuild/_afExtremityVeto), nothing to prove here.
          const dk = info.family + '|' + info.pole;
          const pool = (this.pfDialSamplePool ||= this._pfLoadDialPool());
          const arr = (pool[dk] ||= []);
          arr.push(Math.abs(parseInt(m[1], 10)));
          const cap = this.cfg.pfExtremitySampleCap || 300;
          if (arr.length > cap) arr.splice(0, arr.length - cap);
          this._pfSaveDialPool();
        },
        // pfDialSamplePool now persists (DIAL_POOL_KEY) instead of being memory-only, so a
        // restart doesn't reset every dial to "unproven" and blank out every extreme
        // classification until live samples happen to rebuild it — which is what was
        // happening before. Loaded lazily (first _pfDialSample/_pfExtremityBuild call each
        // session) rather than at some fixed init point, and saved with a light throttle since
        // _pfDialSample fires on every live annotation, not just closes.
        _pfLoadDialPool() {
          try {
            const raw = localStorage.getItem(DIAL_POOL_KEY);
            return raw ? JSON.parse(raw) : {};
          } catch (e) { return {}; }
        },
        _pfSaveDialPool() {
          const now = Date.now();
          if (now - (this._pfDialPoolLastWrite || 0) < 3000) return;
          this._pfDialPoolLastWrite = now;
          try { localStorage.setItem(DIAL_POOL_KEY, JSON.stringify(this.pfDialSamplePool || {})); } catch (e) {}
        },
        // ── Extremity Scorer core build (replaces the old slot-combo + collapsed-criterion +
        // Regime-Based-Scoring + Blind-Entry-bucket passes wholesale — see /versioning v1.70.0).
        //
        // Cutoffs are computed FIRST, from pfDialSamplePool (the observation stream — see
        // _pfDialSample above), independent of closed-trade records entirely: for each dial
        // pole with >= pfExtremityMinSamples readings, the cutoff is the magnitude at the
        // configured split percentile of that pole's OWN observed spread — "organically
        // arrange them into highs and lows" per the user's own framing. A pole below the
        // sample floor has no proven cutoff and stays lukewarm by default (never credited,
        // never blocking) until it clears the floor — which, sampling from live readings
        // rather than closes, usually happens within the first scan or two, not never.
        //
        // Records are then walked ONCE: only occurrences that classify as extreme under
        // their pole's already-known cutoff are scored into that pole's win/loss/pnl — a
        // lukewarm close is exactly what this system exists to avoid crediting, so it's
        // excluded from "which extreme end was more profitable" rather than diluting it.
        // Liq anchors (no dial) are scored directly as before, unaffected by any of this.
        //
        // Bare Blind-Entry/Liquid-Diver tags and single-pole families with no magnitude
        // gradation always classify extreme — there's nothing to be lukewarm about. Regime is
        // just one more two-pole family here (see regimeDialInfo) — its old fixed Lo/Mid/Hi
        // bands and separate Regime-Based Scoring pass are gone; the signed Bull/Bear snapshot
        // is scored through the same sample-derived cutoff as every other two-pole family.
        _pfExtremityBuild(records) {
          records = records || this._pfScoreRead();
          const exclude = new Set(this.cfg.miwAutoSlotExclude || []);
          const quota = this.cfg.pfSpongeQuota;
          const minSamples = Math.max(3, this.cfg.pfExtremityMinSamples || 3);
          const splitPct = Math.min(0.49, Math.max(0.01, (this.cfg.pfExtremitySplitPct ?? 25) / 100));
          const critBase = c => /^sliq/.test(c) ? 'sliq' : /^bliq/.test(c) ? 'bliq' : c;
          const sortedRecords = [...records].sort((a, b) => b.ts - a.ts);

          const samplePool = (this.pfDialSamplePool ||= this._pfLoadDialPool());
          const cutoffs = {};
          for (const [dk, mags] of Object.entries(samplePool)) {
            const [family, pole] = dk.split('|');
            if (pole === 'single') {
              // One shared sample stream, two cutoffs — see singlePoleClassify.
              if (mags.length < minSamples) { cutoffs[family + '|pos'] = null; cutoffs[family + '|neg'] = null; continue; }
              const sorted = [...mags].sort((a, b) => a - b);
              const hiIdx = Math.min(sorted.length - 1, Math.floor(sorted.length * (1 - splitPct)));
              const loIdx = Math.max(0, Math.floor(sorted.length * splitPct));
              cutoffs[family + '|pos'] = sorted[hiIdx];
              cutoffs[family + '|neg'] = sorted[loIdx];
              continue;
            }
            if (mags.length < minSamples) { cutoffs[dk] = null; continue; }
            const sorted = [...mags].sort((a, b) => a - b);
            const idx = Math.min(sorted.length - 1, Math.floor(sorted.length * (1 - splitPct)));
            cutoffs[dk] = sorted[idx];
          }

          const dialStats = {};
          const dialCount = {};
          // Per-tag blocking-only record — see PEC_VSG_AGGREGATE comment below. Every family
          // except pec/vsg has exactly one raw tag per pole already, so this ends up identical
          // to dialStats for them; harmless, not worth special-casing away.
          const subtagStats = {};
          for (const r of sortedRecords) {
            const keptCrits = exclude.size ? r.criteria.filter(c => !exclude.has(critBase(c))) : r.criteria;
            if (!keptCrits.length) continue;
            const pnl = typeof r.pnl === 'number' ? r.pnl : (r.win ? 1 : -1);
            const isPartner = r.source !== 'winter';
            const counts = !isPartner || this._pfPartnerCounts(pnl);
            const effectivePnl = isPartner ? -pnl : pnl;
            for (const c of keptCrits) {
              const key = collapseCrit(c);
              const info = dialInfo(key);
              if (!info) continue; // unrecognized/retired tag — no dial, not scored
              const noGradation = info.pole !== 'single' && !!BARE_DIAL_TAGS[key];
              let mag = Infinity;
              if (!noGradation) {
                const m2 = c.match(/(-?\d+)$/);
                mag = m2 ? Math.abs(parseInt(m2[1], 10)) : 0;
              }
              let pole = info.pole;
              if (pole === 'single') {
                pole = singlePoleClassify(info.family, mag, cutoffs);
                if (!pole) continue; // lukewarm — not scored
              } else {
                const cutoff = cutoffs[info.family + '|' + pole];
                const isExtreme = !Number.isFinite(mag) || (cutoff != null && mag >= cutoff);
                if (!isExtreme) continue;
              }
              const dk = info.family + '|' + pole;
              if ((dialCount[dk] = (dialCount[dk] ?? 0) + 1) > quota) continue;
              if (!dialStats[dk]) dialStats[dk] = { pnl: 0, wins: 0, losses: 0, ownPnl: 0, ownWins: 0, ownLosses: 0, hasHist: false, hasTrade: false };
              const stats = dialStats[dk];
              if (counts) { stats.pnl += effectivePnl; if (effectivePnl > 0) stats.wins++; else stats.losses++; }
              if (!isPartner) { stats.ownPnl += pnl; if (pnl > 0) stats.ownWins++; else stats.ownLosses++; }
              if (r.hist) stats.hasHist = true; else stats.hasTrade = true;
              // Individual PEC/VSG sub-tags (pecob, pecalpha, pecmomup, ...) each get their
              // OWN win/loss record here, keyed by the raw tag itself — separate from the
              // pooled dk above. See PEC_VSG_AGGREGATE comment in MultiIndicator-Winter for
              // why: Slot Blocking needs to react to one sub-tag going bad without waiting
              // for its whole 3-way pooled family to go bad too.
              if (!subtagStats[key]) subtagStats[key] = { pnl: 0, wins: 0, losses: 0 };
              const ts = subtagStats[key];
              if (counts) { ts.pnl += effectivePnl; if (effectivePnl > 0) ts.wins++; else ts.losses++; }
            }
          }
          // A dial can have a proven cutoff (samples exist) but zero closes yet — still needs
          // to show up (0 pnl, real sample count) rather than vanish from the panel/ranks.
          for (const dk of Object.keys(cutoffs)) {
            if (!dialStats[dk]) dialStats[dk] = { pnl: 0, wins: 0, losses: 0, ownPnl: 0, ownWins: 0, ownLosses: 0, hasHist: false, hasTrade: false };
          }
          for (const dk of Object.keys(dialStats)) {
            dialStats[dk].cutoff = cutoffs[dk] ?? null;
            // Single-pole families sample under one shared '|single' pool key, not the
            // synthetic '|pos'/'|neg' keys singlePoleClassify derives — fall back to it so
            // the sample count shown actually reflects what proved the cutoff.
            const [dkFamily, dkPole] = dk.split('|');
            const poolKey = samplePool[dkFamily + '|single'] ? dkFamily + '|single' : dk;
            dialStats[dk].sampleCount = (samplePool[poolKey] || []).length;
          }

          this.pfDialCutoffs = cutoffs;
          this.pfDialSampleCounts = Object.fromEntries(Object.entries(samplePool).map(([k, v]) => [k, v.length]));
          // Flat display-key -> stats map, same shape the old miwCollapsedSlotRanks/
          // miwCollapsedCritStats used — _miwScaledRank/_miwCritScore/_miwIsCritBlocked keep
          // reading this one flat lookup unchanged, with no idea dials or poles exist beneath it.
          const ranks = {}, dispStats = {};
          for (const [dk, stats] of Object.entries(dialStats)) {
            const [family, pole] = dk.split('|');
            const key = dialDisplayKey(family, pole);
            ranks[key] = stats.pnl;
            dispStats[key] = stats;
          }
          // Per-tag scores layer on top for blocking's benefit — never overwrites a dk-based
          // key above (raw sub-tags like 'pecob+' are always distinct strings from their
          // pooled dk display key 'pec+'; every other family's raw tag already equals its own
          // dk key, so this is a no-op re-write for them, not a collision).
          for (const [tag, ts] of Object.entries(subtagStats)) {
            ranks[tag] = ts.pnl;
          }
          this.miwCollapsedSlotRanks = ranks;
          this.miwCollapsedCritStats = dispStats;
          this.pfScoreboard = Object.entries(dispStats).sort(([,a],[,b]) => b.pnl - a.pnl).map(([key, s]) => ({ key, ...s }));
        },
        // Overall-lukewarmness veto — "explicitly avoid any ticker exhibiting lukewarm
        // values". Counts, across every dial-eligible criterion the ticker actually
        // exhibits, what share classifies lukewarm against the current cutoffs; an unproven
        // dial (below pfExtremityMinSamples) counts as lukewarm, same as a genuinely middling
        // reading. Vetoes once that share reaches pfLukewarmRatioPct (default 70%). 0-liq's
        // lukewarm state (the LIQ_LUKEWARM sentinel — a Past-1/liq- reading, real liquidation
        // that never crossed the live threshold) is asserted directly rather than derived
        // from a magnitude/cutoff, since Past-1 territory isn't a depth reading — see
        // _miwLiqCurrentRead in MultiIndicator-Winter. Single-pole families (Irregularity)
        // use the same singlePoleClassify split as the build pass — lukewarm is "neither
        // cutoff crossed", same meaning as everywhere else.
        _pfExtremityVeto(annotCrits) {
          if (!this.cfg.pfExtremityEnabled) return false;
          const cutoffs = this.pfDialCutoffs || {};
          let total = 0, lukewarm = 0;
          for (const c of (annotCrits || [])) {
            if (c === LIQ_LUKEWARM) { total++; lukewarm++; continue; }
            const key = collapseCrit(c);
            const info = dialInfo(key);
            if (!info) continue;
            total++;
            const m2 = c.match(/(-?\d+)$/);
            const mag = m2 ? Math.abs(parseInt(m2[1], 10)) : 0;
            if (info.pole === 'single') {
              if (!singlePoleClassify(info.family, mag, cutoffs)) lukewarm++;
              continue;
            }
            if (!!BARE_DIAL_TAGS[key]) continue; // no gradation, never lukewarm
            const cutoff = cutoffs[info.family + '|' + info.pole];
            if (cutoff == null || mag < cutoff) lukewarm++;
          }
          if (!total) return false;
          return (lukewarm / total * 100) >= (this.cfg.pfLukewarmRatioPct ?? 70);
        },
        // Extremity Re-Evaluation (secondary toggle, off by default). At the end of every
        // scan, re-derives each open position's own qualifying criteria against the CURRENT
        // dial cutoffs and closes it once it crosses the same lukewarm-ratio bar it had to
        // clear to open in the first place — held to the same standard throughout its life,
        // not just at entry. Deliberately reads only data this cycle already cached (bulk
        // ticker snapshot + MIW's live PEC/OC caches) rather than firing fresh fetches of its
        // own, so it rides the existing scan cadence instead of adding load on top of the
        // scan scheduler. A symbol with no fresh-enough cached tick this cycle is skipped
        // rather than forcing a fetch.
        async _pfExtremityReEval() {
          if (!this.cfg.pfExtremityEnabled || !this.cfg.pfExtremityReEvalEnabled) return;
          const snapshot = [...(this.positions || [])];
          const isRegime = c => /^regime/.test(collapseCrit(c).replace(/[+-]$/, ''));
          const isLiq0   = c => /^(sliq|bliq|msliq|mbliq|0liq)/.test(collapseCrit(c).replace(/[+-]$/, ''));
          for (const pos of snapshot) {
            if (!pos || !pos.symbol) continue;
            const crits = pos._miwCriteria || pos._bewCriteria || pos._ldwCriteria;
            if (!crits || !crits.length) continue;
            // Every other criterion re-evaluates the ticker on what changed about IT — that
            // needs this cycle's own tick, so a position is skipped this cycle if it's
