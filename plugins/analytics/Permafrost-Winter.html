<!--
  Permafrost Strategy Plugin for PseudoWinter
  Scoring and cross-bot coordination layer for MultiIndicator-Winter.

  Extremity Scorer / Lukewarm Scoring: every criterion reading MIW annotates is
  sampled into a rolling pool and sorted, per pole, into extreme vs lukewarm
  against that pole's own observed spread. Closed trades score both a per-pole
  dial (what MIW's blocking and co-qual ranking read) and a two-bucket Extreme vs
  Lukewarm tally; whichever bucket is in higher net profit becomes the side the
  entry veto targets, re-decided on every rebuild rather than toggled by hand.

  Cross bus: cascade/sacrifice triggers, drawdown-halt and gains-lock transitions
  and Gains Continuation steps are broadcast to Ashfall and read back, so the
  two sides can lift each other's halts (Mutual DDH Lift) or halt pre-emptively
  on the partner's winning streak (GC).

  Order Count Surveillance supplies the OC/volume/OI population samples that
  MIW's ocs, ocx, va, ioa, lta and lpa criteria are all measured against (lta/lpa read the
  1hr candle fetched per sampled ticker, see _pfHourCandle).

  The scorer is direction-agnostic: it only learns what realized PnL says
  about this installation, so the same logic powers Ashfall on PseudoChaser.
  Load via Plugin Manager in PseudoWinter's config panel.
  Load AFTER EverWinter if using live trading — see README Plugin Stack Order.
  targetBot: pseudowinter
-->
<script>
(function () {
  'use strict';

    const VERSION        = '2.5.0'; // Change: removed Preemption (Concentration's rank-by-score sub-toggle) with its UI and ranking code — Concentration always re-samples queued movers, and the movers-only settings no longer hide. Prior: 2.4.1 — Tweak: trimmed the changelog and history-only comments.
  // Megacaps excluded from the population pool alongside BTC — their size skews OC/IO/Volume/liq
  // averages the same way BTC would. cfg.megacapExclude is seeded from this default below but is
  // a plain array on cfg (no picker UI) — edit it directly in saved config if the list needs to
  // change. Shared key name with MultiIndicator-Winter's own seed so either plugin can init it first.
  const DEFAULT_MEGACAP_EXCLUDE = ['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','TRXUSDT','LINKUSDT'];
  // Single source of truth for Permafrost's own scalar config defaults. Merged into cfg once
  // during init() (see below) — call sites read this.cfg.<key> directly, no inline `?? literal`.
  // Excludes: megacapExclude (array, own migration line), and any key actually owned by the
  // MultiIndicator-Winter sibling plugin (those keep their defensive `?? literal` at the
  // cross-read call site since MIW owns their default).
  const PERMAFROST_DEFAULT_CFG = Object.freeze({
    permafrostEnabled: true,
    // Cross Broadcast is always on (no toggle) — see cross tab template.
    permafrostCrossEnabled: true,
    permafrostMutualDdLiftEnabled: true,
    // Extremity Scorer / Lukewarm Scoring. Criteria universe: fund, V/A, IO/A, OCS, OCX.
    // pfExtremitySplitPct/
    // pfExtremityMinSamples govern the same "sort >=3 values into high/lukewarm/low"
    // cutoff for every remaining dial family; pfLukewarmRatioPct is the whole-ticker veto
    // share — see _pfExtremityBuild/_pfExtremityVeto.
    pfExtremityEnabled: true,
    pfCoQualPenaltyEnabled: true,
    pfCoQualDepthPct: 10,
    pfExtremitySplitPct: 30,
    pfExtremityMinSamples: 3,
    pfLukewarmRatioPct: 70,
    pfExtremityReEvalEnabled: true,
    // Open-position rolling-average criteria. Off = frozen entry-time snapshot, no
    // per-scan single-ticker fetch per open position. On = the rolling average.
    pfPosRollingAvgEnabled: false,
    // Drift Credit (TENTATIVE — see _pfCreditShares): how a closed position's PnL is split
    // across its criteria. 'least' = least-drifted criterion gets most credit; 'most' = flipped;
    // 'off' = even split.
    pfDriftCreditMode: 'least',
    // Cap on pfDialSamplePool — the rolling, in-memory-only pool of raw criterion
    // readings (every annotation, not just closes) that the extreme-high/lukewarm/
    // extreme-low cutoff is actually computed from. See _pfDialSample/_pfExtremityBuild.
    pfExtremitySampleCap: 300,
    pfSampleScoringEnabled: true,  // Sample Scoring — score criteria against sampled tickers' LPA instead of closed-trade PnL
    pfSampleDelayed: true,         // Sample Scoring sub-toggle — pair tiers with the ticker's FORWARD 1hr move (resolved an hour later)
    pfConcEnabled: true,           // Concentration — Delayed Pairing sub-toggle: re-sample tickers that moved in the bot's favor over their resolved hour
    pfConcBoth: false,             // also re-sample tickers that moved against the bot
    pfConcTopOnly: false,          // only movers ranking in the top pfConcPct% of their resolved batch (off = any size)
    pfConcPct: 30,                 // top share of a resolved batch (by move size) used when pfConcTopOnly is on
    pfConcMaxPct: 100,             // most of the scan's batch Concentration may take; shuffled randoms fill the rest
    pfConcHL: true,                // rank by the hour's high/low swing (off = close move)
    pfSpongeQuota: 30,
    pfStaleSlotDays: 7,
    pfOcEnabled: true,
    pfOcOrderLimit: 100,
    pfOcBatchSize: 50, 
    // Gains Continuation (GC): own rolling 6h PnL, stepped in increments of pfGcThresholdPct
    // of base margin (minNotional/leverage). Each new step crossed broadcasts a one-shot 'gc'
    // cross event; if Ashfall also has GC on and reads it within pfGcFreshnessMult scan
    // intervals, it triggers a full drawdown halt on Ashfall (and vice versa). On by default —
    // a hot streak on one side is read as headwind risk for the other, same rationale as
    // Mutual DDH Lift; still requires GC on both bots to do anything, so a lone install with
    // the partner file absent or on an old version is a no-op.
    pfGcEnabled: true,
    pfGcThresholdPct: 100,
    pfGcFreshnessMult: 2,
  });
  const PFR_KEY        = '__permafrost_winter_v1';
  const PFR_OC_HIST_KEY     = '__pf_oc_history';
  const CROSS_KEY      = '__everwinter_cross_v1';
  const CROSS_TTL      = 30 * 24 * 3600 * 1000; // Sized generously (30d) since halt hours are user-set and can run well past 24h — a bot's own
    // ddh-start/glk-start marker aging off the shared bus mid-halt would silently kill Mutual DDH/Gains Lock lift.
    // Own-side DDH lift math doesn't depend on this (see _pfDdhStartedAt), but partner-side reads
    // (Gains Lock lift) do, so it must outlast whatever halt length is configured.
  // CROSS_TTL alone doesn't bound this bucket's size — it's a 30d floor sized for the rare
  // long-halt marker, but most event kinds (gc) only need minutes to hours and end
  // up carrying that same 30d tail for no reason. Byte-cap as the actual backstop, same
  // pattern and cap as _trimSharedRegistry in PseudoChaser/PseudoWinter — oldest event first,
  // regardless of kind, so a halt marker can still get evicted early under sustained pressure
  // (TTL is not a floor against eviction, only against premature natural expiry).
  const CROSS_BYTE_CAP = 200 * 1024;
  function _trimCrossEvents(events, maxBytes = CROSS_BYTE_CAP) {
    let json = JSON.stringify({ events });
    let size = new Blob([json]).size;
    if (size <= maxBytes) return events;
    const sorted = events.slice().sort((a, b) => (a.ts || 0) - (b.ts || 0));
    let idx = 0, guard = 0;
    while (size > maxBytes && idx < sorted.length && guard < 25) {
      const avg = size / Math.max(1, sorted.length - idx);
      const excess = size - maxBytes;
      const drop = Math.min(sorted.length - idx, Math.max(1, Math.ceil(excess / avg)));
      idx += drop;
      json = JSON.stringify({ events: sorted.slice(idx) });
      size = new Blob([json]).size;
      guard++;
    }
    return sorted.slice(idx);
  }
  // Extremity records are private to Permafrost (own scores only). LEGACY_SHARED_EXTREMITY_KEY
  // is the old cross-bot-shared key; _pfScoreRead migrates this side's own records out of it
  // once, below. Ashfall does the same independently, filtering for its own 'chaser'
  // records — reading it here never deletes or touches Ashfall's half.
  const EXTREMITY_KEY  = '__ew_pf_extremity_v1';
  const LEGACY_SHARED_EXTREMITY_KEY = '__everwinter_extremity_v1';
  const SCORE_SAFETY_TTL = 365 * 24 * 3600 * 1000;
  // pfDialSamplePool's persistence key — per-side; each bot's dial pool only serves its own cutoffs.
  // See _pfLoadDialPool/_pfSaveDialPool.
  const DIAL_POOL_KEY = '__ew_pf_dialpool_v1';
  const SAMPLE_OBS_KEY = '__ew_pf_sampleobs_v1'; // Sample Scoring: { obs:[], pending:[] }
  // Non-reactive on purpose: both are read from inside x-text/x-html renders, and writing
  // reactive state from a render effect would re-trigger that same effect.
  const WIN_MEMO   = {}; // field -> { key, val } — memo for _pfWindowStats
  const FRESH_TICKERS = {}; // sym -> raw ticker from this scan's per-symbol fetch (in-memory only)
  const HOUR_CACHE = {}; // sym -> { start, ht, hc } — last-completed-hour candle, one fetch per ticker per hour
  const pfCritEmoji = c => {
    if (/^fund/.test(c)) { const s = c.slice(4); const isNeg = s[0] === '-' || s === '<'; return (isNeg ? '🤑' : '💸') + s; }
    if (/^vm/.test(c))   return '🔊' + c.slice(2);
    if (/^va/.test(c))   return '🔊' + c.slice(2);
    if (/^ioa/.test(c))  return '🎲' + c.slice(3);
    // Retired (see VSG.md) — kept resolvable so old scorecard entries still render.
    if (/^lsa/.test(c))  return '🟥' + c.slice(3);
    if (/^lba/.test(c))  return '🟩' + c.slice(3);
    if (/^rasl/.test(c)) return '🔴' + c.slice(4);
    if (/^rabl/.test(c)) return '🟢' + c.slice(4);
    if (/^msliq/.test(c)) return '💦' + c.slice(5);
    if (/^mbliq/.test(c)) return '🧊' + c.slice(5);
    if (/^sliq/.test(c)) return '🥵' + c.slice(4);
    if (/^bliq/.test(c)) return '🥶' + c.slice(4);
    if (/^iot/.test(c))  return '🎲' + c.slice(3);
    if (/^iom/.test(c))  return '🧲' + c.slice(3);
    if (/^ocs/.test(c))  return '🔭' + c.slice(3);
    if (/^ocx/.test(c))  return '📡' + c.slice(3);
    if (/^lta/.test(c))  return '🕐' + c.slice(3);
    if (/^lpa/.test(c))  return '💹' + c.slice(3);
    // pec+/pec-/vsg+/vsg- and other retired dial tags may still appear in old exports/history
    // — kept resolvable here purely for cosmetic backward-compat display, even though PEC/VSG
    // (and regime, live-liq/0-liq/Past-1, liqturnover/liqquiet) are no longer live criteria.
    if (c === 'pec+') return '⬆️'; if (c === 'pec-') return '⬇️';
    if (c === 'vsg+') return '⏫'; if (c === 'vsg-') return '⏬';
    if (/^pec([a-z]+)/.test(c)) {
      const m = c.match(/^(pec[a-z]+)/);
      const base = m[1];
      const emoji = { pecob: '⬆️', pecos: '⬇️', pecalpha: '⤵️', pecdelta: '⤴️', pecmomup: '↗️', pecmomdn: '↘️', pecirr: '🔄' }[base] || '📊';
      return emoji + c.slice(base.length);
    }
    if (/^vsg([a-z]+)/.test(c)) {
      const m = c.match(/^(vsg[a-z]+)/);
      const base = m[1];
      const emoji = { vsgot: '⏫', vsgut: '⏬', vsgalpha: '🔼', vsgdelta: '🔽', vsgmomup: '⏩', vsgmomdn: '⏪', vsgirr: '🔀' }[base] || '📊';
      return emoji + c.slice(base.length);
    }
    // regimeb+/regimes+ are the new Extremity Scorer dial keys (bull/bear dominance,
    // Lo/Mid/Hi folded away — see dialDisplayKey); the old per-band names are kept
    // resolvable below only so pre-Extremity history/exports still render.
    if (c === 'regimeb+') return '🐂';
    if (c === 'regimes+') return '🐻';
    if (/^regime([a-z]+)/.test(c)) {
      const m = c.match(/^(regime[a-z]+)/);
      const base = m[1];
      const emoji = { regimebull: '🐂', regimebear: '🐻' }[base] || '📊';
      return emoji + c.slice(base.length);
    }
    if (c === '+24h') return '⬆️'; if (c === '-24h') return '⬇️';
    if (c === '+fund') return '🤑'; if (c === '-fund') return '💸';
    if (c === '+ocs') return '🔭+'; if (c === '-ocs') return '🔭-';
    if (c === '0liq') return '⚫';
    if (c === 'liveliq+') return '💥';
    if (c === 'past1') return '⏳';
    if (c === 'liqturnover+') return '🌊';
    if (c === 'liqturnover-') return '🏜️';
    if (c === 'liqquiet+') return '🤫';
    if (c === 'liqquiet-') return '🚨';
    if (c === '>10pct') return '🔊'; if (c === '<10pct') return '🔉';
    return c;
  };
  // Collapses a single recorded (tiered) criterion down to its base+sign bucket, e.g.
  // "fund+3" -> "fund+", "ocx+18" -> "ocx+". Used both for Extremity display aggregation
  // and for Extremity storage retention — the sponge quota is meant to cap records per
  // base-criterion combination, not per exact tier value (which is combinatorially large
  // and would barely ever repeat, defeating the quota). Bare '+fund'/'-fund' (Blind-Entry/
  // Liquid-Diver's own tag, never produced by MIW which is always tiered) now folds
  // straight into the same 'fund+'/'fund-' dial pole MIW's own tiered reads use — see
  // DIAL_POLES/BARE_DIAL_TAGS above and _pfExtremityBuild — one unified read per signal.
  const collapseCrit = c => c.replace(/\d+$/, '');
  const collapseKey = criteria => [...criteria].map(collapseCrit).sort().join(',');

  // ── Extremity Scorer dial families ──
  // Every continuous/tiered criterion already carries its computed depth as a numeric
  // suffix on the annotated tag (e.g. "fund+3" — see MultiIndicator-Winter's
  // _miwOpen/_miwAnnotateLiveCrit, which floor that same depth into a tier). The dial
  // reuses that existing magnitude directly rather than needing a separate raw-value log.
  // Two-pole families pit their '+'/'-' side against each other — "which extreme end was
  // more profitable". Criteria universe: fund, V/A, IO/A, OCS, OCX.
  const DIAL_POLES = {
    'fund+': { family: 'fund', pole: 'pos' },       'fund-': { family: 'fund', pole: 'neg' },
    'va+':   { family: 'va',   pole: 'pos' },       'va-':   { family: 'va',   pole: 'neg' },
    'ioa+':  { family: 'ioa',  pole: 'pos' },       'ioa-':  { family: 'ioa',  pole: 'neg' },
    'ocs+':  { family: 'ocs',  pole: 'pos' },       'ocs-':  { family: 'ocs',  pole: 'neg' },
    'ocx+':  { family: 'ocx',  pole: 'pos' },       'ocx-':  { family: 'ocx',  pole: 'neg' },
    // LTA/LPA — 1hr turnover vs own 24h/24, and 1hr price change vs the population's.
    'lta+':  { family: 'lta',  pole: 'pos' },       'lta-':  { family: 'lta',  pole: 'neg' },
    'lpa+':  { family: 'lpa',  pole: 'pos' },       'lpa-':  { family: 'lpa',  pole: 'neg' },
  };
  const BARE_DIAL_TAGS = {
    '+fund': { family: 'fund', pole: 'pos' }, '-fund': { family: 'fund', pole: 'neg' },
    '+ocs':  { family: 'ocs',  pole: 'pos' }, '-ocs':  { family: 'ocs',  pole: 'neg' },
  };
  const dialInfo = key => DIAL_POLES[key] || BARE_DIAL_TAGS[key] || null;
  // Every remaining family's display key already matches its own tag string.
  const dialDisplayKey = (family, pole) => family + (pole === 'pos' ? '+' : '-');
  const SAMPLE_STATE_KEY = '__ew_sample_state_v1'; // cross-bot sample sharing

  // ── Per-data-type storage cap ──
  // Each distinct data type (liq history, OC history, scorecard, ...) is capped
  // independently at TYPE_BYTE_CAP bytes, trimming its own oldest entries when it alone
  // exceeds budget. Deliberately atomized rather than one blanket cap on the whole plugin
  // blob, so an oversized data type can't force pruning of unrelated data that's still
  // well within budget.
  const TYPE_BYTE_CAP = 200 * 1024;
  function trimToByteCap(arr, maxBytes = TYPE_BYTE_CAP) {
    // Assumes arr is ordered oldest-first (push-appended). Converges in a handful of
    // iterations by estimating how many records to drop from the size overshoot, rather
    // than shifting one at a time and re-stringifying the whole array each try.
    if (!Array.isArray(arr) || arr.length < 2) return arr;
    let out = arr;
    let size = new Blob([JSON.stringify(out)]).size;
    let guard = 0;
    while (size > maxBytes && out.length > 1 && guard < 25) {
      const avg = size / out.length;
      const excess = size - maxBytes;
      const drop = Math.min(out.length - 1, Math.max(1, Math.ceil(excess / avg)));
      out = out.slice(drop);
      size = new Blob([JSON.stringify(out)]).size;
      guard++;
    }
    return out;
  }

  window.__BotPlugin = {
    id:        'permafrost-winter',
    name:      'Permafrost (Winter)',
    version:   VERSION,
    targetBot: 'pseudowinter',
    after:     ['everwinter'],
    before:    [],
    conflicts: [],
    requires:  [],
    touches:   ['init', 'persist', 'runScan', 'pseudoClosePosition', '_checkDrawdownThrottle', '_checkGainsLock', 'activateManualHalt'],

    css: `
      .pfr-hint { font-size:9px; color:var(--text-lo); margin-top:3px; line-height:1.5; }
      .pfr-stat { font-family:var(--mono); font-size:9px; color:var(--text-mid); line-height:1.7; }
      .pfr-tabs { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:2px; }
      .pfr-tab { font-family:var(--mono); font-size:9px; padding:3px 9px; border-radius:2px; border:1px solid; cursor:pointer; background:none; transition:border-color .12s,color .12s,background .12s; letter-spacing:.5px; }
      .pfr-tab.on { border-color:rgba(96,210,255,.6); color:var(--ice); background:rgba(96,210,255,.08); }
      .pfr-tab:not(.on) { border-color:rgba(255,255,255,.15); color:var(--text-lo); }
      .pfr-zone { margin-top:8px; padding:8px; background:rgba(255,255,255,.02); border:1px solid rgba(255,255,255,.06); border-radius:3px; }
      .pfr-opt { padding:5px 7px; font-size:9px; font-family:var(--mono); border-radius:2px; border:1px solid; cursor:pointer; background:none; transition:border-color .12s,background .12s,color .12s; }
    `,

    slots: {
      'mode-label-extra': `<span x-show="cfg.permafrostEnabled"> + Permafrost</span>`,
      // Accordion header emoji follows the host-family convention: ♨ for Chaser plugins,
      // ❄ for Winter plugins (set by Ashfall/Permafrost) — keep all plugin accordions matching.
      'strategy-accordions': `
        <div x-data="{ open: false, tC: false, tS: false }">
          <button class="cfg-acc-hd" @click="open=!open" :class="open?'open':''">
            <div style="display:flex;align-items:center;gap:7px">
              <span>❄ Permafrost</span>
              <span x-show="cfg.permafrostEnabled" style="font-size:8px;padding:1px 5px;background:rgba(96,210,255,.15);border:1px solid rgba(96,210,255,.3);border-radius:2px;color:var(--ice);letter-spacing:1px">ON</span>
              <span x-show="!cfg.permafrostEnabled" style="font-size:8px;padding:1px 5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:2px;color:var(--text-lo);letter-spacing:1px">OFF</span>
            </div>
            <span class="cfg-acc-arrow" :class="open?'open':''">▶</span>
          </button>
          <div x-show="open" x-transition.opacity class="cfg-acc-body">
            <label class="tog">
              <div class="tog-t" :class="cfg.permafrostEnabled?'on':''" @click.prevent="if(!cfgLocked){cfg.permafrostEnabled=!cfg.permafrostEnabled;persist()}"><div class="tog-k"></div></div>
              <div>
                <div class="tog-l">Permafrost Mode</div>
                <div class="pfr-hint">Scores which end of each criterion's range is currently paying, and vetoes candidates sitting on the other end.</div>
              </div>
            </label>
            <div class="pfr-tabs" style="margin-top:10px">
              <button class="pfr-tab" :class="tC?'on':''" @click="tC=!tC">CROSS</button>
              <button class="pfr-tab" :class="tS?'on':''" @click="tS=!tS">SCORE</button>
            </div>
            <div class="pfr-zone" x-show="tC">
              <div class="pfr-hint" style="padding:2px 0">Always on: broadcasts cascade/sacrifice closes and DDH/gains-lock transitions to Ashfall.</div>
              <div style="margin-top:6px">
                <label class="tog">
                  <div class="tog-t" :class="cfg.permafrostMutualDdLiftEnabled?'on':''" @click.prevent="if(!cfgLocked){cfg.permafrostMutualDdLiftEnabled=!cfg.permafrostMutualDdLiftEnabled;persist()}"><div class="tog-k"></div></div>
                  <div>
                    <div class="tog-l">Mutual DDH Lift</div>
                    <div class="pfr-hint">Lifts this bot's halt when Ashfall is also in drawdown halt (checked every 15 s).</div>
                  </div>
                </label>
                <label class="tog" style="margin-top:8px">
                  <div class="tog-t" :class="cfg.pfGcEnabled?'on':''" @click.prevent="if(!cfgLocked){cfg.pfGcEnabled=!cfg.pfGcEnabled;persist()}"><div class="tog-k"></div></div>
                  <div>
                    <div class="tog-l">Gains Continuation (GC)</div>
                    <div class="pfr-hint">Broadcasts each base-margin step of 6hr profit; a partner with GC on halts on a fresh one, both ways.</div>
                  </div>
                </label>
                <div x-show="cfg.pfGcEnabled" style="margin-top:8px">
                  <div class="g">
                    <div class="lbl">Step Size <b x-text="cfg.pfGcThresholdPct+'%'"></b> of base margin</div>
                    <input type="range" min="10" max="200" step="5" x-model.number="cfg.pfGcThresholdPct" @change="persist()">
                    <span style="font-size:9px;color:var(--text-lo);margin-left:6px" x-text="'($'+(cfg.minNotional/cfg.leverage*(cfg.pfGcThresholdPct/100)).toFixed(2)+' per step)'"></span>
                  </div>
                  <div class="g" style="margin-top:6px">
                    <div class="lbl">Freshness Window <b x-text="(Math.max(1,cfg.scanMins??10)*cfg.pfGcFreshnessMult)+'min'"></b> <span style="color:var(--text-lo);font-weight:400" x-text="'('+cfg.pfGcFreshnessMult+'× Scan Every)'"></span></div>
                    <input type="range" min="1" max="6" step="1" x-model.number="cfg.pfGcFreshnessMult" @change="persist()">
                  </div>
                </div>
              </div>
              <div x-show="pfCrossEvents.length" style="margin-top:6px;border:1px solid rgba(255,255,255,.08);border-radius:3px;background:rgba(255,255,255,.02);overflow:hidden">
                <div style="font-family:var(--mono);font-size:8px;letter-spacing:1.5px;color:var(--text-lo);padding:4px 8px;border-bottom:1px solid rgba(255,255,255,.06)">PARTNER FEED</div>
                <div x-html="_pfCrossFeedHtml()" style="padding:2px 8px 4px;max-height:114px;overflow-y:auto"></div>
              </div>
            </div>
            <div class="pfr-zone" x-show="tS">
              <label class="tog">
                <div class="tog-t" :class="cfg.pfExtremityEnabled?'on':''" @click.prevent="if(!cfgLocked){cfg.pfExtremityEnabled=!cfg.pfExtremityEnabled;_pfExtremityBuild();persist()}"><div class="tog-k"></div></div>
                <div>
                  <div class="tog-l">Extremity Scorer</div>
                  <div class="pfr-hint">Scores closed trades on each position's criteria (entry snapshot, or rolling average if enabled below) and vetoes tickers on the less profitable side.</div>
                </div>
              </label>
              <label class="tog" style="margin-top:8px" x-show="cfg.pfExtremityEnabled">

                  <div x-show="_pfOcAvgValueText(open && cfg.pfOcEnabled)!=null" style="font-family:var(--mono);font-size:8.5px;margin-top:1px" :style="{ color: 'rgba('+_pfOcModeCfg().color+',.85)' }" x-text="_pfOcAvgValueText(open && cfg.pfOcEnabled)"></div>

    transform(def) {

                               // note back off the shared cross bus, which can age out of CROSS_TTL
                               // mid-halt on any halt longer than the TTL window.
        pfScoreboard: [],   // sorted Extremity Scorer entries built from EXTREMITY_KEY records
        pfLukewarmScoreboard: { extreme: [], lukewarm: [] }, // Lukewarm Scoring two-bucket display — see _pfExtremityBuild
        pfScorecardExpanded: null,     // key of currently expanded dial, or null
        pfDialCutoffs: {},             // {[family|pole]: magnitude} — the live "extreme begins here" line per dial

        // restarts via DIAL_POOL_KEY (init() loads it explicitly — see there for why the
        // lazy `||=` pattern used elsewhere can't do this on its own, since this declared
        // default is already truthy).
        pfDialSamplePool: {},          // {[family|pole]: number[]}
        pfDialSampleCounts: {},        // {[family|pole]: n} — for the "unproven, still lukewarm by default" badge
        pfSampleBucketMeans: null, // Sample Scoring: overall mean edge per bucket, decides the favored side
        _pfSampleStore: { obs: [], pending: [] },
        pfCrossEvents: [],
        // Gains Continuation (GC) — own rolling 6h closed-trade PnL log, independent of the
        // host's Gains Lock window (that one only populates when cfg.gainsLockEnabled is on;
        // GC needs to work regardless). _pfGcLastStep is the highest step index already
        // broadcast (high-water-mark — never re-fires a step already crossed); resets to 0 once
        // rolling PnL drops back to ≤0 so a fresh climb re-arms from the first step. _pfGcLastSeenTs
        // is the ts of the latest partner 'gc' event already reacted to (fresh or stale), so the
        // 15s loop doesn't re-evaluate the same event every tick.
        pfGcWindow:      [],
        _pfGcLastStep:   0,
        _pfGcLastSeenTs: 0,
        _pfOcCycleHistory: [], // rolling per-cycle snapshots: {id, ts, results:[{sym,bc,sc,avgMs,n}]}
        _pfOcCycleCounter: 0,
        pfOcResults: {},       // {[sym]:{bc,sc,avgMs,n}} from the most recent OC fetch batch
        _ocFetchRunning: false, // guards against overlapping _ocFetchBatch calls
        // Fixed Y-axis overlay HTML/positions for the OC chart, set as a side effect of
        // _pfOcChartSvg(). Must be pre-declared (not just assigned later inside that method) —
        // an x-html/x-text binding that reads a property before Alpine has ever seen it
        // declared throws a ReferenceError during the initial bind.
        _pfOcYAxisHtml: '',
        _pfOcAvgYPx: null,
        _pfOcHighlightedCycleTs: null, // ts of a clicked cycle in the ORDER INTERVAL SAMPLE chart; null = follow latest
        _pfOcViewMode: 'oc', // 'oc' | 'vol' | 'io' | 'lta' | 'lpa' — which sample the tethered chart/summary/chips display
        pfSamplePendOpen: false, // Sample Scorer: pending delayed-pairing list shown?
        pfOcPillsOpen: false,    // sample results chart: per-batch ticker pills shown?
        _pfOcExpandedSym: null, // OC chip tapped open to its full values (hover title covers desktop; touch has no hover)

        async init() {
          await _origInit.call(this);
          // Sync to the actual restored halt/gains-lock state instead of leaving these at their
          // false initial value. Without this, reloading the tab mid-halt made the very next
          // tick see a false→true "transition" that never really happened, rewriting the
          // cross-event start timestamp to "now" — which silently made an already-old halt look
          // freshly started, breaking the Mutual DDH Lift age comparison below (it picks the
          // *older* halt to lift, so an inflated timestamp can flip which side loses the halt).
          _pfWasHalted      = this._isDrawdownHalted?.() ?? false;
          _pfWasGainsLocked = this._isGainsLocked?.()    ?? false;
          // Restored early (ahead of the main PFR_KEY blob load further down) because the
          // mid-halt backfill immediately below needs it to decide whether a value already
          // exists before falling back to a back-calculated guess.
          try {
            const _pfEarly = JSON.parse(localStorage.getItem(PFR_KEY) || 'null');
            if (_pfEarly && typeof _pfEarly.ddhStartedAt === 'number') this._pfDdhStartedAt = _pfEarly.ddhStartedAt;
          } catch(_) {}
          // The sync above deliberately skips writing a ddh-start/glk-start cross event on a
          // mid-halt reload (see comment above) to avoid an inflated "now" timestamp — but that
          // means a bot whose tab restarts mid-halt (backgrounded/killed on mobile, manual
          // refresh, etc.) never broadcasts *any* ddh-start for that halt, so Mutual DDH Lift can
          // never react to it no matter how long the halt runs or what the partner does — this
          // is the actual cause of a same-halt lift silently never firing, not CROSS_TTL. Backfill
          // one here if the bus doesn't already show us as actively halted, using the halt's real
          // start time (back-calculated from the restored _drawdownHaltUntil) rather than "now" —
          // that preserves the age comparison Mutual DDH Lift depends on instead of trading a
          // missing marker for a too-recent one.
          if ((this.cfg.permafrostCrossEnabled ?? true)) {
            if (_pfWasHalted && !this._manualHalt && typeof this._drawdownHaltUntil === 'number') {
              const _ownDdh = this._pfCrossRead().filter(e => e.source === 'winter' && (e.kind === 'ddh-start' || e.kind === 'ddh-end')).at(-1);
              if (!_ownDdh || _ownDdh.kind === 'ddh-end') {
                const _haltMs = (this.cfg.drawdownHaltHours ?? 6) * 3600 * 1000;
                this._pfCrossWrite('ddh-start', null, { ts: this._drawdownHaltUntil - _haltMs });
              }
              // _pfDdhStartedAt is normally restored from the persisted blob below (set the moment
              // the halt began, on whichever earlier session actually triggered it). This only
              // fires as a one-time migration fallback — upgrading mid-halt, or a persisted value
              // that somehow never got written — using the same back-calculation as the cross-bus
              // backfill above. Imperfect if the halt wasn't started via drawdownHaltHours (e.g. the
              // host's own native throttle running a different duration), but only ever needed once;
              // every halt-start going forward stamps this directly at the moment it happens.
              if (this._pfDdhStartedAt == null) {
                const _haltMs = (this.cfg.drawdownHaltHours ?? 6) * 3600 * 1000;
                this._pfDdhStartedAt = this._drawdownHaltUntil - _haltMs;
              }
            }
            if (_pfWasGainsLocked && typeof this._gainsLockHaltUntil === 'number') {
              const _ownGlk = this._pfCrossRead().filter(e => e.source === 'winter' && (e.kind === 'glk-start' || e.kind === 'glk-end')).at(-1);
              if (!_ownGlk || _ownGlk.kind === 'glk-end') {
                const _lockMs = (this.cfg.gainsLockHours ?? 6) * 3600 * 1000;
                this._pfCrossWrite('glk-start', null, { ts: this._gainsLockHaltUntil - _lockMs });
              }
            }
          }
          if (!Array.isArray(this.cfg.megacapExclude)) this.cfg.megacapExclude = [...DEFAULT_MEGACAP_EXCLUDE];
          // Single source of truth for all other Permafrost scalar defaults — see
          // PERMAFROST_DEFAULT_CFG above. Call sites read this.cfg.<key> directly with no inline
          // fallback, since this guarantees every key below is present after init runs once.
          for (const [k, v] of Object.entries(PERMAFROST_DEFAULT_CFG)) {
            if (this.cfg[k] === undefined) this.cfg[k] = v;
          }
          try {
            const _ocHist = JSON.parse(localStorage.getItem(PFR_OC_HIST_KEY) || 'null');
            if (Array.isArray(_ocHist) && _ocHist.length) {
              const { cleaned: _cleaned, purged: _purged } = this._ocSanitizeHistory(_ocHist);
              this._pfOcCycleHistory = _cleaned;
              if (_purged > 0) {
                this.log(`[PFR] 🧹 Purged ${_purged} legacy OC record(s) from stored history (pre-redesign raw-count schema).`, 'info');
                this._ocPersistHistory();
              }
              // Latest cycle by timestamp, not array position — a slower concurrent fetch
              // finishing after a newer one has already pushed would otherwise leave a stale
              // batch sitting last in the array.
              const _last = this._pfOcCycleHistory.reduce((a,c) => (!a || c.ts > a.ts) ? c : a, null);
              if (_last?.results) for (const r of _last.results) { if (r && typeof r.sym === 'string') this.pfOcResults[r.sym] = { bc: r.bc, sc: r.sc, avgMs: r.avgMs, n: r.n }; }
              this._pfOcCycleCounter = Math.max(this._pfOcCycleCounter, _last?.id || 0);
            }
          } catch(_) {}
          // Explicit load, not the lazy `||=` _pfDialSample/_pfExtremityBuild otherwise use —
          // pfDialSamplePool's own reactive declaration above starts it at `{}`, which is
          // already truthy, so `this.pfDialSamplePool ||= this._pfLoadDialPool()` never actually
          // ran the load; every restart silently kept the freshly-declared empty pool instead of
          // the persisted one, forcing every dial's cutoff to reprove itself from scratch. Load
          // for real here, before the first _pfExtremityBuild() call below.
          this.pfDialSamplePool = this._pfLoadDialPool();
          this._pfSampleLoad();
          this._pfScoreTrim();
          this._pfExtremityBuild();
          try {
            const raw = localStorage.getItem(PFR_KEY);
            if (raw) {
              const s = JSON.parse(raw);
              // GC window is re-filtered to the live 6h cutoff on load, same as the host's own
              // gainsWindow restore — a stale entry surviving a long-offline reload shouldn't
              // count toward a step it wouldn't have reached had the tab stayed open.
              if (Array.isArray(s.gcWindow)) this.pfGcWindow = s.gcWindow.filter(e => e?.ts && (Date.now() - e.ts) < 6 * 3600 * 1000);
              if (typeof s.gcLastStep === 'number') this._pfGcLastStep = s.gcLastStep;
            }
          } catch(e) {}
          this.log(`[PFR] Permafrost (Winter) v${VERSION} loaded — ${this.cfg.permafrostEnabled ? 'enabled' : 'disabled'}`, 'info');
          setInterval(() => {
            if (this.cfg.permafrostCrossEnabled) this._pfCheckCross().catch(() => {});
            // _pfExtremityBuild() is NOT called on THIS setInterval timer (it runs every few
            // seconds, purely for cross-plugin housekeeping) — it's called once per runScan
            // cycle instead (see runScan), which is frequent enough to track the sample pool
            // filling in without redoing the full sort/rebuild on every single interval tick.
            if (this.cfg.permafrostCrossEnabled) {
              const _halted  = this._isDrawdownHalted?.() ?? false;
              const _glocked = this._isGainsLocked?.()    ?? false;
              if (_halted !== _pfWasHalted) {
                _pfWasHalted = _halted;
                this._pfDdhStartedAt = _halted ? Date.now() : null;
                this.persist();

              }

                _pfWasGainsLocked = _glocked;
                this._pfCrossWrite(_glocked ? 'glk-start' : 'glk-end');

                // reading our own ddh-start note back off the shared cross bus — that note is
                // still written below for the partner's benefit, but it ages out of CROSS_TTL on
                // any halt longer than the TTL, which used to silently strand this comparison
                // with nothing to compare against for the rest of a long halt. Partner side still
                // reads the bus, since that's the only visibility we have into their state.
                const _partnerDdh = this._pfCrossRead().filter(e => e.source === 'chaser' && (e.kind === 'ddh-start' || e.kind === 'ddh-end')).at(-1);
                if (_partnerDdh?.kind === 'ddh-start' && this._pfDdhStartedAt != null) {
                  if (this._pfDdhStartedAt < _partnerDdh.ts) {
                    this._drawdownHaltUntil = null;
                    this._haltLoggedKind = null;
                    this._pfDdhStartedAt = null;
                    this.persist();
                    this.log('[PFR] ❄ Mutual DDH lift — own halt is older; cleared.', 'info');
                  }
                }
              }
              // Gains Continuation (GC) receive side — requires this bot to also have GC on
              // (own toggle doubles as the opt-in to react to the partner's broadcast, same
              // convention as Mutual DDH Lift). Freshness window mirrors the codebase's
              // established partner-staleness pattern (2× scan cadence = 1 missed-cycle grace),
              // just user-configurable here via pfGcFreshnessMult instead of hardcoded 2×.
              // Dedupes on event ts via _pfGcLastSeenTs so a still-fresh event isn't re-actioned
              // every 15s tick, and a since-gone-stale one isn't re-checked forever either.
              if (this.cfg.pfGcEnabled) {
                const _gcEvt = this._pfCrossRead().filter(e => e.source === 'chaser' && e.kind === 'gc').at(-1);
                if (_gcEvt && _gcEvt.ts !== this._pfGcLastSeenTs) {
                  this._pfGcLastSeenTs = _gcEvt.ts;
                  const _gcFreshMs = Math.max(1, this.cfg.scanMins ?? 10) * (this.cfg.pfGcFreshnessMult ?? 2) * 60 * 1000;
                  if ((Date.now() - _gcEvt.ts) < _gcFreshMs) {
                    this._drawdownHaltUntil = Date.now() + (this.cfg.drawdownHaltHours ?? 6) * 3600 * 1000;
                    this._haltLoggedKind = null;
                    this.persist();
                    this.log(`[PFR] 🚨 Gains Continuation — fresh broadcast from Ashfall (step ${_gcEvt.step ?? '?'}, +${(_gcEvt.pnl ?? 0).toFixed(2)} USDT 6hr) — full drawdown halt triggered.`, 'warn');
                  }
                }
              }
            }
          }, 15000);
        },

        persist() {
          _origPers.call(this);
          try {
            this.pfGcWindow   = trimToByteCap(this.pfGcWindow);
            localStorage.setItem(PFR_KEY, JSON.stringify({
              gcWindow: this.pfGcWindow, gcLastStep: this._pfGcLastStep,
              ddhStartedAt: this._pfDdhStartedAt,
            }));
          } catch(e) {}
        },

        _pfScoreRead() {
          try {
            if (localStorage.getItem(EXTREMITY_KEY) === null) {
              // One-time migration off the old shared key — see the comment on
              // LEGACY_SHARED_EXTREMITY_KEY above. Runs once: after this, EXTREMITY_KEY
              // exists (even as '[]') so this branch never fires again.
              try {
                const legacyRaw = localStorage.getItem(LEGACY_SHARED_EXTREMITY_KEY);
                const legacy = legacyRaw ? JSON.parse(legacyRaw) : [];
                const mine = Array.isArray(legacy) ? legacy.filter(r => r.source === 'winter') : [];
                localStorage.setItem(EXTREMITY_KEY, JSON.stringify(mine));
              } catch(_) { localStorage.setItem(EXTREMITY_KEY, '[]'); }
            }
            const raw = localStorage.getItem(EXTREMITY_KEY);
            if (!raw) return [];
            const cut = Date.now() - SCORE_SAFETY_TTL;
            return (JSON.parse(raw) || []).filter(r => r.ts >= cut && Array.isArray(r.criteria) && r.criteria.length);
          } catch(e) { return []; }
        },
        _pfScoreTrim() {
          try {
            const records   = this._pfScoreRead();
            const quota     = this.cfg.pfSpongeQuota;
            const staleDays = this.cfg.pfStaleSlotDays;
            const staleMs   = staleDays * 24 * 3600 * 1000;
            const now       = Date.now();
            // +fund/-fund are NOT legacy — Blind-Entry and Liquid-Diver actively write them as
            // their primary criteria tags. Only the genuinely dead pre-tiered criteria purge here.
            const LEGACY    = new Set(['>10pct','<10pct','lsa','lba','rasl','rabl']);
            const isLegacy  = r => r.criteria.some(c => LEGACY.has(c));
            const bySlot = {};
            for (const r of records) {
              if (isLegacy(r)) continue;
              const k = collapseKey(r.criteria);
              if (!bySlot[k]) bySlot[k] = [];
              bySlot[k].push(r);
            }
            const trimmed = [];
            for (const recs of Object.values(bySlot)) {
              recs.sort((a, b) => b.ts - a.ts);
              const kept = recs.slice(0, quota);
              if (!kept.length) continue;
              if (now - kept[0].ts < staleMs) trimmed.push(...kept);
            }
            const GLOBAL_CAP = 5000;
            const capped = trimmed.sort((a, b) => b.ts - a.ts).slice(0, GLOBAL_CAP);
            // Per-slot quota + GLOBAL_CAP bound the record *count*, but with enough
            // distinct auto-generated slot buckets the total byte size can still run
            // large — apply the same atomized byte cap as a final safety net, oldest first.
            const byteCapped = trimToByteCap([...capped].reverse()).reverse();
            localStorage.setItem(EXTREMITY_KEY, JSON.stringify(byteCapped));
          } catch(e) {}
        },
        _pfScoreWrite(criteria, pnl, hist = false, drift = null) {
          try {
            const records = this._pfScoreRead();
            const rec = { ts: Date.now(), criteria, pnl, source: 'winter' };
            if (hist) rec.hist = true;
            // Per-criterion drift measured at close (see _pfCloseDrift) — raw, not shares, so the
            // credit mode can be flipped later and re-score history. null = unmeasurable.
            if (Array.isArray(drift) && drift.length === criteria.length) rec.d = drift.map(x => (typeof x === 'number' && isFinite(x)) ? Math.round(x * 1000) / 1000 : null);
            records.push(rec);
            const quota = this.cfg.pfSpongeQuota;
            const bySlot = {};
            for (const r of records) {
              const k = collapseKey(r.criteria);
              if (!bySlot[k]) bySlot[k] = [];
              bySlot[k].push(r);
            }
            const trimmed = [];
            for (const recs of Object.values(bySlot)) {
              recs.sort((a, b) => b.ts - a.ts);
              trimmed.push(...recs.slice(0, quota));
            }
            const byteCapped = trimToByteCap([...trimmed].reverse()).reverse();
            localStorage.setItem(EXTREMITY_KEY, JSON.stringify(byteCapped));
            return byteCapped;
          } catch(e) { return null; }
        },

        // Feeds the Extremity Scorer's cutoff computation. Called from every criterion
        // annotation — scan-time pool building, live liq messages, Extremity Re-Evaluation —
        // NOT gated behind a close or even an actual entry. This is deliberate: a dial's
        // cutoff needs to be provable from the wide stream of what the market is actually
        // showing right now, not from the narrow trickle of closed trades. Sampling only from
        // closes would deadlock at cold start — nothing opens until a dial is proven, and a
        // dial can only prove itself from closes that require something to have opened first.
        _pfDialSample(tag) {
          if (!tag) return;
          const info = dialInfo(collapseCrit(tag));
          if (!info) return;
          const m = tag.match(/(-?\d+)$/);
          if (!m) return; // bare Blind-Entry/Liquid-Diver tags (+fund/-fund/+ocs/-ocs) carry no
                           // magnitude — they always classify extreme regardless (see
                           // _pfExtremityBuild/_pfExtremityVeto), nothing to prove here.
          const dk = info.family + '|' + info.pole;
          const pool = (this.pfDialSamplePool ||= this._pfLoadDialPool());
          const arr = (pool[dk] ||= []);
          arr.push(Math.abs(parseInt(m[1], 10)));
          const cap = this.cfg.pfExtremitySampleCap || 300;
          if (arr.length > cap) arr.splice(0, arr.length - cap);
          this._pfSaveDialPool();
        },
        // pfDialSamplePool persists (DIAL_POOL_KEY) so a restart doesn't reset every dial to
        // "unproven". Loaded lazily (first _pfDialSample/_pfExtremityBuild call each
        // session) rather than at some fixed init point, and saved with a light throttle since
        // _pfDialSample fires on every live annotation, not just closes.
        _pfLoadDialPool() {
          try {
            const raw = localStorage.getItem(DIAL_POOL_KEY);
            return raw ? JSON.parse(raw) : {};
          } catch (e) { return {}; }
        },
        _pfSaveDialPool() {
          const now = Date.now();
          if (now - (this._pfDialPoolLastWrite || 0) < 3000) return;
          this._pfDialPoolLastWrite = now;
          try { localStorage.setItem(DIAL_POOL_KEY, JSON.stringify(this.pfDialSamplePool || {})); } catch (e) {}
        },
        // ── Open-Position Rolling-Average Criteria ─────────────────
        //
        // Replaces the single entry-time snapshot (_miwCriteria/_bewCriteria/_ldwCriteria,
        // frozen once in *Open) as the source feeding close-time scoring, Extremity
        // Re-Evaluation, and substitution's live score. No separate sample list and no new
        // poller/timer — this rides the existing scan cycle: called once per open position
        // per scan from MIW's runScan (_pfPositionCriteriaSample), exempt from the follower
        // no-own-fetch rule since it only ever touches the handful of symbols currently
        // open, not the full ticker universe (same loophole _miwTopUpGeneralCriteria
        // already uses for ocs/ocx via _ocFetchSingle's allowOwnFetch flag).
        //
        // A position's locked criteria FAMILIES never change after entry — that's what
        // defines its slot. Only the observed magnitude/tier of each is re-sampled, into a
        // calendar-time window (default 24h) kept on the position itself.
        POS_CRIT_WINDOW_MS: 24 * 3600 * 1000,
        async _pfPositionCriteriaSample(pos) {
          if (!this.cfg.pfPosRollingAvgEnabled) return; // toggle off: no per-scan fetch, frozen snapshot only
          const crits = pos._miwCriteria || pos._bewCriteria || pos._ldwCriteria;
          if (!crits?.length) return;
          // Own fresh single-ticker fetch, not this._lastAllTickers — that bulk snapshot is
          // cached for cfg.bulkTickerCooldownHours (default 1h, user-configurable up to 12h)
          // and reused across many scans in between, so fund/va/ioa read off it would mostly
          // resample the exact same stale number instead of tracking real drift. Still routed
          // through _qFetch (rate/concurrency limited) — just not gated behind the follower
          // no-own-fetch rule, same exemption as the ocs/ocx fetch below.
          let t = null;
          try {
            const r = await this._qFetch(`${this.base}/v5/market/tickers?category=linear&symbol=${pos.symbol}`);
            const d = await r.json();
            t = d?.retCode === 0 ? d.result?.list?.[0] : null;
          } catch(e) {}
          if (!t) return;
          const now = Date.now();
          const buf = (pos._pfCritSamples ||= {});
          for (const tag of crits) {
            const family = tag.replace(/[+-]?\d+$/, '');
            if (/^(ocs|ocx)/.test(family) && this.cfg.pfOcEnabled && !this.pfOcResults?.[pos.symbol]) {
              try { const r = await this._ocFetchSingle?.(pos.symbol, true); if (r) { (this.pfOcResults ||= {})[pos.symbol] = r; } } catch(e) {}
            }
            if (/^(lta|lpa)/.test(family)) { try { await this._pfHourCandle(pos.symbol); } catch(e) {} }
            const fresh = this._miwAnnotateCritRaw?.(family, t);
            if (!fresh) continue;
            const m = fresh.match(/(-?\d+)$/);
            if (!m) continue;
            const arr = (buf[family] ||= []);
            arr.push({ tier: parseInt(m[1], 10), ts: now });
            const cut = now - (this.POS_CRIT_WINDOW_MS || 24 * 3600 * 1000);
            while (arr.length && arr[0].ts < cut) arr.shift();
          }
        },
        // Reconstructs a position's criteria as averaged tags, in the same family+tier
        // string format every other tag already uses (e.g. "fund+3"). Falls back to the
        // frozen entry-time snapshot for any family with fewer than pfExtremityMinSamples
        // readings — a position that closes fast simply hasn't had enough scans to average.
        _pfPositionAvgCriteria(pos) {
          const crits = pos._miwCriteria || pos._bewCriteria || pos._ldwCriteria;
          if (!crits?.length) return crits;
          if (!this.cfg.pfPosRollingAvgEnabled) return crits; // toggle off: entry-time snapshot
          const minSamples = Math.max(3, this.cfg.pfExtremityMinSamples || 3);
          const buf = pos._pfCritSamples || {};
          return crits.map(tag => {
            const family = tag.replace(/[+-]?\d+$/, '');
            const arr = buf[family];
            if (!arr || arr.length < minSamples) return tag;
            const avgTier = Math.round(arr.reduce((s, r) => s + r.tier, 0) / arr.length);
            return `${family}${avgTier >= 0 ? '+' : ''}${avgTier}`;
          });
        },
        // ── Drift Credit ────────────────────────────────────────────────
        // TENTATIVE — this whole mechanism is a first attempt and may well be wrong or need
        // redoing. THE PROBLEM: a closed position's PnL used to be credited IN FULL to every
        // criterion it carried, so a +$0.02 close with 4 criteria put +$0.08 on the scorecard
        // (and the Extreme-vs-Lukewarm totals the veto compares were inflated by criteria
        // count, not by anything real). THE ATTEMPT: split the one PnL across the criteria so
        // the shares sum to exactly the PnL. Shares come from DRIFT — at close we re-read
        // each criterion's live value and measure how far it moved from its entry-time tier,
        // normalised by that family's typical magnitude in the dial sample pool (raw tier
        // units aren't comparable between fund/va/ocs/lta...). Current rule (mode 'least'):
        // the criterion that drifted LEAST gets the MOST credit — its condition still held
        // over the trade's life, so it's treated as most culpable for the outcome — and the
        // one that drifted most gets the least. Mode 'most' flips that (untested hunch that it
        // may be the reverse). Nothing here is settled: the drift measure, the 1/(1+d) curve,
        // and the assumption that "held steady" == "responsible" are all open questions.
        // Each closed record stores its raw drift array (`d`), NOT final shares, so flipping
        // the mode re-scores all history instantly with no re-fetch. Records with no `d`
        // (pre-1.87.0, or drift fetch failed/timed out) fall back to an even split.
        async _pfSettleCloseScore(pos, scoreCrits, pnl) {
          let drift = null;
          const mode = this.cfg.pfDriftCreditMode;
          if ((mode === 'least' || mode === 'most') && scoreCrits.length > 1) {
            // Hard timeout so a stuck fetch can't leave the close unscored — falls back to an even split.
            try { drift = await Promise.race([this._pfCloseDrift(pos), new Promise(res => setTimeout(() => res(null), 15000))]); } catch(_) {}
            if (!Array.isArray(drift) || drift.length !== scoreCrits.length) drift = null;
          }
          this._pfExtremityBuild(this._pfScoreWrite(scoreCrits, pnl, false, drift));
        },
        // Re-reads every entry criterion for this position's symbol and returns, per criterion
        // (same order as the entry snapshot), |closeTier - entryTier| / familyScale — or null
        // where it can't be measured (bare Blind-Entry/Liquid-Diver tags, missing data, fetch
        // failure). Compares against the frozen ENTRY snapshot, not the rolling average.
        async _pfCloseDrift(pos) {
          const entry = pos._miwCriteria || pos._bewCriteria || pos._ldwCriteria;
          if (!entry?.length || !pos.symbol) return null;
          let t = null;
          try {
            const r = await this._qFetch(`${this.base}/v5/market/tickers?category=linear&symbol=${pos.symbol}`);
            const d = await r.json();
            t = d?.retCode === 0 ? d.result?.list?.[0] : null;
          } catch(_) {}
          if (!t) return null;
          const fams = entry.map(tag => tag.replace(/[+-]?\d+$/, ''));
          // Same own-fetch exemption as _pfPositionCriteriaSample: one symbol, not the universe.
          if (this.cfg.pfOcEnabled && fams.some(f => /^(ocs|ocx)/.test(f))) {
            try { const r = await this._ocFetchSingle?.(pos.symbol, true); if (r) (this.pfOcResults ||= {})[pos.symbol] = r; } catch(_) {}
          }
          if (fams.some(f => /^(lta|lpa)/.test(f))) { try { await this._pfHourCandle(pos.symbol); } catch(_) {} }
          return entry.map((tag, i) => {
            const m0 = tag.match(/(-?\d+)$/);
            const fresh = this._miwAnnotateCritRaw?.(fams[i], t);
            const m1 = typeof fresh === 'string' ? fresh.match(/(-?\d+)$/) : null;
            if (!m0 || !m1) return null;
            const a = parseInt(m0[1], 10), b = parseInt(m1[1], 10);
            return Math.abs(b - a) / this._pfDriftScale(fams[i], a);
          });
        },
        // Typical tier magnitude for a family (mean over both poles of the dial sample pool),
        // so a 3-tier move on a family that normally spans ~30 tiers reads as small drift and
        // on one that spans ~4 as large. Falls back to the entry tier itself while the pool is thin.
        _pfDriftScale(family, entryTier) {
          const pool = this.pfDialSamplePool || {};
          const mags = [...(pool[family + '|pos'] || []), ...(pool[family + '|neg'] || [])];
          const floor = Math.max(3, this.cfg.pfExtremityMinSamples || 3);
          if (mags.length >= floor) {
            const mean = mags.reduce((a, b) => a + b, 0) / mags.length;
            if (mean >= 1) return mean;
          }
          return Math.max(1, Math.abs(entryTier));
        },
        // Drift array -> shares summing to 1. Unmeasurable entries (null) get the mean weight of
        // the measured ones; nothing measurable / mode 'off' / legacy record -> even split.
        //   'least': w = 1/(1+d)        — steadiest criterion is most culpable (current default)
        //   'most':  w = d/(1+d) + .05  — the flipped reading; .05 keeps zero-drift from zeroing out
        _pfCreditShares(dArr) {
          const n = dArr.length;
          const even = () => dArr.map(() => 1 / n);
          const mode = this.cfg.pfDriftCreditMode;
          if (mode !== 'least' && mode !== 'most') return even();
          const ok = x => typeof x === 'number' && isFinite(x) && x >= 0;
          const known = dArr.filter(ok);
          if (!known.length) return even();
          const f = mode === 'most' ? (d => d / (1 + d) + 0.05) : (d => 1 / (1 + d));
          const raw = dArr.map(x => ok(x) ? f(x) : null);
          const fill = raw.filter(x => x != null).reduce((a, b) => a + b, 0) / known.length;
          const vals = raw.map(x => x ?? fill);
          const sum = vals.reduce((a, b) => a + b, 0);
          return vals.map(v => v / sum);
        },
        // ── Extremity Scorer / Lukewarm Scoring core build.
        //
        // Cutoffs are computed FIRST, from pfDialSamplePool (the observation stream — see
        // _pfDialSample above), independent of closed-trade records entirely: for each dial
        // pole with >= pfExtremityMinSamples readings, the cutoff is the magnitude at the
        // configured split percentile of that pole's OWN observed spread — "organically
        // arrange them into highs and lows" per the user's own framing. A pole below the
        // sample floor has no proven cutoff and stays lukewarm by default (never credited,
        // never blocking) until it clears the floor — which, sampling from live readings
        // rather than closes, usually happens within the first scan or two, not never.
        //
        // Records are then walked ONCE. Extreme occurrences score into that pole's
        // win/loss/pnl exactly as before — this is what MIW's blocking/co-qual reads via
        // miwCollapsedSlotRanks, unchanged in shape. Lukewarm Scoring adds a second,
        // parallel tally alongside it: EVERY occurrence (extreme or lukewarm) also lands in
        // pfLukewarmScoreboard under its classification bucket and family — "which side
        // (Extreme vs Lukewarm) has been more profitable overall, and which criteria within
        // that side actually drove it" — purely a display/advisory layer, never read by
        // blocking or the veto.
        //
        // Bare Blind-Entry/Liquid-Diver tags always classify extreme — there's nothing to
        // be lukewarm about.
        _pfExtremityBuild(records) {
          if (this.cfg.pfSampleScoringEnabled) { try { return this._pfSampleBuild(); } catch (e) { console.warn('[PFR] Sample Scoring build failed', e); } }
          records = records || this._pfScoreRead();
          const exclude = new Set(this.cfg.miwAutoSlotExclude || []);
          const quota = this.cfg.pfSpongeQuota;
          const minSamples = Math.max(3, this.cfg.pfExtremityMinSamples || 3);
          const splitPct = Math.min(0.49, Math.max(0.01, (this.cfg.pfExtremitySplitPct ?? 30) / 100));
          const sortedRecords = [...records].sort((a, b) => b.ts - a.ts).filter(r => r.source === 'winter');
          // Scorecards fully separated per side — Permafrost's Extremity
          // Scorer only ever aggregates its own closed trades. No cross-bot reading, no
          // sign flipping, no shared bias/pool needed: partner-sourced records in
          // EXTREMITY_KEY (if any linger from before this change) are filtered out above
          // and never reach dialStats/bucketStats/ranks below.

          const samplePool = (this.pfDialSamplePool ||= this._pfLoadDialPool());
          const cutoffs = {};
          for (const [dk, mags] of Object.entries(samplePool)) {
            if (mags.length < minSamples) { cutoffs[dk] = null; continue; }
            const sorted = [...mags].sort((a, b) => a - b);
            const idx = Math.min(sorted.length - 1, Math.floor(sorted.length * (1 - splitPct)));
            cutoffs[dk] = sorted[idx];
          }

          const dialStats = {};
          const dialCount = {};
          const subtagStats = {};
          const bucketStats = { extreme: {}, lukewarm: {} };
          const bucketCount = { extreme: {}, lukewarm: {} };
          for (const r of sortedRecords) {
            const keptIdx = [];
            for (let i = 0; i < r.criteria.length; i++) if (!exclude.size || !exclude.has(r.criteria[i])) keptIdx.push(i);
            if (!keptIdx.length) continue;
            const pnl = typeof r.pnl === 'number' ? r.pnl : (r.win ? 1 : -1);
            // Drift Credit (TENTATIVE — see _pfCreditShares): each criterion gets a SHARE of the
            // position's PnL, shares summing to 1 across the criteria that survive the exclude
            // filter, instead of the whole PnL apiece. Own-only records (see sortedRecords filter above).
            const shares = this._pfCreditShares(keptIdx.map(i => Array.isArray(r.d) ? r.d[i] : null));
            for (let ki = 0; ki < keptIdx.length; ki++) {
              const c = r.criteria[keptIdx[ki]];
              const effectivePnl = pnl * shares[ki];
              const key = collapseCrit(c);
              const info = dialInfo(key);
              if (!info) continue; // unrecognized/retired tag — no dial, not scored
              const noGradation = !!BARE_DIAL_TAGS[key];
              let mag = Infinity;
              if (!noGradation) {
                const m2 = c.match(/(-?\d+)$/);
                mag = m2 ? Math.abs(parseInt(m2[1], 10)) : 0;
              }
              const pole = info.pole;
              const dk = info.family + '|' + pole;
              const cutoff = cutoffs[dk];
              const isExtreme = !Number.isFinite(mag) || (cutoff != null && mag >= cutoff);

              // Lukewarm Scoring: every occurrence lands here, extreme or not. Keyed by dk
              // (family+pole), not family alone — a two-pole family's '+' and '-' sides are
              // opposite signals and must not be netted into one pill.
              const bucket = isExtreme ? 'extreme' : 'lukewarm';
              const bCount = bucketCount[bucket];
              if ((bCount[dk] = (bCount[dk] ?? 0) + 1) <= quota) {
                const bStats = bucketStats[bucket];
                if (!bStats[dk]) bStats[dk] = { pnl: 0, wins: 0, losses: 0 };
                const bs = bStats[dk];
                bs.pnl += effectivePnl; if (effectivePnl > 0) bs.wins++; else bs.losses++;
              }

              if (!isExtreme) continue; // lukewarm — not scored into the blocking-facing dial below

              if ((dialCount[dk] = (dialCount[dk] ?? 0) + 1) > quota) continue;
              if (!dialStats[dk]) dialStats[dk] = { pnl: 0, wins: 0, losses: 0, hasHist: false, hasTrade: false };
              const stats = dialStats[dk];
              stats.pnl += effectivePnl; if (effectivePnl > 0) stats.wins++; else stats.losses++;
              if (r.hist) stats.hasHist = true; else stats.hasTrade = true;
              const subtagKey = key;
              if (!subtagStats[subtagKey]) subtagStats[subtagKey] = { pnl: 0, wins: 0, losses: 0 };
              const ts = subtagStats[subtagKey];
              ts.pnl += effectivePnl; if (effectivePnl > 0) ts.wins++; else ts.losses++;
            }
          }
          // A dial can have a proven cutoff (samples exist) but zero closes yet — still needs
          // to show up (0 pnl, real sample count) rather than vanish from the panel/ranks.
          for (const dk of Object.keys(cutoffs)) {
            if (!dialStats[dk]) dialStats[dk] = { pnl: 0, wins: 0, losses: 0, hasHist: false, hasTrade: false };
          }
          for (const dk of Object.keys(dialStats)) {
            dialStats[dk].cutoff = cutoffs[dk] ?? null;
            dialStats[dk].sampleCount = (samplePool[dk] || []).length;
          }

          this.pfDialCutoffs = cutoffs;
          this.pfDialSampleCounts = Object.fromEntries(Object.entries(samplePool).map(([k, v]) => [k, v.length]));
          // Flat display-key -> stats map, same shape the old miwCollapsedSlotRanks/
          // miwCollapsedCritStats used — _miwScaledRank/_miwCritScore/_miwIsCritBlocked keep
          // reading this one flat lookup unchanged, with no idea dials or poles exist beneath it.
          const ranks = {}, dispStats = {};
          for (const [dk, stats] of Object.entries(dialStats)) {
            const [family, pole] = dk.split('|');
            const key = dialDisplayKey(family, pole);
            ranks[key] = stats.pnl;
            dispStats[key] = stats;
          }
          // Per-tag scores layer on top for blocking's benefit — never overwrites a dk-based
          // key above (every family's raw tag already equals its own dk key, so this is a
          // no-op re-write for them, not a collision).
          for (const [tag, ts] of Object.entries(subtagStats)) {
            ranks[tag] = ts.pnl;
          }
          this.miwCollapsedSlotRanks = ranks;
          this.miwCollapsedCritStats = dispStats;
          this.pfScoreboard = Object.entries(dispStats).sort(([,a],[,b]) => b.pnl - a.pnl).map(([key, s]) => ({ key, ...s }));
          // Lukewarm Scoring display layer — two buckets (Extreme / Lukewarm), each with a
          // per-pole breakdown (dk = family+pole — see above). See _pfExtremityHtml for the render.
          const _dkToLukewarmEntry = ([dk, s]) => {
            const [family, pole] = dk.split('|');
            return { family, pole, key: dialDisplayKey(family, pole), ...s };
          };
          this.pfLukewarmScoreboard = {
            extreme: Object.entries(bucketStats.extreme).sort(([,a],[,b]) => b.pnl - a.pnl).map(_dkToLukewarmEntry),
            lukewarm: Object.entries(bucketStats.lukewarm).sort(([,a],[,b]) => b.pnl - a.pnl).map(_dkToLukewarmEntry),
          };
        },
        // ── Sample Scoring ─────────────────────────────────────────────────
        // A PROACTIVE alternative to the reactive (closed-trade) Extremity Scorer. Instead of crediting
        // criteria with the PnL of trades we already made, it scores every criterion against how the
        // SAMPLED tickers actually moved (LPA = 1hr price change vs the population), so the scorecard
        // can learn before any entry happens. Everything downstream (Extreme vs Lukewarm buckets, the
        // favored-side veto, blocking, co-qual ranking) still reads the same afLukewarmScoreboard /
        // micCollapsedSlotRanks / afDialCutoffs — only the numbers feeding them change.
        //
        // Units: a score is the MEAN EDGE in percentage points of LPA in this bot's favor (Winter:
        // -1=+1 wants price up, -1 wants it down), NOT dollars. Blocking therefore compares it against
        // (micSlotBlockPct/100) pp — see _pfBlockThreshold.
        //
        // Two pairings (cfg.pfSampleDelayed):
        //  • OFF ("now"): criteria tiers and the outcome come from the same sample moment; the outcome is
        //    the LAST COMPLETED hour's LPA, so it is a same-moment correlation. LPA itself is excluded as
        //    a criterion here (it would be scoring itself); LTA stays in (concurrent with the outcome —
        //    TODO: consider dropping LTA if Sample Scoring does not pan out, per Elix).
        //  • ON ("forward"): tiers are snapshotted at sample time and the outcome is the ticker's real
        //    FORWARD 1hr move from that moment (1m klines, fetched once the hour has elapsed). Backward
        //    LPA/LTA at snapshot time are then legitimate momentum criteria. Resolution runs on a strict
        //    deadline: an hour after the snapshot plus twice max(10 min, scan interval) of grace; past that the
        //    snapshot is dropped (a restart or dropped connection inside the grace still resolves).
        // Charts (OC/Vol/IO/Fund/LTA/LPA) are untouched — they keep showing each batch's own tickers.
        // Always independent: Concentration makes each bot sample its own favoured tickers, so a leader's sample store or OC batch is the wrong population for the other bot. The host's bulk-ticker sharing is unaffected.
        _pfFollowing() { return false; },
        _pfSampleDir() { return -1; },
        _pfSampleStep(fam) {
          const D = { fund: 0.0025, va: 1, ioa: 1, ocs: 1, ocx: 1, lta: 10, lpa: 0.25 };
          const k = 'miw' + fam.charAt(0).toUpperCase() + fam.slice(1) + 'Step';
          const v = Number(this.cfg[k]);
          return v > 0 ? v : D[fam];
        },
        _pfSampleDeadlineMs() { return Math.max(10, Number(this.cfg.scanMins) || 10) * 2 * 60000; },
        _pfSampleLoad() {
          try {
            const raw = localStorage.getItem(SAMPLE_OBS_KEY);
            const d = raw ? JSON.parse(raw) : null;
            this._pfSampleStore = { obs: Array.isArray(d?.obs) ? d.obs : [], pending: Array.isArray(d?.pending) ? d.pending : [], ...(d?.leaderKind ? { leaderKind: d.leaderKind } : {}), ...(d?.wx ? { wx: d.wx } : {}), ...(d?.req && typeof d.req === 'object' ? { req: d.req } : {}) };
          } catch (_) { this._pfSampleStore = { obs: [], pending: [] }; }
        },
        _pfSampleSave() {
          try {
            const st = this._pfSampleStore;
            st.obs = trimToByteCap(st.obs);
            if (st.pending.length > 30) st.pending = st.pending.slice(-30);
            localStorage.setItem(SAMPLE_OBS_KEY, JSON.stringify(st));
          } catch (_) {}
        },
        // Scan-path saves (ingest/resolve) go through the idle lane so one scan does one save, after the CPU stages; the
        // store is only trimmed to its byte cap when that save runs. Other callers keep the immediate _pfSampleSave.
        _pfSampleSaveSoon() {
          if (this._schIdle) this._schIdle('pf-samplesave', () => this._pfSampleSave());
          else this._pfSampleSave();
        },
        _pfSampleClear() {
          this._pfSampleStore = { obs: [], pending: [] };
          try { localStorage.removeItem(SAMPLE_OBS_KEY); } catch (_) {}
        },
        // Which outcome kind the scorecard reads: the leader's while following (its store is what we adopt), else our own toggle.
        _pfSampleKind() {
          const st = this._pfSampleStore;
          if (this._pfFollowing() && st?.leaderKind) return st.leaderKind;
          return this.cfg.pfSampleDelayed ? 'f' : 'n';
        },
        // Scorecard readout: scored-sample count, plus (delayed) one line per snapshot awaiting its outcome with the
        // ESTIMATED fetch time (snapshot + 1h; the real fetch lands on the first scan after that, not the deadline).
        _pfSampleStatusHtml() {
          const st = this._pfSampleStore || { obs: [], pending: [] };
          const kind = this._pfSampleKind();
          const n = st.obs.filter(o => o.k === kind).length;
          let h = `<div>${n} scored sample${n === 1 ? '' : 's'}${this._pfFollowing() ? ' · from leader' : ''}</div>`;
          if (this.cfg.pfConcEnabled && !this._pfFollowing()) { const q = Object.keys(st.req || {}).length; h += `<div>${q} mover${q === 1 ? '' : 's'} queued for re-sampling</div>`; }
          return h;
        },
        // Delayed pairing: one line per snapshot awaiting its outcome, with the expected kline fetch time.
        _pfSamplePendingHtml() {
          const st = this._pfSampleStore || { obs: [], pending: [] };
          const hm = ts => new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          const now = Date.now();
          const pend = [...(st.pending || [])].sort((x, y) => x.ts - y.ts);
          if (!pend.length) return '<div>No samples awaiting outcome</div>';
          let h = '';
          for (const p of pend) h += `<div>⏳ ${p.recs.length}t sampled ${hm(p.ts)} → est. ${hm(p.ts + 3600000)}${now > p.ts + 3600000 ? ' (retrying)' : ''}</div>`;
          return h;
        },
        _pfSamplePendingCount() { return ((this._pfSampleStore || {}).pending || []).length; },
        // Concentration (Delayed Pairing only): when a snapshot resolves, its tickers that closed in the bot's favor (both directions
        // if pfConcBoth; only the top pfConcPct% by move size if pfConcTopOnly) are queued; _pfConcPick hands them to the next scan ahead of the random picks. Queue entries expire after 3h.
        _pfConcQueue(done, now) {
          const st = this._pfSampleStore; if (!st) return;
          const c = this.cfg, dir = this._pfSampleDir(), hl = c.pfConcHL !== false;
          const ok = done.filter(r => typeof r.f === 'number' && typeof r.fh === 'number' && typeof r.fl === 'number');
          if (!ok.length) return;
          // d: close move in the bot's favor (>0 = favorable); m: swing size; o: queue order (favorable-only ranks by the favorable swing)
          let pool = ok.map(r => {
            const m = hl ? Math.max(Math.abs(r.fh), Math.abs(r.fl)) : Math.abs(r.f);
            const fav = hl ? (dir > 0 ? r.fh : -r.fl) : dir * r.f;
            return { s: r.s, d: dir * r.f, m, o: c.pfConcBoth ? m : fav };
          });
          if (c.pfConcTopOnly) {
            const pct = Math.min(100, Math.max(1, Number(c.pfConcPct) || 30));
            pool = pool.filter(x => x.m > 0).sort((a, b) => b.m - a.m).slice(0, Math.ceil(ok.length * pct / 100));
          }
          const req = (st.req ||= {});
          for (const x of pool) if (x.o > 0 && (c.pfConcBoth ? x.d !== 0 : x.d > 0)) req[x.s] = { m: +x.o.toFixed(4), t: now };
          for (const k of Object.keys(req)) if (now - req[k].t > 3 * 3600000) delete req[k];
        },
        // Symbols to sample first this scan: queued movers still in the scan pool, biggest move first, at most pfConcMaxPct% of cap, and not
        // already sampled within the last hour (one sample per ticker per hour keeps the forward windows from overlapping).
        _pfConcPick(syms, cap) {
          const c = this.cfg;
          if (!c.pfConcEnabled || !c.pfSampleScoringEnabled || !c.pfSampleDelayed || this._pfFollowing()) return [];
          const st = this._pfSampleStore, req = st?.req;
          if (!st || !Array.isArray(syms)) return [];
          const mp = Number.isFinite(+c.pfConcMaxPct) ? Math.min(100, Math.max(0, +c.pfConcMaxPct)) : 100;
          const max = Math.floor(cap * mp / 100);
          if (max < 1) return [];
          const now = Date.now(), H = 3600000, pool = new Set(syms), busy = new Set();
          for (const q of st.pending || []) if (now - q.ts < H) for (const r of q.recs) busy.add(r.s);
          if (!req) return [];
          return Object.entries(req).filter(([s, v]) => pool.has(s) && !busy.has(s) && now - v.t <= 3 * H)
            .sort((a, b) => b[1].m - a[1].m).slice(0, max).map(e => e[0]);
        },
        // Following: adopt the leader's published store instead of building our own (the regular scorer's closed-trade
        // records are per-bot, but sample scores are market data — a follower can't fetch/resolve them itself, so it
        // must share the leader's). Deduped on the shared snapshot's ts.
        _pfSampleAdopt() {
          if (!this.cfg.pfSampleScoringEnabled || !this._pfFollowing()) return false;
          const sh = this._sharedRead?.('sampleScore');
          if (!sh?.data || !Array.isArray(sh.data.obs)) return false;
          if (sh.ts && sh.ts === this._pfSampleLastSharedTs) return false;
          this._pfSampleLastSharedTs = sh.ts;
          this._pfSampleStore = { obs: sh.data.obs, pending: Array.isArray(sh.data.pending) ? sh.data.pending : [], leaderKind: sh.data.kind === 'f' ? 'f' : 'n', ...(sh.data.wx ? { wx: sh.data.wx } : {}) };
          try { localStorage.setItem(SAMPLE_OBS_KEY, JSON.stringify(this._pfSampleStore)); } catch (_) {}
          return true;
        },
        // Criterion tags for one sampled ticker, in exactly the annotated-tag format MIC/MIW produce
        // (family + signed tier), so the existing dialInfo/collapseCrit/magnitude logic applies as-is.
        // Mirrors _miwAnnotateCritRaw but reads the sample record instead of a live ticker; a family
        // with no data for this record is simply omitted.
        _pfSampleTags(r, sym, includeLpa) {
          const tags = [];
          const sgn = n => (n >= 0 ? '+' : '') + n;
          const vol = Number(r.vol), oi = Number(r.oi);
          if (typeof r.fr === 'number' && !isNaN(r.fr)) {
            const tier = Math.trunc(r.fr / this._pfSampleStep('fund'));
            tags.push('fund' + (r.fr < 0 ? '-' : '+') + Math.abs(tier));
          }
          const wv = this._pfVolIoWindowAvg?.('vol'), wo = this._pfVolIoWindowAvg?.('oi');
          if (vol > 0 && wv > 0) tags.push('va' + sgn(Math.floor((Math.log(vol / wv) * 100) / this._pfSampleStep('va'))));
          if (oi > 0 && wo > 0) tags.push('ioa' + sgn(Math.floor((Math.log(oi / wo) * 100) / this._pfSampleStep('ioa'))));
          if (typeof r.bc === 'number' && typeof r.sc === 'number' && r.bc + r.sc > 0) {
            tags.push('ocs' + sgn(Math.floor(((r.bc / (r.bc + r.sc)) * 100 - 50) / this._pfSampleStep('ocs'))));
          }
          const wm = this._pfOcWindowAvgMs?.();
          if (r.avgMs != null && wm > 0) tags.push('ocx' + sgn(Math.floor((((wm - r.avgMs) / wm) * 100) / this._pfSampleStep('ocx'))));
          if (typeof r.ht === 'number') {
            const dev = this._pfLtaDev(r.ht, r.vol);
            if (dev != null) tags.push('lta' + sgn(Math.floor(dev / this._pfSampleStep('lta'))));
          }
          if (includeLpa && typeof r.hc === 'number' && !isNaN(r.hc)) {
            const avg = this._pfLpaWindowAvg(sym);
            if (avg != null) tags.push('lpa' + sgn(Math.floor((r.hc - avg) / this._pfSampleStep('lpa'))));
          }
          return tags;
        },
        // Called with each new sample-cycle entry (own fetch, or a follower's seed from the leader).
        _pfSampleIngest(entry) {
          if (!this.cfg.pfSampleScoringEnabled || !entry || !Array.isArray(entry.results)) return;
          if (this._pfFollowing()) return; // following — adopt the leader's scored store (_pfSampleAdopt) instead of double-counting its batch
          const st = (this._pfSampleStore ||= { obs: [], pending: [] });
          const delayed = !!this.cfg.pfSampleDelayed;
          if (delayed) {
            // Snapshot now (tiers as MIC/MIW would tag them at this moment); the outcome arrives later.
            if (st.pending.some(p => p.ts === entry.ts)) return;
            const recs = [];
            for (const r of entry.results) {
              if (!r || typeof r.sym !== 'string') continue;
              const tags = this._pfSampleTags(r, r.sym, true);
              if (tags.length) recs.push({ s: r.sym, c: tags });
            }
            if (recs.length >= 5) { st.pending.push({ ts: entry.ts, recs }); if (st.req) for (const r of recs) delete st.req[r.s]; this._pfSampleSaveSoon(); }
          } else {
            let added = 0;
            for (const r of entry.results) {
              if (!r || typeof r.sym !== 'string' || typeof r.hc !== 'number' || isNaN(r.hc)) continue;
              const avg = this._pfLpaWindowAvg(r.sym);
              if (avg == null) continue;
              const tags = this._pfSampleTags(r, r.sym, false);
              if (!tags.length) continue;
              st.obs.push({ t: entry.ts, s: r.sym, k: 'n', y: +(r.hc - avg).toFixed(4), r: +Number(r.hc).toFixed(4), c: tags });
              added++;
            }
            if (added) this._pfSampleSaveSoon();
          }
        },
        // Forward outcome for pending snapshots whose hour has elapsed: one 1m-kline request per ticker
        // pinned to [ts, ts+1h), so a late fetch (inside the deadline) measures the same window as an
        // on-time one. Skipped while following (the no-own-fetch rule) and when another resolve is running.
        async _pfSampleResolvePending() {
          if (!this.cfg.pfSampleScoringEnabled || !this.cfg.pfSampleDelayed) return;
          if (this._pfSampleResolving || this._pfFollowing()) return;
          const st = this._pfSampleStore;
          if (!st?.pending?.length) return;
          this._pfSampleResolving = true;
          try {
            const now = Date.now(), H = 3600000, grace = this._pfSampleDeadlineMs();
            const keep = [];
            let changed = false;
            for (const p of st.pending) {
              if (now < p.ts + H) { keep.push(p); continue; }
              const expired = now > p.ts + H + grace;
              const start = Math.floor(p.ts / 60000) * 60000, end = start + H - 1;
              const todo = p.recs.filter(r => typeof r.fh !== 'number');
              for (let i = 0; i < todo.length && !expired; i += 10) {
                await Promise.all(todo.slice(i, i + 10).map(async r => {
                  try {
                    const res = await this._qFetch(`${this.base}/v5/market/kline?category=linear&symbol=${r.s}&interval=1&start=${start}&end=${end}&limit=60`);
                    const list = (await res.json())?.result?.list || [];
                    if (list.length < 50) return;
                    // rows: [start, open, high, low, close, ...], newest first
                    const o = parseFloat(list[list.length - 1][1]), c = parseFloat(list[0][4]);
                    let hi = -Infinity, lo = Infinity;
                    for (const k of list) { const h = parseFloat(k[2]), l = parseFloat(k[3]); if (h > hi) hi = h; if (l < lo) lo = l; }
                    if (o > 0 && !isNaN(c) && isFinite(hi) && isFinite(lo)) { r.f = (c - o) / o * 100; r.fh = (hi - o) / o * 100; r.fl = (lo - o) / o * 100; }
                  } catch (_) {}
                }));
              }
              const done = p.recs.filter(r => typeof r.f === 'number');
