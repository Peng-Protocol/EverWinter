        // average of the counted tickers; relative on purpose, so a market where everything is mixed doesn't graylist everything.
        _pfInstabStats() {
          const ver = this._pfLiqVer || 0;
          const hist = this._pfOcCycleHistory || [];
          let maxTs = 0;
          for (const c of hist) if (c && typeof c.ts === 'number' && c.ts > maxTs) maxTs = c.ts;
          const key = hist.length + '|' + maxTs + '|' + (this.cfg.pfInstabPct || 0) + '|' + (this.cfg.pfInstabMinWatches || 0) + '|' + ver;
          if (this._pfInstabMemo && this._pfInstabMemo.key === key) return this._pfInstabMemo.val;
          const acc = {};
          for (const c of hist) {
            if (!c || !Array.isArray(c.results)) continue;
            for (const r of c.results) {
              if (!r || typeof r.sym !== 'string' || !(r.lu > 0 || r.ld > 0)) continue;
              const a = (acc[r.sym] ||= { u: 0, d: 0, n: 0 });
              a.u += r.lu || 0; a.d += r.ld || 0; a.n++;
            }
          }
          const minW = Math.max(1, Number(this.cfg.pfInstabMinWatches) || 2), inst = {};
          let sum = 0, n = 0;
          for (const [sym, a] of Object.entries(acc)) {
            const tot = a.u + a.d;
            if (a.n < minW || !(tot > 0)) continue;
            inst[sym] = 1 - Math.abs(a.u - a.d) / tot;
            sum += inst[sym]; n++;
          }
          const avg = n ? sum / n : null;
          const limit = avg == null ? null : avg * (1 + Math.max(0, Number(this.cfg.pfInstabPct) || 0) / 100);
          const gray = new Set();
          if (limit != null) for (const [sym, v] of Object.entries(inst)) if (v >= limit && v > 0) gray.add(sym);
          const val = { inst, avg, limit, gray };
          this._pfInstabMemo = { key, val };
          return val;
        },
        _pfInstabOn() { return !!(this.cfg.pfLiqEnabled && this.cfg.pfInstabEnabled && this.cfg.pfSampleScoringEnabled); },
        // The check the MIC/MIW pool build uses: the unstable set (works for a follower too — the split rides on the adopted history),
        // plus the legacy time-based graylist (st.gray) for the leader.
        _pfGrayHas(sym) {
          if (this._pfStbIs(sym)) return true; // Stablecoin Filter
          if (this._pfIlqIs(sym)) return true; // Illiquidity Filter: measured slow, reading still live
          if (this._pfInstabOn() && this._pfInstabStats().gray.has(sym)) return true;
          const c = this.cfg, t = this._pfSampleStore?.gray?.[sym];
          return !!t && !!c.pfSampleScoringEnabled && !this._pfFollowing()
            && Date.now() - t <= (Math.max(1, Number(c.pfDistMins) || 240)) * 60000;
        },
        // Liq-view pill presentation, from one watch's split. 'fav' = pure and in the bot's favor, 'mixfav' = mixed, favorable side
        // dominant, 'mixunf' = mixed, unfavorable side dominant (a dead-even split counts here), 'unf' = pure, against the bot,
        // 'quiet' = watched, nothing liquidated. Mixed = the minority side holds more than pfMixedPct % of the turnover.
        _pfLiqHas(r) { return !!r && (r.lu > 0 || r.ld > 0 || (typeof r.lq === 'number' && r.lq !== 0)); },
        _pfLiqPillClass(r) {
          const u = Number(r.lu) || 0, d = Number(r.ld) || 0, tot = u + d;
          const dir = this._pfSampleDir();
          if (!(tot > 0)) { // no split recorded: an older watch (lean only) can only say which side led, so it shows as pure
            if (typeof r.lq === 'number' && r.lq !== 0) return { cls: dir * r.lq > 0 ? 'fav' : 'unf', u: null, d: null };
            return { cls: 'quiet', u: 0, d: 0 };
          }
          const lean = (u - d) / tot, minor = Math.min(u, d) / tot;
          const fav = dir * lean > 0;
          const mixed = minor * 100 > (Number(this.cfg.pfMixedPct) || 30);
          return { cls: fav ? (mixed ? 'mixfav' : 'fav') : (mixed ? 'mixunf' : 'unf'), u: u / tot, d: d / tot };
        },
        // Following: adopt the leader's published store instead of building our own (the regular scorer's closed-trade
        // records are per-bot, but sample scores are market data — a follower can't fetch/resolve them itself, so it
        // must share the leader's). Deduped on the shared snapshot's ts.
        _pfSampleAdopt() {
          if (!this.cfg.pfSampleScoringEnabled || !this._pfFollowing()) return false;
          const sh = this._sharedRead?.('sampleScore');
          if (!sh?.data || !Array.isArray(sh.data.obs)) return false;
          if (sh.ts && sh.ts === this._pfSampleLastSharedTs) return false;
          this._pfSampleLastSharedTs = sh.ts;
          this._pfSampleStore = { obs: sh.data.obs, ...(sh.data.wx ? { wx: sh.data.wx } : {}) };
          try { localStorage.setItem(SAMPLE_OBS_KEY, JSON.stringify(this._pfSampleStore)); } catch (_) {}
          return true;
        },
        // Criterion tags for one sampled ticker, in exactly the annotated-tag format MIC/MIW produce
        // (family + signed tier), so the existing dialInfo/collapseCrit/magnitude logic applies as-is.
        // Mirrors _miwAnnotateCritRaw but reads the sample record instead of a live ticker; a family
        // with no data for this record is simply omitted.
        _pfSampleTags(r, sym, includeLpa) {
          const tags = [];
          const sgn = n => (n >= 0 ? '+' : '') + n;
          const vol = Number(r.vol), oi = Number(r.oi);
          if (typeof r.fr === 'number' && !isNaN(r.fr)) {
            const tier = Math.trunc(r.fr / this._pfSampleStep('fund'));
            tags.push('fund' + (r.fr < 0 ? '-' : '+') + Math.abs(tier));
          }
          const wv = this._pfVolIoWindowAvg?.('vol');
          if (vol > 0 && wv > 0) tags.push('va' + sgn(Math.floor((Math.log(vol / wv) * 100) / this._pfSampleStep('va'))));
          // IO/L, IO/S: the long / short share of open interest (oi x long share, oi x short share) against that share's window average, same log-tier as V/A. Needs the batch's long/short ratio (bl) and 10+ readings in the window.
          if (oi > 0 && Number(r.bl) > 0 && Number(r.bl) < 1) {
            for (const [fam, long] of [['iol', 1], ['ios', 0]]) {
              const st = this._pfWindowStats(long ? 'oil' : 'ois'), v = this._pfLsOi(r, long);
              if (st.n >= 10 && v > 0) tags.push(fam + sgn(Math.floor((Math.log(v / (st.sum / st.n)) * 100) / this._pfSampleStep(fam))));
            }
          }
          if (typeof r.ht === 'number') {
            const dev = this._pfLtaDev(r.ht, r.vol);
            if (dev != null) tags.push('lta' + sgn(Math.floor(dev / this._pfSampleStep('lta'))));
          }
          if (includeLpa && typeof r.hc === 'number' && !isNaN(r.hc)) {
            const avg = this._pfLpaWindowAvg(sym);
            if (avg != null) tags.push('lpa' + sgn(Math.floor((r.hc - avg) / this._pfSampleStep('lpa'))));
          }
          return tags;
        },
        // Called with each new sample-cycle entry: criteria tiers at sample time against the last completed hour's price change (demeaned
        // against the rolling LPA average).
        _pfSampleIngest(entry) {
          if (!this.cfg.pfSampleScoringEnabled || !entry || !Array.isArray(entry.results)) return;
          if (this._pfFollowing()) return; // following — adopt the leader's scored store (_pfSampleAdopt) instead of double-counting its batch
          const st = (this._pfSampleStore ||= { obs: [] });
          let added = 0;
          for (const r of entry.results) {
            if (!r || typeof r.sym !== 'string' || typeof r.hc !== 'number' || isNaN(r.hc)) continue;
            const avg = this._pfLpaWindowAvg(r.sym);
            if (avg == null) continue;
            const tags = this._pfSampleTags(r, r.sym, false);
            if (!tags.length) continue;
            st.obs.push({ t: entry.ts, s: r.sym, k: 'n', y: +(r.hc - avg).toFixed(4), r: +Number(r.hc).toFixed(4), c: tags });
            added++;
          }
          if (this._pfLiqOn()) added += this._pfLiqIngest(entry);
          if (added || this.cfg.pfLiqEnabled) this._pfSampleSaveSoon();
        },
        // The Sample Scoring build — replaces _pfExtremityBuild's closed-trade walk when enabled. Publishes the
        // same outputs: afDialCutoffs/afDialSampleCounts (own cutoffs, from the sample magnitudes), the
        // flat rank map MIC/MIW read, the two-bucket scoreboard, and the per-bucket overall means that
        // decide the favored side.
        _pfSampleBuild() {
          const st = this._pfSampleStore || { obs: [] };
          const kind = this._pfSampleKind();
          const dir = this._pfSampleDir();
          const minSamples = Math.max(3, this.cfg.pfExtremityMinSamples || 3);
          const splitPct = Math.min(0.49, Math.max(0.01, (this.cfg.pfExtremitySplitPct ?? 30) / 100));
          let obs = this._pfObsLive().filter(o => o && o.k === kind && Array.isArray(o.c) && typeof o.y === 'number');
          if (kind === 'n') {
            // The hour candle is shared by every cycle inside a clock hour — keep only each ticker's latest
            // observation per hour so one move isn't counted once per scan.
            const latest = new Map();
            for (const o of obs) { const k = o.s + '|' + Math.floor(o.t / 3600000); const p = latest.get(k); if (!p || o.t > p.t) latest.set(k, o); }
            obs = [...latest.values()];
          }
          const parsed = [];
          const pool = {};
          for (const o of obs) {
            const items = [];
            for (const tag of o.c) {
              const info = dialInfo(collapseCrit(tag));
              if (!info || (kind === 'n' && info.family === 'lpa')) continue;
              const m = tag.match(/(-?\d+)$/);
              const mag = m ? Math.abs(parseInt(m[1], 10)) : 0;
              const dk = info.family + '|' + info.pole;
              (pool[dk] ||= []).push(mag);
              items.push({ dk, mag });
            }
            if (items.length) { parsed.push({ edge: dir * o.y, raw: (typeof o.r === 'number' && !isNaN(o.r)) ? dir * o.r : null, items }); }
          }
          // Liquidation Surveillance (toggle): each 'l' observation is scored on its liquidated turnover's lean, in pp (r = lean x the
          // window's typical move, fixed when written), so it counts 1:1 with a price observation. Weighted by liquidated turnover
          // against the median, capped at 3x so one huge ticker can't carry a pole.
          const lparsed = [];
          if (this.cfg.pfLiqEnabled) {
            const lobs = this._pfObsLive().filter(o => o && o.k === 'l' && Array.isArray(o.c) && typeof o.r === 'number' && !isNaN(o.r));
            const lws = lobs.map(o => o.w).filter(w => w > 0).sort((a, b) => a - b);
            const lmw = lws.length ? lws[Math.floor(lws.length / 2)] : 0;
            for (const o of lobs) {
              const wt = lmw > 0 ? Math.min(3, (o.w > 0 ? o.w : lmw) / lmw) : 1;
              const items = [];
              for (const tag of o.c) {
                const info = dialInfo(collapseCrit(tag));
                if (!info) continue;
                const m = tag.match(/(-?\d+)$/);
                const mag = m ? Math.abs(parseInt(m[1], 10)) : 0;
                const dk = info.family + '|' + info.pole;
                (pool[dk] ||= []).push(mag);
                items.push({ dk, mag });
              }
              if (items.length) lparsed.push({ edge: dir * o.r, wt, items });
            }
          }
          const cutoffs = {};
          for (const [dk, mags] of Object.entries(pool)) {
            if (mags.length < minSamples) { cutoffs[dk] = null; continue; }
            const sorted = [...mags].sort((a, b) => a - b);
            cutoffs[dk] = sorted[Math.min(sorted.length - 1, Math.floor(sorted.length * (1 - splitPct)))];
          }
          const bucket = { extreme: {}, lukewarm: {} };
          const tot = { extreme: { sum: 0, n: 0 }, lukewarm: { sum: 0, n: 0 } };
          const totA = { extreme: { sum: 0, n: 0, p: 0, q: 0 }, lukewarm: { sum: 0, n: 0, p: 0, q: 0 } }; // absolute (raw move in the bot's favor) — only obs that carry a raw move
          for (const p of parsed) for (const { dk, mag } of p.items) {
            const b = (cutoffs[dk] != null && mag >= cutoffs[dk]) ? 'extreme' : 'lukewarm';
            const s = (bucket[b][dk] ||= { sum: 0, n: 0, wins: 0, losses: 0 });
            s.sum += p.edge; s.n++; if (p.edge > 0) s.wins++; else s.losses++;
            tot[b].sum += p.edge; tot[b].n++;
            if (p.raw != null) { totA[b].sum += p.raw; totA[b].n++; if (p.raw > 0) totA[b].p += p.raw; else totA[b].q -= p.raw; }
          }
          // Liquidation observations, bucketed by the same cutoffs. sum/w are turnover-weighted; p/q split the favorable and unfavorable pp.
          const bucketL = { extreme: {}, lukewarm: {} };
          const totL = { extreme: { sum: 0, w: 0, n: 0, p: 0, q: 0 }, lukewarm: { sum: 0, w: 0, n: 0, p: 0, q: 0 } };
          for (const p of lparsed) for (const { dk, mag } of p.items) {
            const b = (cutoffs[dk] != null && mag >= cutoffs[dk]) ? 'extreme' : 'lukewarm';
            const s = (bucketL[b][dk] ||= { sum: 0, w: 0, n: 0, wins: 0, losses: 0 });
            s.sum += p.wt * p.edge; s.w += p.wt; s.n++; if (p.edge > 0) s.wins++; else s.losses++;
            totL[b].sum += p.wt * p.edge; totL[b].w += p.wt; totL[b].n++;
            if (p.edge > 0) totL[b].p += p.wt * p.edge; else totL[b].q -= p.wt * p.edge;
          }
          // A pole is the 50/50 mean of its price edge and its liquidation edge when both have enough samples; whichever has
          // enough stands alone; with neither on its own, the pooled mean once the two together reach the minimum.
          const entryOf = b => dk => {
            const [family, pole] = dk.split('|');
            const ps = bucket[b][dk], ls = bucketL[b][dk];
            const pm = (ps && ps.n >= minSamples) ? ps.sum / ps.n : null;
            const lm = (ls && ls.n >= minSamples && ls.w > 0) ? ls.sum / ls.w : null;
            const n = (ps ? ps.n : 0) + (ls ? ls.n : 0);
            let pnl = 0;
            if (pm != null && lm != null) pnl = (pm + lm) / 2;
            else if (pm != null) pnl = pm;
            else if (lm != null) pnl = lm;
            else if (n >= minSamples) pnl = ((ps ? ps.sum : 0) + (ls && ls.w > 0 ? ls.sum / ls.w * ls.n : 0)) / n;
            return { family, pole, key: dialDisplayKey(family, pole), pnl, wins: (ps ? ps.wins : 0) + (ls ? ls.wins : 0), losses: (ps ? ps.losses : 0) + (ls ? ls.losses : 0), n, hasHist: true, hasTrade: false };
          };
          const keysOf = b => [...new Set([...Object.keys(bucket[b]), ...Object.keys(bucketL[b])])];
          let extreme = keysOf('extreme').map(entryOf('extreme')).sort((a, b) => b.pnl - a.pnl);
          let lukewarm = keysOf('lukewarm').map(entryOf('lukewarm')).sort((a, b) => b.pnl - a.pnl);
          
          const ranks = {}, dispStats = {};
          for (const e of extreme) {
            ranks[e.key] = e.pnl;
            dispStats[e.key] = { pnl: e.pnl, wins: e.wins, losses: e.losses, hasHist: true, hasTrade: false, cutoff: cutoffs[e.family + '|' + e.pole] ?? null, sampleCount: (pool[e.family + '|' + e.pole] || []).length };
          }
          this.pfDialCutoffs = cutoffs;
          this.pfDialSampleCounts = Object.fromEntries(Object.entries(pool).map(([k, v]) => [k, v.length]));
          this.miwCollapsedSlotRanks = ranks;
          this.miwCollapsedCritStats = dispStats;
          this.pfScoreboard = Object.entries(dispStats).sort(([, a], [, b]) => b.pnl - a.pnl).map(([key, s]) => ({ key, ...s }));
          this.pfLukewarmScoreboard = { extreme, lukewarm };
          const mean = t => (t.n ? t.sum / t.n : null);
          // Liquidation joins the price figures 50/50 (once it has the minimum samples in that bucket): the favored-side means, and the
          // headline's raw move (-> the one dollar value) and favorable share (-> the gauge, Target Halving, Negative Headline).
          const mixP = (a, b) => (a != null && b != null) ? (a + b) / 2 : (a ?? b);
          const lMean = t => (t.n >= minSamples && t.w > 0 ? t.sum / t.w : null);
          const mm = b => mixP(mean(tot[b]), lMean(totL[b]));
          // The weather headline (mean raw move AND favorable share) is blended in ONE space: per-observation pp mass, P = mean favorable pp,
          // Q = mean unfavorable pp, per source (price, liquidation). Sources are mixed on P and Q with the same weights as the
          // means, so mean = P - Q and share = (P - Q) / (P + Q) always come out of the same blend and can never differ in sign.
          const pqBase = t => (t.n > 0 ? { P: t.p / t.n, Q: t.q / t.n } : null);
          const pqLiq = t => (t.n >= minSamples && t.w > 0 ? { P: t.p / t.w, Q: t.q / t.w } : null);
          const pqMix = (a, b) => (a && b) ? { P: (a.P + b.P) / 2, Q: (a.Q + b.Q) / 2 } : (a || b);
          const pqOf = b => pqMix(pqBase(totA[b]), pqLiq(totL[b]));
          const aa = b => { const x = pqOf(b); return x ? x.P - x.Q : null; };
          const ss = b => { const x = pqOf(b); return (x && x.P + x.Q > 0) ? (x.P - x.Q) / (x.P + x.Q) : null; };
          this.pfSampleBucketMeans = { extreme: mm('extreme'), lukewarm: mm('lukewarm'), nE: tot.extreme.n + totL.extreme.n, nL: tot.lukewarm.n + totL.lukewarm.n, aE: aa('extreme'), aL: aa('lukewarm'), aE0: aa('extreme'), aL0: aa('lukewarm'), nAE: totA.extreme.n + totL.extreme.n, nAL: totA.lukewarm.n + totL.lukewarm.n, sE: ss('extreme'), sL: ss('lukewarm'), sE0: ss('extreme'), sL0: ss('lukewarm'), nlE: totL.extreme.n, nlL: totL.lukewarm.n };
          this._pfSampleTrackWx();
        },
        // Peak / bottom of the weather value (favored bucket's mean raw move in the bot's favor, stored in pp of price
        // move so it survives notional/leverage changes; shown in $ via _pfSampleWeather's conversion). Recorded only
        // once the side has enough raw-carrying samples (max(min samples, 10)) so a 3-sample fluke can't pin an
        // extreme forever. Lives in the sample store: cleared with the samples, shared leader -> follower.
        _pfSampleTrackWx() {
          const m = this.pfSampleBucketMeans, st = this._pfSampleStore;
          if (!m || !st) return;
          const lw = this._pfLukewarmFavoredSide() === 'lukewarm';
          const a = lw ? (m.aL0 ?? m.aL) : (m.aE0 ?? m.aE), n = lw ? m.nAL : m.nAE;
          if (a == null || n < Math.max(10, this.cfg.pfExtremityMinSamples || 3)) return;
          const w = st.wx || (st.wx = { hi: null, lo: null, hiT: 0, loT: 0, sHi: null, sLo: null });
          const now = Date.now();
          if (w.hi == null || a > w.hi) { w.hi = a; w.hiT = now; }
          if (w.lo == null || a < w.lo) { w.lo = a; w.loT = now; }
          const sv = lw ? (m.sL0 ?? m.sL) : (m.sE0 ?? m.sE);
          if (sv != null) { if (w.sHi == null || sv > w.sHi) w.sHi = sv; if (w.sLo == null || sv < w.sLo) w.sLo = sv; }
        },
        // Market weather (Sample Scorer headline): the favored bucket's mean ABSOLUTE edge — the raw 1hr move in this
        // bot's favor, not demeaned against the population — converted to dollars on one base position
        // (notional x move%), so it reads as "what an entry here would have made". Scale: +/- the entry TP target in
        // dollars (base margin x TP ROI%), i.e. a mean move large enough to hit TP is full scale. Observations stored
        // before raw moves were recorded carry no raw value and are left out until fresh ones accumulate.
        // `rel` is the old relative (demeaned) edge in pp, kept for the tooltip. `s` / `share` are the relative headline: the
        // favorable share of this side's raw move, P/(P+Q) (share, 0..1, 0.5 = even) and its signed form (P-Q)/(P+Q) (s, -1..+1, same
        // sign as `value`); sHi / sLo are the best / worst s recorded. Target Halving scales off s / sHi.
        _pfSampleWeather(side) {
          const m = this.pfSampleBucketMeans;
          if (!m) return null;
          const lw = side === 'lukewarm';
          const a = lw ? m.aL : m.aE, n = lw ? m.nAL : m.nAE;
          const tpRoi = Number(this.cfg.binaryModeEnabled ? (this.cfg.binaryTpPct ?? 18) : this.cfg.entryTpRoi) || 18;
          const notional = this.cfg.minNotional || 6;
          const cap = (notional / (this.cfg.leverage || 6)) * tpRoi / 100;
          const min = Math.max(3, this.cfg.pfExtremityMinSamples || 3);
          const w = this._pfSampleStore?.wx;
          const ok = a != null && n >= min, sv = lw ? m.sL : m.sE;
          return { s: (ok && sv != null) ? sv : null, share: (ok && sv != null) ? (1 + sv) / 2 : null, sHi: w?.sHi ?? null, sLo: w?.sLo ?? null, value: ok ? notional * a / 100 : null, nl: side === 'lukewarm' ? (m.nlL || 0) : (m.nlE || 0), cap, tpRoi, n, rel: m[side], hi: w?.hi != null ? notional * w.hi / 100 : null, lo: w?.lo != null ? notional * w.lo / 100 : null, hiT: w?.hiT || 0, loT: w?.loT || 0 };
        },
        // Threshold a criterion's rank must fall to for Slot Blocking: dollars of base margin for the
        // reactive scorer, percentage points of edge for Sample Scoring. MIC/MIW read this too.
        _pfBlockThreshold() {
          const pct = (this.cfg.miwSlotBlockPct ?? 25) / 100;
          if (this.cfg.pfSampleScoringEnabled) return pct;
          return ((this.cfg.minNotional || 6) / (this.cfg.leverage || 6)) * pct;
        },

        // Which side Lukewarm Scoring currently favors — whichever bucket's total $ (summed
        // across every family in it) is ahead. This is what _pfExtremityVeto actually targets:
        // no more manual Lukewarm Targeting toggle, the system re-decides for itself every time
        // _pfExtremityBuild runs, off the same scoreboard the panel shows. Ties (including
        // 0 vs 0, before either bucket has real data) default to 'extreme' — the original,
        // always-avoid-lukewarm behavior, until the data actually says otherwise.
        _pfLukewarmFavoredSide() {
          const board = this.pfLukewarmScoreboard || { extreme: [], lukewarm: [] };
          const sum = arr => arr.reduce((a, s) => a + s.pnl, 0);
          if (this.cfg.pfSampleScoringEnabled) {
            // Sample Scoring: compare the buckets' overall MEAN edge (per-observation), not their totals —
            // the extreme bucket is ~25% of readings by construction, so totals would always favor lukewarm.
            const m = this.pfSampleBucketMeans, min = Math.max(3, this.cfg.pfExtremityMinSamples || 3);
            if (m && m.extreme != null && m.lukewarm != null && m.nE >= min && m.nL >= min) return m.lukewarm > m.extreme ? 'lukewarm' : 'extreme';
            return 'extreme';
          }
          return sum(board.lukewarm) > sum(board.extreme) ? 'lukewarm' : 'extreme';
        },
        // Overall veto — "explicitly avoid any ticker exhibiting values from the LOSING side of
        // Lukewarm Scoring". Counts, across every dial-eligible criterion the ticker actually
        // exhibits, what share classifies as the non-favored side against the current cutoffs;
        // an unproven dial (below pfExtremityMinSamples) always counts against the ticker here,
        // same as a genuinely non-favored reading. Vetoes once that share reaches
        // pfLukewarmRatioPct (default 70%). Favored side comes from _pfLukewarmFavoredSide —
        // see there for how it's decided and how the default (favor extreme) applies before
        // there's enough data either way.
        _pfExtremityVeto(annotCrits) {
          const cutoffs = this.pfDialCutoffs || {};
          const favorLukewarm = this._pfLukewarmFavoredSide() === 'lukewarm';
          let total = 0, against = 0;
          for (const c of (annotCrits || [])) {
            const key = collapseCrit(c);
            const info = dialInfo(key);
            if (!info) continue;
            total++;
            if (!!BARE_DIAL_TAGS[key]) { if (favorLukewarm) against++; continue; } // no gradation — always extreme, so counts against a lukewarm-favoring veto
            const m2 = c.match(/(-?\d+)$/);
            const mag = m2 ? Math.abs(parseInt(m2[1], 10)) : 0;
            const cutoff = cutoffs[info.family + '|' + info.pole];
            const isExtreme = cutoff != null && mag >= cutoff;
            if (favorLukewarm ? isExtreme : !isExtreme) against++;
          }
          if (!total) return false;
          const againstPct = against / total * 100;
          return againstPct >= (this.cfg.pfLukewarmRatioPct ?? 70);
        },
        // Extremity Re-Evaluation (secondary toggle, off by default). At the end of every
        // scan, re-derives each open position's own qualifying criteria against the CURRENT
        // dial cutoffs and closes it once it crosses the same lukewarm-ratio bar it had to
        // clear to open in the first place — held to the same standard throughout its life,
        // not just at entry. Deliberately reads only data this cycle already cached (bulk
        // ticker snapshot + MIW's live OC cache) rather than firing fresh fetches of its
        // own, so it rides the existing scan cadence instead of adding load on top of the
        // scan scheduler. A symbol with no fresh-enough cached tick this cycle is skipped
        // rather than forcing a fetch.
        async _pfExtremityReEval() {
          if (!this.cfg.pfExtremityReEvalEnabled) return;
          const snapshot = [...(this.positions || [])];
          const _closes = []; // closed concurrently below — live closes wait on exchange fills
          for (const pos of snapshot) {
            if (!pos || !pos.symbol) continue;
            const crits = pos._miwCriteria || pos._bewCriteria || pos._ldwCriteria;
            if (!crits || !crits.length) continue;
            // Reads the rolling average built each scan by _pfPositionCriteriaSample.
            const liveCrits = this._pfPositionAvgCriteria(pos);
            if (this._pfExtremityVeto(liveCrits)) {
              _closes.push((async () => {
                try {
                  await this.pseudoClosePosition(pos, 'Ext-Rvl');
                  this.log(`[PF] ${pos.symbol} closed — Extremity Re-Evaluation: crossed onto the non-favored side.`, 'info');
                } catch (e) { this.log(`[PF] Ext-Rvl close error (${pos.symbol}): ${e.message}`, 'warn'); }
              })());
            }
          }
          if (_closes.length) await Promise.all(_closes);
        },
        // cfg.miwEnabled is a persisted toggle value — it survives MIW being removed via the
        // Plugin Manager, so it alone can't tell us whether MIW is actually loaded right now.
        // Cross-check against the live plugin list so the MIW scorecard section disappears the
        // moment MIW is unloaded, not just when its own toggle happens to be off.
        _miwPluginLoaded() {
          return (this._pluginList || []).some(p => p.id === 'multiindicator-winter');
        },
        _bewPluginLoaded() {
          return (this._pluginList || []).some(p => p.id === 'blindentry-winter');
        },
        _ldwPluginLoaded() {
          return (this._pluginList || []).some(p => p.id === 'liquiddiver-winter');
        },
        // Liquid-Diver's OC fetch is single-symbol, triggered per reactive entry — its samples are
        // almost always one bar of 0.0s and drown out a real batch-fetched sample. Only show the
        // chart when a plugin doing proper batch OC sampling (MIW or Blind-Entry) is loaded; if
        // Liquid-Diver is the only OC consumer, hide it rather than let its noise dominate.
        _ocChartViable() {
          return this._miwPluginLoaded() || this._bewPluginLoaded();
        },
        // Slot Blocking: true once a criterion's collapsed score is a loss beyond the
        // configured % of base margin. Auto-clears the moment the score recovers — no manual
        // reset needed. A lukewarm-classified occurrence never reaches this score at all (see
        // _pfExtremityBuild) — blocking only ever reacts to a losing EXTREME, same standard
        // the dial applies everywhere else.
        _pfIsCritBlocked(key) {
          if (!this.cfg.miwSlotBlockEnabled) return false;
          const ranks = this.miwCollapsedSlotRanks || {};
          const threshold  = this._pfBlockThreshold();
          if (!this.cfg.miwSlotBlockTags) return false;
          const blockable = (this.cfg.miwSlotBlockCriteria || []).filter(Boolean);
          if (!blockable.length) return false;
          const esc = v => String(v).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const rx = new RegExp('^(' + blockable.map(esc).join('|') + ')[+-]?$');
          return rx.test(key) && (ranks[key] ?? 0) <= -threshold;
        },
        // Lukewarm Scoring pill UI — two big buckets, Extreme and Lukewarm, each
        // headlined by its aggregate $ record (which side has actually been more
        // profitable overall), with smaller per-criterion pills nested inside showing which
        // of fund/V-A/IO-A/OCS/OCX drove that bucket's result.
        _pfExtremityHtml(shown) {
          if (!shown) return '';
          const board = this.pfLukewarmScoreboard || { extreme: [], lukewarm: [] };
          if (!board.extreme.length && !board.lukewarm.length) return `<span style="font-size:9px;color:var(--text-lo)">${this.cfg.pfSampleScoringEnabled ? 'No scored samples yet.' : 'No Extremity closes recorded yet.'}</span>`;
          // one chart at a time: only the side the bot currently favors is drawn.
          // One row of criterion duos (left bar = '+' end, right bar = '-' end); profit rises
          // above the zero line, loss hangs below it. Sized off the container, never wraps.
          const side = this._pfLukewarmFavoredSide();
          const entries = board[side] || [];
          const accent = side === 'lukewarm' ? 'rgba(150,150,160,.45)' : 'rgba(96,210,255,.45)';
          const FAMS = ['fund', 'va', 'iol', 'ios', 'lta', 'lpa'].filter(f => !(this.cfg.pfSampleScoringEnabled && !this.cfg.pfLiqEnabled && f === 'lpa')); // Sample Scoring never scores LPA (it is the outcome), so its dial stays hidden
          const byKey = {};
          for (const s of entries) byKey[s.key] = s;
          const sm = !!this.cfg.pfSampleScoringEnabled;
          const fmt = sm ? (v => (v >= 0 ? '+' : '-') + Math.abs(v).toFixed(2) + 'pp') : (v => (v >= 0 ? '+$' : '-$') + Math.abs(v).toFixed(2));
          const GREEN = 'rgba(100,220,150,.9)', PURPLE = 'rgba(190,130,255,.95)';
          const total = (sm && this.pfSampleBucketMeans && this.pfSampleBucketMeans[side] != null) ? this.pfSampleBucketMeans[side] : entries.reduce((a, s) => a + s.pnl, 0);
          const totalColor = total > 0 ? GREEN : total < 0 ? 'var(--short)' : 'var(--text-lo)';
          const wx = sm ? this._pfSampleWeather(side) : null;
          const fmtUsd = v => (v >= 0 ? '+$' : '-$') + Math.abs(v).toFixed(3);
          const headVal = wx ? wx.value : (entries.length ? total : null);
          const headColor = headVal == null ? 'var(--text-lo)' : headVal > 0 ? GREEN : headVal < 0 ? 'var(--short)' : 'var(--text-lo)';
          const headTxt = headVal == null ? '—' : (wx ? (wx.share != null ? (wx.share * 100).toFixed(1) + '%' : '—') : fmt(headVal));
          const headTip = wx ? `Share of this side's raw 1hr move (and, with Liquidation Surveillance, its liquidation lean in pp, mixed 50/50) that went in the bot's favor (50% = even; gauge scaled to the best share recorded)${wx.value != null ? ' · mean ' + fmtUsd(wx.value) + ' on one base position' : ''}. n=${wx.n}${wx.rel != null ? ' · relative edge ' + fmt(wx.rel) : ''}${wx.value == null ? ' · waiting for samples with a raw move' : ''}` : '';
          let gauge = '';
          if (wx) {
            const sc = Math.max(wx.sHi || 0, -(wx.sLo || 0)) || 1, P = v => (((1 + v) / 2) * 100).toFixed(0) + '%';
            const pc = wx.s == null ? 0 : Math.max(-1, Math.min(1, wx.s / sc));
            const gl = pc >= 0 ? 50 : 50 + pc * 50, gw = Math.abs(pc) * 50;
            gauge = `<div title="${headTip}" style="margin-bottom:5px"><div style="position:relative;height:5px;background:rgba(255,255,255,.07);border-radius:3px"><div style="position:absolute;top:0;bottom:0;left:${gl}%;width:${gw}%;background:${headColor};border-radius:3px"></div><div style="position:absolute;top:-1px;bottom:-1px;left:50%;width:1px;background:rgba(255,255,255,.3)"></div></div><div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:8px;color:var(--text-lo);margin-top:2px"><span>${P(-sc)}</span><span>50%</span><span>${P(sc)}</span></div><div title="Highest / lowest favorable share recorded (needs 10+ raw samples on the side). Cleared with the samples." style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;margin-top:3px"><span style="color:var(--short)">bottom ${wx.sLo != null ? P(wx.sLo) : '—'}</span><span style="color:${GREEN}">peak ${wx.sHi != null ? P(wx.sHi) : '—'}</span></div></div>`;
          }
          let maxAbs = 0.01;
          for (const f of FAMS) for (const p of ['+', '-']) maxAbs = Math.max(maxAbs, Math.abs((byKey[f + p] || { pnl: 0 }).pnl));
          const bar = key => {
            const s = byKey[key];
            const v = s ? s.pnl : 0;
            const blocked = this._pfIsCritBlocked(key);
            const color = blocked ? PURPLE : v > 0 ? GREEN : v < 0 ? 'var(--short)' : 'var(--text-lo)';
            const h = v === 0 ? 0 : Math.max(3, Math.min(100, Math.abs(v) / maxAbs * 100));
            const tip = s ? (sm ? `${key}  ${fmt(v)} avg edge  ${s.wins}↑ ${s.losses}↓  n=${s.n}` : `${key}  ${fmt(v)}  ${s.wins}W ${s.losses}L`) : `${key}  ${sm ? 'no samples yet' : 'no closes yet'}`;
            const half = (up) => `<div style="flex:1 1 0;min-height:0;display:flex;align-items:${up ? 'flex-end' : 'flex-start'}">`
              + ((up ? v > 0 : v < 0) ? `<div style="width:100%;height:${h}%;background:${color};border-radius:${up ? '2px 2px 0 0' : '0 0 2px 2px'}"></div>` : '')
              + `</div>`;
            return `<div title="${tip}" style="flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column">${half(true)}${half(false)}</div>`;
          };
          const duo = f => `<div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px">`
            + `<div style="display:flex;gap:6%;width:72%;height:clamp(56px,20cqw,120px)">${bar(f + '+')}${bar(f + '-')}</div>`
            + `<div style="font-size:clamp(10px,4cqw,20px);line-height:1">${pfCritEmoji(f + '+').replace(/[+\-<>]+$/, '')}</div>`
            + `</div>`;
          return `<div style="width:100%;container-type:inline-size;border:1px solid ${accent};border-radius:8px;padding:6px 8px;background:rgba(255,255,255,.02);box-sizing:border-box">`
            + `<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;font-family:var(--mono)">`
            + `<div style="font-size:8px;letter-spacing:1.5px;color:var(--text-lo)">${side === 'lukewarm' ? 'LUKEWARM' : 'EXTREME'}${sm ? ' · SAMPLES' : ''}</div>`
            + `<div title="${headTip}" style="font-size:11px;color:${headColor}"><b>${headTxt}</b></div>`
            + `</div>`
            + gauge
            + `<div style="position:relative">`
            + `<div style="position:absolute;left:0;right:0;top:calc(clamp(56px,20cqw,120px) / 2);height:1px;background:rgba(255,255,255,.12)"></div>`
            + `<div style="display:flex;flex-wrap:nowrap;gap:2%;width:100%">${FAMS.map(duo).join('')}</div>`
            + `</div>`
            + `</div>`;
        },
        _pfCrossRead() {
          try {
            const raw = localStorage.getItem(CROSS_KEY);
            if (!raw) return [];
            const cut = Date.now() - CROSS_TTL;
            return (JSON.parse(raw).events || []).filter(e => e.ts >= cut);
          } catch(e) { return []; }
        },

        _pfCrossWrite(kind, symbol, extra) {
          try {
            const events = this._pfCrossRead();
            const rec = { ts: Date.now(), kind, source: 'winter' };
            if (symbol) rec.symbol = symbol;
            if (extra) Object.assign(rec, extra);
            events.push(rec);
            localStorage.setItem(CROSS_KEY, JSON.stringify({ events: _trimCrossEvents(events) }));
          } catch(e) {}
        },

        async _pfCheckCross() {
          if (!this.cfg.permafrostCrossEnabled) return;
          const fromChaser = this._pfCrossRead().filter(e => e.source === 'chaser');
          this.pfCrossEvents = fromChaser.slice(-20);
        },

        // Renders the Cross tab's Partner Feed — every broadcast kind Chaser can write to the
        // shared bus (cascade/sacrifice closes, DDH/glk start+end transitions, GC steps), not
        // just close reasons. Built for debugging Mutual DDH Lift and GC lift: the start/end
        // pairing and step numbers here are what actually decide whether a lift condition fires.
        _pfCrossFeedHtml() {
          const meta = {
            'cascade':   { icon: '⚡', label: 'Cascade',          color: 'rgba(100,220,150,.9)' },
            'sacrifice': { icon: '🩸', label: 'Sacrifice',        color: 'rgba(255,80,80,.9)' },
            'ddh-start': { icon: '🧊', label: 'DDH Start',        color: 'rgba(120,180,255,.9)' },
            'ddh-end':   { icon: '🧊', label: 'DDH Lift',         color: 'rgba(120,180,255,.55)' },
            'glk-start': { icon: '🔒', label: 'Gains-Lock Start', color: 'rgba(220,180,100,.9)' },
            'glk-end':   { icon: '🔓', label: 'Gains-Lock Lift',  color: 'rgba(220,180,100,.55)' },
            'gc':        { icon: '📡', label: 'GC Step',          color: 'rgba(180,140,255,.9)' },
          };
          const events = (this.pfCrossEvents || []).filter(e => meta[e.kind]).slice().reverse();
          if (!events.length) return '';
          const todayUTC = new Date().toISOString().slice(0, 10);
          return events.map(e => {
            const m = meta[e.kind];
            const d = new Date(e.ts);
            const dateUTC = d.toISOString().slice(0, 10);
            const t = (dateUTC !== todayUTC ? dateUTC.slice(5) + ' ' : '') + d.toISOString().slice(11, 19) + ' UTC';
            let detail = '';
            if (e.kind === 'gc') detail = (e.pnl != null ? '+' + e.pnl.toFixed(2) : '') + (e.step != null ? ' · step ' + e.step : '');
            else if (e.kind === 'cascade' || e.kind === 'sacrifice') detail = (e.count != null ? '×' + e.count + ' ' : '') + (e.pnl != null ? (e.pnl >= 0 ? '+' : '') + e.pnl.toFixed(2) : '') + (e.symbol ? ' ' + e.symbol : '');
            else if (e.symbol) detail = e.symbol;
            return `<div style="display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:8px;line-height:12px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04)">` +
              `<span>${m.icon}</span>` +
              `<span style="color:${m.color};font-weight:bold;white-space:nowrap">${m.label}</span>` +
              `<span style="color:var(--text-lo)">${detail}</span>` +
              `<span style="margin-left:auto;color:var(--text-lo);white-space:nowrap">${t}</span>` +
              `</div>`;
          }).join('');
        },

        _pfDownload(filename, data, compact) {
          const blob = new Blob([JSON.stringify(data, null, compact ? 0 : 2)], { type: 'application/json' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = filename;
          a.click();
          URL.revokeObjectURL(a.href);
        },
        pfExportAll() { this.pfExportData('profile'); },

        // ── Export pop-up ──────────────────────────────────────────────────────
        // Danger Zone → Export opens this menu: a body-level portal styled like the base bot's Export Data modal (so the panel can't clip it).
        // Each button is one JSON download. 'profile' holds every store Import can restore; single-type files (closed, charts, obs, forecast, pool,
        // cross) and the 'all' file import too. Score readout, chart views, liquidation watch and plugin state are diagnostic only.
        _pfExportMenu() {
          return [
            { id: 'all', icon: '📦', label: 'Everything', sub: 'All data types below in one file', cls: 'btn-ice' },
            { sec: 'Scorer' },
            { id: 'score', icon: '🎯', label: 'Scorer Readout', sub: 'Headline, favored side, every pole score and n, cutoffs, window averages, settings' },
            { id: 'obs', icon: '🧪', label: 'Sample Observations', sub: 'Every scored price + liquidation observation, weather peak and bottom, graylists' },
            { id: 'forecast', icon: '🔮', label: 'Forecast Grader · Summary', sub: 'Settings, indicator forecast, window / per-batch / projection grades, feature IC, batch context (no per-forecast rows)' },
            { id: 'forecast:graded', icon: '🎯', label: 'Forecast Grader · Grades', sub: 'One row per graded forecast: projection, actual, move path, accuracy, poles, indicator scores (no raw readings)' },
            { id: 'forecast:readings', icon: '🧮', label: 'Forecast Grader · Readings', sub: 'The snapshot and background readings behind each graded forecast, as compact columns (join on symbol + startBatch)' },
            { id: 'forecast:pending', icon: '⏳', label: 'Forecast Grader · Pending', sub: 'Forecasts still waiting for their revisit, with their readings' },
            { id: 'forecast:ranges', icon: '📏', label: 'Forecast Grader · Range Fit States', sub: 'The stored market states and the move range each paid' },
            { id: 'pool', icon: '🎚', label: 'Dial Sample Pool', sub: 'Samples behind each dial cutoff' },
            { id: 'closed', icon: '📈', label: 'Closed-Trade History', sub: 'Extremity records from closed positions' },
            { sec: 'Sample charts' },
            { id: 'charts', icon: '🗂', label: 'All Sample Charts', sub: 'Every batch, every ticker, every field (the raw chart history)' },
            { grid: [['chart:vol', 'Vol'], ['chart:io', 'IO'], ['chart:ls', 'L/S'], ['chart:fund', 'Fund'], ['chart:lta', 'LTA'], ['chart:lpa', 'LPA'], ['chart:liq', 'Liq']] },
            { sec: 'Live and state' },
            { id: 'liqwatch', icon: '💥', label: 'Liquidation Watch', sub: 'Watch in progress, live tally per ticker, unscored closing watch' },
            { id: 'cross', icon: '📡', label: 'Cross Events', sub: 'GC steps, cascade / sacrifice, DDH and gains-lock log' },
            { id: 'state', icon: '🔧', label: 'Plugin State', sub: 'GC window, drawdown state' },
            { id: 'profile', icon: '💾', label: 'Profile (for Import)', sub: 'Every importable store: closed trades, charts, observations, forecasts, dial pool, cross events' },
          ];
        },
        pfExportOpen() {
          const PID = 'pfr-export-portal';
          try { document.getElementById(PID)?.remove(); } catch (_) {}
          const ov = document.createElement('div');
          ov.id = PID;
          ov.style.cssText = 'position:fixed;inset:0;z-index:5002;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,8,16,.92);backdrop-filter:blur(6px)';
          const sub = (t, ice) => `<span style="font-size:9px;color:${ice ? 'var(--ice)' : 'var(--text-lo)'};opacity:.7;display:block;letter-spacing:.5px;margin-top:1px">${t}</span>`;
          const items = this._pfExportMenu().map(it => {
            if (it.sec) return `<div style="font-family:var(--mono);font-size:8px;letter-spacing:1.5px;color:var(--text-lo);text-transform:uppercase;margin-top:6px">${it.sec}</div>`;
            if (it.grid) return `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${it.grid.map(([id, l]) => `<button class="btn btn-ghost" style="font-size:10px;padding:7px" data-ex="${id}">${l}</button>`).join('')}</div>`;
            return `<button class="btn ${it.cls || 'btn-ghost'}" style="font-size:10px;padding:7px" data-ex="${it.id}">${it.icon} ${it.label}${sub(it.sub, it.cls === 'btn-ice')}</button>`;
          }).join('');
          ov.innerHTML = `<div class="modal-box" style="width:420px;max-height:88vh;overflow-y:auto">`
            + `<div class="modal-title">↓ Export Data</div>`
            + `<div class="modal-sub" style="margin-bottom:14px">Choose what to export. Each button downloads one file; sample charts can be taken all at once or one at a time.</div>`
            + `<div style="display:flex;flex-direction:column;gap:8px">${items}`
            + `<button class="btn btn-ghost" style="font-size:10px;padding:7px;margin-top:4px" data-ex="cancel">Cancel</button></div></div>`;
          const onKey = e => { if (e.key === 'Escape') close(); };
          const close = () => { document.removeEventListener('keydown', onKey); ov.remove(); };
          document.addEventListener('keydown', onKey);
          ov.addEventListener('click', e => {
            if (e.target === ov) return close();
            const b = e.target.closest('[data-ex]');
            if (!b) return;
            const id = b.getAttribute('data-ex');
            if (id !== 'cancel') this.pfExportData(id);
            close();
          });
          document.body.appendChild(ov);
        },
        pfExportData(id) {
          const ts = new Date().toISOString().slice(0, 19).replace(/[T:]/g, '-');
          const slug = String(id).replace(':', '-');
          try {
            const body = String(id).startsWith('chart:') ? this._pfExportChart(String(id).slice(6)) : this._pfExportPart(id);
            this._pfDownload(`permafrost-${slug}-${ts}.json`, { exportType: 'permafrost-' + slug, exportedAt: new Date().toISOString(), version: VERSION, ...body }, String(id).startsWith('forecast:')); // the big forecast parts are written compact
            this.log(`[PFR] Exported ${slug}`, 'info');
          } catch (e) { this.log('[PFR] Export failed: ' + ((e && e.message) || e), 'warn'); }
        },
        _pfExportPart(id) {
          const rd = k => { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch (_) { return null; } };
          switch (id) {
            case 'profile': return Object.assign({}, ...['closed', 'charts', 'obs', 'forecast:store', 'pool', 'cross'].map(k => this._pfExportPart(k))); // every importable store
            case 'closed':  return { extremity: rd(EXTREMITY_KEY) || [] };
            case 'charts':  return { ocHistory: this._pfOcCycleHistory || [] };
            case 'obs':     return { sampleStore: this._pfSampleStore || rd(SAMPLE_OBS_KEY) || { obs: [] } };
            case 'forecast': return this._pfFcExport();
            case 'forecast:graded': return this._pfFcExport('graded');
            case 'forecast:readings': return this._pfFcExport('readings');
            case 'forecast:pending': return this._pfFcExport('pending');
            case 'forecast:ranges': return this._pfFcExport('ranges');
            case 'forecast:store': return this._pfFcExport('store'); // the raw store: Profile export / import only
            case 'pool':    return { dialPool: this.pfDialSamplePool || rd(DIAL_POOL_KEY) || {} };
            case 'cross':   return { crossEvents: this._pfCrossRead() };
            case 'score':   return this._pfExportScore();
            case 'liqwatch': return { liqWatch: {
              surveillanceOn: this._pfLiqOn(), wsOpen: !!(LIQ.ws && LIQ.ws.readyState === 1),
              watch: LIQ.watch ? { t0: LIQ.watch.t0, syms: [...LIQ.watch.syms] } : null,
              tally: LIQ.tally || {}, // per ticker: up = liquidated shorts (turnover), dn = liquidated longs, n = events
              closing: LIQ.closing ? { snap: LIQ.closing.snap, syms: [...LIQ.closing.watch.syms] } : null,
              stored: rd(LIQ_KEY) } };
            case 'state':   return { pluginState: rd(PFR_KEY), gcWindow: this.pfGcWindow || [], gcLastStep: this._pfGcLastStep ?? null, ddhStartedAt: this._pfDdhStartedAt ?? null };
            case 'all': {
              const out = {};
              for (const k of ['score', 'profile', 'liqwatch', 'state']) Object.assign(out, this._pfExportPart(k));
              return out;
            }
          }
          throw new Error('unknown export ' + id);
        },
        // Numbers the Score tab shows, plus the window averages they're measured against. Each section is guarded so one failing read can't sink the file.
        _pfExportScore() {
          const safe = fn => { try { return fn(); } catch (e) { return { error: String((e && e.message) || e) }; } };
          const ws = f => { const s = this._pfWindowStats(f); return { n: s.n, avg: s.n ? s.sum / s.n : null }; };
          const fav = this._pfLukewarmFavoredSide();
          const cfg = {};

          if (hc.length >= 10) { const s = hc.slice().sort((x, y) => x - y), at = pr => { const x = pr * (s.length - 1), i = Math.floor(x); return s[i] + (s[Math.min(s.length - 1, i + 1)] - s[i]) * (x - i); }, p10 = at(0.1), p50 = at(0.5), p90 = at(0.9); o.hsp = q(p90 - p10); o.hsk = q((p90 + p10) / 2 - p50); o.hmx = q(s[s.length - 1]); o.hmn = q(s[0]); } // the market's own range this hour: spread, skew, extremes
