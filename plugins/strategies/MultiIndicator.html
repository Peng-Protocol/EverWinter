<!--
  Multi-Indicator Strategy Plugin for PseudoChaser and PseudoWinter (unified)
  Slot-based entry filter. A slot (Auto-generated or manually built) qualifies once a ticker
  exhibits at least micAutoSlotSize (Auto) or all of its own criteria (manual) from the
  secondary criteria set: fund, V/A, IO/L, IO/S, LTA, LPA. No criterion is mandatory.

  One file for both sides. The side is read from the host at load (PseudoWinter defines
  pseudoOpenShort, PseudoChaser pseudoOpenLong) and picks the host-side conventions: the open call and its
  feasibility dry-run, the fund badge, the accent colour and the history key.
  Everything the scoring reads comes from Still-Water (_sw*/sw* names) — there is no AF/PF dependency.

  Auto Slots evaluates every non-excluded secondary criterion against each ticker and keeps
  every one that's true — not sliced down to a fixed count. Manual slots keep the existing
  criteria picker, an exact AND-gate of whatever's selected.

  Substitution considers any held position in the book, not just MI's own, same as
  Liquid-Diver did — score-gated, not automatic.

  Re-entry Block Mode (micReentryBlockMode: 'both' / 'losers') is ported from Liquid-Diver:
  'losers' lets a symbol that just closed in profit re-trigger immediately.

  Entry pool fires once per fresh sample batch (_swOcResultsAt) — will not re-scan
  the same batch twice. MI sets what it will enter (its slot criteria); Still-Water suggests: only tickers the latest batch's Indicator forecast
  covers are considered, ranked by it (er when Regime caution is active, else e). Without Still-Water, MI enters on its criteria alone, ungraded.
  Candidates are refetched before entry when not from the batch. Drawdown throttle and gains lock gate all entries.

  Load via Plugin Manager in either bot's config panel, AFTER Still-Water (and after SunChaser / EverWinter if live).
  targetBot: both
-->
<script>
(function () {
  'use strict';

    const VERSION       = '2.3.1'; // Change: The targets readout shows the time allowance Deferment currently resolves. | previous: Change: Deferment is back, driven by the Still-Water headline: the closer the favored side's share is to 50%, the less time a position (or cond. order) gets, down to a minimum; below 50% everything is closed with reason defer and no entries are made. Relative Target shrinks entry TP, SL, Cascade and Sacrifice by the same headline factor (share vs its recorded peak) instead of the LPA window. Both appear only with Still-Water loaded.
  const DEFAULT_SLOTS = [[]];
  let   WINTER        = false;      // set in transform() from the host; every side switch below reads it
  let   MIC_HIST_KEY  = '__mic_hist_batches'; // Winter keeps its own '__miw_hist_batches' so existing history carries over
  const LS_FRESH      = {};         // sym -> { bl, ts }: forced long-share reads (see _micLsFetch)
  let   LS_MAP        = { key: '', map: {} };
  // Full secondary criteria list — shared by Auto's minimum-gate qualifier, the Exclude-from-
  // Auto picker, so both stay in sync by construction.
  const SECONDARY_CRITS = ['fund','va','iol','ios','lta','lpa'];

  // Megacaps excluded from the population pool alongside BTC — their size skews OC/IO/Volume/liq
  // averages the same way BTC would. cfg.megacapExclude is seeded from this default below but is
  // a plain array on cfg (no picker UI) — edit it directly in saved config if the list needs to
  // change. Shared key name with Still-Water's own seed so either plugin can init it first.
  const DEFAULT_MEGACAP_EXCLUDE = ['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','TRXUSDT','LINKUSDT'];
  // Single source of truth for MI's own scalar config defaults. Merged into cfg once during
  // init() (see below) — call sites read this.cfg.<key> directly, no inline `?? literal`.
  // Excludes: megacapExclude/micSlots (arrays with their own migration
  // logic in init()), and any key actually owned by the Still-Water sibling plugin (those keep
  // their defensive `?? literal` at the cross-read call site since Still-Water owns their default).
  // micReentryBlockMode canonically defaults to 'losers'.
  const MIC_DEFAULT_CFG = Object.freeze({
    micEnabled: true,
    micPicks: 5,                    // Most tickers entered per scan cycle
    micFrThreshold: 0.1,
    micShareCapEnabled: true,
    micShareCapPct: 100,
    micActiveSlot: 0,
    micCascadeEnabled: true,
    micCascadePct: 50,
    micSacrificeEnabled: true,
    micSacrificePct: 50,
    micSubstitutionEnabled: true,
    micSubstitutionMarginPct: 5,
    micSubstitutionMinAgeMins: 60,
    micRelativeTargetEnabled: true, // Relative Target: each new position's entry TP and SL, and the Cascade / Sacrifice %, shrink by the Still-Water headline factor (favorable share vs its recorded peak; 0 at 50%). Needs Still-Water; Cascade or Sacrifice must be on.
    micMinEntryTp: 6,               // Relative Target floor, ROI %: the shrunk entry TP and Cascade / Sacrifice never go below this, so a position can still clear its entry+exit fees
    micDefermentEnabled: true,      // Deferment: the headline factor also scales how long a position or cond. order may live (up to the host's Force Close Runtime); a headline under 50% closes everything (reason defer) and blocks entries. Needs Still-Water.
    micDeferMinMins: 10,            // Deferment: the least time a position or cond. order gets, at a headline of 50%
    micReentryBlockMode: 'losers',
    micAutoSlots: true,
    micAutoSlotSize: 3,
    micAutoSlotExclude: [],
    micForceGeneralCriteria: true,
    micFundStep: 0.0025,
    micVaStep: 1,
    micIolStep: 1,
    micIosStep: 1,
    
    
    // LTA step = % deviation of 1hr turnover from the ticker's own 24h/24 per tier; LPA step =
    // percentage points of 1hr price change above/below the population mean per tier.
    micLtaStep: 10,
    micLpaStep: 0.25,
  });

  // Per-criterion emoji for position badges. Fund emoji is app-relative:
  // Chaser: -fund = shorts paying = good carry for longs (🤑); +fund = bad (💸).
  // Winter: +fund = longs paying = good carry for shorts (🤑); -fund = bad (💸).
  const CRIT_EMOJI = { 'fund': '💰', 'va': '🔊', 'vm': '🔊', 'iol': '🐂', 'ios': '🐻', 'iot': '🎲', 'iom': '🧲', 'lta': '🕐', 'lpa': '💹' };
  const CRIT_DESC  = { 'fund': 'Fund (tiered funding rate)', 'va': 'V/A (volume vs. population sample-window average)', 'vm': 'V/M (vol/mcap ratio) — retired, replaced by V/A', 'iol': 'IO/L (long open interest vs. population sample-window average)', 'ios': 'IO/S (short open interest vs. population sample-window average)', 'iot': 'IO/T (OI vs Turnover) — retired, replaced by IO/L and IO/S', 'iom': 'IO/M (OI vs MCap) — retired, replaced by IO/L and IO/S', 'lta': 'LTA (1hr turnover vs. the ticker\'s own 24h/24 average)', 'lpa': 'LPA (1hr price change vs. every other ticker in the sample window)' };
  // Slots qualify on any N of the 6 secondary criteria (fund, V/A, IO/L, IO/S, LTA, LPA) alone — see _micAutoQualify.

  const critEmoji = c => {
    if (/^fund/.test(c)) { const s = c.slice(4); const num = parseFloat(s.replace(/^[<>]/,'')); const good = (num < 0 || /^-/.test(s)) !== WINTER; return (good ? '🤑' : '💸') + s; }
    if (/^va/.test(c)) return '🔊' + c.slice(2);
    if (/^vm/.test(c)) return '🔊' + c.slice(2);
    // Retired (see VSG.md) — kept resolvable so old scorecard/history entries still render.
    if (/^lsa/.test(c)) return '🟥' + c.slice(3);
    if (/^lba/.test(c)) return '🟩' + c.slice(3);
    if (/^rasl/.test(c)) return '🔴' + c.slice(4);
    if (/^rabl/.test(c)) return '🟢' + c.slice(4);
    if (/^msliq/.test(c)) return '💦' + c.slice(5);
    if (/^mbliq/.test(c)) return '🧊' + c.slice(5);
    if (/^sliq/.test(c)) return '🥵' + c.slice(4);
    if (/^bliq/.test(c)) return '🥶' + c.slice(4);
    if (/^iol/.test(c)) return '🐂' + c.slice(3);
    if (/^ios/.test(c)) return '🐻' + c.slice(3);
    if (/^iot/.test(c)) return '🎲' + c.slice(3);
    if (/^iom/.test(c)) return '🧲' + c.slice(3);
    if (/^ocs/.test(c)) return '🔭' + c.slice(3);
    if (/^ocx/.test(c)) return '📡' + c.slice(3);
    if (/^lta/.test(c)) return '🕐' + c.slice(3);
    if (/^lpa/.test(c)) return '💹' + c.slice(3);
    if (/^liqturnover/.test(c)) return '🌊' + c.slice(11);
    if (/^liqquiet/.test(c)) return '🤫' + c.slice(8);
    if (/^pec/.test(c)) { const m = c.match(/^(pec[a-z]+)/); return (CRIT_EMOJI[m ? m[1] : c] || '') + c.replace(/^pec[a-z]+/, ''); }
    if (/^vsg/.test(c)) { const m = c.match(/^(vsg[a-z]+)/); return (CRIT_EMOJI[m ? m[1] : c] || '') + c.replace(/^vsg[a-z]+/, ''); }
    if (/^regime/.test(c)) { const m = c.match(/^(regime[a-z]+)/); return (CRIT_EMOJI[m ? m[1] : c] || '') + c.replace(/^regime[a-z]+/, ''); }
    return CRIT_EMOJI[c] || '';
  };
  const critLabel = c => {
    const fM = c.match(/^fund([<>])(-?\d+)$/);
    if (fM) return 'Fund ' + fM[1] + fM[2];
    const fA = c.match(/^fund([+-]-?\d*)$/);
    if (fA) return 'Fund t' + fA[1];
    if (c === 'fund') return 'Fund';
    const aM = c.match(/^va([<>])(-?\d+)$/);
    if (aM) return 'V/A ' + aM[1] + aM[2];
    const aA = c.match(/^va([+-]-?\d*)$/);
    if (aA) return 'V/A t' + aA[1];
    if (c === 'va') return 'V/A';
    const vM = c.match(/^vm([<>])(\d+)$/);
    if (vM) return 'V/M ' + vM[1] + vM[2];
    const vA = c.match(/^vm([+-]\d+)$/);
    if (vA) return 'V/M t' + vA[1];
    if (c === 'vm') return 'V/M';
    // Retired (see VSG.md) — kept resolvable so old scorecard/history entries and any
    // not-yet-migrated saved slots still render instead of falling through to the raw tag.
    const kM = c.match(/^(lsa|lba|rasl|rabl)([<>])(\d+)$/);
    if (kM) return kM[1].toUpperCase().replace('RASL','R-ASL').replace('RABL','R-ABL') + ' ' + kM[2] + kM[3];
    const kA = c.match(/^(lsa|lba|rasl|rabl)([+-]\d+)$/);
    if (kA) return kA[1].toUpperCase().replace('RASL','R-ASL').replace('RABL','R-ABL') + ' t' + kA[2];
    if (c === 'lsa') return 'LSA'; if (c === 'lba') return 'LBA';
    if (c === 'rasl') return 'R-ASL'; if (c === 'rabl') return 'R-ABL';
    const m = c.match(/^(m?sliq|m?bliq)([<>])([+-]?\d+)$/);
    if (m) return (m[1] === 'sliq' ? 'S-Liq' : m[1] === 'bliq' ? 'B-Liq' : m[1] === 'msliq' ? 'mS-Liq' : 'mB-Liq') + ' ' + m[2] + m[3];
    const n = c.match(/^(m?sliq|m?bliq)([+-]\d+)$/);
    if (n) return (n[1] === 'sliq' ? 'S-Liq' : n[1] === 'bliq' ? 'B-Liq' : n[1] === 'msliq' ? 'mS-Liq' : 'mB-Liq') + ' ' + n[2];
    if (c === 'sliq') return 'S-Liq'; if (c === 'bliq') return 'B-Liq';
    if (c === 'msliq') return 'mS-Liq'; if (c === 'mbliq') return 'mB-Liq';
    if (c === '0liq') return '0-Liq';
    const ioM = c.match(/^(iol|ios)([<>])(-?\d+)$/);
    if (ioM) return (ioM[1] === 'iol' ? 'IO/L ' : 'IO/S ') + ioM[2] + ioM[3];
    const ioA = c.match(/^(iol|ios)([+-]-?\d*)$/);
    if (ioA) return (ioA[1] === 'iol' ? 'IO/L t' : 'IO/S t') + ioA[2];
    if (c === 'iol') return 'IO/L'; if (c === 'ios') return 'IO/S';
    const o = c.match(/^(iot|iom)([<>])(\d+)$/);
    if (o) return (o[1] === 'iot' ? 'IO/T' : 'IO/M') + ' ' + o[2] + o[3];
    const p = c.match(/^(iot|iom)([+-]\d+)$/);
    if (p) return (p[1] === 'iot' ? 'IO/T' : 'IO/M') + ' t' + p[2];
    if (c === 'iot') return 'IO/T'; if (c === 'iom') return 'IO/M';
    const oc = c.match(/^(ocs|ocx)([<>])(-?\d+)$/);
    if (oc) return oc[1].toUpperCase() + ' ' + oc[2] + oc[3];
    const ocT = c.match(/^(ocs|ocx)([+-]\d+)$/);
    if (ocT) return ocT[1].toUpperCase() + ' t' + ocT[2];
    if (c === 'ocs') return 'OCS'; if (c === 'ocx') return 'OCX';
    const haM = c.match(/^(lta|lpa)([<>])(-?\d+)$/);
    if (haM) return haM[1].toUpperCase() + ' ' + haM[2] + haM[3];
    const haT = c.match(/^(lta|lpa)([+-]-?\d*)$/);
    if (haT) return haT[1].toUpperCase() + ' t' + haT[2];
    if (c === 'lta') return 'LTA'; if (c === 'lpa') return 'LPA';
    const PEC_LABEL = { pecob: 'PEC OB', pecos: 'PEC OS', pecalpha: 'PEC Red Mtn', pecdelta: 'PEC Grn Delta', pecmomup: 'PEC Bull-Mom', pecmomdn: 'PEC Bear-Mom', pecirr: 'PEC Irregular' };
    const pM = c.match(/^(pec[a-z]+)([+-]\d+)$/);
    if (pM && PEC_LABEL[pM[1]]) return PEC_LABEL[pM[1]] + ' t' + pM[2];
    if (PEC_LABEL[c]) return PEC_LABEL[c];
    const VSG_LABEL = { vsgot: 'VSG Over-Traded', vsgut: 'VSG Under-Traded', vsgalpha: 'VSG Mountain', vsgdelta: 'VSG Trough', vsgmomup: 'VSG Mom-Up', vsgmomdn: 'VSG Mom-Dn', vsgirr: 'VSG Irregular' };
    const vsgM = c.match(/^(vsg[a-z]+)([+-]\d+)$/);
    if (vsgM && VSG_LABEL[vsgM[1]]) return VSG_LABEL[vsgM[1]] + ' t' + vsgM[2];
    if (VSG_LABEL[c]) return VSG_LABEL[c];
    const REGIME_LABEL = { regimebull: 'Rg Bull', regimebear: 'Rg Bear' };
    const rgM = c.match(/^(regime[a-z]+)([+-]\d+)$/);
    if (rgM && REGIME_LABEL[rgM[1]]) return REGIME_LABEL[rgM[1]] + ' t' + rgM[2];
    if (REGIME_LABEL[c]) return REGIME_LABEL[c];
    return CRIT_DESC[c] || c;
  };

  window.__BotPlugin = {
    id:        'multiindicator',
    name:      'Multi-Indicator',
    version:   VERSION,
    targetBot: 'both',
    after:     ['sunchaser', 'everwinter', 'still-water'],
    before:    [],
    conflicts: ['liquiddiver-chaser', 'liquiddiver-winter'],
    requires:  ['still-water'],
    touches:   ['init', 'runScan', 'pseudoWatchPositions'],

    css: `
      :root { --mic-rgb:255,150,80; --mic-acc:#ff9650; }
      .mic-hint { font-size:9px; color:var(--text-lo); margin-top:3px; line-height:1.5; }
      .mic-slot { display:inline-flex; flex-direction:column; align-items:center; gap:3px; padding:6px 5px; border-radius:3px; border:1px solid; cursor:pointer; min-width:52px; font-size:9px; font-family:var(--mono); text-align:center; transition:border-color .15s,background .15s; }
      .mic-crit { font-size:8px; padding:1px 4px; border-radius:2px; background:rgba(var(--mic-rgb),.12); border:1px solid rgba(var(--mic-rgb),.3); color:var(--mic-acc); white-space:nowrap; }
      .mic-opt { padding:5px 7px; font-size:9px; font-family:var(--mono); border-radius:2px; border:1px solid; cursor:pointer; background:none; transition:border-color .12s,background .12s,color .12s; }
      .mic-tabs { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:2px; }
      .mic-tab { font-family:var(--mono); font-size:9px; padding:3px 9px; border-radius:2px; border:1px solid; cursor:pointer; background:none; transition:border-color .12s,color .12s,background .12s; letter-spacing:.5px; }
      .mic-tab.on { border-color:rgba(var(--mic-rgb),.6); color:var(--mic-acc); background:rgba(var(--mic-rgb),.08); }
      .mic-tab:not(.on) { border-color:rgba(255,255,255,.15); color:var(--text-lo); }

      .mic-tg { margin-top:8px; padding:8px; background:rgba(255,255,255,.02); border:1px solid rgba(255,255,255,.06); border-radius:3px; }
      .mic-tg-cols { display:flex; align-items:stretch; gap:0; }
      .mic-tg-side { flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:5px; }
      .mic-tg-axis { flex:0 0 1px; background:rgba(255,255,255,.25); margin:0 6px; }
      .mic-tg-hd { font-family:var(--mono); font-size:8px; letter-spacing:1px; color:var(--text-lo); }
      .mic-tg-side.L .mic-tg-hd, .mic-tg-side.L .mic-tg-val { text-align:right; }
      .mic-tg-row { display:flex; flex-direction:column; gap:2px; }
      .mic-tg-bar { position:relative; height:6px; border-radius:1px; background:rgba(255,255,255,.04); display:flex; }
      .mic-tg-side.L .mic-tg-bar { justify-content:flex-end; }
      .mic-tg-bar i { display:block; height:100%; border-radius:1px; transition:width .25s; }
      .mic-tg-bar u { position:absolute; top:-2px; bottom:-2px; width:1px; background:rgba(255,255,255,.55); }
      .mic-tg-val { font-family:var(--mono); font-size:10px; white-space:nowrap; }
      .mic-tg-val small { font-size:8px; opacity:.75; margin-right:3px; letter-spacing:.5px; }
      .mic-tg-val.ok { color:#3ddc84; } .mic-tg-val.bad { color:#ff5a5a; } .mic-tg-val.off { color:var(--text-lo); }
      .mic-tg-bar i.ok { background:rgba(61,220,132,.55); } .mic-tg-bar i.bad { background:rgba(255,90,90,.55); } .mic-tg-bar i.off { background:transparent; }
      .mic-zone { margin-top:8px; padding:8px; background:rgba(255,255,255,.02); border:1px solid rgba(255,255,255,.06); border-radius:3px; }
    `,

    slots: {
      'mode-label-extra': `<span x-show="cfg.micEnabled"> + Multi</span>`,
      'strategy-accordions': `
        <div x-data="{ open: false, tE: false, tX: false, tFe: false }">
          <button class="cfg-acc-hd" @click="open=!open" :class="open?'open':''">
            <div style="display:flex;align-items:center;gap:7px">
              <span x-text="(_micWinter() ? '❄' : '♨') + ' Multi-Indicator'"></span>
              <span x-show="cfg.micEnabled" style="font-size:8px;padding:1px 5px;background:rgba(var(--mic-rgb),.15);border:1px solid rgba(var(--mic-rgb),.35);border-radius:2px;color:var(--mic-acc);letter-spacing:1px">ON</span>
              <span x-show="!cfg.micEnabled" style="font-size:8px;padding:1px 5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:2px;color:var(--text-lo);letter-spacing:1px">OFF</span>
            </div>
            <span class="cfg-acc-arrow" :class="open?'open':''">▶</span>
          </button>
          <div x-show="open" x-transition.opacity class="cfg-acc-body">
            <label class="tog">
              <div class="tog-t" :class="cfg.micEnabled?'on':''" @click.prevent="if(!cfgLocked){cfg.micEnabled=!cfg.micEnabled;persist()}"><div class="tog-k"></div></div>
              <div>
                <div class="tog-l">Multi-Indicator Mode</div>
                <div class="mic-hint" x-text="(_micWinter() ? 'Shorts' : 'Longs') + ' tickers matching any active entry slot; fires once per bulk ticker fetch using host TP/SL settings.'"></div>
              </div>
            </label>
            <div x-show="cfg.micEnabled" style="margin-top:8px">
              <div class="mic-tabs">
                <button class="mic-tab" :class="tE?'on':''" @click="tE=!tE">ENTRY</button>
                <button class="mic-tab" :class="tX?'on':''" @click="tX=!tX">EXIT</button>
                <button class="mic-tab" :class="tFe?'on':''" @click="tFe=!tFe">FETCH</button>
              </div>

              <!-- Entry Zone -->
              <div class="mic-zone" x-show="tE">
                <!-- Entry Slots -->
                <div>
                  <div style="margin-bottom:6px">
                    <div class="lbl" style="margin-bottom:4px">Entry Slots</div>
                    <label class="tog" style="font-size:9px">
                      <div class="tog-t" :class="cfg.micAutoSlots?'on':''" @click="if(!cfgLocked){cfg.micAutoSlots=!cfg.micAutoSlots;persist()}"><div class="tog-k"></div></div>
                      <span class="tog-l">Auto</span>
                    </label>
                  </div>

                  <!-- Auto slots controls -->
                  <div x-show="cfg.micAutoSlots" style="margin-bottom:8px;padding:6px 8px;background:rgba(var(--mic-rgb),.04);border:1px solid rgba(var(--mic-rgb),.12);border-radius:3px">
                    <div class="lbl">Minimum Criteria per Slot <b x-text="cfg.micAutoSlotSize"></b> <span style="font-weight:normal;color:var(--text-lo)" x-text="'— '+(()=>{const n=cfg.micAutoSlotSize;const excl=new Set(cfg.micAutoSlotExclude||[]);const secTotal=['fund','va','iol','ios','lta','lpa'].filter(c=>!excl.has(c)).length;return 'qualifies on any '+n+' of '+secTotal+' secondary criteria — every one true gets scored, not capped at this minimum.'})()"></span></div>
                    <input type="range" min="1" max="6" step="1" x-model.number="cfg.micAutoSlotSize" @change="persist()">
                    <div class="lbl" style="margin-top:5px;margin-bottom:3px">Exclude from Auto</div>
                    <div class="crit-pick" style="display:flex;flex-wrap:wrap;gap:3px">
                      <template x-for="c in ['fund','va','iol','ios','lta','lpa']" :key="c">
                        <button @click.prevent="if(!cfgLocked){ const ex=(cfg.micAutoSlotExclude||[]).slice(); const i=ex.indexOf(c); if(i>=0) ex.splice(i,1); else ex.push(c); cfg.micAutoSlotExclude=ex; persist(); }"
                                :style="'font-family:var(--mono);font-size:8px;padding:1px 5px;border-radius:2px;cursor:pointer;border:1px solid;' + ((cfg.micAutoSlotExclude||[]).includes(c) ? 'border-color:rgba(255,80,80,.5);background:rgba(255,80,80,.15);color:rgba(255,80,80,.8)' : 'border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:var(--text-lo)')"
                                x-text="c.replace('fund','Fund').replace('va','V/A').replace('iol','IO/L').replace('ios','IO/S').replace('lta','LTA').replace('lpa','LPA')">
                        </button>
                      </template>
                    </div>
                    <div class="mic-hint" style="margin-top:4px">Excluded criteria are dropped from auto combos and scoring; every criterion scores per tier, not per slot.</div>
                    <label class="tog" style="margin-top:8px">
                      <div class="tog-t" :class="cfg.micForceGeneralCriteria?'on':''" @click.prevent="if(!cfgLocked){cfg.micForceGeneralCriteria=!cfg.micForceGeneralCriteria;persist()}"><div class="tog-k"></div></div>
                      <div>
                        <div class="tog-l">Force-Evaluate General Criteria</div>
                        <div class="mic-hint">Forces a fresh per-symbol Fund/LTA/LPA check before each entry, appending newly-true ones (a few extra requests).</div>
                      </div>
                    </label>
                  </div>

                  <!-- Picks per scan -->
                  <div style="margin-bottom:8px">
