      try {
        const rs = document.documentElement.style;
        rs.setProperty('--mic-rgb', WINTER ? '96,210,255' : '255,150,80');
        rs.setProperty('--mic-acc', WINTER ? 'var(--ice)' : '#ff9650');
      } catch (_) {}
      const _origInit  = def.init;
      const _origScan  = def.runScan;
      const _origWatch = def.pseudoWatchPositions;

      const _hostStages = Array.isArray(def._scanStageDefs); // host has the cooperative scan scheduler
      return Object.assign({}, def, {

        micCollapsedSlotRanks: {},

        // Side of the host this copy is running on; templates and scoring read it through this.
        _micWinter() { return WINTER; },

        // Long share of accounts (0-1) for a ticker, from what Still-Water already holds: a read forced by
        // _micLsFetch, else the current batch's record, else the latest stored reading in the sample window.
        // Still-Water has no _swLsShare, so without this IO/L and IO/S would never get a tier.
        _micLsShare(t) {
          const sym = t && t.symbol; if (!sym) return null;
          const ok = b => (b > 0 && b < 1) ? b : null;
          const f = LS_FRESH[sym];
          if (f && Date.now() - f.ts < 600000) return f.bl;
          const cur = ok(Number(this.swOcResults?.[sym]?.bl));
          if (cur != null) return cur;
          const hist = this._swOcCycleHistory || [];
          const key = (this._swOcResultsAt || 0) + ':' + hist.length;
          if (LS_MAP.key !== key) {
            const map = {}, at = {};
            for (const cy of hist) {
              if (!cy || !Array.isArray(cy.results)) continue;
              for (const r of cy.results) {
                const b = ok(Number(r && r.bl));
                if (r && typeof r.sym === 'string' && b != null && (at[r.sym] == null || cy.ts >= at[r.sym])) { map[r.sym] = b; at[r.sym] = cy.ts; }
              }
            }
            LS_MAP = { key, map };
          }
          return LS_MAP.map[sym] ?? null;
        },
        // One forced long-share read for a symbol (Force-Evaluate top-up), kept 10 minutes.
        async _micLsFetch(sym) {
          try {
            const bl = await this._swLsRatio?.(sym);
            if (bl > 0 && bl < 1) {
              const now = Date.now();
              for (const k of Object.keys(LS_FRESH)) if (now - LS_FRESH[k].ts > 600000) delete LS_FRESH[k];
              LS_FRESH[sym] = { bl, ts: now };
            }
          } catch (_) {}
        },

        // Winter installs saved this plugin as MultiIndicator-Winter (miw* config, _miw* position tags). Move them
        // to the mic* names once; never overwrites a mic* value that already exists.
        _micMigrateFromMiw() {
          let moved = 0;
          for (const k of Object.keys(this.cfg || {})) {
            if (!/^miw[A-Z]/.test(k)) continue;
            const nk = 'mic' + k.slice(3);
            if (this.cfg[nk] === undefined) this.cfg[nk] = this.cfg[k];
            delete this.cfg[k]; moved++;
          }
          for (const p of (this.positions || [])) {
            if (!p || typeof p !== 'object') continue;
            for (const k of Object.keys(p)) {
              if (!/^_miw/.test(k)) continue;
              const nk = '_mic' + k.slice(4);
              if (p[nk] === undefined) p[nk] = p[k];
              delete p[k]; moved++;
            }
          }
          if (moved) { this.persist?.(); this.log(`[MI] Moved ${moved} saved Winter (miw*) name(s) to mic*`, 'info'); }
        },
        _micLastSampledAt: 0,
        _micHaltLogged: false,

        async init() {
          await _origInit.call(this);
          this._micLoaded = true;
          if (WINTER) this._micMigrateFromMiw();
          if (!this.micCollapsedSlotRanks) this.micCollapsedSlotRanks = {};
          if (!this.micCollapsedCritStats) this.micCollapsedCritStats = {};
          if (!Array.isArray(this.cfg.micSlots)) this.cfg.micSlots = DEFAULT_SLOTS.map(s => [...s]);
          // V/M, IO/T, IO/M retired in favor of population-relative V/A, IO/L and IO/S (see
          // _swVolIoWindowAvg) — no mcap fetch machinery to init anymore. One-time cleanup of
          // saved config: strip the retired keys from the exclude list.
          if (Array.isArray(this.cfg.micAutoSlotExclude) && this.cfg.micAutoSlotExclude.some(c => c==='vm'||c==='iot'||c==='iom')) {
            this.cfg.micAutoSlotExclude = this.cfg.micAutoSlotExclude.filter(c => c!=='vm'&&c!=='iot'&&c!=='iom');
          }
          if (!Array.isArray(this.cfg.megacapExclude)) this.cfg.megacapExclude = [...DEFAULT_MEGACAP_EXCLUDE];
          // Single source of truth for all other MI scalar defaults — see MIC_DEFAULT_CFG above.
          // Call sites read this.cfg.<key> directly with no inline fallback, since this
          // guarantees every key below is present after init runs once.
          // Target Halving was replaced by Relative Target: carry the old on/off choice across once.
          if (this.cfg.micTargetHalvingEnabled !== undefined) {
            if (this.cfg.micRelativeTargetEnabled === undefined) this.cfg.micRelativeTargetEnabled = !!this.cfg.micTargetHalvingEnabled;
            delete this.cfg.micTargetHalvingEnabled;
          }
          for (const [k, v] of Object.entries(MIC_DEFAULT_CFG)) {
            if (this.cfg[k] === undefined) this.cfg[k] = Array.isArray(v) ? [...v] : v;
          }
          
          // Fund tier step 0.25% -> 0.0025% (100x finer). Saved thresholded fund gates
          // (fund>N / fund<N) were written in old 0.25% tiers, so rescale them x100 once to keep the
          // same physical threshold, then move the step. Flag-guarded; legacy bare +fund/-fund are
          // untouched here (the legacy block below converts them using the NEW step directly).
          if (!this.cfg.micFundStepMigrated) {
            if (Number(this.cfg.micFundStep) === 0.25) {
              const _rs = c => { const m = typeof c === 'string' && c.match(/^fund([<>])(-?\d+)$/); return m ? `fund${m[1]}${parseInt(m[2],10) * 100}` : c; };
              if (Array.isArray(this.cfg.micSlots)) this.cfg.micSlots = this.cfg.micSlots.map(sl => Array.isArray(sl) ? sl.map(_rs) : sl);
              if (Array.isArray(this.cfg.micAutoSlotExclude)) this.cfg.micAutoSlotExclude = this.cfg.micAutoSlotExclude.map(_rs);
              this.cfg.micFundStep = 0.0025;
            }
            this.cfg.micFundStepMigrated = true;
            this.persist();
          }
          // Legacy migration: convert old +fund/-fund/>10pct/<10pct/bare lsa/lba/rasl/rabl to tiered form
          {
            const _fundStep   = this.cfg.micFundStep;
            const _frThr      = this.cfg.micFrThreshold;
            const _frTier     = Math.max(1, Math.ceil(_frThr / _fundStep));
            const _migCrit = c => {
              if (c === '+fund')   return `fund>${_frTier}`;
              if (c === '-fund')   return `fund<-${_frTier}`;
              return c;
            };
            const _legacyNames = new Set(['+fund','-fund']);
            if (Array.isArray(this.cfg.micSlots) && this.cfg.micSlots.some(s => s.some(c => _legacyNames.has(c)))) {
              this.cfg.micSlots = this.cfg.micSlots.map(s => s.map(_migCrit));
              this.persist();
            }
            if (Array.isArray(this.cfg.micAutoSlotExclude) && this.cfg.micAutoSlotExclude.some(c => _legacyNames.has(c))) {
              this.cfg.micAutoSlotExclude = this.cfg.micAutoSlotExclude.map(_migCrit);
              this.persist();
            }
          }
          // V/M, IO/T, IO/M, and every retired liquidation/PEC/VSG/regime tag no longer match
          // anything (see the migration above) — a manual slot still
          // referencing one will never qualify. Not auto-rewritten (va/iol/ios isn't a 1:1 semantic
          // substitution), just flagged once so it doesn't silently go dead.
          {
            const _retiredIn = s => s.filter(c => /^(vm|iot|iom|ioa|ocs|ocx|pec|vsg|regime|liqturnover|liqquiet|sliq|bliq|msliq|mbliq|0liq|past1)/.test(c));
            const _retiredSlots = (this.cfg.micSlots || []).map((s,i) => ({ i, crits: _retiredIn(s) })).filter(x => x.crits.length);
            if (_retiredSlots.length) this.log(`[MI] ⚠️ ${_retiredSlots.length} manual slot(s) reference retired criteria and will never match — slot(s) ${_retiredSlots.map(x=>x.i+1).join(', ')}. Replace with fund / V/A / IO/L / IO/S / LTA / LPA.`, 'warn');
          }
          this.registerRoleBadge?.(item => {
            if (!item || !item._mic) return null;
            const crits  = item._micCriteria || [];
            const emoji  = crits.map(c => critEmoji(c)).join('');
            const title  = crits.length ? 'Multi: ' + crits.map(c => critLabel(c)).join(' + ') : 'Multi-Indicator';
            return `<span style="font-family:var(--mono);font-size:9px;padding:2px 5px;border-radius:2px;letter-spacing:1px;border:1px solid rgba(var(--mic-rgb),.45);color:var(--mic-acc);background:rgba(var(--mic-rgb),.10)" title="${title}">${emoji || 'Multi'}</span>`;
          });
          this.registerCloseReason?.('substitution', 'Sub');
          this.registerCloseReason?.('ejection', 'Eject');
          this.registerCloseReason?.('defer', 'Defer');
          this.registerCloseReason?.('timing', 'Time');
          if (_sideAmbiguous) this.log('[MI] ⚠️ Could not tell the host side (pseudoOpenShort/pseudoOpenLong both or neither present) — running as Chaser.', 'warn');
          this.log(`[MI] Multi-Indicator (${WINTER ? 'Winter' : 'Chaser'}) v${VERSION} loaded — ${this.cfg.micEnabled ? 'enabled' : 'disabled'} | ${(this.cfg.micSlots||[]).length} slots | ${this.cfg.micPicks}/cycle`, 'info');
          this.renderTradeFeed?.();
        },

        // Cascade/Sacrifice run on the position watcher (5s, tied to bot.running) rather than
        // the scan clock (5-60min) — collective uPnL can cross either threshold and back well
        // within a single scan interval, and a private setInterval here would keep firing even
        // while the bot is stopped since it isn't tied to the start/stop lifecycle like this is.
        async pseudoWatchPositions() {
          await _origWatch.call(this);
          await this._micCheckCascade();
          await this._micCheckSacrifice();
        },

        _micToggle(i, c) {
          const slots = (this.cfg.micSlots || []).map(s => [...s]);
          if (!slots[i]) return;
          const idx = slots[i].indexOf(c);
          if (idx === -1) slots[i].push(c); else slots[i].splice(idx, 1);
          this.cfg.micSlots = slots;
          this.persist?.();
        },

        _micDelSlot(i) {
          const slots = (this.cfg.micSlots || []).map(s => [...s]);
          slots.splice(i, 1);
          this.cfg.micSlots = slots;
          if (this.cfg.micActiveSlot !== null) {
            if (slots.length === 0) this.cfg.micActiveSlot = null;
            else if (this.cfg.micActiveSlot >= slots.length) this.cfg.micActiveSlot = slots.length - 1;
          }
          this.persist?.();
        },

        _micAddSlot() {
          const slots = (this.cfg.micSlots || []).map(s => [...s]);
          slots.push([]);
          this.cfg.micSlots = slots;
          this.cfg.micActiveSlot = slots.length - 1;
          this.persist?.();
        },

        // Collective uPnL and the resulting bail set both cover every open position, not just
        // MI's own — a winning position from another strategy should be able to push the
        // portfolio into Cascade the same as a winning MI position would, and a Sacrifice
        // shouldn't leave an untouched, unrelated position dominating the aggregate afterward.
        async _micCheckCascade() {
          if (!this.cfg.micCascadeEnabled) return;
          const allPositions = this.positions || [];
          if (!allPositions.length) return;
          const totalUPnL   = allPositions.reduce((s, p) => s + (p.upnl || 0), 0);
          const baseMargin  = (this.cfg.minNotional || 6) / (this.cfg.leverage || 6);
          const _pct        = this._micEffCascadePct();
          const threshold   = baseMargin * (_pct / 100);
          if (totalUPnL >= threshold) {
            this.log(`[MI] 🌊 Cascade triggered — collective uPnL +${totalUPnL.toFixed(4)} ≥ ${threshold.toFixed(4)} USDT (${_pct.toFixed(1)}% of ${baseMargin.toFixed(4)} base margin) — bailing ${allPositions.length} position(s)`, 'info');
            if (this.cfg.ashfallCrossEnabled && typeof this._swCrossWrite === 'function') {
              this._swCrossWrite('cascade', null, { count: allPositions.length, pnl: totalUPnL });
            }
            this._logBatchBegin?.();
            try {
              // Concurrent: a live close waits on its exchange fill (reprice/retry loop), so closing one by
              // one stacked those waits end to end. Local bookkeeping per close is unchanged.
              await Promise.all([...allPositions].map(async pos => {
                try { await this.pseudoClosePosition(pos, 'cascade'); }
                catch (e) { this.log(`[MI] 🌊 Cascade close error (${pos.symbol}): ${e.message}`, 'warn'); }
              }));
            } finally { this._logBatchEnd?.('[MI] 🌊 Cascade roll-up'); }
          }
        },

        async _micCheckSacrifice() {
          if (!this.cfg.micSacrificeEnabled) return;
          const allPositions = this.positions || [];
          if (!allPositions.length) return;
          const totalUPnL   = allPositions.reduce((s, p) => s + (p.upnl || 0), 0);
          const baseMargin  = (this.cfg.minNotional || 6) / (this.cfg.leverage || 6);
          const _pct        = this._micEffSacrificePct();
          const threshold   = -(baseMargin * (_pct / 100));
          if (totalUPnL <= threshold) {
            this.log(`[MI] 🩸 Sacrifice triggered — collective uPnL ${totalUPnL.toFixed(4)} ≤ ${threshold.toFixed(4)} USDT (${_pct.toFixed(1)}% of ${baseMargin.toFixed(4)} base margin) — bailing ${allPositions.length} position(s)`, 'info');
            if (this.cfg.ashfallCrossEnabled && typeof this._swCrossWrite === 'function') {
              this._swCrossWrite('sacrifice', null, { count: allPositions.length, pnl: totalUPnL });
            }
            this._logBatchBegin?.();
            try {
              // Concurrent: a live close waits on its exchange fill (reprice/retry loop), so closing one by
              // one stacked those waits end to end. Local bookkeeping per close is unchanged.
              await Promise.all([...allPositions].map(async pos => {
                try { await this.pseudoClosePosition(pos, 'sacrifice'); }
                catch (e) { this.log(`[MI] 🩸 Sacrifice close error (${pos.symbol}): ${e.message}`, 'warn'); }
              }));
            } finally { this._logBatchEnd?.('[MI] 🩸 Sacrifice roll-up'); }
          }
        },

        // Which host variant runs is decided by the side detected at load (see transform).
        async _micCandidateOpenFeasible(sym, price) { return WINTER ? this._micFeasibleShort(sym, price) : this._micFeasibleLong(sym, price); },

        // Dry-run of pseudoOpenShort's tick-precision/notional/TP/SL/leverage checks, without
        // its logging/ban-list side effects beyond resolveEffectiveLeverage's own (that one bans
        // for real on maxLeverage ≤ 5×, same as a live open would — leaving that in place is
        // correct, since a candidate that would get permanently banned anyway should never cost
        // us the position we were about to swap out of). Substitution calls this before closing
        // anything. Kept local to MI rather than touching PseudoWinter's open path — mirrors the
        // SHORT-side validation block there and must be kept in sync with it if that logic ever
        // changes.
        async _micFeasibleShort(sym, price) {
          if (!sym || !(price > 0)) return false;
          const instr = await this.getInstrInfo(sym);
          if (!instr) return false;
          if (instr.minPrice > 0 && price < instr.minPrice) return false;
          const levResult = this.resolveEffectiveLeverage(sym, instr);
          if (!levResult) return false;
          const lev  = levResult.lev;
          const binary  = this.cfg.binaryModeEnabled;
          const effTp0  = binary ? this.cfg.binaryTpPct : this.cfg.entryTpRoi;
          const notional = this.cfg.minNotional;
          const qty = this.snapQty(notional / price, instr);
          if (qty <= 0) return false;
          const actualNotional = qty * price;
          if (instr.minOrderAmt > 0 && actualNotional < instr.minOrderAmt) return false;
          const tpPrice = this.snapPrice(price * (1 - (effTp0 / 100) / lev), instr); // SHORT: TP below entry
          if (!tpPrice || tpPrice <= 0) return false;
          if (binary) return true;
          const effAddNotional = this.cfg.addNotional;
          const effTpRoi       = [effTp0, this._tpRoi(1)];
          let runNotional = price * qty;
          let runSize     = qty;
          const addPcts = this._activeAddPcts();
          for (let i = 0; i < this._dcaStageCount(); i++) {
            const addPrice = this.snapPrice(price * (1 + addPcts[i] / 100), instr); // SHORT: add above entry
            if (!addPrice || addPrice <= 0) return false;
            const addQty = this.snapQty(effAddNotional / addPrice, instr);
            runNotional += addPrice * addQty;
            runSize     += addQty;
            const expectedAvg = runSize > 0 ? runNotional / runSize : addPrice;
            const addTp = this.snapPrice(expectedAvg * (1 - (effTpRoi[i+1] / 100) / lev), instr);
            if (!addTp || addTp <= 0) return false;
          }
          return true;
        },

        // Dry-run (Chaser variant) of pseudoOpenLong's tick-precision/notional/SL checks, without any of its
        // side effects (no ban, no log, no order placement) — just answers "would this candidate
        // actually be openable right now". Substitution calls this before closing anything, so a
        // candidate that would fail those checks (e.g. SL snaps to zero at this price/leverage)
        // never costs us the position we were about to swap out of. Kept local to MI rather than
        // touching PseudoChaser's open path — see the SL/DCA validation block in pseudoOpenLong,
        // which this mirrors and must be kept in sync with if that logic ever changes.
        async _micFeasibleLong(sym, price) {
          if (!sym || !(price > 0)) return false;
          const instr = await this.getInstrInfo(sym);
          if (!instr) return false;
          if (instr.minPrice > 0 && price < instr.minPrice) return false;
          const lev       = this.cfg.leverage;
          const notional   = this.cfg.minNotional;
          const entryQty   = this.snapQty(notional / price, instr);
          if (entryQty <= 0) return false;
          const entryNotional = entryQty * price;
          if (instr.minOrderAmt > 0 && entryNotional < instr.minOrderAmt) return false;
          if (this._binaryMode()) {
            const bSlPct  = this.cfg.binarySlPct;
            const slPrice = this.snapPrice(price * (1 - bSlPct / 100 / lev), instr);
            if (!slPrice || slPrice <= 0) return false;
            return true;
          }
          const addPcts     = this._activeAddPcts();
          const addNotional = this.cfg.addNotional || notional;
          const stages      = Math.min(this.cfg.dcaStages || 1, addPcts.length);
          let runNotional = price * entryQty;
          let runSize     = entryQty;
          let prevPrice   = price;
          for (let i = 0; i < stages; i++) {
            const addPrice = this.snapPrice(price * (1 - addPcts[i] / 100), instr);
            if (!addPrice || addPrice <= 0 || addPrice >= prevPrice) return false;
            const addQty = this.snapQty(addNotional / addPrice, instr);
            if (addQty <= 0) { prevPrice = addPrice; continue; }
            runNotional += addPrice * addQty;
            runSize     += addQty;
            const expectedAvg = runNotional / runSize;
            const stageTpRoi  = this._tpRoi(i + 1);
            const stageTp     = this.snapPrice(expectedAvg * (1 + stageTpRoi / 100 / lev), instr);
            if (!stageTp || stageTp <= 0) return false;
            prevPrice = addPrice;
          }
          return true;
        },

        // compositeScore is the forecast score (pp in this bot's favor): a candidate must beat the worst held position's score by the margin.
        // No path restriction on what it can close — cross-strategy, any held position, same as
        // Liquid-Diver's version. The swap is still score-gated, not automatic.
        async _micTrySubstitute(pool, ctx) {
          if (this._micDefermentState().deferring) return false;
          if (!this.cfg.micSubstitutionEnabled || !pool?.length) return false;
          const now           = Date.now();
          const minAgeMs       = (this.cfg.micSubstitutionMinAgeMins) * 60000;
          const baseMargin     = (this.cfg.minNotional || 6) / (this.cfg.leverage || 6);
          const marginThreshold = baseMargin * ((this.cfg.micSubstitutionMarginPct) / 100);

          const eligible = (this.positions || []).filter(p => {
            if ((now - (p.openedAt || 0)) < minAgeMs) return false;
            return true;
          });
          if (!eligible.length) return false;

          // The worst held position by its score now (see _micLiveCompositeScore), same scale as the candidate's.
          // Each held position's latest score is recorded on it, so the log and the next comparison start from it.
          const scoreOf = p => { if (!p._mic) return -Infinity; const v = this._micLiveCompositeScore(p); if (isFinite(v)) p._micCompositeScore = v; return v; };
          eligible.sort((a, b) => scoreOf(a) - scoreOf(b));
          const worst      = eligible[0];
          const worstScore = scoreOf(worst);
          // Pre-flight the Force-Evaluate top-up that _micOpen runs, before anything is closed.
          let best = null;
          for (const cand0 of pool) {
            if ((cand0.compositeScore - worstScore) < marginThreshold) break;
            // Ranked on stored readings, so refetch and rescore before this candidate can displace a held position.
            let cand = cand0;
            if (ctx) {
              cand = await this._micVerify(cand0, ctx);
              if (cand === false) break;
              if (!cand || (cand.compositeScore - worstScore) < marginThreshold) continue;
            }
            if (this.cfg.micForceGeneralCriteria && this.cfg.micAutoSlots) {
              const full = await this._micTopUpGeneralCriteria(cand.t, cand.criteria);
              best = { ...cand, criteria: full };
            } else best = cand;
            break;
          }
          if (!best) return false;
          const _candPrice = parseFloat(best.t.lastPrice || 0);
          if (!(await this._micCandidateOpenFeasible(best.t.symbol, _candPrice))) {
            this.log(`[MI] 🔁 Substitution skipped — ${best.t.symbol} would fail open-time checks (tick precision/notional) at ${_candPrice} — leaving ${worst.symbol} in place`, 'warn');
            return false;
          }

          this.log(`[MI] 🔁 Substitution — closing ${worst.symbol} (score ${worstScore === -Infinity ? 'n/a' : worstScore.toFixed(4)}) for ${best.t.symbol} (score ${best.compositeScore.toFixed(4)}), Δ${(best.compositeScore - worstScore).toFixed(4)} ≥ ${marginThreshold.toFixed(4)} margin`, 'info');
          await this.pseudoClosePosition(worst, 'substitution');
          return await this._micOpen(best.t, best.criteria, best.slotIdx, best.compositeScore);
        },

        _extraStatusPills() {
          const d = this._micDefermentState();
          if (!d.deferring) return [];
          return [{
            pip:        'warn',
            pipStyle:   'background:rgba(255,160,0,.9)',
            label:      'No Entry',
            labelStyle: 'color:rgba(255,160,0,.9)',
            border:     'border-color:rgba(255,160,0,.45);background:rgba(255,160,0,.06)',
            title:      `MI deferment — new entries blocked (headline ${(d.share * 100).toFixed(1)}% is under 50%)`,
            action:     null,
          }];
        },

        // Still-Water headline: the favored side's favorable share of the raw 1hr move (50% = even). The factor is its signed
        // form against the best one recorded (0 at 50%, 1 at the peak) — Relative Target and Deferment's timing both scale by it.
        // Null when Still-Water isn't loaded or the headline has too few samples; callers then use the static settings.
        _micSwLoaded() {
          return typeof this._swSampleWeather === 'function' && (this._pluginList || []).some(p => p.id === 'still-water');
        },
        _micHeadline() {
          if (!this._micSwLoaded()) return null;
          const w = this._swSampleWeather(this._swLukewarmFavoredSide?.() || 'extreme');
          if (!w || w.s == null || w.share == null) return null;
          const hi = w.sHi > 0 ? w.sHi : null;
          return { share: w.share, s: w.s, peak: hi == null ? null : (1 + hi) / 2, f: w.s <= 0 ? 0 : (hi ? Math.min(1, w.s / hi) : 1), n: w.n };
        },
        // Relative Target — the entry TP, SL, Cascade and Sacrifice % shrink by the headline factor. Price move % x leverage = ROI %,
        // the unit the host's TP / SL use. Returns the configured targets untouched (active:false) when Relative Target is off,
        // neither Cascade nor Sacrifice is on, or there is no headline.
        _micTargets() {
          const c = this.cfg;
          const baseTp = Number(c.binaryModeEnabled ? (c.binaryTpPct ?? 18) : c.entryTpRoi) || 18;
          const baseSl = Number(c.binaryModeEnabled ? (c.binarySlPct ?? 18) : (c.dcaSlPct ?? 16)) || 18;
          const out = { active: false, slPct: null, entryTp: baseTp, cascadePct: c.micCascadePct, sacrificePct: c.micSacrificePct, minTp: Math.max(0, Number(c.micMinEntryTp) || 0), h: null, lev: Number(c.leverage) || 6 };
          if (!c.micRelativeTargetEnabled || !(c.micCascadeEnabled || c.micSacrificeEnabled)) return out;
          const h = this._micHeadline();
          if (!h) return out;
          out.active = true; out.h = h;
          out.entryTp = Math.max(out.minTp, baseTp * h.f);
          out.slPct = Math.max(1, baseSl * h.f); // SL never under 1%
          out.cascadePct = c.micCascadePct * h.f; out.sacrificePct = c.micSacrificePct * h.f;
          return out;
        },
        // What Cascade / Sacrifice actually fire at: the resolved value, but never below the Min Entry TP floor (and never
        // under 1%) — a target at ~0 would bail everything on the first non-negative / slightly negative tick.
        _micEffCascadePct() { const t = this._micTargets(); return t.active ? Math.max(t.minTp, 1, t.cascadePct) : this.cfg.micCascadePct; },
        _micEffSacrificePct() { const t = this._micTargets(); return t.active ? Math.max(t.minTp, 1, t.sacrificePct) : this.cfg.micSacrificePct; },
        // One-line readout for the Exit tab.
        _micTargetsText() {
          if (!this.cfg.micRelativeTargetEnabled || !(this.cfg.micCascadeEnabled || this.cfg.micSacrificeEnabled)) return '';
          const t = this._micTargets();
          if (!t.active) return 'Waiting for the Still-Water headline — needs enough samples.';
          return `Now: headline ${(t.h.share * 100).toFixed(1)}% · factor ×${t.h.f.toFixed(2)} · entry TP ${t.entryTp.toFixed(1)}% · SL ${t.slPct.toFixed(1)}% · cascade ${this._micEffCascadePct().toFixed(1)}% · sacrifice ${this._micEffSacrificePct().toFixed(1)}%`;
        },

        // One ticker's rank score: pp in this bot's favor, from the batch's Indicator forecast. Null = no forecast.
        _micRankScore(t, fcRank) {
          const s = fcRank && fcRank.get(t.symbol);
          return s == null ? null : { v: s, fc: true };
        },
        // Structured readout for the Multi-Indicator body: left = SL + Sacrifice, right = TP + Cascade, each green when viable, red when not.
        // Viable: the resolved value is at or above the Min Entry TP floor (green), under it = red. Cascade / Sacrifice colour on the resolved value; the text shows what actually fires (never under the floor) and they get no bar.
        _micTargetsView() {
          const c = this.cfg, t = this._micTargets();
          const rtOn = !!c.micRelativeTargetEnabled && !!(c.micCascadeEnabled || c.micSacrificeEnabled);
          const waiting = rtOn && !t.active;
          const f = v => (v == null || !isFinite(v)) ? '--' : v.toFixed(1) + '%';
          const floor = t.minTp, hostSl = Number(c.binarySlPct ?? 18) || 18;
          const tp = t.entryTp, sl = t.active ? t.slPct : hostSl;
          const casOn = !!c.micCascadeEnabled, sacOn = !!c.micSacrificeEnabled;
          const cas = casOn ? this._micEffCascadePct() : null, sac = sacOn ? this._micEffSacrificePct() : null;
          const casRaw = t.active ? t.cascadePct : c.micCascadePct;
          const scale = Math.max(1, tp, sl, cas || 0, sac || 0, floor) * 1.1;
          const w = v => v == null ? 0 : Math.max(2, Math.min(100, v / scale * 100));
          const fl = rtOn ? +(floor / scale * 100).toFixed(1) : null;
          const row = (k, v, ok, off, tip, fl2, nb) => ({ k, nb: !!nb, txt: off ? 'off' : f(v), w: (off || nb) ? 0 : +w(v).toFixed(1), c: off ? 'off' : (waiting ? 'off' : (ok ? 'ok' : 'bad')), tip, fl: fl2 ?? null });
          const tpOk = tp >= floor, casOk = casOn && casRaw >= floor;
          const sacRaw = t.active ? t.sacrificePct : c.micSacrificePct;
          const slOk = sl >= floor, sacOk = sacOn && sacRaw >= floor;
          let note;
          if (waiting) note = 'Waiting for the Still-Water headline — needs enough samples.';
          else if (t.active) note = `headline ${(t.h.share * 100).toFixed(1)}%${t.h.peak != null ? ` (peak ${(t.h.peak * 100).toFixed(1)}%)` : ''} · factor ×${t.h.f.toFixed(2)}`;
          else note = 'Static targets (Relative Target off).';
          const dd = this._micDefermentState(), al = this._micAllowedMs();
          const dur = ms => { const m = Math.round(ms / 60000); return m < 60 ? m + 'm' : (m % 60 ? Math.floor(m / 60) + 'h ' + (m % 60) + 'm' : m / 60 + 'h'); };
          const time = dd.deferring ? 'Time allowed: none — deferring' : al == null ? '' : 'Time allowed: ' + dur(al);
          return {
            time,
            left:  [row('SL', sl, slOk, false, 'Entry stop-loss, ROI %. Red when under the Min Entry TP floor.'), row('SACRIFICE', sac, sacOk, !sacOn, 'Collective bail-out on loss. Fires at the floor at minimum; red when the resolved value is under it.', null, true)],
            right: [row('TP', tp, tpOk, false, 'Entry take-profit, ROI %. Never shrinks below the Min Entry TP floor.', fl), row('CASCADE', cas, casOk, !casOn, 'Collective bail-out on profit. Fires at the floor at minimum; red when the resolved value is under it.', null, true)],
            note
          };
        },

        // Deferment: while the headline's favorable share is under 50%, no new entries and everything held is closed (see _micEnforceTiming).
        _micDefermentState() {
          const off = { deferring: false };
          if (!this.cfg.micDefermentEnabled) return off;
          const h = this._micHeadline();
          return (h && h.s < 0) ? { deferring: true, share: h.share } : off;
        },
        // How long a position or cond. order may live right now: the host's Force Close Runtime x the headline factor, never under
        // Min Time (nor over the runtime). Null = no cap (Deferment off, or no headline).
        _micAllowedMs() {
          if (!this.cfg.micDefermentEnabled) return null;
          const h = this._micHeadline();
          if (!h) return null;
          const base = (Number(this.cfg.runtimeHours) || 12) * 3600000;
          const min  = Math.max(1, Number(this.cfg.micDeferMinMins) || 10) * 60000;
          return Math.min(base, Math.max(min, base * h.f));
        },
        // Every scan: while deferring, close every held position (any plugin's) with reason defer and cancel every cond. order;
        // otherwise close whatever has outlived its allowed time with reason timing. Closes run concurrently, like Cascade/Sacrifice.
        async _micEnforceTiming(def) {
          const allowed = def.deferring ? 0 : this._micAllowedMs();
          if (allowed == null) return;
          const now = Date.now(), reason = def.deferring ? 'defer' : 'timing';
          const pos  = (this.positions  || []).filter(p => !p.isPending && (def.deferring || now - (p.openedAt  || 0) >= allowed));
          const cond = (this.condOrders || []).filter(o =>                  (def.deferring || now - (o.createdAt || 0) >= allowed));
          if (!pos.length && !cond.length) return;
          this.log(`[MI] ${def.deferring ? '⏏️ Deferment' : '⏱️ Timing'} — closing ${pos.length} position${pos.length === 1 ? '' : 's'}${cond.length ? ` and cancelling ${cond.length} cond. order${cond.length === 1 ? '' : 's'}` : ''} (${def.deferring ? `headline ${(def.share * 100).toFixed(1)}% under 50%` : `over the ${Math.round(allowed / 60000)}m allowed`})`, 'warn');
          await Promise.all([
            ...pos.map(async p => { try { await this.pseudoClosePosition(p, reason); } catch (e) { this.log(`[MI] ${reason} close error (${p.symbol}): ${e.message}`, 'warn'); } }),
            ...cond.map(async o => { try { await this.cancelCondOrder(o.id, reason); } catch (e) { this.log(`[MI] ${reason} cond. cancel error (${o.symbol}): ${e.message}`, 'warn'); } }),
          ]);
        },

        // Ejection: bail-all — closes every open position (any held position, same reach as substitution) as soon as
        // two or more deferment paths are in effect at once. Called once per scan.
        async _micEject(def) {
          const cands = (this.positions || []).filter(p => !p.isPending);
          if (!cands.length) return;
          this.log(`[MI] ⏏️ Ejection — ${def.why.length} deferment paths in effect (${def.why.join(' + ')}); closing all ${cands.length} position${cands.length === 1 ? '' : 's'}`, 'warn');
          // Concurrent — see Cascade/Sacrifice: sequential live closes stacked their fill waits.
          await Promise.all(cands.map(async p => {
            try { await this.pseudoClosePosition(p, 'ejection'); }
            catch (e) { this.log(`[MI] ⏏️ Ejection error (${p.symbol}): ${e.message}`, 'warn'); }
          }));
        },


        // ── Scan stages (MI) ────────────────────────────────────────────────────
        // Stages hand data forward on ctx.mic; a stage returning false ends the mic group for this scan.
        // Registered with the host's scan pipeline from the bottom of transform(); on a host without
        // the pipeline _micRunScan below runs them back to back from the runScan wrap.
        async _micScanPrep(ctx) {
          if (!this.cfg.micEnabled) return false;
          const _micHalted = !!(this._isDrawdownHalted?.() || this._isGainsLocked?.());
          if (_micHalted) {
            if (!this._micHaltLogged) { this.log(`[MI] 💡 Halted — ${this._isGainsLocked?.() ? 'gains lock' : 'drawdown halt'} active; hist scoring continues`, 'info'); this._micHaltLogged = true; }
          } else {
            this._micHaltLogged = false;
          }

          const allTickers = this._lastAllTickers || [];
          if (!allTickers.length) return false;

          // Deferment/timing — every cycle, ahead of any slot logic so it still runs with no active entry slots.
          const _micDef = this._micDefermentState();
          if (!_micDef.deferring) this._micDeferLogged = false;
          await this._micEnforceTiming(_micDef);

          // Entry slots — Auto mode has no generated slot list any more (see _micAutoQualify);
          // Manual mode keeps its exact combo list as before.
          const autoMode = !!this.cfg.micAutoSlots;
          const slots = autoMode ? [] : this._micEffectiveSlots();
          const hasActiveEntry = autoMode ? this._micAutoActive() : slots.length > 0;

          if (!hasActiveEntry) {
            this.log('[MI] 💡 No active slots — skipping', 'info');
            return false;
          }

          const activeSyms  = new Set((this.positions || []).map(p => p.symbol));

          // Criteria pool to scan for data-fetch needs — Auto's non-excluded secondary list, or
          // every criterion actually used across manual slots.
          const _critPool = autoMode
            ? SECONDARY_CRITS.filter(c => !(new Set(this.cfg.micAutoSlotExclude || [])).has(c))
            : [...new Set(slots.flat())];
          const needsVolIo = _critPool.some(c => /^(va|iol|ios)/.test(c));
          const needsHr    = _critPool.some(c => /^(lta|lpa)/.test(c));
          const scanSkip = {
            excluded: { nonUsdt: 0, btc: 0, lowPrice: 0, active: 0, banned: 0, reentry: 0, gray: 0, },
            unmatched: { criteria: 0 },
            blocked: 0
          };
          const basePool = [];
          for (const t of allTickers) {
            if (!t?.symbol?.endsWith('USDT')) { scanSkip.excluded.nonUsdt++; continue; }
            if ((this.cfg.megacapExclude || DEFAULT_MEGACAP_EXCLUDE).includes(t.symbol)) { scanSkip.excluded.btc++; continue; }
            if (parseFloat(t.lastPrice || 0) < 0.001) { scanSkip.excluded.lowPrice++; continue; }
            if (activeSyms.has(t.symbol)) { scanSkip.excluded.active++; continue; }
            if (this._isSymbolBanned?.(t.symbol)) { scanSkip.excluded.banned++; continue; }
            if (this._micIsReentryBlocked(t.symbol)) { scanSkip.excluded.reentry++; continue; }
            if (this._swGrayHas?.(t.symbol)) { scanSkip.excluded.gray++; continue; }
            basePool.push(t);
          };

          ctx.mic = { halted: _micHalted, allTickers, def: _micDef, autoMode, slots, needsVolIo, needsHr, scanSkip, basePool };
        },
        async _micScanFetch(ctx) {
          const { needsHr, basePool } = ctx.mic;
          // Criteria data is fetched fresh, per ticker, for a random batch each scan — the bulk list only says what exists.
          // The batch is the unbiased sample that feeds scoring; entry candidates are ranked off every ticker's latest stored
          // reading, any age, and refetched right before entry (_micVerify). A follower seeds the leader's batch instead.
          const cap0 = Math.max(1, Math.min(2500, Math.round(Number(this.cfg.swOcBatchSize) || 250)));
          let fillSyms = basePool.map(t => t.symbol);
          for (let i = fillSyms.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [fillSyms[i], fillSyms[j]] = [fillSyms[j], fillSyms[i]];
          }
          // Liquidation Surveillance: tickers that had liquidations in the watch just ended stay for continued sampling, quiet ones are
          // graylisted and replaced, and the batch is always filled to the cap (_swLiqPick). null = off / following: the random batch stands.
          // Forecast Grader (SW): the revisits whose turn it is take their share of the slots first, planned before Liquidation Surveillance
          // fills the rest, and are taken out of the pool so the liquidation watch never sees them. null = off / following.
          const fcPlan = this._swFcPlan?.(fillSyms, cap0);
          let cap = cap0, batch;
          if (fcPlan && fcPlan.batch && fcPlan.batch.length) {
            // Forecast Focus: the grader's batch REPLACES the host's own draw, so every sampler (hour candles, liquidation watch, readings) uses exactly its tickers.
            // The liquidation watch is opened on that same list (pool = cap = the list, so it neither adds nor drops anything).
            const liqSet = this._swLiqPick?.(fcPlan.batch, fcPlan.batch.length);
            batch = (liqSet && liqSet.length) ? liqSet : fcPlan.batch;
            cap = batch.length;
          } else {
            // Forecast Grader (non-Focus): the revisits whose turn it is take their share of the slots, the host fills the rest.
            cap = (fcPlan && fcPlan.cap > 0) ? fcPlan.cap : cap0;
            const fcRev = (fcPlan && fcPlan.revisit) || [];
            if (fcRev.length) { const fcSet = new Set(fcRev); fillSyms = fillSyms.filter(s => !fcSet.has(s)); }
            const liqBatch = this._swLiqPick?.(fillSyms, cap - fcRev.length);
            if (liqBatch && liqBatch.length) fillSyms = liqBatch;
            batch = [...new Set([...fcRev, ...fillSyms])].slice(0, cap);
          }
          await this._ocFetchBatch(batch, null, false, needsHr);
          const ocResults = this.swOcResults || {};
          const freshAt = this._swOcResultsAt || 0;
          // Same batch as last scan (fetch skipped or failed, or the leader hasn't published a new one): nothing new to act on.
          if (!freshAt || freshAt === this._micLastActedAt) return false;
          this._micLastActedAt = freshAt;
          // Ranking pool: every non-excluded ticker with a stored per-ticker reading, any age. A batch ticker keeps its fresh
          // payload; the rest are rebuilt from their latest stored reading. Never-sampled tickers have nothing to rank on.
          const latest = this._swLatestReadings?.() || {};
          const rankPool = [], rankOc = {};
          for (const bt of basePool) {
            const sym = bt.symbol, hit = latest[sym], live = ocResults[sym];
            if (!hit && !live) continue;
            const t = live ? (this._swFreshTicker?.(sym) || this._swSynthTicker?.(sym, live)) : this._swSynthStored?.(sym, hit.rec, hit.ts);
            if (!t) continue;
            rankPool.push(t); rankOc[sym] = live || hit.rec;
          }
          ctx.mic.ocResults = rankOc; ctx.mic.freshAt = freshAt; ctx.mic.basePool = rankPool;
          ctx.mic.batchSyms = new Set(Object.keys(ocResults)); ctx.mic.verifyLeft = Math.max(cap, cap0);
        },
        async _micScanPool(ctx) {
          const { allTickers, freshAt, autoMode, slots, scanSkip } = ctx.mic;
          let basePool = ctx.mic.basePool;
          const _swOcResults = ctx.mic.ocResults;

          const checkCrit = (c, fr, t) => this._micCheckCrit(c, fr, t, _swOcResults);

          // Entry ranking: Still-Water's Indicator forecast ranks this batch's tickers (er when Regime caution is active, else e), as pp in this
          // bot's favor (a follower reads the leader's shared forecasts). A ticker the batch has no forecast for is ranked by the
          // scorecard projection instead, after the forecast-ranked ones. No score at all = unranked: it sorts last and is never vetoed on score.
          // SW present: only the tickers its batch forecast covers are candidates. SW absent: MI's criteria alone, unranked.
          const swOn   = typeof this._swFcRankMap === 'function';
          const fcRank = (await this._swFcRankMap?.()) || new Map();
          if (swOn) { const n0 = basePool.length; basePool = basePool.filter(t => fcRank.has(t.symbol)); scanSkip.excluded.noForecast = n0 - basePool.length; }
          // Only lta/lpa can come back null (no 1hr candle yet) — by the time a criterion reaches here checkCrit already passed, so fall back to a neutral tier.
          const _micAnnotateCrit = (c, t) => this._micAnnotateCritRaw(c, t) ?? (c + '+0');
          const _poolOne = (t, ocMap = _swOcResults) => {
              const checkCrit = (c, fr, tt) => this._micCheckCrit(c, fr, tt, ocMap);
              const fr       = parseFloat(t.fundingRate || 0) * 100;
              const critOk = c => checkCrit(c, fr, t);

              let matched = null; // { criteria, annotCrits, slotIdx }
              if (autoMode) {
                const m = this._micAutoQualify(critOk, c => _micAnnotateCrit(c, t));
                if (m) matched = { ...m, slotIdx: -1 };
              } else {
                const slotIdx = slots.findIndex(s => s.length > 0 && s.every(c => checkCrit(c, fr, t)));
                if (slotIdx !== -1) {
                  const _slotCrits = slots[slotIdx];
                  matched = {
                    criteria: _slotCrits,
                    annotCrits: _slotCrits.map(c => _micAnnotateCrit(c, t)),
                    slotIdx,
                  };
                }
              }
              if (!matched) {
                scanSkip.unmatched.criteria++;
                return null;
              }

              const _annotCrits = matched.annotCrits;
              const rs = this._micRankScore(t, fcRank);
              return { t, criteria: matched.criteria, slotIdx: matched.slotIdx, annotKey: [..._annotCrits].sort().join(','), annotCrits: _annotCrits, compositeScore: rs ? rs.v : 0, ranked: !!rs, fcRanked: !!(rs && rs.fc) };
            };
          const _pooled = [];
          for (const t of basePool) {
            if (this._scanDue()) await this._scanCp();
            const r = _poolOne(t);
            if (r) _pooled.push(r);
          }
          const pool = _pooled
            .sort((a, b) => (b.fcRanked - a.fcRanked) || (b.compositeScore - a.compositeScore) || Math.abs(parseFloat(b.t.fundingRate || 0)) - Math.abs(parseFloat(a.t.fundingRate || 0)));
          const entryPool = pool;
          const _micTopReasons = obj => Object.entries(obj).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([k, n]) => `${k}:${n}`).join(' ');
          const _micExcludedNote = _micTopReasons(scanSkip.excluded) || 'none';
          const _micUnmatchedNote = _micTopReasons(scanSkip.unmatched) || 'none';
          this.log(`[MI] 💡 Scan skip summary — universe:${allTickers.length} pool:${basePool.length} qualified:${pool.length} entry:${entryPool.length} | excluded ${_micExcludedNote} | unmatched ${_micUnmatchedNote} `, 'info');

          ctx.mic.pool = pool; ctx.mic.entryPool = entryPool; ctx.mic.poolOne = _poolOne;
        },
        async _micScanEntry(ctx) {
          const { halted: _micHalted, def: _micDef, allTickers, freshAt, slots, needsVolIo, needsHr, scanSkip, basePool, pool, entryPool } = ctx.mic;
          if (_micHalted) return;

          if (_micDef.deferring) {
            if (!this._micDeferLogged) { this.log(`[MI] ⛔ Deferment — headline ${(_micDef.share * 100).toFixed(1)}% is under 50%; no new entries until it recovers`, 'info'); this._micDeferLogged = true; }
            return;
          }

          // Reserve-counted headroom: guards against a substitution path (_micTrySubstitute) or
          // this same open loop being mid-open — past its own headroom check, still awaiting a
          // price refetch — at the exact same moment another scan runs. this.positions.length
          // alone doesn't reflect that in-flight slot, so both paths would see room and open,
          // overshooting maxPos. _micPending is incremented the instant an open is committed to
          // and released once that attempt resolves (see _micOpen), so it always reflects slots
          // that are spoken for even before pseudoOpenLong actually pushes them onto this.positions.
          const _micInFlight = this._micPending || 0;

          if ((this.positions?.length ?? 0) + _micInFlight >= this.cfg.maxPos) {
            await this._micTrySubstitute(entryPool, ctx);
            return;
          }

          let headroom = this.cfg.maxPos - (this.positions?.length ?? 0) - _micInFlight;
          if (this.cfg.micShareCapEnabled) {
            const capSlots = Math.max(1, Math.floor(this.cfg.maxPos * ((this.cfg.micShareCapPct) / 100)));
            const micCount = (this.positions || []).filter(p => p._mic).length;
            headroom = Math.min(headroom, capSlots - micCount);
            if (headroom < 1) {
              if (!(await this._micTrySubstitute(entryPool, ctx))) {
                this.log('[MI] 💡 Share cap reached — no slots available', 'info');
              }
              return;
            }
          }
          const picks = Math.min(Math.max(1, Math.round(this.cfg.micPicks)), headroom);

          if (!entryPool.length) {

            const fundStep = this.cfg.micFundStep;
            const posFund  = basePool.filter(t => parseFloat(t.fundingRate||0)*100 >= fundStep).length;
            const negFund  = basePool.filter(t => parseFloat(t.fundingRate||0)*100 <= -fundStep).length;
            const volIoNote = needsVolIo ? ` va/iol/ios-window:${this._swVolIoWindowAvg?.('vol')!=null?'ready':'warming'}` : '';
            this.log(`[MI] 💡 No tickers matched — pool:${basePool.length} fund+:${posFund} fund-:${negFund}${volIoNote}${needsHr ? ` lta/lpa-window:${this._swWindowStats?.('lpa')?.n ? 'ready' : 'warming'}` : ''}`, 'info');
            return;
          }

          const maxPos     = this.cfg.maxPos;
          const slotOpened = new Array(slots.length).fill(0);

          let opened = 0, attempted = 0, blocked = 0, dropped = 0;
          this._logBatchBegin?.();
          try {
            for (const cand of entryPool) {
              if (opened >= picks) break;
              if ((this.positions?.length ?? 0) + (this._micPending || 0) >= maxPos) break;
              const v = await this._micVerify(cand, ctx);
              if (v === false) break; // refetch budget spent
              if (!v) { dropped++; continue; }
              const { t, criteria, slotIdx, compositeScore } = v;
              attempted++;
              if (await this._micOpen(t, criteria, slotIdx, compositeScore)) { opened++; slotOpened[slotIdx]++; }
              else { blocked++; }
            }
          } finally { this._logBatchEnd?.('[MI] 💡 Entry roll-up'); }
          const _micBlockNote = (blocked ? `, ${blocked} blocked (qty/lev)` : '') + (dropped ? `, ${dropped} dropped on refetch` : '');
          const openedParts   = slotOpened.map((n, i) => n > 0 ? (n > 1 ? `s${i+1}(${n})` : `s${i+1}`) : null).filter(Boolean);
          const openedNote    = openedParts.length ? ` via ${openedParts.join(' ')}` : '';
          this.log(`[MI] 💡 ${entryPool.length} qualified — ${opened} opened${_micBlockNote}${openedNote}`, 'info');
        },
        // Pre-entry refetch of a ranked candidate. The ranking runs on each ticker's latest stored reading, however old, so before a
        // candidate opens (or displaces a position) its ticker, OC and 1hr data are read fresh and the slot match, veto and score rerun
        // on them. It only has to still be viable, not match the tier or score it was ranked on. A ticker from this scan's own batch
        // is already fresh. Returns the refreshed pool entry; null when the fetch failed or it no longer qualifies; false once the
        // scan's refetch budget (one batch size) is spent.
        async _micVerify(cand, ctx) {
          const m = ctx.mic, sym = cand.t.symbol;
          if (m.batchSyms?.has(sym)) return cand;
          if ((m.verifyLeft ?? 0) <= 0) return false;
          m.verifyLeft--;
          const got = await this._swFetchCandidate?.(sym, false, m.needsHr);
          if (!got) return null;
          if (got.oc) (this.swOcResults ||= {})[sym] = got.oc;
          const r = m.poolOne?.(got.t, { [sym]: got.oc || m.ocResults?.[sym] });
          if (!r) return null;
          return r;
        },
        async _micRunScan(ctx = {}) {
          for (const f of [this._micScanPrep, this._micScanFetch, this._micScanPool, this._micScanEntry]) {
            if ((await f.call(this, ctx)) === false) return;
          }
        },

        // All _mic* tagging fields are computed up front and passed straight into
        // pseudoOpenLong's candidate object (copied onto the new position by its own
        // underscore-copy loop, before the position is pushed to this.positions) rather than
        // mutated onto the returned position afterward. Resuming this function after the
        // `await pseudoOpenLong(...)` is a microtask boundary — Alpine's reactive render queued
        // from the push could otherwise run before a later `pos._micCriteria = ...` assignment,
        // rendering the position badge as "Multi" (empty criteria) for one frame even though the
        // underlying data was always correct by the time anything read it again (e.g. on close).
        async _micOpen(t, criteria, slotIdx, compositeScore) {
          if (this._micDefermentState().deferring) return false;
          const sym   = t.symbol;
          let price = parseFloat(t.lastPrice || 0);
          if (!price) return false;
          // Force-Evaluate General Criteria: only ever runs for tickers actually about to open
          // (bounded by picks/maxPos), not the whole scan pool — see _micTopUpGeneralCriteria.
          // Auto mode only; a manual slot's criteria list is a fixed, user-built AND-gate and
          // shouldn't silently grow.
          if (this.cfg.micForceGeneralCriteria && this.cfg.micAutoSlots) {
            criteria = await this._micTopUpGeneralCriteria(t, criteria);
          }
          const annotCrits = (criteria || []).map(c => this._micAnnotateCritRaw(c, t) ?? (c + '+0'));
          // Reserve this slot for the duration of the open call below.
          this._micPending = (this._micPending || 0) + 1;
          try {
            // A ticker from this scan's own fresh batch already carries a current price; only older ones refetch.
            if (!this._swTickerIsCurrent?.(t)) try {
              const r  = await fetch(`${this.base}/v5/market/tickers?category=linear&symbol=${sym}`);
              const d  = await r.json();
              const lp = parseFloat(d?.result?.list?.[0]?.lastPrice);
              if (lp > 0) price = lp;
            } catch(e) {}
            const change = parseFloat(t.price24hPcnt || 0) * 100;
            const fr     = parseFloat(t.fundingRate  || 0) * 100;
            const _tg = this._micTargets();
            const pos = await this[WINTER ? 'pseudoOpenShort' : 'pseudoOpenLong']({
              symbol: sym, price, change, fundingRate: fr,
              _tpPct: _tg.active ? +_tg.entryTp.toFixed(2) : undefined,
              _slPct: _tg.active ? +_tg.slPct.toFixed(2) : undefined, // Relative Target: this position's own SL (host honours it via _slPctOverride) and entry TP (host honours it, see pseudoOpenLong)
              _mic: true,
              _micPathA: true, // runScan's entryPool only ever contains 0-liq (closed-cycle) matches
              _micSlotIdx: slotIdx ?? 0,
              _micCompositeScore: compositeScore ?? 0,
              _micCriteria: annotCrits,
              _micRawCriteria: criteria, // kept alongside annotCrits so substitution can
                                          // recompute a live score later (see _micLiveCompositeScore)
            });
            if (pos) {
              if (typeof this.persist === 'function') this.persist();
              return true;
            }
            return false;
          } finally {
            this._micPending = Math.max(0, (this._micPending || 0) - 1);
          }
        },

        // Force-Evaluate General Criteria (see the toggle in the Auto slots panel). Scan-time's
        // pool build only ever sees whatever OC data that cycle's capped bulk prefetch covered —
        // fund and one side each of OCS/OCX/IO/L/IO/S are expected to resolve for virtually any ticker
        // once real data exists, so a match can end up missing several of them purely because the
        // fetch hadn't happened yet, not because they're actually false. Re-checks exactly those,
        // forced and uncapped, for this one symbol — cheap here since _micOpen only ever runs for
        // tickers actually about to open, never the whole pool — and returns criteria with any
        // newly-true ones appended. Never drops anything the original match already found, even
        // if it would now read differently.
        async _micTopUpGeneralCriteria(t, criteria) {
          const sym = t.symbol;
          const have = new Set(criteria);
          const GENERAL = ['fund', 'iol', 'ios', 'lta', 'lpa'];
          const exclude = new Set(this.cfg.micAutoSlotExclude || []);
          const missing = GENERAL.filter(c => !have.has(c) && !exclude.has(c));
          if (!missing.length) return criteria;

          const jobs = [];
          // `true` here is the one loophole in the follower's no-own-fetch rule: right before
          // opening, if the leader's shared cache has nothing for this symbol, fetch it directly
          // rather than opening with OC criteria silently unscored. Every other caller of this
          // leaves the flag off, so scan-time pool building still fetches nothing on a follower.
          
          // lta/lpa: same loophole as ocs/ocx above — only fetch this symbol's 1hr candle when
          // nothing (own cache or the leader's shared batch) already has it.
          if (missing.some(c => /^(lta|lpa)/.test(c)) && !this._swHourReading?.(sym)) {
            jobs.push(this._swHourCandle?.(sym));
          }
          // iol/ios: the long share isn't on the ticker payload -- one fresh read when neither the payload, a recent fresh read nor a stored sample has it.
          if (missing.some(c => /^(iol|ios)/.test(c)) && this._micLsShare?.(t) == null) jobs.push(this._micLsFetch?.(sym));
          if (jobs.length) await Promise.all(jobs);

          const fr           = parseFloat(t.fundingRate || 0) * 100;
          const ocResultsMap = this.swOcResults?.[sym] ? { [sym]: this.swOcResults[sym] } : {};

          const appended = missing.filter(c => this._micCheckCrit(c, fr, t, ocResultsMap));
          return appended.length ? [...criteria, ...appended] : criteria;
        },

        // Raw criterion annotation for one ticker — the single source for scan-time pool
        // building, _micOpen, and Still-Water's per-scan open-position sampler (which calls it as
        // this._micAnnotateCritRaw). Returns null only for lta/lpa when no 1hr candle is
        // available for the ticker yet.
        _micAnnotateCritRaw(c, t) {
          if (/^va/.test(c)) { const val = parseFloat(t.turnover24h || 0); const w = this._swVolIoWindowAvg?.('vol'); const step = this.cfg.micVaStep; const tier = (val && w) ? Math.floor((Math.log(val / w) * 100) / step) : 0; return `va${tier>=0?'+':''}${tier}`; }
          if (/^(iol|ios)/.test(c)) { const long = /^iol/.test(c), bl = this._micLsShare?.(t), oi = parseFloat(t.openInterestValue || 0), val = (bl > 0 && bl < 1 && oi > 0) ? oi * (long ? bl : 1 - bl) : 0, w = this._swVolIoWindowAvg?.(long ? 'oil' : 'ois'); if (!(val > 0 && w > 0)) return null; const step = long ? this.cfg.micIolStep : this.cfg.micIosStep; const tier = Math.floor((Math.log(val / w) * 100) / step); return `${long ? 'iol' : 'ios'}${tier>=0?'+':''}${tier}`; }
          if (/^fund/.test(c)) { const step = this.cfg.micFundStep; const fr_ = parseFloat(t.fundingRate||0)*100; const tier = Math.trunc(fr_ / step); return `fund${fr_<0?'-':'+'}${Math.abs(tier)}`; }
          
          
          if (/^lta/.test(c)) { const tier = this._micHourTier('lta', t); return tier == null ? null : `lta${tier>=0?'+':''}${tier}`; }
          if (/^lpa/.test(c)) { const tier = this._micHourTier('lpa', t); return tier == null ? null : `lpa${tier>=0?'+':''}${tier}`; }
          return c;
        },
        // LTA/LPA tier for one ticker, or null when its 1hr candle (or, for LPA, the window
        // baseline) isn't available. LTA: % deviation of last-hour turnover from the ticker's own
        // 24h/24, per micLtaStep. LPA: percentage-point gap between its 1hr price change and the
        // mean of every other ticker in the window, per micLpaStep.
        _micHourTier(kind, t) {
          const hr = this._swHourReadingWide?.(t.symbol);
          if (!hr) return null;
          if (kind === 'lta') {
            const dev = this._swLtaDev?.(hr.ht, t.turnover24h);
            return dev == null ? null : Math.floor(dev / this.cfg.micLtaStep);
          }
          const avg = this._swLpaWindowAvg?.(t.symbol);
          if (avg == null || typeof hr.hc !== 'number') return null;
          return Math.floor((hr.hc - avg) / this.cfg.micLpaStep);
        },

        _micCheckCrit(c, fr, t, ocResults) {
          if (/^fund/.test(c)) {
            const step = this.cfg.micFundStep;
            const tier = Math.trunc(fr / step); // toward zero, matches the annotated tag (fund-0 = tiny negative)
            const m = c.match(/^fund([<>])(-?\d+)$/);
            // Bare 'fund' (Auto mode's un-thresholded form) registers on any finite rate directly (fr,
            // not tier): real Bybit funding rates mostly sit well under a single micFundStep, so gating
            // on tier would almost never fire. The tier is still computed above and drives the
            // fund>N/fund<N thresholded forms and the annotated tag's magnitude.
            if (!m) return Number.isFinite(fr); // any rate incl. exactly 0 — zero/near-zero funding is a real (lukewarm) reading
            return m[1] === '>' ? tier >= parseInt(m[2],10) : tier <= parseInt(m[2],10);
          }
          if (/^va/.test(c)) {
            const val = parseFloat(t.turnover24h || 0);
            const windowAvg = this._swVolIoWindowAvg?.('vol');
            if (!val || !windowAvg) return false;
            const step = this.cfg.micVaStep;
            const tier = Math.floor((Math.log(val / windowAvg) * 100) / step);
            const m = c.match(/^va([<>])(-?\d+)$/);
            if (!m) return true;
            return m[1] === '>' ? tier >= parseInt(m[2],10) : tier <= parseInt(m[2],10);
          }
          if (/^(iol|ios)/.test(c)) {
            const long = /^iol/.test(c), bl = this._micLsShare?.(t), oi = parseFloat(t.openInterestValue || 0);
            const val = (bl > 0 && bl < 1 && oi > 0) ? oi * (long ? bl : 1 - bl) : 0;
            const windowAvg = this._swVolIoWindowAvg?.(long ? 'oil' : 'ois');
            if (!val || !windowAvg) return false;
            const step = long ? this.cfg.micIolStep : this.cfg.micIosStep;
            const tier = Math.floor((Math.log(val / windowAvg) * 100) / step);
            const m = c.match(/^(?:iol|ios)([<>])(-?\d+)$/);
            if (!m) return true;
            return m[1] === '>' ? tier >= parseInt(m[2], 10) : tier <= parseInt(m[2], 10);
          }
          
          if (/^(lta|lpa)/.test(c)) {
            const tier = this._micHourTier(c.slice(0, 3), t);
            if (tier == null) return false;
            const m = c.match(/^(?:lta|lpa)([<>])(-?\d+)$/);
            if (!m) return true;
            return m[1] === '>' ? tier >= parseInt(m[2], 10) : tier <= parseInt(m[2], 10);
          }
          return false;
        },

        // A held position's score now: the newest Still-Water forecast on its ticker, else the score frozen at open.
        _micLiveCompositeScore(pos) {
          const s = this._swFcScoreOf?.(pos.symbol);
          return s != null ? s : (pos._micCompositeScore ?? 0);
        },

        // Shared collapsed-rank lookup (own + partner + historical PnL, see micCollapsedSlotRanks)
        // for a single criterion key. Every criterion's rank accumulates under a sign-suffixed key
        // (e.g. 'fund-', 'va+'), so both variants are summed.
        _micCritScore(c) {
          const ranks = this.micCollapsedSlotRanks || {};
          return (ranks[c] ?? 0) + (ranks[c + '+'] ?? 0) + (ranks[c + '-'] ?? 0);
        },

        // Reads the same shared graylist the host writes on every close (any strategy, keyed by
        // symbol) — a symbol stays blocked for one bulk-ticker cooldown window after its position
        // closes. 'both' (default) blocks regardless of win/loss; 'losers' lets a symbol that
        // just closed in profit re-trigger immediately. Ported from Liquid-Diver.
        _micIsReentryBlocked(sym) {
          const g = this._tickerGraylist?.[sym];
          if (!g || !(g.ts > 0)) return false;
          const ttl = this.cfg.bulkTickerCooldownHours * 3600000;
          if (Date.now() - g.ts >= ttl) return false;
          if ((this.cfg.micReentryBlockMode) === 'losers') return g.isWin === false;
          return true;
        },
        // Auto's minimum-gate qualifier. "Criteria per Slot" (micAutoSlotSize) is a FLOOR, not a
        // fixed count: this evaluates EVERY non-excluded secondary criterion against the ticker
        // and qualifies once at least that many are true. Every true criterion is kept — a
        // ticker exhibiting 5 genuine criteria is scored on all 5, not sliced down to however
        // many the slider happens to say. checkFn(c) -> bool and annotFn(c) -> annotated string
        // are supplied by the caller.
        _micAutoQualify(checkFn, annotFn) {
          const exclude = new Set(this.cfg.micAutoSlotExclude || []);
          const need = Math.min(SECONDARY_CRITS.length, Math.max(0, this.cfg.micAutoSlotSize));
          const trueCrits = [];
          for (const c of SECONDARY_CRITS) {
            if (exclude.has(c)) continue;
            if (checkFn(c)) trueCrits.push(c);
          }
          if (trueCrits.length < need) return null;
          return { criteria: trueCrits, annotCrits: trueCrits.map(c => annotFn(c)) };
        },

        // True if Auto mode could produce a qualifying match at all right now — i.e. enough
        // non-excluded secondary criteria exist to ever reach the minimum. Auto's equivalent of
        // "any active slots" now that there's no generated slot list to check.
        _micAutoActive() {
          if (!this.cfg.micAutoSlots) return false;
          const exclude = new Set(this.cfg.micAutoSlotExclude || []);
          const secAvail = SECONDARY_CRITS.filter(c => !exclude.has(c)).length;
          return secAvail >= Math.min(SECONDARY_CRITS.length, this.cfg.micAutoSlotSize);
        },

        // Manual mode only now — Auto no longer generates a slot list (see _micAutoQualify).
        _micEffectiveSlots() {
          const filtered = (this.cfg.micSlots || []).filter(s => s.length > 0);
          if (!Object.keys(this.micCollapsedSlotRanks || {}).length) return filtered;
          return filtered.slice().sort((a, b) => {
            const sa = a.reduce((s, c) => s + this._micCritScore(c), 0);
            const sb = b.reduce((s, c) => s + this._micCritScore(c), 0);
            return sb - sa;
          });
        },

      }, _hostStages
        ? { _scanStageDefs: [...def._scanStageDefs,
            { id: 'mic-prep',  group: 'mic', run: function (ctx) { return this._micScanPrep(ctx); } },
            { id: 'mic-fetch', group: 'mic', run: function (ctx) { return this._micScanFetch(ctx); } },
            { id: 'mic-pool',  group: 'mic', run: function (ctx) { return this._micScanPool(ctx); } },
            { id: 'mic-entry', group: 'mic', run: function (ctx) { return this._micScanEntry(ctx); } },
          ] }
        : { async runScan() {
            await _origScan.call(this);
            await this._micRunScan();
          } });
    },
  };
})();
</script>
