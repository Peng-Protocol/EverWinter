<!--
  Multi-Indicator Strategy Plugin for PseudoChaser
  Slot-based entry filter. A slot (Auto-generated or manually built) qualifies once a ticker
  exhibits at least micAutoSlotSize (Auto) or all of its own criteria (manual) from the
  secondary criteria set: fund, V/A, IO/A, OCS, OCX. No criterion is mandatory.

  Auto Slots evaluates every non-excluded secondary criterion against each ticker and keeps
  every one that's true — not sliced down to a fixed count. Manual slots keep the existing
  criteria picker, an exact AND-gate of whatever's selected.

  Substitution considers any held position in the book, not just MIC's own, same as
  Liquid-Diver did — score-gated, not automatic.

  Re-entry Block Mode (micReentryBlockMode: 'both' / 'losers') is ported from Liquid-Diver:
  'losers' lets a symbol that just closed in profit re-trigger immediately.

  Entry pool fires once per fresh sample batch (_afOcResultsAt) — will not re-scan
  the same batch twice. Candidates are ranked on every ticker's latest stored reading (any age) and refetched before entry. TP, SL, and all exit logic use the host's settings.
  Drawdown throttle and gains lock gate all entries.

  Load via Plugin Manager in PseudoChaser's config panel.
  Load AFTER SunChaser if using live trading — see README Plugin Stack Order.
  targetBot: pseudochaser
-->
<script>
(function () {
  'use strict';

    const VERSION       = '1.100.3'; // Tweak: trimmed the changelog and history-only comments. Prior: 1.100.2 — Tweak: fresh-config defaults now match the active run — Deferment, Target Halving and Pole Blocking on, Substitution Min Age 35m, Re-entry Block 'losers', active slot 0.
  const DEFAULT_SLOTS = [[]];
  const MIC_HIST_KEY  = '__mic_hist_batches';
  // Full secondary criteria list — shared by Auto's minimum-gate qualifier, the Exclude-from-
  // Auto picker, so both stay in sync by construction.
  const SECONDARY_CRITS = ['fund','va','ioa','ocs','ocx','lta','lpa'];

  // Megacaps excluded from the population pool alongside BTC — their size skews OC/IO/Volume/liq
  // averages the same way BTC would. cfg.megacapExclude is seeded from this default below but is
  // a plain array on cfg (no picker UI) — edit it directly in saved config if the list needs to
  // change. Shared key name with Ashfall's own seed so either plugin can init it first.
  const DEFAULT_MEGACAP_EXCLUDE = ['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','TRXUSDT','LINKUSDT'];
  // Single source of truth for MIC's own scalar config defaults. Merged into cfg once during
  // init() (see below) — call sites read this.cfg.<key> directly, no inline `?? literal`.
  // Excludes: megacapExclude/micSlots (arrays with their own migration
  // logic in init()), and any key actually owned by the Ashfall sibling plugin (those keep
  // their defensive `?? literal` at the cross-read call site since Ashfall owns their default).
  // micReentryBlockMode canonically defaults to 'losers'.
  const MIC_DEFAULT_CFG = Object.freeze({
    micEnabled: true,
    micPicks: 5,
    micFrThreshold: 0.1,
    micShareCapEnabled: true,
    micShareCapPct: 100,
    micActiveSlot: 0,
    micCascadeEnabled: true,
    micCascadePct: 50,
    micSacrificeEnabled: true,
    micSacrificePct: 50,
    micSubstitutionEnabled: true,
    micSubstitutionMarginPct: 5,
    micSubstitutionMinAgeMins: 35,
    micDefermentEnabled: true, // Deferment: no new entries while the Sample Scorer headline is negative. Needs Sample Scoring.
    micTargetHalvingEnabled: true, // Target Halving: the Sample Scorer's relative headline (favorable share of raw move) scales each new position's entry TP, the Cascade % and the Sacrifice % (recorded peak = full, even share = zero) and defers entries under the Min Entry TP floor. Needs Sample Scoring.
    micMinEntryTp: 6,               // Target Halving floor, ROI %: below this a position can't clear its entry+exit fees, so a resolved entry TP or Cascade target under it = market not worth trading -> defer
    micDeferBothRedEnabled: false, // Both-poles-red (sub-toggle of Deferment): also defer while any criterion has BOTH its + and - pole in the red on the scorecard
    micPoleBlockEnabled: true,     // Pole Blocking (Sample Scoring only): block a pole trailing its positive partner pole's scorecard edge by the threshold or more
    micPoleBlockPct: 200,           // Pole Blocking threshold, % of the partner pole's edge: blocked when (partner - pole) / partner >= this
    micReentryBlockMode: 'losers',
    micAutoSlots: true,
    micAutoSlotSize: 3,
    micAutoSlotExclude: [],
    micForceGeneralCriteria: true,
    micFundStep: 0.0025,
    micVaStep: 1,
    micIoaStep: 1,
    micOcsStep: 1,
    micOcxStep: 1,
    // LTA step = % deviation of 1hr turnover from the ticker's own 24h/24 per tier; LPA step =
    // percentage points of 1hr price change above/below the population mean per tier.
    micLtaStep: 10,
    micLpaStep: 0.25,
  });

  // Per-criterion emoji for position badges. Fund emoji is app-relative:
  // -fund = shorts paying = good carry for longs (🤑), bad for shorts (💸).
  // +fund = longs paying = bad for longs (💸), good for shorts (🤑).
  const CRIT_EMOJI = { 'fund': '💰', 'va': '🔊', 'vm': '🔊', 'ioa': '🎲', 'iot': '🎲', 'iom': '🧲', 'ocs': '🔭', 'ocx': '📡', 'lta': '🕐', 'lpa': '💹' };
  const CRIT_DESC  = { 'fund': 'Fund (tiered funding rate)', 'va': 'V/A (volume vs. population sample-window average)', 'vm': 'V/M (vol/mcap ratio) — retired, replaced by V/A', 'ioa': 'IO/A (open interest vs. population sample-window average)', 'iot': 'IO/T (OI vs Turnover) — retired, replaced by IO/A', 'iom': 'IO/M (OI vs MCap) — retired, replaced by IO/A', 'ocs': 'OCS (buy/sell skew %)', 'ocx': 'OCX (% faster/slower than the full-window avg order interval)', 'lta': 'LTA (1hr turnover vs. the ticker\'s own 24h/24 average)', 'lpa': 'LPA (1hr price change vs. every other ticker in the sample window)' };
  // Slots qualify on any N of the 5 secondary criteria (fund, V/A, IO/A, OCS, OCX) alone — see _micAutoQualify.

  const critEmoji = c => {
    if (/^fund/.test(c)) { const s = c.slice(4); const num = parseFloat(s.replace(/^[<>]/,'')); return ((num < 0 || /^-/.test(s)) ? '🤑' : '💸') + s; }
    if (/^va/.test(c)) return '🔊' + c.slice(2);
    if (/^vm/.test(c)) return '🔊' + c.slice(2);
    // Retired (see VSG.md) — kept resolvable so old scorecard/history entries still render.
    if (/^lsa/.test(c)) return '🟥' + c.slice(3);
    if (/^lba/.test(c)) return '🟩' + c.slice(3);
    if (/^rasl/.test(c)) return '🔴' + c.slice(4);
    if (/^rabl/.test(c)) return '🟢' + c.slice(4);
    if (/^msliq/.test(c)) return '💦' + c.slice(5);
    if (/^mbliq/.test(c)) return '🧊' + c.slice(5);
    if (/^sliq/.test(c)) return '🥵' + c.slice(4);
    if (/^bliq/.test(c)) return '🥶' + c.slice(4);
    if (/^ioa/.test(c)) return '🎲' + c.slice(3);
    if (/^iot/.test(c)) return '🎲' + c.slice(3);
    if (/^iom/.test(c)) return '🧲' + c.slice(3);
    if (/^ocs/.test(c)) return '🔭' + c.slice(3);
    if (/^ocx/.test(c)) return '📡' + c.slice(3);
    if (/^lta/.test(c)) return '🕐' + c.slice(3);
    if (/^lpa/.test(c)) return '💹' + c.slice(3);
    if (/^liqturnover/.test(c)) return '🌊' + c.slice(11);
    if (/^liqquiet/.test(c)) return '🤫' + c.slice(8);
    if (/^pec/.test(c)) { const m = c.match(/^(pec[a-z]+)/); return (CRIT_EMOJI[m ? m[1] : c] || '') + c.replace(/^pec[a-z]+/, ''); }
    if (/^vsg/.test(c)) { const m = c.match(/^(vsg[a-z]+)/); return (CRIT_EMOJI[m ? m[1] : c] || '') + c.replace(/^vsg[a-z]+/, ''); }
    if (/^regime/.test(c)) { const m = c.match(/^(regime[a-z]+)/); return (CRIT_EMOJI[m ? m[1] : c] || '') + c.replace(/^regime[a-z]+/, ''); }
    return CRIT_EMOJI[c] || '';
  };
  const critLabel = c => {
    const fM = c.match(/^fund([<>])(-?\d+)$/);
    if (fM) return 'Fund ' + fM[1] + fM[2];
    const fA = c.match(/^fund([+-]-?\d*)$/);
    if (fA) return 'Fund t' + fA[1];
    if (c === 'fund') return 'Fund';
    const aM = c.match(/^va([<>])(-?\d+)$/);
    if (aM) return 'V/A ' + aM[1] + aM[2];
    const aA = c.match(/^va([+-]-?\d*)$/);
    if (aA) return 'V/A t' + aA[1];
    if (c === 'va') return 'V/A';
    const vM = c.match(/^vm([<>])(\d+)$/);
    if (vM) return 'V/M ' + vM[1] + vM[2];
    const vA = c.match(/^vm([+-]\d+)$/);
    if (vA) return 'V/M t' + vA[1];
    if (c === 'vm') return 'V/M';
    // Retired (see VSG.md) — kept resolvable so old scorecard/history entries and any
    // not-yet-migrated saved slots still render instead of falling through to the raw tag.
    const kM = c.match(/^(lsa|lba|rasl|rabl)([<>])(\d+)$/);
    if (kM) return kM[1].toUpperCase().replace('RASL','R-ASL').replace('RABL','R-ABL') + ' ' + kM[2] + kM[3];
    const kA = c.match(/^(lsa|lba|rasl|rabl)([+-]\d+)$/);
    if (kA) return kA[1].toUpperCase().replace('RASL','R-ASL').replace('RABL','R-ABL') + ' t' + kA[2];
    if (c === 'lsa') return 'LSA'; if (c === 'lba') return 'LBA';
    if (c === 'rasl') return 'R-ASL'; if (c === 'rabl') return 'R-ABL';
    const m = c.match(/^(m?sliq|m?bliq)([<>])([+-]?\d+)$/);
    if (m) return (m[1] === 'sliq' ? 'S-Liq' : m[1] === 'bliq' ? 'B-Liq' : m[1] === 'msliq' ? 'mS-Liq' : 'mB-Liq') + ' ' + m[2] + m[3];
    const n = c.match(/^(m?sliq|m?bliq)([+-]\d+)$/);
    if (n) return (n[1] === 'sliq' ? 'S-Liq' : n[1] === 'bliq' ? 'B-Liq' : n[1] === 'msliq' ? 'mS-Liq' : 'mB-Liq') + ' ' + n[2];
    if (c === 'sliq') return 'S-Liq'; if (c === 'bliq') return 'B-Liq';
    if (c === 'msliq') return 'mS-Liq'; if (c === 'mbliq') return 'mB-Liq';
    if (c === '0liq') return '0-Liq';
    const ioaM = c.match(/^ioa([<>])(-?\d+)$/);
    if (ioaM) return 'IO/A ' + ioaM[1] + ioaM[2];
    const ioaA = c.match(/^ioa([+-]-?\d*)$/);
    if (ioaA) return 'IO/A t' + ioaA[1];
    if (c === 'ioa') return 'IO/A';
    const o = c.match(/^(iot|iom)([<>])(\d+)$/);
    if (o) return (o[1] === 'iot' ? 'IO/T' : 'IO/M') + ' ' + o[2] + o[3];
    const p = c.match(/^(iot|iom)([+-]\d+)$/);
    if (p) return (p[1] === 'iot' ? 'IO/T' : 'IO/M') + ' t' + p[2];
    if (c === 'iot') return 'IO/T'; if (c === 'iom') return 'IO/M';
    const oc = c.match(/^(ocs|ocx)([<>])(-?\d+)$/);
    if (oc) return oc[1].toUpperCase() + ' ' + oc[2] + oc[3];
    const ocT = c.match(/^(ocs|ocx)([+-]\d+)$/);
    if (ocT) return ocT[1].toUpperCase() + ' t' + ocT[2];
    if (c === 'ocs') return 'OCS'; if (c === 'ocx') return 'OCX';
    const haM = c.match(/^(lta|lpa)([<>])(-?\d+)$/);
    if (haM) return haM[1].toUpperCase() + ' ' + haM[2] + haM[3];
    const haT = c.match(/^(lta|lpa)([+-]-?\d*)$/);
    if (haT) return haT[1].toUpperCase() + ' t' + haT[2];
    if (c === 'lta') return 'LTA'; if (c === 'lpa') return 'LPA';
    const PEC_LABEL = { pecob: 'PEC OB', pecos: 'PEC OS', pecalpha: 'PEC Red Mtn', pecdelta: 'PEC Grn Delta', pecmomup: 'PEC Bull-Mom', pecmomdn: 'PEC Bear-Mom', pecirr: 'PEC Irregular' };
    const pM = c.match(/^(pec[a-z]+)([+-]\d+)$/);
    if (pM && PEC_LABEL[pM[1]]) return PEC_LABEL[pM[1]] + ' t' + pM[2];
    if (PEC_LABEL[c]) return PEC_LABEL[c];
    const VSG_LABEL = { vsgot: 'VSG Over-Traded', vsgut: 'VSG Under-Traded', vsgalpha: 'VSG Mountain', vsgdelta: 'VSG Trough', vsgmomup: 'VSG Mom-Up', vsgmomdn: 'VSG Mom-Dn', vsgirr: 'VSG Irregular' };
    const vsgM = c.match(/^(vsg[a-z]+)([+-]\d+)$/);
    if (vsgM && VSG_LABEL[vsgM[1]]) return VSG_LABEL[vsgM[1]] + ' t' + vsgM[2];
    if (VSG_LABEL[c]) return VSG_LABEL[c];
    const REGIME_LABEL = { regimebull: 'Rg Bull', regimebear: 'Rg Bear' };
    const rgM = c.match(/^(regime[a-z]+)([+-]\d+)$/);
    if (rgM && REGIME_LABEL[rgM[1]]) return REGIME_LABEL[rgM[1]] + ' t' + rgM[2];
    if (REGIME_LABEL[c]) return REGIME_LABEL[c];
    return CRIT_DESC[c] || c;
  };

  window.__BotPlugin = {
    id:        'multiindicator-chaser',
    name:      'Multi-Indicator (Chaser)',
    version:   VERSION,
    targetBot: 'pseudochaser',
    after:     ['sunchaser', 'ashfall-chaser'],
    before:    [],
    conflicts: ['liquiddiver-chaser'],
    requires:  ['ashfall-chaser'],
    touches:   ['init', 'runScan', 'pseudoWatchPositions'],

    css: `
      .mic-hint { font-size:9px; color:var(--text-lo); margin-top:3px; line-height:1.5; }
      .mic-slot { display:inline-flex; flex-direction:column; align-items:center; gap:3px; padding:6px 5px; border-radius:3px; border:1px solid; cursor:pointer; min-width:52px; font-size:9px; font-family:var(--mono); text-align:center; transition:border-color .15s,background .15s; }
      .mic-crit { font-size:8px; padding:1px 4px; border-radius:2px; background:rgba(255,150,80,.12); border:1px solid rgba(255,150,80,.3); color:#ff9650; white-space:nowrap; }
      .mic-opt { padding:5px 7px; font-size:9px; font-family:var(--mono); border-radius:2px; border:1px solid; cursor:pointer; background:none; transition:border-color .12s,background .12s,color .12s; }
      .mic-tabs { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:2px; }
      .mic-tab { font-family:var(--mono); font-size:9px; padding:3px 9px; border-radius:2px; border:1px solid; cursor:pointer; background:none; transition:border-color .12s,color .12s,background .12s; letter-spacing:.5px; }
      .mic-tab.on { border-color:rgba(255,150,80,.6); color:#ff9650; background:rgba(255,150,80,.08); }
      .mic-tab:not(.on) { border-color:rgba(255,255,255,.15); color:var(--text-lo); }
      .mic-zone { margin-top:8px; padding:8px; background:rgba(255,255,255,.02); border:1px solid rgba(255,255,255,.06); border-radius:3px; }
    `,

    slots: {
      'mode-label-extra': `<span x-show="cfg.micEnabled"> + Multi</span>`,
      'strategy-accordions': `
        <div x-data="{ open: false, tE: false, tX: false, tFe: false }">
          <button class="cfg-acc-hd" @click="open=!open" :class="open?'open':''">
            <div style="display:flex;align-items:center;gap:7px">
              <span>♨ Multi-Indicator</span>
              <span x-show="cfg.micEnabled" style="font-size:8px;padding:1px 5px;background:rgba(255,150,80,.15);border:1px solid rgba(255,150,80,.35);border-radius:2px;color:#ff9650;letter-spacing:1px">ON</span>
              <span x-show="!cfg.micEnabled" style="font-size:8px;padding:1px 5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:2px;color:var(--text-lo);letter-spacing:1px">OFF</span>
            </div>
            <span class="cfg-acc-arrow" :class="open?'open':''">▶</span>
          </button>
          <div x-show="open" x-transition.opacity class="cfg-acc-body">
            <label class="tog">
              <div class="tog-t" :class="cfg.micEnabled?'on':''" @click.prevent="if(!cfgLocked){cfg.micEnabled=!cfg.micEnabled;persist()}"><div class="tog-k"></div></div>
              <div>
                <div class="tog-l">Multi-Indicator Mode</div>
                <div class="mic-hint">Longs tickers matching any active entry slot; fires once per bulk ticker fetch using host TP/SL settings.</div>
              </div>
            </label>
            <div x-show="cfg.micEnabled" style="margin-top:8px">
              <div class="mic-tabs">
                <button class="mic-tab" :class="tE?'on':''" @click="tE=!tE">ENTRY</button>
                <button class="mic-tab" :class="tX?'on':''" @click="tX=!tX">EXIT</button>
                <button class="mic-tab" :class="tFe?'on':''" @click="tFe=!tFe">FETCH</button>
              </div>

              <!-- Entry Zone -->
              <div class="mic-zone" x-show="tE">
                <!-- Entry Slots -->
                <div>
                  <div style="margin-bottom:6px">
                    <div class="lbl" style="margin-bottom:4px">Entry Slots</div>
                    <label class="tog" style="font-size:9px">
                      <div class="tog-t" :class="cfg.micAutoSlots?'on':''" @click="if(!cfgLocked){cfg.micAutoSlots=!cfg.micAutoSlots;persist()}"><div class="tog-k"></div></div>
                      <span class="tog-l">Auto</span>
                    </label>
                  </div>

                  <!-- Auto slots controls -->
                  <div x-show="cfg.micAutoSlots" style="margin-bottom:8px;padding:6px 8px;background:rgba(255,150,80,.04);border:1px solid rgba(255,150,80,.12);border-radius:3px">
                    <div class="lbl">Minimum Criteria per Slot <b x-text="cfg.micAutoSlotSize"></b> <span style="font-weight:normal;color:var(--text-lo)" x-text="'— '+(()=>{const n=cfg.micAutoSlotSize;const excl=new Set(cfg.micAutoSlotExclude||[]);const secTotal=['fund','va','ioa','ocs','ocx','lta','lpa'].filter(c=>!excl.has(c)).length;return 'qualifies on any '+n+' of '+secTotal+' secondary criteria — every one true gets scored, not capped at this minimum.'})()"></span></div>
                    <input type="range" min="1" max="7" step="1" x-model.number="cfg.micAutoSlotSize" @change="persist()">
                    <div class="lbl" style="margin-top:5px;margin-bottom:3px">Exclude from Auto</div>
                    <div class="crit-pick" style="display:flex;flex-wrap:wrap;gap:3px">
                      <template x-for="c in ['fund','va','ioa','ocs','ocx','lta','lpa']" :key="c">
                        <button @click.prevent="if(!cfgLocked){ const ex=(cfg.micAutoSlotExclude||[]).slice(); const i=ex.indexOf(c); if(i>=0) ex.splice(i,1); else ex.push(c); cfg.micAutoSlotExclude=ex; persist(); }"
                                :style="'font-family:var(--mono);font-size:8px;padding:1px 5px;border-radius:2px;cursor:pointer;border:1px solid;' + ((cfg.micAutoSlotExclude||[]).includes(c) ? 'border-color:rgba(255,80,80,.5);background:rgba(255,80,80,.15);color:rgba(255,80,80,.8)' : 'border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:var(--text-lo)')"
                                x-text="c.replace('fund','Fund').replace('va','V/A').replace('ioa','IO/A').replace('ocs','OCS').replace('ocx','OCX').replace('lta','LTA').replace('lpa','LPA')">
                        </button>
                      </template>
                    </div>
                    <div class="mic-hint" style="margin-top:4px">Excluded criteria are dropped from auto combos and scoring; every criterion scores per tier, not per slot.</div>
                    <label class="tog" style="margin-top:8px">
                      <div class="tog-t" :class="cfg.micForceGeneralCriteria?'on':''" @click.prevent="if(!cfgLocked){cfg.micForceGeneralCriteria=!cfg.micForceGeneralCriteria;persist()}"><div class="tog-k"></div></div>
                      <div>
                        <div class="tog-l">Force-Evaluate General Criteria</div>
                        <div class="mic-hint">Forces a fresh per-symbol Fund/OCS/OCX/LTA/LPA check before each entry, appending newly-true ones (a few extra requests).</div>
                      </div>
                    </label>
                  </div>

                  <!-- Pole Blocking — Sample Scoring only -->
                  <div x-show="cfg.afSampleScoringEnabled" style="margin-bottom:8px">
                    <label class="tog">
                      <div class="tog-t" :class="cfg.micPoleBlockEnabled?'on':''" @click.prevent="if(!cfgLocked){cfg.micPoleBlockEnabled=!cfg.micPoleBlockEnabled;persist()}"><div class="tog-k"></div></div>
                      <div>
                        <div class="tog-l">Pole Blocking</div>
                        <div class="mic-hint">Blocks a pole whose scorecard edge trails its partner pole's by the threshold or more.</div>
                      </div>
                    </label>
                    <div x-show="cfg.micPoleBlockEnabled" style="margin-top:6px;display:flex;align-items:center;gap:6px">
                      <span class="lbl" style="margin:0">Threshold %</span>
                      <input type="number" min="0" step="10" x-model.number="cfg.micPoleBlockPct" @change="persist()" style="width:70px;font-family:var(--mono);font-size:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:3px;color:var(--text-hi);padding:2px 6px">
                    </div>
                  </div>

                  <!-- Manual slot builder — hidden when Auto is on -->
                  <div x-show="!cfg.micAutoSlots">
                    <div class="mic-hint" style="margin-bottom:6px;color:var(--text-lo)">(click slot to edit · click criteria to toggle)</div>

                    <!-- Criteria picker — visible when a slot is selected -->
                    <div x-show="cfg.micActiveSlot !== null && cfg.micActiveSlot !== undefined && cfg.micActiveSlot < (cfg.micSlots||[]).length"
                         x-data="{ ratioFocus: null, ratioDir: '>', ratioTier: 5, gateFocus: null, gateDir: '>', gateTier: 1, ocFocus: null, ocDir: '>', ocVal: 100 }"
                         @click.outside="ratioFocus = null; gateFocus = null; ocFocus = null"
                         style="display:flex;gap:3px;flex-wrap:wrap;align-items:center;margin-bottom:7px;padding:6px 7px;background:rgba(255,255,255,.04);border-radius:3px;border:1px solid rgba(255,255,255,.08)">
                      <span style="font-size:9px;color:var(--text-lo);margin-right:2px">Slot <span x-text="(cfg.micActiveSlot)+1"></span>:</span>
                      <template x-for="c in ['fund','va','ioa','ocs','ocx','lta','lpa']" :key="c">
                        <button class="mic-opt"
                          @click.prevent="if(!cfgLocked){
                            if(c==='ioa'){
                              ratioFocus=(ratioFocus===c?null:c); gateFocus=null;
                              if(ratioFocus){ const ex=(cfg.micSlots?.[cfg.micActiveSlot]||[]).find(x=>x.startsWith(c)); if(ex){ const m=ex.match(/^ioa([<>])(-?\d+)$/); if(m){ratioDir=m[1];ratioTier=parseInt(m[2],10)} } }
                            } else if(c==='fund'||c==='va'||c==='lta'||c==='lpa'){
                              gateFocus=(gateFocus===c?null:c); ratioFocus=null; ocFocus=null;

        async init() {
          await _origInit.call(this);
          this._micLoaded = true;

          }
          if (!Array.isArray(this.cfg.megacapExclude)) this.cfg.megacapExclude = [...DEFAULT_MEGACAP_EXCLUDE];
          // Single source of truth for all other MIC scalar defaults — see MIC_DEFAULT_CFG above.
          // Call sites read this.cfg.<key> directly with no inline fallback, since this
          // guarantees every key below is present after init runs once.
          for (const [k, v] of Object.entries(MIC_DEFAULT_CFG)) {
            if (this.cfg[k] === undefined) this.cfg[k] = Array.isArray(v) ? [...v] : v;
          }
          if (Number(this.cfg.micOcxStep) === 0.1) this.cfg.micOcxStep = 1;
          // Fund tier step 0.25% -> 0.0025% (100x finer). Saved thresholded fund gates
          // (fund>N / fund<N) were written in old 0.25% tiers, so rescale them x100 once to keep the
          // same physical threshold, then move the step. Flag-guarded; legacy bare +fund/-fund are
          // untouched here (the legacy block below converts them using the NEW step directly).
          if (!this.cfg.micFundStepMigrated) {
            if (Number(this.cfg.micFundStep) === 0.25) {
              const _rs = c => { const m = typeof c === 'string' && c.match(/^fund([<>])(-?\d+)$/); return m ? `fund${m[1]}${parseInt(m[2],10) * 100}` : c; };
              if (Array.isArray(this.cfg.micSlots)) this.cfg.micSlots = this.cfg.micSlots.map(sl => Array.isArray(sl) ? sl.map(_rs) : sl);
              if (Array.isArray(this.cfg.micAutoSlotExclude)) this.cfg.micAutoSlotExclude = this.cfg.micAutoSlotExclude.map(_rs);
              this.cfg.micFundStep = 0.0025;
            }
            this.cfg.micFundStepMigrated = true;
            this.persist();
          }
          // Legacy migration: convert old +fund/-fund/>10pct/<10pct/bare lsa/lba/rasl/rabl to tiered form
          {
            const _fundStep   = this.cfg.micFundStep;
            const _frThr      = this.cfg.micFrThreshold;
            const _frTier     = Math.max(1, Math.ceil(_frThr / _fundStep));
            const _migCrit = c => {
              if (c === '+fund')   return `fund>${_frTier}`;
              if (c === '-fund')   return `fund<-${_frTier}`;
              return c;
            };
            const _legacyNames = new Set(['+fund','-fund']);
            if (Array.isArray(this.cfg.micSlots) && this.cfg.micSlots.some(s => s.some(c => _legacyNames.has(c)))) {
              this.cfg.micSlots = this.cfg.micSlots.map(s => s.map(_migCrit));
              this.persist();
            }
            if (Array.isArray(this.cfg.micAutoSlotExclude) && this.cfg.micAutoSlotExclude.some(c => _legacyNames.has(c))) {
              this.cfg.micAutoSlotExclude = this.cfg.micAutoSlotExclude.map(_migCrit);
              this.persist();
            }
          }
          // V/M, IO/T, IO/M, and every retired liquidation/PEC/VSG/regime tag no longer match
          // anything (see the migration above) — a manual slot still
          // referencing one will never qualify. Not auto-rewritten (va/ioa isn't a 1:1 semantic
          // substitution), just flagged once so it doesn't silently go dead.
          {
            const _retiredIn = s => s.filter(c => /^(vm|iot|iom|pec|vsg|regime|liqturnover|liqquiet|sliq|bliq|msliq|mbliq|0liq|past1)/.test(c));
            const _retiredSlots = (this.cfg.micSlots || []).map((s,i) => ({ i, crits: _retiredIn(s) })).filter(x => x.crits.length);
            if (_retiredSlots.length) this.log(`[MIC] ⚠️ ${_retiredSlots.length} manual slot(s) reference retired criteria and will never match — slot(s) ${_retiredSlots.map(x=>x.i+1).join(', ')}. Replace with fund / V/A / IO/A / OCS / OCX.`, 'warn');
          }
          this.registerRoleBadge?.(item => {
            if (!item || !item._mic) return null;
            const crits  = item._micCriteria || [];
            const emoji  = crits.map(c => critEmoji(c)).join('');
            const title  = crits.length ? 'Multi: ' + crits.map(c => critLabel(c)).join(' + ') : 'Multi-Indicator';
            return `<span style="font-family:var(--mono);font-size:9px;padding:2px 5px;border-radius:2px;letter-spacing:1px;border:1px solid rgba(255,150,80,.45);color:#ff9650;background:rgba(255,150,80,.10)" title="${title}">${emoji || 'Multi'}</span>`;
          });
          this.registerCloseReason?.('substitution', 'Sub');
          this.registerCloseReason?.('ejection', 'Eject');
          this.log(`[MIC] Multi-Indicator (Chaser) v${VERSION} loaded — ${this.cfg.micEnabled ? 'enabled' : 'disabled'} | ${(this.cfg.micSlots||[]).length} slots | ${this.cfg.micPicks}/cycle`, 'info');
          this.renderTradeFeed?.();
        },

        // Cascade/Sacrifice run on the position watcher (5s, tied to bot.running) rather than
        // the scan clock (5-60min) — collective uPnL can cross either threshold and back well
        // within a single scan interval, and a private setInterval here would keep firing even
        // while the bot is stopped since it isn't tied to the start/stop lifecycle like this is.
        async pseudoWatchPositions() {
          await _origWatch.call(this);
          await this._micCheckCascade();
          await this._micCheckSacrifice();
        },

        _micToggle(i, c) {
          const slots = (this.cfg.micSlots || []).map(s => [...s]);
          if (!slots[i]) return;
          const idx = slots[i].indexOf(c);
          if (idx === -1) slots[i].push(c); else slots[i].splice(idx, 1);
          this.cfg.micSlots = slots;
          this.persist?.();
        },

        _micDelSlot(i) {
          const slots = (this.cfg.micSlots || []).map(s => [...s]);
          slots.splice(i, 1);
          this.cfg.micSlots = slots;
          if (this.cfg.micActiveSlot !== null) {
            if (slots.length === 0) this.cfg.micActiveSlot = null;
            else if (this.cfg.micActiveSlot >= slots.length) this.cfg.micActiveSlot = slots.length - 1;
          }
          this.persist?.();
        },

        _micAddSlot() {
          const slots = (this.cfg.micSlots || []).map(s => [...s]);
          slots.push([]);
          this.cfg.micSlots = slots;
          this.cfg.micActiveSlot = slots.length - 1;
          this.persist?.();
        },

        // Collective uPnL and the resulting bail set both cover every open position, not just
        // MIC's own — a winning position from another strategy should be able to push the
        // portfolio into Cascade the same as a winning MIC position would, and a Sacrifice
        // shouldn't leave an untouched, unrelated position dominating the aggregate afterward.
        async _micCheckCascade() {
          if (!this.cfg.micCascadeEnabled) return;
          const allPositions = this.positions || [];
          if (!allPositions.length) return;
          const totalUPnL   = allPositions.reduce((s, p) => s + (p.upnl || 0), 0);
          const baseMargin  = (this.cfg.minNotional || 6) / (this.cfg.leverage || 6);
          const _pct        = this._micEffCascadePct();
          const threshold   = baseMargin * (_pct / 100);
          if (totalUPnL >= threshold) {
            this.log(`[MIC] 🌊 Cascade triggered — collective uPnL +${totalUPnL.toFixed(4)} ≥ ${threshold.toFixed(4)} USDT (${_pct.toFixed(1)}% of ${baseMargin.toFixed(4)} base margin) — bailing ${allPositions.length} position(s)`, 'info');
            if (this.cfg.ashfallCrossEnabled && typeof this._afCrossWrite === 'function') {
              this._afCrossWrite('cascade', null, { count: allPositions.length, pnl: totalUPnL });
            }
            this._logBatchBegin?.();
            try {
              for (const pos of allPositions) {
                await this.pseudoClosePosition(pos, 'cascade');
              }
            } finally { this._logBatchEnd?.('[MIC] 🌊 Cascade roll-up'); }
          }
        },

        async _micCheckSacrifice() {
          if (!this.cfg.micSacrificeEnabled) return;
          const allPositions = this.positions || [];
          if (!allPositions.length) return;
          const totalUPnL   = allPositions.reduce((s, p) => s + (p.upnl || 0), 0);
          const baseMargin  = (this.cfg.minNotional || 6) / (this.cfg.leverage || 6);
          const _pct        = this._micEffSacrificePct();
          const threshold   = -(baseMargin * (_pct / 100));
          if (totalUPnL <= threshold) {
            this.log(`[MIC] 🩸 Sacrifice triggered — collective uPnL ${totalUPnL.toFixed(4)} ≤ ${threshold.toFixed(4)} USDT (${_pct.toFixed(1)}% of ${baseMargin.toFixed(4)} base margin) — bailing ${allPositions.length} position(s)`, 'info');
            if (this.cfg.ashfallCrossEnabled && typeof this._afCrossWrite === 'function') {
              this._afCrossWrite('sacrifice', null, { count: allPositions.length, pnl: totalUPnL });
            }
            this._logBatchBegin?.();
            try {
              for (const pos of allPositions) {
                await this.pseudoClosePosition(pos, 'sacrifice');
              }
            } finally { this._logBatchEnd?.('[MIC] 🩸 Sacrifice roll-up'); }
          }
        },

        // Dry-run of pseudoOpenLong's tick-precision/notional/SL checks, without any of its
        // side effects (no ban, no log, no order placement) — just answers "would this candidate
        // actually be openable right now". Substitution calls this before closing anything, so a
        // candidate that would fail those checks (e.g. SL snaps to zero at this price/leverage)
        // never costs us the position we were about to swap out of. Kept local to MIC rather than
        // touching PseudoChaser's open path — see the SL/DCA validation block in pseudoOpenLong,
        // which this mirrors and must be kept in sync with if that logic ever changes.
        async _micCandidateOpenFeasible(sym, price) {
          if (!sym || !(price > 0)) return false;
          const instr = await this.getInstrInfo(sym);
          if (!instr) return false;
          if (instr.minPrice > 0 && price < instr.minPrice) return false;
          const lev       = this.cfg.leverage;
          const notional   = this.cfg.minNotional;
          const entryQty   = this.snapQty(notional / price, instr);
          if (entryQty <= 0) return false;
          const entryNotional = entryQty * price;
          if (instr.minOrderAmt > 0 && entryNotional < instr.minOrderAmt) return false;
          if (this._binaryMode()) {
            const bSlPct  = this.cfg.binarySlPct;
            const slPrice = this.snapPrice(price * (1 - bSlPct / 100 / lev), instr);
            if (!slPrice || slPrice <= 0) return false;
            return true;
          }
          const addPcts     = this._activeAddPcts();
          const addNotional = this.cfg.addNotional || notional;
          const stages      = Math.min(this.cfg.dcaStages || 1, addPcts.length);
          let runNotional = price * entryQty;
          let runSize     = entryQty;
          let prevPrice   = price;
          for (let i = 0; i < stages; i++) {
            const addPrice = this.snapPrice(price * (1 - addPcts[i] / 100), instr);
            if (!addPrice || addPrice <= 0 || addPrice >= prevPrice) return false;
            const addQty = this.snapQty(addNotional / addPrice, instr);
            if (addQty <= 0) { prevPrice = addPrice; continue; }
            runNotional += addPrice * addQty;
            runSize     += addQty;
            const expectedAvg = runNotional / runSize;
            const stageTpRoi  = this._tpRoi(i + 1);
            const stageTp     = this.snapPrice(expectedAvg * (1 + stageTpRoi / 100 / lev), instr);
            if (!stageTp || stageTp <= 0) return false;
            prevPrice = addPrice;
          }
          return true;
        },

        // Only meaningful when Co-Qualifying Penalty is on (Ashfall) — otherwise compositeScore
        // is always 0 for both sides and the margin check never clears, so this is a safe no-op.
        // No path restriction on what it can close — cross-strategy, any held position, same as
        // Liquid-Diver's version. The swap is still score-gated, not automatic.
        async _micTrySubstitute(pool, ctx) {
          if (this._micDefermentState().deferring) return false;
          if (!this.cfg.micSubstitutionEnabled || !pool?.length) return false;
          const now           = Date.now();
          const minAgeMs       = (this.cfg.micSubstitutionMinAgeMins) * 60000;
          const baseMargin     = (this.cfg.minNotional || 6) / (this.cfg.leverage || 6);
          const marginThreshold = baseMargin * ((this.cfg.micSubstitutionMarginPct) / 100);

          const eligible = (this.positions || []).filter(p => {
            if ((now - (p.openedAt || 0)) < minAgeMs) return false;
            return true;
          });
          if (!eligible.length) return false;

          // Recomputes the existing position's score live from its rolling-average
          // criteria (see _afPositionAvgCriteria/_afPositionCriteriaSample), same as the
          // candidate's own score is computed fresh each scan.
          const scoreOf = p => p._mic ? this._micLiveCompositeScore(p) : -Infinity;
          eligible.sort((a, b) => scoreOf(a) - scoreOf(b));
          const worst      = eligible[0];
          const worstScore = scoreOf(worst);
          // Pre-flight the Force-Evaluate top-up + block re-check that _micOpen runs, before anything is closed: the pool's
          // first-pass veto only saw pre-top-up criteria, so a candidate can still be blocked once top-up appends criteria,
          // and by then worst would already be gone. A blocked candidate falls through to the next one in the pool.
          let best = null;
          for (const cand0 of pool) {
            if ((cand0.compositeScore - worstScore) < marginThreshold) break;
            // Ranked on stored readings, so refetch and rescore before this candidate can displace a held position.
            let cand = cand0;
            if (ctx) {
              cand = await this._micVerify(cand0, ctx);
              if (cand === false) break;
              if (!cand || (cand.compositeScore - worstScore) < marginThreshold) continue;
            }
            if (this.cfg.micForceGeneralCriteria && this.cfg.micAutoSlots) {
              const full = await this._micTopUpGeneralCriteria(cand.t, cand.criteria);
              const ann  = (full || []).map(c => this._micAnnotateCritRaw(c, cand.t) ?? (c + '+0'));
              if (this._micIsEntryBlocked(ann)) {
                this.log(`[MIC] 🔁 Substitution skipped ${cand.t.symbol} — blocked once general criteria were topped up`, 'info');
                continue;
              }
              best = { ...cand, criteria: full };
            } else best = cand;
            break;
          }
          if (!best) return false;
          const _candPrice = parseFloat(best.t.lastPrice || 0);
          if (!(await this._micCandidateOpenFeasible(best.t.symbol, _candPrice))) {
            this.log(`[MIC] 🔁 Substitution skipped — ${best.t.symbol} would fail open-time checks (tick precision/notional) at ${_candPrice} — leaving ${worst.symbol} in place`, 'warn');
            return false;
          }

          this.log(`[MIC] 🔁 Substitution — closing ${worst.symbol} (score ${worstScore === -Infinity ? 'n/a' : worstScore.toFixed(4)}) for ${best.t.symbol} (score ${best.compositeScore.toFixed(4)}), Δ${(best.compositeScore - worstScore).toFixed(4)} ≥ ${marginThreshold.toFixed(4)} margin`, 'info');
          await this.pseudoClosePosition(worst, 'substitution');
          return await this._micOpen(best.t, best.criteria, best.slotIdx, best.compositeScore);
        },

        _extraStatusPills() {
          const d = this._micDefermentState();
          if (!d.deferring) return [];
          return [{
            pip:        'warn',
            pipStyle:   'background:rgba(255,160,0,.9)',
            label:      'No Entry',
            labelStyle: 'color:rgba(255,160,0,.9)',
            border:     'border-color:rgba(255,160,0,.45);background:rgba(255,160,0,.06)',
            title:      (d.weatherNeg != null ? `MIC deferment — new entries blocked (scorecard headline ${d.weatherNeg.toFixed(3)} < 0)` : d.bothRed ? `MIC deferment — new entries blocked (both poles of ${d.bothRed} are red)` : `MIC deferment — new entries blocked (scorecard: lowest resolved target ${d.low.toFixed(1)}% < min entry TP ${d.minTp}%)`) + (d.eject ? ' · ejecting all positions' : ''),
            action:     null,
          }];
        },

        // Target Halving — resolves this moment's targets from the Sample Scorer's relative headline S (signed favorable
        // share of raw move, see _afSampleWeather) against the recorded peak of S: factor = clamp(S / peak, 0, 1),
        // i.e. S at the peak -> the configured targets in full, S at an even share or below -> zero (a peak <= 0 -> zero). The configured Cascade %,
        // Sacrifice % and entry TP are therefore ceilings. Returns the configured targets untouched (active:false) when
        // Target Halving is off, Sample Scoring is off, or the scorecard has no usable value or peak yet — callers then behave
        // exactly as before (and Deferment's floor path is off).
        _micTargets() {
          const baseTp = Number(this.cfg.binaryModeEnabled ? (this.cfg.binaryTpPct ?? 18) : this.cfg.entryTpRoi) || 18;
          const out = { active: false, factor: 1, slPct: null, entryTp: baseTp, cascadePct: this.cfg.micCascadePct, sacrificePct: this.cfg.micSacrificePct, minTp: Math.max(0, Number(this.cfg.micMinEntryTp) || 0), wx: null };
          if (!this.cfg.micTargetHalvingEnabled || !(this.cfg.micCascadeEnabled || this.cfg.micSacrificeEnabled) || !this.cfg.afSampleScoringEnabled) return out;
          if (typeof this._afSampleWeather !== 'function' || typeof this._afLukewarmFavoredSide !== 'function') return out;
          const wx = this._afSampleWeather(this._afLukewarmFavoredSide());
          if (!wx || wx.s == null || wx.sHi == null) return out;
          const f = wx.sHi > 0 ? Math.max(0, Math.min(1, wx.s / wx.sHi)) : 0;
          out.active = true; out.factor = f; out.wx = wx;
          out.entryTp = baseTp * f;
          // New positions' SL scales the same way (tighter in a poor market), off whichever SL the host is using (binary or DCA), never under 1%.
          const baseSl = Number(this.cfg.binaryModeEnabled ? (this.cfg.binarySlPct ?? 18) : (this.cfg.dcaSlPct ?? 16)) || 16;
          out.slPct = Math.max(1, baseSl * f);
          out.cascadePct = this.cfg.micCascadePct * f;
          out.sacrificePct = this.cfg.micSacrificePct * f;
          return out;
        },
        // What Cascade / Sacrifice actually fire at: the resolved value, but never below the Min Entry TP floor (and never
        // under 1%) — a target at ~0 would bail everything on the first non-negative / slightly negative tick.
        _micEffCascadePct() { const t = this._micTargets(); return t.active ? Math.max(t.minTp, 1, t.cascadePct) : this.cfg.micCascadePct; },
        _micEffSacrificePct() { const t = this._micTargets(); return t.active ? Math.max(t.minTp, 1, t.sacrificePct) : this.cfg.micSacrificePct; },
        // One-line readout for the Exit tab.
        _micTargetsText() {
          if (!this.cfg.micTargetHalvingEnabled || !(this.cfg.micCascadeEnabled || this.cfg.micSacrificeEnabled)) return '';
          if (!this.cfg.afSampleScoringEnabled) return 'Inactive — turn Sample Scoring on (Ashfall) to feed it.';
          const t = this._micTargets();
          if (!t.active) return 'Waiting for a scorecard value and peak (needs 10+ samples carrying a raw move).';
          const low = Math.min(t.entryTp, this.cfg.micCascadeEnabled ? t.cascadePct : Infinity);
          return `Now: share ${(t.wx.share * 100).toFixed(1)}% (×${t.factor.toFixed(2)}) · entry TP ${t.entryTp.toFixed(1)}% · SL ${t.slPct.toFixed(1)}% · cascade ${t.cascadePct.toFixed(1)}% · sacrifice ${t.sacrificePct.toFixed(1)}%` + (low < t.minTp ? ' — below floor: deferring' : '');
        },

        // Deferment — regime proxy. Defers (no new entries) while the Sample Scorer headline is negative; the Target Halving
        // floor is its own separate stop. Both need Sample Scoring.
        // eject: two or more deferment paths in effect at once -> Ejection bails every open position.
        // Both-poles-red: the first criterion (dial family) whose + and - poles are BOTH proven and negative on the
        // scorecard side the chart shows (same favored side as Target Halving). No entry pole to favor = no good entry.
        _micBothPolesRed() {
          if (typeof this._afLukewarmFavoredSide !== 'function') return null;
          const list = (this.afLukewarmScoreboard || {})[this._afLukewarmFavoredSide()] || [];
          const min = Math.max(3, this.cfg.afExtremityMinSamples || 3);
          const by = {};
          for (const e of list) if (e && e.pnl < 0 && !(typeof e.n === 'number' && e.n < min)) (by[e.family] ||= {})[e.pole] = true;
          for (const [fam, p] of Object.entries(by)) if (p.pos && p.neg) return fam;
          return null;
        },
        // The Sample Scorer headline when it is negative (else null) — same value/side the gauge shows. Needs Sample Scoring.
        _micWeatherNeg() {
          if (!this.cfg.afSampleScoringEnabled || typeof this._afSampleWeather !== 'function' || typeof this._afLukewarmFavoredSide !== 'function') return null;
          const wx = this._afSampleWeather(this._afLukewarmFavoredSide());
          return (wx && wx.value != null && wx.value < 0) ? wx.value : null;
        },
        _micDefermentState() {
          const base = this._micDefermentStateBase();
          // Every deferment path is evaluated on its own; two or more in effect at once = Ejection (bail-all).
          // Display priority is unchanged: negative headline, then both poles red, then the base reason.
          const wn = this.cfg.micDefermentEnabled ? this._micWeatherNeg() : null;
          const fam = (this.cfg.micDefermentEnabled && this.cfg.micDeferBothRedEnabled) ? this._micBothPolesRed() : null;
          const why = [];
          if (wn != null) why.push('negative headline');
          if (fam) why.push(`both poles of ${fam} red`);
          if (base.deferring) why.push('target under min entry TP');
          if (!why.length) return base;
          return Object.assign({}, base, { deferring: true, eject: why.length >= 2, why }, wn != null ? { weatherNeg: wn } : {}, fam ? { bothRed: fam } : {});
        },
        _micDefermentStateBase() {
          const off = { deferring: false, eject: false };
          // Target Halving (scorecard) mode — whenever it has a usable scorecard value: defer while
          // the resolved entry TP, or the resolved Cascade target (if Cascade is on), is under the Min Entry TP floor.
          // Independent of the Deferment toggle itself (the floor is Target Halving's own stop).
          const tg = this._micTargets();
          if (tg.active) {
            const low = Math.min(tg.entryTp, this.cfg.micCascadeEnabled ? tg.cascadePct : Infinity);
            if (!(low < tg.minTp)) return off;
            return { deferring: true, eject: false, scorecard: true, low, minTp: tg.minTp, wx: tg.wx };
          }
          return off;
        },

        // Ejection: bail-all — closes every open position (any held position, same reach as substitution) as soon as
        // two or more deferment paths are in effect at once. Called once per scan.
        async _micEject(def) {
          const cands = (this.positions || []).filter(p => !p.isPending);
          if (!cands.length) return;
          this.log(`[MIC] ⏏️ Ejection — ${def.why.length} deferment paths in effect (${def.why.join(' + ')}); closing all ${cands.length} position${cands.length === 1 ? '' : 's'}`, 'warn');
          for (const p of cands) {
            try { await this.pseudoClosePosition(p, 'ejection'); }
            catch (e) { this.log(`[MIC] ⏏️ Ejection error (${p.symbol}): ${e.message}`, 'warn'); }
          }
        },


        // ── Scan stages (MIC) ────────────────────────────────────────────────────
        // Stages hand data forward on ctx.mic; a stage returning false ends the mic group for this scan.
        // Registered with the host's scan pipeline from the bottom of transform(); on a host without
        // the pipeline _micRunScan below runs them back to back from the runScan wrap.
        async _micScanPrep(ctx) {
          if (!this.cfg.micEnabled) return false;
          const _micHalted = !!(this._isDrawdownHalted?.() || this._isGainsLocked?.());
          if (_micHalted) {
            if (!this._micHaltLogged) { this.log(`[MIC] 💡 Halted — ${this._isGainsLocked?.() ? 'gains lock' : 'drawdown halt'} active; hist scoring continues`, 'info'); this._micHaltLogged = true; }
          } else {
            this._micHaltLogged = false;
          }

          const allTickers = this._lastAllTickers || [];
          if (!allTickers.length) return false;

          // Rebuild block state from Extremity Scorer immediately before any slot or pool decisions
          this._afExtremityBuild?.();
          this._schIdleCancel?.('af-build'); // this rebuild supersedes the one AF queued for scan end

          // Open-Position Rolling-Average Criteria refresh (see Ashfall-Chaser's
          // _afPositionCriteriaSample, which does its own fresh per-symbol fetch — the bulk
          // allTickers list is only the universe and can be hours old) — runs every cycle regardless of
          // whether any entry slot is active, since positions can still be open with none
          // configured. Only ever touches the handful of currently-open symbols, so it isn't
          // gated behind the follower no-own-fetch rule the rest of this scan is subject to.
          if (this.positions?.length) {
            for (const pos of this.positions) {
              await this._afPositionCriteriaSample?.(pos);
            }
          }

          // Deferment/Ejection — every cycle, ahead of any slot logic so it still runs with no
          // active entry slots. Ejection (bail-all) fires when two or more deferment paths are in effect.
          const _micDef = this._micDefermentState();
          if (!_micDef.deferring) this._micDeferLogged = false;
          else if (_micDef.eject) await this._micEject(_micDef);

          // Entry slots — Auto mode has no generated slot list any more (see _micAutoQualify);

        async _micScanFetch(ctx) {

        async _micScanEntry(ctx) {

          if (_micHalted) return;

          const openedParts   = slotOpened.map((n, i) => n > 0 ? (n > 1 ? `s${i+1}(${n})` : `s${i+1}`) : null).filter(Boolean);

          this.log(`[MIC] 💡 ${entryPool.length} qualified — ${opened} opened${_micBlockNote}${openedNote}`, 'info');
        },
        // Pre-entry refetch of a ranked candidate. The ranking runs on each ticker's latest stored reading, however old, so before a
        // candidate opens (or displaces a position) its ticker, OC and 1hr data are read fresh and the slot match, veto and score rerun

        // underscore-copy loop, before the position is pushed to this.positions) rather than
        // mutated onto the returned position afterward. Resuming this function after the
        // `await pseudoOpenLong(...)` is a microtask boundary — Alpine's reactive render queued
        // from the push could otherwise run before a later `pos._micCriteria = ...` assignment,
        // rendering the position badge as "Multi" (empty criteria) for one frame even though the
        // underlying data was always correct by the time anything read it again (e.g. on close).
        async _micOpen(t, criteria, slotIdx, compositeScore) {
          if (this._micDefermentState().deferring) return false;
          const sym   = t.symbol;
          let price = parseFloat(t.lastPrice || 0);
          if (!price) return false;

          // (bounded by picks/maxPos), not the whole scan pool — see _micTopUpGeneralCriteria.

          // actual-open annotation path, not just scan-time pool building, so a position's
          // own qualifying readings count toward the cutoff too.

          // the match _micIsEntryBlocked already cleared for entryPool. Re-check against the
          // now-possibly-expanded annotCrits before actually opening; entryPool's own check stays
          // as the first, cheaper pass, this is the one that has to hold once the real criteria
          // list is final.

              && this._micIsEntryBlocked(annotCrits)) {

          this._micPending = (this._micPending || 0) + 1;

            if (!this._afTickerIsCurrent?.(t)) try {

              _mic: true,

              _micSlotIdx: slotIdx ?? 0,
              _micCompositeScore: compositeScore ?? 0,
              _micCriteria: annotCrits,
              _micRawCriteria: criteria, // kept alongside annotCrits so substitution can
                                          // recompute a live score later (see _micLiveCompositeScore)

        },

        // fund and one side each of OCS/OCX/IO/A are expected to resolve for virtually any ticker
        // once real data exists, so a match can end up missing several of them purely because the

        // forced and uncapped, for this one symbol — cheap here since _micOpen only ever runs for

          // rather than opening with OC criteria silently unscored. Every other caller of this
          // leaves the flag off, so scan-time pool building still fetches nothing on a follower.

              if (r) { if (!this.afOcResults) this.afOcResults = {}; this.afOcResults[sym] = r; }
            })());

          // nothing (own cache or the leader's shared batch) already has it.

        _micAnnotateCritRaw(c, t) {
          if (/^va/.test(c)) { const val = parseFloat(t.turnover24h || 0); const w = this._afVolIoWindowAvg?.('vol'); const step = this.cfg.micVaStep; const tier = (val && w) ? Math.floor((Math.log(val / w) * 100) / step) : 0; return `va${tier>=0?'+':''}${tier}`; }
          if (/^ioa/.test(c)) { const val = parseFloat(t.openInterestValue || 0); const w = this._afVolIoWindowAvg?.('oi'); const step = this.cfg.micIoaStep; const tier = (val && w) ? Math.floor((Math.log(val / w) * 100) / step) : 0; return `ioa${tier>=0?'+':''}${tier}`; }
          if (/^fund/.test(c)) { const step = this.cfg.micFundStep; const fr_ = parseFloat(t.fundingRate||0)*100; const tier = Math.trunc(fr_ / step); return `fund${fr_<0?'-':'+'}${Math.abs(tier)}`; }
          if (/^ocs/.test(c)) { const _a = this._afOcAccumSkew?.(t.symbol); const _live = this.afOcResults?.[t.symbol]?.live ? this.afOcResults[t.symbol] : null; const bc=(_a?.bc||0)+(_live?.bc||0), sc=(_a?.sc||0)+(_live?.sc||0); const tot = bc+sc; const buyPct = tot ? bc/tot*100 : 50; const step = this.cfg.micOcsStep; const tier = Math.floor((buyPct-50)/step); return `ocs${tier>=0?'+':''}${tier}`; }
          if (/^ocx/.test(c)) { const _r = this.afOcResults?.[t.symbol]; const _avg = _r?.avgMs ?? this._afOcLatestAvgMs?.(t.symbol); const _w = this._afOcWindowAvgMs?.(); const step = this.cfg.micOcxStep; const tier = (_avg!=null && _w) ? Math.floor(((_w - _avg) / _w * 100) / step) : 0; return `ocx${tier>=0?'+':''}${tier}`; }
          if (/^lta/.test(c)) { const tier = this._micHourTier('lta', t); return tier == null ? null : `lta${tier>=0?'+':''}${tier}`; }
          if (/^lpa/.test(c)) { const tier = this._micHourTier('lpa', t); return tier == null ? null : `lpa${tier>=0?'+':''}${tier}`; }
          return c;
        },
        // LTA/LPA tier for one ticker, or null when its 1hr candle (or, for LPA, the window
        // baseline) isn't available. LTA: % deviation of last-hour turnover from the ticker's own
        // 24h/24, per micLtaStep. LPA: percentage-point gap between its 1hr price change and the
        // mean of every other ticker in the window, per micLpaStep.
        _micHourTier(kind, t) {
          const hr = this._afHourReadingWide?.(t.symbol);
          if (!hr) return null;
          if (kind === 'lta') {
            const dev = this._afLtaDev?.(hr.ht, t.turnover24h);
            return dev == null ? null : Math.floor(dev / this.cfg.micLtaStep);
          }
          const avg = this._afLpaWindowAvg?.(t.symbol);
          if (avg == null || typeof hr.hc !== 'number') return null;
          return Math.floor((hr.hc - avg) / this.cfg.micLpaStep);
        },

        _micCheckCrit(c, fr, t, ocResults) {
          if (/^fund/.test(c)) {
            const step = this.cfg.micFundStep;
            const tier = Math.trunc(fr / step); // toward zero, matches the annotated tag (fund-0 = tiny negative)
            const m = c.match(/^fund([<>])(-?\d+)$/);
            // Bare 'fund' (Auto mode's un-thresholded form) registers on any finite rate directly (fr,
            // not tier): real Bybit funding rates mostly sit well under a single micFundStep, so gating
            // on tier would almost never fire. The tier is still computed above and drives the
            // fund>N/fund<N thresholded forms and the annotated tag's magnitude.
            if (!m) return Number.isFinite(fr); // any rate incl. exactly 0 — zero/near-zero funding is a real (lukewarm) reading
            return m[1] === '>' ? tier >= parseInt(m[2],10) : tier <= parseInt(m[2],10);
          }
          if (/^va/.test(c)) {
            const val = parseFloat(t.turnover24h || 0);
            const windowAvg = this._afVolIoWindowAvg?.('vol');
            if (!val || !windowAvg) return false;
            const step = this.cfg.micVaStep;
            const tier = Math.floor((Math.log(val / windowAvg) * 100) / step);
            const m = c.match(/^va([<>])(-?\d+)$/);
            if (!m) return true;
            return m[1] === '>' ? tier >= parseInt(m[2],10) : tier <= parseInt(m[2],10);
          }
          if (/^ioa/.test(c)) {
            const val = parseFloat(t.openInterestValue || 0);
            const windowAvg = this._afVolIoWindowAvg?.('oi');
            if (!val || !windowAvg) return false;
            const step = this.cfg.micIoaStep;
            const tier = Math.floor((Math.log(val / windowAvg) * 100) / step);
            const m = c.match(/^ioa([<>])(-?\d+)$/);
            if (!m) return true;
            return m[1] === '>' ? tier >= parseInt(m[2], 10) : tier <= parseInt(m[2], 10);
          }
          if (/^(ocs|ocx)/.test(c)) {
            const _ocR = (ocResults || this.afOcResults || {})[t.symbol];
            const m = c.match(/^(ocs|ocx)([<>])(-?\d+)$/);
            const kind = c.startsWith('ocs') ? 'ocs' : 'ocx';
            if (kind === 'ocs') {
              // Accumulated across the retained sample window (_afOcAccumSkew), not just this
              // ticker's most recent batch — a fresh, not-yet-historied live sample (tagged
              // `live` by _ocFetchSingle) folds in on top without double-counting once a later
              // batch fetch pushes the same cycle into history for real.
              const _a = this._afOcAccumSkew?.(t.symbol);
              const _live = _ocR?.live ? _ocR : null;
              const bc = (_a?.bc||0) + (_live?.bc||0), sc = (_a?.sc||0) + (_live?.sc||0);
              const tot = bc + sc; if (!tot) return false;
              if (!m) return true;
              const [, , dir, valStr] = m; const val = parseInt(valStr, 10);
              const buyPct = bc / tot * 100;
              const step = this.cfg.micOcsStep;
              const tier = Math.floor(buyPct / step);
              return dir === '>' ? tier >= val : tier <= val;
            }
            if (kind === 'ocx') {
              // Falls back to this symbol's latest windowed avgMs when the current cycle's
              // batch didn't happen to sample it — see _afOcLatestAvgMs. The pre-entry top-up
              // fetch (gated on afOcResults directly, above) still refreshes it before entry.
              const avgMsForSym = _ocR?.avgMs ?? this._afOcLatestAvgMs?.(t.symbol);
              if (avgMsForSym == null) return false;
              if (!m) return true;
              const [, , dir, valStr] = m; const val = parseInt(valStr, 10);
              // Percentage deviation from the full-window population average (see
              // _afOcWindowAvgMs), not an absolute seconds threshold — positive tier means
              // faster than the window average, negative means slower. No minimum-ticker
              // floor on the window: a thin or cold-start window is intentionally left
              // unstable rather than gated off.
              const windowAvg = this._afOcWindowAvgMs();
              if (windowAvg == null || windowAvg <= 0) return false;
              const pctDev = (windowAvg - avgMsForSym) / windowAvg * 100;
              const step = this.cfg.micOcxStep;
              const tier = Math.floor(pctDev / step);
              return dir === '>' ? tier >= val : tier <= val;
            }
          }
          if (/^(lta|lpa)/.test(c)) {
            const tier = this._micHourTier(c.slice(0, 3), t);
            if (tier == null) return false;
            const m = c.match(/^(?:lta|lpa)([<>])(-?\d+)$/);
            if (!m) return true;
            return m[1] === '>' ? tier >= parseInt(m[2], 10) : tier <= parseInt(m[2], 10);
          }
          return false;
        },

        // Co-Qualifying Penalty scoring for one criterion. Base rank is looked up from the
        // ticker's actual annotated tier (e.g. "fund+3" -> "fund+"), matching exactly how the
        // Extremity Scorer collapses closes into dial-pole buckets (see _afExtremityBuild).
        // This drives ticker ordering (compositeScore sort in the entry pool) as well as the
        // co-qualification penalty itself. ranksOverride (used by the substitute-check path)
        // still wins when explicitly supplied.
        _micScaledRank(rawC, annotC, ranksOverride) {
          const ranks = ranksOverride ?? (this.cfg.afCoQualPenaltyEnabled ? (this.micCollapsedSlotRanks || {}) : null);
          if (!ranks) return 0;
          const annotKey = (annotC || '').replace(/\d+$/, '');
          const base = ranks[annotKey] ?? 0;
          if (!base) return 0;
          // Depth = distance past the slot's own gate threshold, in the qualifying direction —
          // NOT raw tier magnitude. For a ">" gate, a higher tier is further past threshold and
          // deeper. For a "<" gate, a LOWER tier is further past threshold and deeper — using
          // raw magnitude there would score a barely-qualifying ticker as "deeper" than one
          // that qualifies strongly, which is backwards.
          const annotM = (annotC || '').match(/([+-]?\d+)$/);
          const tierVal = annotM ? parseInt(annotM[1], 10) : 0;
          const gateM = rawC.match(/([<>])(-?\d+)$/);
          let depth = Math.abs(tierVal);
          if (gateM) {
            const threshold = parseInt(gateM[2], 10);
            depth = gateM[1] === '>' ? Math.max(0, tierVal - threshold) : Math.max(0, threshold - tierVal);
          }
          // Fund tiers are now {0.0025%} each; normalise its depth back to the old 0.25%-tier scale so
          // the finer step doesn't inflate fund's co-qual weight ~100x relative to the other criteria.
          if (/^fund/.test(annotKey)) depth = depth * (this.cfg.micFundStep / 0.25);
          const depthPct = (this.cfg.afCoQualDepthPct ?? 10) / 100;
          return base * (1 + depth * depthPct);
        },
        // Live version of the compositeScore frozen at open — used by substitution so an
        // existing position is judged on where it stands NOW, not where it stood at entry.
        // Falls back to the frozen score if raw criteria weren't stored (older positions
        // opened before _micRawCriteria existed) or Co-Qual scoring is off.
        _micLiveCompositeScore(pos) {
          if (!pos._micRawCriteria?.length) return pos._micCompositeScore ?? 0;
          const avgAnnot = this._afPositionAvgCriteria?.(pos) || pos._micCriteria || [];
          return pos._micRawCriteria.reduce((s, c, i) => s + this._micScaledRank(c, avgAnnot[i]), 0);
        },

        // Shared collapsed-rank lookup (own + partner + historical PnL, see micCollapsedSlotRanks)
        // for a single criterion key. Every criterion's rank accumulates under a sign-suffixed key
        // (e.g. 'fund-', 'va+'), so both variants are summed.
        _micCritScore(c) {
          const ranks = this.micCollapsedSlotRanks || {};
          return (ranks[c] ?? 0) + (ranks[c + '+'] ?? 0) + (ranks[c + '-'] ?? 0);
        },

        // The Extremity Scorer's whole-ticker lukewarm veto (see _afExtremityVeto in
        // Ashfall-Chaser — "explicitly avoid any ticker exhibiting lukewarm values").
        _micIsEntryBlocked(annotCrits) {
          if (this._afExtremityVeto?.(annotCrits)) return true;
          const pb = this._micPoleBlocked(annotCrits);
          if (pb) { (this._micPoleBlockNotes ||= new Set()).add(pb); return true; }
          return false;
        },

        // Pole Blocking (Sample Scoring only). On the scorecard side the chart shows, a dial family whose partner pole is
        // non-positive pole blocks when the spread to its positive partner, measured against the smaller of the two
        // magnitudes, reaches pct%: (Q - P) / min(|P|, Q) >= pct/100. Absolute gap, no magnitude floor; both poles must be
        // proven. A positive pole is never blocked; a non-positive partner is left to Deferment.
        // Returns a short note for the first blocked tag in annotCrits, else null.
        _micPoleBlocked(annotCrits) {
          if (!this.cfg.micPoleBlockEnabled || !this.cfg.afSampleScoringEnabled || typeof this._afLukewarmFavoredSide !== 'function') return null;
          const list = (this.afLukewarmScoreboard || {})[this._afLukewarmFavoredSide()] || [];
          const min = Math.max(3, this.cfg.afExtremityMinSamples || 3);
          const T = Number(this.cfg.micPoleBlockPct), pct = Number.isFinite(T) ? Math.max(0, T) : 200;
          const edge = {};
          for (const e of list) if (e && typeof e.n === 'number' && e.n >= min && typeof e.pnl === 'number') (edge[e.family] ||= {})[e.pole] = e.pnl;
          for (const c of (annotCrits || [])) {
            let fam, sign, m = String(c).match(/^(fund|va|ioa|ocs|ocx|lta|lpa)([+-])\d*$/);
            if (m) { fam = m[1]; sign = m[2]; }
            else if ((m = String(c).match(/^([+-])(fund|ocs)$/))) { sign = m[1]; fam = m[2]; }
            else continue;
            const e = edge[fam]; if (!e) continue;
            const P = e[sign === '+' ? 'pos' : 'neg'], Q = e[sign === '+' ? 'neg' : 'pos'];
            if (P == null || Q == null || !(Q > 0) || P > 0) continue;
            const den = Math.min(Math.abs(P), Q), gap = den > 0 ? (Q - P) / den * 100 : Infinity;
            if (gap > 0 && gap >= pct) return `${fam}${sign} ${P.toFixed(3)}pp vs ${Q.toFixed(3)}pp (${Number.isFinite(gap) ? Math.round(gap) + '%' : '∞'} gap)`;
          }
          return null;
        },

        // Reads the same shared graylist the host writes on every close (any strategy, keyed by
        // symbol) — a symbol stays blocked for one bulk-ticker cooldown window after its position
        // closes. 'both' (default) blocks regardless of win/loss; 'losers' lets a symbol that
        // just closed in profit re-trigger immediately. Ported from Liquid-Diver.
        _micIsReentryBlocked(sym) {
          const g = this._tickerGraylist?.[sym];
          if (!g || !(g.ts > 0)) return false;
          const ttl = this.cfg.bulkTickerCooldownHours * 3600000;
          if (Date.now() - g.ts >= ttl) return false;
          if ((this.cfg.micReentryBlockMode) === 'losers') return g.isWin === false;
          return true;
        },
        // Auto's minimum-gate qualifier. "Criteria per Slot" (micAutoSlotSize) is a FLOOR, not a
        // fixed count: this evaluates EVERY non-excluded secondary criterion against the ticker
        // and qualifies once at least that many are true. Every true criterion is kept — a
        // ticker exhibiting 5 genuine criteria is scored on all 5, not sliced down to however
        // many the slider happens to say. checkFn(c) -> bool and annotFn(c) -> annotated string
        // are supplied by the caller.
        _micAutoQualify(checkFn, annotFn) {
          const exclude = new Set(this.cfg.micAutoSlotExclude || []);
          const need = Math.max(0, this.cfg.micAutoSlotSize);
          const trueCrits = [];
          for (const c of SECONDARY_CRITS) {
            if (exclude.has(c)) continue;
            if (checkFn(c)) trueCrits.push(c);
          }
          if (trueCrits.length < need) return null;
          return { criteria: trueCrits, annotCrits: trueCrits.map(c => annotFn(c)) };
        },

        // True if Auto mode could produce a qualifying match at all right now — i.e. enough
        // non-excluded secondary criteria exist to ever reach the minimum. Auto's equivalent of
        // "any active slots" now that there's no generated slot list to check.
        _micAutoActive() {
          if (!this.cfg.micAutoSlots) return false;
          const exclude = new Set(this.cfg.micAutoSlotExclude || []);
          const secAvail = SECONDARY_CRITS.filter(c => !exclude.has(c)).length;
          return secAvail >= this.cfg.micAutoSlotSize;
        },

        // Manual mode only now — Auto no longer generates a slot list (see _micAutoQualify).
        _micEffectiveSlots() {
          const filtered = (this.cfg.micSlots || []).filter(s => s.length > 0);
          if (!Object.keys(this.micCollapsedSlotRanks || {}).length) return filtered;
          return filtered.slice().sort((a, b) => {
            const sa = a.reduce((s, c) => s + this._micCritScore(c), 0);
            const sb = b.reduce((s, c) => s + this._micCritScore(c), 0);
            return sb - sa;
          });
        },

      }, _hostStages
        ? { _scanStageDefs: [...def._scanStageDefs,
            { id: 'mic-prep',  group: 'mic', run: function (ctx) { return this._micScanPrep(ctx); } },
            { id: 'mic-fetch', group: 'mic', run: function (ctx) { return this._micScanFetch(ctx); } },
            { id: 'mic-pool',  group: 'mic', run: function (ctx) { return this._micScanPool(ctx); } },
            { id: 'mic-entry', group: 'mic', run: function (ctx) { return this._micScanEntry(ctx); } },
          ] }
        : { async runScan() {
            await _origScan.call(this);
            await this._micRunScan();
          } });
    },
  };
})();
</script>
