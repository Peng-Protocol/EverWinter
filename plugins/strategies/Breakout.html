<!--
  Breakout Plugin for PseudoChaser and PseudoWinter (unified)
  Random cond. bundles at each ticker's own average top and bottom moves, re-bundled after a loss until the ticker wins. No scoring, no forecasting, no volume watch.

  Each batch picks random tickers (up to Max bundles; one bundle per ticker) and reads the last twenty-four closed 1hr candles of each. The candles are split by colour: the green candles (close above open) give the
  average TOP move, the mean of (high - open) / open, in %; the red candles (close below open) give the average BOTTOM move, the mean of (open - low) / open, in %. Doji candles count for neither; a ticker with no green
  or no red candle among the 24 is skipped.

  The bundle: two cond. entry orders on the ticker, one ABOVE the price at one average top move, one BELOW it at one average bottom move. They share one host bundle ('bo'), so the pair takes ONE cond. slot and the
  first to fill cancels the other. The filled order opens on the bot's side at its price (Chaser long, Winter short). TP / SL come from the same averages, measured from the fill (Chaser: TP = top move, SL = bottom move;
  Winter: TP = bottom move, SL = top move). Nothing about the ticker is predicted: which edge fills is up to the price.

  Hold: a bundle stands for Order life (default 1440 min), then it is cancelled. There is no watch and no poll, the host's own cond. watcher does the filling.

  Retry: when a Breakout position closes at a loss (the host's net result, fees and funding included), its ticker is scheduled for another bundle, built fresh from the latest 24 candles. The next batch places the scheduled
  tickers first, then fills the rest at random. A ticker stays scheduled until one of its Breakout positions closes at a win; a bundle that expires unfilled does not clear it, the ticker is bundled again. A scheduled ticker is dropped
  only when it fails a filter (graylisted) or is banned by the host.

  Max positions: once open positions reach the host's Max Positions, every pending bundle is cancelled and no new ones are placed (scheduled tickers wait). They resume when a slot frees.
  A bundle also needs a free host cond. slot (Max Cond. Orders); Max bundles is the plugin's own limit on top of it.

  Two fixed filters run before every bundle (no toggles):
    Stablecoin   — the 24 candles' full span (lowest low to highest high) must be at least 1%, else the ticker is a stablecoin.
    Illiquidity  — the last 3 trades are fetched; if they average more than 12s apart the ticker is illiquid.
  A ticker failing either is graylisted for a week. A ticker confirmed liquid is whitelisted for a week and skips the trade fetch.

  TP / SL are set at entry only in Binary Mode, so Binary Mode must be on (the plugin places nothing otherwise).
  Needs no other plugin. The side is read from the host at load.

  Load via Plugin Manager in either bot's config panel, AFTER SunChaser / EverWinter if live.
  targetBot: both
-->
<script>
(function () {
  'use strict';

  const VERSION = '1.29.1'; // Change: the retry counter lists its tickers with the new bundles each has had, on hover | 1.29.0: restructured to random cond. bundles at the average top / bottom moves, held for Order life, re-bundled after a loss until a win; Both, On break, Funding, Cull, volume watch and break counter removed | previous: 1.28.0 — Funding Cull
  let   WINTER  = false;   // set in transform() from the host
  const CANDLES = 24;      // closed 1hr candles the top / bottom moves are read from
  const HOUR_MS = 3600000;
  const BUNDLE_MAX  = 100;         // most bundles at once (the host's Max Cond. Orders slider tops out at the same)
  const BO_NAME = e => (e === 'top' ? 'Top' : 'Bottom');
  const MIN_SPAN_PCT = 1;          // stablecoin filter: least % span the 24 candles must cover
  const MAX_GAP_MS   = 12000;      // illiquidity filter: most average ms between the last 3 trades
  const GRAY_MS      = 7 * 86400000; // graylist time for a ticker that fails either filter

  const BO_DEFAULT_CFG = Object.freeze({
    boEnabled: true,   // Breakout mode
    boMaxBundles: 30,  // Max bundles: how many tickers hold a cond. bundle at once (1-100)
    boLifeMins: 1440,  // Order life: how long a bundle stands before it is cancelled
    boRedo: {},       // symbol -> { n: losses so far, t: ms of the last loss, b: new bundles given since the first loss }; stays until the ticker wins
    boClosedMark: 0,   // closedAt of the newest closed trade already settled (win / loss)
    boWhite: {},       // symbol -> epoch ms it was confirmed liquid; skips the trade fetch for a week
    boGray: {},        // symbol -> epoch ms it was graylisted (stablecoin / illiquid), kept a week
  });

  window.__BotPlugin = {
    id:        'breakout',
    name:      'Breakout',
    version:   VERSION,
    targetBot: 'both',
    after:     ['sunchaser', 'everwinter'],
    before:    [],
    conflicts: [],
    requires:  [],
    touches:   ['init', 'runScan', 'pseudoWatchCondOrders', '_condTrigger', '_ewCondFilled', '_scCondFilled'],
    css: `
      :root { --bo-rgb:255,200,60; --bo-acc:#ffc83c; }
      .bo-hint { font-size:9px; color:var(--text-lo); margin-top:3px; line-height:1.5; }
      .bo-info { display:inline-flex; align-items:center; justify-content:center; width:12px; height:12px; margin-left:6px; padding:0; border-radius:50%; border:1px solid rgba(var(--bo-rgb),.35); background:transparent; color:var(--bo-acc); font:700 8px/1 var(--mono); cursor:pointer; flex:none; vertical-align:middle; }
      .bo-info.on { background:rgba(var(--bo-rgb),.15); }
      .bo-live { position:relative; margin-top:8px; padding:3px 8px; border:1px solid rgba(var(--bo-rgb),.28); border-left:3px solid var(--bo-acc); border-radius:4px; background:rgba(var(--bo-rgb),.05); font-family:var(--mono); font-size:10px; color:var(--text-hi); }
      .bo-lr { position:relative; display:flex; align-items:center; gap:7px; padding:4px 0; cursor:help; }
      .bo-ttl { font-weight:700; letter-spacing:2px; color:var(--bo-acc); }
      .bo-cnt { color:var(--text-lo); } .bo-cnt b { margin-left:2px; color:var(--text-hi); }
      .bo-blink { color:var(--warn); animation:bo-blink 1.6s infinite; }
      @keyframes bo-blink { 50% { opacity:.4; } }
      .bo-pop { position:absolute; left:0; right:0; top:100%; z-index:20; margin-top:2px; padding:5px 7px; font-size:9px; font-weight:400; letter-spacing:0; line-height:1.5; color:var(--text-mid); background:var(--bg-panel,#15110c); border:1px solid rgba(var(--bo-rgb),.35); border-radius:3px; box-shadow:0 4px 12px rgba(0,0,0,.5); }
      .bo-in:disabled { opacity:.4; cursor:not-allowed; }
      .bo-in { width:60px; font-family:var(--mono); font-size:10px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.12); border-radius:3px; color:var(--text-hi); padding:2px 5px; }
    `,

    slots: {
      'mode-label-extra': `<span x-show="cfg.boEnabled"> + Breakout</span>`,
      'strategy-accordions': `
        <div x-data="{ open: false }">
          <button class="cfg-acc-hd" @click="open=!open" :class="open?'open':''">
            <div style="display:flex;align-items:center;gap:7px">
              <span><span x-text="_boGlyph()"></span> Breakout</span>
              <span x-show="cfg.boEnabled" style="font-size:8px;padding:1px 5px;background:rgba(var(--bo-rgb),.15);border:1px solid rgba(var(--bo-rgb),.35);border-radius:2px;color:var(--bo-acc);letter-spacing:1px">ON</span>
              <span x-show="!cfg.boEnabled" style="font-size:8px;padding:1px 5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:2px;color:var(--text-lo);letter-spacing:1px">OFF</span>
            </div>
            <span class="cfg-acc-arrow" :class="open?'open':''">▶</span>
          </button>
          <div x-show="open" x-transition.opacity class="cfg-acc-body">
            <label class="tog">
              <div class="tog-t" :class="cfg.boEnabled?'on':''" @click.prevent="if(!cfgLocked){cfg.boEnabled=!cfg.boEnabled;persist()}"><div class="tog-k"></div></div>
              <div x-data="{ tip: false }">
                <div class="tog-l">Breakout Mode<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                <div class="bo-hint" x-show="tip">Places a cond. pair on random tickers at their average top and bottom moves, and re-bundles a ticker after a loss until it wins.</div>
              </div>
            </label>
            <div x-show="cfg.boEnabled" style="margin-top:8px">
              <div x-data="{ tip: false }">
                <div style="display:flex;align-items:center;gap:6px">
                  <span class="lbl" style="margin:0">Max bundles</span>
                  <input type="number" min="1" :max="100" step="1" class="bo-in" x-model.number="cfg.boMaxBundles" :disabled="cfgLocked" @change="cfg.boMaxBundles=Math.max(1,Math.min(100,Math.round(+cfg.boMaxBundles||30)));persist()">
                  <button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button>
                </div>
                <div class="bo-hint" x-show="tip">How many tickers hold a cond. bundle at once, one slot each, within the host's Max Cond. Orders.</div>
              </div>
              <div x-data="{ tip: false }" style="margin-top:8px">
                <div style="display:flex;align-items:center;gap:6px">
                  <span class="lbl" style="margin:0">Order life (min)</span>
                  <input type="number" min="1" step="1" class="bo-in" x-model.number="cfg.boLifeMins" :disabled="cfgLocked" @change="cfg.boLifeMins=Math.max(1,Math.round(+cfg.boLifeMins||1440));persist()">
                  <button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button>
                </div>
                <div class="bo-hint" x-show="tip">An unfilled bundle is cancelled after this many minutes, and a ticker still owed a win is bundled again.</div>
              </div>
              <div class="bo-live">
                <div class="bo-lr" x-data="{ tip: false, rt: false }" @pointerenter="if ($event.pointerType === 'mouse') tip = true" @pointerleave="if ($event.pointerType === 'mouse') tip = false" @click="if (($event.pointerType || 'touch') !== 'mouse') tip = !tip">
                  <span class="bo-ttl"><span x-text="_boGlyph()"></span> LIVE</span>
                  <span class="bo-blink" x-show="!cfg.binaryModeEnabled">&#9888;</span>
                  <span><b x-text="_boPend()"></b><span style="color:var(--text-lo)">/<span x-text="_boMax()"></span></span></span>
                  <span class="bo-cnt" @pointerenter="if ($event.pointerType === 'mouse') rt = true" @pointerleave="if ($event.pointerType === 'mouse') rt = false" @click.stop="if (($event.pointerType || 'touch') !== 'mouse') rt = !rt">&#8635;<b x-text="_boRedoN()"></b></span>
                  <div class="bo-pop" x-show="tip && !rt" x-text="_boTip(tick)"></div>
                  <div class="bo-pop" x-show="rt" style="z-index:30;white-space:pre-line" x-text="_boRedoTip()"></div>
                </div>
              </div>
              <div x-data="{ tip: false }">
                <div class="bo-hint">🪙 Stablecoin filter · always on<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                <div class="bo-hint" x-show="tip">The 24 candles must span at least 1% from lowest low to highest high, else the ticker is skipped and graylisted for a week.</div>
              </div>
              <div x-data="{ tip: false }">
                <div class="bo-hint">💧 Illiquidity filter · always on<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                <div class="bo-hint" x-show="tip">Tickers whose last 3 trades average more than 12s apart are skipped and graylisted for a week, and ones that pass skip the check for a week.</div>
              </div>
            </div>
          </div>
        </div>
      `,
    },

    transform(def) {
      const _hasShort = typeof def.pseudoOpenShort === 'function', _hasLong = typeof def.pseudoOpenLong === 'function';
      WINTER = _hasShort && !_hasLong;
      try {
        const rs = document.documentElement.style;
        rs.setProperty('--bo-rgb', WINTER ? '96,210,255' : '255,200,60');
        rs.setProperty('--bo-acc', WINTER ? 'var(--ice)' : '#ffc83c');
      } catch (_) {}

      const _origInit    = def.init;
      const _origScan    = def.runScan;
      const _origWatch   = def.pseudoWatchCondOrders;
      const _hostStages = Array.isArray(def._scanStageDefs); // host has the cooperative scan scheduler

      return Object.assign({}, def, {

        _boLoaded: false,
        _boBusy: false,
        _boBinWarned: false,

        // Plugin symbol (text glyphs, not emoji): snowflake for Winter, fire for Chaser.
        _boGlyph() { return WINTER ? '\u2744\uFE0E' : '\u2668\uFE0E'; },
        _boIs(o) { return !!o && o.tag === 'breakout' && o.bundle === 'bo'; },                 // one of this plugin's bundle legs
        _boPend() { return new Set((this.condOrders || []).filter(o => this._boIs(o)).map(o => o.symbol)).size; }, // bundles standing: one per ticker
        _boMax() { return Math.max(1, Math.min(BUNDLE_MAX, Math.round(Number(this.cfg.boMaxBundles)) || 30)); },
        _boRedoN() { return Object.keys(this.cfg.boRedo || {}).length; },
        _boAtCap() { return (this.positions || []).length >= (this.cfg.maxPos ?? 5); },
        _boTip(_t) {
          const p = this._boPend(), r = this._boRedoN();
          return p + ' bundle' + (p === 1 ? '' : 's') + ' standing, ' + r + ' ticker' + (r === 1 ? '' : 's') + ' scheduled for another bundle after a loss.';
        },

        // Hover text of the retry counter: each scheduled ticker with the number of new bundles it has been given since its first loss.
        _boRedoTip() {
          const e = Object.entries(this.cfg.boRedo || {});
          if (!e.length) return 'No ticker is scheduled for another bundle.';
          return 'Scheduled after a loss, with the new bundles each has had:\n' + e.map(([sym, r]) => sym + ' \u2014 ' + ((r && r.b) || 0)).join('\n');
        },

        // Last 24 closed 1hr candles, newest first from the exchange; the forming candle is dropped. Null when the ticker has fewer than 24.
        async _boCandles(sym) {
          const url = `${this.base}/v5/market/kline?category=linear&symbol=${sym}&interval=60&limit=${CANDLES + 1}`;
          const r = await (typeof this._qFetch === 'function' ? this._qFetch(url) : fetch(url));
          const list = (await r.json())?.result?.list;
          if (!Array.isArray(list)) return null;
          const now = Date.now();
          const closed = list.filter(c => Number(c[0]) + HOUR_MS <= now).slice(0, CANDLES);
          return closed.length === CANDLES ? closed : null;
        },

        // Top / bottom moves, %: green candles (close above open) give the top move, the mean of (high - open) / open; red candles (close below open) give the bottom move,
        // the mean of (open - low) / open. Doji candles count for neither. Null when a candle is unreadable or either colour is missing.
        _boMoves(candles) {
          let tSum = 0, tN = 0, bSum = 0, bN = 0, ok = 0;
          for (const c of candles) {
            const o = parseFloat(c[1]), h = parseFloat(c[2]), l = parseFloat(c[3]), cl = parseFloat(c[4]);
            if (!(o > 0) || !(cl > 0) || !(h >= l)) continue;
            ok++;
            if (cl > o) { tSum += (h - o) / o * 100; tN++; }
            else if (cl < o) { bSum += (o - l) / o * 100; bN++; }
          }
          if (ok !== CANDLES || !tN || !bN) return null;
          return { top: tSum / tN, bottom: bSum / bN, green: tN, red: bN };
        },

        // Stablecoin filter: the 24 candles' full span, %. A stablecoin never moves 1%.
        _boSpan(candles) {
          let hi = -Infinity, lo = Infinity;
          for (const c of candles) { hi = Math.max(hi, parseFloat(c[2])); lo = Math.min(lo, parseFloat(c[3])); }
          return lo > 0 && isFinite(hi) ? (hi / lo - 1) * 100 : 0;
        },

        // Illiquidity filter: average gap between the last 3 trades, ms (newest first). Null when the read fails.
        async _boTradeGap(sym) {
          try {
            const r = await fetch(`${this.base}/v5/market/recent-trade?category=linear&symbol=${sym}&limit=3`);
            const ts = ((await r.json())?.result?.list || []).map(x => Number(x.time)).filter(x => x > 0);
            if (ts.length < 3) return Infinity; // fewer than 3 trades on record is as illiquid as it gets
            return (Math.max(...ts) - Math.min(...ts)) / (ts.length - 1);
          } catch (e) { return null; }
        },

        _boGrayAdd(sym, why) {
          this.cfg.boGray[sym] = Date.now();
          this.log(`[BO] ⛔ ${sym}: ${why} — graylisted for a week`, 'info');
        },

        // Leverage the host will open with: Winter resolves it per ticker, Chaser uses the config value. TP / SL are ROI %, i.e. price move % x leverage.
        async _boLev(sym) {
          if (typeof this.resolveEffectiveLeverage === 'function') {
            const instr = await this.getInstrInfo(sym);
            const r = instr && this.resolveEffectiveLeverage(sym, instr);
            return r && r.lev > 0 ? r.lev : null;
          }
          return this.cfg.leverage > 0 ? this.cfg.leverage : 1;
        },

        // Everything before a bundle: candles, top / bottom moves, filters, fresh price, leverage. Null when the ticker is skipped.
        async _boPrep(sym, t) {
          const candles = await this._boCandles(sym);
          if (!candles) { this.log(`[BO] ${sym}: fewer than ${CANDLES} closed 1hr candles — skipped`, 'info'); return null; }
          const mv = this._boMoves(candles);
          if (!mv) { this.log(`[BO] ${sym}: no green or no red candle among the last ${CANDLES} (or unreadable data) — skipped`, 'info'); return null; }
          const span = this._boSpan(candles);
          if (span < MIN_SPAN_PCT) { this._boGrayAdd(sym, `stablecoin filter, ${span.toFixed(2)}% span over ${CANDLES}h`); return null; }
          const white = Date.now() - (this.cfg.boWhite[sym] || 0) < GRAY_MS;
          const gap = white ? 0 : await this._boTradeGap(sym);
          if (gap != null && gap > MAX_GAP_MS) { this._boGrayAdd(sym, `illiquidity filter, last 3 trades ${isFinite(gap) ? (gap / 1000).toFixed(1) + 's' : 'not found'} apart`); return null; }
          if (gap != null && !white) this.cfg.boWhite[sym] = Date.now();
          let price = parseFloat(t?.lastPrice || 0);
          try {
            const r = await fetch(`${this.base}/v5/market/tickers?category=linear&symbol=${sym}`);
            const lp = parseFloat((await r.json())?.result?.list?.[0]?.lastPrice);
            if (lp > 0) price = lp;
          } catch (e) {}
          if (!(price > 0)) return null;
          const lev = await this._boLev(sym);
          if (!lev) return null;
          return { mv, price, lev, candles };
        },

        // The bundle: a cond. ABOVE the price at one average top move and a cond. BELOW it at one average bottom move, as ONE host bundle ('bo': one slot, the first fill cancels the other).
        // Each leg's worst case sits twice its opposite move away, beyond the other leg's target, so the other leg always fills first and the worst case only satisfies the host's two-sided rule.
        // TP / SL ROI come from the same averages, measured from the fill (Chaser: TP top, SL bottom; Winter: TP bottom, SL top). tryN: 1 for a fresh ticker, losses + 1 for a retry. Returns the legs, or null.
        async _boPlace(sym, t, tryN = 1) {
          const pr = await this._boPrep(sym, t);
          if (!pr) return null;
          const { mv, price, lev } = pr, fp = x => +x.toPrecision(6);
          const tpMove = WINTER ? mv.bottom : mv.top, slMove = WINTER ? mv.top : mv.bottom;
          const tpRoi = +(tpMove * lev).toFixed(2), slRoi = +(slMove * lev).toFixed(2);
          const base = { symbol: sym, price, change: parseFloat(t?.price24hPcnt || 0) * 100, fundingRate: parseFloat(t?.fundingRate || 0) * 100, _tpPct: tpRoi, _slPct: slRoi, _bo: true, _boTopPct: +mv.top.toFixed(3), _boBotPct: +mv.bottom.toFixed(3), _boTry: tryN };
          const legs = [
            { edge: 'top',    target: price * (1 + mv.top / 100),    worst: Math.max(price * 0.01, price * (1 - 2 * mv.bottom / 100)) },
            { edge: 'bottom', target: price * (1 - mv.bottom / 100), worst: price * (1 + 2 * mv.top / 100) },
          ];
          const placed = [];
          for (const L of legs) {
            const o = await this.placeCondEntry({ candidate: { ...base, _boEdge: L.edge }, target: L.target, worst: L.worst, tag: 'breakout', bundle: 'bo', kind: L.edge });
            if (!o) {
              for (const p of placed) { try { await this.cancelCondOrder(p.id, 'breakout bundle incomplete'); } catch (e) {} }
              return null;
            }
            placed.push(o);
          }
          this.log(`[BO] ${this._boGlyph()} ${sym}: ${tryN > 1 ? `retry ${tryN - 1} — ` : ''}bundle @ ${fp(price)}: top cond. ${fp(legs[0].target)} (+${mv.top.toFixed(2)}%) / bottom cond. ${fp(legs[1].target)} (-${mv.bottom.toFixed(2)}%), TP ${tpRoi}% / SL ${slRoi}% ROI from the fill, first fill cancels the other`, 'info');
          return placed;
        },

        // Settles every newly closed Breakout trade: a loss schedules its ticker for another bundle (n = losses so far), a win clears the ticker. Trades are found by their _bo stamp and closedAt, whichever path closed them.
        _boSettle() {
          const c = this.cfg;
          if (!c.boRedo || typeof c.boRedo !== 'object' || Array.isArray(c.boRedo)) c.boRedo = {};
          const mark = Number(c.boClosedMark) || 0;
          const fresh = (this.closedTrades || []).filter(t => t && t._bo && t.reason !== 'period-rollup' && t.closedAt > mark).sort((a, b) => a.closedAt - b.closedAt);
          if (!fresh.length) return;
          let top = mark;
          for (const t of fresh) {
            top = Math.max(top, t.closedAt);
            const sym = t.symbol, prev = c.boRedo[sym];
            if (t.isWin) {
              if (prev) { delete c.boRedo[sym]; this.log(`[BO] ${this._boGlyph()} ${sym}: won after ${prev.n} loss${prev.n === 1 ? '' : 'es'} — no more bundles scheduled`, 'success'); }
            } else {
              const n = (prev?.n || 0) + 1;
              c.boRedo[sym] = { n, t: Date.now() };
              this.log(`[BO] ${this._boGlyph()} ${sym}: closed at a loss [${t.reason}] — scheduled for another bundle (loss ${n})`, 'info');
            }
          }
          c.boClosedMark = top;
          this.persist();
        },

        // Bundles stand for Order life, then both legs are cancelled. A ticker still owed a win stays scheduled and is bundled again.
        async _boExpire() {
          const life = Math.max(1, Number(this.cfg.boLifeMins) || 1440) * 60000, now = Date.now();
          for (const o of [...(this.condOrders || [])]) {
            if (this._boIs(o) && now - o.createdAt >= life) { try { await this.cancelCondOrder(o.id, 'breakout order life reached'); } catch (e) { this.log(`[BO] cancel error (${o.symbol}): ${e.message}`, 'warn'); } }
          }
        },

        // Max positions: every pending bundle is cancelled and none is placed until a slot frees.
        async _boGuard() {
          if (!this._boAtCap()) return;
          const bo = (this.condOrders || []).filter(o => this._boIs(o));
          if (!bo.length) return;
          const n = new Set(bo.map(o => o.symbol)).size;
          for (const o of bo) { try { await this.cancelCondOrder(o.id, 'breakout max positions'); } catch (e) { this.log(`[BO] cancel error (${o.symbol}): ${e.message}`, 'warn'); } }
          this.log(`[BO] ${this._boGlyph()} Max positions (${(this.positions || []).length}/${this.cfg.maxPos ?? 5}) — ${n} bundle${n === 1 ? '' : 's'} cancelled`, 'warn');
        },

        // Conds left by earlier versions (Whipsaw / Continuation, the retired price conds) are cancelled. With Breakout off its bundles are cancelled too.
        async _boSync() {
          const c = this.cfg, old = (this.condOrders || []).filter(o => o.tag === 'whipsaw' || o.tag === 'continuation' || o.tag === 'whipsaw + continuation' || (o.tag === 'breakout' && !o.bundle));
          for (const o of old) { try { await this.cancelCondOrder(o.id, 'breakout retired order'); } catch (e) { this.log(`[BO] cancel error (${o.symbol}): ${e.message}`, 'warn'); } }
          if (old.length) this.log(`[BO] ${this._boGlyph()} ${old.length} cond. order${old.length === 1 ? '' : 's'} from an earlier version cancelled`, 'info');
          if (c.boEnabled) return;
          const bo = (this.condOrders || []).filter(o => this._boIs(o));
          if (!bo.length) return;
          for (const o of bo) { try { await this.cancelCondOrder(o.id, 'breakout off'); } catch (e) { this.log(`[BO] cancel error (${o.symbol}): ${e.message}`, 'warn'); } }
          this.log(`[BO] ${this._boGlyph()} Breakout off — ${new Set(bo.map(o => o.symbol)).size} bundle(s) cancelled`, 'info');
        },

        // Fills the free slots: tickers scheduled after a loss first, then random tickers from the bulk list.
        async _boBatch() {
          if (this._boBusy) return;
          this._boBusy = true;
          try {
            const c = this.cfg;
            if (!c.boEnabled) return;
            if (!c.binaryModeEnabled) {
              if (!this._boBinWarned) { this._boBinWarned = true; this.log('[BO] ⚠️ Binary Mode is off — TP and SL are only set at entry there, so no Breakout bundles are placed', 'warn'); }
              return;
            }
            this._boBinWarned = false;
            if (this._isDrawdownHalted?.() || this._isGainsLocked?.()) return;

            await this._boSync();
            await this._boGuard();
            this._boSettle();
            if (this._boAtCap()) return; // max positions: no new bundles
            const hostFree = (c.maxCond ?? 30) - (typeof this._condSlots === 'function' ? this._condSlots() : 0);
            const free = Math.min(this._boMax() - this._boPend(), hostFree); // own limit and the host's cond. slots
            if (free <= 0) return;

            const taken = new Set([...(this.positions || []).map(p => p.symbol), ...(this.condOrders || []).map(o => o.symbol)]);
            const tk = sym => (this._lastAllTickers || []).find(x => x.symbol === sym);
            let placed = 0, retried = 0;

            // Scheduled tickers first. A failed read leaves the ticker scheduled; a filter failure or a ban drops it.
            for (const sym of Object.keys(c.boRedo || {})) {
              if (placed >= free) break;
              if (taken.has(sym)) continue;
              if (sym in c.boGray || this._isSymbolBanned?.(sym)) { delete c.boRedo[sym]; this.log(`[BO] ${sym}: dropped from the retry schedule — ${sym in c.boGray ? 'graylisted' : 'banned'}`, 'info'); continue; }
              try { if (await this._boPlace(sym, tk(sym), (c.boRedo[sym].n || 0) + 1)) { c.boRedo[sym].b = (c.boRedo[sym].b || 0) + 1; placed++; retried++; taken.add(sym); } }
              catch (e) { this.log(`[BO] ${sym} error: ${e.message}`, 'warn'); }
            }

            const now = Date.now();
            for (const m of [c.boGray, c.boWhite]) for (const k of Object.keys(m)) if (now - m[k] >= GRAY_MS) delete m[k];
            const mega = new Set(Array.isArray(c.megacapExclude) ? c.megacapExclude : []);
            const pool = (this._lastAllTickers || []).filter(t => t.symbol && t.symbol.endsWith('USDT') && !taken.has(t.symbol) && !(t.symbol in c.boRedo)
              && !mega.has(t.symbol) && !(t.symbol in c.boGray) && parseFloat(t.lastPrice || 0) > 0 && !this._isSymbolBanned?.(t.symbol));
            for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }

            const maxTry = (free - placed) * 3; // a few spare picks for tickers that fail (new listings, filters, refused orders)
            let tries = 0;
            for (const t of pool) {
              if (placed >= free || tries >= maxTry) break;
              tries++;
              try { if (await this._boPlace(t.symbol, t, 1)) placed++; }
              catch (e) { this.log(`[BO] ${t.symbol} error: ${e.message}`, 'warn'); }
            }
            this.log(`[BO] ${this._boGlyph()} Batch — ${placed}/${free} bundle${free === 1 ? '' : 's'} placed${retried ? ` (${retried} retr${retried === 1 ? 'y' : 'ies'})` : ''}`, 'info');
            this.persist();
          } finally { this._boBusy = false; }
        },

        async init() {
          await _origInit.call(this);
          this._boLoaded = true;
          // Position badge, stamped on every filled position and its closed trade: TOP or BOTTOM (the leg that filled), R1, R2... for the retry number.
          if (typeof this.registerRoleBadge === 'function') this.registerRoleBadge(item => {
            const e = item && (item._boEdge || item.candidate?._boEdge);
            if (e !== 'top' && e !== 'bottom') return null;
            const n = item._boTry ?? item.candidate?._boTry ?? 1, lbl = e.toUpperCase() + (n > 1 ? ' R' + (n - 1) : '');
            return `<span title="Breakout, filled at the average ${e} move" style="font-family:var(--mono);font-size:9px;letter-spacing:1px;padding:2px 5px;border-radius:2px;border:1px solid rgba(var(--bo-rgb),.35);background:rgba(var(--bo-rgb),.15);color:var(--bo-acc)">${lbl}</span>`;
          });
          // Max watches became Max bundles.
          if (this.cfg.boMaxBundles === undefined && Number.isFinite(Number(this.cfg.boMaxWatch))) this.cfg.boMaxBundles = Math.max(1, Math.min(BUNDLE_MAX, Math.round(Number(this.cfg.boMaxWatch))));
          for (const [k, v] of Object.entries(BO_DEFAULT_CFG)) {
            if (this.cfg[k] === undefined) this.cfg[k] = Array.isArray(v) ? [...v] : (v && typeof v === 'object' ? { ...v } : v);
          }
          for (const k of ['boGray', 'boWhite', 'boRedo']) if (!this.cfg[k] || typeof this.cfg[k] !== 'object' || Array.isArray(this.cfg[k])) this.cfg[k] = {};
          if (!this.cfg.boClosedMark) this.cfg.boClosedMark = Date.now(); // trades closed before this version are not settled
          // Retired settings and stores (scoring, watch lists, hypotheticals, flow, auto-switch, tally, retry queue, Both / On break / Funding / Cull, volume watch and break counter).
          for (const k of ['boFlowOn', 'boCritOn', 'boCritF', 'boCritS', 'boCritL', 'boCritI', 'boGate', 'boSamples', 'boWatchMax', 'boStepX', 'boCells', 'boCellOf', 'boW1', 'boW2', 'boHypo',
            'boEdges', 'boLog', 'boInval', 'boRetry', 'boAuto', 'boAutoPct', 'boAutoTicker', 'boTickLatch', 'boFlowUp', 'boFlowDown', 'boMult', 'boEntry', 'boFlow', 'boTrack', 'boPushMax', 'boFlowEnabled', 'boFundW', 'boSkewW', 'boTgtMin', 'boTgtMax', 'boPeakCloser', 'boBottomCloser', 'boVol', 'boVolClose', 'boPairs', 'boFar', 'boDR', 'boRevert', 'boDecide', 'boTypes', 'boFlip', 'boNullify', 'boNullHrs', 'boCandlePref',
            'boBoth', 'boCont', 'boWhip', 'boFundHigh', 'boFundLow', 'boFundHi', 'boFundLo', 'boFundCull', 'boPollSec', 'boWinH', 'boBreaks', 'boWatch', 'boMaxWatch']) delete this.cfg[k];
        },

        // Housekeeping rides the host's cond. order watcher: settle closed trades, cancel expired bundles, and clear bundles at max positions.
        async pseudoWatchCondOrders() {
          const r = await _origWatch.call(this);
          if (this._boLoaded) { try { await this._boSync(); await this._boGuard(); this._boSettle(); await this._boExpire(); } catch (e) { this.log(`[BO] watcher error: ${e.message}`, 'warn'); } }
          return r;
        },

      }, _hostStages
        ? { _scanStageDefs: [...def._scanStageDefs,
            { id: 'bo-batch', group: 'bo', run: function (ctx) { return this._boBatch(ctx); } },
          ] }
        : { async runScan() {
            await _origScan.call(this);
            await this._boBatch();
          } });
    },
  };
})();
</script>
