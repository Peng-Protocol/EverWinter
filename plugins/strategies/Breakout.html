<!--
  Breakout Plugin for PseudoChaser and PseudoWinter (unified)
  Modelled on MI's Fade (cond. entry, worst-case price, 1hr life) with none of MI's scoring.

  Each batch fills the host's Max Cond. Orders limit (minus cond. orders already pending) with tickers, independent of
  Max Positions: the host drops a cond. that triggers past maxPos, and real orders fail if the balance is short.
  It reads the last twenty-four closed 1hr candles of each, and takes the average move: the mean candle range, (high - low) / open, in %.

  Cond. geometry (k = distance multiplier, 1 / 2 / 3):
  Chaser (long):  edge BOTTOM: cond. entry BELOW price by k x the average move, worse price ABOVE price by 1 x; edge TOP: the mirror.
  Winter (short): the same two edges; only TP / SL differ. TP / SL are always 1 x the average move from the trigger, on the bot's own side
                  (Chaser TP above / SL below, Winter TP below / SL above).

  Cells: every cond. is an edge (T / B) x k, so the BASE CELLS are top / bottom at 1x / 2x / 3x (keys T1 ... B3). Tickers are read on CRITERIA, each + or - with a
  strength 0..1: P/A (average positive close vs average negative close of the 24 candles, so size counts and there are no ties) and, behind the Criteria toggle,
  Funding (rate sign vs the market's typical rate), L/S skew (long vs short accounts, one extra fetch), LTA (turnover of the latest 12 candles vs the 12 before:
  rising / falling) and IO/A (open interest vs the median of the filtered market: big caps, graylisted illiquid / stablecoins and dead tickers left out, not size-normalized).
  Each criterion keeps its own +/- table per base cell (e.g. P+T1, F-B2). Cell labels follow the old badges: W- (with P/A), A- (against), D- (k above 1).

  Scores (all in $ at the configured notional, i.e. price move % x notional = move % x leverage x base margin; $0.30 for a 5% move at base settings).
  Each cell keeps the last Samples (default 50) of THREE data types, no decay, and its score is their sum:
    1. First-passage (cond. orders: real and round-1 hypotheticals): trigger reached first = +k x m, worse price first = -m (m = the ticker's
       average move %), expired = not stored. Zero-expectation for a random walk at any k, so any drift is signal. Bigger movers weigh more.
    2. Round-2 hypothetical positions closed at TP / SL / Force Close, net of the base bot's estimated fees and of funding.
    3. Real positions closed at TP / SL / Force Close, net (uPnL never feeds a score).
  A table's score is the sum of its samples. A ticker's score at a cell = the base cell's score + each exhibited criterion's table score x the ticker's strength on it.
  Samples feed the base cell as they are, and every exhibited criterion's table as (the sample - the base cell's average of that type) x strength, so a criterion only
  learns what its tickers do beyond the cell's norm. The ticker's own funding / IO / skew are fetched fresh when it is read; the market median comes from the bulk list.

  Entry choice: for each ticker the eligible cells are weighted by exp((score - best) / step) x a small prior against k above 1, and one is drawn.
  Step = the Score step setting x one base margin ($1 at base settings). Eligible: all six cells, except a ticker whose P/A is the unfavored sign at 20%+ strength
  (Chaser negative, Winter positive: the bot would expect to lose) = the default edge (Chaser bottom, Winter top) at k 2 or 3 only.
  Stand down: when the best eligible cell of a ticker is at or below -step, no real cond. is placed for it (the ticker is still watched), until the scores recover.

  Watch lists (hypotheticals, no orders): up to Watch tickers (default 50) random tickers pass the same filters, then every cell (2 edges x 3 k) is simulated at once.
    Round 1: 1 order life later (default 60 min) the twelve 5-minute candles since the scan are walked per cell: trigger or worse price first. Both touched in one
             candle = one finer (1 min) fetch for that ticker, still both = worse price first. A cell whose trigger was reached opens a hypothetical position.
    Round 2: the position is walked to its TP / SL for as long as a real one would live (the host's Force Close Runtime). 4-hour candles bound every hour inside them
             (inside TP / SL = nothing happened; one side touched = resolved); both touched = one finer (15 min) fetch for that ticker, still both = SL first.
             The stretch from the end of round 1 to the next 4h boundary uses 5-minute candles. Funding is added at each funding time crossed (rate and interval from the
             host's cache), fees come from the host's _estTradeFee at close, Force Close at the horizon books at the last close seen.
  The HYPO row shows the hypothetical P&L; its hover compares sim vs real averages per cell (a sim that disagrees with reality is missing a cost).

  Tally:      each resolved order is logged by the edge price reached first: top, bottom, or neither (expired). Last 50 are kept.
  Invalidation: a worse-price hit proves the order's directional assumption wrong; counted by badge (W-TOP, ..., D-BOTTOM), last 50, shown in the LIVE popover.

  Max positions: once open positions reach the host's Max Positions, every pending Breakout cond. is cancelled and no new ones are placed (nothing is tracked
              internally: the watch lists keep the data flowing without per-cond. price polling). Real conds resume when a slot frees.

  Two fixed filters run before every order and every watch (no toggles):
    Stablecoin   — the 24 candles' full span (lowest low to highest high) must be at least 1%, else the ticker is a stablecoin.
    Illiquidity  — the last 3 trades are fetched; if they average more than 12s apart the ticker is illiquid.
  A ticker failing either during random selection is graylisted for a week (a queued retry is only skipped).
  A ticker confirmed liquid is whitelisted for a week and skips the trade fetch.

  Orders expire after Order Life (default 60 min) and are simply cancelled. If price reaches the worse price first, the ticker is queued
  and goes to the front of the next batch, where its candles are re-read and a fresh order is made.

  TP / SL are set at entry only in Binary Mode, so Binary Mode must be on (the plugin places nothing otherwise; watches and sims still run).
  Needs no other plugin. The side is read from the host at load.

  Load via Plugin Manager in either bot's config panel, AFTER SunChaser / EverWinter if live.
  targetBot: both
-->
<script>
(function () {
  'use strict';

  const VERSION = '2.2.0'; // Change: Criteria: P/A (average positive vs average negative close of the 24 candles, strength-weighted, replaces the break-count lean cohorts U / D / N) plus, behind a new Criteria toggle, Funding, long / short skew (one extra fetch), LTA (turnover of the latest 12 candles vs the 12 before) and IO/A (open interest vs the filtered-market median); base cells are now edge x k (T1 ... B3) and every criterion keeps +/- tables per base cell, a ticker's score = base cell + each exhibited criterion's table x its strength; tables learn the excess over the base cell's average; old lean cells are folded into the base cells | previous: Live mode (EverWinter / SunChaser): the max-positions cancel-all check runs the moment a live cond. fills (live fills bypass _condTrigger) instead of waiting for the next watcher tick; batches still fill Max Cond. Orders in live and sim alike | previous: Internal tracking of conds. at max positions removed (it polled every tracked ticker's price; the watch lists replace it): at max positions pending conds are simply cancelled and none are placed, and the Tracked table, tracker storage and their tally / invalidation feed are gone | previous: Numerical cell scoring replaces Auto-switch, the per-ticker trip, the With / Against switches and the double-entry ratchet: every ticker is simulated at both edges and 1x / 2x / 3x (round 1: twelve 5m candles of the order life, round 2: the position walked to TP / SL on 4h candles with one finer fetch when both touch, funding and fees included), cond. orders, hypotheticals and real TP / SL / Force Close results feed per-cell $ scores (last 50 samples per type, no decay, uPnL no longer scored), entries are drawn by score, and a lean whose cells are all under water stands down; new Round 1 / Round 2 lists and a HYPO row | previous: At max positions every Breakout cond. is cancelled and no new ones are placed; those tickers are tracked internally (top / bottom breaks, invalidations, expiry feed the tallies and the double multiplier) and listed in a new Tracked table with a one-bar progress view; re-checked after every cond. fill. | previous: Contradictory moves removed: the unfavored skew (Chaser downside, Winter upside) enters a double top / bottom cond. at 2x the average move (multiplier rises +1 when those positions lose, falls -1 when a double cond. expires untouched, floor 2); worse-price hits are counted as invalidations per W-/A- badge. | previous: Live readout cut to three label-free rows (LIVE: pending + break counts; UP skew; DOWN skew) using only the app's gray / theme / green / yellow / red; extra detail moved into a hover (PC) or tap (mobile) popover per row. | previous: Live readout moved into the Breakout accordion body, below the config fields, and shrunk to a compact bar-free table (entry mode + edge per skew with its loss figure, break counts, pending, trip, queue); General accordion's Mode line restored. | previous: Live readouts (pending / flow modes / auto-switch loss meters / per-ticker trip / break tally / retry queue / Binary warning) moved out of the Breakout config into the General accordion's Mode line, shown bold and colored with meters, pulses and an outcome strip. | previous: All hint text and hover tooltips are hidden behind circled "!" buttons next to their toggle or setting (click to show); Ticker flow, Auto-switch and Per-ticker trip default to on. | previous: Ticker flow With / Against is now two switches, one for upside-skew tickers and one for downside-skew tickers; Auto-switch and Per-ticker trip flip only the skew whose positions lost (or reversed). | previous: Per-ticker trip sub-toggle under Auto-switch: one position at -25% of its base margin flips the switch (and flow) once, latched; a swing to +25% reverses it and re-arms. | previous: Ticker flow: each ticker is scored toppy / bottomy from its 24 candles (breaks of the average move above the open vs below it) and enters With or Against that flow; W-/A- prefix on the TOP / BOTTOM badges; Auto-switch flips With <-> Against while flow is on. | previous: Chaser plugin glyph is the text-style hot springs symbol (fire-like) instead of the alchemical fire triangle. | previous: Auto-switch rebuilt on uPnL: flips the entry edge when open positions entered at the current edge are down 25% (setting) of their base margin, checked every minute; plugin glyph (snowflake / fire) replaces the explosion emoji. | previous: Auto-switch rule: tally in the bot's favor (Chaser: tops lead, Winter: bottoms lead) enters at the leading edge, against it at the opposite edge. | previous: TOP / BOTTOM position-type badge on pending conds and positions (needs the base bots' cond card badge slot); Auto-switch tooltip rewritten in plain English with the currently resolving edge. | previous: Entry edge setting (Chaser can enter at the top, Winter at the bottom); top / bottom / no-break tally readout; batch fills the host's Max Cond. Orders limit instead of being capped by Max Positions; tally counts fills dropped past Max Positions; Auto-switch picks the edge from the tally's skew. | previous: Illiquidity filter whitelist — a ticker confirmed liquid skips the 3-trade fetch for a week. | previous: Stablecoin filter (24h span under 1% = skipped) and Illiquidity filter (last 3 trades averaging over 12s apart = skipped), both always on; failures from random selection are graylisted for a week. | previous: Initial release — average-move cond. entries (24 x 1hr candles), TP/SL at +/- the average move from the trigger, 1hr expiry, worse-price orders requeued for the next batch.
  const CANDLES = 24;      // closed 1hr candles the average move is read from
  const HOUR_MS = 3600000;
  const MIN_SPAN_PCT = 1;          // stablecoin filter: least % span the 24 candles must cover
  const MAX_GAP_MS   = 12000;      // illiquidity filter: most average ms between the last 3 trades
  const GRAY_MS      = 7 * 86400000; // graylist time for a ticker that fails either filter
  const TALLY_WINDOW = 50;         // resolved orders the T / B / neither tally looks at
  const SAMPLE_DEF = 50, WATCH_DEF = 50, SIM_MAX = 240; // default samples per type per cell, round-1 watch size, hard cap on live round-2 sims
  const MIN5 = 300000, H4 = 4 * HOUR_MS;
  const KS = [1, 2, 3];            // cond. distance multipliers (x average move) every ticker is simulated at
  const K_PRIOR = { 1: 1, 2: 0.5, 3: 0.25 }; // starting preference per multiplier, before the scores say otherwise
  const REFINE = { 240: 15, 60: 5, 15: 1, 5: 1 }; // candle interval (min) -> finer interval (min) fetched once when both barriers touch in one candle
  const CRITS = ['P', 'F', 'S', 'L', 'I'];                    // criteria: P/A, Funding, long / short Skew, LTA, IO/A
  const CRIT_NAME = { P: 'P/A', F: 'Funding', S: 'L/S skew', L: 'LTA', I: 'IO/A' };
  const CRIT_TAG  = { P: 'P/A', F: 'FND', S: 'L/S', L: 'LTA', I: 'IO/A' };
  const CRIT_FULL = { P: 0.5, F: 2, S: 0.15, L: 0.5, I: Math.log(4) }; // raw reading at which a criterion's strength saturates at 1: P/A asymmetry, funding / typical |funding|, long share - 0.5, LTA change ratio, ln(IO / median IO)
  const PA_MIN = 0.2;              // P/A strength below this counts as no lean (no W- / A- label, no unfavored-lean limit); the table scoring still uses the exact strength
  const opp = e => e === 'top' ? 'bottom' : 'top';
  let   WINTER  = false;   // set in transform() from the host

  const BO_DEFAULT_CFG = Object.freeze({
    boEnabled: true,   // Breakout mode
    boLifeMins: 60,    // how long a cond. order waits before it is cancelled (also the round-1 watch window)
    boFlowOn: true,    // P/A (ticker flow): average positive vs average negative close of the 24 candles, strength-weighted; off = no P/A
    boCritOn: true,    // Criteria: Funding, L/S skew, LTA and IO/A as extra +/- criteria (each also has its own switch)
    boCritF: true,     // Funding: sign of the rate
    boCritS: true,     // L/S skew: long vs short accounts (one extra fetch per ticker read)
    boCritL: true,     // LTA: turnover of the latest 12 candles vs the 12 before
    boCritI: true,     // IO/A: open interest vs the filtered-market median
    boGate: true,      // Stand down: no real cond. for a lean while its best eligible cell is at or below -step
    boSamples: 50,     // samples kept per data type per cell (no decay: this is how fast the scores move)
    boWatchMax: 50,    // tickers watched at once in round 1
    boStepX: 1,        // score step in base margins ($1 at base settings): softmax temperature and stand-down floor
    boCells: {},       // table key -> { a: [$...], b: [$...], c: [$...] } first-passage / round-2 sim / real, last boSamples each. Base cell 'T1' ... 'B3'; criterion table 'P+T1', 'F-B2' ...
    boCellOf: {},      // symbol -> { c: base cell key, m: average move %, k, x: exhibited criteria } of its pending cond., so its resolution feeds the cell and tables
    boW1: [],          // round-1 watch list: { s, t (scan ms), p (price), m (avg move %), L (P/A code), x (criteria strengths), fr (funding %), fi (funding interval ms) }
    boW2: [],          // round-2 sims: { id, s, c, e, k, m, ent, et, ck, tp, sl, sd, n, fr, fi, fa, lc, h, x }
    boHypo: null,      // { n, w, pnl, dur } realized hypothetical totals (created in init)
    boEdges: {},       // symbol -> edge its pending order enters at
    boLog: [],         // last resolved orders: 'T' top reached first, 'B' bottom, 'N' neither (expired)
    boInval: [],       // last worse-price hits by badge: 'WT' 'WB' 'AT' 'AB' 'DT' 'DB' (W/A/D = with/against/double, T/B = top/bottom)
    boRetry: [],       // tickers that hit the worse price, first in line for the next batch
    boWhite: {},       // symbol -> epoch ms it was confirmed liquid; skips the trade fetch for a week
    boGray: {},        // symbol -> epoch ms it was graylisted (stablecoin / illiquid), kept a week
  });

  window.__BotPlugin = {
    id:        'breakout',
    name:      'Breakout',
    version:   VERSION,
    targetBot: 'both',
    after:     ['sunchaser', 'everwinter'],
    before:    [],
    conflicts: [],
    requires:  [],
    touches:   ['init', 'runScan', 'cancelCondOrder', 'pseudoWatchCondOrders', '_condTrigger', '_ewCondFilled', '_scCondFilled'],

    css: `
      :root { --bo-rgb:255,200,60; --bo-acc:#ffc83c; }
      .bo-hint { font-size:9px; color:var(--text-lo); margin-top:3px; line-height:1.5; }
      .bo-g { color:#3ddc84; } .bo-r { color:#ff5a5f; }
      .bo-seg { font-family:var(--mono); font-size:10px; padding:2px 9px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.12); border-radius:3px; color:var(--text-lo); cursor:pointer; }
      .bo-seg.on { background:rgba(var(--bo-rgb),.15); border-color:rgba(var(--bo-rgb),.35); color:var(--bo-acc); }
      .bo-info { display:inline-flex; align-items:center; justify-content:center; width:12px; height:12px; margin-left:6px; padding:0; border-radius:50%; border:1px solid rgba(var(--bo-rgb),.35); background:transparent; color:var(--bo-acc); font:700 8px/1 var(--mono); cursor:pointer; flex:none; vertical-align:middle; }
      .bo-info.on { background:rgba(var(--bo-rgb),.15); }
      .bo-live { position:relative; margin-top:8px; padding:3px 8px; border:1px solid rgba(var(--bo-rgb),.28); border-left:3px solid var(--bo-acc); border-radius:4px; background:rgba(var(--bo-rgb),.05); font-family:var(--mono); font-size:10px; color:var(--text-hi); }
      .bo-live.hot { border-color:var(--short); }
      .bo-lr { position:relative; display:flex; align-items:center; gap:7px; padding:4px 0; cursor:help; }
      .bo-lr + .bo-lr { border-top:1px solid rgba(255,255,255,.07); }
      .bo-ttl { font-weight:700; letter-spacing:2px; color:var(--bo-acc); }
      .bo-sk { min-width:32px; font-size:8px; letter-spacing:1.5px; color:var(--text-lo); }
      .bo-chip { font-size:9px; font-weight:700; letter-spacing:1px; padding:0 6px; border-radius:9px; border:1px solid transparent; }
      .bo-wi { color:var(--bo-acc); border-color:rgba(var(--bo-rgb),.4); background:rgba(var(--bo-rgb),.12); }
      .bo-ag { color:var(--warn); border-color:rgba(240,192,96,.45); background:rgba(240,192,96,.12); }
      .bo-edge { font-weight:700; letter-spacing:1px; color:var(--text-hi); }
      .bo-num { margin-left:auto; font-weight:700; white-space:nowrap; }
      .bo-cnt { color:var(--text-lo); } .bo-cnt b { margin-left:2px; color:var(--text-hi); } .bo-cnt.lead b { color:var(--bo-acc); }
      .bo-pulse { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--short); animation:bo-pulse 1s infinite; }
      @keyframes bo-pulse { 0% { box-shadow:0 0 0 0 rgba(255,69,96,.7); } 70% { box-shadow:0 0 0 6px rgba(255,69,96,0); } 100% { box-shadow:0 0 0 0 rgba(255,69,96,0); } }
      .bo-blink { color:var(--warn); animation:bo-blink 1.6s infinite; }
      @keyframes bo-blink { 50% { opacity:.4; } }
      .bo-pop { position:absolute; left:0; right:0; top:100%; z-index:20; margin-top:2px; padding:5px 7px; font-size:9px; font-weight:400; letter-spacing:0; line-height:1.5; color:var(--text-mid); background:var(--bg-panel,#15110c); border:1px solid rgba(var(--bo-rgb),.35); border-radius:3px; box-shadow:0 4px 12px rgba(0,0,0,.5); }
      .bo-tbl { max-height:140px; overflow-y:auto; border:1px solid rgba(255,255,255,.07); border-radius:3px; padding:2px 6px; }
      .bo-trw { display:flex; align-items:center; gap:8px; padding:3px 0; font-family:var(--mono); font-size:10px; }
      .bo-trw + .bo-trw { border-top:1px solid rgba(255,255,255,.05); }
    `,

    slots: {
      'mode-label-extra': `<span x-show="cfg.boEnabled"> + Breakout</span>`,
      'strategy-accordions': `
        <div x-data="{ open: false }">
          <button class="cfg-acc-hd" @click="open=!open" :class="open?'open':''">
            <div style="display:flex;align-items:center;gap:7px">
              <span><span x-text="_boGlyph()"></span> Breakout</span>
              <span x-show="cfg.boEnabled" style="font-size:8px;padding:1px 5px;background:rgba(var(--bo-rgb),.15);border:1px solid rgba(var(--bo-rgb),.35);border-radius:2px;color:var(--bo-acc);letter-spacing:1px">ON</span>
              <span x-show="!cfg.boEnabled" style="font-size:8px;padding:1px 5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:2px;color:var(--text-lo);letter-spacing:1px">OFF</span>
            </div>
            <span class="cfg-acc-arrow" :class="open?'open':''">▶</span>
          </button>
          <div x-show="open" x-transition.opacity class="cfg-acc-body">
            <label class="tog">
              <div class="tog-t" :class="cfg.boEnabled?'on':''" @click.prevent="if(!cfgLocked){cfg.boEnabled=!cfg.boEnabled;persist()}"><div class="tog-k"></div></div>
              <div x-data="{ tip: false }">
                <div class="tog-l">Breakout Mode<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                <div class="bo-hint" x-show="tip" x-text="'Cond. entry at the top or bottom of the range, 1x to 3x the average move from price, at the cell the scores favor; TP and SL one average move from the trigger.'"></div>
              </div>
            </label>
            <div x-show="cfg.boEnabled" style="margin-top:8px">
              <div x-data="{ tip: false }">
              <div style="display:flex;align-items:center;gap:6px">
                <span class="lbl" style="margin:0">Order life (min)</span>
                <input type="number" min="1" step="1" x-model.number="cfg.boLifeMins" @change="cfg.boLifeMins=Math.max(1,Math.round(+cfg.boLifeMins||60));persist()" style="width:60px;font-family:var(--mono);font-size:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:3px;color:var(--text-hi);padding:2px 5px">
                <span style="margin-left:-2px"><button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></span>
              </div>
              <div class="bo-hint" x-show="tip">Unfilled orders are cancelled after this; a worse-price hit requeues the ticker instead.</div>
              <div class="bo-hint" x-show="tip" x-text="'Fills up to Max Cond. Orders (' + (cfg.maxCond ?? 30) + '), independent of Max Positions; the host drops a cond. that triggers past Max Positions.'"></div>
              </div>
              <label class="tog" style="margin-top:8px">
                <div class="tog-t" :class="cfg.boFlowOn?'on':''" @click.prevent="if(!cfgLocked){cfg.boFlowOn=!cfg.boFlowOn;persist()}"><div class="tog-k"></div></div>
                <div x-data="{ tip: false }">
                  <div class="tog-l">P/A (ticker flow)<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                  <div class="bo-hint" x-show="tip" x-text="_boFlowTip()"></div>
                </div>
              </label>
              <label class="tog" style="margin-top:6px">
                <div class="tog-t" :class="cfg.boCritOn?'on':''" @click.prevent="if(!cfgLocked){cfg.boCritOn=!cfg.boCritOn;persist()}"><div class="tog-k"></div></div>
                <div x-data="{ tip: false }">
                  <div class="tog-l">Criteria<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                  <div class="bo-hint" x-show="tip" x-text="_boCritTip()"></div>
                </div>
              </label>
              <div x-show="cfg.boCritOn">
                <div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:5px">
                  <button type="button" class="bo-seg" :class="cfg.boCritF!==false?'on':''" @click.prevent="if(!cfgLocked){cfg.boCritF=cfg.boCritF===false;persist()}">Fund</button>
                  <button type="button" class="bo-seg" :class="cfg.boCritS!==false?'on':''" @click.prevent="if(!cfgLocked){cfg.boCritS=cfg.boCritS===false;persist()}">L/S</button>
                  <button type="button" class="bo-seg" :class="cfg.boCritL!==false?'on':''" @click.prevent="if(!cfgLocked){cfg.boCritL=cfg.boCritL===false;persist()}">LTA</button>
                  <button type="button" class="bo-seg" :class="cfg.boCritI!==false?'on':''" @click.prevent="if(!cfgLocked){cfg.boCritI=cfg.boCritI===false;persist()}">IO/A</button>
                </div>

              <label class="tog" style="margin-top:6px">
                <div class="tog-t" :class="cfg.boGate?'on':''" @click.prevent="if(!cfgLocked){cfg.boGate=!cfg.boGate;persist()}"><div class="tog-k"></div></div>
                <div x-data="{ tip: false }">
                  <div class="tog-l">Stand down<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                  <div class="bo-hint" x-show="tip" x-text="_boGateTip()"></div>
                </div>
              </label>
              <div x-data="{ tip: false }" style="margin-top:8px">

        // ---- Cell scores ----
        // A base cell = edge (T / B) x k, e.g. 'T1'; a criterion table = criterion letter + sign + base cell, e.g. 'P+T1', 'F-B2'. Per table, three sample types (last boSamples each, $ at the configured notional):
        //   a  first-passage: cond. orders (real, round-1 hypotheticals): trigger first = +k*m, worse first = -m (expired = not stored)
        //   b  round-2 hypothetical positions closed at TP / SL / Force Close, net of fees and funding
        //   c  real positions closed at TP / SL / Force Close, net

        _boLc(x) { const p = x ? Number(x.P) : 0; return p >= PA_MIN ? 'U' : p <= -PA_MIN ? 'D' : 'N'; },
        _boBase(key) { return String(key || '').replace(/^[UDN](?=[TB][123]$)/, ''); }, // cell keys before 2.2.0 led with the lean letter

        // One outcome: the base cell takes it as it is; every criterion the ticker exhibits (x: { P, F, S, L, I } signed strengths) takes its excess over the base cell's
        // average of this type, times the strength, in the +/- table of that cell.
        _boSample(key, type, v, x) {

          const c = this.cfg, N = this._boN();
          if (!c.boCells || typeof c.boCells !== 'object') c.boCells = {};
          const push = (k, val) => {
            const cell = c.boCells[k] || (c.boCells[k] = { a: [], b: [], c: [] });
            const arr = Array.isArray(cell[type]) ? cell[type] : (cell[type] = []);

          if (x && typeof x === 'object') for (const cr of CRITS) { const s = Number(x[cr]); if (s) push(cr + (s > 0 ? '+' : '-') + bk, Math.abs(s) * (v - mean)); }
          push(bk, v);

        _boCellScore(key) {

        // Score of an (edge, k) for a ticker's exhibit x: the base cell + each exhibited criterion's table x its strength. a / b / c are the base cell's samples, crit the criteria's part.
        _boScore(edge, k, x) {

        // Real positions closed at TP / SL / Force Close feed their cell once (stamped _boCell). Reads closedTrades so gap-audit closes count too.
        _boFeedReal() {

        // ---- Hypotheticals (watch lists) ----

        // Closed candles of one interval (min) from startMs, n of them, oldest first. Memoised per tick. Null when the read fails.
        async _boKl(sym, ivMin, startMs, n, memo) {
          const ivMs = ivMin * 60000, key = sym + '|' + ivMin + '|' + startMs + '|' + n;
          if (memo && memo.has(key)) return memo.get(key);

            const url = `${this.base}/v5/market/kline?category=linear&symbol=${sym}&interval=${ivMin}&start=${startMs}&end=${startMs + n * ivMs - 1}&limit=${n}`;
            const r = await (typeof this._qFetch === 'function' ? this._qFetch(url) : fetch(url));

        // First barrier touched. bars = { up, dn, adv } (adv: the adverse barrier, taken when order cannot be resolved). Both touched in one candle = one finer fetch, then adverse first.
        async _boScan(sym, cs, ivMin, bars, memo, refine = true) {
          const ivMs = ivMin * 60000;

            const hu = c.h >= bars.up, hd = c.l <= bars.dn;

        // TP / SL bars of a sim on the bot's own side of the trigger: Chaser TP above / SL below, Winter the reverse.
        _boPosBars(s) { return s.sd > 0 ? { up: s.tp, dn: s.sl, adv: 'dn' } : { up: s.sl, dn: s.tp, adv: 'up' }; },
        _boReason(s, tag) { return (tag === 'up') === (s.sd > 0) ? 'tp' : 'sl'; },
        // Funding accrued up to toMs (before sim.ck moves): one charge per funding time crossed, rate / interval from the host's cache, else the scan-time values.
        _boFund(s, toMs) {

          c.boHypo.n++; if (net > 0) c.boHypo.w++; c.boHypo.pnl += net; c.boHypo.dur += Math.max(0, tMs - s.et);

        _boSimNew(w, x, N) {

          return {

            tp: x.trig * (1 + sd * m / 100), sl: x.trig * (1 - sd * m / 100), sd, n: N, fr: w.fr, fi: w.fi, fa: 0, lc: x.trig, h: x.t + this._boRtMs(), x: w.x || null,

        },
        // Round 1: the scan-time grid (2 edges x 3 k) against the twelve 5m candles of the order life. Trigger first / worse first feed the first-passage scores;
        // a cell whose trigger was reached becomes a round-2 sim, started at the end of the candle it triggered in and walked through the rest of the window.
        // Returns true when done with this watch (also when dropped), false to retry later.
        async _boRound1(w, memo) {
          const c = this.cfg, N = c.minNotional || 6, life = Math.max(1, Number(c.boLifeMins) || 60) * 60000, now = Date.now();
          if (now > w.t + life + 3600000) return true;
          const start = Math.ceil(w.t / MIN5) * MIN5, end = Math.floor((w.t + life) / MIN5) * MIN5;
          if (end <= start) return true;
          const cs = await this._boKl(w.s, 5, start, Math.min(200, (end - start) / MIN5), memo);
          if (!cs) return false;
          const win = cs.filter(x => x.t >= start && x.t < end);

            const trig = p * (1 + dir * dist / 100), worse = p * (1 - dir * m / 100);

        // Round 2: advance one sim to now (or its horizon): 4h candles from a 4h boundary, 5m candles for the stretch up to the next boundary or the horizon.
        // Returns 'closed' when booked, true when advanced / waiting, false when a fetch failed.
        async _boRound2(s, memo) {
          const now = Date.now(), tgt = Math.min(now, s.h), bars = this._boPosBars(s);

          while (s.ck < tgt && guard++ < 14) {

            } else {

        },
        // A sim is due at the next 4h boundary after what it has covered (or its horizon, if sooner), plus a little for the candle to be published.

        _boWatchAdd(pr) {

        },
        // Keeps the round-1 list full: random tickers through the same filters as real orders. A few per tick to spread the fetches.

          const room = max - w1.length;
          if (room <= 0) return false;
          const taken = new Set([...(this.positions || []).map(p => p.symbol), ...(this.condOrders || []).map(o => o.symbol),
            ...w1.map(x => x.s), ...(c.boW2 || []).map(x => x.s)]);
          const mega = new Set(Array.isArray(c.megacapExclude) ? c.megacapExclude : []);
          const pool = (this._lastAllTickers || []).filter(t => t.symbol && t.symbol.endsWith('USDT') && !taken.has(t.symbol) && !mega.has(t.symbol)
            && !(t.symbol in c.boGray) && parseFloat(t.lastPrice || 0) > 0 && !this._isSymbolBanned?.(t.symbol));
          for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
          let added = 0, tries = 0;
          for (const t of pool) {

            catch (e) { this.log(`[BO] watch ${t.symbol} error: ${e.message}`, 'warn'); }
          }
          return tries > 0;
        },
        // One pass every 30s (rides the cond. order watcher): real closes feed the scores, due round-1 / round-2 items are walked (a few tickers per pass), the list is refilled.
        async _boSimTick() {
          const c = this.cfg;
          if (!c.boEnabled || this._boSimBusy) return;

          if (now - (this._boSimAt || 0) < 30000) return;

              try { ok = await this._boRound1(w, memo); } catch (e) { this.log(`[BO] round 1 ${w.s} error: ${e.message}`, 'warn'); }
              if (ok) { c.boW1 = c.boW1.filter(x => x !== w); dirty = true; }

        _boResolve(sym, hit) {
          const edges = this.cfg.boEdges || {};

        _boSetMeta(sym, cand) {

        },

        // Fallback for fills that bypass _condTrigger (live plugins): a pending order gone from the cond. list with a position on the ticker was triggered; any other disappearance is dropped from the tally.
        _boReconcile() {
          const edges = this.cfg.boEdges;
          if (!edges) return;
          const live = new Set([...(this.condOrders || []).filter(o => o.tag === 'breakout').map(o => o.symbol)]);

        },

        _boStatus() {
          const q = this.cfg.boRetry || [];
          return 'Pending ' + (this.condOrders || []).filter(o => o.tag === 'breakout').length + '/' + (this.cfg.maxCond ?? 30) + ' · Watching R1 ' + (this.cfg.boW1 || []).length + ' / R2 ' + (this.cfg.boW2 || []).length + ' · Retry queue ' + (q.length ? q.map(s => s.replace('USDT', '')).join(', ') : 'empty') + ' · Graylisted ' + Object.keys(this.cfg.boGray || {}).length;
        },

        async init() {
          await _origInit.call(this);
          this._boLoaded = true;
          // Position-type badge: TOP / BOTTOM on pending conds and on positions / closed trades they became (stamped via the candidate's _boEdge).
          if (typeof this.registerRoleBadge === 'function') this.registerRoleBadge(item => {
            const e = item && (item._boEdge || item.candidate?._boEdge);
            if (e !== 'top' && e !== 'bottom') return null;
            const f = item._boFlow || item.candidate?._boFlow;
            const dm = Number(item._boMult || item.candidate?._boMult) > 1;
            const pre = dm ? 'D-' : f === 'with' ? 'W-' : f === 'against' ? 'A-' : '';
            const ttl = dm ? 'Breakout double ' + e + ', ' + (item._boMult || item.candidate._boMult) + 'x' : (f === 'with' ? 'Breakout with flow, ' + e : f === 'against' ? 'Breakout against flow, ' + e : 'Breakout ' + e);
            return `<span title="${ttl}" style="font-family:var(--mono);font-size:9px;letter-spacing:1px;padding:2px 5px;border-radius:2px;border:1px solid rgba(var(--bo-rgb),.35);background:rgba(var(--bo-rgb),.15);color:var(--bo-acc)">${pre}${e.toUpperCase()}</span>`;
          });
          for (const [k, v] of Object.entries(BO_DEFAULT_CFG)) {
            if (this.cfg[k] === undefined) this.cfg[k] = Array.isArray(v) ? [...v] : (v && typeof v === 'object' ? { ...v } : v);

          if (!Array.isArray(this.cfg.boRetry)) this.cfg.boRetry = [];
          this.cfg.boInval = (Array.isArray(this.cfg.boInval) ? this.cfg.boInval : []).filter(x => /^[WAD][TB]$/.test(x)).slice(-TALLY_WINDOW);
          this.cfg.boLog = (Array.isArray(this.cfg.boLog) ? this.cfg.boLog : []).filter(x => x === 'T' || x === 'B' || x === 'N').slice(-TALLY_WINDOW);
          for (const k of ['boGray', 'boWhite', 'boEdges', 'boCellOf', 'boCells']) if (!this.cfg[k] || typeof this.cfg[k] !== 'object' || Array.isArray(this.cfg[k])) this.cfg[k] = {};
          for (const k of ['boW1', 'boW2']) this.cfg[k] = (Array.isArray(this.cfg[k]) ? this.cfg[k] : []).filter(x => x && x.s && x.p !== 0);
          if (!this.cfg.boHypo || typeof this.cfg.boHypo !== 'object') this.cfg.boHypo = { n: 0, w: 0, pnl: 0, dur: 0 };
          // Cells before 2.2.0 were lean x edge x k ('UT1'): that lean was a break count, a different P/A, so those samples only feed the base cells now (T1 ... B3); criterion tables start empty.
          { const old = this.cfg.boCells, fresh = {}, N = this._boN();
            for (const k of Object.keys(old)) {
              const x = old[k], key = this._boBase(k);
              if (!x || typeof x !== 'object' || !/^([TB][123]|[PFSLI][+-][TB][123])$/.test(key)) continue;
              const d = fresh[key] || (fresh[key] = { a: [], b: [], c: [] });
              for (const t of ['a', 'b', 'c']) if (Array.isArray(x[t])) d[t] = d[t].concat(x[t].filter(Number.isFinite)).slice(-N);
            }
            this.cfg.boCells = fresh; }
          for (const k of ['boAuto', 'boAutoPct', 'boAutoTicker', 'boTickLatch', 'boFlowUp', 'boFlowDown', 'boMult', 'boEntry', 'boFlow', 'boTrack']) delete this.cfg[k]; // retired Auto-switch settings
          // Orders pending from before the edge setting all entered at the bot's default edge.
          for (const o of (this.condOrders || [])) if (o.tag === 'breakout' && !this.cfg.boEdges[o.symbol]) this.cfg.boEdges[o.symbol] = this._boDefaultEdge();
        },

        // A worse-price hit is the one cancel that requeues the ticker: the host (and live plugins) cancel with a reason starting 'worst case reached'.
        async cancelCondOrder(id, reason = 'manual') {
          const o = (this.condOrders || []).find(x => x.id === id);
          const ok = await _origCancel.call(this, id, reason);
          if (ok && o && o.tag === 'breakout') {
            if (/^worst case reached/.test(String(reason))) { this._boResolve(o.symbol, 'worse'); this._boRetryAdd(o.symbol); this._boInvalidate(o); }
            else if (reason === 'breakout expired') this._boResolve(o.symbol, 'none');
            else if (this.cfg.boEdges) { delete this.cfg.boEdges[o.symbol]; if (this.cfg.boCellOf) delete this.cfg.boCellOf[o.symbol]; }
          }
          return ok;
        },

        // Expiry rides the cond. order watcher so it fires on time rather than at the next scan; the hypotheticals tick here too (throttled to 30s).
        async pseudoWatchCondOrders() {
          const r = await _origWatch.call(this);
          if (this._boLoaded) {
            try { this._boReconcile(); await this._boExpire(); await this._boCapCheck(); } catch (e) { this.log(`[BO] expiry error: ${e.message}`, 'warn'); }
            try { await this._boSimTick(); } catch (e) { this.log(`[BO] sim error: ${e.message}`, 'warn'); }
          }
          return r;
        },

        // A target hit is the fill, even when the host then drops it for no free position slot. Logged before the host's first await so a reconcile can't miss it.
        async _condTrigger(o, at = 0) {
          if (o && o.tag === 'breakout' && (this.condOrders || []).some(x => x.id === o.id)) this._boResolve(o.symbol, 'entry');
          const r = await _origTrigger.call(this, o, at);
          if (this._boLoaded) { try { await this._boCapCheck(); } catch (e) { this.log(`[BO] cap check error: ${e.message}`, 'warn'); } }
          return r;
        },

        _boAtCap() { return (this.positions || []).length >= (this.cfg.maxPos ?? 5); },

        // At max positions every pending Breakout cond. is cancelled (the host drops a cond. that triggers past Max Positions anyway) and none are tracked. Runs after each cond. fill, each watcher tick and each batch.
        async _boCapCheck() {
          if (!this._boAtCap()) return;
          const pend = (this.condOrders || []).filter(o => o.tag === 'breakout');
          if (!pend.length) return;
          for (const o of pend) {
            try { await this.cancelCondOrder(o.id, 'breakout max positions'); }
            catch (e) { this.log(`[BO] cap cancel error (${o.symbol}): ${e.message}`, 'warn'); }
          }
          this.log(`[BO] ${this._boGlyph()} Max positions (${(this.positions || []).length}/${this.cfg.maxPos ?? 5}) — ${pend.length} cond. order${pend.length === 1 ? '' : 's'} cancelled`, 'warn');
          this.persist();
        },

        _boRetryAdd(sym) {
          if (!Array.isArray(this.cfg.boRetry)) this.cfg.boRetry = [];
          if (this.cfg.boRetry.includes(sym)) return;
          this.cfg.boRetry.push(sym);
          this.log(`[BO] 🔁 ${sym} reached the worse price — queued for the next batch`, 'info');
          this.persist();
        },

        async _boExpire() {
          const now = Date.now(), life = Math.max(1, Number(this.cfg.boLifeMins) || 60) * 60000;
          const old = (this.condOrders || []).filter(o => o.tag === 'breakout' && now - (o.createdAt || 0) >= life);
          for (const o of old) {
            try { await this.cancelCondOrder(o.id, 'breakout expired'); }
            catch (e) { this.log(`[BO] expiry error (${o.symbol}): ${e.message}`, 'warn'); }
          }
        },

        // Last 24 closed 1hr candles, newest first from the exchange; the forming candle is dropped. Null when the ticker has fewer than 24.
        async _boCandles(sym) {
          const url = `${this.base}/v5/market/kline?category=linear&symbol=${sym}&interval=60&limit=${CANDLES + 1}`;
          const r = await (typeof this._qFetch === 'function' ? this._qFetch(url) : fetch(url));
          const list = (await r.json())?.result?.list;
          if (!Array.isArray(list)) return null;
          const now = Date.now();
          const closed = list.filter(c => Number(c[0]) + HOUR_MS <= now).slice(0, CANDLES);
          return closed.length === CANDLES ? closed : null;
        },

        // Average move, %: mean of (high - low) / open over the candles.
        _boAvgMove(candles) {
          let sum = 0, n = 0;
          for (const c of candles) {
            const o = parseFloat(c[1]), h = parseFloat(c[2]), l = parseFloat(c[3]);
            if (!(o > 0) || !(h >= l)) continue;
            sum += (h - l) / o * 100; n++;
          }
          return n === CANDLES ? sum / n : null;
        },

        // Stablecoin filter: the 24 candles' full span, %. A stablecoin never moves 1%.
        _boSpan(candles) {
          let hi = -Infinity, lo = Infinity;
          for (const c of candles) { hi = Math.max(hi, parseFloat(c[2])); lo = Math.min(lo, parseFloat(c[3])); }
          return lo > 0 && isFinite(hi) ? (hi / lo - 1) * 100 : 0;
        },

        // Market snapshot from the bulk list (60s memo): median open interest ($) and median |funding| (%) over the tickers that pass entry-like filters: no big caps, no graylisted
        // (illiquid / stablecoin) tickers, no 24h span under the stablecoin minimum, no dead turnover. Deliberately not size-normalized.
        _boMkt() {
          const now = Date.now(), memo = this._boMktC;
          if (memo && now - memo.t < 60000) return memo;
          const c = this.cfg, mega = new Set(Array.isArray(c.megacapExclude) ? c.megacapExclude : []), io = [], fa = [];
          for (const t of (this._lastAllTickers || [])) {
            const sym = t.symbol;
            if (!sym || !sym.endsWith('USDT') || mega.has(sym) || (c.boGray && sym in c.boGray) || this._isSymbolBanned?.(sym)) continue;
            const lp = parseFloat(t.lastPrice), oi = parseFloat(t.openInterestValue), tv = parseFloat(t.turnover24h), hi = parseFloat(t.highPrice24h), lo = parseFloat(t.lowPrice24h);
            if (!(lp > 0) || !(oi > 0) || !(tv > 0)) continue;
            if (hi > 0 && lo > 0 && (hi / lo - 1) * 100 < MIN_SPAN_PCT) continue;
            io.push(oi); fa.push(Math.abs(parseFloat(t.fundingRate) || 0) * 100);
          }
          const med = a => { if (!a.length) return 0; a.sort((p, q) => p - q); const h = a.length >> 1; return a.length % 2 ? a[h] : (a[h - 1] + a[h]) / 2; };
          return (this._boMktC = { t: now, io: med(io), fa: med(fa), n: io.length });
        },
        // Long share of accounts (0..1) from the exchange's account ratio, latest 1h point. Null when the read fails.
        async _boRatio(sym) {
          try {
            const url = `${this.base}/v5/market/account-ratio?category=linear&symbol=${sym}&period=1h&limit=1`;
            const r = await (typeof this._qFetch === 'function' ? this._qFetch(url) : fetch(url));
            const b = parseFloat(((await r.json())?.result?.list || [])[0]?.buyRatio);
            return b > 0 && b < 1 ? b : null;
          } catch (e) { return null; }
        },
        // Strength of each criterion for one ticker: { P, F, S, L, I }, signed -1..1, only those switched on and not ~0. Its own funding and IO come from the per-ticker read in _boPrep,
        // turnover from its candles, skew is one extra fetch; the median IO and typical funding come from the bulk list.
        async _boExhibit(sym, t, tk, candles, fr) {
          const c = this.cfg, x = {};
          const put = (cr, raw) => { const s = Math.max(-1, Math.min(1, raw / CRIT_FULL[cr])); if (Number.isFinite(s) && Math.abs(s) >= 0.01) x[cr] = +s.toFixed(3); };
          if (c.boFlowOn) put('P', this._boPA(candles));
          if (!c.boCritOn) return x;
          const on = cr => c['boCrit' + cr] !== false, mk = this._boMkt();
          if (on('F') && mk.fa > 0) put('F', fr / mk.fa);
          if (on('S')) { const b = await this._boRatio(sym); if (b != null) put('S', b - 0.5); }
          if (on('L')) {
            const tv = candles.map(cd => parseFloat(cd[6])), h = tv.length >> 1; // newest first
            const rec = tv.slice(0, h).reduce((p, q) => p + q, 0), old = tv.slice(h).reduce((p, q) => p + q, 0);
            if (Number.isFinite(rec) && Number.isFinite(old) && rec + old > 0) put('L', (rec - old) / (rec + old));
          }
          if (on('I') && mk.io > 0) { const io = parseFloat(tk && tk.openInterestValue != null ? tk.openInterestValue : t && t.openInterestValue); if (io > 0) put('I', Math.log(io / mk.io)); }
          return x;
        },

        // Illiquidity filter: average gap between the last 3 trades, ms (newest first). Null when the read fails.
        async _boTradeGap(sym) {
          try {
            const r = await fetch(`${this.base}/v5/market/recent-trade?category=linear&symbol=${sym}&limit=3`);
            const ts = ((await r.json())?.result?.list || []).map(x => Number(x.time)).filter(x => x > 0);
            if (ts.length < 3) return Infinity; // fewer than 3 trades on record is as illiquid as it gets
            return (Math.max(...ts) - Math.min(...ts)) / (ts.length - 1);
          } catch (e) { return null; }
        },

        _boGrayAdd(sym, why) {
          this.cfg.boGray[sym] = Date.now();
          this.log(`[BO] ⛔ ${sym}: ${why} — graylisted for a week`, 'info');
        },

        // Leverage the host will open with: Winter resolves it per ticker, Chaser uses the config value. TP / SL are ROI %, i.e. price move % x leverage.
        async _boLev(sym) {
          if (typeof this.resolveEffectiveLeverage === 'function') {
            const instr = await this.getInstrInfo(sym);
            const r = instr && this.resolveEffectiveLeverage(sym, instr);
            return r && r.lev > 0 ? r.lev : null;
          }
          return this.cfg.leverage > 0 ? this.cfg.leverage : 1;
        },

        // Everything before an order or a watch: candles, average move, filters, fresh price (and funding / IO), criteria, leverage when an order is going to be placed. Null when the ticker is skipped.
        async _boPrep(sym, t, retry, needLev) {
          const candles = await this._boCandles(sym);
          if (!candles) { this.log(`[BO] ${sym}: fewer than ${CANDLES} closed 1hr candles — skipped`, 'info'); return null; }
          const m = this._boAvgMove(candles);
          if (!(m > 0)) return null;
          const span = this._boSpan(candles);
          if (span < MIN_SPAN_PCT) {
            if (retry) this.log(`[BO] ${sym}: stablecoin filter — ${span.toFixed(2)}% span over ${CANDLES}h — skipped`, 'info');
            else this._boGrayAdd(sym, `stablecoin filter, ${span.toFixed(2)}% span over ${CANDLES}h`);
            return null;
          }
          const white = Date.now() - (this.cfg.boWhite[sym] || 0) < GRAY_MS;
          const gap = white ? 0 : await this._boTradeGap(sym);
          if (gap != null && gap > MAX_GAP_MS) {
            const why = `illiquidity filter, last 3 trades ${isFinite(gap) ? (gap / 1000).toFixed(1) + 's' : 'not found'} apart`;
            if (retry) this.log(`[BO] ${sym}: ${why} — skipped`, 'info');
            else this._boGrayAdd(sym, why);
            return null;
          }
          if (gap != null && !white) this.cfg.boWhite[sym] = Date.now();
          let price = parseFloat(t?.lastPrice || 0), fr = parseFloat(t?.fundingRate || 0) * 100, fi = t?.fundingIntervalHour ? parseInt(t.fundingIntervalHour, 10) * 3600000 : 28800000;
          let tk = null; // the ticker's own fresh read: price, funding, IO
          try {
            const r = await fetch(`${this.base}/v5/market/tickers?category=linear&symbol=${sym}`);
            tk = (await r.json())?.result?.list?.[0];
            const lp = parseFloat(tk?.lastPrice);
            if (lp > 0) price = lp;
            if (tk && tk.fundingRate != null) fr = parseFloat(tk.fundingRate) * 100;
            if (tk && tk.fundingIntervalHour) fi = parseInt(tk.fundingIntervalHour, 10) * 3600000;
          } catch (e) {}
          if (!(price > 0)) return null;
          let lev = 0;
          if (needLev) { lev = await this._boLev(sym); if (!lev) return null; }
          const frv = Number.isFinite(fr) ? fr : 0;
          const x = await this._boExhibit(sym, t, tk, candles, frv);
          return { sym, t, candles, m, x, L: this._boLc(x), price, lev, fr: frv, fi };
        },

        // One cond. order at the cell the scores draw for this ticker's lean. Edge 'bottom': trigger below price, worse above. Edge 'top': trigger above, worse below.
        // Returns the order, 'gated' (every eligible cell is under water: watched instead), or null.
        async _boPlace(sym, t, retry) {
          const pr = await this._boPrep(sym, t, retry, true);
          if (!pr) return null;
          const { m, x, L, price, lev } = pr;
          const pk = this._boPick(x);
          if (pk.gated) { this._boWatchAdd(pr); return 'gated'; }
          const edge = pk.pick.edge, k = pk.pick.k, key = pk.pick.key, flow = this._boFlowOf(L, edge);
          const dir = edge === 'top' ? 1 : -1;
          const dist = Math.min(m * k, 90); // % from price to the trigger; capped so the trigger stays a positive price
          const target = price * (1 + dir * dist / 100), worst = price * (1 - dir * m / 100);
          const roi = +(m * lev).toFixed(2);
          const cand = {
              symbol: sym, price, change: parseFloat(t?.price24hPcnt || 0) * 100, fundingRate: parseFloat(t?.fundingRate || 0) * 100,
              _tpPct: roi, _slPct: roi, _bo: true, _boMovePct: +m.toFixed(3), _boEdge: edge, _boCell: key, ...(Object.keys(x).length ? { _boX: x } : {}), ...(flow ? { _boFlow: flow } : {}), ...(k > 1 ? { _boMult: k } : {}),
          };
          const o = await this.placeCondEntry({ candidate: cand, target, worst, tag: 'breakout' });
          if (o) {
            this.cfg.boEdges[sym] = edge;
            this._boSetMeta(sym, cand);
            this.log(`[BO] ${this._boGlyph()} ${sym}${retry ? ' (retry)' : ''}: average move ${m.toFixed(2)}% (${CANDLES}×1hr) — cond. ${dir > 0 ? '+' : '-'}${dist.toFixed(2)}% (${this._boLabel(L, edge, k)}; cell ${key} ${this._boFmt(pk.pick.S)}${this._boXText(x)}), TP/SL ${m.toFixed(2)}% from the trigger`, 'info');
          }
          return o;
        },

        // Fills every free position slot: queued retries first, then random tickers from the bulk list.
        async _boBatch() {
          if (this._boBusy) return;
          this._boBusy = true;
          try {
            const c = this.cfg;
            if (!c.boEnabled) return;
            if (!c.binaryModeEnabled) {
              if (!this._boBinWarned) { this._boBinWarned = true; this.log('[BO] ⚠️ Binary Mode is off — TP and SL are only set at entry there, so no Breakout orders are placed', 'warn'); }
              return;
            }
            this._boBinWarned = false;
            if (this._isDrawdownHalted?.() || this._isGainsLocked?.()) return;

            this._boReconcile();
            await this._boCapCheck();
            if (this._boAtCap()) return; // max positions: no new conds
            const n = (this.condOrders || []).length;
            const free = (c.maxCond ?? 30) - n; // the host's Max Cond. Orders; Max Positions does not cap this
            if (free <= 0) return;

            const taken = new Set([...(this.positions || []).map(p => p.symbol), ...(this.condOrders || []).map(o => o.symbol)]);
            const tmap = new Map((this._lastAllTickers || []).map(t => [t.symbol, t]));

            // Retries the batch has room for leave the queue; the rest wait for the next batch.
            const usable = (Array.isArray(c.boRetry) ? c.boRetry : []).filter(s => !taken.has(s) && !this._isSymbolBanned?.(s));
            const retries = usable.slice(0, free);
            c.boRetry = usable.slice(free);
            const rset = new Set(retries);

            const now = Date.now();
            for (const m of [c.boGray, c.boWhite]) for (const k of Object.keys(m)) if (now - m[k] >= GRAY_MS) delete m[k];
            const mega = new Set(Array.isArray(c.megacapExclude) ? c.megacapExclude : []);
            const pool = (this._lastAllTickers || []).filter(t => t.symbol && t.symbol.endsWith('USDT') && !taken.has(t.symbol) && !rset.has(t.symbol)
              && !mega.has(t.symbol) && !(t.symbol in c.boGray) && parseFloat(t.lastPrice || 0) > 0 && !this._isSymbolBanned?.(t.symbol));
            for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }

            const queue = [...retries.map(s => ({ s, t: tmap.get(s), retry: true })), ...pool.map(t => ({ s: t.symbol, t, retry: false }))];
            const maxTry = free * 3; // a few spare picks for tickers that fail (new listings, refused orders)
            let placed = 0, tries = 0, gated = 0, gatedRun = 0;
            for (const q of queue) {
              if (placed >= free || tries >= maxTry || gatedRun >= 6) break; // six stood-down picks in a row: every lean is under water, stop spending fetches
              tries++;
              try {
                const o = await this._boPlace(q.s, q.t, q.retry);
                if (o === 'gated') { gated++; gatedRun++; } else { gatedRun = 0; if (o) placed++; }
              }
              catch (e) { this.log(`[BO] ${q.s} error: ${e.message}`, 'warn'); }
            }
            this.log(`[BO] ${this._boGlyph()} Batch — ${placed}/${free} order${free === 1 ? '' : 's'} placed${retries.length ? ` (${retries.length} retry)` : ''}${gated ? `, ${gated} stood down (watched instead)` : ''}`, 'info');
            this.persist();
          } finally { this._boBusy = false; }
        },

        // Live fills bypass _condTrigger: check the cap the moment one lands instead of waiting for the next watcher tick.
        ...(_liveFilled ? { [_liveFilled]: async function (o) {
          const r = await _origLiveFilled.call(this, o);
          if (this._boLoaded) { try { this._boReconcile(); await this._boCapCheck(); } catch (e) { this.log(`[BO] live fill check error: ${e.message}`, 'warn'); } }
          return r;
        } } : {}),

      }, _hostStages
        ? { _scanStageDefs: [...def._scanStageDefs,
            { id: 'bo-batch', group: 'bo', run: function (ctx) { return this._boBatch(ctx); } },
          ] }
        : { async runScan() {
            await _origScan.call(this);
            await this._boBatch();
          } });
    },
  };
})();
</script>
