<!--
  Breakout Plugin for PseudoChaser and PseudoWinter (unified)
  Volume breakouts, with no scoring, no forecasting and no simulation.

  Each batch picks random tickers (up to Max Cond. Orders; one slot per ticker) and reads the last twenty-four closed 1hr candles of each. For TP / SL the candles are split by colour: the green candles (close above open) give the
  average TOP move, the mean of (high - open) / open, in %; the red candles (close below open) give the average BOTTOM move, the mean of (open - low) / open, in %. Doji candles count
  for neither; a ticker with no green or no red candle among the 24 is skipped.

  Each ticker gets a volume watch on one edge of its own 24h hourly turnover range (USDT), top or bottom, never both. Every 10s the watch reads the forming 1hr candle's turnover against the last 24 closed candles'. A top break is the forming candle's turnover above the highest of the 24 (can fire mid-candle); a bottom break is a candle closing with turnover below the lowest of the 24 (only after the close).
  The watch's own edge breaking opens a position at market on the bot's side; the opposite edge breaking first cancels the watch. Every break counts. TP / SL come from the average moves, measured from the entry on the bot's own side (Chaser: TP = top move above, SL = bottom move below; Winter: TP = bottom move below, SL = top move above). Nothing about the ticker is predicted.

  Every watch is a Double or a Revert of the last break, the turnover extreme (24h high or low) that printed most recently. Double = the same edge as the last break (Double Top is bullish, Double Bottom bearish);
  Revert = the other edge (Revert Top: the last break was the bottom, now the top is targeted). The type is stamped on every position, whether Decisive Edge is on or off.
  Decisive Edge on watches only the ticked types (Double Top, Revert Top, Double Bottom, Revert Bottom). A ticker's last break gives it one Double and one Revert candidate: if both are ticked one is drawn, if neither the ticker is skipped.
  Defaults: Chaser ticks Double Top and Revert Top (top edge only), Winter Double Bottom and Revert Bottom (bottom edge only). Off, the edge is a coin flip.

  Break counter (readout only): every volume break, top or bottom, is kept for the Break window (default 24h) and shown in the LIVE readout. It stops nothing: watches are placed whatever the counts. Expired watches are not breaks.

  Max positions: once open positions reach the host's Max Positions, every watch is cancelled and no new ones are placed. They resume when a slot frees. Each watch shows as a card in the accordion.

  Two fixed filters run before every watch (no toggles):
    Stablecoin   — the 24 candles' full span (lowest low to highest high) must be at least 1%, else the ticker is a stablecoin.
    Illiquidity  — the last 3 trades are fetched; if they average more than 12s apart the ticker is illiquid.
  A ticker failing either is graylisted for a week. A ticker confirmed liquid is whitelisted for a week and skips the trade fetch.

  Watches expire after Order Life (default 1440 min) and are simply cancelled.
  TP / SL are set at entry only in Binary Mode, so Binary Mode must be on (the plugin places nothing otherwise).
  Needs no other plugin. The side is read from the host at load.

  Load via Plugin Manager in either bot's config panel, AFTER SunChaser / EverWinter if live.
  targetBot: both
-->
<script>
(function () {
  'use strict';

  const VERSION = '1.16.0'; // Change: Decisive Edge takes the types to watch (Double / Revert Top / Bottom) in place of the Target switch | previous: 1.15.1 — Hist / Num removed, only Double / Revert types, always stamped
  let   WINTER  = false;   // set in transform() from the host
  const CANDLES = 24;      // closed 1hr candles the top / bottom moves are read from
  const HOUR_MS = 3600000;
  const VOL_POLL_MS = 10000;       // each watch reads its kline this often
  const BO_NAME = e => (e === 'top' ? 'Top' : 'Bottom');
  // Type of an entry on edge e after a last break: Double (same edge) or Revert (the other edge).
  const BO_TYPE = (last, e) => (last === e ? 'Double ' : 'Revert ') + BO_NAME(e);
  const MIN_SPAN_PCT = 1;          // stablecoin filter: least % span the 24 candles must cover
  const MAX_GAP_MS   = 12000;      // illiquidity filter: most average ms between the last 3 trades
  const GRAY_MS      = 7 * 86400000; // graylist time for a ticker that fails either filter

  const BO_DEFAULT_CFG = Object.freeze({
    boEnabled: true,   // Breakout mode
    boDecide: true,    // Decisive Edge: watch only the ticked types (off = coin flip); boTypes { dt, rt, db, rb } is set per bot in init
    boLifeMins: 1440,  // how long a volume watch waits before it is cancelled
    boWinH: 24,        // break window, hours: breaks older than this stop counting
    boBreaks: [],      // [ms, 'T' | 'B'] volume breaks (top / bottom) inside the window
    boWatch: {},       // symbol -> volume watch { t, edge, chk, next, ... }
    boWhite: {},       // symbol -> epoch ms it was confirmed liquid; skips the trade fetch for a week
    boGray: {},        // symbol -> epoch ms it was graylisted (stablecoin / illiquid), kept a week
  });

  window.__BotPlugin = {
    id:        'breakout',
    name:      'Breakout',
    version:   VERSION,
    targetBot: 'both',
    after:     ['sunchaser', 'everwinter'],
    before:    [],
    conflicts: [],
    requires:  [],
    touches:   ['init', 'runScan', 'pseudoWatchCondOrders', '_condTrigger', '_ewCondFilled', '_scCondFilled'],
    css: `
      :root { --bo-rgb:255,200,60; --bo-acc:#ffc83c; }
      .bo-hint { font-size:9px; color:var(--text-lo); margin-top:3px; line-height:1.5; }
      .bo-g { color:#3ddc84; } .bo-r { color:#ff5a5f; }
      .bo-info { display:inline-flex; align-items:center; justify-content:center; width:12px; height:12px; margin-left:6px; padding:0; border-radius:50%; border:1px solid rgba(var(--bo-rgb),.35); background:transparent; color:var(--bo-acc); font:700 8px/1 var(--mono); cursor:pointer; flex:none; vertical-align:middle; }
      .bo-info.on { background:rgba(var(--bo-rgb),.15); }
      .bo-live { position:relative; margin-top:8px; padding:3px 8px; border:1px solid rgba(var(--bo-rgb),.28); border-left:3px solid var(--bo-acc); border-radius:4px; background:rgba(var(--bo-rgb),.05); font-family:var(--mono); font-size:10px; color:var(--text-hi); }
      .bo-lr { position:relative; display:flex; align-items:center; gap:7px; padding:4px 0; cursor:help; }
      .bo-ttl { font-weight:700; letter-spacing:2px; color:var(--bo-acc); }
      .bo-cnt { color:var(--text-lo); } .bo-cnt b { margin-left:2px; color:var(--text-hi); } .bo-cnt.lead b { color:var(--bo-acc); }
      .bo-blink { color:var(--warn); animation:bo-blink 1.6s infinite; }
      @keyframes bo-blink { 50% { opacity:.4; } }
      .bo-pop { position:absolute; left:0; right:0; top:100%; z-index:20; margin-top:2px; padding:5px 7px; font-size:9px; font-weight:400; letter-spacing:0; line-height:1.5; color:var(--text-mid); background:var(--bg-panel,#15110c); border:1px solid rgba(var(--bo-rgb),.35); border-radius:3px; box-shadow:0 4px 12px rgba(0,0,0,.5); }
      .bo-sw { display:flex; align-items:center; gap:4px; margin-top:4px; font-size:9px; color:var(--text-lo); } .bo-sw span { width:80px; }
      .bo-sw button { font:700 9px var(--mono); padding:2px 8px; border-radius:3px; border:1px solid rgba(var(--bo-rgb),.35); background:transparent; color:var(--text-lo); cursor:pointer; } .bo-sw button.on { background:rgba(var(--bo-rgb),.15); color:var(--bo-acc); }
      .bo-in { width:60px; font-family:var(--mono); font-size:10px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.12); border-radius:3px; color:var(--text-hi); padding:2px 5px; }
    `,

    slots: {
      'mode-label-extra': `<span x-show="cfg.boEnabled"> + Breakout</span>`,
      'strategy-accordions': `
        <div x-data="{ open: false }">
          <button class="cfg-acc-hd" @click="open=!open" :class="open?'open':''">
            <div style="display:flex;align-items:center;gap:7px">
              <span><span x-text="_boGlyph()"></span> Breakout</span>
              <span x-show="cfg.boEnabled" style="font-size:8px;padding:1px 5px;background:rgba(var(--bo-rgb),.15);border:1px solid rgba(var(--bo-rgb),.35);border-radius:2px;color:var(--bo-acc);letter-spacing:1px">ON</span>
              <span x-show="!cfg.boEnabled" style="font-size:8px;padding:1px 5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:2px;color:var(--text-lo);letter-spacing:1px">OFF</span>
            </div>
            <span class="cfg-acc-arrow" :class="open?'open':''">▶</span>
          </button>
          <div x-show="open" x-transition.opacity class="cfg-acc-body">
            <label class="tog">
              <div class="tog-t" :class="cfg.boEnabled?'on':''" @click.prevent="if(!cfgLocked){cfg.boEnabled=!cfg.boEnabled;persist()}"><div class="tog-k"></div></div>
              <div x-data="{ tip: false }">
                <div class="tog-l">Breakout Mode<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                <div class="bo-hint" x-show="tip">One watch per ticker on its 24h hourly turnover top or bottom, entering at market on a break. TP and SL come from the average green / red candle moves.</div>
              </div>
            </label>
            <div x-show="cfg.boEnabled" style="margin-top:8px">
              <div x-data="{ tip: false }">
                <label class="tog">
                  <div class="tog-t" :class="cfg.boDecide?'on':''" @click.prevent="if(!cfgLocked){cfg.boDecide=!cfg.boDecide;persist()}"><div class="tog-k"></div></div>
                  <div>
                    <div class="tog-l">Decisive Edge<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                  </div>
                </label>
                <div class="bo-hint" x-show="tip">Off = a coin flip picks the edge. On = only the ticked types are watched: Double takes the last break's edge, Revert the other. One must stay ticked.</div>
                <div class="bo-sw" x-show="cfg.boDecide">
                  <span>Top</span>
                  <button type="button" :class="cfg.boTypes?.dt?'on':''" @click="_boTypeToggle('dt')">DOUBLE</button>
                  <button type="button" :class="cfg.boTypes?.rt?'on':''" @click="_boTypeToggle('rt')">REVERT</button>
                </div>
                <div class="bo-sw" x-show="cfg.boDecide">
                  <span>Bottom</span>
                  <button type="button" :class="cfg.boTypes?.db?'on':''" @click="_boTypeToggle('db')">DOUBLE</button>
                  <button type="button" :class="cfg.boTypes?.rb?'on':''" @click="_boTypeToggle('rb')">REVERT</button>
                </div>
              </div>
              <div x-data="{ tip: false }" style="margin-top:8px">
                <div style="display:flex;align-items:center;gap:6px">
                  <span class="lbl" style="margin:0">Order life (min)</span>
                  <input type="number" min="1" step="1" class="bo-in" x-model.number="cfg.boLifeMins" @change="cfg.boLifeMins=Math.max(1,Math.round(+cfg.boLifeMins||1440));persist()">
                  <button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button>
                </div>
                <div class="bo-hint" x-show="tip">Each ticker gets one watch, on its top or bottom edge. Unbroken watches are cancelled after this. Each takes one of the Max Cond. Orders, independent of Max Positions.</div>
              </div>
              <div x-data="{ tip: false }" style="margin-top:6px">
                <div style="display:flex;align-items:center;gap:6px">
                  <span class="lbl" style="margin:0">Break window (h)</span>
                  <input type="number" min="0.5" step="0.5" class="bo-in" x-model.number="cfg.boWinH" @change="cfg.boWinH=Math.max(0.5,+cfg.boWinH||24);persist()">
                  <button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button>
                </div>
                <div class="bo-hint" x-show="tip">Volume breaks are counted as top / bottom breaks over this window and shown in the LIVE readout. The count is informational only; it does not stop or cancel anything.</div>
              </div>
              <div class="bo-live">
                <div class="bo-lr" x-data="{ tip: false }" @pointerenter="if ($event.pointerType === 'mouse') tip = true" @pointerleave="if ($event.pointerType === 'mouse') tip = false" @click="if (($event.pointerType || 'touch') !== 'mouse') tip = !tip">
                  <span class="bo-ttl"><span x-text="_boGlyph()"></span> LIVE</span>
                  <span class="bo-blink" x-show="!cfg.binaryModeEnabled">&#9888;</span>
                  <span><b x-text="_boPend()"></b><span style="color:var(--text-lo)">/<span x-text="cfg.maxCond ?? 30"></span></span></span>
                  <span class="bo-cnt bo-g">&#9650;<b x-text="_boTally(tick).top"></b></span>
                  <span class="bo-cnt bo-r">&#9660;<b x-text="_boTally(tick).bottom"></b></span>
                  <div class="bo-pop" x-show="tip" x-text="_boTip(tick)"></div>
                </div>
              </div>
              <div x-show="_boWatchRows(tick).length" style="margin-top:6px">
                <template x-for="s in _boWatchRows(tick)" :key="s.sym">
                  <div class="cnd-card" style="border-left-color:var(--bo-acc)">
                    <div class="cnd-head">
                      <span class="pos-sym" x-text="s.sym"></span>
                      <span class="side-badge" x-text="_boSide()"></span>
                      <span class="cnd-meta" x-show="s.tags" x-text="s.tags" style="margin-left:0;color:var(--bo-acc)"></span>
                      <span class="cnd-meta" x-text="fmtAge(s.t, tick)"></span>
                    </div>
                    <div class="cnd-row">
                      <span class="cnd-l" x-text="s.label"></span>
                      <span class="cnd-p" x-text="s.p"></span>
                      <span class="cnd-bar"><i class="t" :style="'width:'+s.fill+'%'"></i></span>
                      <span class="cnd-d" x-text="s.dist"></span>
                    </div>
                    <div class="cnd-row">
                      <span class="cnd-l">Worst</span>
                      <span class="cnd-p" x-text="s.wp"></span>
                      <span class="cnd-bar"><i class="w" :style="'width:'+s.wfill+'%'"></i></span>
                      <span class="cnd-d" x-text="s.wdist"></span>
                    </div>
                  </div>
                </template>
              </div>
              <div x-data="{ tip: false }">
                <div class="bo-hint">🪙 Stablecoin filter · always on<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                <div class="bo-hint" x-show="tip">The 24 candles must span at least 1% from lowest low to highest high, else the ticker is a stablecoin and is skipped. Tickers failing either in random selection are graylisted for a week.</div>
              </div>
              <div x-data="{ tip: false }">
                <div class="bo-hint">💧 Illiquidity filter · always on<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                <div class="bo-hint" x-show="tip">The last 3 trades are fetched before entry; if they average more than 12s apart the ticker is illiquid and is skipped, and one that passes skips the fetch for a week. Tickers failing either in random selection are graylisted for a week.</div>
              </div>
            </div>
          </div>
        </div>
      `,
    },

    transform(def) {
      const _hasShort = typeof def.pseudoOpenShort === 'function', _hasLong = typeof def.pseudoOpenLong === 'function';
      WINTER = _hasShort && !_hasLong;
      try {
        const rs = document.documentElement.style;
        rs.setProperty('--bo-rgb', WINTER ? '96,210,255' : '255,200,60');
        rs.setProperty('--bo-acc', WINTER ? 'var(--ice)' : '#ffc83c');
      } catch (_) {}

      const _origInit    = def.init;
      const _origScan    = def.runScan;
      const _origWatch   = def.pseudoWatchCondOrders;
      const _hostStages = Array.isArray(def._scanStageDefs); // host has the cooperative scan scheduler

      return Object.assign({}, def, {

        _boLoaded: false,
        _boBusy: false,
        _boBinWarned: false,
        _boVolBusy: false,

        // Plugin symbol (text glyphs, not emoji): snowflake for Winter, fire for Chaser.
        _boGlyph() { return WINTER ? '\u2744\uFE0E' : '\u2668\uFE0E'; },
        _boWinMs() { return Math.max(0.1, Number(this.cfg.boWinH) || 24) * 3600000; },
        _boPend() { return Object.keys(this.cfg.boWatch || {}).length; }, // slots used: one watch per ticker
        _boAtCap() { return (this.positions || []).length >= (this.cfg.maxPos ?? 5); },

        // ---- Break counter ----
        // (_t is only there so the readout re-evaluates on the host's tick as old breaks age out.)
        _boTally(_t) {
          const cut = Date.now() - this._boWinMs();
          let top = 0, bottom = 0;
          for (const x of (Array.isArray(this.cfg.boBreaks) ? this.cfg.boBreaks : [])) if (x && x[0] >= cut) { if (x[1] === 'T') top++; else if (x[1] === 'B') bottom++; }
          return { top, bottom };
        },
        // Ticks / unticks a type; the last ticked one stays.
        _boTypeToggle(k) {
          if (this.cfgLocked) return;
          const T = this.cfg.boTypes;
          if (!T || (T[k] && Object.values(T).filter(Boolean).length < 2)) return;
          T[k] = !T[k];
          this.persist();
        },
        _boTip(_t) {
          const t = this._boTally(), h = +(this._boWinMs() / 3600000).toFixed(1);
          return 'Last ' + h + 'h: ' + t.top + ' volume top breaks, ' + t.bottom + ' volume bottom breaks. Informational only; watches are placed whatever the counts.';
        },
        _boCount(edge) {
          const c = this.cfg, now = Date.now(), cut = now - this._boWinMs();
          c.boBreaks = (Array.isArray(c.boBreaks) ? c.boBreaks : []).filter(x => x && x[0] >= cut).concat([[now, edge === 'top' ? 'T' : 'B']]);
          this.persist();
        },

        // Cancels every pending cond. tagged 'breakout'.
        async _boCancelAll(reason, msg) {
          const pend = (this.condOrders || []).filter(o => o.tag === 'breakout');
          if (!pend.length) return;
          for (const o of pend) {
            try { await this.cancelCondOrder(o.id, reason); }
            catch (e) { this.log(`[BO] cancel error (${o.symbol}): ${e.message}`, 'warn'); }
          }
          this.log(`[BO] ${this._boGlyph()} ${msg} — ${pend.length} cond. order${pend.length === 1 ? '' : 's'} cancelled`, 'warn');
          this.persist();
        },
        async _boGuard() {
          if (!this._boAtCap()) return;
          const n = Object.keys(this.cfg.boWatch || {}).length;
          if (n) { this.cfg.boWatch = {}; this.log(`[BO] ${this._boGlyph()} Max positions (${(this.positions || []).length}/${this.cfg.maxPos ?? 5}) — ${n} volume watch${n === 1 ? '' : 'es'} cancelled`, 'warn'); this.persist(); }
        },

        // Last 24 closed 1hr candles, newest first from the exchange; the forming candle is dropped. Null when the ticker has fewer than 24.
        async _boCandles(sym) {
          const url = `${this.base}/v5/market/kline?category=linear&symbol=${sym}&interval=60&limit=${CANDLES + 1}`;
          const r = await (typeof this._qFetch === 'function' ? this._qFetch(url) : fetch(url));
          const list = (await r.json())?.result?.list;
          if (!Array.isArray(list)) return null;
          const now = Date.now();
          const closed = list.filter(c => Number(c[0]) + HOUR_MS <= now).slice(0, CANDLES);
          return closed.length === CANDLES ? closed : null;
        },

        // Top / bottom moves, %: green candles (close above open) give the top move, the mean of (high - open) / open; red candles (close below open) give the bottom move,
        // the mean of (open - low) / open. Doji candles count for neither. Null when a candle is unreadable or either colour is missing.
        _boMoves(candles) {
          let tSum = 0, tN = 0, bSum = 0, bN = 0, ok = 0;
          for (const c of candles) {
            const o = parseFloat(c[1]), h = parseFloat(c[2]), l = parseFloat(c[3]), cl = parseFloat(c[4]);
            if (!(o > 0) || !(cl > 0) || !(h >= l)) continue;
            ok++;
            if (cl > o) { tSum += (h - o) / o * 100; tN++; }
            else if (cl < o) { bSum += (o - l) / o * 100; bN++; }
          }
          if (ok !== CANDLES || !tN || !bN) return null;
          return { top: tSum / tN, bottom: bSum / bN, green: tN, red: bN };
        },

        // Stablecoin filter: the 24 candles' full span, %. A stablecoin never moves 1%.
        _boSpan(candles) {
          let hi = -Infinity, lo = Infinity;
          for (const c of candles) { hi = Math.max(hi, parseFloat(c[2])); lo = Math.min(lo, parseFloat(c[3])); }
          return lo > 0 && isFinite(hi) ? (hi / lo - 1) * 100 : 0;
        },

        // Illiquidity filter: average gap between the last 3 trades, ms (newest first). Null when the read fails.
        async _boTradeGap(sym) {
          try {
            const r = await fetch(`${this.base}/v5/market/recent-trade?category=linear&symbol=${sym}&limit=3`);
            const ts = ((await r.json())?.result?.list || []).map(x => Number(x.time)).filter(x => x > 0);
            if (ts.length < 3) return Infinity; // fewer than 3 trades on record is as illiquid as it gets
            return (Math.max(...ts) - Math.min(...ts)) / (ts.length - 1);
          } catch (e) { return null; }
        },

        _boGrayAdd(sym, why) {
          this.cfg.boGray[sym] = Date.now();
          this.log(`[BO] ⛔ ${sym}: ${why} — graylisted for a week`, 'info');
        },

        // Leverage the host will open with: Winter resolves it per ticker, Chaser uses the config value. TP / SL are ROI %, i.e. price move % x leverage.
        async _boLev(sym) {
          if (typeof this.resolveEffectiveLeverage === 'function') {
            const instr = await this.getInstrInfo(sym);
            const r = instr && this.resolveEffectiveLeverage(sym, instr);
            return r && r.lev > 0 ? r.lev : null;
          }
          return this.cfg.leverage > 0 ? this.cfg.leverage : 1;
        },

        // Everything before a watch: candles, top / bottom moves, filters, fresh price, leverage. Null when the ticker is skipped.
        async _boPrep(sym, t) {
          const candles = await this._boCandles(sym);
          if (!candles) { this.log(`[BO] ${sym}: fewer than ${CANDLES} closed 1hr candles — skipped`, 'info'); return null; }
          const mv = this._boMoves(candles);
          if (!mv) { this.log(`[BO] ${sym}: no green or no red candle among the last ${CANDLES} (or unreadable data) — skipped`, 'info'); return null; }
          const span = this._boSpan(candles);
          if (span < MIN_SPAN_PCT) { this._boGrayAdd(sym, `stablecoin filter, ${span.toFixed(2)}% span over ${CANDLES}h`); return null; }
          const white = Date.now() - (this.cfg.boWhite[sym] || 0) < GRAY_MS;
          const gap = white ? 0 : await this._boTradeGap(sym);
          if (gap != null && gap > MAX_GAP_MS) { this._boGrayAdd(sym, `illiquidity filter, last 3 trades ${isFinite(gap) ? (gap / 1000).toFixed(1) + 's' : 'not found'} apart`); return null; }
          if (gap != null && !white) this.cfg.boWhite[sym] = Date.now();
          let price = parseFloat(t?.lastPrice || 0);
          try {
            const r = await fetch(`${this.base}/v5/market/tickers?category=linear&symbol=${sym}`);
            const lp = parseFloat((await r.json())?.result?.list?.[0]?.lastPrice);
            if (lp > 0) price = lp;
          } catch (e) {}
          if (!(price > 0)) return null;
          const lev = await this._boLev(sym);
          if (!lev) return null;
          return { mv, price, lev, candles };
        },

        // ---- Volume watches ----
        _boSide() { return WINTER ? '\u25BC SHORT' : '\u25B2 LONG'; },
        // Turnover as a short label: 950, 4.2K, 4.2M, 4.2B.
        _boFmtT(v) { v = +v || 0; return v >= 1e9 ? (v / 1e9).toFixed(1) + 'B' : v >= 1e6 ? (v / 1e6).toFixed(1) + 'M' : v >= 1e3 ? (v / 1e3).toFixed(1) + 'K' : String(Math.round(v)); },
        // Card data per watch: this hour's turnover so far against the 24h high (top watch) or low (bottom watch), the opposite level as the worst, and the type. (_t only re-evaluates it on the host's tick.)
        _boWatchRows(_t) {
          return Object.entries(this.cfg.boWatch || {}).sort((a, b) => a[1].t - b[1].t).map(([sym, w]) => {
            const top = w.edge === 'top', fv = w.fv || 0, tg = top ? w.rh : w.rl, ws = top ? w.rl : w.rh;
            // Bars = how close a break is. Top: fills as turnover reaches the level. Bottom: starts full and empties as turnover comes in (the hour must close under the level).
            const up = r => r > 0 ? Math.min(100, fv / r * 100) : 0, dn = r => 100 - up(r);
            return { sym: sym.replace('USDT', ''), t: w.t, tags: w.hist ? BO_TYPE(w.hist, w.edge) : '',
              label: top ? 'TOP' : 'BOTTOM', p: this._boFmtT(fv) + '/' + this._boFmtT(tg), fill: top ? up(tg) : dn(tg), dist: Math.round(top ? up(tg) : dn(tg)) + '%',
              wp: (top ? '<' : '>') + this._boFmtT(ws), wfill: top ? dn(ws) : up(ws), wdist: Math.round(top ? dn(ws) : up(ws)) + '%' };
          });
        },

        // Turnover (USDT, kline field 6) range of the 24 closed candles (newest first): highest / lowest, their age in hours and the newest candle's start. Null when unreadable.
        _boVolRange(candles) {
          let hi = -Infinity, lo = Infinity, hiI = 0, loI = 0;
          for (let i = 0; i < candles.length; i++) {
            const v = parseFloat(candles[i][6]);
            if (!(v >= 0)) return null;
            if (v > hi) { hi = v; hiI = i; }
            if (v < lo) { lo = v; loI = i; }
          }
          return lo > 0 && hi > lo ? { hi, lo, hiAge: hiI + 1, loAge: loI + 1, newest: Number(candles[0][0]) } : null;
        },

        // One kline read: the closed candles (newest first) and the forming 1hr candle's price and turnover (null when the hour has no trade yet).
        async _boVolRead(sym) {
          const url = `${this.base}/v5/market/kline?category=linear&symbol=${sym}&interval=60&limit=${CANDLES + 2}`;
          const r = await (typeof this._qFetch === 'function' ? this._qFetch(url) : fetch(url));
          const list = (await r.json())?.result?.list;
          if (!Array.isArray(list) || !list.length) return null;
          const now = Date.now(), f = list.find(c => Number(c[0]) + HOUR_MS > now);
          return { closed: list.filter(c => Number(c[0]) + HOUR_MS <= now), forming: f ? { px: parseFloat(f[4]), v: parseFloat(f[6]) } : null };
        },

        // One watch on one edge of the ticker's 24h hourly turnover range (top: turnover above the high, bottom: below the low). The last break is the extreme that printed most recently;
        // the watch is a Double of it (same edge) or a Revert (the other edge). The type is always stamped; Decisive Edge decides whether the ticked types or a coin flip pick the edge. Returns the watch, or null.
        async _boVolPlace(sym, t) {
          const pr = await this._boPrep(sym, t);
          if (!pr) return null;
          const vr = this._boVolRange(pr.candles);
          if (!vr) { this.log(`[BO] ${sym}: turnover unreadable or an hour with none — skipped`, 'info'); return null; }
          const last = vr.hiAge < vr.loAge ? 'top' : 'bottom'; // the high and the low are different candles, so the ages never tie
          const decide = this.cfg.boDecide !== false;
          let edge, drawn = true;
          if (decide) {
            const T = this.cfg.boTypes || {}, other = last === 'top' ? 'bottom' : 'top';
            const dbl = !!T[last === 'top' ? 'dt' : 'db'], rev = !!T[other === 'top' ? 'rt' : 'rb']; // the Double and the Revert this ticker could be
            if (!dbl && !rev) { this.log(`[BO] ${sym}: last break ${last}, no ticked type fits — skipped`, 'info'); return null; }
            edge = dbl && rev ? (Math.random() < 0.5 ? last : other) : dbl ? last : other;
            drawn = dbl && rev;
          } else edge = Math.random() < 0.5 ? 'top' : 'bottom';
          const rd = await this._boVolRead(sym);
          if (rd?.forming && rd.forming.v > vr.hi) { this.log(`[BO] ${sym}: this hour's turnover is already above its 24h high — skipped`, 'info'); return null; }
          const now = Date.now();
          const w = { t: now, edge, chk: vr.newest, next: now + Math.floor(Math.random() * VOL_POLL_MS), hist: last, top: pr.mv.top, bot: pr.mv.bottom, lev: pr.lev, chg: parseFloat(t?.price24hPcnt || 0) * 100, fund: parseFloat(t?.fundingRate || 0) * 100, fv: rd?.forming ? rd.forming.v : 0, rh: vr.hi, rl: vr.lo };
          this.cfg.boWatch[sym] = w;
          this.log(`[BO] ${this._boGlyph()} ${sym}: volume ${BO_NAME(edge).toUpperCase()} watch ${drawn ? 'drawn' : 'picked'} — ${BO_TYPE(last, edge)} (last break ${BO_NAME(last).toLowerCase()}, ${Math.min(vr.hiAge, vr.loAge)}h ago) — 24h hourly turnover high ${Math.round(vr.hi)} / low ${Math.round(vr.lo)} USDT`, 'info');
          return w;
        },

        // Polls the due watches (VOL_POLL_MS each). A newly closed candle is checked for a top break (turnover above the 24 before it) or a bottom break (below them); the forming candle for a top break
        // (above the last 24 closed). The watch's own edge opens a position; the opposite edge cancels it. Either way the break counts.
        async _boVolWatch() {
          if (this._boVolBusy) return;
          const c = this.cfg, W = c.boWatch;
          if (!c.boEnabled || !W || !Object.keys(W).length) return;
          this._boVolBusy = true;
          try {
            const now = Date.now(), life = Math.max(1, Number(c.boLifeMins) || 1440) * 60000, due = [];
            for (const sym of Object.keys(W)) {
              if (now - W[sym].t >= life) { delete W[sym]; this.log(`[BO] ${sym}: volume watch expired`, 'info'); continue; }
              if (now >= W[sym].next) { W[sym].next = now + VOL_POLL_MS; due.push(sym); }
            }
            const reads = {};
            await Promise.all(due.map(async sym => { try { reads[sym] = await this._boVolRead(sym); } catch (e) {} }));
            for (const sym of due) {
              const w = W[sym], rd = reads[sym], cl = rd && rd.closed;
              if (!w || !cl) continue;
              // Card figures: this hour's turnover so far and the 24h high / low it is read against.
              w.fv = rd.forming ? rd.forming.v : 0;
              if (cl.length >= CANDLES) { const ref = cl.slice(0, CANDLES).map(x => parseFloat(x[6])); if (ref.every(x => x >= 0)) { w.rh = Math.max(...ref); w.rl = Math.min(...ref); } }
              let ev = null;
              if (cl.length > CANDLES && Number(cl[0][0]) > w.chk) {
                w.chk = Number(cl[0][0]);
                const prev = cl.slice(1, CANDLES + 1).map(x => parseFloat(x[6])), v = parseFloat(cl[0][6]);
                if (v >= 0 && prev.every(x => x >= 0)) { if (v > Math.max(...prev)) ev = 'top'; else if (v < Math.min(...prev)) ev = 'bottom'; }
              }
              if (!ev && rd.forming && cl.length >= CANDLES && rd.forming.v > Math.max(...cl.slice(0, CANDLES).map(x => parseFloat(x[6])))) ev = 'top';
              if (!ev) continue;
              this._boCount(ev);
              delete W[sym];
              if (ev !== w.edge) { this.log(`[BO] ${this._boGlyph()} ${sym}: volume ${BO_NAME(ev).toLowerCase()} break came first — ${BO_NAME(w.edge).toLowerCase()} watch cancelled`, 'info'); continue; }
              await this._boVolFire(sym, w, rd);
            }
            this.persist();
          } finally { this._boVolBusy = false; }
        },

        // The watch's edge broke: open on the bot's own side at market. TP / SL ROI from the fresh average moves (the watch's own when unreadable).
        async _boVolFire(sym, w, rd) {
          const c = this.cfg, pos0 = this.positions || [];
          const drop = why => this.log(`[BO] ${sym}: volume ${BO_NAME(w.edge).toLowerCase()} broke but the entry was dropped — ${why}`, 'warn');
          if (!c.binaryModeEnabled) return drop('Binary Mode is off');
          if (pos0.length >= (c.maxPos ?? 5)) return drop(`no free position slot (${pos0.length}/${c.maxPos ?? 5})`);
          if (this._isDrawdownHalted?.() || this._isGainsLocked?.()) return drop('entries are halted');
          if (pos0.some(p => p.symbol === sym)) return drop('position already open on this ticker');
          const price = rd.forming && rd.forming.px > 0 ? rd.forming.px : parseFloat(rd.closed[0]?.[4]);
          if (!(price > 0)) return drop('no price');
          const mv = this._boMoves(rd.closed.slice(0, CANDLES)) || { top: w.top, bottom: w.bot };
          const tpMove = WINTER ? mv.bottom : mv.top, slMove = WINTER ? mv.top : mv.bottom;
          const tpRoi = +(tpMove * w.lev).toFixed(2), slRoi = +(slMove * w.lev).toFixed(2);
          this.log(`[BO] ${this._boGlyph()} ${sym}: volume ${BO_NAME(w.edge).toLowerCase()} break — opening, TP ${tpRoi}% / SL ${slRoi}% ROI`, 'info');
          const pos = await (WINTER ? this.pseudoOpenShort : this.pseudoOpenLong).call(this, { symbol: sym, price, change: w.chg, fundingRate: w.fund, _tpPct: tpRoi, _slPct: slRoi, _bo: true, _boVol: true, _boTopPct: +mv.top.toFixed(3), _boBotPct: +mv.bottom.toFixed(3), _boEdge: w.edge, _boHist: w.hist });
          if (!pos) this.log(`[BO] ${sym}: entry did not open after the volume break`, 'warn');
        },

        // Watches are dropped when Breakout is off. Pending conds tagged 'breakout' (price conds) are cancelled.
        async _boModeSync() {
          const c = this.cfg;
          if (c.boEnabled) {
            if ((this.condOrders || []).some(o => o.tag === 'breakout')) await this._boCancelAll('breakout price conds retired', 'Price breakouts are gone');
          } else if (Object.keys(c.boWatch || {}).length) {
            const n = Object.keys(c.boWatch).length;
            c.boWatch = {};
            this.log(`[BO] ${this._boGlyph()} Breakout off — ${n} watch${n === 1 ? '' : 'es'} cancelled`, 'info');
            this.persist();
          }
        },

        // Fills the free cond. slots with one watch each, from random tickers of the bulk list.
        async _boBatch() {
          if (this._boBusy) return;
          this._boBusy = true;
          try {
            const c = this.cfg;
            if (!c.boEnabled) return;
            if (!c.binaryModeEnabled) {
              if (!this._boBinWarned) { this._boBinWarned = true; this.log('[BO] ⚠️ Binary Mode is off — TP and SL are only set at entry there, so no Breakout watches are placed', 'warn'); }
              return;
            }
            this._boBinWarned = false;
            if (this._isDrawdownHalted?.() || this._isGainsLocked?.()) return;

            await this._boModeSync();
            await this._boGuard();
            if (this._boAtCap()) return; // max positions: no new conds
            const free = (c.maxCond ?? 30) - (typeof this._condSlots === 'function' ? this._condSlots() : (this.condOrders || []).length) - Object.keys(c.boWatch || {}).length; // free slots (volume watches take one each); the host's Max Cond. Orders, Max Positions does not cap this
            if (free <= 0) return;

            const taken = new Set([...(this.positions || []).map(p => p.symbol), ...(this.condOrders || []).map(o => o.symbol), ...Object.keys(c.boWatch || {})]);
            const now = Date.now();
            for (const m of [c.boGray, c.boWhite]) for (const k of Object.keys(m)) if (now - m[k] >= GRAY_MS) delete m[k];
            const mega = new Set(Array.isArray(c.megacapExclude) ? c.megacapExclude : []);
            const pool = (this._lastAllTickers || []).filter(t => t.symbol && t.symbol.endsWith('USDT') && !taken.has(t.symbol)
              && !mega.has(t.symbol) && !(t.symbol in c.boGray) && parseFloat(t.lastPrice || 0) > 0 && !this._isSymbolBanned?.(t.symbol));
            for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }

            const maxTry = free * 3; // a few spare picks for tickers that fail (new listings, filters, refused orders)
            let placed = 0, tries = 0;
            for (const t of pool) {
              if (placed >= free || tries >= maxTry) break;
              tries++;
              try { if (await this._boVolPlace(t.symbol, t)) placed++; }
              catch (e) { this.log(`[BO] ${t.symbol} error: ${e.message}`, 'warn'); }
            }
            this.log(`[BO] ${this._boGlyph()} Batch — ${placed}/${free} watch${free === 1 ? '' : 'es'} placed`, 'info');
            this.persist();
          } finally { this._boBusy = false; }
        },

        async init() {
          await _origInit.call(this);
          this._boLoaded = true;
          // Position-type badge, stamped on every watch's position and its closed trade: Double Top, Revert Bottom and so on, with -Vol at the end (_boHist = the last break the type is read against).
          if (typeof this.registerRoleBadge === 'function') this.registerRoleBadge(item => {
            const e = item && (item._boEdge || item.candidate?._boEdge);
            if (e !== 'top' && e !== 'bottom') return null;
            const h = item._boHist || item.candidate?._boHist, vol = !!(item._boVol ?? item.candidate?._boVol), sfx = vol ? '-Vol' : '';
            const lbl = h ? BO_TYPE(h, e) + sfx : e.toUpperCase() + sfx.toUpperCase();
            return `<span title="Breakout, entered at the ${vol ? 'volume ' : ''}${e}" style="font-family:var(--mono);font-size:9px;letter-spacing:1px;padding:2px 5px;border-radius:2px;border:1px solid rgba(var(--bo-rgb),.35);background:rgba(var(--bo-rgb),.15);color:var(--bo-acc)">${lbl}</span>`;
          });
          if (!this.cfg.boTypes || typeof this.cfg.boTypes !== 'object') this.cfg.boTypes = WINTER ? { dt: false, rt: false, db: true, rb: true } : { dt: true, rt: true, db: false, rb: false };
          for (const [k, v] of Object.entries(BO_DEFAULT_CFG)) {
            if (this.cfg[k] === undefined) this.cfg[k] = Array.isArray(v) ? [...v] : (v && typeof v === 'object' ? { ...v } : v);
          }
          for (const k of ['boGray', 'boWhite', 'boWatch']) if (!this.cfg[k] || typeof this.cfg[k] !== 'object' || Array.isArray(this.cfg[k])) this.cfg[k] = {};
          this.cfg.boBreaks = (Array.isArray(this.cfg.boBreaks) ? this.cfg.boBreaks : []).filter(x => Array.isArray(x) && x[0] > 0 && (x[1] === 'T' || x[1] === 'B'));
          // Retired settings and stores (scoring, watch lists, hypotheticals, flow, auto-switch, tally, retry queue).
          for (const k of ['boFlowOn', 'boCritOn', 'boCritF', 'boCritS', 'boCritL', 'boCritI', 'boGate', 'boSamples', 'boWatchMax', 'boStepX', 'boCells', 'boCellOf', 'boW1', 'boW2', 'boHypo',
            'boEdges', 'boLog', 'boInval', 'boRetry', 'boAuto', 'boAutoPct', 'boAutoTicker', 'boTickLatch', 'boFlowUp', 'boFlowDown', 'boMult', 'boEntry', 'boFlow', 'boTrack', 'boPushMax', 'boFlowEnabled', 'boFundW', 'boSkewW', 'boTgtMin', 'boTgtMax', 'boPeakCloser', 'boBottomCloser', 'boVol', 'boVolClose', 'boPairs', 'boFar', 'boDR', 'boRevert']) delete this.cfg[k];
        },

        // The watches are polled on the cond. order watcher so they fire on time rather than at the next scan.
        async pseudoWatchCondOrders() {
          const r = await _origWatch.call(this);
          if (this._boLoaded) { try { await this._boModeSync(); await this._boGuard(); await this._boVolWatch(); } catch (e) { this.log(`[BO] watcher error: ${e.message}`, 'warn'); } }
          return r;
        },

      }, _hostStages
        ? { _scanStageDefs: [...def._scanStageDefs,
            { id: 'bo-batch', group: 'bo', run: function (ctx) { return this._boBatch(ctx); } },
          ] }
        : { async runScan() {
            await _origScan.call(this);
            await this._boBatch();
          } });
    },
  };
})();
</script>
