<!--
  Breakout Plugin for PseudoChaser and PseudoWinter (unified)
  Modelled on MI's Fade (cond. entry, worst-case price, 1hr life) with none of MI's scoring.

  Each batch fills the host's Max Cond. Orders limit (minus cond. orders already pending) with tickers, independent of
  Max Positions: the host drops a cond. that triggers past maxPos, and real orders fail if the balance is short.
  It reads the last twenty-four closed 1hr candles of each, and takes the average move: the mean candle range, (high - low) / open, in %.

  Chaser (long):  cond. entry BELOW price by the average move; TP above the trigger by the average move; SL below it by the same;
                  worse price ABOVE price by the average move.
  Winter (short): the mirror: cond. entry ABOVE price; TP below the trigger; SL above it; worse price BELOW price.

  Entry edge: Chaser enters at the BOTTOM of the range by default, Winter at the TOP. The Enter-at setting flips it (Chaser at the top,
              Winter at the bottom). TP / SL stay on the bot's own side of the trigger; only the trigger and worse prices swap sides.
  Tally:      each resolved order is logged by the edge price reached first: top, bottom, or neither (expired). Last 50 are kept.
  Auto-switch: replaces the manual selector. About every minute, the uPnL of open positions entered at the current edge is compared to their
              base margin (entry margin each); at -25% (setting) or worse the edge flips. Only positions stamped with the current edge count.

  Ticker flow: per ticker, the 24 candles are scored for breakout skew: a candle breaks past the average move upward if its high is more than the
              average move above its open, downward if its low is more than the average move below its open (measured from the open; a candle can do
              both). More upward breaks = upside skew, more downward breaks = downside skew, equal = no skew (that ticker uses the global edge and
              carries no flow badge).
              With flow: upside skew enters at the top, downside skew at the bottom. Against flow: upside skew at the bottom, downside skew at the top.
              Upside-skew and downside-skew tickers have separate With / Against switches, so one skew can stay With while the other goes Against.
              Badges read W-TOP / W-BOTTOM (with) and A-TOP / A-BOTTOM (against). With Auto-switch on, the uPnL rule runs per skew: it sums the
              positions of that skew entered under its current mode and flips only that skew's switch (instead of top <-> bottom).

  Per-ticker trip (sub-toggle of Auto-switch): any single Breakout position whose uPnL reaches -25% (same setting) of its base margin flips the
              switch at once (that position's skew switch With <-> Against while flow is on, else top <-> bottom). That ticker is latched, so it flips once; if it later swings to
              +25% of its base margin it reverses the switch and is re-armed. Latches clear when the position closes.

  Two fixed filters run before every order (no toggles):
    Stablecoin   — the 24 candles' full span (lowest low to highest high) must be at least 1%, else the ticker is a stablecoin.
    Illiquidity  — the last 3 trades are fetched; if they average more than 12s apart the ticker is illiquid.
  A ticker failing either during random selection is graylisted for a week (a queued retry is only skipped).
  A ticker confirmed liquid is whitelisted for a week and skips the trade fetch.

  Orders expire after Order Life (default 60 min) and are simply cancelled. If price reaches the worse price first, the ticker is queued
  and goes to the front of the next batch, where its candles are re-read and a fresh order is made.

  TP / SL are set at entry only in Binary Mode, so Binary Mode must be on (the plugin places nothing otherwise).
  Needs no other plugin. The side is read from the host at load.

  Load via Plugin Manager in either bot's config panel, AFTER SunChaser / EverWinter if live.
  targetBot: both
-->
<script>
(function () {
  'use strict';

  const VERSION = '1.8.2'; // Change: Live readout cut to three label-free rows (LIVE: pending + break counts; UP skew; DOWN skew) using only the app's gray / theme / green / yellow / red; extra detail moved into a hover (PC) or tap (mobile) popover per row. | previous: Live readout moved into the Breakout accordion body, below the config fields, and shrunk to a compact bar-free table (entry mode + edge per skew with its loss figure, break counts, pending, trip, queue); General accordion's Mode line restored. | previous: Live readouts (pending / flow modes / auto-switch loss meters / per-ticker trip / break tally / retry queue / Binary warning) moved out of the Breakout config into the General accordion's Mode line, shown bold and colored with meters, pulses and an outcome strip. | previous: All hint text and hover tooltips are hidden behind circled "!" buttons next to their toggle or setting (click to show); Ticker flow, Auto-switch and Per-ticker trip default to on. | previous: Ticker flow With / Against is now two switches, one for upside-skew tickers and one for downside-skew tickers; Auto-switch and Per-ticker trip flip only the skew whose positions lost (or reversed). | previous: Per-ticker trip sub-toggle under Auto-switch: one position at -25% of its base margin flips the switch (and flow) once, latched; a swing to +25% reverses it and re-arms. | previous: Ticker flow: each ticker is scored toppy / bottomy from its 24 candles (breaks of the average move above the open vs below it) and enters With or Against that flow; W-/A- prefix on the TOP / BOTTOM badges; Auto-switch flips With <-> Against while flow is on. | previous: Chaser plugin glyph is the text-style hot springs symbol (fire-like) instead of the alchemical fire triangle. | previous: Auto-switch rebuilt on uPnL: flips the entry edge when open positions entered at the current edge are down 25% (setting) of their base margin, checked every minute; plugin glyph (snowflake / fire) replaces the explosion emoji. | previous: Auto-switch rule: tally in the bot's favor (Chaser: tops lead, Winter: bottoms lead) enters at the leading edge, against it at the opposite edge. | previous: TOP / BOTTOM position-type badge on pending conds and positions (needs the base bots' cond card badge slot); Auto-switch tooltip rewritten in plain English with the currently resolving edge. | previous: Entry edge setting (Chaser can enter at the top, Winter at the bottom); top / bottom / no-break tally readout; batch fills the host's Max Cond. Orders limit instead of being capped by Max Positions; tally counts fills dropped past Max Positions; Auto-switch picks the edge from the tally's skew. | previous: Illiquidity filter whitelist — a ticker confirmed liquid skips the 3-trade fetch for a week. | previous: Stablecoin filter (24h span under 1% = skipped) and Illiquidity filter (last 3 trades averaging over 12s apart = skipped), both always on; failures from random selection are graylisted for a week. | previous: Initial release — average-move cond. entries (24 x 1hr candles), TP/SL at +/- the average move from the trigger, 1hr expiry, worse-price orders requeued for the next batch.
  const CANDLES = 24;      // closed 1hr candles the average move is read from
  const HOUR_MS = 3600000;
  const MIN_SPAN_PCT = 1;          // stablecoin filter: least % span the 24 candles must cover
  const MAX_GAP_MS   = 12000;      // illiquidity filter: most average ms between the last 3 trades
  const GRAY_MS      = 7 * 86400000; // graylist time for a ticker that fails either filter
  const TALLY_WINDOW = 50;         // resolved orders the tally (and Auto-switch) looks at
  const opp = e => e === 'top' ? 'bottom' : 'top';
  let   WINTER  = false;   // set in transform() from the host

  const BO_DEFAULT_CFG = Object.freeze({
    boEnabled: true,   // Breakout mode
    boLifeMins: 60,    // how long a cond. order waits before it is cancelled
    boEntry: null,     // 'top' | 'bottom': edge of the range the cond. enters at; null = the bot's default (Chaser bottom, Winter top)
    boAuto: true,      // Auto-switch: flips the entry edge when the current edge's open positions lose past boAutoPct, manual selector hidden
    boAutoPct: 25,     // Auto-switch threshold: % loss of the base margin (entry margin per position) of the current edge's open positions
    boFlowOn: true,    // Ticker flow: each ticker's edge follows its candles' breakout skew (replaces the global edge while on)
    boFlowUp: 'with',  // 'with' | 'against' for upside-skew tickers: with -> top, against -> bottom; Auto-switch flips it while flow is on
    boFlowDown: 'with', // 'with' | 'against' for downside-skew tickers: with -> bottom, against -> top; Auto-switch flips it while flow is on
    boAutoTicker: true,  // Auto-switch sub-toggle: a single position at -boAutoPct of its base margin flips the switch; +boAutoPct on that ticker reverses it
    boTickLatch: {},   // symbol -> 'L' once that ticker's loss trip flipped the switch (waits for +boAutoPct to reverse)
    boEdges: {},       // symbol -> edge its pending order enters at
    boLog: [],         // last resolved orders: 'T' top reached first, 'B' bottom, 'N' neither (expired)
    boRetry: [],       // tickers that hit the worse price, first in line for the next batch
    boWhite: {},       // symbol -> epoch ms it was confirmed liquid; skips the trade fetch for a week
    boGray: {},        // symbol -> epoch ms it was graylisted (stablecoin / illiquid), kept a week
  });

  window.__BotPlugin = {
    id:        'breakout',
    name:      'Breakout',
    version:   VERSION,
    targetBot: 'both',
    after:     ['sunchaser', 'everwinter'],
    before:    [],
    conflicts: [],
    requires:  [],
    touches:   ['init', 'runScan', 'cancelCondOrder', 'pseudoWatchCondOrders', '_condTrigger'],

    css: `
      :root { --bo-rgb:255,200,60; --bo-acc:#ffc83c; }
      .bo-hint { font-size:9px; color:var(--text-lo); margin-top:3px; line-height:1.5; }
      .bo-g { color:#3ddc84; } .bo-r { color:#ff5a5f; }
      .bo-seg { font-family:var(--mono); font-size:10px; padding:2px 9px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.12); border-radius:3px; color:var(--text-lo); cursor:pointer; }
      .bo-seg.on { background:rgba(var(--bo-rgb),.15); border-color:rgba(var(--bo-rgb),.35); color:var(--bo-acc); }
      .bo-info { display:inline-flex; align-items:center; justify-content:center; width:12px; height:12px; margin-left:6px; padding:0; border-radius:50%; border:1px solid rgba(var(--bo-rgb),.35); background:transparent; color:var(--bo-acc); font:700 8px/1 var(--mono); cursor:pointer; flex:none; vertical-align:middle; }
      .bo-info.on { background:rgba(var(--bo-rgb),.15); }
      .bo-live { position:relative; margin-top:8px; padding:3px 8px; border:1px solid rgba(var(--bo-rgb),.28); border-left:3px solid var(--bo-acc); border-radius:4px; background:rgba(var(--bo-rgb),.05); font-family:var(--mono); font-size:10px; color:var(--text-hi); }
      .bo-live.hot { border-color:var(--short); }
      .bo-lr { position:relative; display:flex; align-items:center; gap:7px; padding:4px 0; cursor:help; }
      .bo-lr + .bo-lr { border-top:1px solid rgba(255,255,255,.07); }
      .bo-ttl { font-weight:700; letter-spacing:2px; color:var(--bo-acc); }
      .bo-sk { min-width:32px; font-size:8px; letter-spacing:1.5px; color:var(--text-lo); }
      .bo-chip { font-size:9px; font-weight:700; letter-spacing:1px; padding:0 6px; border-radius:9px; border:1px solid transparent; }
      .bo-wi { color:var(--bo-acc); border-color:rgba(var(--bo-rgb),.4); background:rgba(var(--bo-rgb),.12); }
      .bo-ag { color:var(--warn); border-color:rgba(240,192,96,.45); background:rgba(240,192,96,.12); }
      .bo-edge { font-weight:700; letter-spacing:1px; color:var(--text-hi); }
      .bo-num { margin-left:auto; font-weight:700; white-space:nowrap; }
      .bo-cnt { color:var(--text-lo); } .bo-cnt b { margin-left:2px; color:var(--text-hi); } .bo-cnt.lead b { color:var(--bo-acc); }
      .bo-pulse { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--short); animation:bo-pulse 1s infinite; }
      @keyframes bo-pulse { 0% { box-shadow:0 0 0 0 rgba(255,69,96,.7); } 70% { box-shadow:0 0 0 6px rgba(255,69,96,0); } 100% { box-shadow:0 0 0 0 rgba(255,69,96,0); } }
      .bo-blink { color:var(--warn); animation:bo-blink 1.6s infinite; }
      @keyframes bo-blink { 50% { opacity:.4; } }
      .bo-pop { position:absolute; left:0; right:0; top:100%; z-index:20; margin-top:2px; padding:5px 7px; font-size:9px; font-weight:400; letter-spacing:0; line-height:1.5; color:var(--text-mid); background:var(--bg-panel,#15110c); border:1px solid rgba(var(--bo-rgb),.35); border-radius:3px; box-shadow:0 4px 12px rgba(0,0,0,.5); }
    `,

    slots: {
      'mode-label-extra': `<span x-show="cfg.boEnabled"> + Breakout</span>`,
      'strategy-accordions': `
        <div x-data="{ open: false }">
          <button class="cfg-acc-hd" @click="open=!open" :class="open?'open':''">
            <div style="display:flex;align-items:center;gap:7px">
              <span><span x-text="_boGlyph()"></span> Breakout</span>
              <span x-show="cfg.boEnabled" style="font-size:8px;padding:1px 5px;background:rgba(var(--bo-rgb),.15);border:1px solid rgba(var(--bo-rgb),.35);border-radius:2px;color:var(--bo-acc);letter-spacing:1px">ON</span>
              <span x-show="!cfg.boEnabled" style="font-size:8px;padding:1px 5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:2px;color:var(--text-lo);letter-spacing:1px">OFF</span>
            </div>
            <span class="cfg-acc-arrow" :class="open?'open':''">▶</span>
          </button>
          <div x-show="open" x-transition.opacity class="cfg-acc-body">
            <label class="tog">
              <div class="tog-t" :class="cfg.boEnabled?'on':''" @click.prevent="if(!cfgLocked){cfg.boEnabled=!cfg.boEnabled;persist()}"><div class="tog-k"></div></div>
              <div x-data="{ tip: false }">
                <div class="tog-l">Breakout Mode<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                <div class="bo-hint" x-show="tip" x-text="'Cond. entry one average move ' + (cfg.boFlowOn ? 'above or below (per ticker flow)' : (_boResolveEdge() === 'top' ? 'above' : 'below')) + ' price; TP and SL one average move from the trigger.'"></div>
              </div>
            </label>
            <div x-show="cfg.boEnabled" style="margin-top:8px">
              <div x-data="{ tip: false }">
              <div style="display:flex;align-items:center;gap:6px">
                <span class="lbl" style="margin:0">Order life (min)</span>
                <input type="number" min="1" step="1" x-model.number="cfg.boLifeMins" @change="cfg.boLifeMins=Math.max(1,Math.round(+cfg.boLifeMins||60));persist()" style="width:60px;font-family:var(--mono);font-size:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:3px;color:var(--text-hi);padding:2px 5px">
                <span style="margin-left:-2px"><button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></span>
              </div>
              <div class="bo-hint" x-show="tip">Unfilled orders are cancelled after this; a worse-price hit requeues the ticker instead.</div>
              <div class="bo-hint" x-show="tip" x-text="'Fills up to Max Cond. Orders (' + (cfg.maxCond ?? 30) + '), independent of Max Positions; the host drops a cond. that triggers past Max Positions.'"></div>
              </div>
              <label class="tog" style="margin-top:8px">
                <div class="tog-t" :class="cfg.boFlowOn?'on':''" @click.prevent="if(!cfgLocked){cfg.boFlowOn=!cfg.boFlowOn;persist()}"><div class="tog-k"></div></div>
                <div x-data="{ tip: false }">
                  <div class="tog-l">Ticker flow<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                  <div class="bo-hint" x-show="tip" x-text="_boFlowTip()"></div>
                </div>
              </label>
              <div x-show="cfg.boFlowOn && !cfg.boAuto" style="display:flex;align-items:center;gap:6px;margin-top:6px">
                <span class="lbl" style="margin:0">Upside skew</span>
                <button type="button" class="bo-seg" :class="cfg.boFlowUp==='with'?'on':''" @click="if(!cfgLocked){cfg.boFlowUp='with';persist()}">With flow</button>
                <button type="button" class="bo-seg" :class="cfg.boFlowUp==='against'?'on':''" @click="if(!cfgLocked){cfg.boFlowUp='against';persist()}">Against flow</button>
              </div>
              <div x-show="cfg.boFlowOn && !cfg.boAuto" style="display:flex;align-items:center;gap:6px;margin-top:6px">
                <span class="lbl" style="margin:0">Downside skew</span>
                <button type="button" class="bo-seg" :class="cfg.boFlowDown==='with'?'on':''" @click="if(!cfgLocked){cfg.boFlowDown='with';persist()}">With flow</button>
                <button type="button" class="bo-seg" :class="cfg.boFlowDown==='against'?'on':''" @click="if(!cfgLocked){cfg.boFlowDown='against';persist()}">Against flow</button>
              </div>
              <div x-show="!cfg.boAuto && !cfg.boFlowOn" style="display:flex;align-items:center;gap:6px;margin-top:8px">
                <span class="lbl" style="margin:0">Enter at</span>
                <button type="button" class="bo-seg" :class="cfg.boEntry==='top'?'on':''" @click="if(!cfgLocked){cfg.boEntry='top';persist()}">Top</button>
                <button type="button" class="bo-seg" :class="cfg.boEntry==='bottom'?'on':''" @click="if(!cfgLocked){cfg.boEntry='bottom';persist()}">Bottom</button>
              </div>
              <label class="tog" style="margin-top:8px">
                <div class="tog-t" :class="cfg.boAuto?'on':''" @click.prevent="if(!cfgLocked){cfg.boAuto=!cfg.boAuto;persist()}"><div class="tog-k"></div></div>
                <div x-data="{ tip: false }">
                  <div class="tog-l">Auto-switch<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                  <div class="bo-hint" x-show="tip" x-text="_boAutoTip()"></div>
                </div>
              </label>
              <label class="tog" x-show="cfg.boAuto" style="margin-top:6px">
                <div class="tog-t" :class="cfg.boAutoTicker?'on':''" @click.prevent="if(!cfgLocked){cfg.boAutoTicker=!cfg.boAutoTicker;persist()}"><div class="tog-k"></div></div>
                <div x-data="{ tip: false }">
                  <div class="tog-l">Per-ticker trip<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                  <div class="bo-hint" x-show="tip" x-text="_boTickTip()"></div>
                </div>
              </label>
              <div x-show="cfg.boAuto" style="display:flex;align-items:center;gap:6px;margin-top:6px">
                <span class="lbl" style="margin:0">Switch at</span>
                <input type="number" min="1" step="1" x-model.number="cfg.boAutoPct" @change="cfg.boAutoPct=Math.max(1,Math.round(+cfg.boAutoPct||25));persist()" style="width:60px;font-family:var(--mono);font-size:10px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.12);border-radius:3px;color:var(--text-hi);padding:2px 5px">
                <span class="bo-hint" style="margin:0">% uPnL loss of base margin</span>
              </div>
              <div class="bo-live" :class="_boHot()?'hot':''">
                <div class="bo-lr" x-data="{ tip: false }" @pointerenter="if ($event.pointerType === 'mouse') tip = true" @pointerleave="if ($event.pointerType === 'mouse') tip = false" @click="if (($event.pointerType || 'touch') !== 'mouse') tip = !tip">
                  <span class="bo-ttl"><span x-text="_boGlyph()"></span> LIVE</span>
                  <span class="bo-pulse" x-show="_boHot()"></span>
                  <span class="bo-blink" x-show="!cfg.binaryModeEnabled">&#9888;</span>
                  <span><b x-text="_boPend().n"></b><span style="color:var(--text-lo)">/<span x-text="cfg.maxCond ?? 30"></span></span></span>
                  <span class="bo-cnt" :class="_boTally().top>_boTally().bottom?'lead':''">&#9650;<b x-text="_boTally().top"></b></span>
                  <span class="bo-cnt" :class="_boTally().bottom>_boTally().top?'lead':''">&#9660;<b x-text="_boTally().bottom"></b></span>
                  <span class="bo-cnt">&ndash;<b x-text="_boTally().none"></b></span>
                  <span class="bo-cnt" x-show="_boTrip().latched" style="color:var(--warn)">&#9889;<b x-text="_boTrip().latched" style="color:var(--warn)"></b></span>
                  <span class="bo-cnt" x-show="(cfg.boRetry || []).length">&#8635;<b x-text="(cfg.boRetry || []).length"></b></span>
                  <div class="bo-pop" x-show="tip" x-text="_boTipHead()"></div>
                </div>
                <template x-for="b in _boBuckets()" :key="b.key">
                  <div class="bo-lr" x-data="{ tip: false }" @pointerenter="if ($event.pointerType === 'mouse') tip = true" @pointerleave="if ($event.pointerType === 'mouse') tip = false" @click="if (($event.pointerType || 'touch') !== 'mouse') tip = !tip">
                    <span class="bo-sk" x-text="b.tag"></span>
                    <span class="bo-chip" x-show="b.mode" :class="b.mode==='against'?'bo-ag':'bo-wi'" x-text="b.mode==='against'?'AGAINST':'WITH'"></span>
                    <span class="bo-edge" x-text="b.edge==='top'?'&#9650; TOP':'&#9660; BOTTOM'"></span>
                    <span class="bo-num" x-show="cfg.boAuto" :style="'color:'+(b.n ? (b.up<0 ? b.col : 'var(--profit)') : 'var(--text-lo)')" x-text="_boBucketTxt(b)"></span>
                    <div class="bo-pop" x-show="tip" x-text="_boTipBucket(b)"></div>
                  </div>
                </template>
              </div>
              <div x-data="{ tip: false }">
                <div class="bo-hint">🪙 Stablecoin filter · always on<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                <div class="bo-hint" x-show="tip">The 24 candles must span at least 1% from lowest low to highest high, else the ticker is a stablecoin and is skipped. Tickers failing either in random selection are graylisted for a week.</div>
              </div>
              <div x-data="{ tip: false }">
                <div class="bo-hint">💧 Illiquidity filter · always on<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                <div class="bo-hint" x-show="tip">The last 3 trades are fetched before entry; if they average more than 12s apart the ticker is illiquid and is skipped, and one that passes skips the fetch for a week. Tickers failing either in random selection are graylisted for a week.</div>
              </div>
            </div>
          </div>
        </div>
      `,
    },

    transform(def) {
      const _hasShort = typeof def.pseudoOpenShort === 'function', _hasLong = typeof def.pseudoOpenLong === 'function';
      WINTER = _hasShort && !_hasLong;
      try {
        const rs = document.documentElement.style;
        rs.setProperty('--bo-rgb', WINTER ? '96,210,255' : '255,200,60');
        rs.setProperty('--bo-acc', WINTER ? 'var(--ice)' : '#ffc83c');
      } catch (_) {}

      const _origInit   = def.init;
      const _origScan   = def.runScan;
      const _origCancel = def.cancelCondOrder;
      const _origWatch  = def.pseudoWatchCondOrders;
      const _origTrigger = def._condTrigger;
      const _hostStages = Array.isArray(def._scanStageDefs); // host has the cooperative scan scheduler

      return Object.assign({}, def, {

        _boLoaded: false,
        _boBusy: false,
        _boBinWarned: false,

        _boWinter() { return WINTER; },
        _boDefaultEdge() { return WINTER ? 'top' : 'bottom'; },
        // Plugin symbol (text glyphs, not emoji): snowflake for Winter, fire for Chaser.
        _boGlyph() { return WINTER ? '\u2744\uFE0E' : '\u2668\uFE0E'; },

        // ---- Live readout data (rendered in the General accordion's Mode line) ----
        _boCol(f) { return f < 0.5 ? 'var(--profit)' : f < 0.8 ? 'var(--warn)' : 'var(--short)'; },
        // One bucket per skew while flow is on (upside / downside), else one for the global edge: uPnL of its positions vs the Auto-switch limit.
        _boBuckets() {
          const c = this.cfg, pos = this.positions || [];
          const per = (c.minNotional || 6) / (c.leverage || 6), pct = Number(c.boAutoPct) || 25;
          const mk = (key, mine, extra) => {
            const thr = pct / 100 * mine.length * per;
            const up = mine.reduce((sum, p) => sum + (Number.isFinite(p.upnl) ? p.upnl : 0), 0);
            const f = thr > 0 && up < 0 ? Math.min(1, -up / thr) : 0;
            return Object.assign({ key, n: mine.length, up, thr, f, w: Math.round(f * 100), col: this._boCol(f), hot: f >= 0.8 }, extra);
          };
          if (c.boFlowOn) return ['upside', 'downside'].map(lean => {
            const mode = this._boFlowMode(lean);
            return mk(lean, pos.filter(p => p._boFlow === mode && this._boPosLean(p) === lean), { lean, mode, edge: this._boFlowEdge(lean), tag: lean === 'upside' ? 'UP' : 'DOWN' });
          });
          const e = this._boResolveEdge();
          return [mk('edge', pos.filter(p => p._boEdge === e), { lean: null, mode: null, edge: e, tag: 'EDGE' })];
        },
        // Popover text for one skew row.
        _boTipBucket(b) {
          const c = this.cfg;
          const pos = b.n + ' open position' + (b.n === 1 ? '' : 's') + (b.n ? ', uPnL ' + (b.up >= 0 ? '+' : '') + b.up.toFixed(2) + ' vs Auto-switch limit -' + b.thr.toFixed(2) : '') + (c.boAuto ? '' : ' (Auto-switch off)');
          if (b.lean) return (b.lean === 'upside' ? 'Upside-skew tickers (candles break up more often)' : 'Downside-skew tickers (candles break down more often)') + ' enter ' + (b.mode === 'against' ? 'AGAINST' : 'WITH') + ' flow, at the ' + b.edge.toUpperCase() + '. Entered this way: ' + pos + '.';
          return 'New conds enter at the ' + b.edge.toUpperCase() + ' (Ticker flow off). Entered at this edge: ' + pos + '.';
        },
        // Popover text for the LIVE row.
        _boTipHead() {
          const c = this.cfg, t = this._boTally(), p = this._boPend(), tr = this._boTrip();
          const rq = (c.boRetry || []).map(x => String(x).replace('USDT', '')).join(', ');
          let out = 'Pending conds ' + p.n + '/' + (c.maxCond ?? 30) + ' (' + p.top + ' top, ' + p.bottom + ' bottom). Of the last ' + t.n + ' resolved orders, price reached the top first ' + t.top + ', the bottom first ' + t.bottom + ', neither ' + t.none + '.';
          if (tr.on) out += ' Per-ticker trip: ' + tr.latched + ' latched, worst ' + tr.txt + '.';
          out += ' Retry queue: ' + (rq || 'empty') + '. Graylisted: ' + Object.keys(c.boGray || {}).length + '.';
          if (!c.binaryModeEnabled) out += ' WARNING: Binary Mode is off, TP and SL are only set at entry there.';
          return out;
        },
        _boBucketTxt(b) {
          return b.n ? (b.up >= 0 ? '+' : '') + b.up.toFixed(2) + '/-' + b.thr.toFixed(2) : '\u2014';
        },
        // Per-ticker trip: worst Breakout position vs the per-position limit, and how many tickers are latched.
        _boTrip() {
          const c = this.cfg;
          if (!c.boAuto || !c.boAutoTicker) return { on: false, latched: 0, f: 0, w: 0, col: '#3ddc84', txt: '' };
          const L = c.boTickLatch || {};
          const lim = (Number(c.boAutoPct) || 25) / 100 * ((c.minNotional || 6) / (c.leverage || 6));
          let worst = null;
          for (const p of (this.positions || [])) {
            if (!(p._boEdge === 'top' || p._boEdge === 'bottom') || !Number.isFinite(p.upnl)) continue;
            if (!worst || p.upnl < worst.upnl) worst = p;
          }
          const f = worst && worst.upnl < 0 && lim > 0 ? Math.min(1, -worst.upnl / lim) : 0;
          const txt = worst ? String(worst.symbol).replace('USDT', '') + ' ' + (worst.upnl >= 0 ? '+' : '') + worst.upnl.toFixed(2) + ' / -' + lim.toFixed(2) : 'no positions yet';
          return { on: true, latched: Object.keys(L).filter(k => L[k] === 'L').length, f, w: Math.round(f * 100), col: this._boCol(f), txt };
        },
        _boHot() {
          const c = this.cfg;
          return !!c.boAuto && (this._boBuckets().some(b => b.hot) || this._boTrip().f >= 0.8);
        },
        _boPend() {
          const n = (this.condOrders || []).filter(o => o.tag === 'breakout').length;
          let top = 0, bottom = 0;
          for (const v of Object.values(this.cfg.boEdges || {})) { if (v === 'top') top++; else if (v === 'bottom') bottom++; }
          return { n, top, bottom };
        },

        // Tally of the last resolved orders by the edge reached first.
        _boTally() {
          let top = 0, bottom = 0, none = 0;
          const log = Array.isArray(this.cfg.boLog) ? this.cfg.boLog : [];
          for (const x of log) { if (x === 'T') top++; else if (x === 'B') bottom++; else if (x === 'N') none++; }
          return { top, bottom, none, n: log.length };
        },

        // Edge the next batch enters at. Manual: the selector. Auto-switch: the dominant edge (Chaser) or its opposite (Winter), flipped by Invert; a tie keeps the current edge.
        // Edge the next batch enters at: the selector, or whatever Auto-switch last flipped it to.
        _boResolveEdge() {
          const e = this.cfg.boEntry;
          return (e === 'top' || e === 'bottom') ? e : this._boDefaultEdge();
        },
        // Ticker flow: score the candles. A candle breaks past the average move (m, %) upward when its high is more than m above its open, downward when its low is more than m below its open; one candle can do both.
        _boLean(candles, m) {
          let top = 0, bottom = 0;
          for (const c of candles) {
            const o = parseFloat(c[1]), h = parseFloat(c[2]), l = parseFloat(c[3]);
            if (!(o > 0)) continue;
            if ((h - o) / o * 100 > m) top++;
            if ((o - l) / o * 100 > m) bottom++;
          }
          return { top, bottom, lean: top > bottom ? 'upside' : bottom > top ? 'downside' : null };
        },
        // Edge for a ticker under the current flow mode. With: upside skew -> top, downside skew -> bottom. Against: the opposite. Null lean: no flow.
        _boFlowEdge(lean) {
          const w = this._boFlowMode(lean) !== 'against';
          return lean === 'upside' ? (w ? 'top' : 'bottom') : lean === 'downside' ? (w ? 'bottom' : 'top') : null;
        },
        // With / Against mode for one skew ('upside' | 'downside').
        _boFlowMode(lean) {
          return (lean === 'downside' ? this.cfg.boFlowDown : this.cfg.boFlowUp) === 'against' ? 'against' : 'with';
        },
        // Skew a stamped position was entered under, from its flow + edge (with+top / against+bottom = upside); null when it carries no flow stamp.
        _boPosLean(p) {
          const f = p && p._boFlow, e = p && p._boEdge;
          if ((f !== 'with' && f !== 'against') || (e !== 'top' && e !== 'bottom')) return null;
          return (e === 'top') === (f === 'with') ? 'upside' : 'downside';
        },
        _boFlowTip() {
          return 'Per ticker: counts how many of its 24 candles broke past the average move upward vs downward (measured from each candle open). More upward breaks = upside skew, more downward = downside skew. With flow enters at the top on upside skew and the bottom on downside skew; against flow is the reverse. Badges read W-/A- before TOP / BOTTOM. A tie has no skew and uses the global edge. Upside-skew and downside-skew tickers have separate switches.';
        },
        _boAutoTip() {
          if (this.cfg.boFlowOn) return 'For each skew separately, flips between entering with and against the ticker flow when the open Breakout positions of that skew entered under its current mode are down ' + (this.cfg.boAutoPct ?? 25) + '% of their base margin (the entry margin per position, DCA adds excluded) in uPnL. Checked about every minute; positions from before a switch no longer count.';
          return 'Switches where conditionals are set (top or bottom of the range) when the open Breakout positions entered at the current edge are down ' + (this.cfg.boAutoPct ?? 25) + '% of their base margin (the entry margin per position, DCA adds excluded) in uPnL. Checked about every minute; positions from before a switch no longer count.';
        },

        // Auto-switch: uPnL of the positions that entered at the current edge vs their base margin. Loss only; flips the edge.
        _boAutoCheck() {
          const c = this.cfg;
          if (!c.boAuto) return;
          const now = Date.now();
          if (now - (this._boAutoAt || 0) < 60000) return;
          this._boAutoAt = now;
          if (c.boAutoTicker && this._boTickCheck()) return;
          const flowOn = !!c.boFlowOn;
          for (const lean of (flowOn ? ['upside', 'downside'] : [null])) {
            const cur = flowOn ? this._boFlowMode(lean) : this._boResolveEdge();
            const mine = (this.positions || []).filter(p => flowOn ? (p._boFlow === cur && this._boPosLean(p) === lean) : p._boEdge === cur);
            if (!mine.length) continue;
            const base = mine.length * ((c.minNotional || 6) / (c.leverage || 6));
            const up = mine.reduce((sum, p) => sum + (Number.isFinite(p.upnl) ? p.upnl : 0), 0);
            const thr = (Number(c.boAutoPct) || 25) / 100 * base;
            if (up > -thr) continue;
            this._boFlip(`${flowOn ? lean + ' ' : ''}${cur}${flowOn ? '-flow' : ''} positions at ${up.toFixed(2)} USDT (limit -${thr.toFixed(2)})`, lean);
          }
        },

        // Flips the switch: that skew's With <-> Against while flow is on, else top <-> bottom.
        _boFlip(why, lean) {
          const c = this.cfg;
          if (c.boFlowOn) {
            if (lean !== 'upside' && lean !== 'downside') return;
            const k = lean === 'downside' ? 'boFlowDown' : 'boFlowUp';
            c[k] = this._boFlowMode(lean) === 'against' ? 'with' : 'against';
            this.log(`[BO] ${this._boGlyph()} Auto-switch: ${why} — ${lean}-skew tickers now entering ${c[k]} flow`, 'warn');
          } else {
            c.boEntry = opp(this._boResolveEdge());
            this.log(`[BO] ${this._boGlyph()} Auto-switch: ${why} — now entering at the ${c.boEntry}`, 'warn');
          }
          this.persist();
        },

        _boTickTip() {
          const pct = this.cfg.boAutoPct ?? 25;
          return 'Any single Breakout position at -' + pct + '% of its base margin in uPnL flips the switch right away, once per ticker. If that ticker later swings to +' + pct + '% it reverses the switch and is re-armed. Latches clear when the position closes.';
        },

        // Per-ticker trip: a loss at -pct flips and latches the ticker; a latched ticker at +pct reverses the flip and re-arms. Returns true when it flipped.
        _boTickCheck() {
          const c = this.cfg;
          if (!c.boTickLatch || typeof c.boTickLatch !== 'object') c.boTickLatch = {};
          const L = c.boTickLatch;
          const mine = (this.positions || []).filter(p => (p._boEdge === 'top' || p._boEdge === 'bottom') && (!c.boFlowOn || this._boPosLean(p)));
          const held = new Set(mine.map(p => p.symbol));
          for (const k of Object.keys(L)) if (!held.has(k)) delete L[k];
          const lim = (Number(c.boAutoPct) || 25) / 100 * ((c.minNotional || 6) / (c.leverage || 6));
          for (const p of mine) {
            if (!Number.isFinite(p.upnl)) continue;
            if (L[p.symbol] === 'L') {
              if (p.upnl < lim) continue;
              delete L[p.symbol];
              this._boFlip(`${p.symbol} swung to ${p.upnl.toFixed(2)} USDT (limit +${lim.toFixed(2)}), reversing`, this._boPosLean(p));
              return true;
            }
            if (p.upnl > -lim) continue;
            L[p.symbol] = 'L';
            this._boFlip(`${p.symbol} at ${p.upnl.toFixed(2)} USDT (limit -${lim.toFixed(2)})`, this._boPosLean(p));
            return true;
          }
          this.persist();
          return false;
        },

        // Logs one resolved order: hit = 'entry' (trigger reached), 'worse' (worse price reached) or 'none' (expired).
        _boResolve(sym, hit) {
          const edges = this.cfg.boEdges || {};
          const edge = edges[sym];
          if (!edge) return;
          delete edges[sym];
          const side = hit === 'entry' ? edge : hit === 'worse' ? opp(edge) : null;
          if (!Array.isArray(this.cfg.boLog)) this.cfg.boLog = [];
          this.cfg.boLog.push(side === 'top' ? 'T' : side === 'bottom' ? 'B' : 'N');
          if (this.cfg.boLog.length > TALLY_WINDOW) this.cfg.boLog.splice(0, this.cfg.boLog.length - TALLY_WINDOW);
          this.persist();
        },

        // Fallback for fills that bypass _condTrigger (live plugins): a tracked order gone from the cond. list with a position on the ticker was triggered; any other disappearance is dropped from the tally.
        _boReconcile() {
          const edges = this.cfg.boEdges;
          if (!edges) return;
          const live = new Set((this.condOrders || []).filter(o => o.tag === 'breakout').map(o => o.symbol));
          const held = new Set((this.positions || []).map(p => p.symbol));
          let dirty = false;
          for (const sym of Object.keys(edges)) {
            if (live.has(sym)) continue;
            if (held.has(sym)) this._boResolve(sym, 'entry'); else delete edges[sym];
            dirty = true;
          }
          if (dirty) this.persist();
        },

        _boStatus() {
          const q = this.cfg.boRetry || [];
          return (this.cfg.boFlowOn ? 'Up ' + this._boFlowMode('upside') + ' / Down ' + this._boFlowMode('downside') + ' flow · ' : '') + 'Pending ' + (this.condOrders || []).filter(o => o.tag === 'breakout').length + '/' + (this.cfg.maxCond ?? 30) + ' · Retry queue ' + (q.length ? q.map(s => s.replace('USDT', '')).join(', ') : 'empty') + ' · Graylisted ' + Object.keys(this.cfg.boGray || {}).length;
        },

        async init() {
          await _origInit.call(this);
          this._boLoaded = true;
          // Position-type badge: TOP / BOTTOM on pending conds and on positions / closed trades they became (stamped via the candidate's _boEdge).
          if (typeof this.registerRoleBadge === 'function') this.registerRoleBadge(item => {
            const e = item && (item._boEdge || item.candidate?._boEdge);
            if (e !== 'top' && e !== 'bottom') return null;
            const f = item._boFlow || item.candidate?._boFlow;
            const pre = f === 'with' ? 'W-' : f === 'against' ? 'A-' : '';
            const ttl = f === 'with' ? 'Breakout with flow, ' + e : f === 'against' ? 'Breakout against flow, ' + e : 'Breakout ' + e;
            return `<span title="${ttl}" style="font-family:var(--mono);font-size:9px;letter-spacing:1px;padding:2px 5px;border-radius:2px;border:1px solid rgba(var(--bo-rgb),.35);background:rgba(var(--bo-rgb),.15);color:var(--bo-acc)">${pre}${e.toUpperCase()}</span>`;
          });
          if (this.cfg.boFlow !== undefined) {
            if (this.cfg.boFlowUp === undefined) this.cfg.boFlowUp = this.cfg.boFlow === 'against' ? 'against' : 'with';
            if (this.cfg.boFlowDown === undefined) this.cfg.boFlowDown = this.cfg.boFlowUp;
            delete this.cfg.boFlow;
          }
          for (const [k, v] of Object.entries(BO_DEFAULT_CFG)) {
            if (this.cfg[k] === undefined) this.cfg[k] = Array.isArray(v) ? [...v] : v;
          }
          if (!Array.isArray(this.cfg.boRetry)) this.cfg.boRetry = [];
          if (this.cfg.boEntry !== 'top' && this.cfg.boEntry !== 'bottom') this.cfg.boEntry = this._boDefaultEdge();
          this.cfg.boLog = (Array.isArray(this.cfg.boLog) ? this.cfg.boLog : []).filter(x => x === 'T' || x === 'B' || x === 'N').slice(-TALLY_WINDOW);
          for (const k of ['boGray', 'boWhite', 'boEdges', 'boTickLatch']) if (!this.cfg[k] || typeof this.cfg[k] !== 'object' || Array.isArray(this.cfg[k])) this.cfg[k] = {};
          // Orders pending from before the edge setting all entered at the bot's default edge.
          for (const o of (this.condOrders || [])) if (o.tag === 'breakout' && !this.cfg.boEdges[o.symbol]) this.cfg.boEdges[o.symbol] = this._boDefaultEdge();
        },

        // A worse-price hit is the one cancel that requeues the ticker: the host (and live plugins) cancel with a reason starting 'worst case reached'.
        async cancelCondOrder(id, reason = 'manual') {
          const o = (this.condOrders || []).find(x => x.id === id);
          const ok = await _origCancel.call(this, id, reason);
          if (ok && o && o.tag === 'breakout') {
            if (/^worst case reached/.test(String(reason))) { this._boResolve(o.symbol, 'worse'); this._boRetryAdd(o.symbol); }
            else if (reason === 'breakout expired') this._boResolve(o.symbol, 'none');
            else if (this.cfg.boEdges) delete this.cfg.boEdges[o.symbol];
          }
          return ok;
        },

        // Expiry rides the cond. order watcher so it fires on time rather than at the next scan.
        async pseudoWatchCondOrders() {
          const r = await _origWatch.call(this);
          if (this._boLoaded) { try { this._boAutoCheck(); this._boReconcile(); await this._boExpire(); } catch (e) { this.log(`[BO] expiry error: ${e.message}`, 'warn'); } }
          return r;
        },

        // A target hit is the fill, even when the host then drops it for no free position slot. Logged before the host's first await so a reconcile can't miss it.
        async _condTrigger(o, at = 0) {
          if (o && o.tag === 'breakout' && (this.condOrders || []).some(x => x.id === o.id)) this._boResolve(o.symbol, 'entry');
          return _origTrigger.call(this, o, at);
        },

        _boRetryAdd(sym) {
          if (!Array.isArray(this.cfg.boRetry)) this.cfg.boRetry = [];
          if (this.cfg.boRetry.includes(sym)) return;
          this.cfg.boRetry.push(sym);
          this.log(`[BO] 🔁 ${sym} reached the worse price — queued for the next batch`, 'info');
          this.persist();
        },

        async _boExpire() {
          const now = Date.now(), life = Math.max(1, Number(this.cfg.boLifeMins) || 60) * 60000;
          const old = (this.condOrders || []).filter(o => o.tag === 'breakout' && now - (o.createdAt || 0) >= life);
          for (const o of old) {
            try { await this.cancelCondOrder(o.id, 'breakout expired'); }
            catch (e) { this.log(`[BO] expiry error (${o.symbol}): ${e.message}`, 'warn'); }
          }
        },

        // Last 24 closed 1hr candles, newest first from the exchange; the forming candle is dropped. Null when the ticker has fewer than 24.
        async _boCandles(sym) {
          const url = `${this.base}/v5/market/kline?category=linear&symbol=${sym}&interval=60&limit=${CANDLES + 1}`;
          const r = await (typeof this._qFetch === 'function' ? this._qFetch(url) : fetch(url));
          const list = (await r.json())?.result?.list;
          if (!Array.isArray(list)) return null;
          const now = Date.now();
          const closed = list.filter(c => Number(c[0]) + HOUR_MS <= now).slice(0, CANDLES);
          return closed.length === CANDLES ? closed : null;
        },

        // Average move, %: mean of (high - low) / open over the candles.
        _boAvgMove(candles) {
          let sum = 0, n = 0;
          for (const c of candles) {
            const o = parseFloat(c[1]), h = parseFloat(c[2]), l = parseFloat(c[3]);
            if (!(o > 0) || !(h >= l)) continue;
            sum += (h - l) / o * 100; n++;
          }
          return n === CANDLES ? sum / n : null;
        },

        // Stablecoin filter: the 24 candles' full span, %. A stablecoin never moves 1%.
        _boSpan(candles) {
          let hi = -Infinity, lo = Infinity;
          for (const c of candles) { hi = Math.max(hi, parseFloat(c[2])); lo = Math.min(lo, parseFloat(c[3])); }
          return lo > 0 && isFinite(hi) ? (hi / lo - 1) * 100 : 0;
        },

        // Illiquidity filter: average gap between the last 3 trades, ms (newest first). Null when the read fails.
        async _boTradeGap(sym) {
          try {
            const r = await fetch(`${this.base}/v5/market/recent-trade?category=linear&symbol=${sym}&limit=3`);
            const ts = ((await r.json())?.result?.list || []).map(x => Number(x.time)).filter(x => x > 0);
            if (ts.length < 3) return Infinity; // fewer than 3 trades on record is as illiquid as it gets
            return (Math.max(...ts) - Math.min(...ts)) / (ts.length - 1);
          } catch (e) { return null; }
        },

        _boGrayAdd(sym, why) {
          this.cfg.boGray[sym] = Date.now();
          this.log(`[BO] ⛔ ${sym}: ${why} — graylisted for a week`, 'info');
        },

        // Leverage the host will open with: Winter resolves it per ticker, Chaser uses the config value. TP / SL are ROI %, i.e. price move % x leverage.
        async _boLev(sym) {
          if (typeof this.resolveEffectiveLeverage === 'function') {
            const instr = await this.getInstrInfo(sym);
            const r = instr && this.resolveEffectiveLeverage(sym, instr);
            return r && r.lev > 0 ? r.lev : null;
          }
          return this.cfg.leverage > 0 ? this.cfg.leverage : 1;
        },

        // One cond. order. Edge 'bottom': trigger below price, worse above. Edge 'top': trigger above, worse below.
        async _boPlace(sym, t, retry, edge) {
          const candles = await this._boCandles(sym);
          if (!candles) { this.log(`[BO] ${sym}: fewer than ${CANDLES} closed 1hr candles — skipped`, 'info'); return null; }
          const m = this._boAvgMove(candles);
          if (!(m > 0)) return null;
          const span = this._boSpan(candles);
          if (span < MIN_SPAN_PCT) {
            if (retry) this.log(`[BO] ${sym}: stablecoin filter — ${span.toFixed(2)}% span over ${CANDLES}h — skipped`, 'info');
            else this._boGrayAdd(sym, `stablecoin filter, ${span.toFixed(2)}% span over ${CANDLES}h`);
            return null;
          }
          const white = Date.now() - (this.cfg.boWhite[sym] || 0) < GRAY_MS;
          const gap = white ? 0 : await this._boTradeGap(sym);
          if (gap != null && gap > MAX_GAP_MS) {
            const why = `illiquidity filter, last 3 trades ${isFinite(gap) ? (gap / 1000).toFixed(1) + 's' : 'not found'} apart`;
            if (retry) this.log(`[BO] ${sym}: ${why} — skipped`, 'info');
            else this._boGrayAdd(sym, why);
            return null;
          }
          if (gap != null && !white) this.cfg.boWhite[sym] = Date.now();
          // Ticker flow: this ticker's own edge from its candles' breakout skew; no skew falls back to the global edge, unstamped.
          let flow = null, lean = null;
          if (this.cfg.boFlowOn) {
            lean = this._boLean(candles, m);
            const fe = this._boFlowEdge(lean.lean);
            if (fe) { edge = fe; flow = this._boFlowMode(lean.lean); }
          }
          let price = parseFloat(t?.lastPrice || 0);
          try {
            const r = await fetch(`${this.base}/v5/market/tickers?category=linear&symbol=${sym}`);
            const lp = parseFloat((await r.json())?.result?.list?.[0]?.lastPrice);
            if (lp > 0) price = lp;
          } catch (e) {}
          if (!(price > 0)) return null;
          const lev = await this._boLev(sym);
          if (!lev) return null;
          const dir = edge === 'top' ? 1 : -1;
          const target = price * (1 + dir * m / 100), worst = price * (1 - dir * m / 100);
          const roi = +(m * lev).toFixed(2);
          const o = await this.placeCondEntry({
            candidate: {
              symbol: sym, price, change: parseFloat(t?.price24hPcnt || 0) * 100, fundingRate: parseFloat(t?.fundingRate || 0) * 100,
              _tpPct: roi, _slPct: roi, _bo: true, _boMovePct: +m.toFixed(3), _boEdge: edge, ...(flow ? { _boFlow: flow } : {}),
            },
            target, worst, tag: 'breakout',
          });
          if (o) {
            this.cfg.boEdges[sym] = edge;
            this.log(`[BO] ${this._boGlyph()} ${sym}${retry ? ' (retry)' : ''}: average move ${m.toFixed(2)}% (${CANDLES}×1hr) — cond. ${dir > 0 ? '+' : '-'}${m.toFixed(2)}% (${flow ? (flow === 'with' ? 'W-' : 'A-') : ''}${edge}${lean ? `; ${lean.lean ? lean.lean + ' skew' : 'no skew'} ${lean.top}T/${lean.bottom}B` : ''}), TP/SL ${m.toFixed(2)}% from the trigger`, 'info');
          }
          return o;
        },

        // Fills every free position slot: queued retries first, then random tickers from the bulk list.
        async _boBatch() {
          if (this._boBusy) return;
          this._boBusy = true;
          try {
            const c = this.cfg;
            if (!c.boEnabled) return;
            if (!c.binaryModeEnabled) {
              if (!this._boBinWarned) { this._boBinWarned = true; this.log('[BO] ⚠️ Binary Mode is off — TP and SL are only set at entry there, so no Breakout orders are placed', 'warn'); }
              return;
            }
            this._boBinWarned = false;
            if (this._isDrawdownHalted?.() || this._isGainsLocked?.()) return;

            this._boReconcile();
            const n = (this.condOrders || []).length;
            const free = (c.maxCond ?? 30) - n; // the host's Max Cond. Orders; Max Positions does not cap this
            if (free <= 0) return;

            const edge = this._boResolveEdge();
            c.boEntry = edge;

            const taken = new Set([...(this.positions || []).map(p => p.symbol), ...(this.condOrders || []).map(o => o.symbol)]);
            const tmap = new Map((this._lastAllTickers || []).map(t => [t.symbol, t]));

            // Retries the batch has room for leave the queue; the rest wait for the next batch.
            const usable = (Array.isArray(c.boRetry) ? c.boRetry : []).filter(s => !taken.has(s) && !this._isSymbolBanned?.(s));
            const retries = usable.slice(0, free);
            c.boRetry = usable.slice(free);
            const rset = new Set(retries);

            const now = Date.now();
            for (const m of [c.boGray, c.boWhite]) for (const k of Object.keys(m)) if (now - m[k] >= GRAY_MS) delete m[k];
            const mega = new Set(Array.isArray(c.megacapExclude) ? c.megacapExclude : []);
            const pool = (this._lastAllTickers || []).filter(t => t.symbol && t.symbol.endsWith('USDT') && !taken.has(t.symbol) && !rset.has(t.symbol)
              && !mega.has(t.symbol) && !(t.symbol in c.boGray) && parseFloat(t.lastPrice || 0) > 0 && !this._isSymbolBanned?.(t.symbol));
            for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }

            const queue = [...retries.map(s => ({ s, t: tmap.get(s), retry: true })), ...pool.map(t => ({ s: t.symbol, t, retry: false }))];
            const maxTry = free * 3; // a few spare picks for tickers that fail (new listings, refused orders)
            let placed = 0, tries = 0;
            for (const q of queue) {
              if (placed >= free || tries >= maxTry) break;
              tries++;
              try { if (await this._boPlace(q.s, q.t, q.retry, edge)) placed++; }
              catch (e) { this.log(`[BO] ${q.s} error: ${e.message}`, 'warn'); }
            }
            this.log(`[BO] ${this._boGlyph()} Batch — ${placed}/${free} order${free === 1 ? '' : 's'} placed${retries.length ? ` (${retries.length} retry)` : ''}`, 'info');
            this.persist();
          } finally { this._boBusy = false; }
        },

      }, _hostStages
        ? { _scanStageDefs: [...def._scanStageDefs,
            { id: 'bo-batch', group: 'bo', run: function (ctx) { return this._boBatch(ctx); } },
          ] }
        : { async runScan() {
            await _origScan.call(this);
            await this._boBatch();
          } });
    },
  };
})();
</script>
