<!--
  Breakout Plugin for PseudoChaser and PseudoWinter (unified)
  Modelled on MI's Fade (cond. entry, 1hr life) with no scoring, no forecasting and no simulation.

  Each batch picks random tickers (up to Max Cond. Orders; a ticker's pair is one bundle = one slot), reads the last twenty-four closed 1hr candles of each and takes the
  average move: the mean candle range, (high - low) / open, in %.

  Each ticker gets TWO cond. orders, one above price and one below, each 1 x the average move away: the top and the bottom of the range. Each one's worst price is the other's
  trigger. The two are one cond. bundle (bundle 'breakout', kinds top / bottom): one slot, one card, and whichever breaks first fills and cancels the other. TP / SL are 1 x the average move from the trigger on the bot's own side (Chaser TP above / SL below,
  Winter TP below / SL above). Needs the host's cond. bundle support (placeCondEntry bundle / kind, _condSlots, _condCancelSiblings).

  Break counter (the only regime stopgap): every filled cond. is a break, top or bottom, kept for the Break window (default 4h). A break is favorable when it goes the bot's way
  (Chaser: top, Winter: bottom). While unfavorable breaks outnumber favorable ones, every pending Breakout cond. is cancelled and none are placed; the count recovers as old breaks age out.
  Expired pairs and cancels are not breaks.

  Max positions: once open positions reach the host's Max Positions, every pending Breakout cond. is cancelled and no new ones are placed. They resume when a slot frees.

  Two fixed filters run before every order (no toggles):
    Stablecoin   — the 24 candles' full span (lowest low to highest high) must be at least 1%, else the ticker is a stablecoin.
    Illiquidity  — the last 3 trades are fetched; if they average more than 12s apart the ticker is illiquid.
  A ticker failing either is graylisted for a week. A ticker confirmed liquid is whitelisted for a week and skips the trade fetch.

  Pairs expire after Order Life (default 60 min) and are simply cancelled.
  TP / SL are set at entry only in Binary Mode, so Binary Mode must be on (the plugin places nothing otherwise).
  Needs no other plugin. The side is read from the host at load.

  Load via Plugin Manager in either bot's config panel, AFTER SunChaser / EverWinter if live.
  targetBot: both
-->
<script>
(function () {
  'use strict';

  const VERSION = '3.1.0'; // Change: Cond. bundles: a ticker's top/bottom pair is now one bundle (bundle 'breakout', kind top / bottom) taking ONE cond. slot with its own card, so Max Cond. Orders counts tickers; the host cancels the sibling on a fill, so Breakout no longer does. Needs the updated PseudoChaser 1.6.12 / PseudoWinter 1.6.11 (and EverWinter / SunChaser 1.7.2 live): on a host without _condSlots it logs once and places nothing | previous: 3.0.0 — Stripped to essentials: criteria, cell scores, watch lists, hypotheticals, ticker flow, double entries, retry queue and the worse-price logic are gone. Every ticker now gets TWO conds, one above and one below price at 1x the average move, each one's worst price being the other's trigger, so the first break fills and cancels its sibling. The only regime stopgap is the break counter: breaks (top / bottom fills) are counted over a Break window (default 4h), and while unfavorable breaks (Chaser: bottom, Winter: top) outnumber favorable ones every pending cond. is cancelled and none are placed until the count recovers. Needs the host's cond. bundles: a ticker's pair takes ONE cond. slot and shows as one bundle card | previous: Live readout rebuilt around the criteria instead of the P/A UP / DOWN cohorts: one column per criterion summarizing ALL of its stored scores, for its + and its - table the cell its tickers did best at after breaking out (W-/A- TOP / BTM, D / D3 double / triple, SND under the stand-down floor) above the tag and what that cell has paid below it (the base cell's samples plus the criterion table's, last N per type: first-passage, round-2 hypotheticals, real), BASE-best NET at the right; the CRIT sample-count row folds into it | previous: Criteria: P/A (average positive vs average negative close of the 24 candles, strength-weighted, replaces the break-count lean cohorts U / D / N) plus, behind a new Criteria toggle, Funding, long / short skew (one extra fetch), LTA (turnover of the latest 12 candles vs the 12 before) and IO/A (open interest vs the filtered-market median); base cells are now edge x k (T1 ... B3) and every criterion keeps +/- tables per base cell, a ticker's score = base cell + each exhibited criterion's table x its strength; tables learn the excess over the base cell's average; old lean cells are folded into the base cells | previous: Live mode (EverWinter / SunChaser): the max-positions cancel-all check runs the moment a live cond. fills (live fills bypass _condTrigger) instead of waiting for the next watcher tick; batches still fill Max Cond. Orders in live and sim alike | previous: Internal tracking of conds. at max positions removed (it polled every tracked ticker's price; the watch lists replace it): at max positions pending conds are simply cancelled and none are placed, and the Tracked table, tracker storage and their tally / invalidation feed are gone | previous: Numerical cell scoring replaces Auto-switch, the per-ticker trip, the With / Against switches and the double-entry ratchet: every ticker is simulated at both edges and 1x / 2x / 3x (round 1: twelve 5m candles of the order life, round 2: the position walked to TP / SL on 4h candles with one finer fetch when both touch, funding and fees included), cond. orders, hypotheticals and real TP / SL / Force Close results feed per-cell $ scores (last 50 samples per type, no decay, uPnL no longer scored), entries are drawn by score, and a lean whose cells are all under water stands down; new Round 1 / Round 2 lists and a HYPO row | previous: At max positions every Breakout cond. is cancelled and no new ones are placed; those tickers are tracked internally (top / bottom breaks, invalidations, expiry feed the tallies and the double multiplier) and listed in a new Tracked table with a one-bar progress view; re-checked after every cond. fill. | previous: Contradictory moves removed: the unfavored skew (Chaser downside, Winter upside) enters a double top / bottom cond. at 2x the average move (multiplier rises +1 when those positions lose, falls -1 when a double cond. expires untouched, floor 2); worse-price hits are counted as invalidations per W-/A- badge. | previous: Live readout cut to three label-free rows (LIVE: pending + break counts; UP skew; DOWN skew) using only the app's gray / theme / green / yellow / red; extra detail moved into a hover (PC) or tap (mobile) popover per row. | previous: Live readout moved into the Breakout accordion body, below the config fields, and shrunk to a compact bar-free table (entry mode + edge per skew with its loss figure, break counts, pending, trip, queue); General accordion's Mode line restored. | previous: Live readouts (pending / flow modes / auto-switch loss meters / per-ticker trip / break tally / retry queue / Binary warning) moved out of the Breakout config into the General accordion's Mode line, shown bold and colored with meters, pulses and an outcome strip. | previous: All hint text and hover tooltips are hidden behind circled "!" buttons next to their toggle or setting (click to show); Ticker flow, Auto-switch and Per-ticker trip default to on. | previous: Ticker flow With / Against is now two switches, one for upside-skew tickers and one for downside-skew tickers; Auto-switch and Per-ticker trip flip only the skew whose positions lost (or reversed). | previous: Per-ticker trip sub-toggle under Auto-switch: one position at -25% of its base margin flips the switch (and flow) once, latched; a swing to +25% reverses it and re-arms. | previous: Ticker flow: each ticker is scored toppy / bottomy from its 24 candles (breaks of the average move above the open vs below it) and enters With or Against that flow; W-/A- prefix on the TOP / BOTTOM badges; Auto-switch flips With <-> Against while flow is on. | previous: Chaser plugin glyph is the text-style hot springs symbol (fire-like) instead of the alchemical fire triangle. | previous: Auto-switch rebuilt on uPnL: flips the entry edge when open positions entered at the current edge are down 25% (setting) of their base margin, checked every minute; plugin glyph (snowflake / fire) replaces the explosion emoji. | previous: Auto-switch rule: tally in the bot's favor (Chaser: tops lead, Winter: bottoms lead) enters at the leading edge, against it at the opposite edge. | previous: TOP / BOTTOM position-type badge on pending conds and positions (needs the base bots' cond card badge slot); Auto-switch tooltip rewritten in plain English with the currently resolving edge. | previous: Entry edge setting (Chaser can enter at the top, Winter at the bottom); top / bottom / no-break tally readout; batch fills the host's Max Cond. Orders limit instead of being capped by Max Positions; tally counts fills dropped past Max Positions; Auto-switch picks the edge from the tally's skew. | previous: Illiquidity filter whitelist — a ticker confirmed liquid skips the 3-trade fetch for a week. | previous: Stablecoin filter (24h span under 1% = skipped) and Illiquidity filter (last 3 trades averaging over 12s apart = skipped), both always on; failures from random selection are graylisted for a week. | previous: Initial release — average-move cond. entries (24 x 1hr candles), TP/SL at +/- the average move from the trigger, 1hr expiry, worse-price orders requeued for the next batch.
  let   WINTER  = false;   // set in transform() from the host
  const CANDLES = 24;      // closed 1hr candles the average move is read from
  const HOUR_MS = 3600000;
  const MIN_SPAN_PCT = 1;          // stablecoin filter: least % span the 24 candles must cover
  const MAX_GAP_MS   = 12000;      // illiquidity filter: most average ms between the last 3 trades
  const GRAY_MS      = 7 * 86400000; // graylist time for a ticker that fails either filter

  const BO_DEFAULT_CFG = Object.freeze({
    boEnabled: true,   // Breakout mode
    boLifeMins: 60,    // how long a cond. pair waits before it is cancelled
    boWinH: 4,         // break window, hours: breaks older than this stop counting
    boBreaks: [],      // [ms, 'T' | 'B'] filled conds. (top / bottom breaks) inside the window
    boPairs: {},       // symbol -> { t, top: cond id, bottom: cond id } pending pairs
    boWhite: {},       // symbol -> epoch ms it was confirmed liquid; skips the trade fetch for a week
    boGray: {},        // symbol -> epoch ms it was graylisted (stablecoin / illiquid), kept a week
  });

  window.__BotPlugin = {
    id:        'breakout',
    name:      'Breakout',
    version:   VERSION,
    targetBot: 'both',
    after:     ['sunchaser', 'everwinter'],
    before:    [],
    conflicts: [],
    requires:  [],
    touches:   ['init', 'runScan', 'pseudoWatchCondOrders', '_condTrigger', '_ewCondFilled', '_scCondFilled'],
    css: `
      :root { --bo-rgb:255,200,60; --bo-acc:#ffc83c; }
      .bo-hint { font-size:9px; color:var(--text-lo); margin-top:3px; line-height:1.5; }
      .bo-g { color:#3ddc84; } .bo-r { color:#ff5a5f; }
      .bo-info { display:inline-flex; align-items:center; justify-content:center; width:12px; height:12px; margin-left:6px; padding:0; border-radius:50%; border:1px solid rgba(var(--bo-rgb),.35); background:transparent; color:var(--bo-acc); font:700 8px/1 var(--mono); cursor:pointer; flex:none; vertical-align:middle; }
      .bo-info.on { background:rgba(var(--bo-rgb),.15); }
      .bo-live { position:relative; margin-top:8px; padding:3px 8px; border:1px solid rgba(var(--bo-rgb),.28); border-left:3px solid var(--bo-acc); border-radius:4px; background:rgba(var(--bo-rgb),.05); font-family:var(--mono); font-size:10px; color:var(--text-hi); }
      .bo-live.hot { border-color:var(--short); }
      .bo-lr { position:relative; display:flex; align-items:center; gap:7px; padding:4px 0; cursor:help; }
      .bo-ttl { font-weight:700; letter-spacing:2px; color:var(--bo-acc); }
      .bo-cnt { color:var(--text-lo); } .bo-cnt b { margin-left:2px; color:var(--text-hi); } .bo-cnt.lead b { color:var(--bo-acc); }
      .bo-pulse { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--short); animation:bo-pulse 1s infinite; }
      @keyframes bo-pulse { 0% { box-shadow:0 0 0 0 rgba(255,69,96,.7); } 70% { box-shadow:0 0 0 6px rgba(255,69,96,0); } 100% { box-shadow:0 0 0 0 rgba(255,69,96,0); } }
      .bo-blink { color:var(--warn); animation:bo-blink 1.6s infinite; }
      @keyframes bo-blink { 50% { opacity:.4; } }
      .bo-pop { position:absolute; left:0; right:0; top:100%; z-index:20; margin-top:2px; padding:5px 7px; font-size:9px; font-weight:400; letter-spacing:0; line-height:1.5; color:var(--text-mid); background:var(--bg-panel,#15110c); border:1px solid rgba(var(--bo-rgb),.35); border-radius:3px; box-shadow:0 4px 12px rgba(0,0,0,.5); }
      .bo-in { width:60px; font-family:var(--mono); font-size:10px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.12); border-radius:3px; color:var(--text-hi); padding:2px 5px; }
    `,

    slots: {
      'mode-label-extra': `<span x-show="cfg.boEnabled"> + Breakout</span>`,
      'strategy-accordions': `
        <div x-data="{ open: false }">
          <button class="cfg-acc-hd" @click="open=!open" :class="open?'open':''">
            <div style="display:flex;align-items:center;gap:7px">
              <span><span x-text="_boGlyph()"></span> Breakout</span>
              <span x-show="cfg.boEnabled" style="font-size:8px;padding:1px 5px;background:rgba(var(--bo-rgb),.15);border:1px solid rgba(var(--bo-rgb),.35);border-radius:2px;color:var(--bo-acc);letter-spacing:1px">ON</span>
              <span x-show="!cfg.boEnabled" style="font-size:8px;padding:1px 5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:2px;color:var(--text-lo);letter-spacing:1px">OFF</span>
            </div>
            <span class="cfg-acc-arrow" :class="open?'open':''">▶</span>
          </button>
          <div x-show="open" x-transition.opacity class="cfg-acc-body">
            <label class="tog">
              <div class="tog-t" :class="cfg.boEnabled?'on':''" @click.prevent="if(!cfgLocked){cfg.boEnabled=!cfg.boEnabled;persist()}"><div class="tog-k"></div></div>
              <div x-data="{ tip: false }">
                <div class="tog-l">Breakout Mode<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                <div class="bo-hint" x-show="tip" x-text="'Two cond. entries per ticker, one above and one below price at the average move; the first to trigger cancels the other. TP and SL one average move from the trigger.'"></div>
              </div>
            </label>
            <div x-show="cfg.boEnabled" style="margin-top:8px">
              <div x-data="{ tip: false }" style="margin-top:8px">
                <div style="display:flex;align-items:center;gap:6px">
                  <span class="lbl" style="margin:0">Order life (min)</span>
                  <input type="number" min="1" step="1" class="bo-in" x-model.number="cfg.boLifeMins" @change="cfg.boLifeMins=Math.max(1,Math.round(+cfg.boLifeMins||60));persist()">
                  <button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button>
                </div>
                <div class="bo-hint" x-show="tip">Each ticker gets two conds, one above and one below price at 1x the average move; the first to trigger cancels the other. Unfilled pairs are cancelled after this. Each ticker is one bundle, one of the Max Cond. Orders, independent of Max Positions.</div>
              </div>
              <div x-data="{ tip: false }" style="margin-top:6px">
                <div style="display:flex;align-items:center;gap:6px">
                  <span class="lbl" style="margin:0">Break window (h)</span>
                  <input type="number" min="0.5" step="0.5" class="bo-in" x-model.number="cfg.boWinH" @change="cfg.boWinH=Math.max(0.5,+cfg.boWinH||4);persist()">
                  <button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button>
                </div>
                <div class="bo-hint" x-show="tip">Fills are counted as breaks over this window. A break going the bot\'s way (Chaser: top, Winter: bottom) is favorable. While unfavorable breaks outnumber favorable ones, every pending cond. is cancelled and none are placed; it resumes as old breaks age out of the window.</div>
              </div>
              <div class="bo-live" :class="_boHalted(tick)?'hot':''">
                <div class="bo-lr" x-data="{ tip: false }" @pointerenter="if ($event.pointerType === 'mouse') tip = true" @pointerleave="if ($event.pointerType === 'mouse') tip = false" @click="if (($event.pointerType || 'touch') !== 'mouse') tip = !tip">
                  <span class="bo-ttl"><span x-text="_boGlyph()"></span> LIVE</span>
                  <span class="bo-pulse" x-show="_boHalted(tick)"></span>
                  <span class="bo-blink" x-show="!cfg.binaryModeEnabled">&#9888;</span>
                  <span><b x-text="_boPend()"></b><span style="color:var(--text-lo)">/<span x-text="cfg.maxCond ?? 30"></span></span></span>
                  <span class="bo-cnt" :class="_boFavEdge()==='top'?'bo-g':'bo-r'">&#9650;<b x-text="_boTally(tick).top"></b></span>
                  <span class="bo-cnt" :class="_boFavEdge()==='bottom'?'bo-g':'bo-r'">&#9660;<b x-text="_boTally(tick).bottom"></b></span>
                  <span class="bo-r" x-show="_boHalted(tick)">STOP</span>
                  <div class="bo-pop" x-show="tip" x-text="_boTip(tick)"></div>
                </div>
              </div>
              <div x-data="{ tip: false }">
                <div class="bo-hint">🪙 Stablecoin filter · always on<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                <div class="bo-hint" x-show="tip">The 24 candles must span at least 1% from lowest low to highest high, else the ticker is a stablecoin and is skipped. Tickers failing either in random selection are graylisted for a week.</div>
              </div>
              <div x-data="{ tip: false }">
                <div class="bo-hint">💧 Illiquidity filter · always on<button type="button" class="bo-info" :class="tip?'on':''" :aria-expanded="tip" aria-label="Info" @click.prevent.stop="tip=!tip">!</button></div>
                <div class="bo-hint" x-show="tip">The last 3 trades are fetched before entry; if they average more than 12s apart the ticker is illiquid and is skipped, and one that passes skips the fetch for a week. Tickers failing either in random selection are graylisted for a week.</div>
              </div>
            </div>
          </div>
        </div>
      `,
    },

    transform(def) {
      const _hasShort = typeof def.pseudoOpenShort === 'function', _hasLong = typeof def.pseudoOpenLong === 'function';
      WINTER = _hasShort && !_hasLong;
      try {
        const rs = document.documentElement.style;
        rs.setProperty('--bo-rgb', WINTER ? '96,210,255' : '255,200,60');
        rs.setProperty('--bo-acc', WINTER ? 'var(--ice)' : '#ffc83c');
      } catch (_) {}

      const _origInit    = def.init;
      const _origScan    = def.runScan;
      const _origWatch   = def.pseudoWatchCondOrders;
      const _origTrigger = def._condTrigger;
      const _liveFilled = def._ewCondFilled ? '_ewCondFilled' : def._scCondFilled ? '_scCondFilled' : null; // live plugins: a cond. filled on the exchange
      const _origLiveFilled = _liveFilled ? def[_liveFilled] : null;
      const _hostStages = Array.isArray(def._scanStageDefs); // host has the cooperative scan scheduler

      return Object.assign({}, def, {

        _boLoaded: false,
        _boBusy: false,
        _boBinWarned: false,
        _boHostWarned: false,

        // Plugin symbol (text glyphs, not emoji): snowflake for Winter, fire for Chaser.
        _boGlyph() { return WINTER ? '\u2744\uFE0E' : '\u2668\uFE0E'; },
        // The break that goes the bot's way: Chaser (long) top, Winter (short) bottom.
        _boFavEdge() { return WINTER ? 'bottom' : 'top'; },
        _boWinMs() { return Math.max(0.1, Number(this.cfg.boWinH) || 4) * 3600000; },
        _boPend() { return new Set((this.condOrders || []).filter(o => o.tag === 'breakout').map(o => o.symbol)).size; }, // slots used: one per ticker
        _boAtCap() { return (this.positions || []).length >= (this.cfg.maxPos ?? 5); },

        // ---- Break counter ----
        // (_t is only there so the readout re-evaluates on the host's tick as old breaks age out.)
        _boTally(_t) {
          const cut = Date.now() - this._boWinMs();
          let top = 0, bottom = 0;
          for (const x of (Array.isArray(this.cfg.boBreaks) ? this.cfg.boBreaks : [])) if (x && x[0] >= cut) { if (x[1] === 'T') top++; else if (x[1] === 'B') bottom++; }
          const fav = this._boFavEdge() === 'top' ? top : bottom;
          return { top, bottom, fav, unfav: top + bottom - fav };
        },
        _boHalted(_t) { const t = this._boTally(); return t.unfav > t.fav; },
        _boTip(_t) {
          const t = this._boTally(), h = +(this._boWinMs() / 3600000).toFixed(1);
          return 'Last ' + h + 'h: ' + t.top + ' top breaks, ' + t.bottom + ' bottom breaks. Favorable = ' + this._boFavEdge() + ' (green), unfavorable = ' + (this._boFavEdge() === 'top' ? 'bottom' : 'top') + ' (red). '
            + (t.unfav > t.fav ? 'Unfavorable leads: all conds. cancelled, none placed until old breaks age out.' : 'Favorable at least level: conds. are being placed.');
        },
        _boCount(edge) {
          const c = this.cfg, now = Date.now(), cut = now - this._boWinMs();
          c.boBreaks = (Array.isArray(c.boBreaks) ? c.boBreaks : []).filter(x => x && x[0] >= cut).concat([[now, edge === 'top' ? 'T' : 'B']]);
          this.persist();
        },

        // A pair whose cond. filled without going through _condTrigger (live plugins) is found here: position on the ticker = it filled, so the break is counted
        // (the position's edge, else whichever cond. is gone). Leftover siblings (a failed exchange cancel) are retried. A pair with nothing pending and no position is just dropped (expired / cancelled, not a break).
        async _boSettle() {
          const pairs = this.cfg.boPairs;
          if (!pairs || !Object.keys(pairs).length) return;
          const held = new Map((this.positions || []).map(p => [p.symbol, p]));
          for (const sym of Object.keys(pairs)) {
            const p = pairs[sym], left = (this.condOrders || []).filter(o => o.tag === 'breakout' && o.symbol === sym), pos = held.get(sym);
            if (pos) {
              let e = pos._boEdge || pos.candidate?._boEdge;
              if (e !== 'top' && e !== 'bottom') { const gone = ['top', 'bottom'].filter(k => !left.some(o => o.id === p[k])); e = gone.length === 1 ? gone[0] : null; }
              delete pairs[sym];
              if (e) this._boCount(e);
              for (const o of left) { try { await this.cancelCondOrder(o.id, 'breakout sibling'); } catch (err) { this.log(`[BO] sibling cancel error (${sym}): ${err.message}`, 'warn'); } }
            } else if (!left.length) delete pairs[sym];
          }
          this.persist();
        },

        // Cancels every pending Breakout cond.: at max positions (the host drops a cond. that triggers past Max Positions anyway) and while the break counter is against the bot.
        async _boCancelAll(reason, msg) {
          const pend = (this.condOrders || []).filter(o => o.tag === 'breakout');
          if (!pend.length) return;
          for (const o of pend) {
            try { await this.cancelCondOrder(o.id, reason); }
            catch (e) { this.log(`[BO] cancel error (${o.symbol}): ${e.message}`, 'warn'); }
          }
          this.log(`[BO] ${this._boGlyph()} ${msg} — ${pend.length} cond. order${pend.length === 1 ? '' : 's'} cancelled`, 'warn');
          this.persist();
        },
        async _boGuard() {
          if (this._boAtCap()) return this._boCancelAll('breakout max positions', `Max positions (${(this.positions || []).length}/${this.cfg.maxPos ?? 5})`);
          if (this._boHalted()) { const t = this._boTally(); return this._boCancelAll('breakout stand down', `Break counter against the bot (${t.unfav} unfavorable / ${t.fav} favorable)`); }
        },

        async _boExpire() {
          const now = Date.now(), life = Math.max(1, Number(this.cfg.boLifeMins) || 60) * 60000;
          for (const o of (this.condOrders || []).filter(o => o.tag === 'breakout' && now - (o.createdAt || 0) >= life)) {
            try { await this.cancelCondOrder(o.id, 'breakout expired'); }
            catch (e) { this.log(`[BO] expiry error (${o.symbol}): ${e.message}`, 'warn'); }
          }
        },
        // Last 24 closed 1hr candles, newest first from the exchange; the forming candle is dropped. Null when the ticker has fewer than 24.
        async _boCandles(sym) {
          const url = `${this.base}/v5/market/kline?category=linear&symbol=${sym}&interval=60&limit=${CANDLES + 1}`;
          const r = await (typeof this._qFetch === 'function' ? this._qFetch(url) : fetch(url));
          const list = (await r.json())?.result?.list;
          if (!Array.isArray(list)) return null;
          const now = Date.now();
          const closed = list.filter(c => Number(c[0]) + HOUR_MS <= now).slice(0, CANDLES);
          return closed.length === CANDLES ? closed : null;
        },

        // Average move, %: mean of (high - low) / open over the candles.
        _boAvgMove(candles) {
          let sum = 0, n = 0;
          for (const c of candles) {
            const o = parseFloat(c[1]), h = parseFloat(c[2]), l = parseFloat(c[3]);
            if (!(o > 0) || !(h >= l)) continue;
            sum += (h - l) / o * 100; n++;
          }
          return n === CANDLES ? sum / n : null;
        },

        // Stablecoin filter: the 24 candles' full span, %. A stablecoin never moves 1%.
        _boSpan(candles) {
          let hi = -Infinity, lo = Infinity;
          for (const c of candles) { hi = Math.max(hi, parseFloat(c[2])); lo = Math.min(lo, parseFloat(c[3])); }
          return lo > 0 && isFinite(hi) ? (hi / lo - 1) * 100 : 0;
        },

        // Illiquidity filter: average gap between the last 3 trades, ms (newest first). Null when the read fails.
        async _boTradeGap(sym) {
          try {
            const r = await fetch(`${this.base}/v5/market/recent-trade?category=linear&symbol=${sym}&limit=3`);
            const ts = ((await r.json())?.result?.list || []).map(x => Number(x.time)).filter(x => x > 0);
            if (ts.length < 3) return Infinity; // fewer than 3 trades on record is as illiquid as it gets
            return (Math.max(...ts) - Math.min(...ts)) / (ts.length - 1);
          } catch (e) { return null; }
        },

        _boGrayAdd(sym, why) {
          this.cfg.boGray[sym] = Date.now();
          this.log(`[BO] ⛔ ${sym}: ${why} — graylisted for a week`, 'info');
        },

        // Leverage the host will open with: Winter resolves it per ticker, Chaser uses the config value. TP / SL are ROI %, i.e. price move % x leverage.
        async _boLev(sym) {
          if (typeof this.resolveEffectiveLeverage === 'function') {
            const instr = await this.getInstrInfo(sym);
            const r = instr && this.resolveEffectiveLeverage(sym, instr);
            return r && r.lev > 0 ? r.lev : null;
          }
          return this.cfg.leverage > 0 ? this.cfg.leverage : 1;
        },

        // Everything before an order: candles, average move, filters, fresh price, leverage. Null when the ticker is skipped.
        async _boPrep(sym, t) {
          const candles = await this._boCandles(sym);
          if (!candles) { this.log(`[BO] ${sym}: fewer than ${CANDLES} closed 1hr candles — skipped`, 'info'); return null; }
          const m = this._boAvgMove(candles);
          if (!(m > 0)) return null;
          const span = this._boSpan(candles);
          if (span < MIN_SPAN_PCT) { this._boGrayAdd(sym, `stablecoin filter, ${span.toFixed(2)}% span over ${CANDLES}h`); return null; }
          const white = Date.now() - (this.cfg.boWhite[sym] || 0) < GRAY_MS;
          const gap = white ? 0 : await this._boTradeGap(sym);
          if (gap != null && gap > MAX_GAP_MS) { this._boGrayAdd(sym, `illiquidity filter, last 3 trades ${isFinite(gap) ? (gap / 1000).toFixed(1) + 's' : 'not found'} apart`); return null; }
          if (gap != null && !white) this.cfg.boWhite[sym] = Date.now();
          let price = parseFloat(t?.lastPrice || 0);
          try {
            const r = await fetch(`${this.base}/v5/market/tickers?category=linear&symbol=${sym}`);
            const lp = parseFloat((await r.json())?.result?.list?.[0]?.lastPrice);
            if (lp > 0) price = lp;
          } catch (e) {}
          if (!(price > 0)) return null;
          const lev = await this._boLev(sym);
          return lev ? { m, price, lev } : null;
        },

        // One pair: cond. above (top) and cond. below (bottom), each one's worst price the other's trigger. Returns the pair's first order, or null.
        async _boPlace(sym, t) {
          const pr = await this._boPrep(sym, t);
          if (!pr) return null;
          const { m, price, lev } = pr;
          const dist = Math.min(m, 90); // % from price to each trigger; capped so the lower trigger stays a positive price
          const up = price * (1 + dist / 100), dn = price * (1 - dist / 100), roi = +(m * lev).toFixed(2);
          const mk = (edge, target, worst) => this.placeCondEntry({ bundle: 'breakout', kind: edge,
            candidate: { symbol: sym, price, change: parseFloat(t?.price24hPcnt || 0) * 100, fundingRate: parseFloat(t?.fundingRate || 0) * 100, _tpPct: roi, _slPct: roi, _bo: true, _boMovePct: +m.toFixed(3), _boEdge: edge },
            target, worst, tag: 'breakout',
          });
          const a = await mk('top', up, dn);
          if (!a) return null;
          const b = await mk('bottom', dn, up);
          if (!b) { await this.cancelCondOrder(a.id, 'breakout sibling'); return null; }
          this.cfg.boPairs[sym] = { t: Date.now(), top: a.id, bottom: b.id };
          this.log(`[BO] ${this._boGlyph()} ${sym}: average move ${m.toFixed(2)}% (${CANDLES}×1hr) — conds. +${dist.toFixed(2)}% / -${dist.toFixed(2)}%, TP/SL ${m.toFixed(2)}% from the trigger`, 'info');
          return a;
        },

        // Fills the free cond. slots with pairs (one slot each) from random tickers of the bulk list.
        async _boBatch() {
          if (this._boBusy) return;
          this._boBusy = true;
          try {
            const c = this.cfg;
            if (!c.boEnabled) return;
            if (!c.binaryModeEnabled) {
              if (!this._boBinWarned) { this._boBinWarned = true; this.log('[BO] ⚠️ Binary Mode is off — TP and SL are only set at entry there, so no Breakout orders are placed', 'warn'); }
              return;
            }
            this._boBinWarned = false;
            if (typeof this._condSlots !== 'function') { // host predates cond. bundles: a pair would be refused after its first order and churn every pick
              if (!this._boHostWarned) { this._boHostWarned = true; this.log('[BO] ⚠️ Host has no cond. bundle support (_condSlots) — load the updated PseudoChaser / PseudoWinter; no Breakout orders are placed', 'warn'); }
              return;
            }
            if (this._isDrawdownHalted?.() || this._isGainsLocked?.()) return;

            await this._boSettle();
            await this._boGuard();
            if (this._boAtCap() || this._boHalted()) return; // max positions / break counter against the bot: no new conds
            const free = (c.maxCond ?? 30) - this._condSlots(); // free slots = pairs; the host's Max Cond. Orders, Max Positions does not cap this
            if (free <= 0) return;

            const taken = new Set([...(this.positions || []).map(p => p.symbol), ...(this.condOrders || []).map(o => o.symbol)]);
            const now = Date.now();
            for (const m of [c.boGray, c.boWhite]) for (const k of Object.keys(m)) if (now - m[k] >= GRAY_MS) delete m[k];
            const mega = new Set(Array.isArray(c.megacapExclude) ? c.megacapExclude : []);
            const pool = (this._lastAllTickers || []).filter(t => t.symbol && t.symbol.endsWith('USDT') && !taken.has(t.symbol)
              && !mega.has(t.symbol) && !(t.symbol in c.boGray) && parseFloat(t.lastPrice || 0) > 0 && !this._isSymbolBanned?.(t.symbol));
            for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }

            const maxTry = free * 3; // a few spare picks for tickers that fail (new listings, filters, refused orders)
            let placed = 0, tries = 0;
            for (const t of pool) {
              if (placed >= free || tries >= maxTry) break;
              tries++;
              try { if (await this._boPlace(t.symbol, t)) placed++; }
              catch (e) { this.log(`[BO] ${t.symbol} error: ${e.message}`, 'warn'); }
            }
            this.log(`[BO] ${this._boGlyph()} Batch — ${placed}/${free} pair${free === 1 ? '' : 's'} placed`, 'info');
            this.persist();
          } finally { this._boBusy = false; }
        },

        async init() {
          await _origInit.call(this);
          this._boLoaded = true;
          // Position-type badge: TOP / BOTTOM on pending conds and on the positions / closed trades they became (stamped via the candidate's _boEdge).
          if (typeof this.registerRoleBadge === 'function') this.registerRoleBadge(item => {
            const e = item && (item._boEdge || item.candidate?._boEdge);
            if (e !== 'top' && e !== 'bottom') return null;
            return `<span title="Breakout ${e}" style="font-family:var(--mono);font-size:9px;letter-spacing:1px;padding:2px 5px;border-radius:2px;border:1px solid rgba(var(--bo-rgb),.35);background:rgba(var(--bo-rgb),.15);color:var(--bo-acc)">${e.toUpperCase()}</span>`;
          });
          for (const [k, v] of Object.entries(BO_DEFAULT_CFG)) {
            if (this.cfg[k] === undefined) this.cfg[k] = Array.isArray(v) ? [...v] : (v && typeof v === 'object' ? { ...v } : v);
          }
          for (const k of ['boGray', 'boWhite', 'boPairs']) if (!this.cfg[k] || typeof this.cfg[k] !== 'object' || Array.isArray(this.cfg[k])) this.cfg[k] = {};
          this.cfg.boBreaks = (Array.isArray(this.cfg.boBreaks) ? this.cfg.boBreaks : []).filter(x => Array.isArray(x) && x[0] > 0 && (x[1] === 'T' || x[1] === 'B'));
          // Retired settings and stores (scoring, watch lists, hypotheticals, flow, auto-switch, tally, retry queue).
          for (const k of ['boFlowOn', 'boCritOn', 'boCritF', 'boCritS', 'boCritL', 'boCritI', 'boGate', 'boSamples', 'boWatchMax', 'boStepX', 'boCells', 'boCellOf', 'boW1', 'boW2', 'boHypo',
            'boEdges', 'boLog', 'boInval', 'boRetry', 'boAuto', 'boAutoPct', 'boAutoTicker', 'boTickLatch', 'boFlowUp', 'boFlowDown', 'boMult', 'boEntry', 'boFlow', 'boTrack']) delete this.cfg[k];
        },

        // Expiry and the sibling / break bookkeeping ride the cond. order watcher so they fire on time rather than at the next scan.
        async pseudoWatchCondOrders() {
          const r = await _origWatch.call(this);
          if (this._boLoaded) { try { await this._boSettle(); await this._boExpire(); await this._boGuard(); } catch (e) { this.log(`[BO] watcher error: ${e.message}`, 'warn'); } }
          return r;
        },

        // A target hit is the break, even when the host then drops the fill for no free position slot. Counted here; the host's _condTrigger cancels the bundle's other order.
        async _condTrigger(o, at = 0) {
          if (o && o.tag === 'breakout' && (this.condOrders || []).some(x => x.id === o.id)) {
            const e = o.candidate?._boEdge;
            if (this.cfg.boPairs[o.symbol]) delete this.cfg.boPairs[o.symbol];
            if (e === 'top' || e === 'bottom') this._boCount(e);
          }
          const r = await _origTrigger.call(this, o, at);
          if (this._boLoaded) { try { await this._boGuard(); } catch (e) { this.log(`[BO] guard error: ${e.message}`, 'warn'); } }
          return r;
        },

        // Live fills bypass _condTrigger: settle the pair and check the cap / break counter the moment one lands.
        ...(_liveFilled ? { [_liveFilled]: async function (o) {
          const r = await _origLiveFilled.call(this, o);
          if (this._boLoaded) { try { await this._boSettle(); await this._boGuard(); } catch (e) { this.log(`[BO] live fill check error: ${e.message}`, 'warn'); } }
          return r;
        } } : {}),

      }, _hostStages
        ? { _scanStageDefs: [...def._scanStageDefs,
            { id: 'bo-batch', group: 'bo', run: function (ctx) { return this._boBatch(ctx); } },
          ] }
        : { async runScan() {
            await _origScan.call(this);
            await this._boBatch();
          } });
    },
  };
})();
</script>
