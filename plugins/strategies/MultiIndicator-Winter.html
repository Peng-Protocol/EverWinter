<!--
  Multi-Indicator Strategy Plugin for PseudoWinter
  Slot-based entry filter. A slot (Auto-generated or manually built) qualifies once a ticker
  exhibits at least miwAutoSlotSize (Auto) or all of its own criteria (manual) from the
  secondary criteria set: fund, V/A, IO/A, OCS, OCX. No criterion is mandatory — this was
  liquidation-anchored in earlier versions (every slot required a real-time liquidation
  criterion), but that was an addition along the way, not the original design; v1.80.0 (see
  /versioning) removed liquidation, PEC, VSG, and Regime from the bot entirely, along with the
  live-message entry path, the closed-batch liq/Past-1 reads, and PEC/VSG's own kline-fetch
  pipeline.

  Auto Slots evaluates every non-excluded secondary criterion against each ticker and keeps
  every one that's true — not sliced down to a fixed count. Manual slots keep the existing
  criteria picker, an exact AND-gate of whatever's selected.

  Substitution considers any held position in the book, not just MIW's own, same as
  Liquid-Diver did — score-gated, not automatic.

  Re-entry Block Mode (miwReentryBlockMode: 'both' / 'losers') is ported from Liquid-Diver:
  'losers' lets a symbol that just closed in profit re-trigger immediately.

  Entry pool fires once per fresh sample batch (_pfOcResultsAt) — will not re-scan
  the same batch twice. Candidates are ranked on every ticker's latest stored reading (any age) and refetched before entry. TP, SL, and all exit logic use the host's settings.
  Drawdown throttle and gains lock gate all entries.

  Load via Plugin Manager in PseudoWinter's config panel.
  Load AFTER EverWinter if using live trading — see README Plugin Stack Order.
  targetBot: pseudowinter
-->
<script>
(function () {
  'use strict';

    const VERSION       = '1.100.1'; // Tweak: the scan's batch takes the plugin's Concentration movers first (AF/PF 2.1.0+, no-op without it) before the shuffled randoms. Prior: 1.100.0 — Feature: entry candidates are now ranked off every ticker's latest stored reading (any age) instead of only the scan's random batch; each is refetched (ticker, OC, 1hr) right before it opens or substitutes, and only has to still match a slot and clear the veto, not keep the tier or score it was ranked on. Refetches stop at the batch size per scan, and the random batch stays the only feed for the Extremity sample pool. Needs AF/PF 2.0.0+. Prior: 1.99.1 — Change: Target Halving now scales off the Sample Scorer's relative headline (favorable share of raw move, S) against its recorded peak — factor = clamp(S / peak, 0, 1) — instead of the $ weather value; needs Ashfall/Permafrost 1.95.0+. Prior: 1.99.0 — Change: Deferment now means a negative Sample Scorer headline — the window-average LPA test is removed and the Negative Headline sub-toggle (miwDeferWeatherNegEnabled) is folded into the Deferment toggle itself, which now needs Sample Scoring; Both Poles Red stays a sub-toggle and the Target Halving floor is unchanged. Prior: 1.98.0 — Feature: candidates come only from the scan's own fresh-fetched batch (size pfOcBatchSize); criteria never read the bulk list, the entry pool fires once per new batch, and the pre-open price refetch is skipped for current-cycle tickers. Prior: 1.97.0 — Feature: the scan runs as four stages (miw-prep/fetch/pool/entry) of the host's cooperative scan scheduler (host v1.20.0+) — the pool build is a checkpointed loop so a scan no longer freezes the page, and the old runScan wrap is kept as a fallback for older hosts. Prior: 1.96.3 — Fix: Pole Blocking gap now measured against the smaller of the two pole magnitudes, (Q - P) / min(|P|, Q), and only non-positive poles can block. Prior: 1.96.2 — Fix: substitution closed the weakest position before _miwOpen's post-top-up block re-check, so a candidate blocked once Force-Evaluate appended criteria cost a position and opened nothing — now pre-flights the top-up + block check and falls through to the next candidate. Prior: 1.96.1 — Fix: Pole Blocking hint used the MIC stylesheet class (mic-hint) so it rendered unstyled — now miw-hint. Prior: 1.96.0 — Feature: Pole Blocking (Entry tab, Sample Scoring only, off by default) — blocks entry on a criterion's pole (Fund, V/A, IO/A, OCS, OCX, LTA, LPA) whose proven scorecard edge trails its partner pole's by the threshold % (default 200) or more of the partner's edge, absolute gap with no magnitude floor; a non-positive partner is left to Deferment. Prior: 1.95.0 — Removal: Panic, Pre-Scorer and Slot Blocking (toggles, UI, code, config keys, the Blockable Criteria picker, per-position _miwPre* tags) and the helpers only they used; the Extremity lukewarm veto stays. Prior: 1.94.0 — Change: Ejection is no longer a toggle and no longer reads LTA — it fires whenever two or more deferment paths (target under min entry TP / window LPA, negative headline, both poles red) are in effect at once, and bails ALL open positions instead of the single worst one per scan; miwEjectionEnabled removed. Prior: 1.93.1 — Tweak: Target Halving factor now scales off the recorded weather peak (f = clamp(W / peak, 0, 1), zero at +$0) instead of +/- the entry-TP cap, so the Min Entry TP floor is crossed (entries deferred) more readily; inactive until a peak exists (10+ raw samples). Prior: 1.93.0 — Target Halving now also scales each new position's stop loss (host's binary SL, or DCA SL when it arms) by the same weather factor, never under 1%; needs the matching Pseudo host (per-position _slPctOverride). Prior: 1.92.0 — Feature: Negative Headline (Deferment sub-toggle) — also defer while the Sample Scorer headline (mean raw move in the bot's favor, $ on one base position) is below zero; the top-priority deferment reason, needs Deferment + Sample Scoring, off by default. Prior: 1.91.0 — Feature: Both Poles Red (Deferment sub-toggle) — also defer while any criterion has both its + and - pole in the red on the scorecard side the chart shows (poles need min samples), the 'no good entry' case. Needs Deferment on; off by default. Prior: 1.90.0 — Feature: Target Halving (Exit tab) — the Sample Scorer's weather value ($ on one base position, scaled +/- the entry TP in $) now sets each new position's own entry TP and the Cascade / Sacrifice % (neutral = half, +TP$ = full, -TP$ = zero; the sliders are ceilings), and drives Deferment: with it on and a scorecard value available, entries are deferred whenever the resolved entry TP or Cascade target is under the new Min Entry TP floor (default 6%, fee break-even), replacing the LPA test (LPA deferment remains the fallback). Cascade / Sacrifice never fire below that floor. Off by default; needs Sample Scoring. Prior: 1.89.0 — Feature: Sample Scoring support — sample records now carry each ticker's funding rate (fr, %) for the Fund sample chart and fund scoring, and slot blocking reads the host's unit-aware threshold (pp of edge under Sample Scoring, $ otherwise). Prior: 1.88.3 — Fund tier step 0.25% -> 0.0025% for granularity: new default, one-time x100 rescale of saved fund>N/fund<N slot gates (same physical threshold), gate slider widened to +/-400 tiers with a precise % readout, fund depth in co-qual ranking normalised to the old tier scale. Prior: 1.88.2 — Fix: funding (fund) tag at/near 0% — annotation now truncates toward zero with an explicit sign, so tiny negative funding tags as fund-0 (lukewarm, mirroring fund+0) instead of flooring to fund-1 (which landed in the neg pole as a false tier-1 and left its lukewarm side empty), an exactly-0% rate now attaches (bare fund gate was fr !== 0), and the fund>N/fund<N gate tier uses the same truncation; critEmoji reads -0 as negative. Prior: 1.88.1 — UI: Deferment (with its Ejection + Panic sub-toggles) moved from the Entry tab to the bottom of the Exit tab — pure markup move, no logic change. Prior: 1.88.0 — Feature: Panic (sub-toggle of Deferment, miwPanicEnabled, default off) — closes the lowest-uPnL open position each scan cycle when 2 of the last 3 sample batches' average LPA sit above the window's total average LPA (against Winter). Direction from the LPA scorecard (_miwPoleDirection), else the deferment default (falling price favored). Independent of whether Deferment is currently deferring; idle until 3 batches carrying LPA exist; skipped on a cycle where Ejection already closed one. Close reason 'panic' (Panic). Prior: 1.87.0 — Removal: Dead Switch (idle-entry halt/bail, its two settings, UI block, check and timestamps) — redundant now that Deferment covers it. Prior: 1.86.0 — Feature: Deferment (miwDefermentEnabled, default off) — regime proxy from Permafrost's sample window: while the total average LPA of the whole window is positive, no new entries at all (substitution and every other open path included; hist scoring continues), and it stays idle until at least 3 sample batches exist. Sub-toggle Ejection (miwEjectionEnabled, default off, only acts while deferring): each scan closes the lowest-uPnL open position while the total average LTA is against MIW (scorecard direction via _miwPoleDirection, else the Pre-Scorer default: low-volume favored). Ejection closes carry the 'ejection' reason (Eject). Topbar pill 'No Entry' while deferring. Prior: 1.85.0 — Feature: Pre-Scorer (miwPreScoreEnabled, default off) — after qualification and slot blocking, the top 25 of the entry pool are re-ranked by last-completed-hour price change (biggest faller first). Pure re-rank, reuses the per-hour 1hr candle cache, independent of LTA/LPA and of Auto/Manual; OC surveillance fetch path unchanged (LPA's population baseline stays a random sample). Each opened position records _miwPreHc/_miwPreFrom. // Feature: scan-time LTA/LPA and OCX matching now uses Permafrost's widened window fallback (_pfHourReadingWide, _pfOcLatestAvgMs) instead of requiring this-cycle/this-hour freshness, so a not-yet-resampled ticker can still be scored on stale-but-real data; pre-entry top-up refetch is unaffected. Fix: va/ioa tier formula replaced with a symmetric log-ratio (Math.log(val/windowAvg)*100/step) — the old (val-avg)/avg*100 formula floored at exactly -100 for anything under ~1% of the window mean while the positive side was unbounded, so a skewed window average (a mean over a small, randomly-sampled per-cycle population) pinned most below-average tickers to an identical -100 tag regardless of how far below average they actually were. Prior: 1.82.0 — Feature: LTA and LPA join the secondary criteria (Auto pool, exclude/blockable pickers, manual-slot gate panel, step chips, top-up); Auto minimum slider now 1-7. Fix: the raw criterion annotator now exists on the class (_miwAnnotateCritRaw) — Permafrost's open-position sampler was calling it off `this` while it only lived as a local inside runScan, so no rolling-average sample was ever recorded and closes/Ext-Rvl/substitution silently kept using the frozen entry snapshot. Prior: 1.81.2 — Tweak: UI hints shortened to one line each; Substitution hint now notes the live rolling-average score. Prior: 1.81.1 — Fix (see Permafrost-Winter 1.83.1): runScan's per-scan position refresh call simplified — _pfPositionCriteriaSample now does its own fresh per-symbol fetch instead of being handed a lookup built from the (potentially hours-stale, per cfg.bulkTickerCooldownHours) bulk allTickers snapshot. Prior: 1.81.0 — Open-Position Rolling-Average Criteria: runScan calls Permafrost's per-position refresh every cycle; positions opened via the Path-A open call now also store _miwRawCriteria alongside _miwCriteria so substitution's scoreOf can recompute a live composite score via _miwLiveCompositeScore instead of the frozen _miwCompositeScore.
    // v1.85.0: Feature: Pre-Scorer volume dimension — the re-rank now blends price (LPA-relative when both lpa+/lpa- poles are proven at afExtremityMinSamples, else raw 1hr change) with volume (LTA-relative 1hr turnover deviation, same proof rule, else the hard default direction: MIW favors falling price/low volume), 50/50, min-max normalized per shortlist. When a direction is scorecard-proven AND Lukewarm Scoring's global favored side is 'lukewarm', that half rewards closeness to neutral over depth instead of the plain monotonic re-rank.
    // v1.80.0 — Major cut-down (see /versioning): liquidation is no longer the mandatory per-slot anchor — PEC/VSG shape-matching, the live liq-message entry path, closed-batch liq/regime/Past-1 reads, and the whole liq-anchor concept are gone. Slots (Auto or manual) now qualify on any N of the 5 remaining secondary criteria alone: fund, V/A, IO/A, OCS, OCX.
  const DEFAULT_SLOTS = [[]];
  const MIW_HIST_KEY  = '__miw_hist_batches';
  // Full secondary criteria list — shared by Auto's minimum-gate qualifier, the Exclude-from-
  // Auto picker, so both stay in sync by construction.
  const SECONDARY_CRITS = ['fund','va','ioa','ocs','ocx','lta','lpa'];

  // Megacaps excluded from the population pool alongside BTC — their size skews OC/IO/Volume/liq
  // averages the same way BTC would. cfg.megacapExclude is seeded from this default below but is
  // a plain array on cfg (no picker UI) — edit it directly in saved config if the list needs to
  // change. Shared key name with Permafrost's own seed so either plugin can init it first.
  const DEFAULT_MEGACAP_EXCLUDE = ['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','TRXUSDT','LINKUSDT'];
  // Single source of truth for MIW's own scalar config defaults. Merged into cfg once during
  // init() (see below) — call sites read this.cfg.<key> directly, no inline `?? literal`.
  // Excludes: megacapExclude/miwSlots (arrays with their own migration
  // logic in init()), and any key actually owned by the Permafrost sibling plugin (those keep
  // their defensive `?? literal` at the cross-read call site since Permafrost owns their default).
  const MIW_DEFAULT_CFG = Object.freeze({
    miwEnabled: true,
    miwPicks: 5,
    miwFrThreshold: 0.1,
    miwShareCapEnabled: true,
    miwShareCapPct: 100,
    miwActiveSlot: 6,
    miwCascadeEnabled: true,
    miwCascadePct: 50,
    miwSacrificeEnabled: true,
    miwSacrificePct: 50,
    miwSubstitutionEnabled: true,
    miwSubstitutionMarginPct: 5,
    miwSubstitutionMinAgeMins: 10,
    miwDefermentEnabled: false, // Deferment: no new entries while the Sample Scorer headline is negative. Needs Sample Scoring.
    miwTargetHalvingEnabled: false, // Target Halving: the Sample Scorer's relative headline (favorable share of raw move) scales each new position's entry TP, the Cascade % and the Sacrifice % (recorded peak = full, even share = zero) and defers entries under the Min Entry TP floor. Needs Sample Scoring.
    miwMinEntryTp: 6,               // Target Halving floor, ROI %: below this a position can't clear its entry+exit fees, so a resolved entry TP or Cascade target under it = market not worth trading -> defer
    miwDeferBothRedEnabled: false, // Both-poles-red (sub-toggle of Deferment): also defer while any criterion has BOTH its + and - pole in the red on the scorecard
    miwPoleBlockEnabled: false,     // Pole Blocking (Sample Scoring only): block a pole trailing its positive partner pole's scorecard edge by the threshold or more
    miwPoleBlockPct: 200,           // Pole Blocking threshold, % of the partner pole's edge: blocked when (partner - pole) / partner >= this
    miwReentryBlockMode: 'both',
    miwAutoSlots: true,
    miwAutoSlotSize: 3,
    miwAutoSlotExclude: [],
    miwForceGeneralCriteria: true,
    miwFundStep: 0.0025,
    miwVaStep: 1,
    miwIoaStep: 1,
    miwOcsStep: 1,
    miwOcxStep: 1,
    // LTA step = % deviation of 1hr turnover from the ticker's own 24h/24 per tier; LPA step =
    // percentage points of 1hr price change above/below the population mean per tier.
    miwLtaStep: 10,
    miwLpaStep: 0.25,
  });

  // Per-criterion emoji for position badges. Fund emoji is app-relative:
  // +fund = longs paying = good carry for shorts (🤑), bad for longs (💸).
  // -fund = shorts paying = bad for shorts (💸), good for longs (🤑).
  const CRIT_EMOJI = { 'fund': '💰', 'va': '🔊', 'vm': '🔊', 'ioa': '🎲', 'iot': '🎲', 'iom': '🧲', 'ocs': '🔭', 'ocx': '📡', 'lta': '🕐', 'lpa': '💹' };
  const CRIT_DESC  = { 'fund': 'Fund (tiered funding rate)', 'va': 'V/A (volume vs. population sample-window average)', 'vm': 'V/M (vol/mcap ratio) — retired, replaced by V/A', 'ioa': 'IO/A (open interest vs. population sample-window average)', 'iot': 'IO/T (OI vs Turnover) — retired, replaced by IO/A', 'iom': 'IO/M (OI vs MCap) — retired, replaced by IO/A', 'ocs': 'OCS (buy/sell skew %)', 'ocx': 'OCX (% faster/slower than the full-window avg order interval)', 'lta': 'LTA (1hr turnover vs. the ticker\'s own 24h/24 average)', 'lpa': 'LPA (1hr price change vs. every other ticker in the sample window)' };
  // PEC, VSG, liquidation anchors (S-Liq/B-Liq/mS-Liq/mB-Liq/0-Liq/Past-1), and Regime were all
  // retired in v1.80.0 (see /versioning) — liquidation is no longer fetched or required at all,
  // and PEC/VSG's kline-shape-matching pipeline went with it. Slots now qualify on any N of the
  // 5 remaining secondary criteria (fund, V/A, IO/A, OCS, OCX) alone — see _miwAutoQualify.

  const critEmoji = c => {
    if (/^fund/.test(c)) { const s = c.slice(4); const num = parseFloat(s.replace(/^[<>]/,'')); return ((num < 0 || /^-/.test(s)) ? '💸' : '🤑') + s; }
    if (/^va/.test(c)) return '🔊' + c.slice(2);
    if (/^vm/.test(c)) return '🔊' + c.slice(2);
    // Retired (see VSG.md) — kept resolvable so old scorecard/history entries still render.
    if (/^lsa/.test(c)) return '🟥' + c.slice(3);
    if (/^lba/.test(c)) return '🟩' + c.slice(3);
    if (/^rasl/.test(c)) return '🔴' + c.slice(4);
    if (/^rabl/.test(c)) return '🟢' + c.slice(4);
    if (/^msliq/.test(c)) return '💦' + c.slice(5);
    if (/^mbliq/.test(c)) return '🧊' + c.slice(5);
    if (/^sliq/.test(c)) return '🥵' + c.slice(4);
    if (/^bliq/.test(c)) return '🥶' + c.slice(4);
    if (/^ioa/.test(c)) return '🎲' + c.slice(3);
    if (/^iot/.test(c)) return '🎲' + c.slice(3);
    if (/^iom/.test(c)) return '🧲' + c.slice(3);
    if (/^ocs/.test(c)) return '🔭' + c.slice(3);
    if (/^ocx/.test(c)) return '📡' + c.slice(3);
    if (/^lta/.test(c)) return '🕐' + c.slice(3);
    if (/^lpa/.test(c)) return '💹' + c.slice(3);
    if (/^liqturnover/.test(c)) return '🌊' + c.slice(11);
    if (/^liqquiet/.test(c)) return '🤫' + c.slice(8);
    if (/^pec/.test(c)) { const m = c.match(/^(pec[a-z]+)/); return (CRIT_EMOJI[m ? m[1] : c] || '') + c.replace(/^pec[a-z]+/, ''); }
    if (/^vsg/.test(c)) { const m = c.match(/^(vsg[a-z]+)/); return (CRIT_EMOJI[m ? m[1] : c] || '') + c.replace(/^vsg[a-z]+/, ''); }
    if (/^regime/.test(c)) { const m = c.match(/^(regime[a-z]+)/); return (CRIT_EMOJI[m ? m[1] : c] || '') + c.replace(/^regime[a-z]+/, ''); }
    return CRIT_EMOJI[c] || '';
  };
  const critLabel = c => {
    const fM = c.match(/^fund([<>])(-?\d+)$/);
    if (fM) return 'Fund ' + fM[1] + fM[2];
    const fA = c.match(/^fund([+-]-?\d*)$/);
    if (fA) return 'Fund t' + fA[1];
    if (c === 'fund') return 'Fund';
    const aM = c.match(/^va([<>])(-?\d+)$/);
    if (aM) return 'V/A ' + aM[1] + aM[2];
    const aA = c.match(/^va([+-]-?\d*)$/);
    if (aA) return 'V/A t' + aA[1];
    if (c === 'va') return 'V/A';
    const vM = c.match(/^vm([<>])(\d+)$/);
    if (vM) return 'V/M ' + vM[1] + vM[2];
    const vA = c.match(/^vm([+-]\d+)$/);
    if (vA) return 'V/M t' + vA[1];
    if (c === 'vm') return 'V/M';
    // Retired (see VSG.md) — kept resolvable so old scorecard/history entries and any
    // not-yet-migrated saved slots still render instead of falling through to the raw tag.
    const kM = c.match(/^(lsa|lba|rasl|rabl)([<>])(\d+)$/);
    if (kM) return kM[1].toUpperCase().replace('RASL','R-ASL').replace('RABL','R-ABL') + ' ' + kM[2] + kM[3];
    const kA = c.match(/^(lsa|lba|rasl|rabl)([+-]\d+)$/);
    if (kA) return kA[1].toUpperCase().replace('RASL','R-ASL').replace('RABL','R-ABL') + ' t' + kA[2];
    if (c === 'lsa') return 'LSA'; if (c === 'lba') return 'LBA';
    if (c === 'rasl') return 'R-ASL'; if (c === 'rabl') return 'R-ABL';
    const m = c.match(/^(m?sliq|m?bliq)([<>])([+-]?\d+)$/);
    if (m) return (m[1] === 'sliq' ? 'S-Liq' : m[1] === 'bliq' ? 'B-Liq' : m[1] === 'msliq' ? 'mS-Liq' : 'mB-Liq') + ' ' + m[2] + m[3];
    const n = c.match(/^(m?sliq|m?bliq)([+-]\d+)$/);
    if (n) return (n[1] === 'sliq' ? 'S-Liq' : n[1] === 'bliq' ? 'B-Liq' : n[1] === 'msliq' ? 'mS-Liq' : 'mB-Liq') + ' ' + n[2];
    if (c === 'sliq') return 'S-Liq'; if (c === 'bliq') return 'B-Liq';
    if (c === 'msliq') return 'mS-Liq'; if (c === 'mbliq') return 'mB-Liq';
    if (c === '0liq') return '0-Liq';
    const ioaM = c.match(/^ioa([<>])(-?\d+)$/);
    if (ioaM) return 'IO/A ' + ioaM[1] + ioaM[2];
    const ioaA = c.match(/^ioa([+-]-?\d*)$/);
    if (ioaA) return 'IO/A t' + ioaA[1];
    if (c === 'ioa') return 'IO/A';
    const o = c.match(/^(iot|iom)([<>])(\d+)$/);
    if (o) return (o[1] === 'iot' ? 'IO/T' : 'IO/M') + ' ' + o[2] + o[3];
    const p = c.match(/^(iot|iom)([+-]\d+)$/);
    if (p) return (p[1] === 'iot' ? 'IO/T' : 'IO/M') + ' t' + p[2];
    if (c === 'iot') return 'IO/T'; if (c === 'iom') return 'IO/M';
    const oc = c.match(/^(ocs|ocx)([<>])(-?\d+)$/);
    if (oc) return ({'ocs':'OCS','ocx':'OCX'}[oc[1]])+' '+oc[2]+oc[3];
    const ocT = c.match(/^(ocs|ocx)([+-]\d+)$/);
    if (ocT) return ({'ocs':'OCS','ocx':'OCX'}[ocT[1]])+' t'+ocT[2];
    if (c === 'ocs') return 'OCS'; if (c === 'ocx') return 'OCX';
    const haM = c.match(/^(lta|lpa)([<>])(-?\d+)$/);
    if (haM) return haM[1].toUpperCase() + ' ' + haM[2] + haM[3];
    const haT = c.match(/^(lta|lpa)([+-]-?\d*)$/);
    if (haT) return haT[1].toUpperCase() + ' t' + haT[2];
    if (c === 'lta') return 'LTA'; if (c === 'lpa') return 'LPA';
    const PEC_LABEL = { pecob: 'PEC OB', pecos: 'PEC OS', pecalpha: 'PEC Red Mtn', pecdelta: 'PEC Grn Delta', pecmomup: 'PEC Bull-Mom', pecmomdn: 'PEC Bear-Mom', pecirr: 'PEC Irregular' };
    const pM = c.match(/^(pec[a-z]+)([+-]\d+)$/);
    if (pM && PEC_LABEL[pM[1]]) return PEC_LABEL[pM[1]] + ' t' + pM[2];
    if (PEC_LABEL[c]) return PEC_LABEL[c];
    const VSG_LABEL = { vsgot: 'VSG Over-Traded', vsgut: 'VSG Under-Traded', vsgalpha: 'VSG Mountain', vsgdelta: 'VSG Trough', vsgmomup: 'VSG Mom-Up', vsgmomdn: 'VSG Mom-Dn', vsgirr: 'VSG Irregular' };
    const vsgM = c.match(/^(vsg[a-z]+)([+-]\d+)$/);
    if (vsgM && VSG_LABEL[vsgM[1]]) return VSG_LABEL[vsgM[1]] + ' t' + vsgM[2];
    if (VSG_LABEL[c]) return VSG_LABEL[c];
    const REGIME_LABEL = { regimebull: 'Rg Bull', regimebear: 'Rg Bear' };
    const rgM = c.match(/^(regime[a-z]+)([+-]\d+)$/);
    if (rgM && REGIME_LABEL[rgM[1]]) return REGIME_LABEL[rgM[1]] + ' t' + rgM[2];
    if (REGIME_LABEL[c]) return REGIME_LABEL[c];
    return CRIT_DESC[c] || c;
  };

  window.__BotPlugin = {
    id:        'multiindicator-winter',
    name:      'Multi-Indicator (Winter)',
    version:   VERSION,
    targetBot: 'pseudowinter',
    after:     ['everwinter', 'permafrost-winter'],
    before:    [],
    conflicts: ['liquiddiver-winter'],
    requires:  ['permafrost-winter'],
    touches:   ['init', 'runScan', 'pseudoWatchPositions'],

    css: `
      .miw-hint { font-size:9px; color:var(--text-lo); margin-top:3px; line-height:1.5; }
      .miw-slot { display:inline-flex; flex-direction:column; align-items:center; gap:3px; padding:6px 5px; border-radius:3px; border:1px solid; cursor:pointer; min-width:52px; font-size:9px; font-family:var(--mono); text-align:center; transition:border-color .15s,background .15s; }
      .miw-crit { font-size:8px; padding:1px 4px; border-radius:2px; background:rgba(96,210,255,.12); border:1px solid rgba(96,210,255,.3); color:var(--ice); white-space:nowrap; }

      'stats-eda': `

    },

    transform(def) {
      const _origInit  = def.init;
      const _origScan  = def.runScan;
      const _origWatch = def.pseudoWatchPositions;

      const _hostStages = Array.isArray(def._scanStageDefs); // host has the cooperative scan scheduler
      return Object.assign({}, def, {

        miwCollapsedSlotRanks: {},
        _miwLastSampledAt: 0,
        _miwHaltLogged: false,

        async init() {
          await _origInit.call(this);
          this._miwLoaded = true;
          if (!this.miwCollapsedSlotRanks) this.miwCollapsedSlotRanks = {};
          if (!this.miwCollapsedCritStats) this.miwCollapsedCritStats = {};
          if (!Array.isArray(this.cfg.miwSlots)) this.cfg.miwSlots = DEFAULT_SLOTS.map(s => [...s]);
          // V/M, IO/T, IO/M retired in favor of population-relative V/A and IO/A (see
          // _pfVolIoWindowAvg) — no mcap fetch machinery to init anymore. One-time cleanup of
          // saved config: strip the retired keys from the exclude list.
          if (Array.isArray(this.cfg.miwAutoSlotExclude) && this.cfg.miwAutoSlotExclude.some(c => c==='vm'||c==='iot'||c==='iom')) {
            this.cfg.miwAutoSlotExclude = this.cfg.miwAutoSlotExclude.filter(c => c!=='vm'&&c!=='iot'&&c!=='iom');
          }
          if (!Array.isArray(this.cfg.megacapExclude)) this.cfg.megacapExclude = [...DEFAULT_MEGACAP_EXCLUDE];
          // Single source of truth for all other MIW scalar defaults — see MIW_DEFAULT_CFG above.
          // Call sites read this.cfg.<key> directly with no inline fallback, since this
          // guarantees every key below is present after init runs once.
          for (const [k, v] of Object.entries(MIW_DEFAULT_CFG)) {
            if (this.cfg[k] === undefined) this.cfg[k] = Array.isArray(v) ? [...v] : v;
          }
          if (Number(this.cfg.miwOcxStep) === 0.1) this.cfg.miwOcxStep = 1;
          // v1.88.3 — Fund tier step 0.25% -> 0.0025% (100x finer). Saved thresholded fund gates
          // (fund>N / fund<N) were written in old 0.25% tiers, so rescale them x100 once to keep the
          // same physical threshold, then move the step. Flag-guarded; legacy bare +fund/-fund are
          // untouched here (the legacy block below converts them using the NEW step directly).
          if (!this.cfg.miwFundStepMigrated) {
            if (Number(this.cfg.miwFundStep) === 0.25) {
              const _rs = c => { const m = typeof c === 'string' && c.match(/^fund([<>])(-?\d+)$/); return m ? `fund${m[1]}${parseInt(m[2],10) * 100}` : c; };
              if (Array.isArray(this.cfg.miwSlots)) this.cfg.miwSlots = this.cfg.miwSlots.map(sl => Array.isArray(sl) ? sl.map(_rs) : sl);
              if (Array.isArray(this.cfg.miwAutoSlotExclude)) this.cfg.miwAutoSlotExclude = this.cfg.miwAutoSlotExclude.map(_rs);
              this.cfg.miwFundStep = 0.0025;
            }
            this.cfg.miwFundStepMigrated = true;
            this.persist();
          }
          // Legacy migration: convert old +fund/-fund to tiered form
          {
            const _fundStep   = this.cfg.miwFundStep;
            const _frThr      = this.cfg.miwFrThreshold;
            const _frTier     = Math.max(1, Math.ceil(_frThr / _fundStep));
            const _migCrit = c => {
              if (c === '+fund')   return `fund>${_frTier}`;
              if (c === '-fund')   return `fund<-${_frTier}`;
              return c;
            };
            const _legacyNames = new Set(['+fund','-fund']);
            if (Array.isArray(this.cfg.miwSlots) && this.cfg.miwSlots.some(s => s.some(c => _legacyNames.has(c)))) {
              this.cfg.miwSlots = this.cfg.miwSlots.map(s => s.map(_migCrit));
              this.persist();
            }
            if (Array.isArray(this.cfg.miwAutoSlotExclude) && this.cfg.miwAutoSlotExclude.some(c => _legacyNames.has(c))) {
              this.cfg.miwAutoSlotExclude = this.cfg.miwAutoSlotExclude.map(_migCrit);
              this.persist();
            }
          }
          // V/M, IO/T, IO/M, and every retired liquidation/PEC/VSG/regime tag no longer match
          // anything (see the migration above and /versioning v1.80.0) — a manual slot still
          // referencing one will never qualify. Not auto-rewritten (va/ioa isn't a 1:1 semantic
          // substitution), just flagged once so it doesn't silently go dead.
          {
            const _retiredIn = s => s.filter(c => /^(vm|iot|iom|pec|vsg|regime|liqturnover|liqquiet|sliq|bliq|msliq|mbliq|0liq|past1)/.test(c));
            const _retiredSlots = (this.cfg.miwSlots || []).map((s,i) => ({ i, crits: _retiredIn(s) })).filter(x => x.crits.length);
            if (_retiredSlots.length) this.log(`[MIW] ⚠️ ${_retiredSlots.length} manual slot(s) reference retired criteria and will never match — slot(s) ${_retiredSlots.map(x=>x.i+1).join(', ')}. Replace with fund / V/A / IO/A / OCS / OCX.`, 'warn');
          }
          this.registerRoleBadge?.(item => {
            if (!item || !item._miw) return null;
            const crits  = item._miwCriteria || [];
            const emoji  = crits.map(c => critEmoji(c)).join('');
            const title  = crits.length ? 'Multi: ' + crits.map(c => critLabel(c)).join(' + ') : 'Multi-Indicator';
            return `<span style="font-family:var(--mono);font-size:9px;padding:2px 5px;border-radius:2px;letter-spacing:1px;border:1px solid rgba(96,210,255,.45);color:var(--ice);background:rgba(96,210,255,.10)" title="${title}">${emoji || 'Multi'}</span>`;
          });
          this.registerCloseReason?.('substitution', 'Sub');
          this.registerCloseReason?.('ejection', 'Eject');
          this.log(`[MIW] Multi-Indicator (Winter) v${VERSION} loaded — ${this.cfg.miwEnabled ? 'enabled' : 'disabled'} | ${(this.cfg.miwSlots||[]).length} slots | ${this.cfg.miwPicks}/cycle`, 'info');
          this.renderTradeFeed?.();
        },

        // Cascade/Sacrifice run on the position watcher (5s, tied to bot.running) rather than
        // the scan clock (5-60min) — collective uPnL can cross either threshold and back well
        // within a single scan interval, and a private setInterval here would keep firing even
        // while the bot is stopped since it isn't tied to the start/stop lifecycle like this is.
        async pseudoWatchPositions() {
          await _origWatch.call(this);
          await this._miwCheckCascade();
          await this._miwCheckSacrifice();
        },

        _miwToggle(i, c) {
          const slots = (this.cfg.miwSlots || []).map(s => [...s]);
          if (!slots[i]) return;
          const idx = slots[i].indexOf(c);
          if (idx === -1) slots[i].push(c); else slots[i].splice(idx, 1);
          this.cfg.miwSlots = slots;
          this.persist?.();
        },

        _miwDelSlot(i) {
          const slots = (this.cfg.miwSlots || []).map(s => [...s]);
          slots.splice(i, 1);
          this.cfg.miwSlots = slots;
          if (this.cfg.miwActiveSlot !== null) {
            if (slots.length === 0) this.cfg.miwActiveSlot = null;
            else if (this.cfg.miwActiveSlot >= slots.length) this.cfg.miwActiveSlot = slots.length - 1;
          }
          this.persist?.();
        },

        _miwAddSlot() {
          const slots = (this.cfg.miwSlots || []).map(s => [...s]);
          slots.push([]);
          this.cfg.miwSlots = slots;
          this.cfg.miwActiveSlot = slots.length - 1;
          this.persist?.();
        },

        // Collective uPnL and the resulting bail set both cover every open position, not just
        // MIW's own — a winning position from another strategy should be able to push the
        // portfolio into Cascade the same as a winning MIW position would, and a Sacrifice
        // shouldn't leave an untouched, unrelated position dominating the aggregate afterward.
        async _miwCheckCascade() {
          if (!this.cfg.miwCascadeEnabled) return;
          const allPositions = this.positions || [];
          if (!allPositions.length) return;
          const totalUPnL   = allPositions.reduce((s, p) => s + (p.upnl || 0), 0);
          const baseMargin  = (this.cfg.minNotional || 6) / (this.cfg.leverage || 6);
          const _pct        = this._miwEffCascadePct();
          const threshold   = baseMargin * (_pct / 100);
          if (totalUPnL >= threshold) {
            this.log(`[MIW] 🌊 Cascade triggered — collective uPnL +${totalUPnL.toFixed(4)} ≥ ${threshold.toFixed(4)} USDT (${_pct.toFixed(1)}% of ${baseMargin.toFixed(4)} base margin) — bailing ${allPositions.length} position(s)`, 'info');
            if (this.cfg.permafrostCrossEnabled && typeof this._pfCrossWrite === 'function') {
              this._pfCrossWrite('cascade', null, { count: allPositions.length, pnl: totalUPnL });
            }
            this._logBatchBegin?.();
            try {
              for (const pos of allPositions) {
                await this.pseudoClosePosition(pos, 'cascade');
              }
            } finally { this._logBatchEnd?.('[MIW] 🌊 Cascade roll-up'); }
          }
        },

        async _miwCheckSacrifice() {
          if (!this.cfg.miwSacrificeEnabled) return;
          const allPositions = this.positions || [];
          if (!allPositions.length) return;
          const totalUPnL   = allPositions.reduce((s, p) => s + (p.upnl || 0), 0);
          const baseMargin  = (this.cfg.minNotional || 6) / (this.cfg.leverage || 6);
          const _pct        = this._miwEffSacrificePct();
          const threshold   = -(baseMargin * (_pct / 100));
          if (totalUPnL <= threshold) {
            this.log(`[MIW] 🩸 Sacrifice triggered — collective uPnL ${totalUPnL.toFixed(4)} ≤ ${threshold.toFixed(4)} USDT (${_pct.toFixed(1)}% of ${baseMargin.toFixed(4)} base margin) — bailing ${allPositions.length} position(s)`, 'info');
            if (this.cfg.permafrostCrossEnabled && typeof this._pfCrossWrite === 'function') {
              this._pfCrossWrite('sacrifice', null, { count: allPositions.length, pnl: totalUPnL });
            }
            this._logBatchBegin?.();
            try {
              for (const pos of allPositions) {
                await this.pseudoClosePosition(pos, 'sacrifice');
              }
            } finally { this._logBatchEnd?.('[MIW] 🩸 Sacrifice roll-up'); }
          }
        },

        // Dry-run of pseudoOpenShort's tick-precision/notional/TP/SL/leverage checks, without
        // its logging/ban-list side effects beyond resolveEffectiveLeverage's own (that one bans
        // for real on maxLeverage ≤ 5×, same as a live open would — leaving that in place is
        // correct, since a candidate that would get permanently banned anyway should never cost
        // us the position we were about to swap out of). Substitution calls this before closing
        // anything. Kept local to MIW rather than touching PseudoWinter's open path — mirrors the
        // SHORT-side validation block there and must be kept in sync with it if that logic ever
        // changes.
        async _miwCandidateOpenFeasible(sym, price) {
          if (!sym || !(price > 0)) return false;
          const instr = await this.getInstrInfo(sym);
          if (!instr) return false;
          if (instr.minPrice > 0 && price < instr.minPrice) return false;
          const levResult = this.resolveEffectiveLeverage(sym, instr);
          if (!levResult) return false;
          const lev  = levResult.lev;
          const binary  = this.cfg.binaryModeEnabled;
          const effTp0  = binary ? this.cfg.binaryTpPct : this.cfg.entryTpRoi;
          const notional = this.cfg.minNotional;
          const qty = this.snapQty(notional / price, instr);
          if (qty <= 0) return false;
          const actualNotional = qty * price;
          if (instr.minOrderAmt > 0 && actualNotional < instr.minOrderAmt) return false;
          const tpPrice = this.snapPrice(price * (1 - (effTp0 / 100) / lev), instr); // SHORT: TP below entry
          if (!tpPrice || tpPrice <= 0) return false;
          if (binary) return true;
          const effAddNotional = this.cfg.addNotional;
          const effTpRoi       = [effTp0, this._tpRoi(1)];
          let runNotional = price * qty;
          let runSize     = qty;
          const addPcts = this._activeAddPcts();
          for (let i = 0; i < this._dcaStageCount(); i++) {
            const addPrice = this.snapPrice(price * (1 + addPcts[i] / 100), instr); // SHORT: add above entry
            if (!addPrice || addPrice <= 0) return false;
            const addQty = this.snapQty(effAddNotional / addPrice, instr);
            runNotional += addPrice * addQty;
            runSize     += addQty;
            const expectedAvg = runSize > 0 ? runNotional / runSize : addPrice;
            const addTp = this.snapPrice(expectedAvg * (1 - (effTpRoi[i+1] / 100) / lev), instr);
            if (!addTp || addTp <= 0) return false;
          }
          return true;
        },

        // Only meaningful when Co-Qualifying Penalty is on (Permafrost) — otherwise compositeScore
        // is always 0 for both sides and the margin check never clears, so this is a safe no-op.
        // No path restriction on what it can close — cross-strategy, any held position, same as
        // Liquid-Diver's version. The swap is still score-gated, not automatic.
        async _miwTrySubstitute(entryPool, ctx) {
          if (this._miwDefermentState().deferring) return false;
          if (!this.cfg.miwSubstitutionEnabled || !entryPool?.length) return false;
          const now           = Date.now();
          const minAgeMs       = (this.cfg.miwSubstitutionMinAgeMins) * 60000;
          const baseMargin     = (this.cfg.minNotional || 6) / (this.cfg.leverage || 6);
          const marginThreshold = baseMargin * ((this.cfg.miwSubstitutionMarginPct) / 100);

          const eligible = (this.positions || []).filter(p => {
            if ((now - (p.openedAt || 0)) < minAgeMs) return false;
            return true;
          });
          if (!eligible.length) return false;

          // Was comparing an existing position's frozen entry-time _miwCompositeScore
          // against a freshly-scanned candidate's live score — stale-vs-live mismatch.
          // Now recomputes the existing position's score live from its rolling-average
          // criteria (see _pfPositionAvgCriteria/_pfPositionCriteriaSample), same as the
          // candidate's own score is computed fresh each scan.
          const scoreOf = p => p._miw ? this._miwLiveCompositeScore(p) : -Infinity;
          eligible.sort((a, b) => scoreOf(a) - scoreOf(b));
          const worst      = eligible[0];
          const worstScore = scoreOf(worst);
          // Pre-flight the Force-Evaluate top-up + block re-check that _miwOpen runs, before anything is closed: the pool's
          // first-pass veto only saw pre-top-up criteria, so a candidate can still be blocked once top-up appends criteria,
          // and by then worst would already be gone. A blocked candidate falls through to the next one in the pool.
          let best = null;
          for (const cand0 of entryPool) {
            if ((cand0.compositeScore - worstScore) < marginThreshold) break;
            // Ranked on stored readings, so refetch and rescore before this candidate can displace a held position.
            let cand = cand0;
            if (ctx) {
              cand = await this._miwVerify(cand0, ctx);
              if (cand === false) break;
              if (!cand || (cand.compositeScore - worstScore) < marginThreshold) continue;
            }
            if (this.cfg.miwForceGeneralCriteria && this.cfg.miwAutoSlots) {
              const full = await this._miwTopUpGeneralCriteria(cand.t, cand.criteria);
              const ann  = (full || []).map(c => this._miwAnnotateCritRaw(c, cand.t) ?? (c + '+0'));
              if (this._miwIsEntryBlocked(ann)) {
                this.log(`[MIW] 🔁 Substitution skipped ${cand.t.symbol} — blocked once general criteria were topped up`, 'info');
                continue;
              }
              best = { ...cand, criteria: full };
            } else best = cand;
            break;
          }
          if (!best) return false;
          const _candPrice = parseFloat(best.t.lastPrice || 0);
          if (!(await this._miwCandidateOpenFeasible(best.t.symbol, _candPrice))) {
            this.log(`[MIW] 🔁 Substitution skipped — ${best.t.symbol} would fail open-time checks (tick precision/notional/leverage) at ${_candPrice} — leaving ${worst.symbol} in place`, 'warn');
            return false;
          }

          this.log(`[MIW] 🔁 Substitution — closing ${worst.symbol} (score ${worstScore === -Infinity ? 'n/a' : worstScore.toFixed(4)}) for ${best.t.symbol} (score ${best.compositeScore.toFixed(4)}), Δ${(best.compositeScore - worstScore).toFixed(4)} ≥ ${marginThreshold.toFixed(4)} margin`, 'info');

        },

        _extraStatusPills() {
          const d = this._miwDefermentState();
          if (!d.deferring) return [];
          return [{
            pip:        'warn',
            pipStyle:   'background:rgba(255,160,0,.9)',
            label:      'No Entry',
            labelStyle: 'color:rgba(255,160,0,.9)',
            border:     'border-color:rgba(255,160,0,.45);background:rgba(255,160,0,.06)',
            title:      (d.weatherNeg != null ? `MIW deferment — new entries blocked (scorecard headline ${d.weatherNeg.toFixed(3)} < 0)` : d.bothRed ? `MIW deferment — new entries blocked (both poles of ${d.bothRed} are red)` : `MIW deferment — new entries blocked (scorecard: lowest resolved target ${d.low.toFixed(1)}% < min entry TP ${d.minTp}%)`) + (d.eject ? ' · ejecting all positions' : ''),
            action:     null,
          }];
        },

        // Target Halving — resolves this moment's targets from the Sample Scorer's relative headline S (signed favorable
        // share of raw move, see _pfSampleWeather) against the recorded peak of S: factor = clamp(S / peak, 0, 1),
        // i.e. S at the peak -> the configured targets in full, S at an even share or below -> zero (a peak <= 0 -> zero). The configured Cascade %,
        // Sacrifice % and entry TP are therefore ceilings. Returns the configured targets untouched (active:false) when
        // Target Halving is off, Sample Scoring is off, or the scorecard has no usable value or peak yet — callers then behave
        // exactly as before (and Deferment's floor path is off).
        _miwTargets() {
          const baseTp = Number(this.cfg.binaryModeEnabled ? (this.cfg.binaryTpPct ?? 18) : this.cfg.entryTpRoi) || 18;
          const out = { active: false, factor: 1, slPct: null, entryTp: baseTp, cascadePct: this.cfg.miwCascadePct, sacrificePct: this.cfg.miwSacrificePct, minTp: Math.max(0, Number(this.cfg.miwMinEntryTp) || 0), wx: null };
          if (!this.cfg.miwTargetHalvingEnabled || !(this.cfg.miwCascadeEnabled || this.cfg.miwSacrificeEnabled) || !this.cfg.pfSampleScoringEnabled) return out;
          if (typeof this._pfSampleWeather !== 'function' || typeof this._pfLukewarmFavoredSide !== 'function') return out;
          const wx = this._pfSampleWeather(this._pfLukewarmFavoredSide());
          if (!wx || wx.s == null || wx.sHi == null) return out;
          const f = wx.sHi > 0 ? Math.max(0, Math.min(1, wx.s / wx.sHi)) : 0;

          out.entryTp = baseTp * f;

          const baseSl = Number(this.cfg.binaryModeEnabled ? (this.cfg.binarySlPct ?? 18) : (this.cfg.dcaSlPct ?? 16)) || 16;
          out.slPct = Math.max(1, baseSl * f);
          out.cascadePct = this.cfg.miwCascadePct * f;
          out.sacrificePct = this.cfg.miwSacrificePct * f;
          return out;
        },
        // What Cascade / Sacrifice actually fire at: the resolved value, but never below the Min Entry TP floor (and never
        // under 1%) — a target at ~0 would bail everything on the first non-negative / slightly negative tick.
        _miwEffCascadePct() { const t = this._miwTargets(); return t.active ? Math.max(t.minTp, 1, t.cascadePct) : this.cfg.miwCascadePct; },
        _miwEffSacrificePct() { const t = this._miwTargets(); return t.active ? Math.max(t.minTp, 1, t.sacrificePct) : this.cfg.miwSacrificePct; },
        // One-line readout for the Exit tab.
        _miwTargetsText() {
          if (!this.cfg.miwTargetHalvingEnabled || !(this.cfg.miwCascadeEnabled || this.cfg.miwSacrificeEnabled)) return '';
          if (!this.cfg.pfSampleScoringEnabled) return 'Inactive — turn Sample Scoring on (Permafrost) to feed it.';
          const t = this._miwTargets();
          if (!t.active) return 'Waiting for a scorecard value and peak (needs 10+ samples carrying a raw move).';
          const low = Math.min(t.entryTp, this.cfg.miwCascadeEnabled ? t.cascadePct : Infinity);
          return `Now: share ${(t.wx.share * 100).toFixed(1)}% (×${t.factor.toFixed(2)}) · entry TP ${t.entryTp.toFixed(1)}% · SL ${t.slPct.toFixed(1)}% · cascade ${t.cascadePct.toFixed(1)}% · sacrifice ${t.sacrificePct.toFixed(1)}%` + (low < t.minTp ? ' — below floor: deferring' : '');
        },

        // Deferment — regime proxy. Defers (no new entries) while the Sample Scorer headline is negative; the Target Halving
        // floor is its own separate stop. Both need Sample Scoring.
        // eject: two or more deferment paths in effect at once -> Ejection bails every open position.
        // Both-poles-red: the first criterion (dial family) whose + and - poles are BOTH proven and negative on the
        // scorecard side the chart shows (same favored side as Target Halving). No entry pole to favor = no good entry.
        _miwBothPolesRed() {
          if (typeof this._pfLukewarmFavoredSide !== 'function') return null;
          const list = (this.pfLukewarmScoreboard || {})[this._pfLukewarmFavoredSide()] || [];
          const min = Math.max(3, this.cfg.pfExtremityMinSamples || 3);
          const by = {};
          for (const e of list) if (e && e.pnl < 0 && !(typeof e.n === 'number' && e.n < min)) (by[e.family] ||= {})[e.pole] = true;
          for (const [fam, p] of Object.entries(by)) if (p.pos && p.neg) return fam;
          return null;
        },
        // The Sample Scorer headline when it is negative (else null) — same value/side the gauge shows. Needs Sample Scoring.
        _miwWeatherNeg() {
          if (!this.cfg.pfSampleScoringEnabled || typeof this._pfSampleWeather !== 'function' || typeof this._pfLukewarmFavoredSide !== 'function') return null;
          const wx = this._pfSampleWeather(this._pfLukewarmFavoredSide());
          return (wx && wx.value != null && wx.value < 0) ? wx.value : null;
        },
        _miwDefermentState() {
          const base = this._miwDefermentStateBase();
          // Every deferment path is evaluated on its own; two or more in effect at once = Ejection (bail-all).
          // Display priority is unchanged: negative headline, then both poles red, then the base reason.
          const wn = this.cfg.miwDefermentEnabled ? this._miwWeatherNeg() : null;
          const fam = (this.cfg.miwDefermentEnabled && this.cfg.miwDeferBothRedEnabled) ? this._miwBothPolesRed() : null;
          const why = [];
          if (wn != null) why.push('negative headline');
          if (fam) why.push(`both poles of ${fam} red`);
          if (base.deferring) why.push('target under min entry TP');
          if (!why.length) return base;
          return Object.assign({}, base, { deferring: true, eject: why.length >= 2, why }, wn != null ? { weatherNeg: wn } : {}, fam ? { bothRed: fam } : {});
        },
        _miwDefermentStateBase() {
          const off = { deferring: false, eject: false };
          // Target Halving (scorecard) mode — whenever it has a usable scorecard value: defer while
          // the resolved entry TP, or the resolved Cascade target (if Cascade is on), is under the Min Entry TP floor.
          // Independent of the Deferment toggle itself (the floor is Target Halving's own stop).
          const tg = this._miwTargets();
          if (tg.active) {
            const low = Math.min(tg.entryTp, this.cfg.miwCascadeEnabled ? tg.cascadePct : Infinity);
            if (!(low < tg.minTp)) return off;
            return { deferring: true, eject: false, scorecard: true, low, minTp: tg.minTp, wx: tg.wx };

          return off;
        },

        // Ejection: bail-all — closes every open position (any held position, same reach as substitution) as soon as
        // two or more deferment paths are in effect at once. Called once per scan.
        async _miwEject(def) {
          const cands = (this.positions || []).filter(p => !p.isPending);
          if (!cands.length) return;
          this.log(`[MIW] ⏏️ Ejection — ${def.why.length} deferment paths in effect (${def.why.join(' + ')}); closing all ${cands.length} position${cands.length === 1 ? '' : 's'}`, 'warn');
          for (const p of cands) {
            try { await this.pseudoClosePosition(p, 'ejection'); }
            catch (e) { this.log(`[MIW] ⏏️ Ejection error (${p.symbol}): ${e.message}`, 'warn'); }
          }
        },


        // ── Scan stages (MIW) ────────────────────────────────────────────────────
        // The old single _miwRunScan, cut at its natural seams. Stages hand data forward on
        // ctx.miw; a stage returning false ends the miw group for this scan (the old early `return`s).
        // Registered with the host's scan pipeline from the bottom of transform(); on a host without
        // the pipeline _miwRunScan below runs them back to back from the runScan wrap.
        async _miwScanPrep(ctx) {
          if (!this.cfg.miwEnabled) return false;
          const _miwHalted = !!(this._isDrawdownHalted?.() || this._isGainsLocked?.());
          if (_miwHalted) {
            if (!this._miwHaltLogged) { this.log(`[MIW] 💡 Halted — ${this._isGainsLocked?.() ? 'gains lock' : 'drawdown halt'} active; hist scoring continues`, 'info'); this._miwHaltLogged = true; }
          } else {
            this._miwHaltLogged = false;
          }

          const allTickers = this._lastAllTickers || [];
          if (!allTickers.length) return false;

          // Rebuild block state from Extremity Scorer immediately before any slot or pool decisions
          this._pfExtremityBuild?.();
          this._schIdleCancel?.('pf-build'); // this rebuild supersedes the one PF queued for scan end

          // Open-Position Rolling-Average Criteria refresh (see Permafrost-Winter's
          // _pfPositionCriteriaSample, which does its own fresh per-symbol fetch — the bulk
          // allTickers list is only the universe and can be hours old) — runs every cycle regardless of
          // whether any entry slot is active, since positions can still be open with none
          // configured. Only ever touches the handful of currently-open symbols, so it isn't
          // gated behind the follower no-own-fetch rule the rest of this scan is subject to.
          if (this.positions?.length) {
            for (const pos of this.positions) {
              await this._pfPositionCriteriaSample?.(pos);
            }
          }

          // Deferment/Ejection — every cycle, ahead of any slot logic so it still runs with no
          // active entry slots. Ejection (bail-all) fires when two or more deferment paths are in effect.
          const _miwDef = this._miwDefermentState();
          if (!_miwDef.deferring) this._miwDeferLogged = false;
          else if (_miwDef.eject) await this._miwEject(_miwDef);

          // Entry slots — Auto mode has no generated slot list any more (see _miwAutoQualify);
          // Manual mode keeps its exact combo list as before.
          const autoMode = !!this.cfg.miwAutoSlots;
          const slots = autoMode ? [] : this._miwEffectiveSlots();
          const hasActiveEntry = autoMode ? this._miwAutoActive() : slots.length > 0;

          if (!hasActiveEntry) {
            this.log('[MIW] 💡 No active slots — skipping', 'info');
            return false;
          }

          const activeSyms  = new Set((this.positions || []).map(p => p.symbol));

          // Criteria pool to scan for data-fetch needs — Auto's non-excluded secondary list, or
          // every criterion actually used across manual slots.
          const _critPool = autoMode
            ? SECONDARY_CRITS.filter(c => !(new Set(this.cfg.miwAutoSlotExclude || [])).has(c))
            : [...new Set(slots.flat())];
          const needsVolIo = _critPool.some(c => /^(va|ioa)/.test(c));
          const needsOc    = _critPool.some(c => /^(ocs|ocx)/.test(c));
          const needsHr    = _critPool.some(c => /^(lta|lpa)/.test(c));
          const scanSkip = {
            excluded: { nonUsdt: 0, btc: 0, lowPrice: 0, active: 0, banned: 0, reentry: 0, },
            unmatched: { criteria: 0 },
            blocked: 0
          };
          const basePool = [];
          for (const t of allTickers) {
            if (!t?.symbol?.endsWith('USDT')) { scanSkip.excluded.nonUsdt++; continue; }
            if ((this.cfg.megacapExclude || DEFAULT_MEGACAP_EXCLUDE).includes(t.symbol)) { scanSkip.excluded.btc++; continue; }
            if (parseFloat(t.lastPrice || 0) < 0.001) { scanSkip.excluded.lowPrice++; continue; }
            if (activeSyms.has(t.symbol)) { scanSkip.excluded.active++; continue; }
            if (this._isSymbolBanned?.(t.symbol)) { scanSkip.excluded.banned++; continue; }
            if (this._miwIsReentryBlocked(t.symbol)) { scanSkip.excluded.reentry++; continue; }
            basePool.push(t);
          };

          ctx.miw = { halted: _miwHalted, allTickers, def: _miwDef, autoMode, slots, needsVolIo, needsOc, needsHr, scanSkip, basePool };
        },
        async _miwScanFetch(ctx) {
          const { needsOc, needsHr, basePool } = ctx.miw;
          // Criteria data is fetched fresh, per ticker, for a random batch each scan — the bulk list only says what exists.
          // The batch is the unbiased sample that feeds scoring; entry candidates are ranked off every ticker's latest stored
          // reading, any age, and refetched right before entry (_miwVerify). A follower seeds the leader's batch instead.
          const cap = Math.max(1, Math.min(2500, Math.round(Number(this.cfg.pfOcBatchSize) || 250)));
          let fillSyms = basePool.map(t => t.symbol);
          for (let i = fillSyms.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [fillSyms[i], fillSyms[j]] = [fillSyms[j], fillSyms[i]];
          }
          // Concentration (AF/PF 2.1.0+): re-sampled movers go first, the shuffled randoms fill the rest.
          const conc = this._pfConcPick?.(fillSyms, cap) || [];
          if (conc.length) { const cs = new Set(conc); fillSyms = [...conc, ...fillSyms.filter(x => !cs.has(x))]; }
          await this._ocFetchBatch(fillSyms.slice(0, cap), null, needsOc, needsHr);
          const ocResults = this.pfOcResults || {};
          const freshAt = this._pfOcResultsAt || 0;
          // Same batch as last scan (fetch skipped or failed, or the leader hasn't published a new one): nothing new to act on.
          if (!freshAt || freshAt === this._miwLastActedAt) return false;
          this._miwLastActedAt = freshAt;
          // Ranking pool: every non-excluded ticker with a stored per-ticker reading, any age. A batch ticker keeps its fresh
          // payload; the rest are rebuilt from their latest stored reading. Never-sampled tickers have nothing to rank on.
          const latest = this._pfLatestReadings?.() || {};
          const rankPool = [], rankOc = {};
          for (const bt of basePool) {
            const sym = bt.symbol, hit = latest[sym], live = ocResults[sym];
            if (!hit && !live) continue;
            const t = live ? (this._pfFreshTicker?.(sym) || this._pfSynthTicker?.(sym, live)) : this._pfSynthStored?.(sym, hit.rec, hit.ts);
            if (!t) continue;
            rankPool.push(t); rankOc[sym] = live || hit.rec;
          }
          ctx.miw.ocResults = rankOc; ctx.miw.freshAt = freshAt; ctx.miw.basePool = rankPool;
          ctx.miw.batchSyms = new Set(Object.keys(ocResults)); ctx.miw.verifyLeft = cap;
        },
        async _miwScanPool(ctx) {
          const { allTickers, freshAt, autoMode, slots, scanSkip, basePool } = ctx.miw;
          const _pfOcResults = ctx.miw.ocResults;

          const checkCrit = (c, fr, t) => this._miwCheckCrit(c, fr, t, _pfOcResults);

          // Build pool before capacity check so historical matches are logged regardless
          const _coQualEnabled = this.cfg.pfCoQualPenaltyEnabled;
          const _cqRanks = _coQualEnabled ? (this.miwCollapsedSlotRanks || {}) : null;
          const _cqScaledRank = (rawC, annotC) => this._miwScaledRank(rawC, annotC, _cqRanks);
          // Wraps the raw annotation so every criterion reading produced during this scan's
          // pool building feeds the Extremity Scorer's sample pool (see _pfDialSample) —
          // regardless of whether this ticker ends up matching a slot or opening a trade.
          // Cutoffs need to be provable from the wide stream of what's actually out there,
          // not just from the narrow trickle of closed trades.
          const _miwAnnotateCrit = (c, t) => {
            const tag = _miwAnnotateCritRaw(c, t);
            this._pfDialSample?.(tag);
            return tag;
          };
          // Delegates to the class-level _miwAnnotateCritRaw (also called by Permafrost's open-position
          // sampler, which reads it off `this`). Only lta/lpa can come back null (no 1hr candle yet) —
          // by the time a criterion reaches here checkCrit already passed, so fall back to a neutral tier.
          const _miwAnnotateCritRaw = (c, t) => this._miwAnnotateCritRaw(c, t) ?? (c + '+0');
          // Richness score for sort priority when Co-Qual is off — sum of each matched
          // criterion's own collapsed rank, so capacity still favors historically-stronger
          // tickers even without Co-Qual scoring turned on.
          const _richness = e => e.criteria.reduce((s, c) => s + this._miwCritScore(c), 0);
          const _poolOne = (t, ocMap = _pfOcResults, sample = true) => {
              const checkCrit = (c, fr, tt) => this._miwCheckCrit(c, fr, tt, ocMap);
              const _ann = sample ? _miwAnnotateCrit : _miwAnnotateCritRaw; // only the fresh random batch feeds the Extremity sample pool
              const fr       = parseFloat(t.fundingRate || 0) * 100;
              const critOk = c => checkCrit(c, fr, t);

              let matched = null; // { criteria, annotCrits, slotIdx }
              if (autoMode) {
                const m = this._miwAutoQualify(critOk, c => _ann(c, t));
                if (m) matched = { ...m, slotIdx: -1 };
              } else {
                const slotIdx = slots.findIndex(s => s.length > 0 && s.every(c => checkCrit(c, fr, t)));
                if (slotIdx !== -1) {

                    annotCrits: _slotCrits.map(c => _ann(c, t)),

                  // directly (positives and negatives together) rather than hunting for
                  // "other matching combos" to penalize. There's only one canonical match
                  // set per ticker now, so a separate penalty pass would be redundant.
                  compositeScore = matched.criteria.reduce((s, c, i) => s + _cqScaledRank(c, _annotCrits[i]), 0);
                } else {
                  const bestScore = matched.criteria.reduce((s, c, i) => s + _cqScaledRank(c, _annotCrits[i]), 0);
                  let penalty = 0;
                  for (let i = 0; i < slots.length; i++) {
                    if (i === matched.slotIdx) continue;
                    if (!slots[i].length || !slots[i].every(c => checkCrit(c, fr, t))) continue;
                    const otherAnnot = slots[i].map(c => _ann(c, t));

          const pool = _pooled
            .sort((a, b) => _coQualEnabled

              : (_richness(b) - _richness(a) || Math.abs(parseFloat(b.t.fundingRate || 0)) - Math.abs(parseFloat(a.t.fundingRate || 0))));

          // data it needs to recover (see _miwIsEntryBlocked) — it only stops the real open.

            return !blocked;
          });
          const _miwTopReasons = obj => Object.entries(obj).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([k, n]) => `${k}:${n}`).join(' ');
          const _miwExcludedNote = _miwTopReasons(scanSkip.excluded) || 'none';
          const _miwUnmatchedNote = _miwTopReasons(scanSkip.unmatched) || 'none';
          this.log(`[MIW] 💡 Scan skip summary — universe:${allTickers.length} pool:${basePool.length} qualified:${pool.length} entry:${entryPool.length} | excluded ${_miwExcludedNote} | unmatched ${_miwUnmatchedNote} | vetoed:${scanSkip.blocked}`, 'info');
          if (this._miwPoleBlockNotes?.size) { this.log(`[MIW] 🚧 Pole Blocking — ${[...this._miwPoleBlockNotes].join(', ')}`, 'info'); this._miwPoleBlockNotes.clear(); }

        },
        async _miwScanEntry(ctx) {
          const { halted: _miwHalted, def: _miwDef, allTickers, freshAt, slots, needsVolIo, needsHr, scanSkip, basePool, pool, entryPool } = ctx.miw;
          if (_miwHalted) return;

          if (_miwDef.deferring) {
            if (!this._miwDeferLogged) { this.log(_miwDef.weatherNeg != null ? `[MIW] ⛔ Deferment — scorecard headline is negative (${_miwDef.weatherNeg.toFixed(3)}); no new entries until it turns positive` : _miwDef.bothRed ? `[MIW] ⛔ Deferment — both poles of ${_miwDef.bothRed} are red on the scorecard; no new entries until one turns` : `[MIW] ⛔ Deferment — scorecard resolves a ${_miwDef.low.toFixed(1)}% target, under the ${_miwDef.minTp}% min entry TP (weather ${_miwDef.wx.value >= 0 ? '+' : '-'}$${Math.abs(_miwDef.wx.value).toFixed(3)}); no new entries until it recovers`, 'info'); this._miwDeferLogged = true; }

          }

          // alone doesn't reflect that in-flight slot, so both paths would see room and open,
          // overshooting maxPos. _miwPending is incremented the instant an open is committed to

          }

          let headroom = this.cfg.maxPos - (this.positions?.length ?? 0) - _miwInFlight;
          if (this.cfg.miwShareCapEnabled) {
            const capSlots = Math.max(1, Math.floor(this.cfg.maxPos * ((this.cfg.miwShareCapPct) / 100)));
            const miwCount = (this.positions || []).filter(p => p._miw).length;
            headroom = Math.min(headroom, capSlots - miwCount);
            if (headroom < 1) {
