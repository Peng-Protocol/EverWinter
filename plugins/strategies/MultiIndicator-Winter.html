<!--
  Multi-Indicator Strategy Plugin for PseudoWinter
  Slot-based entry filter. A slot (Auto-generated or manually built) qualifies once a ticker
  exhibits at least miwAutoSlotSize (Auto) or all of its own criteria (manual) from the
  secondary criteria set: fund, V/A, IO/A, OCS, OCX. No criterion is mandatory — this was
  liquidation-anchored in earlier versions (every slot required a real-time liquidation
  criterion), but that was an addition along the way, not the original design; v1.80.0 (see
  /versioning) removed liquidation, PEC, VSG, and Regime from the bot entirely, along with the
  live-message entry path, the closed-batch liq/Past-1 reads, and PEC/VSG's own kline-fetch
  pipeline.

  Slot Blocking (miwSlotBlockEnabled) is a per-criterion loss circuit breaker: if a criterion's
  collapsed scorecard score (own + partner, see miwCollapsedSlotRanks) drops beyond
  miwSlotBlockPct% of base margin in loss, new entries carrying that criterion are blocked —
  continuously re-checked, no manual clear needed. miwSlotBlockTags opts individual secondary
  criteria into this (see the Blockable Criteria picker); va/ioa/ocs/ocx are opted in by
  default (DEFAULT_BLOCKABLE_CRITS), fund is not.

  Auto Slots evaluates every non-excluded secondary criterion against each ticker and keeps
  every one that's true — not sliced down to a fixed count. Manual slots keep the existing
  criteria picker, an exact AND-gate of whatever's selected.

  Substitution considers any held position in the book, not just MIW's own, same as
  Liquid-Diver did — score-gated, not automatic.

  Re-entry Block Mode (miwReentryBlockMode: 'both' / 'losers') is ported from Liquid-Diver:
  'losers' lets a symbol that just closed in profit re-trigger immediately.

  Entry pool fires once per fresh bulk ticker fetch (_lastAllTickersAt) — will not re-scan
  the same cached snapshot twice. TP, SL, and all exit logic use the host's settings.
  Drawdown throttle and gains lock gate all entries.

  Load via Plugin Manager in PseudoWinter's config panel.
  Load AFTER EverWinter if using live trading — see README Plugin Stack Order.
  targetBot: pseudowinter
-->
<script>
(function () {
  'use strict';

    const VERSION       = '1.80.2'; // Default-sync pass against MIC: miwActiveSlot 5→6 (was mismatched at the code-default level, not just live config — now matches MIC), miwCascadePct 25→50, miwSacrificePct 25→50, miwSlotBlockEnabled true→false, miwSlotBlockTags false→true (all matching live-tuned values), miwSubstitutionMinAgeMins confirmed at 10 to match MIC; DEFAULT_SLOTS []→[[]] (single empty slot, matching current usage on both sides). Prior: Housekeeping: Blockable Criteria default was documented as "nothing" in the header, the UI hint and _miwIsEntryBlocked's comment, but DEFAULT_BLOCKABLE_CRITS seeds va/ioa/ocs/ocx — text corrected, no behavior change.
    // v1.80.0 — Major cut-down (see /versioning): liquidation is no longer the mandatory per-slot anchor — PEC/VSG shape-matching, the live liq-message entry path, closed-batch liq/regime/Past-1 reads, and the whole liq-anchor concept are gone. Slots (Auto or manual) now qualify on any N of the 5 remaining secondary criteria alone: fund, V/A, IO/A, OCS, OCX.
  const DEFAULT_SLOTS = [[]];
  const MIW_HIST_KEY  = '__miw_hist_batches';
  // Full secondary criteria list — shared by Auto's minimum-gate qualifier, the Exclude-from-
  // Auto picker, and the Blockable Criteria picker, so all three stay in sync by construction.
  const SECONDARY_CRITS = ['fund','va','ioa','ocs','ocx'];
  // Pre-existing "Include Sign Tags" behavior, preserved as the default selection now that the
  // set is configurable — fund is deliberately NOT included by default (see _miwIsEntryBlocked),
  // matching the old hardcoded behavior exactly. Opt fund in manually via the picker.
  // va/ioa are blockable by default (unlike the vm/iot/iom they replace, which never were) —
  // population-relative criteria are a much cleaner signal than the old own-ratio ones.
  const DEFAULT_BLOCKABLE_CRITS = ['va','ioa','ocs','ocx'];

  // Megacaps excluded from the population pool alongside BTC — their size skews OC/IO/Volume/liq
  // averages the same way BTC would. cfg.megacapExclude is seeded from this default below but is
  // a plain array on cfg (no picker UI) — edit it directly in saved config if the list needs to
  // change. Shared key name with Permafrost's own seed so either plugin can init it first.
  const DEFAULT_MEGACAP_EXCLUDE = ['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT','DOGEUSDT','ADAUSDT','TRXUSDT','LINKUSDT'];
  // Single source of truth for MIW's own scalar config defaults. Merged into cfg once during
  // init() (see below) — call sites read this.cfg.<key> directly, no inline `?? literal`.
  // Excludes: megacapExclude/miwSlots/miwSlotBlockCriteria (arrays with their own migration
  // logic in init()), and any key actually owned by the Permafrost sibling plugin (those keep
  // their defensive `?? literal` at the cross-read call site since Permafrost owns their default).
  const MIW_DEFAULT_CFG = Object.freeze({
    miwEnabled: true,
    miwPicks: 5,
    miwFrThreshold: 0.1,
    miwShareCapEnabled: true,
    miwShareCapPct: 100,
    miwActiveSlot: 6,
    miwCascadeEnabled: true,
    miwCascadePct: 50,
    miwSacrificeEnabled: true,
    miwSacrificePct: 50,
    miwSubstitutionEnabled: true,
    miwSubstitutionMarginPct: 5,
    miwSubstitutionMinAgeMins: 10,
    miwSlotBlockEnabled: false,
    miwSlotBlockPct: 25,
    miwSlotBlockTags: true,
    miwDeadSwitchEnabled: false,
    miwDeadSwitchHours: 1,
    miwReentryBlockMode: 'both',
    miwAutoSlots: true,
    miwAutoSlotSize: 3,
    miwAutoSlotExclude: [],
    miwForceGeneralCriteria: true,
    miwFundStep: 0.25,
    miwVaStep: 1,
    miwIoaStep: 1,
    miwOcsStep: 1,
    miwOcxStep: 1,
  });

  // Per-criterion emoji for position badges. Fund emoji is app-relative:
  // +fund = longs paying = good carry for shorts (🤑), bad for longs (💸).
  // -fund = shorts paying = bad for shorts (💸), good for longs (🤑).
  const CRIT_EMOJI = { 'fund': '💰', 'va': '🔊', 'vm': '🔊', 'ioa': '🎲', 'iot': '🎲', 'iom': '🧲', 'ocs': '🔭', 'ocx': '📡' };
  const CRIT_DESC  = { 'fund': 'Fund (tiered funding rate)', 'va': 'V/A (volume vs. population sample-window average)', 'vm': 'V/M (vol/mcap ratio) — retired, replaced by V/A', 'ioa': 'IO/A (open interest vs. population sample-window average)', 'iot': 'IO/T (OI vs Turnover) — retired, replaced by IO/A', 'iom': 'IO/M (OI vs MCap) — retired, replaced by IO/A', 'ocs': 'OCS (buy/sell skew %)', 'ocx': 'OCX (% faster/slower than the full-window avg order interval)' };
  // PEC, VSG, liquidation anchors (S-Liq/B-Liq/mS-Liq/mB-Liq/0-Liq/Past-1), and Regime were all
  // retired in v1.80.0 (see /versioning) — liquidation is no longer fetched or required at all,
  // and PEC/VSG's kline-shape-matching pipeline went with it. Slots now qualify on any N of the
  // 5 remaining secondary criteria (fund, V/A, IO/A, OCS, OCX) alone — see _miwAutoQualify.

  const critEmoji = c => {
    if (/^fund/.test(c)) { const s = c.slice(4); const num = parseFloat(s.replace(/^[<>]/,'')); return (num < 0 ? '💸' : '🤑') + s; }
    if (/^va/.test(c)) return '🔊' + c.slice(2);
    if (/^vm/.test(c)) return '🔊' + c.slice(2);
    // Retired (see VSG.md) — kept resolvable so old scorecard/history entries still render.
    if (/^lsa/.test(c)) return '🟥' + c.slice(3);
    if (/^lba/.test(c)) return '🟩' + c.slice(3);
    if (/^rasl/.test(c)) return '🔴' + c.slice(4);
    if (/^rabl/.test(c)) return '🟢' + c.slice(4);
    if (/^msliq/.test(c)) return '💦' + c.slice(5);
    if (/^mbliq/.test(c)) return '🧊' + c.slice(5);
    if (/^sliq/.test(c)) return '🥵' + c.slice(4);
    if (/^bliq/.test(c)) return '🥶' + c.slice(4);
    if (/^ioa/.test(c)) return '🎲' + c.slice(3);
    if (/^iot/.test(c)) return '🎲' + c.slice(3);
    if (/^iom/.test(c)) return '🧲' + c.slice(3);
    if (/^ocs/.test(c)) return '🔭' + c.slice(3);
    if (/^ocx/.test(c)) return '📡' + c.slice(3);
    if (/^liqturnover/.test(c)) return '🌊' + c.slice(11);
    if (/^liqquiet/.test(c)) return '🤫' + c.slice(8);
    if (/^pec/.test(c)) { const m = c.match(/^(pec[a-z]+)/); return (CRIT_EMOJI[m ? m[1] : c] || '') + c.replace(/^pec[a-z]+/, ''); }
    if (/^vsg/.test(c)) { const m = c.match(/^(vsg[a-z]+)/); return (CRIT_EMOJI[m ? m[1] : c] || '') + c.replace(/^vsg[a-z]+/, ''); }
    if (/^regime/.test(c)) { const m = c.match(/^(regime[a-z]+)/); return (CRIT_EMOJI[m ? m[1] : c] || '') + c.replace(/^regime[a-z]+/, ''); }
    return CRIT_EMOJI[c] || '';
  };
  const critLabel = c => {
    const fM = c.match(/^fund([<>])(-?\d+)$/);
    if (fM) return 'Fund ' + fM[1] + fM[2];
    const fA = c.match(/^fund([+-]-?\d*)$/);
    if (fA) return 'Fund t' + fA[1];
    if (c === 'fund') return 'Fund';
    const aM = c.match(/^va([<>])(-?\d+)$/);
    if (aM) return 'V/A ' + aM[1] + aM[2];
    const aA = c.match(/^va([+-]-?\d*)$/);
    if (aA) return 'V/A t' + aA[1];
    if (c === 'va') return 'V/A';
    const vM = c.match(/^vm([<>])(\d+)$/);
    if (vM) return 'V/M ' + vM[1] + vM[2];
    const vA = c.match(/^vm([+-]\d+)$/);
    if (vA) return 'V/M t' + vA[1];
    if (c === 'vm') return 'V/M';
    // Retired (see VSG.md) — kept resolvable so old scorecard/history entries and any
    // not-yet-migrated saved slots still render instead of falling through to the raw tag.
    const kM = c.match(/^(lsa|lba|rasl|rabl)([<>])(\d+)$/);
    if (kM) return kM[1].toUpperCase().replace('RASL','R-ASL').replace('RABL','R-ABL') + ' ' + kM[2] + kM[3];
    const kA = c.match(/^(lsa|lba|rasl|rabl)([+-]\d+)$/);
    if (kA) return kA[1].toUpperCase().replace('RASL','R-ASL').replace('RABL','R-ABL') + ' t' + kA[2];
    if (c === 'lsa') return 'LSA'; if (c === 'lba') return 'LBA';
    if (c === 'rasl') return 'R-ASL'; if (c === 'rabl') return 'R-ABL';
    const m = c.match(/^(m?sliq|m?bliq)([<>])([+-]?\d+)$/);
    if (m) return (m[1] === 'sliq' ? 'S-Liq' : m[1] === 'bliq' ? 'B-Liq' : m[1] === 'msliq' ? 'mS-Liq' : 'mB-Liq') + ' ' + m[2] + m[3];
    const n = c.match(/^(m?sliq|m?bliq)([+-]\d+)$/);
    if (n) return (n[1] === 'sliq' ? 'S-Liq' : n[1] === 'bliq' ? 'B-Liq' : n[1] === 'msliq' ? 'mS-Liq' : 'mB-Liq') + ' ' + n[2];
    if (c === 'sliq') return 'S-Liq'; if (c === 'bliq') return 'B-Liq';
    if (c === 'msliq') return 'mS-Liq'; if (c === 'mbliq') return 'mB-Liq';
    if (c === '0liq') return '0-Liq';
    const ioaM = c.match(/^ioa([<>])(-?\d+)$/);
    if (ioaM) return 'IO/A ' + ioaM[1] + ioaM[2];
    const ioaA = c.match(/^ioa([+-]-?\d*)$/);
    if (ioaA) return 'IO/A t' + ioaA[1];
    if (c === 'ioa') return 'IO/A';
    const o = c.match(/^(iot|iom)([<>])(\d+)$/);
    if (o) return (o[1] === 'iot' ? 'IO/T' : 'IO/M') + ' ' + o[2] + o[3];
    const p = c.match(/^(iot|iom)([+-]\d+)$/);
    if (p) return (p[1] === 'iot' ? 'IO/T' : 'IO/M') + ' t' + p[2];
    if (c === 'iot') return 'IO/T'; if (c === 'iom') return 'IO/M';
    const oc = c.match(/^(ocs|ocx)([<>])(-?\d+)$/);
    if (oc) return ({'ocs':'OCS','ocx':'OCX'}[oc[1]])+' '+oc[2]+oc[3];
    const ocT = c.match(/^(ocs|ocx)([+-]\d+)$/);
    if (ocT) return ({'ocs':'OCS','ocx':'OCX'}[ocT[1]])+' t'+ocT[2];
    if (c === 'ocs') return 'OCS'; if (c === 'ocx') return 'OCX';
    const PEC_LABEL = { pecob: 'PEC OB', pecos: 'PEC OS', pecalpha: 'PEC Red Mtn', pecdelta: 'PEC Grn Delta', pecmomup: 'PEC Bull-Mom', pecmomdn: 'PEC Bear-Mom', pecirr: 'PEC Irregular' };
    const pM = c.match(/^(pec[a-z]+)([+-]\d+)$/);
    if (pM && PEC_LABEL[pM[1]]) return PEC_LABEL[pM[1]] + ' t' + pM[2];
    if (PEC_LABEL[c]) return PEC_LABEL[c];
    const VSG_LABEL = { vsgot: 'VSG Over-Traded', vsgut: 'VSG Under-Traded', vsgalpha: 'VSG Mountain', vsgdelta: 'VSG Trough', vsgmomup: 'VSG Mom-Up', vsgmomdn: 'VSG Mom-Dn', vsgirr: 'VSG Irregular' };
    const vsgM = c.match(/^(vsg[a-z]+)([+-]\d+)$/);
    if (vsgM && VSG_LABEL[vsgM[1]]) return VSG_LABEL[vsgM[1]] + ' t' + vsgM[2];
    if (VSG_LABEL[c]) return VSG_LABEL[c];
    const REGIME_LABEL = { regimebull: 'Rg Bull', regimebear: 'Rg Bear' };
    const rgM = c.match(/^(regime[a-z]+)([+-]\d+)$/);
    if (rgM && REGIME_LABEL[rgM[1]]) return REGIME_LABEL[rgM[1]] + ' t' + rgM[2];
    if (REGIME_LABEL[c]) return REGIME_LABEL[c];
    return CRIT_DESC[c] || c;
  };

  window.__BotPlugin = {
    id:        'multiindicator-winter',
    name:      'Multi-Indicator (Winter)',
    version:   VERSION,
    targetBot: 'pseudowinter',
    after:     ['everwinter', 'permafrost-winter'],
    before:    [],
    conflicts: ['liquiddiver-winter'],
    requires:  ['permafrost-winter'],
    touches:   ['init', 'runScan', 'pseudoWatchPositions'],

    css: `
      .miw-hint { font-size:9px; color:var(--text-lo); margin-top:3px; line-height:1.5; }
      .miw-slot { display:inline-flex; flex-direction:column; align-items:center; gap:3px; padding:6px 5px; border-radius:3px; border:1px solid; cursor:pointer; min-width:52px; font-size:9px; font-family:var(--mono); text-align:center; transition:border-color .15s,background .15s; }
      .miw-crit { font-size:8px; padding:1px 4px; border-radius:2px; background:rgba(96,210,255,.12); border:1px solid rgba(96,210,255,.3); color:var(--ice); white-space:nowrap; }
      .miw-opt { padding:5px 7px; font-size:9px; font-family:var(--mono); border-radius:2px; border:1px solid; cursor:pointer; background:none; transition:border-color .12s,background .12s,color .12s; }
      .miw-tabs { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:2px; }
      .miw-tab { font-family:var(--mono); font-size:9px; padding:3px 9px; border-radius:2px; border:1px solid; cursor:pointer; background:none; transition:border-color .12s,color .12s,background .12s; letter-spacing:.5px; }
      .miw-tab.on { border-color:rgba(96,210,255,.6); color:var(--ice); background:rgba(96,210,255,.08); }
      .miw-tab:not(.on) { border-color:rgba(255,255,255,.15); color:var(--text-lo); }
      .miw-zone { margin-top:8px; padding:8px; background:rgba(255,255,255,.02); border:1px solid rgba(255,255,255,.06); border-radius:3px; }
    `,

    slots: {
      'mode-label-extra': `<span x-show="cfg.miwEnabled"> + Multi</span>`,
      'strategy-accordions': `
        <div x-data="{ open: false, tE: false, tX: false, tFe: false }">
          <button class="cfg-acc-hd" @click="open=!open" :class="open?'open':''">
            <div style="display:flex;align-items:center;gap:7px">
              <span>❄ Multi-Indicator</span>
              <span x-show="cfg.miwEnabled" style="font-size:8px;padding:1px 5px;background:rgba(96,210,255,.15);border:1px solid rgba(96,210,255,.3);border-radius:2px;color:var(--ice);letter-spacing:1px">ON</span>
              <span x-show="!cfg.miwEnabled" style="font-size:8px;padding:1px 5px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:2px;color:var(--text-lo);letter-spacing:1px">OFF</span>
            </div>
            <span class="cfg-acc-arrow" :class="open?'open':''">▶</span>
          </button>
          <div x-show="open" x-transition.opacity class="cfg-acc-body">
            <label class="tog">
              <div class="tog-t" :class="cfg.miwEnabled?'on':''" @click.prevent="if(!cfgLocked){cfg.miwEnabled=!cfg.miwEnabled;persist()}"><div class="tog-k"></div></div>
              <div>
                <div class="tog-l">Multi-Indicator Mode</div>
                <div class="miw-hint">Shorts tickers matching any active entry slot; fires once per bulk ticker fetch using host TP/SL settings.</div>
              </div>
            </label>
            <div x-show="cfg.miwEnabled" style="margin-top:8px">
              <div class="miw-tabs">
                <button class="miw-tab" :class="tE?'on':''" @click="tE=!tE">ENTRY</button>
                <button class="miw-tab" :class="tX?'on':''" @click="tX=!tX">EXIT</button>
                <button class="miw-tab" :class="tFe?'on':''" @click="tFe=!tFe">FETCH</button>
              </div>

              <!-- Entry Zone -->
              <div class="miw-zone" x-show="tE">
                <!-- Entry Slots -->
                <div>
                  <div style="margin-bottom:6px">
                    <div class="lbl" style="margin-bottom:4px">Entry Slots</div>
                    <label class="tog" style="font-size:9px">
                      <div class="tog-t" :class="cfg.miwAutoSlots?'on':''" @click="if(!cfgLocked){cfg.miwAutoSlots=!cfg.miwAutoSlots;persist()}"><div class="tog-k"></div></div>
                      <span class="tog-l">Auto</span>
                    </label>
                  </div>

                  <!-- Auto slots controls -->
                  <div x-show="cfg.miwAutoSlots" style="margin-bottom:8px;padding:6px 8px;background:rgba(96,210,255,.04);border:1px solid rgba(96,210,255,.12);border-radius:3px">
                    <div class="lbl">Minimum Criteria per Slot <b x-text="cfg.miwAutoSlotSize"></b> <span style="font-weight:normal;color:var(--text-lo)" x-text="'— '+(()=>{const n=cfg.miwAutoSlotSize;const excl=new Set(cfg.miwAutoSlotExclude||[]);const secTotal=['fund','va','ioa','ocs','ocx'].filter(c=>!excl.has(c)).length;return 'qualifies on any '+n+' of '+secTotal+' secondary criteria — every one true gets scored, not capped at this minimum.'})()"></span></div>
                    <input type="range" min="1" max="5" step="1" x-model.number="cfg.miwAutoSlotSize" @change="persist()">
                    <div class="lbl" style="margin-top:5px;margin-bottom:3px">Exclude from Auto</div>
                    <div class="crit-pick" style="display:flex;flex-wrap:wrap;gap:3px">
                      <template x-for="c in ['fund','va','ioa','ocs','ocx']" :key="c">
                        <button @click.prevent="if(!cfgLocked){ const ex=(cfg.miwAutoSlotExclude||[]).slice(); const i=ex.indexOf(c); if(i>=0) ex.splice(i,1); else ex.push(c); cfg.miwAutoSlotExclude=ex; persist(); }"
                                :style="'font-family:var(--mono);font-size:8px;padding:1px 5px;border-radius:2px;cursor:pointer;border:1px solid;' + ((cfg.miwAutoSlotExclude||[]).includes(c) ? 'border-color:rgba(255,80,80,.5);background:rgba(255,80,80,.15);color:rgba(255,80,80,.8)' : 'border-color:rgba(255,255,255,.12);background:rgba(255,255,255,.04);color:var(--text-lo)')"
                                x-text="c.replace('fund','Fund').replace('va','V/A').replace('ioa','IO/A').replace('ocs','OCS').replace('ocx','OCX')">
                        </button>
                      </template>
                    </div>
                    <div class="miw-hint" style="margin-top:4px">Excluded criteria are dropped from auto combos and scoring; every criterion scores per tier, not per slot.</div>
                    <label class="tog" style="margin-top:8px">
                      <div class="tog-t" :class="cfg.miwForceGeneralCriteria?'on':''" @click.prevent="if(!cfgLocked){cfg.miwForceGeneralCriteria=!cfg.miwForceGeneralCriteria;persist()}"><div class="tog-k"></div></div>
                      <div>
                        <div class="tog-l">Force-Evaluate General Criteria</div>
                        <div class="miw-hint">Forces a fresh per-symbol check of Fund/OCS/OCX before each entry, appending newly-true ones — a few extra requests per open. V/A and IO/A read directly from ticker/population data.</div>
                      </div>
                    </label>
                  </div>

                  <!-- Manual slot builder — hidden when Auto is on -->
                  <div x-show="!cfg.miwAutoSlots">
                    <div class="miw-hint" style="margin-bottom:6px;color:var(--text-lo)">(click slot to edit · click criteria to toggle)</div>

                    <!-- Criteria picker — visible when a slot is selected -->
                    <div x-show="cfg.miwActiveSlot !== null && cfg.miwActiveSlot !== undefined && cfg.miwActiveSlot < (cfg.miwSlots||[]).length"
                         x-data="{ ratioFocus: null, ratioDir: '>', ratioTier: 5, gateFocus: null, gateDir: '>', gateTier: 1, ocFocus: null, ocDir: '>', ocVal: 100 }"
                         @click.outside="ratioFocus = null; gateFocus = null; ocFocus = null"
                         style="display:flex;gap:3px;flex-wrap:wrap;align-items:center;margin-bottom:7px;padding:6px 7px;background:rgba(255,255,255,.04);border-radius:3px;border:1px solid rgba(255,255,255,.08)">
                      <span style="font-size:9px;color:var(--text-lo);margin-right:2px">Slot <span x-text="(cfg.miwActiveSlot)+1"></span>:</span>
                      <template x-for="c in ['fund','va','ioa','ocs','ocx']" :key="c">
                        <button class="miw-opt"
                          @click.prevent="if(!cfgLocked){
                            if(c==='ioa'){
                              ratioFocus=(ratioFocus===c?null:c); gateFocus=null; ocFocus=null;
                              if(ratioFocus){ const ex=(cfg.miwSlots?.[cfg.miwActiveSlot]||[]).find(x=>x.startsWith(c)); if(ex){ const m=ex.match(/^ioa([<>])(-?\d+)$/); if(m){ratioDir=m[1];ratioTier=parseInt(m[2],10)} } }
                            } else if(c==='fund'||c==='va'){
                              gateFocus=(gateFocus===c?null:c); ratioFocus=null; ocFocus=null;
                              if(gateFocus){ const ex=(cfg.miwSlots?.[cfg.miwActiveSlot]||[]).find(x=>x.startsWith(c)); if(ex){ const m=ex.match(/^(?:fund|va)([<>])(-?\d+)$/); if(m){gateDir=m[1];gateTier=parseInt(m[2],10)} } else { gateDir='>'; gateTier=c==='fund'?1:c==='va'?10:25; } }
                            } else if(c==='ocs'||c==='ocx'){
                              ocFocus=(ocFocus===c?null:c); ratioFocus=null; gateFocus=null;

        _miwLastSampledAt: 0,
        _miwHaltLogged: false,

        async init() {
          await _origInit.call(this);
          this._miwLoaded = true;
          if (!this.miwCollapsedSlotRanks) this.miwCollapsedSlotRanks = {};
          if (!this.miwCollapsedCritStats) this.miwCollapsedCritStats = {};
          if (!Array.isArray(this.cfg.miwSlots)) this.cfg.miwSlots = DEFAULT_SLOTS.map(s => [...s]);
          if (!Array.isArray(this.cfg.miwSlotBlockCriteria)) this.cfg.miwSlotBlockCriteria      = [...DEFAULT_BLOCKABLE_CRITS];
          // V/M, IO/T, IO/M retired in favor of population-relative V/A and IO/A (see
          // _pfVolIoWindowAvg) — no mcap fetch machinery to init anymore. One-time cleanup of
          // saved config: strip the retired keys from exclude/blockable lists (defensive — they
          // were never in DEFAULT_BLOCKABLE_CRITS to begin with) and seed va/ioa into the
          // blockable list by default, same as they'd get on a fresh install.
          if (Array.isArray(this.cfg.miwAutoSlotExclude) && this.cfg.miwAutoSlotExclude.some(c => c==='vm'||c==='iot'||c==='iom')) {
            this.cfg.miwAutoSlotExclude = this.cfg.miwAutoSlotExclude.filter(c => c!=='vm'&&c!=='iot'&&c!=='iom');
          }
          if (!Array.isArray(this.cfg.megacapExclude)) this.cfg.megacapExclude = [...DEFAULT_MEGACAP_EXCLUDE];
          // Single source of truth for all other MIW scalar defaults — see MIW_DEFAULT_CFG above.
          // Call sites read this.cfg.<key> directly with no inline fallback, since this
          // guarantees every key below is present after init runs once.
          for (const [k, v] of Object.entries(MIW_DEFAULT_CFG)) {
            if (this.cfg[k] === undefined) this.cfg[k] = Array.isArray(v) ? [...v] : v;
          }
          if (Number(this.cfg.miwOcxStep) === 0.1) this.cfg.miwOcxStep = 1;
          // Legacy migration: convert old +fund/-fund to tiered form
          {
            const _fundStep   = this.cfg.miwFundStep;
            const _frThr      = this.cfg.miwFrThreshold;
            const _frTier     = Math.max(1, Math.ceil(_frThr / _fundStep));
            const _migCrit = c => {
              if (c === '+fund')   return `fund>${_frTier}`;
              if (c === '-fund')   return `fund<-${_frTier}`;
              return c;
            };
            const _legacyNames = new Set(['+fund','-fund']);
            if (Array.isArray(this.cfg.miwSlots) && this.cfg.miwSlots.some(s => s.some(c => _legacyNames.has(c)))) {
              this.cfg.miwSlots = this.cfg.miwSlots.map(s => s.map(_migCrit));
              this.persist();
            }
            if (Array.isArray(this.cfg.miwAutoSlotExclude) && this.cfg.miwAutoSlotExclude.some(c => _legacyNames.has(c))) {
              this.cfg.miwAutoSlotExclude = this.cfg.miwAutoSlotExclude.map(_migCrit);
              this.persist();
            }
          }
          // V/M, IO/T, IO/M, and every retired liquidation/PEC/VSG/regime tag no longer match
          // anything (see the migration above and /versioning v1.80.0) — a manual slot still
          // referencing one will never qualify. Not auto-rewritten (va/ioa isn't a 1:1 semantic
          // substitution), just flagged once so it doesn't silently go dead.
          {
            const _retiredIn = s => s.filter(c => /^(vm|iot|iom|pec|vsg|regime|liqturnover|liqquiet|sliq|bliq|msliq|mbliq|0liq|past1)/.test(c));
            const _retiredSlots = (this.cfg.miwSlots || []).map((s,i) => ({ i, crits: _retiredIn(s) })).filter(x => x.crits.length);
            if (_retiredSlots.length) this.log(`[MIW] ⚠️ ${_retiredSlots.length} manual slot(s) reference retired criteria and will never match — slot(s) ${_retiredSlots.map(x=>x.i+1).join(', ')}. Replace with fund / V/A / IO/A / OCS / OCX.`, 'warn');
          }
          this.registerRoleBadge?.(item => {
            if (!item || !item._miw) return null;
            const crits  = item._miwCriteria || [];
            const emoji  = crits.map(c => critEmoji(c)).join('');
            const title  = crits.length ? 'Multi: ' + crits.map(c => critLabel(c)).join(' + ') : 'Multi-Indicator';
            return `<span style="font-family:var(--mono);font-size:9px;padding:2px 5px;border-radius:2px;letter-spacing:1px;border:1px solid rgba(96,210,255,.45);color:var(--ice);background:rgba(96,210,255,.10)" title="${title}">${emoji || 'Multi'}</span>`;
          });
          this.registerCloseReason?.('substitution', 'Sub');
          // Dead Switch baseline — counts idle time from whichever is more recent: the plugin's
          // own load (so a fresh session with zero entries yet doesn't immediately read as
          // "dead") or the last entry it actually made. See _miwDeadSwitchCheck.
          this._miwLoadedAt = Date.now();
          this.log(`[MIW] Multi-Indicator (Winter) v${VERSION} loaded — ${this.cfg.miwEnabled ? 'enabled' : 'disabled'} | ${(this.cfg.miwSlots||[]).length} slots | ${this.cfg.miwPicks}/cycle`, 'info');
          this.renderTradeFeed?.();
        },

        // Cascade/Sacrifice run on the position watcher (5s, tied to bot.running) rather than
        // the scan clock (5-60min) — collective uPnL can cross either threshold and back well
        // within a single scan interval, and a private setInterval here would keep firing even
        // while the bot is stopped since it isn't tied to the start/stop lifecycle like this is.
        async pseudoWatchPositions() {
          await _origWatch.call(this);
          await this._miwCheckCascade();
          await this._miwCheckSacrifice();
        },

        _miwToggle(i, c) {
          const slots = (this.cfg.miwSlots || []).map(s => [...s]);
          if (!slots[i]) return;
          const idx = slots[i].indexOf(c);
          if (idx === -1) slots[i].push(c); else slots[i].splice(idx, 1);
          this.cfg.miwSlots = slots;
          this.persist?.();
        },

        _miwDelSlot(i) {
          const slots = (this.cfg.miwSlots || []).map(s => [...s]);
          slots.splice(i, 1);
          this.cfg.miwSlots = slots;
          if (this.cfg.miwActiveSlot !== null) {
            if (slots.length === 0) this.cfg.miwActiveSlot = null;
            else if (this.cfg.miwActiveSlot >= slots.length) this.cfg.miwActiveSlot = slots.length - 1;
          }
          this.persist?.();
        },

        _miwAddSlot() {
          const slots = (this.cfg.miwSlots || []).map(s => [...s]);
          slots.push([]);
          this.cfg.miwSlots = slots;
          this.cfg.miwActiveSlot = slots.length - 1;
          this.persist?.();
        },

        // Collective uPnL and the resulting bail set both cover every open position, not just
        // MIW's own — a winning position from another strategy should be able to push the
        // portfolio into Cascade the same as a winning MIW position would, and a Sacrifice
        // shouldn't leave an untouched, unrelated position dominating the aggregate afterward.
        async _miwCheckCascade() {
          if (!this.cfg.miwCascadeEnabled) return;
          const allPositions = this.positions || [];
          if (!allPositions.length) return;
          const totalUPnL   = allPositions.reduce((s, p) => s + (p.upnl || 0), 0);
          const baseMargin  = (this.cfg.minNotional || 6) / (this.cfg.leverage || 6);
          const threshold   = baseMargin * ((this.cfg.miwCascadePct) / 100);
          if (totalUPnL >= threshold) {
            this.log(`[MIW] 🌊 Cascade triggered — collective uPnL +${totalUPnL.toFixed(4)} ≥ ${threshold.toFixed(4)} USDT (${this.cfg.miwCascadePct}% of ${baseMargin.toFixed(4)} base margin) — bailing ${allPositions.length} position(s)`, 'info');
            if (this.cfg.permafrostCrossEnabled && typeof this._pfCrossWrite === 'function') {
              this._pfCrossWrite('cascade', null, { count: allPositions.length, pnl: totalUPnL });
            }
            this._logBatchBegin?.();
            try {
              for (const pos of allPositions) {
                await this.pseudoClosePosition(pos, 'cascade');
              }
            } finally { this._logBatchEnd?.('[MIW] 🌊 Cascade roll-up'); }
          }
        },

        async _miwCheckSacrifice() {
          if (!this.cfg.miwSacrificeEnabled) return;
          const allPositions = this.positions || [];
          if (!allPositions.length) return;
          const totalUPnL   = allPositions.reduce((s, p) => s + (p.upnl || 0), 0);
          const baseMargin  = (this.cfg.minNotional || 6) / (this.cfg.leverage || 6);
          const threshold   = -(baseMargin * ((this.cfg.miwSacrificePct) / 100));
          if (totalUPnL <= threshold) {
            this.log(`[MIW] 🩸 Sacrifice triggered — collective uPnL ${totalUPnL.toFixed(4)} ≤ ${threshold.toFixed(4)} USDT (${this.cfg.miwSacrificePct}% of ${baseMargin.toFixed(4)} base margin) — bailing ${allPositions.length} position(s)`, 'info');
            if (this.cfg.permafrostCrossEnabled && typeof this._pfCrossWrite === 'function') {
              this._pfCrossWrite('sacrifice', null, { count: allPositions.length, pnl: totalUPnL });
            }
            this._logBatchBegin?.();
            try {
              for (const pos of allPositions) {
                await this.pseudoClosePosition(pos, 'sacrifice');
              }
            } finally { this._logBatchEnd?.('[MIW] 🩸 Sacrifice roll-up'); }
          }
        },

        // Dry-run of pseudoOpenShort's tick-precision/notional/TP/SL/leverage checks, without
        // its logging/ban-list side effects beyond resolveEffectiveLeverage's own (that one bans
        // for real on maxLeverage ≤ 5×, same as a live open would — leaving that in place is
        // correct, since a candidate that would get permanently banned anyway should never cost
        // us the position we were about to swap out of). Substitution calls this before closing
        // anything. Kept local to MIW rather than touching PseudoWinter's open path — mirrors the
        // SHORT-side validation block there and must be kept in sync with it if that logic ever
        // changes.
        async _miwCandidateOpenFeasible(sym, price) {
          if (!sym || !(price > 0)) return false;
          const instr = await this.getInstrInfo(sym);
          if (!instr) return false;
          if (instr.minPrice > 0 && price < instr.minPrice) return false;
          const levResult = this.resolveEffectiveLeverage(sym, instr);
          if (!levResult) return false;
          const lev  = levResult.lev;
          const binary  = this.cfg.binaryModeEnabled;
          const effTp0  = binary ? this.cfg.binaryTpPct : this.cfg.entryTpRoi;
          const notional = this.cfg.minNotional;
          const qty = this.snapQty(notional / price, instr);
          if (qty <= 0) return false;
          const actualNotional = qty * price;
          if (instr.minOrderAmt > 0 && actualNotional < instr.minOrderAmt) return false;
          const tpPrice = this.snapPrice(price * (1 - (effTp0 / 100) / lev), instr); // SHORT: TP below entry
          if (!tpPrice || tpPrice <= 0) return false;
          if (binary) return true;
          const effAddNotional = this.cfg.addNotional;
          const effTpRoi       = [effTp0, this._tpRoi(1)];
          let runNotional = price * qty;
          let runSize     = qty;
          const addPcts = this._activeAddPcts();
          for (let i = 0; i < this._dcaStageCount(); i++) {
            const addPrice = this.snapPrice(price * (1 + addPcts[i] / 100), instr); // SHORT: add above entry
            if (!addPrice || addPrice <= 0) return false;
            const addQty = this.snapQty(effAddNotional / addPrice, instr);
            runNotional += addPrice * addQty;
            runSize     += addQty;
            const expectedAvg = runSize > 0 ? runNotional / runSize : addPrice;
            const addTp = this.snapPrice(expectedAvg * (1 - (effTpRoi[i+1] / 100) / lev), instr);
            if (!addTp || addTp <= 0) return false;
          }
          return true;
        },

        // Only meaningful when Co-Qualifying Penalty is on (Permafrost) — otherwise compositeScore
        // is always 0 for both sides and the margin check never clears, so this is a safe no-op.
        // No path restriction on what it can close — cross-strategy, any held position, same as
        // Liquid-Diver's version. The swap is still score-gated, not automatic.
        async _miwTrySubstitute(entryPool) {
          if (!this.cfg.miwSubstitutionEnabled || !entryPool?.length) return false;
          const now           = Date.now();
          const minAgeMs       = (this.cfg.miwSubstitutionMinAgeMins) * 60000;
          const baseMargin     = (this.cfg.minNotional || 6) / (this.cfg.leverage || 6);
          const marginThreshold = baseMargin * ((this.cfg.miwSubstitutionMarginPct) / 100);

          const eligible = (this.positions || []).filter(p => {
            if ((now - (p.openedAt || 0)) < minAgeMs) return false;
            return true;
          });
          if (!eligible.length) return false;

          const scoreOf = p => p._miw ? (p._miwCompositeScore ?? 0) : (p._miwCompositeScore ?? -Infinity);
          eligible.sort((a, b) => scoreOf(a) - scoreOf(b));
          const worst      = eligible[0];
          const worstScore = scoreOf(worst);
          const best       = entryPool[0];
          if (!best || (best.compositeScore - worstScore) < marginThreshold) return false;
          const _candPrice = parseFloat(best.t.lastPrice || 0);
          if (!(await this._miwCandidateOpenFeasible(best.t.symbol, _candPrice))) {
            this.log(`[MIW] 🔁 Substitution skipped — ${best.t.symbol} would fail open-time checks (tick precision/notional/leverage) at ${_candPrice} — leaving ${worst.symbol} in place`, 'warn');
            return false;
          }

          this.log(`[MIW] 🔁 Substitution — closing ${worst.symbol} (score ${worstScore === -Infinity ? 'n/a' : worstScore.toFixed(4)}) for ${best.t.symbol} (score ${best.compositeScore.toFixed(4)}), Δ${(best.compositeScore - worstScore).toFixed(4)} ≥ ${marginThreshold.toFixed(4)} margin`, 'info');
          await this.pseudoClosePosition(worst, 'substitution');
          return await this._miwOpen(best.t, best.criteria, best.slotIdx, best.compositeScore);
        },

        async runScan() {
          const tsBefore = this._lastAllTickersAt || 0;
          await _origScan.call(this);
          // If _origScan returned without fetching fresh tickers (halt/lock/cache-hit after a
          // halt cleared), _lastAllTickersAt is unchanged. Reset _miwLastActedAt so that the
          // next genuine fresh fetch is not silently skipped by the dedup check.
          if ((this._lastAllTickersAt || 0) === tsBefore && tsBefore === (this._miwLastActedAt || 0)) {
            this._miwLastActedAt = 0;
          }
          await this._miwRunScan();
          this._miwDeadSwitchCheck();
        },

        // Dead Switch: triggers the SAME drawdown halt Drawdown Throttle uses
        // (_drawdownHaltUntil) once MIW has gone miwDeadSwitchHours without a single new entry
        // — a pure idle-time trip, unrelated to PnL. Baseline is the most recent of plugin load
        // (_miwLoadedAt, so a fresh session with no entries yet isn't immediately "dead"), the
        // last actual entry (_miwLastEntryTs, set at both pseudoOpenShort call sites), and the
        // last time Dead Switch itself fired (_miwLastDeadSwitchAt) — that last one is what stops
        // back-to-back trips: if the halt window is shorter than the idle window, no entries will
        // have happened by the time the halt clears, so without it the very next scan would see
        // the same stale baseline and re-trigger immediately. With it, a full idle duration has to
        // elapse from the trigger itself before Dead Switch can fire again, halt or no halt. A
        // no-op while already halted (manual or drawdown) — this only ever starts a halt, never
        // stacks or extends one already running. Also bails any open book the same way Drawdown
        // Throttle's own trigger does — gated by the same cfg.drawdownBailEnabled toggle, and
        // deferred via setTimeout so the host's bailAll() (which awaits pseudoClosePosition per
        // position) runs after this scan tick finishes rather than nested inside it.
        _miwDeadSwitchCheck() {
          if (!this.cfg.miwDeadSwitchEnabled) return;
          if (this._manualHalt || (this._drawdownHaltUntil || 0) > Date.now()) return;
          const idleMs = (this.cfg.miwDeadSwitchHours ?? 1) * 3600000;
          const baseline = Math.max(this._miwLoadedAt || 0, this._miwLastEntryTs || 0, this._miwLastDeadSwitchAt || 0);
          if (!baseline || (Date.now() - baseline) < idleMs) return;
          this._miwLastDeadSwitchAt = Date.now();
          const haltHours = this.cfg.drawdownHaltHours ?? 6;
          this._drawdownHaltUntil = Date.now() + haltHours * 3600000;
          this._drawdownWindow = [];
          if (typeof this.persist === 'function') this.persist();
          this.log(`[MIW] 💀 Dead Switch: no new entries in ${this.cfg.miwDeadSwitchHours ?? 1}h — triggering drawdown halt (${haltHours}h).`, 'warn');
          if (this.cfg.drawdownBailEnabled !== false && this.positions.length > 0 && typeof this.bailAll === 'function') {
            this.log(`[MIW] 💀 Dead Switch bail — closing ${this.positions.length} open position(s)`, 'warn');
            setTimeout(() => { this.bailAll().catch(() => {}); }, 0);
          }
        },


        _extraStatusPills() {
          return [];
        },

        async _miwRunScan() {
          if (!this.cfg.miwEnabled) return;
          const _miwHalted = !!(this._isDrawdownHalted?.() || this._isGainsLocked?.());
          if (_miwHalted) {
            if (!this._miwHaltLogged) { this.log(`[MIW] 💡 Halted — ${this._isGainsLocked?.() ? 'gains lock' : 'drawdown halt'} active; hist scoring continues`, 'info'); this._miwHaltLogged = true; }
          } else {
            this._miwHaltLogged = false;
          }

          const allTickers = this._lastAllTickers || [];
          if (!allTickers.length) return;

          const freshAt = this._lastAllTickersAt || 0;
          if (!freshAt || freshAt === this._miwLastActedAt) return;

          // Rebuild block state from Extremity Scorer immediately before any slot or pool decisions
          this._pfExtremityBuild?.();

          // Entry slots — Auto mode has no generated slot list any more (see _miwAutoQualify);
          // Manual mode keeps its exact combo list as before.
          const autoMode = !!this.cfg.miwAutoSlots;
          const slots = autoMode ? [] : this._miwEffectiveSlots();
          const hasActiveEntry = autoMode ? this._miwAutoActive() : slots.length > 0;

          if (!hasActiveEntry) {
            this._miwLastActedAt = freshAt;
            this.log('[MIW] 💡 No active slots — skipping', 'info');
            return;
          }

          const activeSyms  = new Set((this.positions || []).map(p => p.symbol));

          // Criteria pool to scan for data-fetch needs — Auto's non-excluded secondary list, or
          // every criterion actually used across manual slots.
          const _critPool = autoMode
            ? SECONDARY_CRITS.filter(c => !(new Set(this.cfg.miwAutoSlotExclude || [])).has(c))
            : [...new Set(slots.flat())];
          const needsVolIo = _critPool.some(c => /^(va|ioa)/.test(c));
          const needsOc    = _critPool.some(c => /^(ocs|ocx)/.test(c));
          const scanSkip = {
            excluded: { nonUsdt: 0, btc: 0, lowPrice: 0, active: 0, banned: 0, reentry: 0, },
            unmatched: { criteria: 0 },
            blocked: 0
          };
          const basePool = [];
          for (const t of allTickers) {
            if (!t?.symbol?.endsWith('USDT')) { scanSkip.excluded.nonUsdt++; continue; }
            if ((this.cfg.megacapExclude || DEFAULT_MEGACAP_EXCLUDE).includes(t.symbol)) { scanSkip.excluded.btc++; continue; }
            if (parseFloat(t.lastPrice || 0) < 0.001) { scanSkip.excluded.lowPrice++; continue; }
            if (activeSyms.has(t.symbol)) { scanSkip.excluded.active++; continue; }
            if (this._isSymbolBanned?.(t.symbol)) { scanSkip.excluded.banned++; continue; }
            if (this._miwIsReentryBlocked(t.symbol)) { scanSkip.excluded.reentry++; continue; }
            basePool.push(t);
          };

          // Order Count Surveillance: fetch a fresh sample for this cycle's candidate pool, only
          // when a slot actually uses ocs/ocx. Stateless — no accumulation across cycles, no
          // cross-ticker mean required for OCX. A ticker missing from this sample simply fails
          // the ocs/ocx criterion in checkCrit — it no longer blocks the rest of the pool.
          if ((needsOc || needsVolIo) && this.cfg.pfOcEnabled) {
            const ocCap = 25;
            let fillSyms = basePool.map(t => t.symbol);
            for (let i = fillSyms.length - 1; i > 0; i--) {
              const j = Math.floor(Math.random() * (i + 1));
              [fillSyms[i], fillSyms[j]] = [fillSyms[j], fillSyms[i]];
            }
            const ocSyms = fillSyms.slice(0, ocCap);
            // Vol/OI is already on the ticker payload — no fetch needed, just carried into the
            // same tethered cycle history alongside OC (see _ocFetchBatch, Option A design).
            const volIoMap = {};
            for (const t of allTickers) volIoMap[t.symbol] = { vol: parseFloat(t.turnover24h || 0) || null, oi: parseFloat(t.openInterestValue || 0) || null };
            await this._ocFetchBatch(ocSyms, volIoMap, needsOc);
          }
          const _pfOcResults = this.pfOcResults || {};

          const checkCrit = (c, fr, t) => this._miwCheckCrit(c, fr, t, _pfOcResults);

          this._miwLastActedAt = freshAt;

          // Build pool before capacity check so historical matches are logged regardless
          const _coQualEnabled = this.cfg.pfCoQualPenaltyEnabled;
          const _cqRanks = _coQualEnabled ? (this.miwCollapsedSlotRanks || {}) : null;
          const _cqScaledRank = (rawC, annotC) => this._miwScaledRank(rawC, annotC, _cqRanks);
          // Wraps the raw annotation so every criterion reading produced during this scan's
          // pool building feeds the Extremity Scorer's sample pool (see _pfDialSample) —
          // regardless of whether this ticker ends up matching a slot or opening a trade.
          // Cutoffs need to be provable from the wide stream of what's actually out there,
          // not just from the narrow trickle of closed trades.
          const _miwAnnotateCrit = (c, t) => {
            const tag = _miwAnnotateCritRaw(c, t);
            this._pfDialSample?.(tag);
            return tag;
          };
          const _miwAnnotateCritRaw = (c, t) => {
            if (/^va/.test(c)) { const val = parseFloat(t.turnover24h || 0); const w = this._pfVolIoWindowAvg?.('vol'); const step = this.cfg.miwVaStep; const tier = (val && w) ? Math.floor(((val - w) / w * 100) / step) : 0; return `va${tier>=0?'+':''}${tier}`; }
            if (/^ioa/.test(c)) { const val = parseFloat(t.openInterestValue || 0); const w = this._pfVolIoWindowAvg?.('oi'); const step = this.cfg.miwIoaStep; const tier = (val && w) ? Math.floor(((val - w) / w * 100) / step) : 0; return `ioa${tier>=0?'+':''}${tier}`; }
            if (/^fund/.test(c)) { const step = this.cfg.miwFundStep; const fr_ = parseFloat(t.fundingRate||0)*100; const tier = Math.floor(fr_ / step); return `fund${tier>=0?'+':''}${tier}`; }
            if (/^ocs/.test(c)) { const _a = this._pfOcAccumSkew?.(t.symbol); const _live = this.pfOcResults?.[t.symbol]?.live ? this.pfOcResults[t.symbol] : null; const bc=(_a?.bc||0)+(_live?.bc||0), sc=(_a?.sc||0)+(_live?.sc||0); const tot = bc+sc; const buyPct = tot ? bc/tot*100 : 50; const step = this.cfg.miwOcsStep; const tier = Math.floor((buyPct-50)/step); return `ocs${tier>=0?'+':''}${tier}`; }
            if (/^ocx/.test(c)) { const _r = this.pfOcResults?.[t.symbol]; const _w = this._pfOcWindowAvgMs?.(); const step = this.cfg.miwOcxStep; const tier = (_r?.avgMs!=null && _w) ? Math.floor(((_w - _r.avgMs) / _w * 100) / step) : 0; return `ocx${tier>=0?'+':''}${tier}`; }
            return c;
          };
          // Richness score for sort priority when Co-Qual is off — sum of each matched
          // criterion's own collapsed rank, so capacity still favors historically-stronger
          // tickers even without Co-Qual scoring turned on.
          const _richness = e => e.criteria.reduce((s, c) => s + this._miwCritScore(c), 0);
          const pool = basePool
            .map(t => {
              const fr       = parseFloat(t.fundingRate || 0) * 100;
              const critOk = c => checkCrit(c, fr, t);

              let matched = null; // { criteria, annotCrits, slotIdx }
              if (autoMode) {
                const m = this._miwAutoQualify(critOk, c => _miwAnnotateCrit(c, t));
                if (m) matched = { ...m, slotIdx: -1 };
              } else {
                const slotIdx = slots.findIndex(s => s.length > 0 && s.every(c => checkCrit(c, fr, t)));
                if (slotIdx !== -1) {
                  const _slotCrits = slots[slotIdx];
                  matched = {
                    criteria: _slotCrits,
                    annotCrits: _slotCrits.map(c => _miwAnnotateCrit(c, t)),
                    slotIdx,
                  };
                }
              }
              if (!matched) {
                scanSkip.unmatched.criteria++;
                return null;
              }

              const _annotCrits = matched.annotCrits;
              const _annotKey = [..._annotCrits].sort().join(',');
              let compositeScore = 0;
              if (_coQualEnabled && _cqRanks) {
                if (autoMode) {
                  // Every true criterion is already captured in matched.criteria — sum
                  // directly (positives and negatives together) rather than hunting for
                  // "other matching combos" to penalize. There's only one canonical match
                  // set per ticker now, so a separate penalty pass would be redundant.
                  compositeScore = matched.criteria.reduce((s, c, i) => s + _cqScaledRank(c, _annotCrits[i]), 0);
                } else {
                  const bestScore = matched.criteria.reduce((s, c, i) => s + _cqScaledRank(c, _annotCrits[i]), 0);
                  let penalty = 0;
                  for (let i = 0; i < slots.length; i++) {
                    if (i === matched.slotIdx) continue;
                    if (!slots[i].length || !slots[i].every(c => checkCrit(c, fr, t))) continue;
                    const otherAnnot = slots[i].map(c => _miwAnnotateCrit(c, t));
                    const sc = slots[i].reduce((s, c, j) => s + _cqScaledRank(c, otherAnnot[j]), 0);
                    if (sc < 0) penalty += sc;
                  }
                  compositeScore = bestScore + penalty;
                }
              }
              return { t, criteria: matched.criteria, slotIdx: matched.slotIdx, annotKey: _annotKey, annotCrits: _annotCrits, compositeScore };
            })
            .filter(Boolean)
            .sort((a, b) => _coQualEnabled
              ? (b.compositeScore - a.compositeScore || Math.abs(parseFloat(b.t.fundingRate || 0)) - Math.abs(parseFloat(a.t.fundingRate || 0)))
              : (_richness(b) - _richness(a) || Math.abs(parseFloat(b.t.fundingRate || 0)) - Math.abs(parseFloat(a.t.fundingRate || 0))));
          // Slot Blocking runs after hist logging so a blocked type keeps generating the
          // data it needs to recover (see _miwIsEntryBlocked) — it only stops the real open.
          const entryPool = pool.filter(e => {
            const blocked = this._miwIsEntryBlocked(e.annotCrits);
            if (blocked) scanSkip.blocked++;
            return !blocked;
          });
          const _miwTopReasons = obj => Object.entries(obj).filter(([, n]) => n > 0).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([k, n]) => `${k}:${n}`).join(' ');
          const _miwExcludedNote = _miwTopReasons(scanSkip.excluded) || 'none';
          const _miwUnmatchedNote = _miwTopReasons(scanSkip.unmatched) || 'none';
          this.log(`[MIW] 💡 Scan skip summary — universe:${allTickers.length} pool:${basePool.length} qualified:${pool.length} entry:${entryPool.length} | excluded ${_miwExcludedNote} | unmatched ${_miwUnmatchedNote} | slot-blocked:${scanSkip.blocked}`, 'info');

          if (_miwHalted) return;

          // Reserve-counted headroom: guards against a substitution path (_miwTrySubstitute) or
          // this same open loop being mid-open — past its own headroom check, still awaiting a
          // price refetch — at the exact same moment another scan runs. this.positions.length
          // alone doesn't reflect that in-flight slot, so both paths would see room and open,
          // overshooting maxPos. _miwPending is incremented the instant an open is committed to
          // and released once that attempt resolves (see _miwOpen), so it always reflects slots
          // that are spoken for even before pseudoOpenShort actually pushes them onto this.positions.
          const _miwInFlight = this._miwPending || 0;

          if ((this.positions?.length ?? 0) + _miwInFlight >= this.cfg.maxPos) {
            await this._miwTrySubstitute(entryPool);
            return;
          }

          let headroom = this.cfg.maxPos - (this.positions?.length ?? 0) - _miwInFlight;
          if (this.cfg.miwShareCapEnabled) {
            const capSlots = Math.max(1, Math.floor(this.cfg.maxPos * ((this.cfg.miwShareCapPct) / 100)));
            const miwCount = (this.positions || []).filter(p => p._miw).length;
            headroom = Math.min(headroom, capSlots - miwCount);
            if (headroom < 1) {
              if (!(await this._miwTrySubstitute(entryPool))) {
                this.log('[MIW] 💡 Share cap reached — no slots available', 'info');
              }
              return;
            }
          }
          const picks = Math.min(Math.max(1, Math.round(this.cfg.miwPicks)), headroom);

          if (!entryPool.length) {

            const fundStep = this.cfg.miwFundStep;
            const posFund  = basePool.filter(t => parseFloat(t.fundingRate||0)*100 >= fundStep).length;
            const negFund  = basePool.filter(t => parseFloat(t.fundingRate||0)*100 <= -fundStep).length;
            const volIoNote = needsVolIo ? ` va/ioa-window:${this._pfVolIoWindowAvg?.('vol')!=null?'ready':'warming'}` : '';
            this.log(`[MIW] 💡 No tickers matched — pool:${basePool.length} fund+:${posFund} fund-:${negFund}${volIoNote}`, 'info');
            return;
          }

          const maxPos     = this.cfg.maxPos;
          const slotOpened = new Array(slots.length).fill(0);

          let opened = 0, attempted = 0, blocked = 0;
          this._logBatchBegin?.();
          try {
            for (const { t, criteria, slotIdx, compositeScore } of entryPool) {
              if (opened >= picks) break;
              if ((this.positions?.length ?? 0) + (this._miwPending || 0) >= maxPos) break;
              attempted++;
              if (await this._miwOpen(t, criteria, slotIdx, compositeScore)) { opened++; slotOpened[slotIdx]++; }
              else { blocked++; }
            }
          } finally { this._logBatchEnd?.('[MIW] 💡 Entry roll-up'); }
          const _miwBlockNote = blocked ? `, ${blocked} blocked (qty/lev)` : '';
          const openedParts   = slotOpened.map((n, i) => n > 0 ? (n > 1 ? `s${i+1}(${n})` : `s${i+1}`) : null).filter(Boolean);
          const openedNote    = openedParts.length ? ` via ${openedParts.join(' ')}` : '';
          this.log(`[MIW] 💡 ${entryPool.length} qualified — ${opened} opened${_miwBlockNote}${openedNote}`, 'info');
        },

        // All _miw* tagging fields are computed up front and passed straight into
        // pseudoOpenShort's candidate object (copied onto the new position by its own
        // underscore-copy loop, before the position is pushed to this.positions) rather than
        // mutated onto the returned position afterward. Resuming this function after the
        // `await pseudoOpenShort(...)` is a microtask boundary — Alpine's reactive render queued
        // from the push could otherwise run before a later `pos._miwCriteria = ...` assignment,
        // rendering the position badge as "Multi" (empty criteria) for one frame even though the
        // underlying data was always correct by the time anything read it again (e.g. on close).
        async _miwOpen(t, criteria, slotIdx, compositeScore) {
          const sym   = t.symbol;
          let price = parseFloat(t.lastPrice || 0);
          if (!price) return false;
          // Force-Evaluate General Criteria: only ever runs for tickers actually about to open
          // (bounded by picks/maxPos), not the whole scan pool — see _miwTopUpGeneralCriteria.
          // Auto mode only; a manual slot's criteria list is a fixed, user-built AND-gate and
          // shouldn't silently grow.
          if (this.cfg.miwForceGeneralCriteria && this.cfg.miwAutoSlots) {
            criteria = await this._miwTopUpGeneralCriteria(t, criteria);
          }
          const annotCrits = (criteria || []).map(c => {
            if (/^va/.test(c)) { const val = parseFloat(t.turnover24h || 0); const w = this._pfVolIoWindowAvg?.('vol'); const step = this.cfg.miwVaStep; const tier = (val && w) ? Math.floor(((val - w) / w * 100) / step) : 0; return `va${tier>=0?'+':''}${tier}`; }
            if (/^ioa/.test(c)) { const val = parseFloat(t.openInterestValue || 0); const w = this._pfVolIoWindowAvg?.('oi'); const step = this.cfg.miwIoaStep; const tier = (val && w) ? Math.floor(((val - w) / w * 100) / step) : 0; return `ioa${tier>=0?'+':''}${tier}`; }
            if (/^fund/.test(c)) { const step = this.cfg.miwFundStep; const fr_ = parseFloat(t.fundingRate||0)*100; const tier = Math.floor(fr_/step); return `fund${tier>=0?'+':''}${tier}`; }
            if (/^ocs/.test(c)) { const _a = this._pfOcAccumSkew?.(t.symbol); const _live = this.pfOcResults?.[t.symbol]?.live ? this.pfOcResults[t.symbol] : null; const bc=(_a?.bc||0)+(_live?.bc||0), sc=(_a?.sc||0)+(_live?.sc||0); const tot = bc+sc; const buyPct = tot ? bc/tot*100 : 50; const step = this.cfg.miwOcsStep; const tier = Math.floor((buyPct-50)/step); return `ocs${tier>=0?'+':''}${tier}`; }
            if (/^ocx/.test(c)) { const _r = this.pfOcResults?.[t.symbol]; const _w = this._pfOcWindowAvgMs?.(); const step = this.cfg.miwOcxStep; const tier = (_r?.avgMs!=null && _w) ? Math.floor(((_w - _r.avgMs) / _w * 100) / step) : 0; return `ocx${tier>=0?'+':''}${tier}`; }
            return c;
          });
          // Feeds the Extremity Scorer's sample pool (see _pfDialSample) — this is the
          // actual-open annotation path, not just scan-time pool building, so a position's
          // own qualifying readings count toward the cutoff too.
          for (const tag of annotCrits) this._pfDialSample?.(tag);
          if (this.cfg.miwForceGeneralCriteria && this.cfg.miwAutoSlots && this.cfg.pfCoQualPenaltyEnabled) {
            compositeScore = criteria.reduce((s, c, i) => s + this._miwScaledRank(c, annotCrits[i]), 0);
          }
          // Top-up (above) can append criteria — most commonly fund — that were never part of
          // the match _miwIsEntryBlocked already cleared for entryPool. Re-check against the
          // now-possibly-expanded annotCrits before actually opening; entryPool's own check stays
          // as the first, cheaper pass, this is the one that has to hold once the real criteria
          // list is final.
          if (this.cfg.miwForceGeneralCriteria && this.cfg.miwAutoSlots
              && this._miwIsEntryBlocked(annotCrits)) {
            return false;
          }
          // Reserve this slot for the duration of the price refetch + open call below.
          this._miwPending = (this._miwPending || 0) + 1;
          try {
            try {
              const r  = await fetch(`${this.base}/v5/market/tickers?category=linear&symbol=${sym}`);
              const d  = await r.json();
              const lp = parseFloat(d?.result?.list?.[0]?.lastPrice);
              if (lp > 0) price = lp;
            } catch(e) {}
            const change = parseFloat(t.price24hPcnt || 0) * 100;
            const fr     = parseFloat(t.fundingRate  || 0) * 100;
            const pos = await this.pseudoOpenShort({
              symbol: sym, price, change, fundingRate: fr,
              _miw: true,
              _miwPathA: true, // runScan's entryPool only ever contains 0-liq (closed-cycle) matches
              _miwSlotIdx: slotIdx ?? 0,
              _miwCompositeScore: compositeScore ?? 0,
              _miwCriteria: annotCrits,
            });
            if (pos) {
              this._miwLastEntryTs = Date.now(); // Dead Switch — see _miwDeadSwitchCheck
              if (typeof this.persist === 'function') this.persist();
              return true;
            }
            return false;
          } finally {
            this._miwPending = Math.max(0, (this._miwPending || 0) - 1);
          }
        },

        // Force-Evaluate General Criteria (see the toggle in the Auto slots panel). Scan-time's
        // pool build only ever sees whatever OC data that cycle's capped bulk prefetch covered —
        // fund and one side each of OCS/OCX/IO/A are expected to resolve for virtually any ticker
        // once real data exists, so a match can end up missing several of them purely because the
        // fetch hadn't happened yet, not because they're actually false. Re-checks exactly those,
        // forced and uncapped, for this one symbol — cheap here since _miwOpen only ever runs for
        // tickers actually about to open, never the whole pool — and returns criteria with any
        // newly-true ones appended. Never drops anything the original match already found, even
        // if it would now read differently.
        async _miwTopUpGeneralCriteria(t, criteria) {
          const sym = t.symbol;
          const have = new Set(criteria);
          const GENERAL = ['fund', 'ocs', 'ocx', 'ioa'];
          const exclude = new Set(this.cfg.miwAutoSlotExclude || []);
          const missing = GENERAL.filter(c => !have.has(c) && !exclude.has(c));
          if (!missing.length) return criteria;

          const jobs = [];
          // `true` here is the one loophole in the follower's no-own-fetch rule: right before
          // opening, if the leader's shared cache has nothing for this symbol, fetch it directly
          // rather than opening with OC criteria silently unscored. Every other caller of this
          // leaves the flag off, so scan-time pool building still fetches nothing on a follower.
          if (missing.some(c => /^(ocs|ocx)/.test(c)) && this.cfg.pfOcEnabled && !this.pfOcResults?.[sym]) {
            jobs.push((async () => {
              const r = await this._ocFetchSingle?.(sym, true);
              if (r) { if (!this.pfOcResults) this.pfOcResults = {}; this.pfOcResults[sym] = r; }
            })());
          }
          // ioa needs no top-up fetch — the per-ticker value (t.openInterestValue) is already on
          // the ticker payload, and the population average it's compared against comes from the
          // tethered _pfOcCycleHistory window, not a per-symbol lookup.
          if (jobs.length) await Promise.all(jobs);

          const fr           = parseFloat(t.fundingRate || 0) * 100;
          const ocResultsMap = this.pfOcResults?.[sym] ? { [sym]: this.pfOcResults[sym] } : {};

          const appended = missing.filter(c => this._miwCheckCrit(c, fr, t, ocResultsMap));
          return appended.length ? [...criteria, ...appended] : criteria;
        },

        _miwCheckCrit(c, fr, t, ocResults) {
          if (/^fund/.test(c)) {
            const step = this.cfg.miwFundStep;
            const tier = Math.floor(fr / step);
            const m = c.match(/^fund([<>])(-?\d+)$/);
            // Bare 'fund' (Auto mode's un-thresholded form) used to return true unconditionally
            // here, regardless of tier — unlike va/ioa's bare form, which at least requires
            // windowAvg data to exist first. That made 'fund' a permanent automatic pass in Auto
            // mode: every ticker always "matched" it, so _miwTopUpGeneralCriteria/
            // _miwAutoQualify tagged virtually every entry with fund+/fund- whether or not
            // funding had anything to do with the match, diluting the scorecard with noise and
            // making a freshly-topped-up fund tag the most common way a blocked sign slipped
            // through (see _miwOpen's post-top-up recheck). Requiring tier !== 0 was meant to fix
            // that, but real Bybit funding rates mostly sit well under a single miwFundStep
            // (default 0.25), so tier landed on 0 for almost every ticker and fund essentially
            // never registered — confirmed live at -0.0086% funding producing no fund tag at all.
            // Bare 'fund' now registers on any nonzero rate directly (fr, not tier) — the tier is
            // still computed above and still drives the fund>N/fund<N thresholded forms and the
            // annotated tag's magnitude; only the bare-form gate changed.
            if (!m) return fr !== 0;
            return m[1] === '>' ? tier >= parseInt(m[2],10) : tier <= parseInt(m[2],10);
          }
          if (/^va/.test(c)) {
            const val = parseFloat(t.turnover24h || 0);
            const windowAvg = this._pfVolIoWindowAvg?.('vol');
            if (!val || !windowAvg) return false;
            const step = this.cfg.miwVaStep;
            const tier = Math.floor(((val - windowAvg) / windowAvg * 100) / step);
            const m = c.match(/^va([<>])(-?\d+)$/);
            if (!m) return true;
            return m[1] === '>' ? tier >= parseInt(m[2],10) : tier <= parseInt(m[2],10);
          }
          if (/^ioa/.test(c)) {
            const val = parseFloat(t.openInterestValue || 0);
            const windowAvg = this._pfVolIoWindowAvg?.('oi');
            if (!val || !windowAvg) return false;
            const step = this.cfg.miwIoaStep;
            const tier = Math.floor(((val - windowAvg) / windowAvg * 100) / step);
            const m = c.match(/^ioa([<>])(-?\d+)$/);
            if (!m) return true;
            return m[1] === '>' ? tier >= parseInt(m[2], 10) : tier <= parseInt(m[2], 10);
          }
          if (/^(ocs|ocx)/.test(c)) {
            const _ocR = (ocResults || this.pfOcResults || {})[t.symbol];
            const m = c.match(/^(ocs|ocx)([<>])(-?\d+)$/);
            const kind = c.startsWith('ocs') ? 'ocs' : 'ocx';
            if (kind === 'ocs') {
              // Accumulated across the retained sample window (_pfOcAccumSkew), not just this
              // ticker's most recent batch — a fresh, not-yet-historied live sample (tagged
              // `live` by _ocFetchSingle) folds in on top without double-counting once a later
              // batch fetch pushes the same cycle into history for real.
              const _a = this._pfOcAccumSkew?.(t.symbol);
              const _live = _ocR?.live ? _ocR : null;
              const bc = (_a?.bc||0) + (_live?.bc||0), sc = (_a?.sc||0) + (_live?.sc||0);
              const tot = bc + sc; if (!tot) return false;
              if (!m) return true;
              const [, , dir, valStr] = m; const val = parseInt(valStr, 10);
              const buyPct = bc / tot * 100;
              const step = this.cfg.miwOcsStep;
              const tier = Math.floor(buyPct / step);
              return dir === '>' ? tier >= val : tier <= val;
            }
            if (kind === 'ocx') {
              if (!_ocR) return false;
              if (!m) return true;
              const [, , dir, valStr] = m; const val = parseInt(valStr, 10);
              // Percentage deviation from the full-window population average (see
              // _pfOcWindowAvgMs), not an absolute seconds threshold — positive tier means
              // faster than the window average, negative means slower. No minimum-ticker
              // floor on the window: a thin or cold-start window is intentionally left
              // unstable rather than gated off.
              if (_ocR.avgMs == null) return false;
              const windowAvg = this._pfOcWindowAvgMs();
              if (windowAvg == null || windowAvg <= 0) return false;
              const pctDev = (windowAvg - _ocR.avgMs) / windowAvg * 100;
              const step = this.cfg.miwOcxStep;
              const tier = Math.floor(pctDev / step);
              return dir === '>' ? tier >= val : tier <= val;
            }
          }
          return false;
        },

        // Co-Qualifying Penalty scoring for one criterion. Base rank is looked up from the
        // ticker's actual annotated tier (e.g. "fund+3" -> "fund+"), matching exactly how the
        // Extremity Scorer collapses closes into dial-pole buckets (see _pfExtremityBuild in
        // Permafrost-Winter). This drives ticker ordering (compositeScore sort in the entry
        // pool) as well as the co-qualification penalty itself. ranksOverride (used by the
        // substitute-check path) still wins when explicitly supplied.
        _miwScaledRank(rawC, annotC, ranksOverride) {
          const ranks = ranksOverride ?? (this.cfg.pfCoQualPenaltyEnabled ? (this.miwCollapsedSlotRanks || {}) : null);
          if (!ranks) return 0;
          const annotKey = (annotC || '').replace(/\d+$/, '');
          const base = ranks[annotKey] ?? 0;
          if (!base) return 0;
          // Depth = distance past the slot's own gate threshold, in the qualifying direction —
          // NOT raw tier magnitude. For a ">" gate, a higher tier is further past threshold and
          // deeper. For a "<" gate, a LOWER tier is further past threshold and deeper — using
          // raw magnitude there would score a barely-qualifying ticker as "deeper" than one
          // that qualifies strongly, which is backwards.
          const annotM = (annotC || '').match(/([+-]?\d+)$/);
          const tierVal = annotM ? parseInt(annotM[1], 10) : 0;
          const gateM = rawC.match(/([<>])(-?\d+)$/);
          let depth = Math.abs(tierVal);
          if (gateM) {
            const threshold = parseInt(gateM[2], 10);
            depth = gateM[1] === '>' ? Math.max(0, tierVal - threshold) : Math.max(0, threshold - tierVal);
          }
          const depthPct = (this.cfg.pfCoQualDepthPct ?? 10) / 100;
          return base * (1 + depth * depthPct);
        },

        // Shared collapsed-rank lookup (own + partner + historical PnL, see miwCollapsedSlotRanks)
        // for a single criterion key. Every criterion's rank accumulates under a sign-suffixed key
        // (e.g. 'fund-', 'va+'), so both variants are summed.
        _miwCritScore(c) {
          const ranks = this.miwCollapsedSlotRanks || {};
          return (ranks[c] ?? 0) + (ranks[c + '+'] ?? 0) + (ranks[c + '-'] ?? 0);
        },

        // Slot Blocking: true once a criterion's collapsed score is a loss beyond the configured
        // % of base margin. Auto-clears the moment the score recovers — no manual reset needed.
        _miwIsCritBlocked(c) {
          if (!this.cfg.miwSlotBlockEnabled) return false;
          const baseMargin = (this.cfg.minNotional || 6) / (this.cfg.leverage || 6);
          const threshold  = baseMargin * ((this.cfg.miwSlotBlockPct) / 100);
          return this._miwCritScore(c) <= -threshold;
        },

        // The Extremity Scorer's whole-ticker lukewarm veto (see _pfExtremityVeto in
        // Permafrost-Winter — "explicitly avoid any ticker exhibiting lukewarm values", checked
        // here regardless of miwSlotBlockTags since it's a qualification veto, not a
        // per-criterion block). miwSlotBlockTags additionally checks every criterion selected
        // in cfg.miwSlotBlockCriteria (see the Blockable Criteria picker) — configurable rather
        // than a hardcoded set, so any secondary criterion (including fund) can be opted in.
        // va/ioa/ocs/ocx are blockable by default; fund is not — see DEFAULT_BLOCKABLE_CRITS.
        _miwIsEntryBlocked(annotCrits) {
          if (this._pfExtremityVeto?.(annotCrits)) return true;
          if (!this.cfg.miwSlotBlockTags) return false;
          const blockable = (this.cfg.miwSlotBlockCriteria || []).filter(Boolean);
          if (!blockable.length) return false;
          const rx = new RegExp('^(' + blockable.join('|') + ')[+-]');
          return (annotCrits || []).some(c => rx.test(c) ? this._miwIsCritBlocked(c.replace(/\d+$/, '')) : false);
        },

        // Reads the same shared graylist the host writes on every close (any strategy, keyed by
        // symbol) — a symbol stays blocked for one bulk-ticker cooldown window after its position
        // closes. 'both' (default) blocks regardless of win/loss; 'losers' lets a symbol that
        // just closed in profit re-trigger immediately. Ported from Liquid-Diver.
        _miwIsReentryBlocked(sym) {
          const g = this._tickerGraylist?.[sym];
          if (!g || !(g.ts > 0)) return false;
          const ttl = this.cfg.bulkTickerCooldownHours * 3600000;
          if (Date.now() - g.ts >= ttl) return false;
          if ((this.cfg.miwReentryBlockMode) === 'losers') return g.isWin === false;
          return true;
        },
        // Auto's minimum-gate qualifier. "Criteria per Slot" (miwAutoSlotSize) is a FLOOR, not a
        // fixed count: this evaluates EVERY non-excluded secondary criterion against the ticker
        // and qualifies once at least that many are true. Every true criterion is kept — a
        // ticker exhibiting 5 genuine criteria is scored on all 5, not sliced down to however
        // many the slider happens to say. checkFn(c) -> bool and annotFn(c) -> annotated string
        // are supplied by the caller.
        _miwAutoQualify(checkFn, annotFn) {
          const exclude = new Set(this.cfg.miwAutoSlotExclude || []);
          const need = Math.max(0, this.cfg.miwAutoSlotSize);
          const trueCrits = [];
          for (const c of SECONDARY_CRITS) {
            if (exclude.has(c)) continue;
            if (checkFn(c)) trueCrits.push(c);
          }
          if (trueCrits.length < need) return null;
          return { criteria: trueCrits, annotCrits: trueCrits.map(c => annotFn(c)) };
        },

        // True if Auto mode could produce a qualifying match at all right now — i.e. enough
        // non-excluded secondary criteria exist to ever reach the minimum. Auto's equivalent of
        // "any active slots" now that there's no generated slot list to check.
        _miwAutoActive() {
          if (!this.cfg.miwAutoSlots) return false;
          const exclude = new Set(this.cfg.miwAutoSlotExclude || []);
          const secAvail = SECONDARY_CRITS.filter(c => !exclude.has(c)).length;
          return secAvail >= this.cfg.miwAutoSlotSize;
        },

        // Manual mode only now — Auto no longer generates a slot list (see _miwAutoQualify).
        _miwEffectiveSlots() {
          const filtered = (this.cfg.miwSlots || []).filter(s => s.length > 0);
          if (!Object.keys(this.miwCollapsedSlotRanks || {}).length) return filtered;
          return filtered.slice().sort((a, b) => {
            const sa = a.reduce((s, c) => s + this._miwCritScore(c), 0);
            const sb = b.reduce((s, c) => s + this._miwCritScore(c), 0);
            return sb - sa;
          });
        },

      });
    },
  };
})();
</script>
